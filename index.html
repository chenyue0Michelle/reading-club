<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>读书打卡 · 经营十二条</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      font-size: 14px;
    }
    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.5em; color: #f5c518; margin-bottom: 6px; letter-spacing: 2px; }
    .formula { font-size: 0.82em; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .dates { font-size: 0.78em; color: #666; }
    .progress-section { padding: 0 20px 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 6px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f5c518, #ff6b6b); border-radius: 3px; transition: width 0.5s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; font-size: 0.82em; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.4); color: #f5c518; }
    .today-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 14px; position: relative;
    }
    .day-badge {
      display: inline-block; background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 0.75em; font-weight: bold; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .today-card h2 { font-size: 0.95em; color: #f5c518; margin-bottom: 14px; line-height: 1.6; }
    .content-body { font-size: 14px; line-height: 1.95; color: #ccc; }
    .content-body p { margin-bottom: 10px; }
    .content-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .content-body strong { color: #fff; }
    .content-body ul, .content-body ol { padding-left: 20px; margin: 8px 0; }
    .content-body li { margin-bottom: 6px; }
    .checkin-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    .status-box {
      text-align: center; padding: 12px; border-radius: 10px;
      font-size: 0.88em; margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-header { text-align: center; font-size: 0.72em; color: #666; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 0.78em; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future { background: rgba(255,255,255,0.04); color: #555; cursor: default; }
    .cal-day.available { background: rgba(255,255,255,0.08); color: #aaa; }
    .cal-day.available:hover { background: rgba(245,197,24,0.15); border-color: #f5c518; color: #f5c518; }
    .cal-day.today-marker { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; font-weight: bold; }
    .cal-day.checked { background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1)); border-color: #2ecc71; color: #2ecc71; }
    .cal-day.checked::after { content: '✓'; position: absolute; bottom: 1px; right: 3px; font-size: 0.65em; color: #2ecc71; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(245,197,24,0.3); }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 24px; max-width: 680px; width: 100%; margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body { font-size: 0.88em; line-height: 1.9; color: #ccc; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px; width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #aaa; border-radius: 8px; cursor: pointer; font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: #fff; font-size: 1em; padding: 12px 16px; text-align: center;
      margin-bottom: 16px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }
    .user-greeting {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name { color: #666; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    .user-greeting .change-name:hover { color: #aaa; }
    .font-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: flex-end; }
    .font-btn {
      padding: 4px 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING - FIXED ===== */
    .record-area {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #ccc; font-size: 1.4em;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; user-select: none;
    }
    .record-btn.recording {
      border-color: #ff4757; background: rgba(255,71,87,0.2); color: #ff4757;
      animation: pulse 1s infinite;
    }
    .record-btn.done {
      border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; min-width: 0; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-status.done-status { color: #2ecc71; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }
    .record-action-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8em; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .record-action-btn:hover { background: rgba(255,255,255,0.15); }
    .record-action-btn.stop-btn { border-color: #ff4757; background: rgba(255,71,87,0.1); color: #ff4757; }
    .record-action-btn.stop-btn:hover { background: rgba(255,71,87,0.2); }
    .record-action-btn.redo-btn { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; font-size: 0.75em; }

    .record-upload-status { font-size: 0.78em; color: #f5c518; margin-top: 4px; display: none; }
    .record-upload-status.show { display: block; }
    .record-playback { margin-top: 8px; display: none; }
    .record-playback.show { display: block; }
    .record-playback audio { width: 100%; height: 36px; border-radius: 8px; }
    .record-playback-label { font-size: 0.76em; color: #888; margin-bottom: 4px; }
    .loading-spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3); border-top-color: #f5c518;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reflection-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .reflection-label { font-size: 0.82em; color: #888; margin-bottom: 8px; }
    .reflection-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: #ddd; font-size: 0.88em; line-height: 1.7;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus { outline: none; border-color: rgba(245,197,24,0.4); background: rgba(255,255,255,0.08); }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved { font-size: 0.78em; color: #2ecc71; margin-top: 6px; display: none; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    .audio-wall-header { text-align: center; margin-bottom: 16px; }
    .audio-wall-header h3 { color: #f5c518; font-size: 1em; margin-bottom: 4px; }
    .audio-wall-header p { font-size: 0.78em; color: #888; }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s;
    }
    .audio-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,197,24,0.3); }
    .audio-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row { display: flex; align-items: center; gap: 12px; }
    .audio-player-row audio { flex: 1; height: 36px; border-radius: 8px; }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15); color: #f5c518;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75em; white-space: nowrap;
    }
  </style>
  <script>
    window.addEventListener('load', function(){
      var s = document.createElement('script');
      s.src = 'cloudbase.js';
      s.onerror = function(){ console.warn('[SDK] uniCloud SDK 加载失败，录音墙不可用'); };
      document.head.appendChild(s);
    });
  </script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《经营十二条》全书共读计划<br>稻盛和夫 · 每天10分钟</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">
  <h1>📖 经营十二条</h1>
  <div class="formula">提高心性，拓展经营 —— 遵循经营十二条</div>
  <div class="dates" id="headerDates">稻盛和夫 · 全书共读计划（21天）</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 21</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">21</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall',this)">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 - 修复版 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="handleRecordClick()" title="点击开始/停止录音">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始朗读录音</div>
        <div class="record-duration" id="recordDuration"></div>
        <div class="record-upload-status" id="uploadStatus"></div>
      </div>
      <button class="record-action-btn" id="recordActionBtn" style="display:none" onclick="handleActionBtnClick()">重新录制</button>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- AUDIO WALL TAB -->
  <div class="tab-content" id="tab-audiowall">
    <div class="audio-wall-header">
      <h3>🎙️ 读书录音墙</h3>
      <p>聆听大家的读书声，共同成长进步</p>
    </div>
    <div class="audio-wall-list" id="audioWallList">
      <p style="color:#666;text-align:center;padding:30px;">⏳ 加载中...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== BOOK CONTENT =====
// 《六项精进》全书共读
// 共19天，每天约4000-5500字（10-15分钟阅读）
// 日期范围：2026-08-30 至 2026-09-17
const bookContent = {
    '2026-10-08': {
      chapter: '第1天：总序 贯彻做人的正确准则 · 译者序 正确思考的力量',
      content: '<p><strong>总序 贯彻做人的正确准则</strong></p><p>从1959年至今长达半个世纪内，我创建并经营了京瓷和KDD两家企业集团。很幸运，这两家企业都取得了长足的发展。现在这两家企业的业绩简单相加，销售额达4.7万亿日元，利润逼近6000亿日元。</p><p>另外，2010年，我接受日本政府的邀请，就任代表国家形象的、破产重建的日本航空公司的会长。在重建过程中，我着力于经营干部的意识转变，以及企业体质的改善。这样的努力，第一年就取得了可喜的成果，业绩大幅超过了重建计划中预定的数字，现在日本航空的利润率已超过两位数，正在变成一个高收益的企业。</p><p>取得这些成就，原因不过是在企业经营中，我彻底地贯彻了经营的原理原则而已。那么，所谓原理原则是什么呢？那就是“贯彻做人的正确准则”。我在必须做出经营判断的时候，总要扪心自问：“作为人，何谓正确？”答案是坚持把作为人应该做的正确的事情以正确的方式贯彻到底。</p><p>或许有人认为，这样的经营要诀未免太简单、太朴实了。但是，正因为贯彻了这条原理原则，我自己以及继承我工作的京瓷和KDDI的经营干部，才没有发生过经营判断上的失误，才使企业顺利地成长发展到今天。</p><p>我的经营哲学还有另外一个侧面。那就是：立足于宇宙的本源以及人心的本源来展开经营活动。</p><p>我认为，在这个宇宙间，流淌着促使万物进化发展的“气”或“意志”。同时我认为，人的本性中充满“爱、真诚与和谐”。所谓“爱”，就是祈愿他人好；所谓“真诚”，就是为社会、为世人尽力；所谓“和谐”，就是不仅让自己，也要让别人生活幸福。</p><p>如果我们每一个人都以充满“爱、真诚与和谐”之心去生活、去工作，那就意味着与引导万物向好的方向发展的宇宙的潮流相一致。这样，我们的经营就会顺畅，人生就会美满。这就是我在将近80年漫长的人生中坚信不疑的“真理”。</p><p>本书就遵循这样的思想，由近年来我在中国的演讲为主编辑而成。面对中国的经营者和企业干部、政府官员和大学学者以至一般市民，我都从原理原则讲起，涉及人的本性和宇宙的本源，阐述经营和人生的要诀，获得了人们广泛的赞同。</p><p>近期，我的演讲将汇编为图书在中国出版发行，作为著者，我衷心希望，从人和宇宙的本源谈起的我的哲学，能够跨越国界、民族和语言的障碍，到达广大中国男女老少的手中，为让他们的人生更美好、经营更出色做出我的一份贡献。同时，如果这对促进一衣带水的中日两国的友好关系也能助上一臂之力，那就是我的无限之喜了。</p><p>在本书出版之际，请允许我对为出版本书做出不同寻常努力的稻盛和夫（北京）管理顾问有限公司的曹岫云董事长，以及很爽快地为本书提供文稿的中国和日本的有关企业家表示深切的谢意。</p><p>谨以此文作为本书的序言。</p><p>稻盛和夫</p><p>日本京瓷名誉会长</p><p><strong>译者序 正确思考的力量</strong></p><p>思考就是哲学“心之官则思”，每个人每天都在思考。但思考有自觉和不自觉之分，有深刻和肤浅之分，有正确和错误之分。</p><p>思考是种子，行动是花朵，成败是果实。从这个意义上讲，思考是一切的起源。</p><p>参天大树原本只是沉睡的种子，翱翔天空的苍鹰早先只在卵中待机，世界上的一切伟业最初不过是伟人心中的一个梦想而已。</p><p>中国历史上没有“哲学”这个词语，据说这个词语从日本引进，而日语中的“哲学”又是从希腊语“philosophia”翻译而来的。被称为“近代哲学之父”的笛卡儿说：“我思，故我在。”据说西方有人对“哲学”的定义是：“对人的本质进行思考这种行为本身就是哲学。”提倡自由深入地思考，其结果之一就是促进了科学技术的迅猛发展。</p><p>经营哲学在稻盛和夫先生之前，日本很少甚或没有人将“经营”和“哲学”两个词语联系在一起。而在中国，改革开放后虽然提倡“科学管理”，但是在很长时间内却没有“经营哲学”这样的说法。近年来，“经营哲学”这个词语在日本、中国开始流行，逐渐成为常用语。</p><p>但是早在50多年前，稻盛先生就开始思考经营和哲学的关系。</p><p>1956年，稻盛在一家名叫“松风工业”的陶瓷企业打工，时年24岁。</p><p>当时日本三井物产有一位“大人物”吉田先生，他主要负责松风工业绝缘瓷瓶的出口业务。吉田常来公司调查。他发现该公司其他部门的员工意志消沉，唯有稻盛领导的“特磁科”士气高昂，干劲十足，吉田觉得不可思议。</p><p>凑巧的是，这位吉田先生和稻盛在鹿儿岛大学时的恩师内野教授是东京大学的同窗好友。内野在吉田面前曾经多次夸奖稻盛。吉田在调查结束时提出要约见稻盛和夫。</p><p>稻盛觉得吉田虽然是老前辈又是大人物，但很可亲，值得信任，同他交流是难得的机会，于是就将平时头脑里经常思考的松风工业经营上的事情，直率地、毫无保留地告诉吉田。切身经历加上深思熟虑，稻盛讲得既生动又具说服力，无论话题、措辞、内容还是其中包含的思想，都与稻盛当时的年龄、身份很不相称。吉田先生一声不响，神情专注，静听稻盛述说，最后大声说道：“才二十几岁，年轻人，真不简单，你已经有了自己的philosophy。”</p><p>稻盛当时不知道“philosophy”是什么意思，回到宿舍一翻辞典，“philosophy”就是“哲学”。那一瞬间，稻盛心中不由自主地一阵颤动。</p><p>吉田不愧为有见识的大人物，他一句话就点中了稻盛的本质特性，可以说，这句话催生了后来的“京瓷philosophy"，即“稻盛哲学”。</p><p>“经营为什么需要哲学？”这就是几十年来稻盛经典演讲的主题之一。如果说泰勒首倡了“科学管理”，那么稻盛和夫首倡了“经营哲学"。我想这种说法符合事实。</p><p>正确思考</p><p>稻盛先生白手起家，40年间创建了京瓷和KDD两家世界500强企业。2010年2月1日，78岁高龄的稻盛先生在退休13年后再度出山，应日本政府邀请，出任破产重建的日航的会长。在万众瞩目之下，仅仅10个月，日航就大幅扭亏为盈，创造了日航历史上空前的1580亿日元的利润。然而，这一切不过是稻盛哲学的产物。或者说，这种不可思议的成功仅仅源于稻盛先生的正确思考。</p><p>稻盛先生是理工科出身，作为一名科学技术工作者，在新型精密陶瓷领域，他年轻时就有许多划时代的发明创造。稻盛先生具备科学家合理思考、追究事物真相的科学精神。</p><p>作为企业家，稻盛先生气势如虹又心细如发。他不但善于把握宏观形势，做出类似参与通信事业这样超乎常人的战略决策，而且在企业管理的所有细节上，通过贯彻“钱、物、票一一对应”“双重确认”“玻璃般透明的经营”等方法，彻底把握经营的实态，把握事情的本质。稻盛先生创建了精致、缜密、实用的经营模式。如果你读过《稻盛和夫的实学：经营与会计》和《阿米巴经营》这两本书，你一定会对稻盛先生彻底的实事求是态度肃然起敬，并且能理解稻盛的企业50年持续盈利的秘诀。有如此作为的企业家，我闻所未闻。</p><p>为了进一步净化自己的心灵，在精神世界追求更高的境界，65岁后，稻盛先生曾一度投入佛门，认真修行。稻盛先生并不停留在对佛教单纯的信仰上，结合自己丰富的人生实践，他还对佛教的精髓“六波罗蜜”，即布施、持戒、精进、忍辱、禅定、智慧，做出了积极的、深入浅出的解释，令人倍感亲切。</p><p>科学家、企业家、宗教家之外，我认为稻盛先生最本质的特色在于他是一位“彻底追求正确思考的哲学家”。人类有史以来涌现了不少卓越的思想家、哲学家。而哲学家同时又身兼科学家、企业家、宗教家，一身而数任的人，稻盛先生或许是独一无二、天下无双的。更可贵的是：稻盛先生不仅养成了深思熟虑的习惯，而且他是一位彻底地追求正确思考的哲学家。</p><p>人究竟应该怎样生活？企业家应该如何正确地经营企业？正确的人生观对个人、组织、人类具有何等重大的意义？提出如此重大命题的人意外地少。而不停地提出、思考、回答这些问题的，就是稻盛先生的哲学和实践。</p><p>稻盛哲学的原点是“把‘作为人，何谓正确’当作判断一切事物的基准”。</p><p>稻盛哲学的核心用一个方程式表达就是：</p><p>人生·工作结果=思维方式X热情X能力</p><p>-100-1000-1000-100</p><p>如此鲜明简洁地提出如此重要的哲学观点，并一辈子切实实践的企业家，前无古人。</p><p>正确思考的威力稻盛先生的青少年时代充满挫折甚至苦难。大学毕业后好不容易入职的企业却连续十年赤字，连工资也不能如期发放。为此，稻盛先生曾经怨天尤人。但当身为技术员的稻盛先生正确思考一名优秀的技术员应该如何开展研究工作，并全身心投入时，奇迹出现了。</p><p>稻盛被石蜡绊着、差点摔倒的一瞬间，他得到了精密陶瓷中划时代的新材料镁橄榄石合成方法的发明灵感；当他看到高温炉中板状陶瓷零件像鱿鱼般翘曲时，突然产生用手从上面压住的冲动，从而获得灵感，干脆利落地解决了重大的技术难题......</p><p>稻盛27岁创业，因为不知如何正确经营企业而苦恼时，他又获得了灵感，确立了在经营中判断一切事物的基准——作为人，何谓正确。</p><p>京瓷初创时的28名员工中，20多名是高中学历，稻盛自己也只是一所地方大学的毕业生。为了回答“能力平凡的人怎样才能取得不平凡的成功”，稻盛想出了上述精彩的人生方程式。</p><p>在处理11名高中学历员工集体辞职的事件时，稻盛毅然放弃了“技术问世”的创业目的，“在追求全体员工物质和精神两方面幸福的同时，为人类社会的进步发展做出贡献”这一伟大的公司理念诞生了。</p><p>京瓷发展壮大，稻盛先生忙得不可开交时，他又从孙悟空拔毛吹出分身的故事中获得了灵感，创造了“阿米巴经营”模式，实现了真正的全员经营，奠定了京瓷、KDDI稳步快速发展的基础。</p><p>孙正义创建的软银集团也是世界500强企业。孙正义曾是稻盛创办的“盛和塾”的塾生。最近在拜访稻盛先生时，孙正义说：“如果没有稻盛先生‘敬天爱人’的思想和阿米巴经营方式，就没有软银的今天。”</p><p>“盛和塾”现在已有15000名企业家塾生，他们学习并实践稻盛先生正确的经营思想，大部分企业都有了不同程度的进步，其中近百家企业已经成功上市。</p><p>神的智慧稻盛先生于2010年2月1日正式出任日航会长，而在此前的1月19日，日航公开宣告破产。这一天，稻盛按预定日程乘坐日航的航班飞往夏威夷参加盛和塾的开塾仪式。在大阪关西机场，稻盛对前来送行的日航关西支店长山口先生说：“我是为了日航的员工才到日航来的。”又说：“日航的干部要一天24小时思考日航的经营问题。”这两句话深深地刻入了山口先生的心中。</p><p>稻盛先生强调：“在高尚的思想里蕴藏着巨大的力量。”为什么呢？</p><p>思考是人的显意识在发挥作用。但如果你怀抱善念，针对某一难题，朝思暮想、左思右想、前思后想、苦思冥想，一天24小时思考，反复地、深入地、强烈地思考，这样，你的愿望会渗入潜意识。在不经意间，潜意识会突然给你灵感，让你心中一亮，立即抓住事物的核心，问题顷刻间迎刃而解。</p><p>稻盛先生把这种灵感称为“神的智慧”。回顾发明镁橄榄石合成方法的过程，稻盛先生说：“当时在我头脑里闪过的这种灵感，并非出于我个人的实力，在我偶然绊上石蜡的一刹那，是‘神’给了我启示，让我产生灵感的闪光。”</p><p>稻盛先生说：“如果不是这样，就无法说明为什么能力平平，缺乏知识、技术、经验、设备的我，竟然能够做出世界一流的发明创造。”</p><p>宇宙之心</p><p>根据宇宙物理学最权威的“大爆炸”理论，广袤浩瀚的宇宙原本只是一小撮高温高压的基本粒子的团块。经“大爆炸”产生的质子、中子、介子组成原子核，再与电子结合构成原子，原子结合形成分子，分子组成高分子，从中产生DNA，从而孕育出生命体，生命从低级进化到高级，最终出现人类。宇宙为什么在演化过程中一刻也不肯停顿呢？这绝非偶然。不妨设想存在着“宇宙的意志”或“宇宙之心”，它促使森罗万象一切事物向好的方向发展。稻盛先生强调，如果我们的想法与“宇宙的意志”同调，我们的事业一定会繁荣昌盛，反之，即使一时成功，最终必然衰落乃至灭亡。个人如此，企业如此，国家如此，整个人类亦如此。</p><p>稻盛和夫经营哲学是稻盛先生十几年甚至几十年思考和实践的产物，是正确做人做事的最高智慧，其中妙语如珠，格言箴言接二连三。其中每一篇都足以引发我们深思，如果它溶入我们的血液，我们的事业一定繁盛不衰，我们的人生一定幸福美满。</p>'
    },
    '2026-10-09': {
      chapter: '第2天：第一章 经营十二条概述 · 务必相信经营十二条的力量 · 第一条 明确事业的目的和意义',
      content: '<p><strong>第一章 经营十二条概述</strong></p><p><strong>务必相信经营十二条的力量</strong></p><p>我是刚才承蒙介绍的稻盛。</p><p>青岛市人民政府和稻盛和夫（北京）管理顾问有限公司共同举办“2010稻盛和夫经营哲学青岛国际论坛”，有这么多中国企业家和日本盛和塾的塾生参加，对此，请允许我表示深切的感谢。</p><p>在演讲之前，请允许我向为筹备这次论坛做出辛勤努力的青岛市人民政府以及有关各位，表示由衷的谢意。</p><p>在各位的大力支持协助下举办的这场盛会，现在只剩下我的讲话了。</p><p>两天来，听了几位中日企业家发表的经营体验和演讲，听了专题讨论会诸位的发言，我非常感动。同时，这么多中日企业家在百忙之中抽空汇聚一堂，为把企业经营得更好，认真地互相学习。这样的场景也让我深为感叹。</p><p>在座各位企业家如此认真地经营企业、直面人生，我应该给大家讲些什么话才好呢？我感到很烦恼。</p><p>在2010年6月召开的“经营哲学北京报告会”上，我以“经营为什么需要哲学”为题，谈到“企业经营，哲学不可或缺，为此经营者必须提升自己的心性”。</p><p>人们一般并不认为哲学以及人生观有多么重要。但正是哲学决定了经营和事业的成败。想把自己的公司搞好，让员工幸福，先决条件是经营者必须提高自己的思想水平和精神境界。这是我上次演讲的主旨。</p><p>通过上次的演讲，我想大家已经理解了哲学在企业经营中的重要性。今天我想论述指导企业成长发展的具体的经营要诀。我把迄今为止在京瓷和KDDI的经营实践中切身体悟的经营原理原则归纳为12项，称之为“经营十二条”。今天，我一项一项来解释这个“经营十二条”。</p><p>一提起经营，人们常常望而生畏，许多复杂因素交叉叠加，似乎难上加难。或许理工科出身的缘故吧，我想只要着眼于事物的本质，经营企业可以说相当单纯。</p><p>比如，世上有各种各样的现象，如能将驱动这些复杂现象的原理总结出来，那么一切其实都是单纯明快的。复杂现象复杂理解，事情反而难办。</p><p>在研究开发领域，必须具备将复杂现象简单化的能力。企业经营也一样，只要领会了其中的要诀，也就是原理原则，经营企业就绝不是什么难事。</p><p>我所思考和归纳的经营要诀，在福布斯500强企业京瓷和KDDI的经营中，由我亲身实践并证明了它的有效性。现在，在日本代表性企业日本航空公司的破产重建中，为了让企业干部理解并实践这些原则，我每天都不厌其烦地向他们解释。</p><p>另外，我认为无论在中国还是在日本，企业经营的要诀、原理原则都一样，不会因为国家、地区的不同而不同。下面要讲的“经营十二条”，立足于“作为人，何谓正确”这一最基本的观点之上，所以我认为它超越国境、超越民族、超越语言差别，普遍适用。</p><p>我开展“盛和塾”的活动，旨在向年轻企业家传授正确的经营思想。这个活动源自日本，现在已经发展到中国、巴西和美国。我讲授的内容中，被这些海外企业家塾生奉为圭臬之一的，就是“经营十二条”。</p><p>现实中，有一位巴西的塾生信奉“经营十二条”，忠实地贯彻实行，结果他所经营的香蕉产业蓬勃发展，因此，他在巴西被称作“香蕉大王”。</p><p>“经营十二条”中的每一条，都绝没有什么复杂难懂的内容。但是，正如上面所说，“经营十二条”的有效性和普遍性，已为事实所证明。它就是经营的要诀。希望大家务必相信它的力量，深刻理解、认真实践“经营十二条”。</p><p>下面就逐条讲解“经营十二条”。</p><p><strong>第一条 明确事业的目的和意义</strong></p><blockquote><p>树立光明正大的、符合大义名分的、崇高的事业目的。</p></blockquote><p>为什么要从事这个事业？这家企业存在的理由到底是什么？当然大家有各种各样的情况，但创办企业的目的及意义，必须明确地表示出来。有人为了赚钱，有人为了养家，这些并没错。</p><p>但仅靠这类目的，要凝聚众多员工，齐心协力办企业，是不够的。事业的目的和意义还是尽可能高层次、高水准为好，换句话说，必须树立光明正大的经营目的。缺乏“大义名分”，要让全体员工拼命工作，事实上行不通。“原来我的工作有如此崇高的意义”这样的“大义名分”，如果一点儿都没有，就很难让人从内心深处产生必须持续努力工作的欲望。</p><p>我在创办京瓷时，就遭遇了“事业的目的究竟是什么”的重大考验。当时的我，还不懂这一条经营大原则。“活用自己的制陶技术，开发新品，借以问世”就是我当时对事业的定位。那时日本的世风，轻视技术，尊重学历乃至学阀，对人的实力并不能予以恰当的评价。为此，我对自己初次就职的公司大失所望。因此，新公司“理直气壮、让稻盛和夫的新颖精密制陶技术问世”就自然成为经营目的。</p><p>一名技术员，一个研究者，有了自己的公司，终于可以将潜心钻研的技术成果发扬光大，当初的喜悦心情，难以言表。</p><p>但想不到，创业后第三年，竟招致青年员工们的“反叛”。公司设立第二年，招进了十多名高中毕业生，经过一年的磨炼已成生力军。突然，他们持联名状，集体向我交涉。状书上写明每年最低工资增幅、最低奖金，而且要保证薪酬连续增长等。</p><p>他们要求我予以承诺并做出保证。</p><p>当初招聘面试时我曾明言：“公司究竟能成何事，我自己也不知道，但我必定奋力拼搏，力争办成一流企业。你们愿意到这样的公司来试试吗？”他们明白我的话，明白我事先并无承诺，但仅过一年，他们就写联名状，并威胁不答应条件就集体辞职。</p><p>新公司正缺人，他们已形成战斗力，如果走了，公司必遭损失。但如果他们无论如何都固执己见，那也没办法。哪怕公司从头再来，我也不肯妥协，于是明确答复：“不接受你们的条件。</p><p>公司创办不足三年，我自己对公司前途仍无确切的把握，对将来也只能用“全身心投入，总会有所成就吧”这样的话来描绘。为了挽留他们，要做出缺乏自信的、违心的承诺，我做不到。谈判僵持了三天三夜，场地也从公司转到我家，我对他们说：“作为经营者，我绝不只为自己，我倾全力把公司办成你们从内心认可的好企业，这话是真是假，我无法向你们证实，你们姑且抱着"就算上当也试试”的心情怎么样，我拼上命也要把事业做成，如果我对经营不尽责或者贪图私利，你们觉得真的受骗了，那时把我杀了也行。”这样熬了三天三夜，推心置腹，他们总算相信了我，撤回了条件，不但留下，而且加倍努力，埋头工作。</p><p>当时的这些“造反派”，陆续都成了京瓷的骨干，这是后话。但这一事件深深地刺痛了我，让我意识到企业经营的根本意义，这成了我转变经营目的的契机。此前企业经营的目的是“技术问世”，对公司前景的展望，不过停留在“只要废寝忘食地干，饭总能吃饱吧”这种水平之上。</p><p>我在七兄妹中排行第二，乡下的亲兄弟尚且照顾不及，又怎能保证进厂不久的所有员工，包括他们的亲属的终生幸福呢？可是员工们却提出了这样的要求。这次艰难的交涉，让我从内心深处理解了员工的愿望。我开始意识到企业经营应有的真正目的。这目的既不是“圆技术者之梦”，更不是“肥经营者一己之私腹”，而是对员工及其家属现在和将来的生活负责。</p><p>这次纠纷教育了我，让我明白了经营的真义：经营者必须为员工物、心两方面的幸福殚精竭虑，倾尽全力，必须超脱私心，让企业拥有大义名分。这种光明正大的事业目的，最能激发员工内心的共鸣，获取他们对企业长时间、全方位的协助。同时，大义名分又给了经营者足够的底气，让他们可以堂堂正正，不受任何牵制，全身心地投入经营。</p><p>此后，我将“追求全体员工物、心两方面的幸福，同时为社会的进步发展做出贡献”作为京瓷的经营理念。因为企业作为社会中的一员，必须承担相应的社会责任，所以这后半句话也必不可少。</p><p>企业创建不久，就转变并明确了事业的目的和意义，明确了公司的经营理念，这真是幸事。尔后40年企业的一切发展，都不过是贯彻这一正确经营理念的必然结果。</p><p><strong>第二条 设立具体的目标</strong></p><blockquote><p>所设目标随时与员工共有。</p></blockquote><p>比如，企业今年的年销售额目标是1亿日元，明年要达到2亿日元。用具体的数字明确地表述目标。不光是销售额，也包括利润，都要建立明确的目标，并用具体的数字表示。而且这种目标在空间和时间上都必须明确。</p><p>所谓空间上明确，即目标不是全公司的一个抽象数字，而是分解到各个部门的详细资料，现场最小的组织单位也必须有明确的数字目标。再进一步，每一个基层员工都要有明确的指标和具体的目标。</p><p>所谓时间上明确，即不仅要设定年度目标，而且要设定月度目标。月度目标明确了，每个人就能看出自己每一天的目标。员工们明白自己每一天的任务，为了完成这些任务，就必须设定明确的目标。</p><p>每位员工努力完成任务，各个部门就能达成目标，公司整体目标也自然达成；每天的目标达成，假以时日，月度、年度的经营目标也自然达成。另外，目标明确，就可与员工共有目标。如果目标不明确，即经营者不能指明公司的前进方向，员工就会无所适从或各行其是，行动方向混乱，结果力量分散，组织的合力就无从发挥作用。</p><p>但是，我并不主张制订长期的经营计划。在经营这个领域，不少人主张必须依据企业经营战略，制订5年甚至10年的中长期计划。但是，我从不制订长期计划。因为即使制订长期计划，也几乎不可能达成。其间必有超出预想的市场变动甚至不测事态发生，计划本身便会失去意义，或向下修正，或不得不放弃，这类事司空见惯。不严肃、无把握兑现的所谓计划，还是不制订为好。员工见多了这样的计划，会产生“反正完不成也没关系”的想法，甚至漠视计划。一旦经营者再次制定经营目标，员工反倒失去向高目标挑战的热情。更坏的是，销售目标没达成，费用和人员倒按计划增加了，即销售额下降，费用增加，经营吃紧，日子变得难过。</p><p>因此京瓷从创立起，一向只制订年度经营计划。三五年后的事，谁都无法正确预测。1年的话，基本还能看清楚。然后将年度计划细分，变为每一天的目标，千方百计，不达成不罢休。</p><p>以今天一天的勤奋，完成今天的任务，就能看清明天；以本月一月的勤奋，完成本月的任务，就能看清下月；以今年一年的勤奋，完成今年的任务，就能看清明年。日复一日，切切实实达成每一天的目标，这至关重要，目标是否明确也很重要。经营顾问们瞧不起这一套，“这岂能成大事！”他们异口同声地说。但是，我只设定短时段的具体目标，付诸实行，完成；接着设定下个短时段的明确目标，再实行，再完成。周而复始，贯通始终，就这样，事业年年岁岁增长、发展不停。</p>'
    },
    '2026-10-10': {
      chapter: '第3天：第三条 胸中怀有强烈的愿望 · 第四条 付出不亚于任何人的努力',
      content: '<p><strong>第三条 胸中怀有强烈的愿望</strong></p><blockquote><p>要怀有渗透到潜意识的强烈而持久的愿望。</p></blockquote><p>我相信境由心造，心中蓝图能成为现实。换句话说，“无论如何也要达成目标”这一愿望的强烈程度，就是事情成败的关键所在。为经营课题所困扰，苦闷彷徨，是经营者的家常便饭。聚精会神于悬案，日日夜夜，废寝忘食，持续将思维聚焦于一点，直至突破。能否做到这些，是事业胜负的分水岭。</p><p>从这个意义上讲，我把“胸中怀有强烈的愿望”作为经营第三要诀列出，同时将副标题定为“要怀有渗透到潜意识的强烈而持久的愿望”。因为一旦驱动潜意识，就更能有效扩展经营。</p><p>什么叫潜意识？人的意识，有显意识和潜意识之分。比如现在我正在用显意识和大家讲话，大家也正用显意识听我讲话。显意识是觉醒着的意识、可随意运用的意识。潜意识则通常沉潜于显意识之下，不会显露出来，是不能人为控制的意识。</p><p>按照心理学家的说法，潜意识所持的容量，比显意识不知要大多少倍。据说人从生到死，全过程中的一切体验、见闻、感触，都蓄积于这潜意识之中。</p><p>我们日常生活中就有驱使潜意识的实例。比如学开汽车（日本），“右手握方向盘，左手控制排挡，右脚踩油门或刹车”，这套操作要点，我们先用头脑理解，即运用显意识，将它集中于“驾车”这一行为。</p><p>但熟练以后，即使不思考操作要点，而是思考别的事，照样可以开得平稳自如。那是因为在运用显意识反复驾驶汽车的过程中，显意识渗透到潜意识，结果潜意识在无意识中发挥作用，帮了我们的忙。</p><p>据说有两种办法，可以运用潜意识。</p><p>种办法是接受强烈的冲击性刺激。人受到沉重打击时产生的刻骨铭心的体验会进入潜意识，并不断返回显意识。</p><p>据说人于临死之前，过去的事情，犹如走马灯在脑中浮现。零点几秒的一瞬间，一生经历，像电影似的，一一在脑海中闪现。</p><p>就是说，储存于潜意识中的记忆，在直面“死”这一重大事件时，就与显意识联结而显现出来。但是人们都不想死，不希望获取这样的经验。</p><p>第二种办法是让经验反复，反反复复的经验使运用潜意识成为可能。</p><p>比如从早到晚，夜以继日，反复思考“销售额要达到多少”“利润要达到多少”这样的目标，这种强烈的、持续的愿望，可以进入潜意识。</p><p>经营者一到公司总是很繁忙，不可能24小时只考虑一种目标，但因“销售额要达到多少”这一目标已进入潜意识，即使经营者思考别的问题，必要时它也会跑出来，给其达成目标的启示。</p><p>比如在座的各位中有人想开拓新事业，手下缺乏具备专业知识和技术的人才。如果抱有“无论如何非做不可”的强烈愿望，在头脑中天天反复模拟演练，这愿望便能渗透到潜意识。</p><p>某日，我在酒馆小酌，忽然听到邻桌陌生人说话，所言极像我思考的新事业能用上的专业人才。于是，我立即起身请教：“对不起，听您刚才的话.....”不知不觉就攀谈、热络起来，再后来，此人便进了本公司，新事业以此为契机启动并一举展开。这类事，我经历过多次。</p><p>事实上，1983年夏季，我在为参与通信事业（这个事业发展为今天的KDD）反复推敲、构思方案时，参加某经济团体的聚会，与前来演讲的通信领域的技术专家偶然相遇，就以此为契机，迅速推进新事业的计划。</p><p>这种场合，原不过隔桌饮酒，萍水相逢。然而，强烈的愿望既已浸透潜意识，即使不经意间，也能将偶然邂逅变作良机，促使事业成功。这便是潜意识的功劳。</p><p>但在进入这境界之前，必须反复继续，必须有一个全身心投入、不断驱动显意识的过程。如果对要做的事不肯深思，甚至朝秦暮楚或淡然处之，那么它绝不会进入潜意识。只有火一样持续燃烧着的炽热愿望，才可能驱动潜意识为您效劳。</p><p>50年前白手起家创建京瓷时，面对仅有的28名员工，我总是重复这样的话：“让我们拼命干吧，我们要创造一个卓越的公司，镇上第一的公司，不，京都第一的公司，日本第一的公司。”</p><p>每天加班到深夜，工厂门口总有叫卖面条的小贩应时而来，我和员工们总是边吃夜宵，边说未来的梦想，那情景至今仍历历在目。</p><p>资金、设备、技术、人才等什么都缺的状况下，我却一味热衷于对员工们讲述将来之梦。以员工的立场冷静直面现状，我的理想简直荒唐无稽，不过是经营者的戏言而已。</p><p>其实诉说梦想的经营者，即我自己，也不免半信半疑，“这真的行吗？”我晓得我的话并无足够的说服力。但是，朝也说晚也说，一遍又一遍，反复倡导间，员工们及我自己，不知从何时起，竟信了。而且朝着那目标，众志成城，不惜一切、努力去实现。</p><p>目标越高，为实现它，就越需要持续心怀强烈的愿望。期待在座各位经营者，揭示各自的高目标，并怀抱不达目标誓不罢休的强烈而持久的愿望，把目标变成现实。</p><p><strong>第四条 付出不亚于任何人的努力</strong></p><blockquote><p>一步一步、扎扎实实、坚持不懈地做好具体的工作。</p></blockquote><p>我认为成功没有捷径，努力才是通往成功的光明大道。京瓷仅用40年，就成长发展到现在的规模，除“努力”之外，可以说别无他因。但是，京瓷的“努力”不是普通的努力，而是“付出不亚于任何人的努力”。“不亚于任何人”这几个字，才是最关键的。不做这种程度的努力，绝无企业今日的繁荣。</p><p>创立京瓷之初，我们既无足够的资金和设备，又无经营的经验和实绩，唯一的资本，只有无尽的努力，真可谓夜以继日，昼夜不分，努力工作，濒临极限。大家每天忙得连何时回家、何时睡觉都不知道。不久大家就筋疲力尽，“照这样拼命，身体能吃得消吗？”员工中传出这样的声音。我的生活也毫无规律，睡眠极少，不能按时吃饭。有时想，长此以往，恐怕真的难以为继。我召集干部开会，说：“我虽不太懂企业经营是怎么回事，但可以将它比作马拉松，是长距离、长时间竞赛。我们是初次参赛的非专业团队，而且起步已迟。包括大企业在内的先头团队已跑完了全程的一半。反正我们是无经验、无技术的新手，出发又晚，不如一上场就全力疾驰。”</p><p>大家会说，“这样蛮干，身体会垮”。说得没错。“要用百米赛跑的速度，一口气跑完42.195公里的马拉松全程，当然不可能。但新手迟发又慢跑，就毫无胜算。我们至少得尽力急起直追。”我就这样说服了员工，自创业以来，始终“全力疾驰”，结果京瓷一刻不停，发展再发展。我至今难忘创业后第12年，也就是1971年公司股票上市当日的情景。当时，全体员工聚集在工厂的空地上，我不禁流下感动的泪水，哽咽着说了一段话，记忆之清晰，犹如昨日：</p><p>“以百米赛跑的速度跑马拉松，或许中途倒下，或许跑不动了落伍。大家这么讲过，我也这么想过。但是，与其参加没有胜算的比赛，不如一开始就全力以赴，即使坚持不长，也要挑战一下。幸运的是，不知不觉中我们居然适应了高速度，用这高速一直跑到了今天。</p><p>“跑着跑着，发现前面的人速度不快，于是再加速，超越他们，现在已超过了第二集团，领先者已进入视野，再加油，按这种阵势就可以追上那先头团队！</p><p>用跑百米的速度跑马拉松，这样的努力才配称“不亚于任何人的努力”。</p><p>问诸位经营者：“你们努力吗？”大家会答“我们尽了自己的努力”。但是企业经营就是竞争，当竞争对手比我们更努力时，我们的努力就不奏效，就难免失败和衰退。</p><p>仅仅是“尽了自己的努力”这样的程度，公司不可能发展。要在“血雨腥风”般残酷而激烈的市场竞争中获胜，获得成长发展，就必须付出“不亚于任何人的努力”。</p><p>另外，还有一点很重要，“不亚于任何人的努力”必须每天不断地持续。千万不可忘记，任何伟大的事业，都是一步一步、踏实努力积累的结果。</p><p>京瓷靠生产日本某大型电器公司电视机显像管所用精密陶瓷部件开始创业。因为这种产品加工非常困难，当时日本只有京瓷能做。尽管如此，每个的单价极便宜，一个只卖9日元，客户订货批量却以几万个、几十万个为单位。精密陶瓷部件所用材料虽然先进，但同陶瓷器皿的烧制一样，生产过程很普通，将原料粉末成型凝固后，放进炉里高温烧制。这样的作业周而复始，不断重复，不断生产。</p><p>我当时常想，只卖9日元的廉价产品，只是大公司的下级工厂，只是一味地努力生产，怎么可能变为大企业呢？</p><p>但是揭开迄今为止大企业的成长发展史，就会明白，它们都从小事业开始，点滴积累，不断创新，踏实努力，坚持不懈，才有后来的辉煌。一开始就想抓大商机，或想靠偶然碰巧的生意发财，都靠不住，都长不了。企业发展的要诀一点不难：认真做实事，一步一步、踏踏实实，持续付出不亚于任何人的努力，精益求</p><p>精，持之以恒，如此而已。</p><p>希望在座各位经营者理解：只要一年365日，不间断地保持“不亚于任何人的努力”，诸位的公司定能成为自己想象不到的伟大企业，诸位的人生也会更充实、更美好。</p>'
    },
    '2026-10-11': {
      chapter: '第4天：第五条 销售最大化、费用最小化 · 第六条 定价即经营',
      content: '<p><strong>第五条 销售最大化、费用最小化</strong></p><blockquote><p>利润无须强求，量入为出，利润随之而来。</p></blockquote><p>京瓷开始运行时，我没有经营经验和相关知识，对企业会计更是一窍不通，所以请外援公司派来的财务科长协助会计事务。一到月底，我就抓住他问：“这个月怎么样？”结果夹杂着许多会计专业术语的解答，令技术出身的我十分头痛。我忍不住说：“如果销售减去费用，剩余就是利润，那么，只要把销售额增加到最大，把费用压缩到最小，不就行了吗？</p><p>估计那位科长当时吃了一惊。从那时起，我就把“销售最大化、费用最小化”当作经营的大原则。虽然是一条非常单纯的原则，但只要忠实贯彻这一原则，京瓷就可以成为高收益体质的优秀企业。</p><p>作为经营常识，大家都认为销售额增加，费用随之增加。但这不对。超越“销售增，费用也增”这一错误的常识，为做到“销售最大化、费用最小化”，开动脑筋，千方百计，才会从中产生高效益。</p><p>举例来说，假定现在销售为100，为此需要现有的人员及设备，那么订单增至150，按常理，人员、设备也要增加50%才能应付生产。但是，做这样简单的加法，绝对不行。订单增至150，本来要增加五成人员，通过提高效率，压到只增加二三成人员，这样来实现高收益。订单增加、销售扩大，公司处于发展期，正是搞合理化建设、提高效率、变成高收益企业千载难逢的机会，可是大多数经营者却在企业景气时放松管理，“坐”失良机。</p><p>“订单倍增，人员、设备也倍增”的加法经营很危险。一旦订单减少，销售降低，费用负担加重，会立即一落而成亏本企业。实施“销售最大化、费用最小化”原则，必须建立一个系统，使每个部门每月的费用明细一目了然。为此，京瓷开张不久，就引入了所谓的“阿米巴经营”管理系统。</p><p>同一般财务会计不同，这是经营者为便于经营而应用的一种管理会计手法，阿米巴是由几个人至十几个人组成的小集团，京瓷现有1000多个这样的小集团，构成一个经营系统。</p><p>所谓“阿米巴经营”，就是计算出每个阿米巴每小时生产多少附加值。简单讲，就是从每个阿米巴月销售额中减去所有月费用，剩余金额除以月总工时所得的数字，作为经营指标，我们称之为“每小时核算制度”。</p><p>京瓷就依据“每小时核算制度”，月末结算，次月初各部门实绩由每小时核算表详细反映出来。只要细看每小时核算表，各部门的收益等情况一目了然。</p><p>另外，为了将费用压缩到最小，每小时核算表把费用科目细分，比一般会计科目分得更细，构成所谓实践性费用科目。比如不用“光热费”这个大科目，而是将其中的电费、水费、燃气费项目分别列支。</p><p>这样做，从事实际工作的员工就能理解，并可以采取具体行动来削减费用。看了细分后的核算表，“啊，这个月电费花多了。”现场负责人就能清楚理解费用增减的原因，便于切实改进。</p><p>在日本常有“中小企业像脓包，变大就破”之类的挖苦话。说到底，就是因为没有采用上述有效的管理会计手法。</p><p>公司尚小时姑且不谈，变大后仍做笼统账，那么任何人都弄不清经营实态。当然，一般的会计处理总是会做的，但不起实际作用，因为经营者从中看不清经营实况，无法及时采取有效措施，企业效益自然上不去。</p><p>京瓷自创立以来，除了近年“雷曼兄弟事件”之后的一段时间，利润率基本一直保持在两位数以上，有些年份甚至超过40%。</p><p>之所以能构建如此高收益体质的企业，原因不仅在于京瓷拥有其他公司无法仿效的独创技术，开发了高附加值的产品，更在于忠实贯彻了“销售最大化、费用最小化”的经营原则，构筑了让经营者可以看清经营实况的管理系统，并使该系统有效运行。</p><p><strong>第六条 定价即经营</strong></p><blockquote><p>定价是领导的职责，价格应定在客户乐意接受、公司又盈利的交汇点上。</p></blockquote><p>以前，在选聘京瓷董事时，我希望录用有商业头脑、懂生意经的人才。为此，我出了个考题：“如何经营夜间面条铺？”在中国，这相当于“如何经营面馆”。</p><p>给候选人购置面条铺设施的资金，让他们做面条买卖，几个月后，看他们赚了多少。我用这个办法来选拔人才。之所以出这个考题，是因为如何做面条生意，包含了经营的一切精粹。</p><p>首先，如果想卖烧肉面，那么，用鸡骨汤还是排骨汤，用机器制面还是手工拉面，肉片放几块，要不要加葱......有各色各样的选择。就是说，小小一碗面条，可以千差万别，不同经营者的做法完全不同。</p><p>其次，面条铺设在哪里，营业时间怎么定，开在闹市以醉酒客为对象，还是开在学生街瞄准年轻人，如何决定，体现经营者的商业才干。</p><p>定下这些后，在此基础上如何定价呢？如果在学生街，就要廉价多销；如果在闹市，不妨做高档美味面，价高，卖得少些，照样赚钱。</p><p>如何做面条生意，凝缩了经营的各种要素，“如何定价”一条，就可以判断他有无商业才能。</p><p>我曾想用这道题目考验出候选者有无商才，为选聘董事把关。因实施方面有难度，没有推行。但我坚信定价就是定生死，定价即经营。</p><p>给产品定价，有各种考量。是定低价，薄利多销；还是定高价，厚利少销，价格设定有无数种选择，它同时体现了经营者的经营思想。</p><p>价格决定以后，究竟能卖出多少量，获得多少利，极难预测。定价太高，产品卖不出；定价过低，虽然畅销，却没有利润。总之定价失误，企业损失莫大。</p><p>在正确判断产品价值的基础上，寻求单个的利润与销售数量乘积为最大值的某一点，据此定价。我认为，这一点应该是顾客乐意付钱购买的最高价格。</p><p>真能看清、看透这一价格点的，不是销售部长，也不是营业担当，而非经营者莫属。可以说，这是定价的普遍原则。</p><p>但是，即使以该价格卖出了，也未必意味着经营一定顺当，即使以顾客乐意的最高价格出售了，却仍没有获利，这种情形屡见不鲜。问题在于：在已定的价格下，怎样才能挤出利润。</p><p>以生产厂家为例，如果跑销售的只知道以低价格获取订单，那么制造部门再辛苦也无法获利，因此必须以尽可能高的价格推销，但是价格确定后，能否获利，就是制造方面的责任了。一般的厂家，以成本加利润的方式决定价格，日本的大企业多数采用这种成本主义的定价方式。</p><p>但在激烈的市场竞争中，卖价往往先由市场决定。成本加利润所定的价格，因为偏高而卖不动，不得已而降价，预想的利润泡汤，企业极易陷入亏损困境。</p><p>因此，我给技术开发人员这样定位：“你们或许认为，技术员的本职工作就是开发新产品、新技术。但是我认为，这还不够，只有在开发的同时认真考虑降低成本，才有可能成为一个称职、优秀的技术员。”</p><p>必须在深忠熟虑后定下的价格之内，努力获取最大利润。为此，要将“材料费、人工费、各类费用必须花多少”这一类固定观念或常识统统抛开，在满足质量、规格等一切客户要求的前提下，必须千方百计，彻底降低制造成本。</p><p>“定价”“采购”“压缩生产成本”这三者必须联动，“定价”不可孤立进行，“定价”意味着对降低采购成本及生产成本负责。价格之所以要由经营者亲自决定，理由就在于此。</p><p>就是说，在决定价格的瞬间，必须考虑降低制造成本。反过来讲，正因为对降低成本心中有数，才能正确定价。“与那家供应商的领导者交涉，价格要降到那种程度。”如果让缺乏这种采购战略意识的营业担当来决定价格，必出乱子。</p><p>定价即经营，定价是经营者的事，进一步讲，定价是否合理，还体现经营者的人格。希望大家都能理解这一条，把企业经营得更为出色。</p>'
    },
    '2026-10-12': {
      chapter: '第5天：第七条 经营取决于坚强的意志 · 第八条 燃烧的斗魂 · 第九条 临事有勇',
      content: '<p><strong>第七条 经营取决于坚强的意志</strong></p><blockquote><p>经营需要洞穿岩石般的坚强意志。</p></blockquote><p>我认为，所谓经营就是经营者意志的表达。目标一旦确定，无论发生什么情况，非实现不可，这种坚强意志在经营中必不可少。</p><p>但是，不少经营者眼看目标达不成，或寻找借口，或修正目标，甚至将目标、计划全盘取消。经营者这种轻率的态度，不仅使实现目标变得根本不可能，而且会对员工产生极大的消极影响。</p><p>我对此事的深刻体验，是在京瓷上市之后。企业一旦上市，就必须公开发表公司下一期业绩预报，对股东做出承诺。但许多日本经营者往往以经济环境变化为理由，毫无顾忌地将预报数字向下调整。</p><p>但是在同样的经济环境下，有的经营者却能出色地完成目标。我想，在环境变动频繁又剧烈的今天，经营者如果缺乏“无论如何也要达到目标、履行承诺”的坚强意志，经营将难以为继。</p><p>-味地将经营去“凑合”状况变化，结果往往不妙。因为向下调整过的目标，遭遇新的环境变动，不得不再次向下调整。一遇困难就打退堂鼓，必将完全辜负投资者和企业员工的信赖。既已决定“要这么做”，就必须以坚强的意志贯彻到底。</p><p>还有一个要点，虽说目标就是经营者的意志，但是必须获得员工的共鸣。起初是经营者个人的意志，但随后必须让全体员工发出“那么，让我们一起干吧！”的呼声才好。</p><p>换言之，体现经营者意志的经营目标必须成为全体员工的共同意志。员工一般不肯率先提出让自己吃苦的高目标，决断得由经营者下。</p><p>但自上而下的高目标，需要自下而上的响应。这就是“要把经营者的意志变为员工的意志”。</p><p>做到这点不难，比如事前先讲一番激励的话：“咱们公司前景光明，虽然现在规模还小，但将来的巨大发展，大家可以期待。”然后开宴会，一起干杯后就开口：“今年我想把营业额翻一番。”</p><p>身旁坐着办事差劲却善于揣摩上司心理的家伙，让他们接话：“社长，说得对！干吧！”于是那些脑子好使、办事利索但冷静过度的人就难以启齿。不然，一听高目标，他们就会泼冷水：“社长，那可不行，因为.....”讲一大套行不通的理由。但这时的气氛使消极者不好反对，而且不知不觉中甚至随声附和。高目标往往就在全员赞同之下得以通过。</p><p>经营也是心理学。即使是低目标，若让“冷水派”先发言，他们也会说：“难，不可能完成。”气氛消沉，经营者期望的高目标就可能落空。</p><p>我认为，一定要设定高目标，然后向高目标发起挑战。当然目标过高，一年，两年，甚至连续三年完不成的话，高目标就成水中月，镜中花。其副作用是：今后谁也不会认真理会经营者制定的经营目标了。</p><p>然而，还是要有比上一年高出一截的经营目标。否则不足以激发员工士气，公司会失去活力。</p><p>下面的办法多用不好，但在京瓷还小的时候，我采用过。</p><p>“瞄准月销售10亿日元。达成，全员去中国香港旅游；达不成，全员去寺庙修行。”--在目标完成还是完不成的微妙时刻，我这样宣布。</p><p>结果大家一阵猛干，出色地完成了任务。因此，我们租了包机，全员赴港三日游，借此又与员工增强了一体感。</p><p>不是简单地下命令完成目标，而是要出各种主意鼓励员工，使经营目标与员工共有，从而实现它。</p><p>当然重要的不是手腕，而是无论如何必须达成目标，为此，经营者要想尽办法，借用一切机会，直率地将自己的意见传递给员工。</p><p>有一年年终，我感冒发高烧，但仍连续参加所有部门的辞旧迎新“忘年会”五十多次，在会上不遗余力地阐述对明年事业的展望与构想，以求获得全体员工的理解和协助。这样竭尽全力，把自己的构想全盘告诉员工，要说的话说尽，我已感觉浑身虚脱，似乎绞尽了自己的全部能量，将其原封不动地转移给了员工。“能量转移”这个词用在这里，恰到好处。</p><p>我就是这样尽最大努力，使经营目标与员工共有。调动员工的热情，朝着体现经营者意志的经营目标奋进，企业的成长发展将不可阻挡。</p><p><strong>第八条 燃烧的斗魂</strong></p><blockquote><p>经营需要强烈的斗争心，其程度不亚于任何格斗。</p></blockquote><p>我认为格斗场上所需要的“斗魂”，经营中也必不可少。脾气太好、连架也没吵过的人，应该趁早把社长的座椅让给更有斗争心的人。</p><p>不管说得多么好听，经营毕竟是企业之间激烈的竞争。哪怕只有两三名员工的小企业，经营者如果缺乏“斗魂”，不能为保护员工发挥昂扬的斗志，也将必败无疑。</p><p>另外，随着企业的成长发展，需要面对的竞争对手往往会越来越强大。这时为了保护企业不受侵害，就需要角斗士一样的“斗魂”，需要压倒对手的大无畏的气魄。但是，所谓“斗魂”，并不是表现粗野，并不是张扬暴力，而是母亲保卫孩子时不顾一切的勇气。当鹰袭击幼鸟时，母鸟奋不顾身，冲向强大的敌人，为了保护自己的孩子不受外敌的伤害，不顾自身的危险，把敌人引向自己。为了救自己的孩子，即使是小动物的母亲，也会突然表现出惊人的勇气和不可思议的斗魂。</p><p>经营者在履行使命的时候，少不了这样的斗魂。平时柔弱，不会吵架，看不出有什么斗魂，但是作为经营者，一旦面临危险，为了保护广大员工，应立即挺身而出。没有这种气概，经营者就不可能得到员工们由衷的信赖。这种英勇气概，来自强烈的责任感。无论如何也要保护企业，保护员工，这种责任心，使经营者勇敢且坚定。</p><p>现在的日本，抗御外“敌”保护企业、保护员工的经营者少见，相反，只知明哲保身的经营者却很多。我们看到，大公司或银行这样有巨大社会影响力的企业，发生丑闻后，经营者往往推卸责任，却叫部下引咎辞职。这说明经营者选错了。挑选经营者不应该只看能力，还应该把有斗志，就是将为了保护企业、保护员工，哪怕粉身碎骨也在所不惜的人，选作经营者。</p><p><strong>第九条 临事有勇</strong></p><blockquote><p>不能有卑怯的举止。</p></blockquote><p>为什么需要勇气？首先，对事物进行判断时需要勇气。我认为，经营企业，只要依据“作为人，何谓正确”这一原理原则进行判断，就不会发生大的失误。我在实践中彻底地贯彻这一条。</p><p>但是，许多经营者在需要按原理原则进行判断、得出结论的时候，因为遭遇各种各样的障碍，往往做出错误的判断。</p><p>比如在日本购买工厂用地时，当地有影响力的政治家会插手干预。有时公司内部发生不良事件时，暴力团等反社会组织得知后会来浑水摸鱼。这时，有人就会放弃原理原则这一判断基准，不再把企业经营何谓正确放在第一位，而是以尽量追求稳妥、息事宁人作为判断基准。考验经营者是否具备真正的勇气，就看他在这种局面下如何判断。</p><p>经营者只有具备真正的勇气，才能按原理原则做出判断，这种情况下即使受到威胁，受到中伤和诽谤，即使面临损失或灾难，仍然毫不退缩，坦然面对，坚决做出对公司有利的判断。</p><p>“这么做，会受到黑社会的威胁。”“会遭到经营者朋友们的耻笑，会遭到排斥。”困惑之余，顾虑重重，就无法做出正确的经营判断。本来很简单的问题会变得复杂怪异，难以解决。</p><p>所有这些，都是经营者缺乏真正的勇气所致。依据原理原则做出正确决断确实需要勇气。反过来讲，缺乏勇气的人不可能做出正确的决断。经营者没有勇气，胆小怕事，临阵退缩，那形象立即会在员工中传开。员工看到经营者那副可怜相，会立即对他失去信任。经营者不争气的窝囊相，会在企业内如野火般迅速蔓延。经营者缺乏勇气，员工就会上行下效，不以卑怯为耻，紧要关头，妥协退让，丧失立场。</p><p>经营者所需要的勇气，又可称为“胆力”。我读过某位精通东方典籍的日本启蒙思想家所写的文章，其中有所谓“知识”“见识”“胆识”的说法。所谓“知识”是指各种信息，指理性上了解这些信息。知识多似乎很博学，但是，许多所谓的“知识”往往并没有多大的实际价值。应该把“知识”提升到“见识”的高度。所谓“见识”，就是对“知识”的本质真正理解以后，自己内心产生的一种坚定的“信念”。</p><p>有“见识”是当经营者的先决条件。有人说公司的二把手，只要有“知识”就行，不必强调“见识”。但是，公司一把手，即经营者，因为要作决断，就必须有“见识”，即具备“信念”，否则就不可能对事情做出</p><p>正确且恰当的判断。</p><p>但是真正的经营者还必须具备“胆识”。所谓“胆识”，是“见识”加上“胆力”，或者说加上“勇气”。</p><p>因为具有出于灵魂深处的坚定不移的信念，所以能顶天立地、无所畏惧。</p><p>经营者只有具备这种“胆识”，才敢于面对一切障碍，正确判断，坚决实行，摆正经营之舵，在风浪中勇往直前。</p><p>说句难登大雅之堂的话，有时经营者会遭遇极为棘手、极为难堪的局面，甚至急得“小便里带血”。只有这种时候，才能考验出经营者是否具备真正的勇气。希望在座各位都具备“胆识”，即发自灵魂深处的勇气，从而能在各种情况下都做出正确的判断。</p>'
    },
    '2026-10-13': {
      chapter: '第6天：第十条 不断从事创造性的工作 · 第十一条 以关怀之心，诚实处事 · 第十二条 保持乐观向上的态度',
      content: '<p><strong>第十条 不断从事创造性的工作</strong></p><blockquote><p>明天胜过今天，后天胜过明天，不断琢磨，不断改进，精益求精。</p></blockquote><p>得过“普利策奖”的美国新闻界代表人物戴维特先生，在其所著的《下一世纪》一书中，用了一章的篇幅来描写我的事情。这章开篇，他就引用了我的话：“我们接着要做的事，又是人们认为我们肯定做不成的事。</p><p>事实上，京瓷过去做的也是当时人们认为做不到的事。开发新型陶瓷，把它作为新型工业材料，将它发展成数万亿日元规模的新兴产业，在此之前，人们觉得这是不可思议的事情。</p><p>充分利用新型陶瓷的优良性能，进一步开发出半导体封装件，促进了计算机产业的蓬勃发展。同时又开发出人造骨、人造牙根等用于生物体的新产品。京瓷开拓出一个精密陶瓷的新产业领域，为社会做出了贡献。</p><p>京瓷为什么如此富有独创性，许多日本的经营者把原因归结于京瓷的技术开发力上。对照自己，他们会说：“我们公司缺乏那样的技术，无法发展也是不得已的事。”</p><p>我认为这种观点站不住脚。没有哪一家公司天生就拥有杰出的技术，能不能专注于创造性的工作，明天胜过今天，后天超过明天，不断改进，不断创新，这才是能不能实行独创性经营的关键。</p><p>我常以清洁工作为例，说明这个道理。</p><p>清洁工作似乎是很简单的杂差，没有什么创造性可言。但是，不要天天机械地重复单调的作业，今天这样试试，明天那样试试，后天再换其他花样试试，不断考虑清扫方法，不断提高清扫效率，365天孜孜不倦，每天进行一点一滴的改进。即使看起来简单的工作，结果也会产生很有价值的创新。</p><p>一天的努力，只会带来微小的成果，但是锲而不舍，改良改善积累一年，就可能带来可观的变化。不仅是清洁工作，企业里各种工作，营销、制造、财务等都一样。这个世界上划时代的创造发明，无一不是在这样踏踏实实、地地道道、一步一步努力的积累中产生出来的。</p><p>不论各位的企业属于何种行业，“不可每天以同样的方法重复同样的作业，要不断有所创新”，把这句话作为公司方针明确地提出来，而且经营者要率先做出榜样。这样经过三四年，企业就会有独创性，就能进行卓有成效的技术开发。</p><p>时至今日，京瓷并没有停留在精密陶瓷领域，而是在太阳能电池、手机、复印机等广泛的技术领域内，推进多元化经营。但是当初，我只具有精密陶瓷这一狭小范围内的专业技术。就是说，独创性的产品开发和独创性的经营，京瓷开始时也没有。各位能不能每天都认真追求，钻研琢磨，不懈努力，这才是问题的关键。</p><p>有关创造性的话题，我经常讲一个“将来进行时”的观点，不是以现有的能力决定将来能做什么，而是现在就决定一个似乎无法达成的高目标，并决定在将来某个时点达成它。盯住这个目标，通过不间断的顽强努力，提高自己现有的能力，直到在将来某个时点达成既定的高目标。</p><p>如果只以现有能力判断今后能做什么，不能做什么，那么根本无法开拓新事业。现在做不成的事，今后无论如何也要把它做成，这种强烈的使命感，才可能开辟一个新时代。</p><p><strong>第十一条 以关怀之心，诚实处事</strong></p><blockquote><p>买卖是双方的，生意各方都得利，皆大欢喜。</p></blockquote><p>这里所说的关怀之心，又可称作“利他”之心。不只考虑自身的利益，也要考虑对方的利益，必要时，即使自我牺牲，也要为对方尽力。这种美好的心灵，我认为即使在商业世界里，也是最重要的。但是，许多人认为，“关怀”“利他”这类说法，在竞争残酷的商业社会，事实上很难推行。为了说服他们，为了说明“善有善报”的因果法则在企业经营的领域同样存在，我想举出下面的实例。</p><p>京瓷在美国有一家生产电子零部件的子公司，名叫AVX公司。这还是20多年前的事情，当时AVX公司在电容器领域处于世界领先地位。为了把京瓷发展成综合性的电子零部件公司，需要AVX公司的加盟。基于这种判断，我向AVX公司的董事长提出了收购该公司的要求。</p><p>这位董事长爽快地答应了。收购采取了“股票交换”的方式。我们决定，把当时纽约证券交易所以20美元左右的价格交易的AVX股票高评50%，即评估为30美元，与在同一交易所上市的、时值82美元的京瓷股票进行交换。</p><p>但对方董事长立即提出30美元的价格仍然偏低，要求再增加，希望以32美元成交。当时，京瓷美国公司的社长以及律师都表示强烈反对，他们认为轻易答应这类要求，在今后的交涉中对方会得寸进尺，对京瓷不利。但是，我认为，这位董事长要对他的股东负责，对他而言，即使提高1美元也是理所当然，他的要求应予理解，于是同意了对方的要求。</p><p>然而，当双方股票正要交割时，纽约证券交易所道琼斯指数大幅下跌，京瓷的股价也跌了10美元，变成了72美元。看到这种情况，对方董事长又提出要求，把原定的82兑32的交换条件改为72兑32。</p><p>通常的看法，如果因为京瓷业绩下降引起股价下跌，京瓷当然应该负责，现在是股市全盘下跌，改变交换比率完全没有必要。京瓷一方的人士异口同声，主张驳回对方的要求。</p><p>但是，我还是再次接受了不利的变更条件。这既不是出于什么算计，也不是感情用事。收购合并是两种文化完全不同的企业合二为一，是企业与企业结婚，应该最大限度地为对方考虑。</p><p>收购之后，京瓷股价一路上扬，AVX公司的股东获利丰厚，他们的喜悦之情感染了公司员工。一般而言，被收购公司的员工对收购公司总是抱有抵触和不满的情绪，但AVX公司的员工们却因为京瓷接连的高姿态，一开始就能友好交流，而且很自然地接受了京瓷的经营哲学。</p><p>有这么一段经历，收购后的AVX公司继续成长，不到五年，在纽约证券交易所再次上市。再上市过程中，京瓷通过出售股票获得了丰厚的回报。</p><p>20年前，许多日本公司收购了美国公司，但后来由于亏损被迫纷纷撤退或出售，像京瓷收购AVX公司这样成功的案例几乎没有。</p><p>我认为，它们的失败和AVX公司的成功之间最大的差距在于，是只考虑自己的利害得失，还是真正地为对方着想。这种“心的差异”，就是不同的想法会带来不同的结果。</p><p>中国古籍《尚书》里说：“满招损，谦受益。”尊重对方，为对方着想，也就是“利他”的行为，乍看似乎会给自己带来损害，但从长远来看，一定会给自己和别人都带来良好的结果。</p><p><strong>第十二条 保持乐观向上的态度</strong></p><blockquote><p>抱着梦想和希望，以坦诚之心处世。</p></blockquote><p>不管处于何种逆境，经营者必须始终保持开朗、积极向上的态度，这已成为我的信念。既然从事了经营，就不要害怕各种经营课题接踵而来，而且问题越是困难，越是不能失去梦想和希望。</p><p>被各种经营上的问题纠缠，却能顶住压力，坚韧不拔，这样的经营者身上似乎透出一种“悲壮感”。或者说，因为我强调了坚强的意志和燃烧的斗魂，大家或许认为经营一定是个苦差事，一定充满“悲壮感”。</p><p>恰恰相反，正因为经营需要燃烧的斗魂和不屈的意志，所以经营者必须同时保持开朗的心态。一味紧张，有张无弛，长期经营就很难坚持。</p><p>一方面是“必须苦干”的决心，另一方面是“必将成功”的信念。以乐观态度面对困难和逆境，乃是人生成功的铁则，是经营者的生存智慧。</p><p>比如，有病时坚信必能康复，于是好好养生。比如，资金周转困难，很伤脑筋，但坚信只要努力，总有办法解决，于是就更加努力地去解决。处于逆境中心的当事人要如此洒脱，似乎很难，但即使难，也要有意强迫自己这么想，这么做。只要努力坚持，事态一定会出现转机。</p><p>从长远来看，乐观向上，积极努力，必会有好报，因为自然界本来就这样，这个世界本来就如此。</p><p>我把上述人生态度和工作态度称为“与宇宙的意志相协调”。我向许许多多的人讲述这个真理。同情之心、谦虚之心、感激之心、实事求是之心，抱着这样美好的心，又坚持踏实努力的人，他们必将时来运转，幸运一定会关照他们。我发自内心地坚信这一点，这已成为我不可动摇的信念。</p><p>关于这个问题，我想今后还有机会详细地讲解。今天，在结束“经营十二条”演讲之际，我想引用中国古籍《易经》上的一句话：“积善之家必有余庆，积恶之家必有余殃。”</p><p>无论是人生还是经营，其成败取决于我们今后的行动。在座的各位经营者，对于我刚才讲述的“经营十二条”，如果真能认真学习，切实实行，那么你们就会变成与自己的过去完全不同的优秀的经营者。</p><p>如果在座的经营者变了，紧接着你们公司的干部就会变，再接着员工就会变。如果是这样，那么只需要一年左右的时间，你们的公司一定会充满活力，变成一个优秀的、高收益的公司。</p><p>今天我这个演讲，如果能成为一种契机，促使在座诸位把企业经营得更好，我将感到十分荣幸。我衷心期望，通过这样的活动，能为不断发展、前景美好的青岛市，为不断快速发展的中国经济助一臂之力，为增进一衣带水的中日两国的友好添砖加瓦。</p><p>我在“稻盛和夫经营哲学青岛国际论坛”的演讲到此结束。谢谢大家的静听。</p><p><strong>第二章 经营者必备的三种力量</strong></p><p><strong>一种“自力”，两种“他力”</strong></p><p>“自力”顾名思义，是指经营者自身具备的能力或力量。两种“他力”：一种是指经营者的得力副手、左膀右臂以及企业员工的力量；另一种是指宇宙、自然的力量。</p>'
    },
    '2026-10-14': {
      chapter: '第7天：一种“自力”，两种“他力”（续） · 第一种“他力”：得力的副手及全体员工的力量',
      content: '<p><strong>自力：经营者自身具备的能力</strong></p><p>怎样判断“自力”，即经营者自身具备的能力呢？用一句话来讲，就是经营者能否全面实行“经营十二条”。你是否具备经营者的能力或素质？如果你回答，自己能够忠实地遵循和实践“经营十二条”，那么你就充分具备了作为经营者所必需的素质。下面简单解释“经营十二条”。</p><p>明确事业的目的和意义</p><p>为什么办企业，从事这项事业的目的到底是什么？这个问题自己必须想明白，不明白就必须不断自问自答。这里的要诀是：必须树立光明正大的、高尚的事业目的。如果办企业只是为了满足自己个人的私利私欲，员工就会讲“经营者为了自己赚钱来驱使和剥削我们”，他们就不肯由衷地协助你，企业就很难办好。为了唤起员工的共鸣，使他们全力以赴、努力工作，就需要经营者超越一己私利，树立高层次的事业目的。</p><p>话虽然这么讲，但在美国，创办企业就是为了自己赚钱，就是为了满足个人的私欲，这种情况相当普遍。为了得到干部的协助，他们会说“我把你当合伙人，只要你尽力，我就给你高薪”。就是说，他们用金钱和利害得失来构筑公司内的人际关系。那么即使说服了公司上层，一般的员工仍难免牢骚满腹。工会力量特别强的地方，就会不断地发生各种冲突。所以，越是像美国这样讲究利害得失的社会，就越应该树立符合大义名分的事业目的。</p><p>设立具体的目标</p><p>“这个月销售额多少，利润多少”，必须设定每个月的具体计划，并向员工们说明和解释，让计划或目标与员工们共有。“社长，我们明白了，我们就来努力完成这个计划吧！”让大家有一个明确而具体的目标，就能凝聚合力，促使大家千方百计达成目标。</p><p>胸中怀有强烈的愿望</p><p>这里着重强调“必须持续抱有渗透到潜意识的强烈愿望”。就是说，经营者在树立高尚的事业目的，设立了每个时期必须完成的具体目标后，心中就要抱有不管碰到什么困难，无论如何必须达成目标的强烈愿望，朝思暮想，做梦也想。在经营京瓷公司时，我曾遭遇各种困难和烦恼，在这过程中，我意识到缺乏强烈的愿望，就无法解决难题、成就事业。那年年初刚上班，我就向全体员工提出当年的方针，用一句口号表达：“为完成新的计划目标，不屈不挠，一心一意，开动脑筋，千方百计，全力拼搏。”</p><p>付出不亚于任何人的努力</p><p>每天的工作都是实在而非虚浮的。比如跑推销的，要不断拜访客户，即使被拒绝也要想尽办法拿到订单。我们必须一步一步、踏踏实实，做出持续不懈的努力。</p><p>销售最大化、费用最小化</p><p>利润不靠主观追求而来，利润是努力工作的结果。就是说，你尽力做到销售最大化、费用最小化，作为结果，利润就会自然产生。而且只有这样，才能形成高效益体质的企业。</p><p>定价即经营</p><p>产品定价不当，那么不管你如何努力，到头来可能仍然没有利润。定价往往就是定生死。</p><p>产品的卖价、原材料的进货价，不是由自己单方面决定的，往往由市场和竞争对手决定。但是否以对方的出价为准，最后判断还是靠经营者自身。定价太高，卖不动；定价太低，即使卖得好也没有钱赚。定出某种价格，就会卖出多少数量，这样的预测非常困难。但经营者必须在正确认识自己产品价值的基础上，以利润最大化为定价原则。价格应由经营者亲自决定。</p><p>经营取决于坚强的意志</p><p>经营必须有不屈服于任何阻力的、洞穿岩石般的坚强意志。为了实现第二条所说的“具体的目标”，就需要这种不达目标誓不罢休的坚强意志。</p><p>燃烧的斗魂</p><p>经营者需要不亚于任何斗士的激烈而昂扬的斗志。经营必然伴随竞争，在严酷的竞争中脱颖而出，使企业不断成长，经营者必须拥有这样的斗魂。</p><p>临事有勇</p><p>领导者如有卑怯的举止，就会腐蚀整个组织，组织里的不良行为就会像野火般蔓延。勇气来源于强烈的使命感和坚定的信念。统率众多员工的经营者必须率先垂范，具备真正的勇气，把正确的事情以正确的方式贯彻到底。</p><p>不断从事创造性的工作</p><p>十年如一日，重复同样的工作，企业不可能发展。但是创新、独创，不是嘴上强调就能做到的。今天胜于昨天，明天胜于今天，天天钻研，天天改善，持之以恒，就能不断创新。</p><p>以关怀之心，诚实处事</p><p>做生意必须双赢，所谓“利他自利”。有同情心、真诚待人，就是在买卖中顾及对方，让对方也获利。客户满意，就自然会给你带来利益。</p><p>保持乐观向上的态度</p><p>经营者应该保持开朗的心境，抱着向前看的态度，不失淳朴之心。经营会遭遇接二连三的难题，如果缺乏良好的心态，经营者就会被困难压倒。越是艰苦，经营者越要保持开朗的心境和向前看的态度。怀抱梦想和希望，不失淳朴之心，这是经营者必备的人生态度。</p><p>经营者如果不能实行上述十二条，经营就难以顺利进展。这是经营者需要的三种力量中的第一种，是经营者的“自力”。</p><p>就是说，经营者具备实行“经营十二条”的能力，是经营成功的必要条件。</p><p><strong>第一种“他力”：得力的副手及全体员工的力量</strong></p><p><strong>得力的副手（搭档）</strong></p><p>本田技研的本田宗一郎，专长是开发和制造，因为有了精通财务、善于经营的藤泽武夫做搭档，两人珠联璧合，才有了今天本田这个世界著名企业。同样，松下幸之助既懂制造又会经营，还善于理解人心，但也因为有高桥荒太郎这位财务专家鼎力相助，才有后来的顺利发展。</p><p>经营好比重担，如果只有经营者一个人单肩独挑，弯着腰走上坡路，未免吃力。如果把这副重担放在中间，两个人一起来扛，“嘿哟嘿哟”互相鼓劲，自然轻松得多</p><p>我创办企业时没有本田、松下那样幸运。我是搞技术出身，但又必须学懂财务，事无巨细都要躬亲，是不得已，不足称道。在繁忙和苦恼中我想到孙悟空，拔毛一吹，就会出现许多小孙悟空，好比自己的分身，这位帮我去跑客户，那位帮我算账搞财务.....希望有许多与我理念相通的人尽力帮助我。这就是后来想到的“阿米巴经营”，尽量划小核算单位，实行各部门独立核算制度，让各部门负责人都成为经营者，共同经营企业。</p><p>我是在事必躬亲、繁忙之极的苦恼中，才意识到个人的力量，即“自力”的局限性。独木不成林，“人”这个字就靠相互支撑，经营也一样，靠个人单打独斗，难成气候。经营者需要好搭档。</p><p>搭档关系不能基于利害，重要的是同心同德。</p><p>话是这么说，但在美国要找到可靠的合作伙伴相当困难。大家发言中谈到了这一点，有美国朋友邀请你出资合作，说有赚钱的商机，但你一旦出资，他又不认真经营，经营不善，资本金又不肯返回。</p><p>人种不同、信仰不同，又只谈金钱上的利害得失，在这种人际关系的基础上进行商业合作，就是美国式资本主义。所以，在美国寻找信得过的合作伙伴十分困难。</p><p>然而日本也有类似的情况。昨天还很信任的干部，竞争对手出高薪就可以挖过去，越是有技术、有能力的干部，对手就越拉拢。一旦被挖过去，昨天还一起共事的同僚，明天突然成了竞争对手。他们还会把企业的重要信息全部带去，让对方抢得先机。在日本，这样尴尬的事情虽不及美国多，但同样存在。</p><p>尽管如此，经营者个人的力量总有限度，小企业或许管得过来，一旦做大，经营者无论如何都需要可靠得力的副手或伙伴相助。</p><p>在美国，经营者常用出让原始股的办法，即用金钱刺激来巩固人际关系，最近日本的一些经营者也在学。但这种以满足物质欲望来构筑的人际关系，归根结底难以持久。</p><p>可靠的伙伴关系一定是心连心的信赖关系。当然利害也应当一致，但根本还在人心。</p><p>京瓷的发展靠的就是这种心连心的人际关系。我当时虽然有一点技术，但经营企业根本上还要靠志同道合的伙伴，我坚信企业经营必须“以心为本”。虽说人心难测，人心易变，但翻阅历史，对自己信服、尊敬的人不惜以死相报，所谓“士为知己者死”“刎颈之交”这类故事不胜枚举。难测的是人心，易变的也是人心，但人的心一旦相通，心心相印，又无比可靠且强大。创业之初，我已经领悟到这个重要道理，决定要以这种心心相印的人际关系为基础，去经营企业。</p><p>为了做到这一点，首先自己对企业经营必须抱有崇高的使命感，然后将这种使命感用明确的语言，告诉可能成为自己的搭档或副手的干部：“我要以这种人生观度过自己的人生，以这种哲学来经营企业，您能赞同我的观点吗？”真心诚意，谆谆相告。对方就会说：“如果您真的这么想，那么我愿意相助到底。”</p><p>结成这种美好的心心相印的关系，除了要将自己的观点坦诚相告，经营者自己必须言行一致，为人可靠，值得别人信赖。在具体工作中，在日常的待人处事中，用行动清晰地体现自己的信念。你真心待人，别人也会真心相报。</p><p>这种心心相印的伙伴从一个增加到两个、三个，如果经营班子有六人，六人都有同样的理念，彼此心心相印，团结奋斗，企业就能顺利发展。对于能够实践经营十二条，即具备“自力”的经营者而言，这些可靠伙伴就构成了“他力”，支持、支撑经营者共图大业。</p><p>经营者首先要构建自己的哲学、理念，然后用它来感化干部，引发共鸣，促使他们成为可靠的合作伙</p><p>伴。</p><p><strong>取得全体员工的信赖和协助</strong></p><p>不仅干部要齐心，全体员工也要同心协力。经营者要在公司内营造一种气氛，让全体员工都能自觉地、积极地工作。办法是通过茶话会等形式，把公司的经营情况和企业的方针告诉员工，提高透明度，同员工们推心置腹：“我按照这样的理念经营企业，对员工们有这样的要求，结果就能为大家带来这样的福利。”让员工们理解并产生共鸣：“为了这样的社长，我们拼命工作，值！</p>'
    },
