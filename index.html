    content: '<p>员工们都表示赞同，爽快地捐出部分奖金。这就是京瓷开展各项社会公益活动的开端。这一精神贯彻至今，从未改变。</p><p>就是说，京瓷创业后不久，全体员工就实践利他的精神，从自己汗水的结晶中拿出一部分，不分多寡，用来与他人分享，为社会出力。</p><p>“为世人为社会尽力，是作为人最高尚的行为。”出于这一信念，我个人在1985年创立了“京都奖”。从我所持的京瓷股票和现金中拨出200亿日元，设立了稻盛财团，遴选在尖端技术、基础科学和思想艺术领域做出优异成绩和卓越贡献的人，彰显其功绩。京都奖及其宗旨受到了广泛好评，现在已成为可与诺贝尔奖相媲美的国际性奖项。</p><p>京瓷迅猛发展，我的资产也水涨船高。但是这资产来自社会各方的支持和努力，我无权将它私有化。社会赐予的财富，或者说社会暂时委托我保管的财产，必须回馈社会，为社会服务--这是设立京都奖的初衷，京都奖是向社会报恩，同时，也是我利他哲学的具体实践。</p><p>这样的慈善事业受到好评，2003年我荣获卡耐基协会授予的“安德鲁·卡耐基博爱奖”。历届获奖者中，有比尔·盖茨、乔治·索罗斯、特德·塔纳等世界著名的慈善家。作为日本人，我第一个获此殊荣，在颁奖仪式的致辞中，我说:</p><p>“我只是一个拼命工作的人，创建了京瓷和KDDI两家企业，所幸的是，企业的发展超乎预想，我也获得了始料未及的巨大财产。安德鲁·卡耐基先生说:‘个人的财富应该用于社会公益。’对此，我高度认同。我自己也一贯持有同样的信念，上天赐予的财富应该用于为社会为世人服务，所以我积极从事各种社会公益和慈善活动。”</p><p>前文提到“求利有道”，我想还要讲“散财有道”。赚钱不易，用钱更难。以利他精神赚来的钱，也要用利他精神花出去。这样才能“正确散财”，为社会贡献出自己的微薄之力。</p><p>日本应将“富国有德”定为国策对同一件事情，从善意的角度思考，还是从恶意的角度思考，自然而然，两者所导致的结果就会截然不</p><p>同o</p><p>比如，与人争执时，总想驳倒对方，总认为错在对方，要逼迫对方认错。这是一种做法。但也可以体谅对方的难处，大家一起出谋划策，共同寻找解决问题的办法。处理同一个问题，结果可以大相径庭，差异就在于有没有体谅对方的关爱之心。</p><p>以前，日本市场对外封锁，围绕这一问题，日美两国争吵不休。当时，我提议，针对两国间的各种课题，成立“日美二十一世纪委员会”，让民间人士发挥作用，彼此坦诚交换意见，借此让日美关系有所改善。为此，我做出了努力。</p><p>我当时的提案是:彼此停止互相指责，摆脱敌意性的争吵。如果不考虑对方的具体情况和背景，光说对方不好，只求对方让步，那么本来可以谈拢的事情也会搞僵。只想占便宜，只想争面子，这样的对话必将无果而终，反而会加深相互间的不信任感。</p><p>所以，首先要尊重对方的立场，不是一味地固执己见，而要充分理解对方的想法，体谅对方的处境，以这种利他之心为基础，推进相互交流和谈判。</p><p>同时，如有必要，日本应该先行让步。为什么这么说，因为第二次世界大战后的日本，受到美国很多的恩惠--慷慨地提供粮食和技术，还向日本产品开放巨大的市场，等等--因此，才有日本二战后的快速复兴和经济的高速增长。</p><p>即便那是美国全球战略的一环，但他们对我们的极度宽容乃是事实。既然如此，今天由我们来表示诚意，体谅对方，该让步处就让步，培育宽容和利他之心。我想，这是已经成为“经济大国”的日本应尽的义务。</p><p>这个委员会，依据上述宗旨，进行了两年的讨论，向日美两国政府提交了建议书。</p><p>要设计今后日本的“国家形象”，关键就是利他精神，就是“以德为本”的治国方略。</p><p>过去，国际日本文化研究中心的川胜平太教授说过一句话:“富国有德。”</p><p>他提议，不是以财，而是以德立国。或者说，运用丰厚的财力，对他人、对他国以德相报。不是用武力，不是用经济力量，而是以德行来为他国行善，由此获得别人的信赖和尊敬。</p><p>我也认为，要把“德”字作为“国是”，定为国策。日本应该率先垂范，做“以德立国”的榜样，因为日本曾有为追求自己一国的私利而痛遭惩罚的历史教训。</p><p>今后日本应该追求的目标，既不是经济大国，也不是军事大国，而是一个以德为本的国家。既不是经济上精于算计的国家，也不是急于炫耀军事实力的国家，而是以“德”这一做人的崇高精神作为国家理念的基。石，据此与世界各国接洽交往。</p><p>一旦成为这样的国家，国际社会就会真正的需要日本，尊敬日本。同时，对这种高品格的国家有侵略意图的人，恐怕不会有吧。从这个意义上讲，这又是最可靠的安全保障政策。</p><p>怎能忘记珍贵的美德</p><p>关于这一点，中国革命之父孙中山，1924年在日本神户做过一次著名的讲演。在这次讲演中，孙中山把欧美文化与东亚文化做了比较，谈到了“王道和霸道”的话题。</p><p>用武力统治他人的文化，欧美有其源流，中国古语称之为“霸道”。与此相对，王道在东亚源远流长，王道就是以德行来引导民众。</p><p>孙中山力劝当时急于扩张军备、扩展领土的日本，不要选择“霸道”，而要选择“王道”。遗憾的是，日本走进了霸道，朝着第二次世界大战径直猛冲。而二战后直到现在，日本又采取了经济霸权主义的政策。</p><p>然而，从今以后，日本这个国家也好，民众也好，如果不将关爱和利他这种“德行”扎根于心，不采用以王道为基轴的国家方针，我非常忧虑，日本仍可能重蹈覆辙，犯下大错。</p><p>天台宗里有“忘我利他”的说法。顾名思义，就是忘却自我，为他人尽力。这是佛教的教义。从日文的发音听来，“忘我利他”同“已受惩戒”一模一样。曾担任天台宗住持的山田惠谛教导我们，这句话应该解读为:“片面追求物欲已受惩戒了，今后应将自己的私事搁在一边，为他人尽力了。</p><p>我之所以强调“忘我利他”，是因为我强烈地感受到，关爱和利他这样的美德，在当下的日本社会几乎丧失殆尽。</p><p>一旦把关爱和利他之心丢光，剩下的就只有赤裸裸的利己的欲望。容忍乃至放任这种利己的欲望，结果必然招致可怕的社会混乱。</p><p>不久前，发生了一名19岁少年将一家四口残杀的惨案。因为罪行重大，他虽未成年，仍然被判处死刑。</p><p>该少年自以为是，曲解法律，他自信只要未成年，犯什么罪都不会判死刑。</p><p>针对这一点，报道这一事件的杂志记者写道:“如果该少年更了解法律的话，或许惨案就不会发生了。”但是，我认为，该少年更应该懂得的是法律之前的问题，就是“不可杀人”这个最基本的道德律、伦理观。“不可杀人”，“不可伤人”这样的问题，不是法律论，而属于道德论的范畴，是最起码的人生观。</p><p>以德为本的人格教育刻不容缓为什么我们会失却最基本的道德规范呢?为什么我们会遗忘关爱之心、利他之心呢?答案很简单，因为大人没有教育孩子。第二次世界大战已过去六十多年，可以说，这一代日本人几乎没有受到任何道德教育。我受过战前教育，对这个问题深有体会。</p><p>过分强调尊重孩子的自主性，结果变成放任自流。只给自由，但与自由结对成双的义务，却几乎不教。</p><p>做人最起码的道德，参与社会生活的最低限度的规则，我们都严重地忽略了。</p><p>自古以来，传授这种生活指南、人生哲学，依靠的是宗教。以佛教、基督教为代表的宗教教义，成为人们在生活中遵循的道德规范。</p><p>在背后干坏事也逃不过神佛的法眼，必将遭受报应;暗中行善神佛也不会忽视--这样的观念来自于信仰。这种信仰促使人们不能不思考:“作为人，应该怎么做才是正确的?</p><p>但是，近代的日本，随着科学文明的发达，宗教遭到打击，连如何做人的道德、伦理、哲学也逐渐为人们所淡忘。</p><p>哲学家梅原猛先生说:“道德沦丧的根源在于宗教的缺失。”我完全赞成。特别是第二次世界大战后的日本社会，从战前以国家神道为核心的思想统治，走向另一个极端，就是在日常生活和教育中，把道德和伦理排除在外。</p><p>近来，社会在提倡“综合教育”，但以道德为中心的人格教育却依然不见动静。加上过分强调所谓“个性教育”，而做人最起码的规矩，最基本的道德，却无人问津。连幼儿园也在标榜“自由教育”，对身心尚未发育的幼儿的行为放任不管。这样的话，在他们长大成人之前，连学习如何做人的机会也没有。</p>'
  },
  '2026-06-26': {
    chapter: '第19天：活法',
    content: '<p>在身心成长的少年期，必须让孩子们学习“作为人应该如何去生活?”给他们慢慢地、认真地思考这个问题的机会。</p><p>另外，学校还应该向学生灌输“正确的职业观”。</p><p>现在的日本已经形成了一个学历社会，只根据学习成绩的优劣将学生区别对待。成绩优秀者可以进入政府机关或者大企业，受到好评。而手脚灵巧，或善于待人接物，这些学业之外的特长都被置之脑后。这种做法，严重扭曲了年轻人的劳动观。</p><p>为了纠正这种倾向，从小学生开始，就要教育孩子，让他们懂得社会上有各种职业，每个领域内都有许多人在辛勤劳动，这才构成了整个社会，人们才能过正常的生活。这样，如果有孩子想当理发师，那么该上什么学校，该考什么证照，这类实用性知识也应传授，这就是职业教育。</p><p>前章中提到过神社的木匠师傅，但不限于木匠师傅，做家具的手艺人、裁缝师傅或者农民、渔夫，无论何种职业，只要认真工作，全力以赴，就能磨炼心志，提升人格。让学生懂得劳动的意义，教育他们树立正确的劳动观，这也是教育的重要使命。</p><p>别让历史重演，构筑新日本</p><p>日本从近代以来，以四十年左右为周期，迎来了一个又一个重大的历史转折。</p><p>11868年一脱离了过去的封建社会，实行明治维新，建立近代国家，开始走上了富国强兵之路。</p><p>21905年打赢日俄战争，成为世界列强，国际地位飞跃提升。之后继续富国强兵，尤其向“强兵”的方向倾斜，向军事大国迈进。</p><p>31945年--第二次世界大战战败。在焦土中奋起，改弦易辙向“富国”方向转变，实现了奇迹般的经济增长。</p><p>41985年一-日本巨大的贸易顺差开始刹车，缔结了诱使日元升值、促进进口的广场协议。这时的日本在达到经济大国的顶峰后，泡沫破灭，经济低迷持续至今。</p><p>审视每四十年一循环的盛衰起落，可以看得很清楚，日本这个国家一贯的方针，都在追求物质的富裕，与别国竞争。尤其在第二次世界大战以后，在“经济增长至上主义”的旗帜下，无论企业还是个人，都不遗余力地、无止境地追逐利益和财富。</p><p>现在，社会、经济持续停滞，要求从根本上转换观念的呼声日益高涨。即便如此，状况却仍然没有什么改观，人们为GDP百分之零点几的增减或喜或忧。我们许多人把经济增长几乎当作是唯一的“善”，争先恐后，希望增长再增长。</p><p>从本质上讲，这是一种霸道的哲学，就是把欲望当动力，依据优胜劣败的原理，让物质追求压倒一切，正是所谓“求利无道”。我们的国家也好，个人也好，至今没有从这种利欲的束缚中解脱出来。</p><p>然而到了今天，显而易见，这种单一的价值观，事实上已经难以为继。过去，我们只是从经济增长中寻求国家认同。但在今后，如果重复这样的思路，只能是再次盲目地跨进四十年一次的盛衰循环，而这一次衰败的程度甚至可能不亚于第二次世界大战的惨败。堕入“下一个巨大谷底”的曲线已经开始呈现，减缓这种下滑的速度变得越来越困难。</p><p>国家和地方的财政赤字不断增加，行政和财政的改革停滞不前，少子高龄化的趋势使社会的活力下降等等，各种征兆已经凸显出来。如果还是袖手不管，到下一个四十年，即2025年前后，不仅未来的展望无从谈起，连国家本身都可能面临覆灭的危机。</p><p>问题已经迫在眉睫，现在就有必要建立新的国家理念，建立新的个人生活的指针，用以替代“经济增长至上主义”。同时，这还不仅仅是一个国家的经济问题，而且也是涉及整个国际社会和地球环境的极其重大且紧急的课题。为什么?因为人类基于贪得无厌的欲望，无止境地追求增长和消费，这种做法如不改变，不仅有限的地球资源、能源终将枯竭，而且整个地球环境也将被破坏殆尽。</p><p>换言之，再这样下去，不仅日本这个国家将归于破灭，而且我们人类将亲手把自己赖以生存的地球毁灭也未可知。不管有没有察觉到这个危机，在行将沉没的船舱中，我们照样追求奢华，醉生梦死一-这种行为空虚而且危险，尽快意识到这个问题的严重性，建立新的哲学，描绘新的航图，已经刻不容缓。</p><p>从自然界学习“知足”</p><p>那么，这种新的哲学究竟是什么呢?用一句话概括，就是“知足”。知足就是今后的日本和日本人最基本的生存哲学。同时还包括伴随知足之心而来的“感谢”、“谦虚”、关爱他人的“利他”的思想和行为。</p><p>知足这种生存模式自然界里就有。食草动物吃某些植物，食肉动物又吃这食草动物，食肉动物的粪便和尸体返归土壤，变成肥料滋养植物。从广义的角度看，貌似弱肉强食的动植物界，实际上处于协调平衡的生物链之中。</p><p>与人类不同，动物自己不会去破坏这种自然的循环。假如食草动物贪得无厌把植物吃光，生物链断裂，不仅食草动物自己无法生存，生物链中的其他生物也将面临灭绝的危险。因此，它们从本能上懂得节制，没有超越自身需求的贪婪。</p><p>狮子饱腹以后不再捕捉猎物，这是本能，也是造物主赐予的“知足”的生存方式。正因为它们从本能上懂得知足，才能长期维持自然界的和谐与稳定。</p><p>人类也应该从自然界中学习“节制”。人类原本也是自然界的一员，也曾理解自然的法则，自己也处于生物链之中。后来，人类从食物链的制约中解放出来，单独摆脱了循环的法则，同时也失却了与其他生物共同</p><p>生存的谦虚。</p><p>在自然界，只有人类才具有高度的“知性”，可以大量生产粮食和工业品，还能够不断开发新技术，来促进生产效率的提高。但是，人类因为具备“知性”而逐渐变得傲慢，企图支配自然的欲望不断膨胀。同时“知足”这道自我节制的防线消失。还想要更多、还想更加富裕，这种贪婪之心赤裸裸地凸显出来，终于威胁到自己赖以生存的地球环境。</p><p>人类一旦觉醒，“利他”的文明之花将会盛开为了避免与地球这条船同归于尽，我们除了重新找回自然的“节度”之外，别无选择。不要再去追求超过自身需求的东西。必须把神灵赐予人类的“知性”变为真正的容智，掌握控制自身欲望的法门。</p><p>就是说，要将“知足”这种生活方式付诸实践。对现在身边之物感觉不足，就会继续追求，那么到手后就会满足吗?绝非如此。</p><p>应该适可而止了，不要再去片面追求经济财富了。国家和个人的目标不是单纯物质的富足，看怎么做才能让大家获得精神的富足，我们应该朝这个方向摸索前进。</p><p>老子说:“知足者富”。这就是“知足”的人生态度。还有一句格言:“当你想要的东西无法到手时，就珍惜你手中已有的东西吧”。“满足是贤者之宝”，知足带来人心的安定，这种思维方式和生活方式，我们必须去实践。</p><p>就是说，私欲的追求要适度，满足于略感不足的状态，剩余的就与人分享。或者给予他人，满足他人。要具备这种度量和慈爱之心。有人说，这种想法过于天真，过于牵强，脱离现实。但我却相信，这样的思维方式可以救日本，往大处说，可以拯救地球。</p><p>但请不要误解，知足的生活方式，绝不是指安于现状、不作任何新的尝试、停滞不前、有气无力、暮气沉沉的那样一种生活态度。</p><p>以经济发展为例，GDP总额不变，可它的内容，即产业结构不断进步，淘汰老的产业，培育新的产业，新陈代谢，生机勃勃。也就是依靠人类的睿智，一个接一个地催生新的事物，充满活力和创造性。若对“知足”的生活方式进行描绘的话，大体就是这个样子。</p><p>这样的设想现阶段近乎是纸上谈兵，但如能实现，我们就能从成长走向成熟，由竞争转为共生，就能走出一条协调发展的道路。</p><p>到那时，以利他、以德为动机的新的文明或许就会诞生。就是说，构筑现代文明的动机是人的欲望想吃得更好，想赚得更多，想过得更快乐。但到了新的时代，想让对方过得更好，想让他人更加幸福，以关怀和爱为基础的利他的文明，或许也将开花结果。</p><p>利他文明的具体形态和内容，我还不可能说得很充分、很清楚，这或许类似画饼充饥，白日做梦。</p><p>但是，我已多次讲过，比实现目标更重要的是，朝着要达成的目标不懈的努力，为实现目标而不断的磨炼心志。如果我们的心志提升了，那么，离知足利他社会的路程也就不远了。</p><p>第五章 与宇宙潮流协调和谐主宰人生的两只看不见的手</p><p>根本而言，人生由看不见的手所主宰，这无形之手有两只。</p>'
  },
  '2026-06-27': {
    chapter: '第20天：活法',
    content: '<p>一只叫命运。每个人来到世上，都带着各自固有的命运。命运的来龙去脉难以知晓，但是我们的人生却处在命运的引导或影响之中。有人对此持有异议，但我却认为，命运的存在乃是毋庸置疑的事实。</p><p>我们确实被某种超越自己意志和愿望的命运之神所支配，它把我们的喜怒哀乐抛在一边，犹如奔腾的江水，裹挟着我们，一刻不休，滔滔流入大海。</p><p>那么，我们在命运面前完全无能为力吗?那也不然。因为还有一只无形的大手在驾驭我们的人生，它叫“因果报应法则”。</p><p>就是说，善有善报，恶有恶报，善因生善果，恶因得恶果，因果规律，单纯明快。</p><p>我们身上发生的各种事情，都有其产生的原因。这原因不是别的，就是我们自己的思想和行为。你在想什么做什么，都成为因，而必生其果，你对所生结果如何应对，又成为因，又必有所果。这种因果规律不断循环，构成我们的人生。</p><p>在本书第一章中，我提出“心不唤物，物不至”。就是说，我们的人生，由我们内心不断的思索描绘所形成。这个结论也是基于因果报应的法则。因为我们心中的思维、基于思维的行为，就是种子，它必然结出相应的果实。</p><p>在第三章中，我强调了磨炼心志、提高心性的重要性，原因也无非是这个因果法则。遵循这个法则，磨炼了心志、提高了心性，就能带来美好的人生。</p><p>命运和因果，这两项重大的原则支配了所有人的人生。命运是经纱，因果报应法则是纬纱，两者交织而成人生之布。</p><p>人生超脱命运的轨迹，那是因为因果法则这个力量在发挥作用;而另一方面，善行有时并不立即产生善果，那是因为命运的力量在干扰。</p><p>在这里，关键的是因果报应的法则要强于命运的法则。主宰我们人生的这两种力量之间也存在着力学上的关系，因果的力量多少要超过命运的力量。正因为如此，我们运用因果报应的法则，甚至可以扭转我们与生俱来的命运。</p><p>所以，想好事、做好事，就可以改变命运的走向，使命运向好的方面转变。我们人在受命运支配的同时，又可以因思善行善而改变自己的命运。</p><p>懂得因果报应法则，就能改变命运</p><p>命运不是宿命，可以运用因果报应法则加以改变一-这不是我随便想象的。而是安冈正笃先生阅读中国古典《阴骘录》时学到的道理。安冈先生是一位对许多政界和经济界人士都有很大影响的思想家。《阴骘录》是明代的一部著作，其中介绍了袁了凡这个人物的故事。</p><p>袁了凡出身医生世家，幼年丧父，由母亲抚育，为继承家业少年了凡正在学习医术。某日有一老人突然来访。老人对了凡说，我是研究理法(易经)的，现奉天命，特来向你传授易学真髓。老人还对了凡母亲说道:“母亲或许期望这孩子将来也当医生，但他不会走这条路。他长大后会接受科举考试，会当上官员。”老人就了凡少年的命运作了种种预测:不仅在几岁时参加什么考试，在多少人中排第几名，而且说了凡很有出息，年纪轻轻就会当上地方长官;结婚却无子，53岁时亡故等等。</p><p>后来了凡的人生果然如老人所言。了凡当了地方长官后，有一次去拜访一家禅寺，与那里的一位有名的禅师一起打坐。那位禅师看到了凡打坐时神清气闲、无思无念，非常佩服，问道:“你坐禅时毫无杂念，很了不起。敢问你曾在何处修行?”了凡回答自己并无修行的经验，并说起了少年时代遇到那位老人的事情。</p><p>“我走过的人生一如老人所言。到了53岁我就将死去，这就是我的命运了。所以我现在已经没有任何烦</p><p>恼。</p><p>不料，那禅师听罢怒喝道:“本以为你是一个人物，这么年轻已经达到了参悟的境界。想不到你竟是一个笨蛋。难道顺从命运就是你的人生?命运虽属天赐，但绝不是不可改变的，它可由人力来改变。只要思善行善，你今后的人生就能超越命运，向更美好的方向转变。”</p><p>禅师解释了因果报应的法则，了凡听得非常认真。此后了凡一心积善，不做坏事。结果据说不可能出生的孩子降生了，寿命也大大超过了老人预言的53岁，最后寿终正寝。</p><p>就这样，由上苍决定的命运也可以用自己的力量加以改变。只要坚持思善行善，因果报应的法则就会发挥它的作用，我们就能超越命运，度过更美好的人生。安冈先生说这就叫做“立命”。</p><p>但是在现实生活中，相信这一法则的人并不多。多数人认为它不符合科学而付之一笑。对照近代的所谓理性，命运之说归于迷信一类。而因果报应，就像骗小孩说“做坏事会遭报应的”被看作一种低级的道德教育的手段。而凭今天的科学水平，还无法证明因果报应这只无形之手的存在。</p><p>如果一做好事立即就有好的结果出现，人们或许很快会相信因果法则的灵验。但原因马上连着结果，今天做好事，明天就见好结果，这样的情形很难出现。</p><p>另外，因果关系很少以一目了然的形态出现，不像一加一等于二那么简单明了，也不是B这个结果，一定由A这个原因决定。为什么呢?前面已经分析了，因为我们的人生是由命运和因果报应两条法则互相交织而成的。</p><p>这两者互相干涉，比如当命运非常恶劣时，做一点好事，并不会出现好的结果，因为仅有的一点善行为强势的厄运所淹没。同样，当好运非常旺盛时，稍稍做点坏事，也不会马上出现恶因招恶果的情形——这样的事情经常发生。</p><p>不必担心结果，因为因果必报</p><p>看不清因果报应这条法则，不肯轻易相信它，这是因为你只从一个短的时段来观察事物。某种思想和行为要作为结果呈现出来，需要相应的时间。在两年、三年这样较短的时段内，结果往往还出不来。</p><p>但是从20年、30年这样的长时段看，因果的吻合度非常之高。自我开始创业以来已有40多年，这期间，我见识了各种人物的兴衰起落。从30年、40年这样的时段观察，几乎所有的人都得到了与他们平日的行为和</p><p>人生态度相一致的结果。</p><p>从长远看，诚实的人，坚持行善积德的人不会总是倒霉;而懒散的人，不负责任的人也不会一直荣耀。</p><p>确实，有人干了坏事却未见恶报，因为他运势尚佳或侥幸逃逸;有人做了好事却未见善报，因为他一时时运不济。但随着时间的推移，状况逐步修正，结果“种瓜得瓜，种豆得豆”，大家各得其所，进入他们应有的境遇。</p><p>原因和结果之间，简直可用等号连接，原因和结果吻合的程度之高甚至可以用“可怕”两个字来形容。</p><p>短期来说或许不尽然，从长期看，善因结善果，恶因招恶果，因果报应准确无误。</p><p>京瓷在几年前，为救助陷于经营困境的复印机厂商“三田工业”，设立了“京瓷美达”，着手公司的重建工作。后来该企业业绩显著改善，巨额债务的偿还时间比原计划大大缩短，现在该企业已经成为京瓷集团重要支柱之一。</p><p>在重建过程中，一位担任过京瓷信息机器部本部长的人物起了关键作用。他担任“京瓷美达”的社长，负责重建工作。而在很久以前，他当过一家新兴通信设备企业的车间主任。</p><p>那家企业当时因行业景气、产品热销而迅猛发展，但潮流一退，业绩一落千丈。接受该企业的请求，京瓷伸出援手，将该企业纳入京瓷集团。这已是20多年以前的事了。</p><p>企业更新重建本来就是件辛苦的事，加上员工中有一部分过激派的工会成员，他们提出了各种非分的要求，甚至闯进我的私宅，诽谤中伤，让我很不愉快，京瓷也受到了伤害。</p><p>本意是救助陷于绝境的企业及其员工，反倒要遭受这种煎熬，我只好拼命忍耐。但过了不久，多数员工终于理解了我的好意，开始感谢京瓷和我的帮助及救援。</p><p>其中有一个人，就是刚才提到的“京瓷美达”的首任社长，他曾是被救助的对象，这次站到了救助他人的一方。此人感触良深:</p><p>“一个被救助的人，现在成了救助别人的人，我感悟到一种命运的轮回。当初受到的恩惠，如今通过重建‘京瓷美达’的机会，得以回报，我感到由衷的喜悦。”</p><p>听到这话，我深有感慨。从长期看，因果确实在循环，善行不会以恶果告终。虽然一时遭到误解，日子不好过，但企业再建成功，最终受到员工的感谢。我深信，善的循环之轮还将继续扩展。</p><p>“为善不见其益，如草里冬瓜自暗应长”。中国明代的《菜根谭》中有这样的句子。意思是，行善没有见到报答，好比草丛里的冬瓜，即使人眼看不到，它照样茁壮成长。</p><p>因果必报，但需要时间。记住这句话，不要因为一时不见效果而焦躁，重要的是平日里不弛不倦，行善积德，坚持不懈。</p>'
  },

    chapter: '第21天：活法',
    content: '<p>宇宙的意志促进森罗万象生生不息因果法则之所以成立，是因为它符合大自然最根本的法则。从长期看，善因招来恶果，恶因导致善果，这种错乱的事情不会发生。善因善果、恶因恶果，一切都将顺理成章，因为这就是天理，就是天意。</p><p>这一观点，思考宇宙形成的过程也能明白。极高温、极高压的基本粒子的聚合体，在130亿年前发生大爆炸而开创了宇宙，直到现在它还在不断地膨胀--这就是所谓“大爆炸理论”，在现代宇宙物理学中几乎已是定论。</p><p>整个宇宙本身犹如一个巨大的生命体，它不停地、无止境地成长(膨胀)，它的成长轨迹大体如下:</p><p>物质由原子组成，原子核又由质子、中子、介子构成。如果将质子或中子击破，就会释放出基本粒子。</p><p>彻底追溯物质的本真，最后将回归到基本粒子。</p><p>就是说，宇宙的诞生，首先是大爆炸使基本粒子互相结合，由此产生质子、中子、介子，由它们组成原子核，再加上电子成为原子。然后，经过核聚变形成各种原子。原子与原子组合成分子，分子再互相结合形成高分子，高分子取得DNA遗传基因后诞生了生命。</p><p>此后，这些原始生命经过亿万年持续的进化，终于孕育出像人类这样的高等动物--也可以说，宇宙的历史，是由基本粒子向高等生命体不断进化发展、生机勃勃的过程。</p><p>那么，为什么会发生这样的进化过程呢?原初存在的基本粒子，保持它原本基本粒子的状态不也可以吗?或者它也可以选择到了原子阶段就停止发展。然而，它一刻不休地、持续不断地生成发展，以至进化成人类这样的高等动物，其中的原因到底是什么?</p><p>那纯粹是偶然的叠加，这是一种看法。但是，这么千辛万苦的生长进化过程，单单是出于偶然，完全是种无目的的行为，这种看法未免不合逻辑。与其这么说，我想，不如把它视作基于天意的必然的过程，这才合乎道理。</p><p>换种说法，宇宙间存在着促使万物生生不息、绵绵不断生长发展的意志和力量，或者可称之为“气”“能量”。而且，它“性本善”，它把人和一切生物、无生物都朝“善的方向”牵引。</p><p>做好事就会有好报，这样的因果法则之所以成立;基本粒子不甘愿停顿，而是结合成原子、分子、高分子，并仍在继续进化一-原因无非是宇宙的意志和力量在引导和推动。</p><p>森罗万象所有事物都要生长发展，一切生物都要朝善的方向前进一-这就是宇宙的意志。换句话说，宇宙间充满了这样的“爱”和“慈悲之心”。</p><p>因此，遵循这莫大的意志(爱)，采取与之协调的思维方式和生活方式，就比什么都重要。思善行善本身，就是顺应和满足宇宙向善的意志，从这里产生好的结果，孕育出了不起的成果，那是理所当然。</p><p>也就是说，前面谈到的感谢、诚实、勤奋工作、率直之心、天天反省、不憎恨、不妒忌、先人后己的利他精神.....这些善念与善行都是顺应宇宙意志的行为。所以，必然会引导人走向成功，让人的命运变得丰富多彩。与宇宙的意志和趋向是否“同调”，这决定了人生和事业的成败。</p><p>原理就这么简单。宇宙本身具备让万物向善的意志，促使宇宙间一切事物成长发展。因此，宇宙间森罗万象都成长发展乃是必然，我们人类自然不会例外。</p><p>所以，只要秉持与宇宙意志相同的思维方式和生活方式，工作就一定会顺畅，人生就一定能幸福。</p><p>“伟大之物”向一切事物注入生命生命不是偶然因素的叠加，而是宇宙意志必然的产物。这一观点并不新鲜。前文提到的筑波大学名誉教授村上和雄先生用“SomethingGreat”即某种“伟大之物”，来表达造物主的存在。</p><p>村上先生是全世界著名的遗传基因研究的权威。他说，从事遗传基因的研究，让你不能不这样想:“这个宇宙中，有超越人类智慧的、不可思议的意志在发挥着作用。”</p><p>无论是人、动物、植物，甚至霉菌、大肠杆菌等原始生物，其遗传基因，全都使用由相同的四个文字组成的“密码”来记录遗传信息。令人惊叹的是，人这样的高等动物，其基因居然也是由这区区四个文字记录的信息所组成。</p><p>人类的一个细胞中，写入了多达30亿个遗传基因的信息。这信息量换算成书的话，相当于1000本、每本厚达1000页的书。具备如此庞大信息量的基因，就记录在构成人体的60万亿个细胞的每一个之中。</p><p>更令人惊奇的是，记录这些基因信息的DNA却是那么的微小。把地球上60亿人的DNA全部集合在一起，其重量仅仅相当于一颗米粒。</p><p>如此微小的空间中，居然记录了如此骇人的庞大信息，而且井然有序，纹丝不乱。而地球上一切生物，都因相同的四个文字组成的基因密码而生存。</p><p>想到这些，只能说是奇迹了。把这说成是由于某种偶然而碰巧产生的结果，未免牵强附会。一定存在着远远超越人类想象的、主宰整个宇宙的某种“伟大之物”--如果我们不作这样的假设，事情就无法解释-村上先生把这种存在起名为“SomethingGreat”。</p><p>我们不知道“SomethingGreat”究竟是什么，只能说它是创造宇宙和生命的伟大的存在。有人称之为神，我说那是宇宙的潮流或宇宙的意志。不管怎么说，它或许是人类有限的能力所“不可知的”。</p><p>然而，这“伟大之物”的存在，应该予以肯定。如果否定它，那么宇宙的生成发展，生命的奥秘，生命的精致的结构，就统统无法解释。</p><p>我们人类，不过是从“伟大的存在”那里借来了生命的力量，并加以使用而已。宇宙造物主创造的生命能量无所不在，不断向万物注入“生命”。那也是让万物“生机勃勃”的爱和力的体现。</p><p>来举一个例子。30多年前，京瓷的再结晶宝石首次合成成功，这时候我就感觉到了上述的“宇宙意志”的存在。这种人工宝石的成分结构与天然宝石完全相同。比如制造祖母绿宝石，就使用与祖母绿成分相同的金属氧化物，将它从高温慢慢冷却，用这样的方法来制造。</p><p>把熔融的、颜色鲜红的金属氧化物逐渐冷却，在这个过程中放进小块天然结晶物作为种子，像培育它长大一样，让它再结品。这颗种子何时投入，极为微妙而且非常困难，过早投入，因为高温，晶体会熔化，投入过迟，晶体就难以长大。</p><p>经过七年的反复试验摸索，再结晶技术大功告成。在分毫不差的、精确的时刻，投入小小的天然宝石晶体，然后注视它“越长越大”的样子，宛如看到了生命成长的过程。这就让我感觉到，是某种神秘的力量在促使这种现象发生。</p><p>这个例子使我产生一种感觉:在宇宙间存在着某种沉静而强韧的意识、思想、爱、力、能量一一肉眼虽然看不到它，但它却客观存在着。是它让物质看起来就像一个生命体，是它让万物“生机盎然”。</p><p>它遍布在无限的空间，是一切生命力的源泉，它主宰万物的诞生、成长、消亡，它是一切事物、一切现象的母体，也是动力。</p><p>宇宙的意志，“SomethingGreat”、造物主的看不见的手，怎么称呼都可以。这是用科学之尺无法测量的、不可知的力量和智慧，但相信它的存在，对我们的日常生活有益无害。这是我的观点，因为相信这个“存在”，不仅能决定我们人生的成败，而且可以消除人的傲慢之恶，带来谦虚之德和善。</p><p>我为什么皈依佛门</p><p>那么，宇宙的意志、造物主究竟抱着怎样的期望让我们降生于世、授予我们不可重复的人生、并让我们自然地成长发展呢?换句话说，我们应该如何生存才能顺应这个巨大的期望呢?这虽然是一个超越人类智慧的莫大的疑问，然而我认为，除了“提升心性”之外，再无别的答案。</p><p>前文多次讲述，要带着一颗比降生时稍稍善良、稍稍美丽的心灵离开人世，从生至死都要尽力去思善行善，陶冶人格，使人生终点时灵魂的品格比起点时有所提升。宇宙和自然之所以授予我们生命，就出于这一目的，如此而已。</p><p>在这个巨大的目的面前，我们个人在世时积累的财产、名誉、地位就显得微不足道。事业成功，飞黄腾达，富可敌国，所有这一切，与“提升心性”相比，犹如尘埃，不足挂齿。</p><p>宇宙意志为人类生命所设定的最终目标，就是磨炼心志这一条。宇宙赋予我们的这个人生，不过是修炼我们灵魂的道场。</p><p>磨炼心志、提升心性，要点在于日常生活中的“精进”。我在前文中已屡次三番强调。释迦归纳的修行法则“六波罗蜜”--布施、持戒、精进、忍辱、禅定、智慧这六项，我们只要牢记并每天实践，我们的心性、我们的灵魂就能够向上提升。</p>'
  },
  '2026-06-29': {
    chapter: '第22天：活法',
    content: '<p>上述道理，虽然朦胧，我却有切身的感受。我遵循这道理一路走来。刚才提到，迎来65岁的时候，为了重新理解人生的意义，为了获得真正的信仰，我决心皈依佛门。</p><p>多年前我就打算，60岁时退出经营第一线转入佛门。但临近花甲之年，手机事业方兴未艾，身不由己，我无法抽身。直到65岁，再也不能拖延了，我决心退居二线，仅担任京瓷和DDI的名誉会长，剃度进入佛门。</p><p>我原本就把自己的人生分为三个阶段。如果寿命为80岁，第一个阶段20年，是从诞生起，到独立迈步人生这个时期。第二个阶段从20岁到60岁的40年，是悉心钻研、奋发努力、为世人为社会做贡献的时期。</p><p>第三个阶段，从60岁开始的20年，应该是为死亡(灵魂新的旅程)做准备的时期。如同从出生到踏入社会要花20年的准备时期一样，我认为迎接死亡也需要20年的准备时期。</p><p>人死后肉体消亡，但灵魂永存不灭。我有此信仰，在我看来，现世的死亡，归根到底，无非是意味着灵魂开始新的征程。所以，对于这新的旅行应该做好周到的准备。我决定出家，就是为了再次学习人生的意义，为死亡做好准备。</p><p>不完美不要紧，贵在持续“精进&quot;</p><p>出家以及随后的修行，对我而言果然是一种严肃的、新鲜的体验。从托钵化缘等修行中，我更深刻地体会到佛陀的慈悲。出家后，我发现了过去未见过的新的世界，而有的观念，比如人生必须努力，同过去比没有变化，但出家后我更确认了这一点。</p><p>有禅语说:“悟道前，伐木、担水;悟道后，伐木、担水。”进入佛门后，我依然在俗世的风尘中劳作奔波，但我感觉到，在我的内心深处确实发生了某些变化。</p><p>比如，通过修行，我重新痛感到自己尚有不成熟的一面。过去，我作为企业的领导者指导下属，训示部下时似乎自己很了不起。把自以为十分明白的道理，写进书里或去演讲。修行让我省悟到，在我内心还潜藏着马虎随意、令人厌恶的东西。</p><p>另外，有一点令我印象深刻，就是真正了不起的人往往隐于市井。我说的这种人具备美好的心灵，他们或者是街头巷尾心地善良的老妇人，或者是正在都市的一角朝着目标奋进的年轻人。</p><p>我再次感觉到，比起某些有名誉、有财产、所谓功成名遂的人，这些默默无闻的人更为高尚，因为他们富于同情人，能够无私地关爱他人。</p><p>我还有一种感觉，就是我们凡夫俗子不管如何努力修行，要真正参悟恐怕是不可能的，普通的人要达到开悟的境界归根到底是不可能的。</p><p>在出家仪式上，导师问我能否遵守十项戒律。我回答我一定好好遵守，这才获得进入佛门的许可。尽管我慎重地发誓持戒，并已经成为一名僧人，但我想，要完全遵守这些戒律恐怕自己还是做不到。</p><p>再怎么努力持戒，勇于精进，花几百个小时去坐禅，最后仍不能踏入悟境。像我这样意志薄弱、无法完全摆脱烦恼的人，为磨炼心志，无论做多少好事，还是做不到完全消除私欲、时刻以利他之心行事的境界。无论怎样努力持戒也难免破戒。包括我自己在内，人往往就是这么愚蠢、脆弱、不完美。</p><p>但是，我认为就是这样也不要紧。朝着参悟的境界努力，最终达不到那样的境界。但坚持朝那个方向努力，决不半途而废，这种精神本身就非常可贵。</p><p>即使没能完全守戒，但要有努力去遵守的愿望，非遵守不可的想法，没能遵守时真挚的反省、自责，这些才是非常重要的。抱着这种心态度过每一天，那么，就算到不了悟境，也能很好地磨炼心志，得到救赎。通过出家、修行，我对这一点产生了信念。</p><p>神佛或宇宙的意志，并不是要爱已经成就了某种事业的人，而是爱努力想要去达成某种事业的人。想要达成却没能达到，反省自己的不足，从明天开始依然坚忍不拔，朝想达成的目标继续努力。这样的人才能获</p><p>得拯救。</p><p>想要遵守戒律，想要实现目标，只要朝这方向不懈努力，就能磨炼心志吗?</p><p>“Yes”</p><p>这样做我们就能获得救赎吗?</p><p>这答案也是“Yes”。</p><p>就是说，想要提升心志的愿望以及付诸实行的过程，这才是真正可贵的，这就能够磨炼我们的心志。因为这顺应佛陀的慈悲，符合宇宙的意志。</p><p>心中存在真理的“内核&quot;</p><p>我考虑，人的心灵呈现多重结构，由多个同心圆组成。从外侧开始依次是:</p><p>1知性一-后天掌握的知识、道理、逻辑。</p><p>2感性主宰五感及感情等精神活动的心。</p><p>3本能--维持肉体需要的欲望等。</p><p>4灵魂--裹在真我外层的、现世的经验与业障。</p><p>5真我一-位于心灵中心的内核，充满真、善、美。</p><p>我们心灵的中央部位存在“真我”，其外围环绕着“灵魂”，而“灵魂”外侧覆盖着“本能”。人以这样的“心态”降临人世。比如，刚出生的婴儿，肚子饿了就要吸吮母乳，这是位于心灵最外层的本能形成的“业”。</p><p>然后伴随人的成长，在“本能”外侧形成了“感性”，又在“感性”外侧形成了“知性”。就是说，人在出生、成长过程中，心灵会从中央向外拓展，形成多层结构。相反，随着年龄逐渐衰老，由外向内一层层“剥落”。</p><p>比如，老年痴呆的发展，首先是知识、道理、逻辑推理等“知性”的功能开始衰退，老人变得像孩子一样感情外露。接着感情、感性逐步迟钝，本能凸显。再后来本能(生命力)也弱化，慢慢进入死亡。</p><p>这里的关键是，位于心灵中央部位的“真我”以及“灵魂”，这两者区别何在?所谓真我，瑜伽认为，正如字面之意，是形成心灵核心的“芯”，是“真的意识”。佛教称之为“智慧”。一旦到达此种开悟的境界，就能通晓贯穿于宇宙的一切真理，也可以说那是神佛思想的投影，是宇宙意志的体现。</p><p>佛教认为“山川草木悉皆成佛”，意思是万物中都宿有佛性。真我就是佛性本身，就是宇宙的容智本身，就是万物的真理，一切事物的本质。这样的真我存在于我们心灵的正中央。</p><p>真我就是佛性，因而它完美至极，它充满着爱、诚以及协调和谐，它兼备真、善、美。人类为什么向往并不懈地追求真、善、美呢?因为人的心灵的中央存在真我，真我具备真、善、美。正因为我们心中本来就潜藏着真我，我们才会苦苦追寻，锲而不舍。</p><p>灾难消“业”该庆贺</p><p>然而，如此美好的真我却被“灵魂”紧紧包裹。如果真我相当于一丝不挂的裸身，那么灵魂就是穿在身上的衣裳。这衣裳里蓄积了这个灵魂往世经历过的一切思想、行为、意识、体验，同时这衣裳里还添加了今世自己的各种所思所为。</p><p>所谓“灵魂”，它收纳了人在多次转世投胎过程中累积的所有“业障”，一切善念恶念，善行恶行统统囊括其中。这样的灵魂包围着位于心灵中央的真我。因此，虽然真我是万人共通，灵魂却因人而异。</p><p>记得小时候母亲曾说我“你的灵魂不好”。鹿儿岛人对脾气不好、性格执拗的人常这么形容。这说明我虽还年幼，但在我的灵魂里已掺杂了某些不好的“业”，这种“业”扭曲和玷污了我心灵的一部分。母亲看出了这一点。</p><p>那么，像污垢一样紧紧依附在灵魂上的所谓“业”，究竟是什么东西呢?有关这一点，我出家时关照我的西片担雪老师(西片老师现为临济宗妙心寺派的掌门人)的谆谆教诲，给我留下了深刻的印象。</p><p>那已经是将近20年以前的事了。京瓷未经认证许可，就生产、销售了用精密陶瓷制造的人工膝关节，当时受到了来自媒体的大肆批判。</p><p>这之前，用精密陶瓷制造的股关节已获认证并投入了生产，因为医生和患者的迫切要求，才将这种技术应用于膝关节。有这个原委，加上我又不是故意违规，原本可以为自己辩解，但我并没有这么做，而是甘愿接受舆论的责难。</p><p>我去拜访担雪老师，告诉他:“最近碰到这样的事，心里不胜其烦。”老师通过报纸好像也知道了这件事。我想他一定会出言安慰我。不料，老师一开口就说道:</p><p>“是很够呛，但也没办法，只要活着，辛苦委屈乃是必然。”</p><p>接下来，他又说了下面一段话:</p><p>“灾难来临，不可消沉，要高兴才对。灾难能把长期以来依附在灵魂上的业障消除。这种程度的灾难就能消除业障，稻盛君，该庆贺才好啊!</p><p>就是这一句话救了我。社会的批评，也可以看作“上苍给予我的考验”，我应该坦然接受。老师的开解是最高的教诲，胜于任何安慰我的话语。我从中学到了人活着的意义，以及其中蕴藏着的伟大真理。</p><p>与其追求开悟，不如运用理性和良心去磨砺心志</p>'
  },
  '2026-06-30': {
    chapter: '第23天：活法',
    content: '<p>谈到灵魂，许多人会表示抵触。但是，我们常常听到的或者我们体验到的一些个案，如果否定灵魂的存在就无法解释。</p><p>所谓“濒死体验”就是其中之一。因疾病或事故“死过”一次的人，会感到自己从身体中飘浮出来，从上面看到自己躺在床上接受治疗的情形，或者会窥见不可思议的世界。经历过这种体验之后，再度苏醒，起死回生，我的朋友中就有经历过“濒死体验”的人。</p><p>这位朋友半夜里心脏病发作被送进医院，心脏一度停止跳动，在医生们的奋力抢救之下又活了过来。在这一段时间里，他说他在某个鲜花盛开的草原上散步，不知为什么，我从对面走过来，问道:“你在干什么?”就在这一瞬间，突然有了意识，在床上苏醒过来。</p><p>听身边的人讲这样的体验，不禁让我再次感觉到，肉体和灵魂是两回事。因为他告诉我，他在死亡的边缘看到的景色是一个真实的世界。肉体死了，但自己却来到某处的“另一个世界”，甚至清楚地记得那里的景色。对此，我的理解是:在与肉体不同的某个地方存在着灵魂。</p><p>依据佛教轮回转生的思想，我们在降临人世时，灵魂带着到前世为止所积累的“污垢”，也就是业障而来。在这之上，当我们死的时候，灵魂再载上今世所造的业障而去。</p><p>而且，在灵魂的内侧，隐藏着真我一-纯净的、美好的、伴有佛性的、永世不灭之心。如果真我原形显露，那么人就会以美好的心灵思善行善，就会像佛祖一样慈悲。但是，人成不了佛，那是因为在真我的周围覆盖着带有业障的灵魂，再向外还有一层充满欲望的本能....·.如此层层的障碍阻挡了真我的展现。</p><p>坐禅和瑜伽等修行，目的也是磨炼心志，就是从心的外侧向着内侧，像研磨镜片一样，一层一层磨掉位于真我外侧的障碍。</p><p>首先磨去最外层的知性到达感性，感性磨去之后到达本能，再磨掉本能.....直到最后真我完全展露，这种从外向内彻底的心灵磨炼即为修行。所谓开悟，就是指磨炼心志到达真我的状态。</p><p>通过修行到达真我的话，我们就能理解一切真理，得到佛的智慧。达到这种境界的人，就不再会被本能和感性所迷惑，就能够把“为世人为社会尽力”作为自己的人生态度。</p><p>然而，前面已经讲过，普通的人最后也到不了开悟的境地，凡人磨炼心志要达到真我的程度几乎是不可能的。</p><p>那么，应该怎样做才好呢?我认为运用理性和良心来抑制感性和本能，去控制它们，这种努力非常重</p><p>要。</p><p>遵循发自真我及灵魂的理性与良心，把正确的伦理观、道德观注入心中，也就是遵照“为世人为社会尽力”的思维方式，把“知足”的生存方式铭刻于心，放弃无止境追求欲望的贪婪之念。</p><p>这样不断地用理性和良心来制约感性和本能，一步步度过自己的人生，积累“为善的经验”，就能磨炼心志，自然而然地向悟道的境界靠拢。通过这样的修行变得高尚的灵魂，不仅在现世能发挥作用，而且会延续到来世。</p><p>凡是存在都有价值人的本质是什么?我们为何来到这个世界?这样的问题，只要我们一息尚存，就是我们永恒探究的课题。井筒俊彦先生是伊斯兰哲学和东方哲学的大家，围绕人的本质是什么这一问题，他讲了下面一段意味深长的话:</p><p>当通过冥想去解明人类本质的时候，会慢慢地接近一种精妙的、纯粹的、感觉无限透明的意识，这时自我存在的意识非常清晰，但除此之外的五感却完全消失，最后到达只能称之为“存在”的意识状态。与此同时，就能意识到森罗万象一切事物，都由这种所谓“存在”所构成。正是这种意识状态才揭示了人类的本质。</p><p>接受井筒先生这一观点，文化厅长官同时也是心理学家的河合隼雄先生，通过与花儿的对话，幽默地比喻道:“你这个存在，现在正扮演着花朵吧，而我这个存在正扮演着河合隼雄呢。”平时看到花儿时，我们会说:“这里有花”，就是这里存在着花。而按照上述的逻辑，可以说成“存在正扮演着花的角色”。</p><p>就是说，把构成生物属性的东西一一肉体和精神、意识和知觉一一全部除去之后，就出现“只能以 ‘存在’命名的东西”。以这种“存在”为核心，形成我们人和其他各种生命。而且这个“存在”是所有生命所共有的，有的时候，“存在”以花的形式出现，另一种场合“存在”又扮演人的角色。</p><p>因此，我也不例外。稻盛和夫这个人并不是原来就存在的，只不过是某种“存在”偶然借用了我的形骸罢了。创立京瓷和KDD这样的企业，并没有非我不可的必然，我不过是扮演了上苍偶尔赋予我的角色而已。</p><p>所有的人都由上苍赋予了任务，都在出演各自的角色。从这个意义上讲，每个人的“存在”都有同样的分量。在前文中已经阐明，万事万物，不仅是人类，包括生物，一草一木，甚至路边的石块，都有造物主赋予的作用，都是基于宇宙的意志而存在。</p><p>实际上，宇宙存在着“能量守恒定律”。构成宇宙的能量，形态可以改变，其总量却是恒定不变的。比如，把树木砍下用作柴薪燃烧，原来以树的形态存在的能量，转换成热能，变成了气体的能量，但能量的总和保持不变。</p><p>既然如此，即使一个小小的石块，它也是构成宇宙不可或缺的存在，再怎么渺小的东西，如果缺了它，宇宙就不成其为宇宙。</p><p>踏着人生的正道，走向光明的未来</p><p>所以，宇宙间森罗万象、一切事物，都是浩瀚宇宙生命的一部分，绝不是各自偶然的产物，不管哪一个个体都因宇宙需要而存在。</p><p>其中，我认为人类肩负着更大的使命。人类具备知性和理性，带着满怀爱和同情的心以及灵魂降生于地球--正因为“人为万物之灵”，所以上苍赋予了人类极为重大的任务。</p><p>因此，我们有义务了解这个任务，认识自己的使命，尽一生的努力去磨炼灵魂。为了让灵魂比降生时更为美好，我们必须精进再精进。人为什么活着?我认为答案也在这里。</p><p>勤奋工作，满怀感谢之心，思善行善，真挚地反省，严格地自律，在日常生活中不懈地磨炼心志、提升人格。换句话说，全力以赴去做好上述理所当然的事情，这就是人活着的意义之所在。我认为，除此之外，人生再无别的意义。</p><p>社会的混迷还在加深，现在人类的生活好比在漆黑的夜里摸索着前行。尽管如此，我们仍然怀抱梦想和希望，描绘光明的未来。人人都拥有充实的人生，人人都过上幸福的生活-一我从内心祈求这个美好社会的到来，同时我相信这个愿望一定能够实现。</p><p>因为只要大家按照本书所阐明的“活法”去生活，那么，个人的人生也好、家庭也好、企业也好，甚至国家也好，就一定能向好的、正确的方向前进，就一定能获得丰硕的成果。</p><p>首先是自己，接着尽可能让更多的人理解各自承担的崇高使命，作为人应该做的正确的事情，以正确的方式贯彻到底。我相信，这样的“活法”一定能够迎来光辉灿烂的黎明。</p><p>后记</p><p>作为本书书名的所谓“活法”，不仅是指个人的“活法”，而且把视野扩展到企业、国家、整个人类和人类的文明。</p><p>因为企业、国家、人类都不过是个人的集合体，在应该具备的、理想的“活法”这一点上，没有任何差</p><p>别。</p><p>在青少年时代，尽管生活充满挫折，我依然不懈地追求理想;当上了经营者，在经营企业的实践中，我追求正确的经营哲学，依靠这种哲学，带领大家走向了成功和繁荣;从经营第一线退出后，通过对佛教的信仰，我反复思考人生的意义。</p><p>就是这样，在不同时期，我始终从正面忠实地面对自己的人生，在这个过程中，我逐步确立了自己的人生观，或者叫“活法”。</p><p>在本书中，我尽心尽力，把我思考的“活法”坦率地、毫无保留地告诉大家。</p><p>本书搁笔时，一种满足感包围了我。我觉得我恰当地、尽情地表达了我的思想。</p><p>在物欲横流的今天，我希望有更多的读者翻阅这本书。在人们摸索人生真理的过程中，这本书或许能成为行动的指针。</p><p>本书的出版，承蒙SUNMARK出版社社长植木宣隆先生、编辑部斋藤龙哉先生全力支持，并得到京瓷秘书室室长大田嘉仁先生、经营研究部粕谷昌志先生的协助。在此，向他们，并向为此书出版作出努力的所有人士表示衷心的感谢。</p><p>稻盛和夫</p><p>2004年7月</p>'
  }
};

      if (!loginState) await auth.anonymousAuthProvider().signIn();
    } catch(authErr) { console.warn('[Cloud] auth skipped:', authErr.message || authErr); }

  } catch(e) { window._cloudError = '初始化失败(' + (e.message || '') + ')'; return null; }

async function hmacSha1(key, msg) {
  var enc = new TextEncoder();
  var keyData = (typeof key === 'string') ? enc.encode(key) : key;
  var msgData = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var cryptoKey = await crypto.subtle.importKey('raw', keyData, {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha1Hash(msg) {
  var enc = new TextEncoder();
  var data = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function cosSignHeaders(method, path) {
  var now = Math.floor(Date.now()/1000);
  var keyTime = (now-60)+';'+(now+3600);
  var signKey = await hmacSha1(COS_CONFIG.SecretKey, keyTime);
  var httpString = method.toLowerCase()+'\n'+path+'\n\n\n';
  var httpStringHash = await sha1Hash(httpString);
  var stringToSign = 'sha1\n'+keyTime+'\n'+httpStringHash+'\n\n\n\n\n';
  var signature = await hmacSha1(signKey, stringToSign);
  var auth = 'q-sign-algorithm=sha1&q-ak='+COS_CONFIG.SecretId+'&q-sign-time='+keyTime+'&q-key-time='+keyTime+'&q-header-list=&q-url-param-list=&q-signature='+signature;
  return { Authorization: auth };
}
async function uploadToCloud(blob, fileName) {
  try {
    var filePath = '/'+COS_CONFIG.Bucket+'/recordings/'+fileName;
    var url = 'https://'+COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com/recordings/'+fileName;
    var headers = await cosSignHeaders('PUT', filePath);
    headers['Host'] = COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com';
    var result = await new Promise(function(resolve,reject){
      var timer = setTimeout(function(){reject(new Error('上传超时'));}, 30000);
      fetch(url, {method:'PUT', headers, body:blob}).then(function(res){
        clearTimeout(timer);
        if (res.ok||res.status===200) { resolve(url); }
        else { res.text().then(t=>{reject(new Error('HTTP '+res.status));}).catch(()=>{reject(new Error('HTTP '+res.status));}); }
      }).catch(function(err){clearTimeout(timer); reject(new Error('网络错误: '+(err.message||err)));});
    });
    return result;
  } catch(e) { throw new Error(e&&e.message?e.message:String(e)); }
}
async function saveRecordToDB(record) {

  try {

    const res = await db.collection(DB_COLLECTION).add(record);
    return res;
  } catch(e) { console.error('[DB] save fail:', e); return null; }
}
async function queryAllRecords(limitCount) {
  const cloudApp = await initCloud();
  if (!cloudApp) return [];
  try {

    return res.data;
  } catch(e) { return []; }
}

// ===== RECORDING - FIXED VERSION =====
// States: 'idle' | 'recording' | 'done'
let recState = 'idle';
let mediaRecorder = null;
let recordedChunks = [];
let mediaStream = null;
let recordTimer = null;
let recordSeconds = 0;
let currentBlob = null;

function handleRecordClick() {
  if (recState === 'idle') {
    startRecording();
  } else if (recState === 'recording') {
    stopRecording();
  } else if (recState === 'done') {
    // Click mic icon again = start new recording
    resetRecording();
    startRecording();
  }
}

function handleActionBtnClick() {
  // "重新录制" button
  resetRecording();
}

function resetRecording() {
  recState = 'idle';
  currentBlob = null;
  recordSeconds = 0;
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var uploadStatus = document.getElementById('uploadStatus');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn';
  btn.textContent = '🎤';
  btn.title = '点击开始录音';
  status.className = 'record-status';
  status.textContent = '点击麦克风开始朗读录音';
  duration.textContent = '';
  actionBtn.style.display = 'none';
  uploadStatus.className = 'record-upload-status';
  uploadStatus.textContent = '';
  playback.className = 'record-playback';
}

function startRecording() {
  var status = document.getElementById('recordStatus');
  var btn = document.getElementById('recordBtn');

  // 立即给点击反馈
  btn.style.opacity = '0.6';
  setTimeout(function(){ btn.style.opacity = ''; }, 150);

  var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost && location.protocol !== 'https:') {
    status.textContent = '⚠️ 请使用 HTTPS 访问（或本地 localhost 预览）';
    status.style.color = '#ff6b6b';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ 您的浏览器不支持录音，请用手机浏览器打开';
    status.style.color = '#ff6b6b';
    return;
  }

  status.textContent = '🎤 正在请求麦克风权限...';
  status.style.color = '#ffa502';

  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function(stream) {
      mediaStream = stream;
      recordedChunks = [];
      recordSeconds = 0;

      let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        currentBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        onRecordingDone();
      };

      mediaRecorder.start();
      recState = 'recording';

      var duration = document.getElementById('recordDuration');
      btn.className = 'record-btn recording';
      btn.textContent = '⏹';
      btn.title = '点击停止录音';
      status.className = 'record-status active';
      status.textContent = '🔴 正在录音中... 点击⏹停止';
      status.style.color = '';
      duration.textContent = '已录 0秒';

      recordTimer = setInterval(function() {
        recordSeconds++;
        var m = Math.floor(recordSeconds / 60);
        var s = recordSeconds % 60;
        duration.textContent = '已录 ' + (m > 0 ? m + '分' : '') + s + '秒';
      }, 1000);
    })
    .catch(function(err) {
      var errMsg = err && err.message ? err.message : String(err || '');
      if (errMsg.indexOf('Permission') >= 0 || errMsg.indexOf('Denied') >= 0 || errMsg.indexOf('denied') >= 0) {
        status.textContent = '⚠️ 麦克风权限被拒绝，请在地址栏允许后重试';
      } else if (errMsg.indexOf('NotFound') >= 0) {
        status.textContent = '⚠️ 未检测到麦克风设备';
      } else {
        status.textContent = '⚠️ 录音启动失败：' + (errMsg || '未知错误');
      }
      status.style.color = '#ff6b6b';
    });
}

function stopRecording() {
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  recState = 'done';

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function onRecordingDone() {
  var m = Math.floor(recordSeconds / 60);
  var s = recordSeconds % 60;
  var timeStr = (m > 0 ? m + '分' : '') + s + '秒';

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn done';
  btn.textContent = '✅';
  btn.title = '录音完成，点击重新录制';
  status.className = 'record-status done-status';
  status.textContent = '✅ 录音完成！共朗读 ' + timeStr;
  duration.textContent = '点击播放器回听，或点击麦克风重新录制';

  // Show playback
  var player = document.getElementById('recordPlayer');
  player.src = URL.createObjectURL(currentBlob);
  playback.className = 'record-playback show';

  // Show redo button
  actionBtn.textContent = '重新录制';
  actionBtn.className = 'record-action-btn redo-btn';
  actionBtn.style.display = 'block';

  // Save read time to checkins
  var today = todayStr();
  var checkins = getCheckins();
  if (!checkins[today]) checkins[today] = {};
  if (typeof checkins[today] === 'string') checkins[today] = { time: checkins[today] };
  checkins[today].readTime = timeStr;
  checkins[today].readSeconds = recordSeconds;
  saveCheckins(checkins);

  // Upload in background
  doUploadAudio(today, timeStr);
}

async function doUploadAudio(dateStr, durationStr) {
  var statusEl = document.getElementById('uploadStatus');
  statusEl.className = 'record-upload-status show';
  statusEl.innerHTML = '<span class="loading-spin"></span> 正在上传录音到云端...';

  try {
    if (!currentBlob) { statusEl.textContent = '⚠️ 无录音内容'; return; }
    var userName = localStorage.getItem(USER_KEY) || '匿名';
    var timestamp = Date.now();
    var safeName = dateStr + '_' + userName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '') + '_' + timestamp;
    var fileId = await uploadToCloud(currentBlob, safeName + '.webm');
    var dayIdx = getDayIndex(dateStr);
    var chapterInfo = bookContent[dateStr] || {};
    await saveRecordToDB({
      userName, date: dateStr, dayIndex: dayIdx,
      chapter: chapterInfo.chapter || '',
      duration: durationStr, fileSizeKB: Math.round(currentBlob.size/1024),
      fileId: fileId || '', createdAt: new Date()
    });
    statusEl.style.color = '#2ecc71';
    statusEl.textContent = '☁️ 录音已上传至云端！';
  } catch(err) {
    statusEl.style.color = '#f5c518';
    statusEl.textContent = '📱 录音已保存本地，云端上传失败（可回听）';
    console.warn('[Upload] failed:', err);
  }
}

// ===== UTILITIES =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getCheckins() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveCheckins(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getDayIndex(dateStr) {
  const start = new Date(START_DATE + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - start) / 86400000) + 1;
}

// ===== INIT =====
function init() {
  renderToday();
  renderCalendar();
  renderHistory();
  updateStats();
  loadAudioWall();
}

// ===== TODAY =====
function renderToday() {
  const today = todayStr();
  const checkins = getCheckins();
  const data = bookContent[today];
  const badge = document.getElementById('todayBadge');
  const chapter = document.getElementById('todayChapter');
  const contentEl = document.getElementById('todayContent');
  const btn = document.getElementById('checkinBtn');
  const statusBox = document.getElementById('statusBox');

  if (!data) {
    const isBeforeStart = new Date(today) < new Date(START_DATE);
    badge.textContent = isBeforeStart ? '待开始' : '已结束';
    chapter.textContent = isBeforeStart ? '读书计划尚未开始' : '《活法》全书共读圆满完成！';
    contentEl.innerHTML = isBeforeStart
      ? '<p>读书打卡活动将于 <strong>2026年6月8日</strong> 正式开始，请耐心等待！</p><blockquote>人生的意义在于磨炼灵魂——稻盛和夫</blockquote>'
      : '<p>🎉 恭喜您完成了《活法》全书23天的阅读打卡之旅！</p><blockquote>感谢陪伴，继续前行！</blockquote>';
    btn.textContent = isBeforeStart ? '⏳ 尚未开始' : '✅ 已全部完成';
    btn.disabled = true;
    statusBox.className = 'status-box ' + (isBeforeStart ? 'not-started' : 'completed');
    statusBox.textContent = isBeforeStart ? '活动将于 6月8日 开始' : '《活法》全书共读圆满完成！';
    return;
  }

  const dayIdx = getDayIndex(today);
  badge.textContent = `第 ${dayIdx} 天`;
  chapter.textContent = data.chapter;
  contentEl.innerHTML = data.content;
  applyFontSize();

  if (checkins[today]) {
    const record = checkins[today];
    const timeStr = typeof record === 'object' ? record.time : record;
    const readTime = typeof record === 'object' ? record.readTime : '';
    const reflection = typeof record === 'object' ? record.reflection : '';
    btn.textContent = '✅ 今日已打卡';
    btn.disabled = true;
    statusBox.className = 'status-box completed';
    const userName = localStorage.getItem(USER_KEY) || '';
    statusBox.innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${readTime ? '朗读时长：' + readTime : ''}</b>`;
    if (reflection) {
      document.getElementById('reflectionInput').value = reflection;
      document.getElementById('reflectionSaved').style.display = 'block';
    }
    document.getElementById('reflectionInput').disabled = true;
  } else {
    btn.textContent = '📝 提交打卡';
    btn.disabled = false;
    statusBox.className = 'status-box in-progress';
    statusBox.textContent = '📖 今日内容已解锁，请阅读后打卡';
    document.getElementById('reflectionInput').disabled = false;
  }
}

// ===== CHECK IN =====
function doCheckIn() {
  const today = todayStr();
  const checkins = getCheckins();
  if (checkins[today] && typeof checkins[today] === 'object' && checkins[today].time) return;

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const reflection = (document.getElementById('reflectionInput').value || '').trim();
  const readTime = recState === 'done' ? (document.getElementById('recordStatus').textContent.replace('✅ 录音完成！共朗读 ', '') || '') : '';

  if (!checkins[today] || typeof checkins[today] !== 'object') {
    checkins[today] = {};
  }
  checkins[today].time = timeStr;
  checkins[today].reflection = reflection;
  if (readTime && !checkins[today].readTime) checkins[today].readTime = readTime;
  saveCheckins(checkins);

  document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
  document.getElementById('checkinBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box completed';
  const userName = localStorage.getItem(USER_KEY) || '';
  const rt = checkins[today].readTime || '';
  document.getElementById('statusBox').innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${rt ? '朗读时长：' + rt : ''}</b>`;

  if (reflection) {
    document.getElementById('reflectionSaved').style.display = 'block';
  }
  if (recState === 'recording') stopRecording();

  renderCalendar();
  renderHistory();
  updateStats();
}

// ===== STATS =====
function updateStats() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent);
  const checkedDays = keys.filter(k => {
    const v = checkins[k];
    return v && (typeof v === 'string' || v.time);
  }).length;
  document.getElementById('statChecked').textContent = checkedDays;
  document.getElementById('progressCount').textContent = `${checkedDays} / ${TOTAL_DAYS}`;
  document.getElementById('progressFill').style.width = `${(checkedDays / TOTAL_DAYS * 100).toFixed(1)}%`;
  let streak = 0;
  let d = today;
  while (bookContent[d] && checkins[d] && (typeof checkins[d] === 'string' || checkins[d].time)) {
    streak++;
    d = dateAdd(d, -1);
  }
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = Math.max(0, TOTAL_DAYS - checkedDays);
  document.getElementById('progressText').textContent = `打卡进度 ${(checkedDays / TOTAL_DAYS * 100).toFixed(0)}%`;
}

// ===== CALENDAR =====
function renderCalendar() {
  const checkins = getCheckins();
  const today = todayStr();
  const container = document.getElementById('calendarContainer');
  // Show months from June 2026 to Sep 2026
  const months = [
    {year:2026,month:6,label:'2026年6月'},
    {year:2026,month:7,label:'2026年7月'},
    {year:2026,month:8,label:'2026年8月'},
    {year:2026,month:9,label:'2026年9月'},
  ];
  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];
  months.forEach(({year,month,label}) => {
    const firstDay = new Date(year,month-1,1).getDay();
    const daysInMonth = new Date(year,month,0).getDate();
    html += `<div style="margin-bottom:20px;">
      <div style="text-align:center;color:#f5c518;font-size:0.9em;margin-bottom:10px;font-weight:bold;">${label}</div>
      <div class="calendar-grid">`;
    weekDays.forEach(w => { html += `<div class="cal-header">${w}</div>`; });
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inRange = bookContent[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const isChecked = checkins[dateStr] && (typeof checkins[dateStr] === 'string' || checkins[dateStr].time);
      let cls = 'cal-day';
      if (!inRange) { cls += isFuture ? ' future' : ' empty'; }
      else if (isChecked) { cls += ' checked'; }
      else if (isToday) { cls += ' today-marker'; }
      else if (isFuture) { cls += ' future'; }
      else { cls += ' available'; }
      const onclick = inRange && !isFuture ? `onclick="showDayModal('${dateStr}')"` : '';
      html += `<div class="${cls}" ${onclick}>${d}</div>`;
    }
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

// ===== HISTORY =====
function renderHistory() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent).sort().reverse();
  const list = document.getElementById('historyList');
  if (!keys.length) { list.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">暂无记录</p>'; return; }
  list.innerHTML = keys.map(dateStr => {
    const data = bookContent[dateStr];
    const record = checkins[dateStr];
    const isChecked = record && (typeof record === 'string' || record.time);
    const isFuture = dateStr > today;
    const dayIdx = getDayIndex(dateStr);
    const dateLabel = dateStr.replace('2026-','').replace('-','月') + '日';
    let checkedLabel = '';
    if (isChecked) {
      const timeStr = typeof record === 'object' ? record.time : record;
      const readTime = typeof record === 'object' ? record.readTime : '';
      const reflection = typeof record === 'object' ? record.reflection : '';
      checkedLabel = `<div class="h-checked">✅ 已打卡 ${timeStr}${readTime ? ' · ' + readTime : ''}</div>`;
      if (reflection) checkedLabel += `<div style="font-size:0.78em;color:#aaa;margin-top:4px;">💬 ${reflection.slice(0,40)}${reflection.length>40?'...':''}</div>`;
    }
    return `<div class="history-item" onclick="showDayModal('${dateStr}')">
      <div class="h-date">${dateLabel} · 第${dayIdx}天${isFuture ? ' <span style="color:#555">（未解锁）</span>' : ''}</div>
      <div class="h-chapter">${data.chapter}</div>
      ${isChecked ? checkedLabel : (isFuture ? '' : '<div style="font-size:0.75em;color:#666;margin-top:4px;">未打卡</div>')}
    </div>`;
  }).join('');
}

// ===== MODAL =====
function showDayModal(dateStr) {
  const data = bookContent[dateStr];
  if (!data) return;
  document.getElementById('modalTitle').textContent = data.chapter;
  document.getElementById('modalBody').innerHTML = data.content;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('active');
  }
}

// ===== AUDIO WALL =====
function loadAudioWall() {
  try {
    var listEl = document.getElementById('audioWallList');
    if (!listEl) return;
    listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;"><span class="loading-spin"></span> 加载录音列表...</p>';
    queryAllRecords(300).then(records => {
      if (!records.length) {
        listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;">🎵 还没有录音哦~ 快来第一个朗读打卡吧！</p>';
        return;
      }
      let html = `<div style="text-align:right;font-size:0.75em;color:#555;margin-bottom:8px;">共 ${records.length} 条录音</div>`;
      records.forEach((r,idx) => {
        const fileUrl = r.fileId || '';
        const dateLabel = (r.date||'').replace('2026-','').replace('-','/') + '日';
        const displayName = r.userName || '匿名';
        const chapterTitle = r.chapter || `第${r.dayIndex||'?'}天`;
        let audioHtml = fileUrl.startsWith('http')
          ? `<audio controls preload="none" src="${fileUrl}" style="width:100%;height:34px;border-radius:8px;"></audio>`
          : '<span style="font-size:0.78em;color:#666;">音频处理中</span>';
        html += `<div class="audio-item">
          <div class="audio-item-top">
            <span class="audio-item-name">🎤 ${escapeHtml(displayName)}</span>
            <span class="audio-item-date">${dateLabel}</span>
          </div>
          <div class="audio-item-chapter">${escapeHtml(chapterTitle)}</div>
          <div class="audio-player-row">${audioHtml}<span class="audio-duration-badge">${r.duration||''}</span></div>
        </div>`;
      });
      listEl.innerHTML = html;
    }).catch(err => {
      listEl.innerHTML = '<p style="color:#ff4757;text-align:center;padding:40px;">⚠️ 加载失败，请刷新重试</p>';
    });
  } catch(e) { console.warn('[AudioWall]', e); }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TABS =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (el) el.classList.add('active');
  if (tab === 'audiowall') loadAudioWall();
}
</script>
