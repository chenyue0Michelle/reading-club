<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>读书打卡 · 成功方程式</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      font-size: 14px;
    }
    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.5em; color: #f5c518; margin-bottom: 6px; letter-spacing: 2px; }
    .formula { font-size: 0.82em; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .dates { font-size: 0.78em; color: #666; }
    .progress-section { padding: 0 20px 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 6px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f5c518, #ff6b6b); border-radius: 3px; transition: width 0.5s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; font-size: 0.82em; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.4); color: #f5c518; }
    .today-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 14px; position: relative;
    }
    .day-badge {
      display: inline-block; background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 0.75em; font-weight: bold; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .today-card h2 { font-size: 0.95em; color: #f5c518; margin-bottom: 14px; line-height: 1.6; }
    .content-body { font-size: 14px; line-height: 1.95; color: #ccc; }
    .content-body p { margin-bottom: 10px; }
    .content-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .content-body strong { color: #fff; }
    .content-body ul, .content-body ol { padding-left: 20px; margin: 8px 0; }
    .content-body li { margin-bottom: 6px; }
    .checkin-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    .status-box {
      text-align: center; padding: 12px; border-radius: 10px;
      font-size: 0.88em; margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-header { text-align: center; font-size: 0.72em; color: #666; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 0.78em; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future { background: rgba(255,255,255,0.04); color: #555; cursor: default; }
    .cal-day.available { background: rgba(255,255,255,0.08); color: #aaa; }
    .cal-day.available:hover { background: rgba(245,197,24,0.15); border-color: #f5c518; color: #f5c518; }
    .cal-day.today-marker { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; font-weight: bold; }
    .cal-day.checked { background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1)); border-color: #2ecc71; color: #2ecc71; }
    .cal-day.checked::after { content: '✓'; position: absolute; bottom: 1px; right: 3px; font-size: 0.65em; color: #2ecc71; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(245,197,24,0.3); }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 24px; max-width: 680px; width: 100%; margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body { font-size: 0.88em; line-height: 1.9; color: #ccc; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px; width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #aaa; border-radius: 8px; cursor: pointer; font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: #fff; font-size: 1em; padding: 12px 16px; text-align: center;
      margin-bottom: 16px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }
    .user-greeting {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name { color: #666; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    .user-greeting .change-name:hover { color: #aaa; }
    .font-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: flex-end; }
    .font-btn {
      padding: 4px 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING - FIXED ===== */
    .record-area {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #ccc; font-size: 1.4em;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; user-select: none;
    }
    .record-btn.recording {
      border-color: #ff4757; background: rgba(255,71,87,0.2); color: #ff4757;
      animation: pulse 1s infinite;
    }
    .record-btn.done {
      border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; min-width: 0; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-status.done-status { color: #2ecc71; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }
    .record-action-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8em; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .record-action-btn:hover { background: rgba(255,255,255,0.15); }
    .record-action-btn.stop-btn { border-color: #ff4757; background: rgba(255,71,87,0.1); color: #ff4757; }
    .record-action-btn.stop-btn:hover { background: rgba(255,71,87,0.2); }
    .record-action-btn.redo-btn { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; font-size: 0.75em; }

    .record-upload-status { font-size: 0.78em; color: #f5c518; margin-top: 4px; display: none; }
    .record-upload-status.show { display: block; }
    .record-playback { margin-top: 8px; display: none; }
    .record-playback.show { display: block; }
    .record-playback audio { width: 100%; height: 36px; border-radius: 8px; }
    .record-playback-label { font-size: 0.76em; color: #888; margin-bottom: 4px; }
    .loading-spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3); border-top-color: #f5c518;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reflection-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .reflection-label { font-size: 0.82em; color: #888; margin-bottom: 8px; }
    .reflection-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: #ddd; font-size: 0.88em; line-height: 1.7;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus { outline: none; border-color: rgba(245,197,24,0.4); background: rgba(255,255,255,0.08); }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved { font-size: 0.78em; color: #2ecc71; margin-top: 6px; display: none; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    .audio-wall-header { text-align: center; margin-bottom: 16px; }
    .audio-wall-header h3 { color: #f5c518; font-size: 1em; margin-bottom: 4px; }
    .audio-wall-header p { font-size: 0.78em; color: #888; }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s;
    }
    .audio-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,197,24,0.3); }
    .audio-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row { display: flex; align-items: center; gap: 12px; }
    .audio-player-row audio { flex: 1; height: 36px; border-radius: 8px; }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15); color: #f5c518;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75em; white-space: nowrap;
    }
  </style>
  <script>
    window.addEventListener('load', function(){
      var s = document.createElement('script');
      s.src = 'cloudbase.js';
      s.onerror = function(){ console.warn('[SDK] uniCloud SDK 加载失败，录音墙不可用'); };
      document.head.appendChild(s);
    });
  </script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《成功方程式》全书共读计划<br>稻盛和夫 · 每天10分钟</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">
  <h1>📖 成功方程式</h1>
  <div class="formula">人生·工作的结果 ＝ 思想·人格 × 努力 × 能力</div>
  <div class="dates" id="headerDates">稻盛和夫 · 全书共读计划（19天）</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 19</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">19</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall',this)">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 - 修复版 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="handleRecordClick()" title="点击开始/停止录音">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始朗读录音</div>
        <div class="record-duration" id="recordDuration"></div>
        <div class="record-upload-status" id="uploadStatus"></div>
      </div>
      <button class="record-action-btn" id="recordActionBtn" style="display:none" onclick="handleActionBtnClick()">重新录制</button>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- AUDIO WALL TAB -->
  <div class="tab-content" id="tab-audiowall">
    <div class="audio-wall-header">
      <h3>🎙️ 读书录音墙</h3>
      <p>聆听大家的读书声，共同成长进步</p>
    </div>
    <div class="audio-wall-list" id="audioWallList">
      <p style="color:#666;text-align:center;padding:30px;">⏳ 加载中...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== BOOK CONTENT =====
// 《六项精进》全书共读
// 共19天，每天约4000-5500字（10-15分钟阅读）
// 日期范围：2026-08-30 至 2026-09-17
const bookContent = {
  '2026-09-18': {
    chapter: '第1天：新版序言 · 引言 · 第一章 成功方程式',
    content: '<p><strong>新版序言 传播哲学、实践利他</strong></p><p>2001年10月28日，稻盛先生在《经营为什么需要哲学》的讲演中提到他的人生方程式（又叫成功方程式），还提到“把‘作为人，何谓正确’作为判断一切事物的基准”这一哲学的原点，这些论述深深地打动了我。过了一个月，我去拜访了日本京瓷公司和“盛和塾”事务局，买了当时出版的所有稻盛著作以及所有的《盛和塾》杂志（共44期）。</p><p>稻盛先生用哲学家的头脑思考企业家的经营经验和人生经验。他的语言直白，深入浅出，具备穿透力和感召力。在阅读的过程中，我常常禁不住感动。日积月累，感动之余，就产生了写出来与他人分享的冲动。</p><p>据说当时我写的《百术不如一诚》《谈成功方程式》《“实事求是”和“心纯见真”》3篇文章，稻盛先生非常喜欢，并被陆续刊登在《盛和塾》杂志第46期、47期和51期上。一个普通的经营者，特别是外国人，在日本《盛和塾》杂志上连续载文，这是前所未有的。这给了我一种自信。</p><p>写短篇文章有信心，但写书却毫无经验，特别是构思书的框架，是我的弱项。工作之余，绞尽脑汁，断断续续，写了一年，总算写出了《稻盛和夫的成功方程式》这本拙作。说是拙作，并不是谦虚，是因为我自己不满意。但2006年前，稻盛先生在中国还没有很高的知名度，介绍稻盛哲学的书籍很少。出版社认为这本书阐述的思想有价值，文字也不错，于是决定出版。</p><p>在这本书的出版过程中有一个小小的插曲。当时出版社提出，介绍日本经营者思想的书，可以争取得到日方的支持。据说，以前在出版松下幸之助著作时，就有过这种经验。于是出版社就给稻盛先生写了一封信，稻盛先生召集盛和塾有关干部开会，决定答应出版社的请求，给予支援，并提出了具体办法。这让我和出版社的同志都喜出望外。可是，过了一个月，日方有关人员出差北京时，请我和出版社有关负责人开会，宣布取消所做的承诺，并说这种朝令夕改的事很正常，不需要作什么解释。出版社有关负责人当然很失望，说日方出尔反尔，甚至埋怨稻盛先生说话不算数。我一时也很纳闷，想不通这是为什么。</p><p>但是，后来我想通了。稻盛先生答应支援，本来就是预料之外的事，支援不支援是日方的事，答应支援然后取消，这也可以而且应该理解，对方对我方的信任，需要积以时日，这种事不必计较，更不可耿耿于怀。传播稻盛哲学才是大事，不应该因小小的不愉快而受到干扰。传播稻盛哲学的过程应该也是实践稻盛利他哲学的过程，这类事情都可看作对我的考验。于是，我决定稿费分文不取之外，由我自己出一点钱，支援出版社。</p><p>因果法则果然灵验。稻盛先生亲自推荐此书说：“正因为是透彻理解京瓷哲学的非京瓷人所著，所以很值得参考。”稻盛先生访问中国时，还亲自把此书作为礼品赠送给中国客人。不久后，稻盛先生又建议此书用日文在日本出版。托稻盛先生的福，日文版《稻盛和夫的人生方程式》和《稻盛和夫的成功方程式》在日本意外畅销，让我有名利双收的感觉。</p><p>更重要的是，以此书为契机，中央电视台经济频道开始了对稻盛先生的7次采访。</p><p>2008年年初，我突然接到CCTV经济频道一位导演的电话。这位导演说：“为了配合胡锦涛主席访问日本，CCTV《对话》栏目准备围绕‘中国制造和日本制造’制作专题节目。日方嘉宾就想请著名的‘经营之圣’稻盛和夫先生。我把您的《稻盛和夫的成功方程式》一书读烂了。凭直觉，我认为您能把稻盛先生请来。”接此电话后，我立即设法同稻盛先生取得联系，几经周折，我的诚意和执着终于打动了稻盛先生。节目做得很成功。两年后稻盛先生拯救破产的日航一举成功，CCTV的这位导演来到我们在北京的办公室，要求继续做稻盛先生的专题节目，于是，一发不可收拾，到2013年为止，CCTV的记者居然采访稻盛先生7次之多。</p><p>创办无锡盛和塾、与稻盛先生合资创办稻盛和夫（北京）管理顾问有限公司、举办稻盛和夫经营哲学报告会、帮助筹建各地盛和塾、翻译（加编译）稻盛先生21部著作、到处讲演……我忙在其中，乐在其中。传播稻盛经营哲学这件事情太重要了，而要传播好，传播者自己必须实践稻盛利他哲学，容不得半点儿私心。对的坚持，错的改正。在这过程中，我感觉自己收益最大，稻盛哲学洗涤了我的灵魂，让我信念坚定，心明眼亮。</p><p>最后，感谢稻盛先生，感谢出版社，感谢中外盛和塾的灵魂之友，感谢一切对稻盛利他哲学产生共鸣的朋友们。让我们一起努力，共同进步，为企业和社会多做贡献。</p><p>曹岫云</p><p>2016年10月31日</p><p><strong>引言</strong></p><p>2001年10月28日，在天津第一届“中日企业经营哲学国际研讨会”上，我初次见到了稻盛和夫先生，聆听了他的“经营为何需要哲学”的讲演。因为我懂日语，手头还有中日文对照的讲演稿，自己也有9年经营者的经历，所以，或许能更确切地理解他讲演的精髓、价值所在。当时我内心产生一种强烈的感动，我觉得自己遇见了一位亲切、谦逊、具有深刻思想的人物，他手里握有我一直在寻求的真理。</p><p>在讲演中，稻盛和夫先生谈了他的“成功方程式”，谈到了他判断一切事物的基准，就是“作为人，何谓正确”这一句话。听到这些，当时我有一种莫名的惊喜，也不知道怎样来形容自己的感受。后来我想到了“众里寻她千百度，蓦然回首，那人却在，灯火阑珊处”这句古诗，用在这里，很是贴切。</p><p>同年12月，我拜访了位于京都的“京瓷”公司本部，收集了稻盛先生的全部日文原著，订购了自创刊以来所有的《盛和塾》杂志。</p><p>后来我又先后参加了在南京举办的第二届“中日企业经营哲学国际研讨会”、在京都举办的“盛和塾第十次全国大会”、在横滨举办的每期《盛和塾》杂志到手，其中的“塾长讲话”我必定一口气读完；每有稻盛先生的新著出版，我都先读为快；读每一章我都有感动，不同时期读同一章，亦常有不同的感悟。这种感动和感悟积累起来，渐渐深入我的心灵，促使我产生把它写出来、与人分享的冲动。</p><p>2005年1月17日，我应邀参加了有500多位日本企业家参加的日本滋贺县大津地区盛和塾塾长例会，在其后的恳亲会上，当我上台致辞时，72岁的稻盛先生立即转身180度，面朝讲坛，抬头挺胸，微笑着凝视我，倾听我的讲话。他这一动作和他谦逊的笑容，永远定格在我的脑海之中。</p><p>稻盛先生身上有着一种难以言喻的特殊的魅力。现在全世界约有10000名“盛和塾”的企业家被稻盛哲学所吸引。同时，正因为大家都有一颗虔诚学习的心，稻盛塾长的能量才会转移到塾生企业家身上，变成强大的精神力量，推动我们各自事业的发展。</p><p>稻盛先生是通过光明大道到达巨大成功的典范，是纯粹的理想主义和彻底的现实主义优美结合的典范。这样的典范对于中国的企业家，对于各行各业各级领导，对于渴望成功的有识之士，对于一切有志于追求人生真理的年轻人，都具有莫大的、难以估量的参考价值。把这种价值告诉读者，就是本书的使命。</p><p>曹岫云</p><p>2006年9月1日</p><p><strong>第一章 成功方程式</strong></p><p><strong>方程式</strong></p><p>稻盛先生出生在一个极为普通的家庭，家里兄弟姐妹多，经济拮据。亲戚中也没有地位、名声显赫的人物。小学毕业后考当地有名的鹿儿岛第一中学，连续两年都没考上，只好进了一家普通的私立中学。因小时候患过肺结核，高中毕业后报考大阪大学医学部，结果又落榜，只好进了创办不久的鹿儿岛大学。毕业后想进帝国石油公司被拒之门外，到多家公司面试，没有一家愿意接纳他，使他甚至一时产生了自暴自弃的念头。后来经大学的老师介绍，才勉强进了一家破旧的亏本企业。基于以上经历，稻盛先生认为自己能力并不强，更不是什么天才。与他一起创业的7位同志也都是普通的人。同时，在“松风工业”4年的工作实践，特别是新产品的开发成功以及同松下电器做生意成功的经历，使他内心产生了强烈的自信。为了鼓励大家，说明能力一般的人照样可以取得成功，稻盛先生想出了这个方程式。后来他又强调只有这个方程式才能解释他的事业为什么能够持续成功。</p><p>稻盛先生说：“能力极为平凡的人，怎样才能取得不平凡的成功？下列简单的方程式，可以解答这个问题。”</p><p>稻盛和夫先生的上述方程式，我认为不但是经营学，而且是哲学领域中的重大发明，几乎可以适用于所有的人生的方方面面。这个方程式应该成为人类共有的宝贵财富。下面对这一方程式试作若干阐释。</p><p><strong>人生·工作的结果 ＝ 思维方式 × 热情 × 能力</strong></p><p>我们且把“思想·人格”“努力”“能力”称作成功三要素。</p><p>这个方程式中的“能力”，依照稻盛先生的解释，主要指先天的智力和体力，包括健康、运动神经、音乐细胞等。既然多属天赋条件，自己就无从选择。这种“能力”有个体差异，用0到100分来表示。“努力”(或称热情）也因人而异。从饱食终日、无所事事的懒汉到忘我工作的模范，也用0到100分来表示。但这个努力与上述能力不同，不是先天的，而是可以由自己的意志决定的。</p><blockquote><p><strong>人生·工作的结果 ＝ 思维方式 × 热情 × 能力</strong></p></blockquote><p>（－100～＋100）　（0～100）　（0～100）</p><p>或者表达为：</p><blockquote><p><strong>成功 ＝ 思想·人格 × 努力 × 能力</strong></p></blockquote><p>稻盛先生举例说，一个天资聪颖又很健康的人，“能力”可打90分，但他自恃聪明不思进取，“努力”只能得30分，那么两者之积：90×30=2700分。另一个人天赋差些，“能力”只得60分，但他笨鸟先飞，特别勤奋，“努力”可打90分，这样他的乘积为：60×90=5400分。后者得分比前者高一倍。这就是说，天资一般而拼命努力的人可以比天资优良而不肯努力的人，取得大得多的成就。我们周围很多人就是这样。</p><p>然而三者中最重要的是“思想·人格”，它是矢量，有方向性，从负100分到正100分。一个人能力越强、热情越高，但如果他一味自我中心、损公肥私、损人利己或者哲学反动，那么他的人生就是很大的负数，并可能给他人、给社会造成很大危害。这样的例子，古今中外屡见不鲜。</p><p>稻盛先生说，“能力”和“努力”的重要性众所周知，但人生道路上最重要的“思想·人格”，即哲学，却令人遗憾，几乎所有的人都不太明白。我想再加上一句，几乎所有的人也不求甚解。</p><p>看看社会上腐败层出不穷，看看那些才智过人却并无出息或者昙花一现的人物，就晓得稻盛先生说得多么正确，多么深刻，多么一针见血。</p><p>对上述方程式有几点还需加以说明。</p>'
  },
  '2026-09-19': {
    chapter: '第2天：“思想·人格”的含义 · 成功三要素中哪个最重要？ · 思想·人格是变数',
    content: '<p><strong>“思想·人格”的含义</strong></p><p>“思想·人格”日文叫“考え方”，直译为“思考方式”，也有人将它译成“想法”“思维方式”“态度”等。在日文中它是个常用词，含义比较宽泛，稻盛先生在不同场合，分别把它解释为哲学、价值观、人生观、伦理观、思想、人格、理念、观念、信念、理想、意志、意识、精神、心、心态、态度、情绪、愿望等。中文里很难找到一个与其对应的词，可以包括这么多的含义。这就是语言、文化的差异。但在方程式中它是第一要素，它的基本含义是清楚的，不难理解。在本书多数场合，我把它译成“思想·人格”。虽不能涵盖日文“考え方”的全部内容，但可以说基本正确，而且与“思考方式”“思维方式”这种不太常用的词汇相比，更容易被普通的中国人所理解。同时这个译法也得到了稻盛先生本人的首肯。</p><p>我认为可将“思想·人格”分为两个侧面。</p><p>一个是人格的侧面。正面的比如：公正、诚实、开朗、勇敢、谦虚、善良、克己、利他等。负面的比如：不正、伪善、卑怯、傲慢、任性、浮躁、妒忌以及自我中心等。</p><p>另一个是科学的侧面。就是“认识论”，就是实践、认识、再实践、再认识之循环。由五官从外界搜集各种必要的信息，用头脑加以分析，从复杂现象中导出事情的本质，据此制订计划，然后实行。在实行过程中继续搜集信息，再分析，并对照计划，做必要修正，然后再实行这样一个循环，简单讲就叫“实事求是”。先是正确认识事物，然后是拿这种正确认识去改造事物，或创造新的、美好的事物。</p><p>人格侧面和科学侧面相辅相成。稻盛先生说：“充满利己的心目中只呈现复杂的事相、利己的动机，势必模糊问题的焦点。”就是说利己主义者不可能坚持“实事求是”。</p><p>现实生活中常有这样的事情：有时候事情本身很简单，但因为当事人有私心，又要掩饰私心，掩饰真相，结果事情就复杂化，真相变得扑朔迷离，叫人弄不清，人际关系也因此复杂起来，变得棘手，难以处理。因此一个人格高尚、心地纯洁的人，不受私心蒙蔽，就容易看清事实真相，看出事物规律，并勇于按事实、按规律办事。就是说，只有人格高尚的人才能始终实事求是。反过来，只有坚持实事求是，才能保持或提升自己的人格。</p><p>成功三要素之间为什么是“相乘”而不是“相加”？这里有一个“相乘效果”的概念。就拿稻盛先生做例，天资自然极高，给100分未尝不可，但若考虑健康和体力的因素，“能力”姑且打95分；他自始至终有燃烧般的工作热情，“努力”该打满分，即100分。他是优秀的企业家兼哲学家，但考虑到哲学还要发展，“思想·人格”也打95分吧。如果三者关系是相加，总分不过95+100+95=290分，不能突出同我辈常人的差距。但如果是相乘，总分就是95×100×95=902500分。这样的结果符合客观现实，稻盛先生的成就与常人比有天壤之别。他的企业集团2005年的销售额超过4兆日元（约3000亿元人民币），是个天文数字。</p><p>相反的例子，希特勒也是天才，他的演说曾倾倒德国人民，“能力”似乎可以打100分。从我读过《第三帝国的兴亡》一书来看，此人“努力”也不能说差。但是，他的“思想·人格”是扭曲的，是负值，所以他的人生就是极大的负数，并给人类带来了巨大的灾难。</p><p>另外，如果是相加，智力一般而加倍努力的人，往往始终超不过智力高而不肯努力的人。</p><p>换言之，“富贵在天”，努力的作用不大，这不就成了宿命论了吗？但因为是相乘，三要素中只要某一要素分数增加，结果将以倍数增加，我们在现实生活中看到的正是这种情况。</p><p><strong>成功三要素中哪个最重要？</strong></p><p>“能力”和“努力”的重要性连小学生也懂。但“思想·人格”的决定性作用却常被忽略。因它有正负之分，对结果而言最为重要。稻盛先生用他的亲身经历做过说明。</p><p>稻盛大学毕业找工作，到处受挫。当时的日本，没后台，没后门，即使有证书、有实力也难就职。屡屡碰壁之余，不免自暴自弃。他想既然这个社会如此不公，穷人得不到关照，没有出路，不如干脆投身黑社会，或当个“义贼”算了。他说：“如果当时我真的参加了黑社会，或许就成了略有名声的黑帮头目。因为我有不亚于他人的热情，也并不缺少能力。但这想法是反社会的，如果真跨出那一步，我的人生必将呈现很大的负值。”</p><p>一个才能出众而又不懈努力的人，可以积聚很大的能量。但这能量如果取向错误，偏离人间正道，就可能造成灾难。如果能把才能和努力用在为人类、为社会造福的彼岸，那么人格就是巨轮之舵。巨轮乘风破浪，驶向成功的彼岸，靠的就是人格之舵。</p><p><strong>思想·人格是变数</strong></p><p>思想·人格既能变好也能变坏，既能提升也能下降。“听君一席话，胜读十年书。”主要指受人影响，“思想·人格”快速提升。我们看到许多高官落马，这些人能走上高位，并非一开始就是坏人、有坏思想。大凡这类人都有能力，肯努力，会办事，贡献比常人大，因此很容易脱颖而出。地位上升，权力大了，威信高了。所有这些既可拿来做更大贡献的资本，但在制约缺失时，又可用来为非作歹。此时他就来到常人不遇的风口浪尖。如果人格动摇，一念之差，就会一落千丈，从功臣变罪人。</p><p>因此，一个有本事的人，尤其有了权威、春风得意时，特别需要：第一，谦虚精神。“饱满的稻穗低着头”，卓越的人物总是谦虚的。</p><p>正视自己的种种局限、种种弱点，谦虚就有十足的理由。把自己的身份放低，大海水位低，百川流向它。</p><p>第二，感激心态。自己再有能耐，毕竟孤掌难鸣。机会是别人给的，没他人协助，一事无成。所以理应心存感激，乐意将利益、名誉乃至威信，与人分享。</p><p>第三，知足意识。人有私欲，不能否定，但不懂知足，听任欲望膨胀就不正常，必然危及他人，危及组织，最终害了自己。“良田万顷，日食三升；广厦万间，夜眠八尺”，知足是睿智。与其追求虚荣，过度挥霍超过实际需要的物质财富，不如获取精神的满足和心灵的安宁，这才接近真正的成功和幸福。</p><p>这些无非都是理念的提升。</p><p><strong>怎样提升思想·人格？</strong></p><p>我们知道了思想·人格的重要性，但怎样才能提升自己的人格和思想观念呢？首先是学习。稻盛先生说，学习先贤们有关做人的道理，比如佛教、基督教、希腊哲学以及中国的孔孟之道等，是很重要的，我们也多少拥有这方面的知识。但把圣贤们的教诲仅仅作为知识来理解和记忆，并没有多大的实用价值，我们必须用它来戒勉自己，提升自己的人格。学习不可能一蹴而就，必须反反复复才能见效。运动员必须天天锻炼才能保持和提高体能。通过学习提升理念一事更是如此，稍稍懈怠，立即降归原处。</p><p>其次是反省。反省自己的言行是否有违为人之道，如果有错，马上纠正。正如人的面孔会沾上灰尘，需要天天洗脸一样，人的心灵也会蒙上污垢，需要天天反省予以净化。人是血肉之躯，一不小心，就会屈服于本能的欲望，屈服于周围的环境，脱离正道。</p><p>学以致用，从知到行，从理论到实践，这中间需要一个能动的飞跃。这种能动性本来是人类特有的潜质，但是如果不发挥，一切无从谈起；如果不持续发挥，一切都会半途而废。</p><p>稻盛先生说：“回顾自己人生的每一天，其实就是通过经营实践，不间断地提升理念的每一日。”</p><p>总之，“实践+学习+反思”才能有所领悟，才有可能进入更高的哲学境界。强调高尚人格，强调提升理念，并把这作为成功的第一要素，乍看似乎近于迂腐，但其实这才是我们摆脱烦恼，将人生和事业的危机防患于未然的最好的、也是唯一有效的办法。除此之外，还能有什么其他的良计妙策呢？</p><p>成功三要素之相互关系</p><p>在成功三要素的相互关系中，还有几点需要说明。</p><p>还有所谓“潜在能力”的说法。就以学开汽车为例，我50岁才学会驾驶汽车。如果说20岁可合法学开车，那么这30年之间，我虽然没有开车的实际能力，但在我身上却一直存在着开车的潜在能力。经过两个月的训练，这种潜在能力就变成了实际能力，或者说“显在能力”。如果我不努力，或怕出事故，或认为下面司机有八九个，当头的大可不必亲自开车。如果我这样想，那么我就不会主动去学，就永不会开，开车这种潜在能力最终将同我的身体一起埋葬。学游泳、学外语，甚至经营企业等也一样。人有许多可以开发的潜质，几乎人人具备，并不要求特别的天分。话说回来，我虽会开车，技术却差劲，特别倒车蹩脚，我成不了赛车手。当赛车手，特别要当赛车冠军，那只是少数或个别人的天赋，我的潜质中缺乏这种天赋。不过我能自己开车上下班，星期天不麻烦司机，有时还可提高办事效率，达到这些目的就足够了。就是说“潜在能力”要变成“显在能力”这件事，同“努”</p><p>力”和“思维方式”有关。另外，“观念”正确，就能保持旺盛的“热情”、坚持不懈的“努力”。同时努力工作、努力学习，也有助于提高心性。 ，理念·人格”“能力”“努力”这三者既互相独立，又互相影响，互相渗透。</p><p>以上阐述归结到一点，无非想说明“思想·人格”对人生、对事业、对社会的决定性作用。而我们许多人却总是忽略这个真理。社会上一切乱象，因此而生。</p><p>成功方程式是稻盛先生的一个伟大发明，而稻盛先生本人就是实践这个方程式的典范。在日本没听说过“丰田塾”“索尼塾”，却有个“盛和塾”，有弟子万人，还都是经营者，下面员工有百万余人。我们的孔夫子也不过弟子三千、贤人七十二。“盛和塾”还扩展到了美国、巴西、中国、中国台湾地区，由此可见稻盛先生之人格魅力，可见“稻盛哲学”之引人入胜。</p><p>我认为，稻盛哲学，包括这个方程式，不仅是经营者的无价之宝，而且不失为医治中国社会现代浮躁病的一剂良药。希望社会各界都有人来研究它。</p>'
  },
  '2026-09-20': {
    chapter: '第3天：第二章 成功方程式的产生 · 实践中得出理论 · 叔叔的负面“意识”',
    content: '<p><strong>第二章 成功方程式的产生</strong></p><p><strong>实践中得出理论</strong></p><p>人人都渴望成功，但对怎样才能成功，却众说纷纭，真懂的恐怕不多，特别是成功的第一要素，最易被人忽视。有关“成功”的定义，数不胜数，而其中稻盛的方程式最妙，我想很少有哪种说法可以超过它。</p><p>“即使只具备普通的能力，也能获得成功。”稻盛先生为了说服一起创业的同志接受这一论断，想出了这个方程式。</p><p>现在的问题是：为什么稻盛先生能够“想出”这个精彩的方程式，我们一般的人却“想不出”呢？从实践中得出理论，从现象中看出本质，不是一件容易的事情。</p><p>苹果落地之类的现象，司空见惯。那是为什么？苹果为何落地而不飞上天？这现象意味着什么？认真观察并注入深刻思考的，牛顿之前无古人。牛顿由此触动灵机，从中归纳出“万有引力定律”，对物理学做出了划时代的贡献。</p><p>为什么牛顿、稻盛能有如此伟大的发现，对我们普通人又有怎样的启示呢？稻盛先生有一段关于发现、发明及创造的话，正好可以作答：“创造这件事，只有在集中意识、调动潜意识、不断地、深入地、”</p><p>苦苦地思索过程中，才有可能产生。不在心中反复琢磨，单靠聪明智慧，单靠一时的心血来潮，灵感是出不来的。”</p><p><strong>叔叔的负面“意识”</strong></p><p>稻盛先生说，开始提出这个方程式时，曾把“能力”放在前面，即人生·工作的结果=能力×热情×思想·人格。后来意识到还是“思想·人格”最为重要，于是把“思想·人格”调到了前面。</p><p>稻盛先生说，自己从小学到大学一直在鹿儿岛受教育，就职时一到了京都，完全是一个乡下人。家庭、学校讲的都是鹿儿岛土话，所以不但京都方言不会讲，连普通话也说不好。大学成绩虽属优秀，但只是乡村大学，从全国来讲，不是高水平。自己从小就好强，就职以后一直想有所作为，但究竟怎么做才好，自己不清楚，常常觉得很苦恼。像自己这样才能并不杰出的人，想做出杰出的成绩，需要什么条件呢？他说，首先想到的是工作“热情”，无论做什么，“努力”很重要。后来又想到“思维方式”即“思想·人格”的重要性。他说，意识到这一点，与儿时自己叔叔的言谈有关。稻盛小时候，亲戚中有位叔叔常到家里来玩。鹿儿岛的汉子中不少人喜欢说豪言壮语。这位叔叔，白酒下肚后就开始说大话。他列举鹿儿岛知事、议员们的大名，然后说：“这些家伙小学的成绩还不如我，勉勉强强才进了初中。我头脑比他们聪明，只是因为家里穷才没能升学。”语气中扬扬得意，瞧不起那些有出息的人，认为自己比他们优秀得多。听叔叔讲自己了不起，小稻盛一方面并无反感，但另一方面也产生了疑问：“为什么那么了不起的叔叔却一事无成，只会来我家喝酒吹牛呢？”</p><p>牛，而据说那些成绩差劲的人却当官做了知事。这是为什么？”后来他在心里这么解释：“小学的时候，就能力而言，也许叔叔确实优秀，但叔叔自以为聪明，不怎么努力，结果成了没有价值的人；而那些比叔叔笨的人，因为拼命努力，却能够出人头地。”</p><p>这位叔叔为了替自己游手好闲的行为找到正当理由，有一次又说道：“隔壁那笨蛋清早一起身就干活，我脑子好，早晨就是睡懒觉也不要紧，那人因为笨，只好起来干活。”言下之意，头脑不聪明的人，在人家还睡觉时就不得不起床做事。叔叔对他们表示轻蔑。</p><p>稻盛觉得叔叔这话不对头。本来，清晨早起、努力工作的人值得尊敬，可是以叔叔的价值观看来，那只说明他们头脑笨。对叔叔的言行，少年稻盛开始产生反感。</p><p>他说，小时候的这些想法，从叔叔身上得到的教训，同后来提出这个方程式，以及看重其中的“思想·人格”是有关系的。</p><p><strong>肺结核和“心态”</strong></p><p>方程式中的“思想·人格”，稻盛先生有时又称之为“心态”。因为它的正、负决定了我们的人生方向，所以极其重要。对此，稻盛先生在少年时代患病一事上，就已经有所思考。</p><p>1945年，稻盛13岁时患上了肺结核。在盘尼西林发明之前，肺结核是不治之症。稻盛父亲是长兄，住在稻盛家的大叔、大叔母先后死于此病。此后小叔又吐血不止，也住稻盛家，由稻盛父亲悉心护理。当时家中出现了肺结核病人，都瞒着外人，关在屋里休养。但没有不透风的墙，稻盛家被称为“结核的巢穴”。稻盛在升学受挫后，又染上结核，情绪十分低落，发烧躺在床上，有时甚至想到自己可能就这样死去。</p><p>好心的邻居夫人借给稻盛一本书，是《生命的实相》。她对稻盛说：“这本书很好，你读读看吧！不管懂不懂，一定要从头到尾把它读完。你一定会有收获的。”</p><p>书中的道理对于一个只有13岁的孩子来说确实有些费解，但小小年纪就患上这可怕的疾病，求生的欲望让稻盛一字一句、认真地、贪婪地阅读起来。书中许多话引起年幼而早熟的稻盛的好奇。“人病态的心理—这也不卫生，那也会发病。担心自己随时随地都可能生病，念念不忘逃离病菌的侵害——正因为生活在这种忐忑不安的情绪中，病魔真的就光临了。”</p><blockquote><p>“我们心底有吸引灾难的磁石，它会从外界吸引疾病、失业、刀枪等。”</p></blockquote><blockquote><p>“我们内心描绘的事物，会通过现象在我们周围显现。内心不予呼唤的事物，决不会作为现象在我们周围出现。”</p></blockquote><p>还是孩子的稻盛读到这些话，不免困惑：“我的内心并没有呼唤结核病到来。”但在反复思索过程中，稻盛渐渐意识到，谷口雅春说的有道理，结核病确是应自己脆弱心灵的呼唤而至。</p><p>作为长兄，稻盛的父亲对患病的大弟和小弟精心护理，而不许家里其他人接触病人。特别在病人临终前，体质弱化，体温下降，空气中结核病菌密度增加，传染性增大。稻盛很为父亲担忧。但父亲满怀兄弟手足之情，尽心尽力照料病人到最终，虽然一直与患者近距离接触，却始终没有受到感染。另外，比稻盛大3岁的哥哥，对结核病并不介意，并不刻意躲避，结果也安然无恙。而稻盛当时虽然只有13岁，却已从书本上得知，结核病通过空气传染，而且常常在家人中扩散。为避免感染，稻盛每当经过叔叔的房间之前，先进行深呼吸，然后捏着鼻子快速跑过。结果一味忌讳、讨嫌结核病、一心想从病人处逃离的稻盛反而染上了。通过阅读《生命的实相》，思考自己的处境，稻盛意识到是自己“心态”不好，招致了结核病菌的侵蚀，可见“心态”有多么重要。</p><p>这就是生活中的辩证法。从医学角度讲，很可能是经过病人房门前刻意的深呼吸以及经过病人房门口后的深呼吸，吸入了病菌。</p><p>后来因为忙于躲避美军对鹿儿岛不断的空袭，稻盛忘记了疾病，无意中竟然痊愈了。如果没有战争，一直躺在床上静养，一个心事重重的孩子，很容易胡思乱想而陷入悲观，肺结核恐怕难于治愈，至少好转不会这么快吧。</p><p>《生命的实相》一书还有许多充满宗教哲理的话，让稻盛先生终生难忘。</p><blockquote><p>“将痛苦视作不幸，是认知的错误。痛苦是心灵成长的必需，明白了这一点，我们就应该为痛苦而喜悦。”</p></blockquote><blockquote><p>“信念是‘内心世界’中命运的雏形，现实世界中发生的一切，都由这个雏形发展而来。”</p></blockquote><blockquote><p>“人们在遭遇灾难的时候，总认为灾难是外部世界强加于自己的，自己并无过错。但我们遇到灾难而受伤害，其实还有内在的原因，就是说这种灾难与我们的心态相关，两者之间是一种‘物以类聚’的关系。我们内心不去召唤，这世上没有任何东西会主动跑到我们的身边。”</p></blockquote><blockquote><p>“恐惧和不安之心促使你本能地将自己缩小再缩小，以躲避对方的视线而求自保。这种消极的精神状态，会让你的一切生理器官萎靡不振乃至完全丧失功能。”</p></blockquote><blockquote><p>“被预知的‘未来’，就是在‘内心世界’中正在发生的‘现在’。某件事情既然在‘内心世界’里已经发生，作为在‘物质世界’的投影，它必将在实际上发生。”</p></blockquote><p>“要想做成一件事情，就必须长期而持续地、集中而强烈地想。这样，就会产生智慧和力量，就会聚集起你所需要的各种条件，来到你的周围，自然而然地促成你把事情办好。”这些话无非强调精神对物质的反作用，强调方程式中“思想·人格”这一要素极端的重要性。一个多愁善感的少年，经历初次的人生挫折——升学失败，又身患重病，遭受死神的威胁。这时候，带有宗教色彩的《生命的实相》一书中直白的语言，给他的精神世界带来了冲击和洗礼，这与他日后事业的成功以及他世界观的形成，可以说息息相关。</p><p><strong>水库式经营和“思念”</strong></p><p>1959年4月1日，京都陶瓷株式会社正式成立。过了不久，稻盛先生去听大企业家松下幸之助的讲演，题目为《水库式经营》所谓“水库式经营”，是讲企业经营顺利，赚了钱，不要全部用光，要像水库一样，把一部分钱储存起来，正像干旱时水库可以滋润庄稼一样。当经济不景气时，储备的利润可以用来救急，起调节作用，避免企业发生危机。松下强调经营资源要有储备，留余裕。</p><p>松下讲完后，听众中有一人提出疑问：“水库式经营果然有道理，我也理解了。但是松下先生有金钱上的余裕，可以造‘水库’，我们的企业财务拮据，日子过得紧巴巴，没钱造‘水库’，怎样做才能造‘水库’，请给予具体指导。否则，我们不可能搞水库式经营。”</p><p>松下一瞬间露出稍许困惑的表情，沉默片刻后答道：“具体办法我也不晓得，但我晓得经营要留余裕，你必须得这么想。”松下讲这句话后，没有再做具体说明。“问的是造水库的具体的方法，回答却只强调要有造水库的想法”，听众以为答非所向，哄堂大笑。这里应了一句古语：“下士闻道，大笑之。不笑不足以为道。”</p><p>但是稻盛先生与众不同，松下说这句话像电击一样，深深地触动了他。具体怎样去赚钱，如何去造“水库”，各个企业因情况不同而千差万别，不能生搬硬套。企业经营既不是别人能教，又不是教了就会的事情。但是，首先“你必须得这么想”。思念是“因”，没有“因”，哪来“果”？“心不想，事怎成？”独有他理解了松下讲话的真髓。</p><p>因为稻盛先生有类似的经验，又喜深思，所以稍受启示，会立即引起强烈共鸣。“思念”的决定性作用（即方程式中的第一要素）可以从上面的故事中窥见。首先从要搞“水库式经营”这个想法开始，这个想法、“思念”或者说念头强了，就会促使你千方百计把心中的念头变为现实。就能够实现“水库式经营”。</p><p>稻盛先生说，松下的讲话使他再次明白了“思念”“心态”“思维方式”的重大意义。日语的“思维方式”就是“心中所思”，就是“用心进行的思考”。</p><p>稻盛先生说，此后他结合经营实践，提出了“人生·工作结果=思想·人格×热情×能力”这一方程式，并反复向员工解释。稻盛通过从松下得来的重要启示，自己的观念得到确认，并用自己的方式表述，与员工共享。</p><p>个人也好，企业也好，工作也好，人生也好，几乎就由这个“思想·人格”来决定。这个方程式中的“能力”和“热情”固然重要，但人的思想观念、心态或叫“思想·人格”更为重要。因为三要素之间是相乘的关系，所以每个人的工作和人生可能产生巨大差异，就是同一个人，由于思想观念的改变，他的人生可能发生180度大转弯，可能转好，也可能变坏。所谓“念头稍异，境界顿殊”。稻盛先生少年时代阅读《生命的实相》，体会到心态的重要，而松下的话，如苗得雨，又加深了他的认识。稻盛先生提出的这个方程式，在《生命的实相》的作者谷口雅春以及大企业家松下幸之助那里得到了确认。三者虽然是“英雄所见略同”，但是稻盛先生又发展了谷口雅春及松下幸之助的思想。</p><p>用简洁明了的方程式来表达工作，表达人生，表达成功，又表达得这样精彩，可以说是创举，是史无前例。越单纯越容易深人人心，容易为一般人理解和记忆。我相信一定会有更多的人接受、研究、记住、运用这个方程式，取得自己人生和事业辉煌的成功。</p>'
  },
