  '2026-09-11': {
    chapter: '第13天：稻盛哲学根本 · 正确指导人们一切言行的根本思想（下）',
    content: '<p>“现在我们人类生活的这个文明社会，可以说都是由科学技术带来的。同时，勃兴的资本主义一度构筑了人类社会的繁荣。也就是说，科学技术的发展创造了灿烂的文明，同时，作为社会的经济系统，资本主义也曾发挥了它的功能，让人们可以过上富裕的生活。</p><p>“虽然科学技术不断发展构建了文明社会，但科学技术的发展有一个方向性的问题，就是说，科学技术是为了让人类幸福才去发展呢，还是单纯地出于兴趣，因为稀奇、稀罕才去研究呢?比如，人们发现了原子能，很有趣，可以产生巨大的能量。如果是在谋求人类幸福这一哲学的基础之上，开发原子能当然很好，然而，如果与此目的背道而驰，朝着开发原子弹的方向发展，或许就会导致人类的破灭。”</p><p>“同时，资本主义的经济体制营造了当今社会的繁荣。”但是，在这个体制中，‘只要自己赚钱就好’的利己主义膨胀，正如在雷曼兄弟公司破产中表现出来的，那些私欲贪婪的资本家聚集在一起，为了自己的私利，为了少数人、少数资本家个人发财暴富，不择手段，带来了世界性的灾难。现在中国也出现了这种倾向，这样下去贫富差距会越来越悬殊，社会也将愈加混乱。</p><p>“因此，在资本主义的运营中，必须由哲学来指明方向，也就是说，为了人类全体的幸福，个人要努力抑制自己的欲望。”</p><p>“所以，无论科学技术的发展也好，资本主义经济的发展也好，加进还是摒弃‘利他 这一思想哲学的元素，结果将会迥然不同。</p><p>关于宗教，稻盛先生说:因为自小受到佛教思想的熏陶，就和佛教有了缘分。如果自己小时候是受基督教的影响，或许后来就成了基督徒。</p><p>稻盛先生说道:“无论什么宗教，虽然各不相同，但它们倡导的真理本质上是相同的。然而，在宗教徒中，有一些思想偏执之人，他们只拥戴自己的宗教，而排斥其他宗教。本来，在拯救人类这一点上，各种宗教是相通的，但宗教之间的对立往往造成悲剧。另外，即使是佛教，在日本就有许多宗派，有净土真宗、禅宗等，它们互相对立。释迦牟尼教导的真理只有一个，但一旦出现派阀，就会把派阀的利益放在前面，势必引起纷争。基督教也有许多分支，新教、旧教，争执不休。因为宗派林立，宗教的根本教义反而被忽视，为了维护自己的宗派，人们变得狭隘和偏激。本来同根同宗，根本目的都一样，各种教派之间理应和睦共处。之所以对立争斗，是那里的统治者变坏了。”</p><p>稻盛先生的解答直指事物的本质核心。下面谈一谈稻盛哲学的四个特点和稻盛先生的五种身份。</p><p><strong>稻盛哲学的四个特点</strong></p><p>与其他哲学相比，我认为稻盛哲学有如下四个明显的特点。</p><p><strong>简朴性</strong></p><p>稻盛刚刚创业时，28名员工中大多数是高中学历。稻盛要用他们听得懂的语言给他们讲哲学，让他们理解、接受，并与他们一起实践。说到哲学，让人觉得它是深奥抽象的学问，是少数学者专家的事，但稻盛善于用朴实的语言表达深刻的思想。稻盛哲学没有任何难懂的哲学术语，它深入浅出，却又有感动和召唤人心的力量。</p><p><strong>实践性</strong></p><p>稻盛与以往的哲学家不同，因为他是科学家出身，年轻时就有重要的发明创造，而且27岁就创办了企业。因为这种哲学来自亲身实践，包括开发新材料、新产品的科学实践和经营企业的实践，当然也包括生活实践。从实践中来的哲学，又要反过来指导经营实践，使事业获得巨大发展。而经营实践又使哲学不断丰富。这种从实践到理论，又从理论到实践的、紧密的、反复的循环，使实践与理论、经营与哲学达到了高度的平衡，完美的统一。</p><p><strong>道德性</strong></p><p>就一般概念来说，哲学是哲学，道德是道德，两者虽有联系却分别属于不同的范畴。但稻盛哲学把道德放入哲学，以“作为人，何谓正确”，也就是以“利他之心”思考、判断和行动作为稻盛哲学的核心。这在其他哲学中是极为罕见的。</p><p><strong>辩证性</strong></p><p>稻盛哲学强调兼备事物的两极，比如利己与利他、大善与小善、大胆与小心、慈悲心与斗争心、大家族主义与市场竞争主义等;又如，经营者对员工既要关心爱护又要严格要求，两者要高度平衡。这是每天的工作中都面临的课题。</p><p>因为这四个特点，可以说，稻盛哲学最接近天理良知，最围绕实际，最触动人心，也最具备普遍的适用</p><p>性。</p><p><strong>稻盛先生的五种身份</strong></p><p>同时，稻盛先生集科学家、企业家、哲学家、宗教家、慈善家这五家于一身，这个事实在哲学上意味深</p><p><strong>长o</strong></p><p><strong>科学家</strong></p><p>稻盛先生25岁时就发明了“镁橄榄石”这一陶瓷领域内划时代的新材料，作为耐高频、高压、高温的优质绝缘材料，作为集成电路的基板，它为推动电视机、计算机、手机等电子产品的发展立下了汗马功劳。他和他的团队创造了“又一个新石器时代”，在广泛的领域内都具备尖端的技术。</p><p>科学技术方面的发明创造，就是追究“对象事物内部包含的真理”。从这个意义上讲，稻盛先生必须是，而且事实上他也是，一个高度的现实主义者，或者说是一个高度的唯物主义者。</p><p><strong>·企业家</strong></p><p>稻盛先生赤手空拳创建了京瓷和KDDI两家世界500强企业，又以惊人的速度挽救了曾是世界500强之一的日航。另外，曾是他的“盛和塾”塾生的孙正义先生创办的软银集团也成了世界500强之一。而且京瓷创办近55年来、KDDI创办近30年来从未出现过一次亏损。</p><p><strong>·哲学家</strong></p><p>企业经营也是一个高度现实的领域。企业经营者必须不断地对面临的经营课题做出正确的判断。不管过去多么辉煌，一旦在重大问题上判断失误，企业很可能瞬间破产。稻盛先生是企业竞争中的常胜将军，稻盛先生信奉科学合理的思考方式，他创建了缜密的会计七原则和精致的阿米巴经营模式，同时他又兼备关爱他人的慈悲之心和不惧任何困难的燃烧的斗魂。从这个意义上讲，用我们的话来说，稻盛先生不仅是“实事求是”的模范，而且是一位“无所畏惧的、彻底的唯物主义者”。</p><p>稻盛先生在拼命工作的同时还在拼命思考。凡有触动他、打动他的事情，不管是好是坏，他都不会轻易放过，而会思考这些事情中包含的意义，并从正面将它揭示出来。稻盛先生喜欢深思熟虑，善于从复杂的现象中抓住事物的本质，善于将重要的思想用简明的语言表述出来。他将自己科学实验的经验、企业经营的经验以及人生经验上升到哲学的高度，再反过来指导工作、指导经营和人生，并取得了卓越的成功，发挥了所谓“意识对存在、理论对实践的巨大的反作用”。从这个意义上讲，稻盛先生又堪称是一位精通辩证唯物主义的哲学大师。</p><p><strong>宗教家</strong></p><p>稻盛先生还是一位宗教家。他在6岁时，曾接受过“隐蔽念佛”的净土宗僧人的教诲，70多年来“感谢”二字随时随地脱口而出。</p><p>13岁时患肺结核，在面临死神威胁的时候，他读到了《生命的实相》这本佛教色彩浓厚的书，懂得并相信了“我们内心描绘的事物，会通过现象在我们周围显现”，也就是“境由心造”“相由心生”“善念生善果，恶念结恶果”的因果法则。他将“为社会、为世人做贡献”作为“善念”的最高境界，终身实践。</p><p>65岁时，被圆福寺西片担雪长老的人格魅力吸引，同时希望通过禅宗的修行进一步提升自己的心性，稻盛先生剃度出家，皈依佛门。</p><p>稻盛先生相信推动森罗万象生长发展的“宇宙的意志”，相信宇宙的意志就是“利他”，就是“真善美”，这就是一切事物的本源。他相信人生的价值就在于顺应“宇宙的意志”，为社会、为世人做贡献，同时相信顺应“宇宙的意志”事业就能成功，人生就能幸福。</p><p>稻盛先生相信人的意识不仅是脑细胞作用的产物，他认为，相对于肉体而言，人还有精神或称灵魂，又称“意识体”。稻盛先生说:“在宇宙的意志之上，加上过去世代造就的人格，再加上现世积累的经验，三者的综合，我称之为意识体。”而所谓死亡，只是肉体的消灭，而“意识体”在某种意义上将得以流传。而人生在世的目的就是净化这个“意识体”，也就是磨炼灵魂，提升心性。</p><p><strong>慈善家</strong></p><p>稻盛先生还是一位慈善家。京瓷公司创立后第一年就盈利，从此开始，稻盛先生就带领全体员工捐钱救济穷人。京瓷公司上市后，稻盛先生又拿出自己绝大部分财产设立稻盛财团，创建“京都奖”(被称为亚洲的诺贝尔奖)，从事各种慈善活动。而他个人的生活极其俭朴。</p><p>暂且将慈善家搁在一边，科学家、企业家、哲学家、宗教家，这四个家在稻盛先生的身上是如何统一和融合的呢?2013年10月13日在四川成都，中央电视台经济频道主持人向稻盛先生提出了这个问题。这同时也是我的问题。</p><p>稻盛先生回答说:“或许我还没有达到统一、融合的境界。我学习哲学知识，也学了一点宗教教义，作为研究员开展研究，作为技术员开发新技术，作为经营者从事企业经营，所有这些，我想可以集中到一点，我刚才已经讲过，我年轻时，在从事研究的时候，实验中出现的现象会告诉我什么呢?如果想要看破现象中包含的真实、真理，那么，不把自己的心放空，自己的心灵不处于纯净的状态，实验中的现象就不肯告诉我真理。以这样的经验为基础，我开始建立自己的哲学。我认为，作为研究员、作为技术员追求真理，同追求哲学的真理、同通过宗教修行追求真理，没有任何区别，都可以收敛到相同的一点。说这些，似乎我很了不起，其实不管在哪个领域，我都没有达至顶点，但是我意识到了，一切事物都可以归结到一点。这是根本性的真理。</p><p>科学实验和企业经营都要求“实事求是”。“实事”是指客观存在的事实或现象，所谓“是”就是事实或现象中包含的真理、真相或叫规律。“求”就是去追求。但能不能“求”到这个“是”，却与追求者的心是否纯粹有关。“心纯见真”-所有科学家、企业家、哲学家乃至高僧大德的成功都可以归结到这一点。这是根本性的真理。</p><p>认识事物的主体是人的心，强烈的利己欲望会扭曲人心，那么真相在他的心中也是扭曲的，就是说，他看不见真相，甚至不愿意正视真相。这样的人难以成功，特别是难以持续成功。</p><p>稻盛先生谦虚地说:“在哪个领域，我都没有达至顶点。”但是像稻盛先生一样，意识到“心纯才能见真”这一根本性真理，并付诸实践，在科学、经营、哲学和宗教修行几方面，全都成效卓著的人，古今东西能有几位?</p>'
  },
  '2026-09-12': {
    chapter: '第14天：第五章 塾生心得 · 以利他之心感受幸福（上）',
    content: '<p><strong>以利他之心感受幸福</strong></p><p>大家好!我是南宁盛和塾的何超，是广西荣代口腔的创始人，今天有机会在这里向大家汇报与稻盛经营学相遇后，我的心境以及企业经营的变化，我深感荣幸，衷心感谢大会组委会给我这次学习的机会。[4</p><p>我加入盛和塾仅仅三年，但通过浸泡式的学习和大胆践行阿米巴经营，建立了明确的经营理念和会计管理体系，使得创建26年的荣代口腔走出了迷茫期，重新焕发出敢为人先的青春活力;全体员工相互信赖、彼此成就，患者的满意度有了明显的提高，我的格局和境界得到提升，我的家庭也变得更加和谐美满。</p><p>我今天发表的主题是《以利他之心感受幸福》，请塾友们批评指正。</p><p><strong>创业缘起</strong></p><p>我出生于广西壮族自治区靖西县5的一个农村大家庭，父母都是农民，兄弟姐妹七人，我排行第六。小时候家里穷，经常吃不饱饭，还要整天干农活和家务，但是一家人相濡以沫，其乐融融。父亲是村里的“干部”，为了村民过上好日子时常四处奔走，很受村民的尊重与爱戴;父亲非常重视教育，把七个孩子都送到学校，为了让我们兄弟姐妹完成学业，还不惜向银行贷款。</p><p>1990年7月，我从广西医科大学口腔医学院毕业，主动要求分配回靖西县人民医院当医生，一年后与相恋5年的女友结婚了。由于父母日趋老迈，家里还欠着银行贷款，又因综合医院的口腔科不被重视，设备简陋，难于发挥和提高自己的医术，我便在儿子出生两个多月后，于1993年2月28日向医院提交辞职申请。</p><p>当我将辞职报告交给老主任时，老主任脸上惊讶、惋惜的表情至今在我的脑海里仍然清晰可见，我也有很多不舍，也不知道迈出这一步之后将面临什么，但为了责任和梦想，为了有能力尽孝，我只能义无反顾。</p><p>那时，我手头只有几百元的现金，结婚时的借款也还没有还。所幸市医院里的一名同事将她所有的积蓄借给了我，一名因牙痛而与我相识的患者也解囊相助，我才有了第一笔创业资金。</p><p>1993年4月13日，我用两位恩人资助的钱开办了一家口腔诊所，刚开始只有我一名工作人员，因为我技术过硬又用心服务，开业不久便患者盈门了，每天早上诊所还没开门就有人排队等候。半年后，诊所便增加了一名医生;两年后我就把自己借的钱还上了;三年后，我把家里的债务也还清了，并在市中心购买了一栋小楼用于经营和家住，把父母都接到城里安享晚年，对家里的兄弟姐妹也竭尽所能地去帮助他们。在父亲的协助下，我还先后资助了几十名农村子弟上了大学。</p><p>创业之初的前十年里，我基本上都是白天开诊营业，晚上制作假牙，每天工作大约15小时，每年工作360天，用真诚的服务和优良的医术让患者满意而归，不觉得有什么辛苦;看着逐渐壮大的团队，看着日渐增多的存款，看着信任我的民众越来越多，我内心充满喜悦，累并快乐着!</p><p>幸福来得比我想象的还要多，我很庆幸当初自己的选择，庆幸自己生长在一个充满爱的大家庭，庆幸自己生活在一个可以做梦又可以圆梦的好时代。</p><p>小有成就之后的“忙盲茫”</p><p>2004年至2013年，在我创业的第二个十年里，我先后在隆安、平果、南宁、德保、那坡、靖西等县市开设了7家门诊，并成立了荣代管理咨询公司，统一对8家诊所进行管理，员工人数增加到150多人。荣代成为当时广西口腔行业数一数二的标杆企业，我的工作重心也从为患者诊治转移到自己并不擅长的企业管理，同时我又被推荐担任了广西口腔医学会民营分会副会长等一些社会职务。企业规模扩大了，我的精力又分散了，企业的经营问题越来越凸显。尽管业绩还在持续提升，但团队人心不齐、患者满意度不高、企业发展乏力，有一家诊所经营了十年都没能实现盈利，荣代进入了一个发展的瓶颈期。</p><p>个人业绩提成制度，是口腔医疗行业普遍采用的管理制度，管理简单有效，荣代也一直沿用，这是团队人心不齐的主要原因。医生独立执业，治疗方案取决于医生个人的经验和能力，加之利益的驱动，是不是给患者提供了最合适的诊疗方案，难以做到一一监管。这样的管理机制既无法保障患者的利益，也不利于医疗团队的相互协作和“传帮带”，医疗水平难以快速提升，人才队伍也不稳定。再加之社会上的一些不良风气，很多医护人员没有了职业的崇高感和安全感，离职率居高不下。</p><p>面对这些行业的痼疾，我如鲠在喉，但不知如何应对。为了走出困境，2013年我高薪聘请顾问，同时组织团队的骨干人员多次到国内外学习新的技术和理念，也参加了各种各样的经营管理培训班，但收效甚微，不能从根本上解决企业的问题。组织的分工、人员的选育用留、医疗质量的管控，都涉及薪酬分配制度的改革，牵一发而动全身，都需要我去学习并做出决断，但判断的依据是什么?我根本拎不清，我不是一个合格的经营者。</p><p>发现企业生病了，但开不出有效的药方，没有人可以分担经营上的压力，我越来越觉得自己如笼中之鸟，陷入忙乱、盲目、茫然的状态。这样的沮丧和焦虑就如同一块大石沉甸甸地压在我的身上，让我寝食难安，身体免疫力也受到极大的损害。2016年年初，我被带状疱疹病毒击垮了，左眼剧痛无比，险些失明，幸亏得到及时医治，但直到现在患病的区域时常还会出现麻痛的感觉。</p><p><strong>喜遇稻盛经营学</strong></p><p>经营困顿之际，经友人推荐我买了一本《京瓷哲学》，一看就入了迷，对稻盛先生的经营理念和经营体系大为叹服，就如同漫漫长夜中看到了启明星，看到了走出困境的曙光。我不仅自己反复研读，还一口气买了50本《京瓷哲学》，逢人就讲稻盛，他们感兴趣时就把书送给他们。</p><p>2016年12月，南宁盛和塾成立了，我和太太都成了塾生。我们如饥似渴地反复研读塾长的著作和影像资料，更是有一种如获至宝、相见恨晚的感觉，深信可以用稻盛经营学来指引自己的工作和人生，多次和家人说要把塾长当作自己的人生之师。</p><p>2017年是我狂热学习稻盛经营学的一年，是不断反省、内心逐渐清澈、逐渐笃定的一年。塾长的所有图书与讲话视频，我都反复研读，盛和塾每天的打卡学习，每月的线下学习会，每季的组委会，我从未缺席;南宁盛和塾年会，中国盛和塾企业经营报告会、盛和塾世界大会、盛和塾组织的各种讲座也都组织员工参加。</p><p>一年浸泡式的学习，对照着塾长的教导，我不断反省内察，找到经营陷入困境无法自拔的主要原因，起初认为企业发展乏力是因为员工心性不高、能力不强，后来却发现最本质的问题是自己的私心作祟。当小有成就之后，我生起了傲慢心，急于求成，好大喜功，忘却了当年学医的目的，忘了创业时的“责任和梦想”;只强调技术的优势、设备的优势，忙于制定发展规划、修订各种管理制度，却没有深入现场，没有关注“人心的经营”，更没能像塾长一样确定经营企业的大义名分，导致团队怨气、戾气日渐增多，企业越来越不是自己内心喜欢的模样。</p><p>在塾长的影音资料和图书中，我不仅找到了企业的病因，还找到了对症下药的良方，那就是与全体员工一起，明确企业的经营是“为了全体员工的物质幸福与精神幸福”，建立以部门为单位进行核算的会计管理体系，摒弃个人绩效制度，实行大家族主义和实力主义相结合的人才培养考核机制。同时，我还明白，药到病除需要越过三道关卡:一是家庭关，二是元老关，三是能力关。</p><p>为了得到家人的充分理解和支持，我与太太一同参加盛和塾世界大会，还让当时正在国外留学的儿子也参加了塾长季度例会，现场聆听塾长的教导，亲身感受利他哲学的伟大力量，性格外向奔放的太太在现场更是热泪盈眶。</p><p>我的太太在经营发表会的晚宴上争取到了与塾长握手的机会;儿子和我一样，性格比较内向、腼腆，但他的运气很好，在塾长例会上也有了与塾长合影的机会，他们都以此为荣。现在，我们家的客厅里就挂着他们与塾长的合影，每天看着塾长慈祥的面容，全家人都立志一定要做塾长的好学生，每天要精进、感恩、反省、利他。经过充分的沟通，全家人都愿意舍弃个人利益，支持把位于南宁市中心区域的一栋2000多万元的房产和我名下51%的分红权作为全体荣代人第一笔共同的发展资金，先让全体员工看到我们利他的态度和决心o</p><p>同时，我也多次召集创业的元老们分析荣代各种问题背后的根源，解答他们的疑虑，让大家意识到如果不进行改革，荣代将无未来可言，得到了核心骨干的认可和接受。</p><p>至于推进稻盛经营学的“能力关”，当时我是最没有底气的，只是确信一条，只要行动就必定有收获，按照《活法》这么活，按照《干法》这么干，就一定能成功。</p><p><strong>知不易，行更难</strong></p><p>“众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。”这是我喜遇稻盛经营学之后内心的真实写照。我深信利他哲学和阿米巴经营是个宝，是荣代走向未来的必由之路，但如何用好这个宝，内心确实是忐忑不安。</p><p>2017年7月，在加入盛和塾学习半年之后，我先在平果门诊进行试点，取消医生个人提成制度。这一颠覆行业常规的举措，遭到了个别医生的强烈抵触，他们提出了辞职，其中包括我曾经寄予厚望的年轻才俊。当然，大多数医生、护士对此是支持的，因为他们从心底里认可，医生就当以医德为重，以提高医疗技术、解除患者病痛为己任，尤其是当看到患者满意度、团队工作效率都有明显提高的时候，他们就更加积极参与了。2017年，荣代的第三季度业绩同比增长33.06%。但由于习惯于绩效思维，我也不知道如何评价考核，大</p><p>家思想出现混乱，荣代第四季度的增长率下滑到3.06%。</p><p>原本在荣代内部推行学习稻盛经营学时，内部质疑声就一直没有断过，当看到团队的业绩波动时，一些元老就担心地说:“在日本适用的东西，在中国未必合适!”还有人善意地提醒要吸取“大锅饭”的教训，但因我有稻盛经营学撑腰，内心没有一丝一毫的动摇，只是再三告诫自己不能操之过急，要以“无私”的发心和“垂直攀登”的意志直面挑战。</p><p>正当改革试点遭遇困难，人心最为动荡的时候，2017年10月，藤井敏辉老师到南宁讲授“京瓷人才培养制度”，并给学员演练了具体的操作方法，让我豁然开朗，对经营的原理原则的理解更加清晰了，增强了继续推行改革的信心。2017年12月，那家经营了10年都不能盈利的诊所被我关停了，对员工做了妥善的安排。</p><p><strong>回归初心建体系，数字经营好扬帆</strong></p><p>2018年1月，我特意选择在前一年度改革动作最大的平果门诊召开年会。会上，我向大家展示了从藤井敏辉老师那里学来的京瓷人才评价制度和福利制度，还安排平果门诊的负责人介绍了改革的经验与感受，并向全体员工承诺，2018年所有的门诊全面取消医生个人提成的绩效制度后，就算业绩负增长，哪怕股东没有分红，哪怕借钱发工资，我也要保证大家收入不降低，先给大家吃下定心丸。</p><p>学习稻盛哲学坚持一年多了，方向确定了，但如何循序渐进地推进呢?我并没有制订详细的计划书，也做不出来，心想如有一个先行者做顾问，一定可以事半功倍。</p><p>正如塾长所说的“有意注意”，当我明确了要全面践行稻盛经营学的时候，有幸结识了林国华老师，“哲学与实学是一体两面，经营理念哲学化、经营哲学数字化是利他经营学落地的突破口”。与老师的交谈让我的内心更加笃定，我意识到我找到了适合自己的顾问老师。</p><p>2018年5月7日，全体荣代人在林老师的引导下一起填写“初心见证表”，一起回答了“你是一个什么样的人?你为什么到荣代工作?你要成为一个什么样的人?”这三个问题，以此作为企业导入阿米巴经营的开始。</p><p>由于之前一年多的时间里，每天晨会全员诵读《活法》和《京瓷哲学》，大会小会上反复宣讲稻盛经营学，大家对于“什么才是有意义的人生?工作的意义到底是什么?”都有了思考和理解，“初心见证表”的填写得到了积极的响应。再经过几轮的反复讨论，全体荣代人共同确定了荣代的使命、愿景、司训，以及《荣代哲学手册》。</p><p>荣代使命:让员工幸福、让顾客满意的同时，为人类健康和社会进步做贡献。</p><p>荣代愿景:做最具幸福感的口腔企业。<br>荣代司训:医者仁心，感恩利他。</p><p>当工作的目的和意义明确了之后，荣代人进入了“不忘初心，拥抱变化”的新时代。在整个项目学习导入的过程中，所有工作都围绕着荣代使命进行，三年战略规划、组织构建、年度经营计划、单位时间核算表的核心内容和执行规则，都由项目组集体讨论决定。我虽然全程参与，经常陪着项目组加班到三更半夜，但从未以自己的好恶来做决定，这让全体员工有了当家做主的意识;人心的唤醒让我看见了“全员参与、万众一心”所蕴含的巨大潜能，对塾长创造利他哲学与阿米巴经营愈发敬佩和感恩。</p><p>慢慢地，大家养成了“会前必讲哲学，谈事必讲数字”的习惯，模糊的愿景变成了清晰的数字目标，哲学手册的条款变成了言出必行的实际行动，“经营就是培养人才”这一理念也变成了现实。经营管理部还激发团队相互帮助又相互比拼，将职场变成教练场、赛场、磨炼心性的道场。</p><p>在经营的过程中，全员的责任意识提高最为明显，之前是听话照做，结果达成与否和自己无关，现在是由自己制定目标，如果医疗质量、顾客满意度、财务数据没有实现预定的数值，“言出必行表”没有说到做到，就等同于言而无信，没有“为伙伴尽力”，自己就要主动想办法解决。团队意识、使命感、荣誉感、成就感也得到很大的强化，以前是一个人为自己在努力，现在是一群人基于同样的使命，为共同的数字目标去奋斗，不是看你挣了多少钱，而是看你帮助了多少人;而且困难时有人帮忙分担，成功时有人共分享;每天工作就如同比赛，工作的过程就是成长的过程。很多员工说，阿米巴经营真好，每天过得很充实。</p><p>在经营的过程中，全员的责任意识提高最为明显，之前是听话照做，结果达成与否和自己无关，现在是由自己制定目标，如果医疗质量、顾客满意度、财务数据没有实现预定的数值，“言出必行表”没有说到做到，就等同于言而无信，没有“为伙伴尽力”，自己就要主动想办法解决。团队意识、使命感、荣誉感、成就感也得到很大的强化，以前是一个人为自己在努力，现在是一群人基于同样的使命，为共同的数字目标去奋斗，不是看你挣了多少钱，而是看你帮助了多少人;而且困难时有人帮忙分担，成功时有人共分享;每天工作就如同比赛，工作的过程就是成长的过程。很多员工说，阿米巴经营真好，每天过得很充实。不知道从什么时候开始，荣代的孕妇都是提前几个月休假待产的，推行阿米巴经营后却有好几位年轻的“准妈妈”，一直工作到临产前的一天。有两个“90后”的小女生，家境殷实，却也早出晚归，认认真真地做份起薪不高的行政客服工作;问她们工作的动力是什么，她们都说:“工作能帮助患者、帮助伙伴啊，还能看到自己的贡献、自己的进步，可以感受工作的意义和价值，一个人待着多无聊。”</p>'
  },

    chapter: '第15天：第五章 塾生心得 · 以利他之心感受幸福（下）与曹岫云点评',
    content: '<p>随着阿米巴经营的基因工程、系统工程、定制化工程的有序导入，《荣代哲学手册》与“单位时间核算表”成为推动荣代发展的双引擎，共同推动企业的经营不断优化，尤其是在医疗质量、患者服务、员工成长这三个方面都有了根本性的改变。一批年轻的门诊管理者脱颖而出，资深员工乐于“传帮带”，年轻医护人员的进步速度比之前快了3倍左右。这一切又以数字的结果呈现出来，同时数据又催生大家关注经营的过程，并不断改善，乐此不疲。原本心中疑虑最多的技术骨干也被利他哲学的魅力折服，心悦诚服地成为体系建设的中坚力量，极大地夯实了荣代发展的根基。塾长所说的“哲学数字化”“用数字指导经营”“经营就是培养人才”，正在荣代逐步变成可以感知的事实，久违的自豪感又洋溢在每个人的脸上。</p><p>哲学的实践改变了人的思维方式和行为方式，自然就会带来经营结果的改变。2018年，在核心医疗团队因项目学习而导致临床时间减少12%的前提下，公司全年业绩保持18%的增长，员工收入平均增长了20%。2019年1-8月，各门诊服务的患者数量增长23%，治疗完成率提高了55%，业绩同比增长42%，利润同比增长40%;员工幸福指数、患者满意度、医疗质量、财务指标都有明显提高，取得了超越预期的好成绩，员工们都享受着当家做主的自豪感和成就感，再没有人对稻盛经营学提出质疑了。</p><p>优秀的企业文化还产生了神奇的感召力，由于资本介入医疗市场，行业内其他企业普遍抱怨人才难招:但荣代却是逆势而行，2019年上半年，有3个前几年辞职的医生又申请回归荣代，新入职的医生达到9名，新入职的护士及客服达到10名，荣代的员工达到两百多名，还有一些应聘者正在等待适合的岗位。</p><p>最让我感到欣慰的是，利他哲学还给我的大家庭带来了久违的温馨与快乐。企业的主要创业元老，大多是我父母家与太太家的亲戚，尽管我一直也想一碗水端平，但因之前没有明确的原理原则可以遵循，大家的心中难免会产生厚此薄彼的猜疑。这就导致在不知不觉中，家人的物质生活变得相对富足了，心却疏远了。正是阿米巴经营的导入，让利他哲学成为荣代人的行为指南，这也影响到各自的家属成员，做事和判断都有了正确的原理原则，原先相互猜忌的家庭成员也敞开了心扉，自我反省，重构了信任，真正成为亲密无间的一家人，并对实行大家族主义和水库式经营充满热情和期待。</p><p><strong>医者仁心，良医有道</strong></p><p>“有时，是治愈;经常，是帮助;总是，去抚慰。”这首由特鲁多医生所做的小诗阐释了医学的最大价值不是治疗，而是安慰和帮助。</p><p>荣代口腔具有医疗的属性，也具备商业的属性。利他哲学的建立让荣代毅然决然地取消了个人绩效制度，也让荣代的经营模式从“重治疗、轻预防”的利己模式转化为“预防为主、防治结合”的利他模式，同时还要努力成为高收益体质的企业，为人类健康和社会进步做出贡献。</p><p>2019年5月，在荣代口腔，每一个门诊都投入人力、物力增设“口腔护理中心”，把每一位患者都当作自己的亲人，大力推广口腔健康科普活动，努力实现“零蛀牙、零掉牙”的健康目标，5年内要让预防保健的业务占比从5%提高到20%以上。同时，荣代积极推动口腔医生多学科的分工与合作，实行“一站式服务”，这样既能减少患者诊疗次数、节省时间成本，还能提高医疗质量、提高经营效益。我们希望，在做好自身经营的同时，带动行业一同发展，积极投身于公益事业，共同推动社会的进步和发展。</p><p>源于哲学和数字，见于现场和心态，成于流程和制度，这是“医者仁心、良医有道”的基础，是荣代经营体系不断优化的核心内容。尽管荣代的人才培养体系、评价体系、福利体系等很多细节还需要完善;但我确信，荣代人已经找到了工作的意义了，也已经迈上了通往幸福的高速路了，不再迷茫，不再困惑。只要领导者率先垂范，全神贯注于一事一业，精益求精，言行一致，坚持不懈，“让员工幸福、让顾客满意的同时，为人类健康和社会进步做贡献”的荣代使命就必定得到践行，“做最具幸福感的口腔企业”的荣代愿景必定能够实现。</p><p>回顾加入盛和塾的这几年，我感慨万千，没有阿米巴，就没有“全员参与、万众一心”的新荣代;如果没有盛和塾这个学习平台，我一定还在迷茫中焦虑地徘徊，甚至是堕入万劫不复的境地，一定没有今天的喜悦和笃定。</p><p>衷心感谢稻盛塾长的引领!是塾长的教导让我恢复了青春活力，改变了我的企业和家庭，衷心祝愿塾长身体健康!衷心感谢曹岫云老师把盛和塾引入中国，衷心感谢一直陪伴我、支持我的家人和同事，还有帮助我走出经营困境的几位老师，以及一起在盛和塾里共同修行的各位灵魂之友，感谢大家!我的发表到此结束!</p><p><strong>曹岫云点评</strong></p><p><strong>心变一切皆变</strong></p><p>在中国的口腔行业乃至整个医疗行业，稻盛哲学和阿米巴经营双管齐下，开花结果，取得明显成效，而且成效不断持续的企业，据我所知，广西荣代乃是首屈一指。</p><p><strong>境由心造</strong></p><p>作为一名牙科医生，何超很优秀，作为口腔诊所所长他很成功，但当诊所扩大到7家，人员增加到150人，成为一位企业经营者时，他便感觉捉襟见肘，管不过来。特别是因为企业采用行业通行的个人业绩提成制，导致人心离散，人员流失，效益滑坡，矛盾百出。为了解决问题，企业花了不少钱，聘请顾问，到处学习取经，参加各种培训班，进行各种改革，制定各种制度、计划规划，在人才、技术、设备等方面下了不少功夫，一切能想到的办法都试过了，问题还是没有解决，也没有任何解决的线索。何超因此陷入了迷茫，焦虑不安，心力交瘁，乃至免疫力下降，左眼剧痛，险些失明......</p><p>在困顿沮丧之际，他有缘接触稻盛哲学，犹如久旱逢甘雨，他一头扎进去，狂热学习，拼命吸收，在企业中贯彻实行。仅仅两年多的时间，正如何超报告中所说，企业重新焕发活力，业绩欣欣向荣，蒸蒸日上。那么，在这两年多里，荣代变化的根源是什么呢?</p><p>诊所还是那些诊所，设备还是那些设备，医生基本上还是那些医生，并没有特别突出的人才加入，技术也谈不上有什么质的飞跃。何超本人的努力程度、能力水平，没有也不可能有根本性的变化。</p><p>变化的仅仅是以何超为首的荣代全体员工的“心”。境由心造，只要心变，一切都变。</p><p>个人业绩提成制度，针对“干好干坏一个样”的“大锅饭”体制是一个进步，对工作效率、企业效益的提升起到一定的促进作用。但是，用金钱来刺激和笼络人心的制度，副作用极大，不可能带来企业的持续发展。这一点何超在报告中做了很好的分析。通过试点，他断然取消这一制度，鲜明地揭示荣代的企业使命:追求员工幸福和顾客满意，为人类健康和社会进步做出贡献。</p><p>何超率先垂范，殚精竭虑，在全体员工中渗透这个使命，加上从这一使命出发的种种得力措施，企业出现了新气象:离职医生回流了;本来提前几个月休假待产的孕妇们一直工作到临产的前一天;家境殷实的小女生乐于做一份起薪不高的客服工作等。特别是作为经营者的何超，心里笃定了，家庭也更幸福了。大家齐心协力，结果就是:企业效益显著提升，员工收入水涨船高，大幅提高。</p><p>人心从个人的收入提升，转向为大家谋幸福，换句话说，人心从利己转向利他。就这一点，仅仅是这点，促使荣代在短短的两年多中，发生了戏剧性的变化。</p><p><strong>心为何可变</strong></p><p>何超为什么会对稻盛哲学一见钟情?何超的父亲是很受村民爱戴的农村基层干部。何超事业初见成效，便赶紧孝敬父母，照顾兄弟姐妹。由此可见，他本来就很有利他之心。</p><p>同许多成功人士一样，事业发展了，何超也滋生了傲慢之心。傲慢是很大的私心，说它是万恶之源也不为过。</p><p>本来，谦虚心和傲慢心，良心和私心，或者用利他心和利己心来表述吧，这两种心在我们每个人的心中同居。人在无意识状态下，往往是利己心占上风，就是说，遇事首先考虑对自己是否有利，自己是否有面子。在这种心态下，人就容易做出错误的判断，导致不好的结果。</p><p>稻盛哲学的精髓就是“提高心性”。所谓提高心性，就是抑制利己心，让利他心出来当主人，对事情做出判断，并采取行动。</p><p>这可能吗?当然可能。稻盛在京瓷、KDDl、日航就是这么干的，而且那里的干部员工也跟着稻盛努力这么干，这才有了事业的成功。</p><p>虽然利他心和利己心，良心和私心在我们心中同居，而且私心、利己心往往还很猖獗，所谓“心中贼难破”。然而，稻盛先生认为，人心的本质不是私心，不是利己心，而是良心，是利他心。稻盛先生喜欢用“真善美”三个字来表达这个心的本质。这是我们每个人本来就具备的。稻盛先生从根本上相信这一点。</p><p>既然真善美是人心的本质特性，那么把这个本质特性发扬光大不就行了吗?用自己的真善美来激发32000名日航员工的真善美，这就是稻盛先生在日航做的事情，他做得非常成功。人心可以改变，仅仅一年，32000人的心就不可思议地发生改变。荣代这两年多来实践稻盛哲学的结果，也有力地证明了这-点。真善美本来就存在于每个人的心中，尤其是医者本有仁心，把它呼唤出来就行。</p><p><strong>心怎么改变</strong></p><p>心怎么改变?也就是如何提高心性?何超在报告中讲得很具体，也很生动。稻盛先生在《提高心性，拓展经营》等著作中都有十分透彻的解说。</p><p>在这里，我想讲两条。</p><p>第一条，企业一把手如何提高心性，即领导者如何修行。</p><p>1“付出不亚于任何人的努力”。全身心投入工作，精益求精，乐此不疲。在这个过程中，私心杂念自然消退，这是最有效的修行。</p><p>2“要谦虚，不要骄傲”。努力工作获得成就，人就会傲慢起来，这简直是历史规律。因此，抑制住傲慢心，保持谦虚就是一项很重要的修行。</p><p>3“要每天反省”。努力想要谦虚，但还是禁不住傲慢，有时还会乱发脾气，应该坚持每天反省，不让自己变得更坏。这条修行不可或缺。</p><p>4“活着，就要感谢"。人若认真反省，意识到自己的成就和进步，是因为得益于周围人的支持和帮助，就会生出感谢之心。另外，如果把挫折和灾难看成磨炼心志、增益能耐的机会，因而由衷地说一声“谢谢”，并更加努力，就是非常卓越的修行。</p><p>5“积善行，思利他”。这项修行中要注意的是，“大善似无情，小善是大恶”，分清大善和小善，真正为他人好，真正利他，才是有效的修行。</p><p>6“不要有感性的烦恼”。实践上述五项，烦恼就会大大减少，但人毕竟是烦恼的动物，特别是遭遇失败、打击和委屈时，难免痛苦烦恼。这时，以理性抑制住烦恼，把精力投向新的工作，就是很好的修行。</p><p>第二条，如何提高员工的心性。</p><p>阿米巴经营是企业员工提高心性的重要平台。关于这一条，荣代做出了榜样。</p><p>值得一提的是，阿米巴咨询顾问林国华发挥的作用。林国华是一个利他心强烈的稻盛迷。他一进荣代，就要求全体荣代人都要填写“初心见证表”，一共只有三个问题:我是一个什么样的人?我想成为一个什么样的人?我为什么要在荣代工作?每位员工不但要认真填写，公开发表，而且要在阿米巴经营的每个环节上、每项工作上，不断对照，不断扪心自问，不断在大家面前用自己的语言讲出来。在这个过程中，稻盛的语言就会渐渐地变成自己的语言。“言为心声”，语言变，心就变，心变人就变，自己变，影响周围的人也变，最后组织变，企业文化变。这个办法习以为常就很奏效。</p><p>家大的诊所有60多人，分成3个阿米巴，每个阿米巴里有医生、护士、客服等成员。大家一起制订计划，有营业额、费用、时间等数字计划，也有为达成数字计划的行动计划。阿米巴内部互相协助，群策群力，每天算账，为达成目标而努力。阿米巴与阿米巴之间互相比拼，互相激励。</p><p>过去制订计划，计算提成，是出于利己心;现在制订计划，甚至确立高目标，追逐数字，是出于利他心。从利他心出发，对顾客不仅会提供优质的医疗服务，而且会给予体贴和关怀。</p><p>为了大家的幸福，为了企业的发展，员工们在工作中追逐反映真实、体现自身价值的数字目标，这本身就是提高心性。</p><p>一灯照隅是国宝。”在一个行业成为杰出表率的企业，可谓国宝。何超是当地口腔协会的负责人，他还打算把他的这套模式无偿地传授给其他100多家口腔企业。这是荣代利他之心的必然延伸。</p><p>在新冠病毒蔓延期间，口腔诊所无法营业，但荣代足额发放全员工资。过去，荣代没有将利润发光用光，实践了水库经营。稻盛应对经济危机的首要经验，就是企业要有储备。今后，荣代也将继续实践这一条。同时，不能上班，荣代就在网上展开教育训练，继续交流心得，提高心性，扩大知识，提升专业水平。荣代人蓄势待发。</p>'
  },
  '2026-09-14': {
    chapter: '第16天：第五章 塾生心得 · 稻盛经营学让我找到人生的意义（上）',
    content: '<p><strong>稻盛经营学让我找到人生的意义</strong></p><p>大家好!我叫郑小军，来自北京市城市副中心通州区，从事光学精密制造领域39年;是北京创思工贸有限公司的创始人，经营自己企业21年。我于2016年12月2日加入盛和塾，到今天1059天。非常感谢上海盛和塾给我这个机会向大家袒露我的心路历程!我今天汇报的题目是“稻盛经营学让我找到人生的意义”;接下来我会真实、坦诚、认真地进行讲述，期待得到各位灵魂之友的帮助和指正。[6</p><p><strong>为证明自己，走上了创业的道路</strong></p><p>1962年冬，我出生于北京市海淀区北蜂窝。从我母亲论，我是第五代北京人了，上有兄下有弟。我从小受到母亲自立、自强、自尊、勤劳的优良品德的熏陶，以及学好数理化走遍天下都不怕的观念的影响，学习成绩一直很好。我是家里唯一的女孩，由于父母担心我考不上大学就要上山下乡，1978年父亲亲自找到学校，强烈要求班主任批准我报考技工学校。因为上了技校就相当于有了工作，不用上山下乡了。班主任王老师，接受了父亲的请求，最后只说了一句话:“郑师傅，您千万别耽误了孩子啊!”</p><p>随后，我考上了北光技校，并以优异的成绩毕业。1980年3月，我被分配到北京光学仪器厂光学车间工作。1982年，我考上了北京广播电视大学，脱产带薪学习3年;毕业时获得“北京市级优秀毕业生”称号;接下来担任光学工艺工程师、光学车间技术主任。</p><p>1995年，“不安分”的我想辞职，得到了老公的支持。经光学前辈的引荐和自己工程师的专业能力，我非常顺利地应聘进入中国大恒公司光电研究所，从事光学产品海外销售工作。1996年，我与公司领导一起第一次参加海外展会，那也是我第一次出国。</p><p>1998年，为了证明自己的能力和实现更大的价值，我离开了大恒公司，于2000年注册了自己的公司，当时产品全部销往美国。</p><p><strong>经营18年企业没有亏损</strong></p><p>企业初创期，由于各方面人才缺乏，天生不服输的我住在公司长达6年5个月。我是理工科出身，对于管理一窍不通。在公司一期工程建设时，周一至周五我在公司上班，周六和周日到北京大学读EMBA;连续半年多没有休息过一天。我相信西方的管理思想，同时我的骨子里很崇尚中国的诚、信、义，所以我用这两个方面的思想进行经营，公司十几年没有出现亏损。</p><p>2001年9月11日，美国发生了“9·11恐怖袭击事件”，逐渐影响到实体经济，我们的出口订单量一路下滑;2003年，因非典疫情，我们的业务开展一度举步维艰。面对双重危机，公司主动建设自强基因，第一届创思杯运动会应运而生;同时对外积极拓展市场，那一年我们获得了世界半导体封装领域的龙头企业、德国肖特集团及美国一家集团公司的青睐。就这样，创思度过了中小企业的死亡期，连续5年以超过50%的速度增长!</p><p>2007一2009年，美国次贷危机席卷美国、欧盟和日本等世界主要金融市场，我们的生存形势非常严峻。</p><p>为此，公司采取了双策略:对外，积极开拓欧洲市场;对内，理念统一，提升能力。</p><p>在对外业务拓展方面，我们拿着公司的内刊《思语》参加2009年慕尼黑Laser World激光展，转战欧洲多个国家积极拜访客户;在对内提升能力方面，我们采取不解雇一名员工、不降低一分钱工资的政策，开展进行一人多岗和本岗技能提升的培训和技能竞赛，同时公司全员进行主人翁精神的学习和竞赛!我们当时喊出的24字口号是:苦练内功、安全过冬、积蓄力量、待机而动、抓住机会、迅速扩充。全体员工以这样自强的精神努力工作，2009年的创思业绩只降低了10%，而2010年市场复苏时，68位员工出色的表现，创思销售收入一下子增长了136%，创思跨入了规模型企业行列!</p><p>2011年，公司扩建厂房、上金蝶K3ERP管理系统、引进德国CNC设备、聘请外籍人员，全面提升公司实力。2012年，公司获得“北京市高新技术企业”称号，接下来连续5年以平均12.4%的速度增长，产品销至欧洲、美洲、亚洲;BTMT品牌得到业界的高度认可。创思产品广泛应用于半导体、医疗、工业激光、精密检测、科学研究等高端领域。经过了十几年的深耕，创思搭建了不同地域、不同领域的稳定发展基础。</p><p>2015年恰逢“世界光年”，伴随着科学技术的迅猛发展、世界光学产业链的重新布局和调整以及产品生命周期的缩短，光学元件超高精度化、品种多样化、交付周期紧急化，变成了世界市场对光学元件的需求趋势。2016年，这种趋势不断变成现实，处于北京地区的创思将如何转型升级?如何保持可持续发展?似乎我过去成功的经验不灵了!新产品屡屡受挫，交付时间一次次拖延，有难度产品的重复投料不断增加，大家似乎都在努力，但客户抱怨还是出现，对此我焦虑不已!</p><p>2016年偶遇盛和塾，开启阿米巴经营模式</p><p>2016年4月19日，我有幸参加了北京盛和塾举办的北京和台湾两地塾生“哲学共有会”，我惊奇地发现这里上台参加论坛的企业家都带着笔记本，还会不时地在本子上记录重点;这里的企业家们都是那么朴实和真诚。这都是我在其他高端的培训课程上没有见过的。通过企业家们的真实心路历程的分享，我感觉到这次是遇见真正的企业家群体了。联想到2015年11月8日在中外管理官产学恳谈会上聆听过的关于阿米巴经营模式的介绍，我认为盛和塾这个组织是可以帮助我实现经营者看透企业、培养担当人才、推倒部门墙、获得高收益的企业家组织。随后，我决定于2016年8月1日正式启动阿米巴经营模式。</p><p><strong>阿米巴经营模式导入第一阶段</strong></p><p>(2016年8月1日一2017年4月15日，9.5个月)</p><p>第一阶段，公司很热闹，员工访谈、标杆企业参访、竞选践行小组带头人、全员学习《活法》和日打卡、编写《创思哲学手册》、全员参加《六项精进》研修等，内容一项项有序展开，年底经营业绩增长19%。转年，2017年年初的市场形势比较好，公司业务开展的几大领域表现都不错，按照阿米巴项目计划，2017年第一季度应该进行组织切割，但是随着订单的增加以及大家对于阿米巴经营本质的不理解，很多管理者和业务骨干跟不上节奏，出现人员不稳定和订单交付率下降的现象。这时，我不敢进行阿米巴的实质性动作，但心里着急，出现不满情绪。</p><p><strong>阿米巴经营模式导入第二阶段</strong></p><p>(2017年4月16日一2017年12月31日，8.5个月)</p><p>带着心中的焦虑，我参加了2017年4月由稻盛和夫北京公司组织的回归经营原点的日本游学。曹岫云老师《日航重生》的精彩演讲让我反省和思考了很久。为了拯救日航，塾长用的是78岁的身躯和哲学点燃了日航32000名员工，让奄奄一息的日航起死回生，创造了世界航空历史的奇迹。变革取决于经营者坚强的意志，纯粹的动机就是最大的经营资源，无私忘我是第一领导力!我意识到，不是下属跟不上节奏，是哲学浮于表面，是我自以为是、疏于沟通，不信任的语言、急于求成的念头和对下属不满的情绪造成人员心态不稳。创思要想改变，只能从改变我自己开始!</p><p>回到公司后，我首先利用五一假期将日本游学期间所见所闻和感悟，做成PPT向全体员工分两轮进行分享，员工的心与我的心贴近了不少;之后，我又马不停蹄地去美国拜访客户，与伙伴们一道了解客户诉求和解决交付延期的问题。8月12日，公司核心层员工一起参加北京《稻盛经营学企业家践行成果发表会》并做了志愿者，核心层在哲学层面达成共识!8月19日，核心层员工主导在公司内举行了扫除道活动!通过30位新老员工的自愿报名和彻底清扫卫生间，大家一起洗涤了心灵，互相之间加深了了解和融合!8月20日，我剪掉了从2009年留起来的长发，第一次迎接参加“六项精进”主题活动的同事们。员工们看到我就像见到了亲人，抱着我不撒手，在当晚“六项精进”现场举行的空巴7上，大家畅所欲言，把自己内心憋了十几年的话讲了出来。8月26日，公司所有管理者到大连参加了村田老师“会计七原则”的课程。大家白天一起认真学习，晚上进行深入讨论。课程结束后，我们在酒店马上召开了创思经营实学研讨会。我将公司的家底和经营数据全部透明，收入增长情况、毛利润水平、真实净利润、现金流净额，都向大家公开了。大家在这次会议上达成充分共识，确定了阿米巴的核算规则、具体落实方案和实施的时间表!回到公司，大家按照计划有序进行，2017年10月8日创思第一期阿米巴业绩报告会顺利召开了，晚上举办非常热烈的空巴。</p><p>第二阶段，我从内心真正认识到，领导者的人格和气量决定着企业的方向和体量。经过大家的努力，这一年公司销售收入增长51%，利润同步增长!</p><p><strong>·阿米巴经营模式导入第三阶段</strong></p><p>2018年1月一2018年12月)</p><p>基于2017年业绩的增长，2018这一年员工每日继续学习打卡，巴长及干部们每周学习一次，我和干部们累计外出学习达到26次。4月8日，公司启动了智能制造项目，ERP升云、阿米巴日核算、APS排程，并在同年国庆节顺利上线，目前财务结账和财务分析缩短至4天，手机端可以看到各阿米巴的日核算数据，图样和检验卡已经实现无纸化。</p><p>但是随着时间的推移，我们发现经营业绩提升幅度并不大，单位小时附加价值反而有所降低，体现以客户为中心的履约率指标没有明显提升，公司内部互相抱怨的声音出现。经过认真的反省，我们认识到2017年销售收入增长51%使我们产生了错觉，我们认为自己贯彻了全局意识、全员经营、为伙伴尽力，实际上没有做到!</p><p>实际上，阿米巴经营是把外部市场的买卖机制引入企业内部，如果没有全局意识，没有公司一盘棋的大家族主义思维，阿米巴经营是发挥不了作用的，说得极端一点，公司经营有时会为了公司全局利益最大化而牺牲某个阿米巴利益;所以全局观念一定是最重要的铁律;同时公司内部是一条完整的价值链，如果没有内部客户机制，没有为下一道工序客户服务的意识，没有为伙伴尽力的哲学思想作为基础，即没有利他之心，阿米巴的鲜活机制是发挥不出作用的。</p><p>根据公司连续5年的经营数据，2018年的利润率是有所下降的。骄人的业绩数据背后一定是钢铁般的团队和哲学共有!我们认识到哲学共有不仅仅是每天学习的打卡分享和学习的知识，还应该是把知识应用在每天的持续改善中。</p><p>，深入学习和践行，阿米巴经营模式导入第四阶段<br>(2019年1月至今)</p><p>企业最大的成本，就是认知不一致、学习不深入、哲学不共有、价值观不统一。2019年，我们进入深入学习稻盛经营学与工作实际紧密结合的阶段，将每日打卡升级为多个旋涡中心的家书传递，将“六项精进”转化成结合企业实际的“企业版六项精进”，并且每天早晨背诵，公司干部和骨干一起到四川行知学校学习，达成价值观的统一，并到金夫人、红旗渠、胖东来、海底捞、山东豪迈游学，找差距制定改善方案，每月总结闭环。我与大家一道拜访客户、主动解决困扰客户的问题。我们深信市场景气不是别人给的，是自己创造的。只有创造出顾客无论如何都想买的产品，企业就成功了!</p><p>2020年，面对市场需求下滑、销售收入下降的现状，我们认为这正是企业成长的机遇。公司承诺:订单量下降，大家的收入水平不降。我们要让创思成为员工幸福、客户感动的百年企业。同时，公司按照北京市智能100标杆企业的标准，加大研发的投入力度，提升综合能力。7月25日，在公司下半年的誓师大会上，我坐在员工中间第一次没有用PPT讲市场危机与机遇、公司的发心和决心、员工提升的目的和意义，以及挑战目标的本质和价值。会议结束后，员工们上来给我擦汗，我在内心感觉到我的讲话与员工产生了共鸣。正如塾长所说:如果把哲学当作个人或公司提升业绩的手段，不可能获得员工的共鸣。反之，如果发心是为了员工的幸福和成长，一定会得到员工的高度认可。</p>'
  },
  '2026-09-15': {
    chapter: '第17天：第五章 塾生心得 · 稻盛经营学让我找到人生的意义（下）与曹岫云点评',
    content: '<p>经过3年的学习我感悟到，如果企业要想变化，只有企业家自身开始变化，企业才能变化。我们的员工，看到的不是稻盛和夫，而是经营者的一言一行。他们是看着我们的背影做事的，我们来不得半点虚伪。如果我们只拿老先生的经营哲学当成约束下属的工具，那就大错特错了。当从自身开始下手，放下身段改变自己，并一点一滴践行稻盛经营学时，一定会赢得下属的支持和追随。今年第三季度召开的第三期经营分析会和空巴，使我感受到了创业初期激情满满的氛围。截至10月，今年的销售收入与去年同期相比下降了26.9%，而销售毛利润率只下降了0.29%;代表公司快速响应能力的履约率指标，2019年平均提升了5.8%。</p><p><strong>我的收获和同事的改变</strong></p><p>公司采购部一位专员意外怀了二胎，由于婆婆身患癌症刚做了手术，家里家外事情很多，她应接不暇决定把孩子打掉。请假单到了我的手里，我没有同意。我知道她的公公是因癌症去世的，婆婆得了同样的病。我对她说:“不能打掉孩子，要接住老天送给你家的礼物。”2018年年初在部门空巴上，几个月身孕的同事含着泪说出了原委。原来在递交请假单的周末，她决定把孩子打掉了。人已经上了手术台，恰巧收到了我的微信!她顿时改变了主意，从手术台上下来了。她说，现在每当感觉到胎动时，她都会说:“孩子，是我们老总救了你的命。”孩子满月的时候，我去喝了喜酒，孩子见到我笑了，她婆婆的手术治疗很成功，精神状态特别好，全家非常幸福。</p><p>今年春节初八第一天上班，分别在两个部门工作的一对年轻夫妻，突然要离婚。虽然主管们做了很多思想工作，但他们执意离婚。事情汇报到我这里，我刚刚参加了公司初八的百家宴，下午3点要开公司大会，中间只有1小时的时间。那时，我刚刚从美国参加展会回来，时差原因夜里只睡了3小时，本想休息一下。我知道这对年轻夫妻已经有一双儿女了，小的还不到1岁。我强烈地感觉自己一定要做点什么，否则心里会过不去。我告诉HR经理，让他们来见我。HR经理劝道:“离婚的事情将男方父母搅进来了，管不好会出麻烦的。我说:“无论是谁，没有人拒绝你真心对他好!”结果，我和两位年轻人聊了1小时。</p><p>后来，听说女员工回家了。事情过去的第九天下午，HR经理突然推开我办公室的门，兴奋地对我说:“他们俩和好了。上周末男方带着他父母到女方家里赔礼道歉了，女方下周就来上班!”我当时别提多高兴了。今年7月26日在公司的烧烤晚会上，他们上台唱了《都要好好的》，我当时情不自禁地落下了眼泪。</p><p>以上这些事情如果发生在过去，我是不屑一顾的，我觉得那是员工自己的事情，自己的事情都处理不好，还干什么工作啊。但是现在我似乎感觉到他们与我是一体的，他们不幸，我也不会快乐。我不知道我是学习稻盛经营学的哪本书、哪个章节、哪个条目而有此改变的，但我知道我凭直觉做了这些事情之后，我收获了巨大的喜悦和感动!感恩遇到了盛和塾，遇到了老先生，遇到了这么多的心灵之友，使我找到了快乐的源泉。随着公司业绩的增长，公司从2015年开始给每位员工的父母孝敬钱翻了一倍，即每个员工的父母每月可以收到400元的工资;2018年，新入职员工薪酬提升了28%，一线员工调薪比例达到27.67%。</p><p>2018年6月30日是管理层述职和公开考评的日子。球面部门的主管上台分享了一件事情:“一天晚上我加班，郑总来了。她问我，吃饭了吗?如果没有吃，她的楼上还有粽子。我当时特别感动，郑总很少这样对我说话，每次她来车间总是会问生产进度、有难度产品的进展，很少关心我!”当着大家的面，小伙子居然眼睛有些湿润了!我坐在下面边听边思考:我不可能是这样无情的人啊!怎么大家接收到的与我内心不一样呢?我怎么自己没有感觉到呢?看来我在不知不觉中发生了变化，我自己也不知道。就是这些微小的变化，使我和大家的距离近了，虽然我还会很严厉地对待大家，甚至会有用脚踢人的举动，但大家慢慢理解我了。</p><p>今年5月，这个部门现场环境改造，碰巧又接到了中科院20批次12种透镜的订单。在这个主管的带领下，生产一天都没有停产，主管之间相互协作，员工们在两个车间来回奔跑，生产有序、质量可控，保证了关键产品和插单产品全部圆满完成。</p><p>2018年1月，我第一次以吃饭交流的方式与公司所有员工进行了12场空巴。对于基本不陪客人吃饭的我来说，这确实是个不小的挑战，而员工们给予我的反馈，让我非常感动。一位员工在打卡里写道:“明天就轮到我们部门开空巴了。今天夜班我无比兴奋，简直可以说是精神抖擞!因为内心比较激动，工作起来就没有压力，虽然今天要工作到凌晨2:30，以目前的精神状态，我觉得能持续坚持到明天中午12:30开空巴!希望明天能快乐地畅所欲言!激动，激动，激动!!!”这是我无意中看到的基层员工打卡信息。有些女员工在家休产假，也赶来参加空巴了;原来员工是这样渴望与我交流!这就是稻盛先生讲的以心唤心，人人都是经营者的大家族氛围吧。</p><p>我从小到大一直受到家人和朋友的宠爱，不会为别人着想，结婚后没有什么改变。公公很赏识有出息的人，所以我在公婆家里仍然我行我素，不太在乎别人的感受。我在大恒公司工作3年，都是老公带孩子，刚开始时我一周回家一次。由于我的工作出色，老板为了让我每天能回家，专门开了公司通往我家的班车。创建公司时，老公非常支持我的工作，后来他辞职与我一起打拼。2002年，由于公司缺少人才，3月我搬到了公司，这一住就是6年半。遇到危机时，我已经习惯了一个人扛、一个人思考、一个人做决策，公司成了我生命的全部。与老公的交流越来越少，自己越来越强势，渐渐地对家庭的感情也越来越淡薄了。儿子很自立，小学六年级就上了寄宿学校，自己考上了北京市重点高中，后来又考上了复旦大学。孩子上学期间，我只参加过一次家长会，出席孩子18岁的成年礼。儿子读大学期间，给我发短信，我只回一个“阅”字。批阅的阅!现在想想自己真是太傻了，特别愧疚!</p><p>随着公司的不断发展，2008年7月14日我搬回家住了，但是我与老公的关系并没有恢复。加入盛和塾之后，特别是遇到重庆行知教育集团吴安鸣校长，她的六次演讲给了我极大的震撼和刺激。吴校长告诫我:老板自己不幸福，员工是不可能真正得到幸福的。我开始慢慢改变了。去年8月，我第一次和全家人一起旅游。经过了这么多年，我才体会到:家是温馨的港湾，家是幸福的源泉，家是清凉的雨丝，家是爱的孵化园。家是奋斗的加油站，家是起航的新起点。很多年后我才明白，修身齐家治国平天下的道理!</p><p><strong>找到人生的意义</strong></p><p>2018年，我在书架上翻到了2008年至2011年3月之间，我看过《活法》《活法1I》《活法叁》《阿米巴经营》，《活法》是2005年出版的，周庆玲翻译的。原来稻盛老先生的思想早已在我的心里埋下了种子，助我安全度过了席卷全球的美国次贷危机。原来老先生一直保佑着我，才使我的人生没有出现大的偏差。2016年在产品升级的关键时刻，我又遇见了盛和塾，遇见了稻盛老先生。这3年的学习和浸泡，我有一种重新活了一回的感觉，生命有使命感了，每天工作十几小时精力充沛，遇到重大决策和危机时，我的内心很平静，周围的一切都在向好的方向转化。</p><p>这4个阶段导入阿米巴经营模式的波折，使我懂得不管是大企业还是中小企业，企业家都要以守护员工、家人和客户为己任，认真努力工作，同时意识到践行稻盛经营学不是一朝一夕的事情，绝非一个企业只要简单地按照稻盛先生的方法去经营就能轻而易举地获得成功，必须是将稻盛经营学落到实处，让哲学与员工共有，企业家先要修好自己，企业家的学习、修炼、成长是终生的事情。现在市场的形势是对企业家的巨大考验，贸易战的背后是一场科技战，考验的是企业家的心性、格局、视野和胆魄。稻盛塾长让我找到人生的意义，我将竭尽全力，带领创思人，持续践行稻盛经营学，努力实现员工物心两方面的幸福，助力科技腾飞，为社会发展做贡献，我愿奋斗终生。</p><p>再次感恩塾长的教诲，感恩各位的聆听。</p><p><strong>曹岫云点评</strong></p><p><strong>自利利他的哲学</strong></p><p>2020年，郑小军的北京创思在2月3日就正式复工，第一天就有129名员工上班，复工率达76%，2月底达96%，一季度订单完成目标的132.9%。这在疫情防控时期的北京地区实在是难能可贵。因为创思的产品与防疫仪器有关，所以创思人带着使命感。</p><p>复工万一导致感染扩大，该怎么办呢?创思的经验很简单。从物理上讲，人与人只要保持1米以上的距离就可避免感染。问题是必须全员立即一齐付诸行动。当然卫生防控、环境消毒、全员戴口罩等具体措施也要落实到位。公司制订了复工细则，郑小军天天到工作现场、餐厅检查确认，2月几乎每晚都与员工视频连线。</p><p>关键是人的意识:自己不小心感染了，不仅个人会处于危险之中，还会把危险带给亲属、伙伴、团队，影响公司，影响社会。利他自利，公司的规定必须成为每个人自觉的行动。创思做到了，做得很好，这绝非偶然。</p><p>2019年10月27日，郑小军在厦门报告会上的发言感动了全场听众，许多人为之落泪，发出叹息。</p><p>作为一个高科技企业的经营者，郑小军是一个比较理性的人。由于出身、经历再加个性，无论在家庭还是在企业中，她都比较强势，甚至有点霸气。但是，她的发表却有很感性的部分，整体又很理性。她的发言中还有些相当深刻的语言打动了我。这种感性和理性在较高层次上的平衡，显示了小军的一种哲学水准。</p><p>郑小军原来的性格是有点高傲的。对年轻员工离婚之类的事，本来是“不屑一顾”的。她认为“那是员工自己的事情，自己的事情都处理不好，还干什么工作啊”。但是也不知道学了稻盛哲学中哪一条，这次她用真诚的话语，劝和了一对决心离婚的、已经有一双儿女的年轻夫妻。这时，她觉得自己与员工是一体的。劝和成功让她产生了巨大的幸福感。</p><p>另外一位女职员，因为家庭突然的变故，准备打掉腹中的二胎。郑小军向她发了一条微信:“不能打掉孩子，要接住老天送给你家的礼物。”那位女职员当时已经上了手术台，恰巧收到这条微信，瞬间救下孩子命。</p><p>郑小军创办企业的初始目的，是证明自己的能力，实现自己更大的价值。学习稻盛哲学，她懂得了“企业不是经营者实现个人抱负的工具，而是追求全体员工物质和精神两方面幸福的平台”。因为有了这一根本理念的转变，上述爱护员工、与员工心连心的事情就自然而然地发生了。</p><p>在企业发展遇到瓶颈，处于焦虑中的郑小军有缘参加了北京盛和塾的一次活动，被深深吸引后，她和她的团队热心学习稻盛哲学，读书打卡，编制哲学手册，到标杆企业访问取经，全员参加培训活动，办空巴恳亲会，连续四次导入阿米巴经营模式等。这样的学习当然有效，但也有波折起伏。</p><p>郑小军意识到，实践哲学，首先必须改变自己。员工看到的不是稻盛和夫，而是作为经营者的一言一</p><p>行。</p><p>改变自己也许很难，但比改变别人容易。所谓改变自己，就是要改变自己从来不为别人着想的、不在乎别人感受的利己心，用利他心待人处事。</p><p>过去小军到工作现场，只询问生产状况，很少关心别人。这天晚上却问加班的主管:“吃饭了吗?如果没有吃，我楼上还有粽子。”就这么一句贴心话，让当事人感动不已。小军过去很少陪人吃饭，但这年1月，她分别与全体员工进行了12场聚餐交流。有的员工为了能在她面前畅所欲言，精神抖擞工作到凌晨2:30，并坚持到中午12:30。经营者的利他心赢得了员工由衷的信任和尊敬，激发了员工的工作热情。</p><p>利他心在家庭关系上也非常灵验。郑小军过去把公司看作生命的全部，冷落了老公和儿子。利他心能让公司和家庭两全其美。在打造高收益企业的同时，郑小军的家庭生活更圆满、更幸福了。</p>'
  },
  '2026-09-16': {
    chapter: '第18天：第五章 塾生心得 · 稻盛哲学唤醒逆境中的大智慧（上）',
    content: '<p><strong>稻盛哲学唤醒逆境中的大智慧</strong></p><p>大家好!我是广州市莱克斯顿服饰有限公司的温汉清，是来自广东盛和塾的塾生，非常感恩和荣幸能站在这里与塾长和各位企业家朋友一起学习和分享，也非常感谢盛和塾给我这次发表经营体会的机会。[8]</p><p><strong>成长历程</strong></p><p>我来自广东普宁的一个小山村，小时候家里非常穷。很小的时候，家中米缸见底没有米，父亲冒着大雨到亲戚家借，全家人等着父亲带米回来做饭。家乡地少人多，我在家里排行最小，上面有哥哥和姐姐，一家人就靠父亲耕种生活，那时虽然贫穷但也是平淡幸福。在我12岁那年，父亲因病去世，让原本贫穷的家庭陷入更大的困难。自姐姐出嫁、哥哥外出广州打工后，家里只剩下奶奶、母亲和我。父亲在世时，家里开了个小卖铺，经常由我来卖东西，有时父亲也会让我到镇上去拿一些货回来，从那时起我就开始接触生意。父亲去世后，小卖铺散了，家里实在太穷了，妈妈连我要买两毛钱的笔记本的钱都拿不出来。为了贴补家用，我很小就做起了小买卖，每天到各村去卖西瓜、卖冰棍、卖玩具、收废品拿到镇上去卖钱，一边读书一边想尽办法赚钱。小学毕业后，因为初中要住校，可是家里确实交不起学费，我当时的头发留得非常长，家里连让我理发的钱都没有。不忍心看着妈妈这么辛苦，读完初中第一学期我就辍学了，就想跟着哥哥到广州打工，想赚钱减轻家里的负担，减少妈妈的辛苦。</p><p>1990年刚过完新年，我就准备跟着哥哥去广州，要出门的时候，我就暗自下定决心:要坚持学习、不能让妈妈担心、不能让妈妈辛苦、不能赌博。出门前，我向村里人借了大量的旧课本，怕将来自己不认得字，还准备了家里唯一的电器-一手电筒。哥哥问我为什么要带手电筒，当时还闹了个笑话，我说去了广州晚上天黑需要手电筒照路。到了广州后，我发现夜晚满街都是灯，灯光都把我看晕了。在广州，哥哥的生活条件也是非常艰苦，在帮人卖衣服，赚到的钱仅仅只能维持日常生活开销。我刚到广州因为又小又瘦，只有十四五岁，找了很久的工作也没有人愿意雇我。后来，哥哥叫我去学缝纫衣服，将来也能有一个技术修身，但是学了3个月什么也没学到。后来，我就到海丰工厂做剪线头打杂的工作，因为身体素质太差，做了一个月就生病了。后来实在做不下去，只好又回到老家，放了一个月的牛。</p><p>没过多久，我又来到广州，就去卖水果、卖广东人煲汤的材料。我非常投入，经常卖得比别人快，比别人好。但是卖水果进货是按箱进的，不能打开箱子看。有时拿回去的水果如果是烂的，那就亏了，过了一段时间，水果生意也维持不下去了。这时，非常幸运的是，我得到了一个工作机会，去哥哥的老板的店里打杂整理仓库。历经波折，终于有了工作，我心里非常高兴。每天很早就去工作，大家还没来我就到了，平时几个人干的仓库我一个人就抢着干完，把仓库理好后，我就到门店帮忙卖东西，接待客人。经常他们还没到店里，我就把产品帮忙卖了，大家都很喜欢我。出门打工一年，我终于盼到回家过年。因为每天搬货干体力活，我的十个手指都是烂的，但我心里非常高兴。妈妈问我的手怎么了?我安慰妈妈说是帮老板数钱数的。过年带着一些钱回家，做的最重要的一件事就是帮妈妈到镇上买煤炭，做成够用一整年的煤球，这样妈妈就不用再辛苦去砍柴，当时感觉特别幸福。</p><p><strong>转型突破</strong></p><p>后来，哥哥和朋友在灯光夜市合伙开了半间晚上临时搭建的小摊档，开始做生意，那时的夜市有一些来自各地的小商品批发零售商。我白天去上班，晚上就去帮忙照顾夜市生意。不久后，哥哥的朋友自己单干了，留下了一个2平方米的半边摊档给我们经营。然后，哥哥又和另外的朋友合伙开了一家小型服装厂，这个夜市小摊档就开始由我经营，那一年我17岁。晚上如果有上千个店，我就找搭棚子的工人，每天给他几元钱把我的店第一个搭起来，下午5点多就开始营业，晚上让他们拆完所有的棚子再来拆我的，别人家是晚上7点到10点就结束营业了，我是从下午的5点到晚上11点半，经常整个市场就剩我一家在营业，收工完还要把货送到客人下榻的酒店里，我经常到凌晨两三点钟才能回到自己的住处。白天，我6点又去上班，由于体力严重透支、睡眠不足，常常会在上午10点左右晕过去，因为实在太累了!但我还是坚持干了两三年，在夜市开了3家店铺，而且生意是整个市场中最好的，干赢了那些经营了很久的前辈，那时不到20岁，我已经赚了几十万元。</p><p>1993年时，夜市市场开始萧条，很多客人也逐渐不再晚上来灯光夜市拿货了，都直接白天到批发市场进货。很多店铺和工厂纷纷经营不下去，有的人生意不好就放松了;有的人就去玩乐，天天赌博;还有的同行赚了一些钱不想这么辛苦就结束摆摊档了。那时，我也过得非常艰苦，整整有半年的时间天天没有生意，天天亏损，生意经营难以维持下去，不知何去何从，一边在坚守，一边在不断思考怎么开拓生意。在此期间，我也尝试做女装，自己买面料搞款式让工厂加工，但是生意很不稳定，好卖时一天全卖光了，有时又全部卖不出，加之我对女装不熟悉，经营上遇到了很多问题。后来，综合考虑之下，我将夜市的店铺转租给了别人o</p><p>1994年，我看准了全国最大的一线批发市场:广州十三行路批发。那是我打工过的地方，也是我白天拿货的地方，全国各地的大型批发商都到这个市场进货再批发，这是中国最早对外经商的地方，很多人从这里发家致富。当时这里，几乎被实力非常雄厚的几家厂家或店家垄断，竞争非常激烈。</p><p>决心在十三行路做批发业务后，我租了前任老板的一小边店铺，约3平方米，开始做裤子批发业务。前任老板做针织T恤批发业务，他与我不存在竞争关系，但那时做裤子批发的同行几乎垄断了生意，他们的生意非常火爆，门店又大，客人又多，而我刚到这个市场没有任何优势，没有客源，店面非常小，也没有好的工厂与我合作。刚开始，只有一些新开的小厂和零散的客人，我每天想尽一切办法去经营，把产品卖出去。每天从每一位客人身上下功夫，服务好他们，赢得他们的支持来从我这里拿货。</p><p>做批发的核心就是开好店铺，工厂负责生产并把货送来代销，我们负责销售。那时，那些规模大的批发店铺有很多客人，可是他们永远想把工厂和客人隔开，不让工厂到店来，也不让客人知道赚了多少钱。而我当时就透明公开利润，每条裤子只赚3~5元，我与众不同的做法，让合作的工厂和客户都非常放心。慢慢地，越来越多的厂家到店里来了解我的经营，很快我的生意就好起来了，厂家的生意也好起来了。有的工厂自己在广州开了5家批发行，后来也选择与我们合作，放弃自己做销售。那时，我每天就是为不断地争取大型供应商和全国各地大客户的合作而拼命努力。</p><p>到了1995年，我成为批发市场的新星，与大家平分生意。那时我不到20岁，每天只是想尽办法让工厂满意、让客户满意、让员工满意，对每个员工都像家人一样的热爱和尊重。到了1997年、1998年时，在大家的信任和帮助下，我们的裤子批发销售每年达到两三百万条，成为全国最大的批发商。品牌开创之路</p><p>2000年左右，批发生意又遭遇了困境，很多同行的店铺要么倒闭，要么转型。与此同时，我也开始了品牌零售之路，带领批发行做系列产品批发。2000年，我们批发行的团队也有了七八十人，团队非常年轻，都是不到20岁就到我们这里来工作的，团队的业务骨干也都是从这里成长起来的。为了实现品牌梦想，我把批发事业交给了团队和哥哥负责，带着一两名员工，独立去开拓品牌零售经营，开始我们的品牌之路。非常幸运的是，品牌的经营当年就实现了盈利，并得到快速发展。</p><p>2003年的“非典”疫情相信大家都有印象，那时候受“疫情”影响，同大多数品牌一样，我们的经营陷入困难，大家都在恐慌中，4月完全没有生意。5月开始，我不断带领团队开会，给大家打气鼓励，在别人恐慌的时候，我们在努力拼命工作。就这样，在团队的努力下，我们同年业绩获得了68%的增长，让同行非常震惊。</p><p><strong>遭遇困境</strong></p><p>2005年，我们的品牌业绩达到3亿元，每年利润都很好。这时，我就想品牌已经上了轨道，有大量的客人，有实干的团队，有大量的供应链资源，我们已拥有很好的条件，可以再创立一个品牌。于是，我又带着原有的批发团队投入巨资再做了一个男装品牌。多年的成功经营让我们在行业市场上很受关注，客人一听说是我们做的，都纷纷争着代理，在短短一年的时间内开了100多家的店铺。</p><p>然而好景不长，很快就有很多让我意想不到的问题出现了。客户新开的店铺生意不理想，不断出现亏损，很多代理商回款艰难，加上代理商没有做过零售，新品牌的经营陷入非常大的困境，团队士气低迷，这一切都是我难以想象的。而且，由于我的精力重心都在新品牌上，导致我原有的品牌一一莱克斯顿，团队开始出现不好的状况，人心也开始发生变化。</p><p>2007年，我第一次看到了稻盛塾长的《活法》一书，让我非常激动，我通宵反复地看。塾长讲的:动机至善、私心了无。利己之心是拔出魔剑自挖坟墓，利他之心拔出的是正剑。我拿着这句话对照自己，创造新品牌就是欲望和利己之心，根本没有半点利他之心。</p><p>塾长的《活法》给我的触动非常大，在不断地自我反省后，我断然结束新品牌的经营，为自己的过错负责。清理新品牌的每笔交易，减免所有客户50%的债务，将所有供应商的债务还清。就这样，新品牌投入的3年时间刚好把投资款亏光。</p><p>2007年，我投入现有的公司工作，在重新整顿之下，公司逐步好转。全国店铺迅速发展，总部团队达到200多人，自营店铺达到80家，加盟店200多家，年收入5亿多元。</p><p>2008年，随着经营成本的不断上升，效益下滑，我感到团队跟不上我的步伐，需要招聘一些高端的人才加入公司。从2009年开始，我就不断地在外面聘请高级管理团队加入公司，也请来了一位香港公司的高管来公司担任总经理。新任总经理和管理团队加入公司后，对公司上下进行了大刀阔斧地调整，实施高压和独裁的管理，虽然初期带来了业绩的提升，但是问题也开始严重起来:跟随公司多年的干部不断地遭到否定式停职，人员不断扩充，经营成本不断上升，公司人员结构动荡，内耗严重。面对公司当时的情况，我开始感到焦虑不安，也感到迷茫。</p><p>后来，我通过朋友拜见了一位高人，向高人请教并说出了我的疑惑和迷茫:“我今年36岁，是做生意的，经营了二十几年，家庭事业都很幸福，但是我现在很迷茫，不知道未来的路该怎么走?”他看着我说:“您身边的人幸福吗?公司的人幸福吗?社区幸福吗?国家幸福吗?”高人的反问，让我顿时无地自容，看到了自己的自私自利。员工生活尚在水深火热之中，我怎么还幸福呢?</p><p>见了高人以后，我开始了深刻的反省:从刚创业时心思单纯，只是为了赚一些钱，让母亲不用辛苦，让家人过上幸福生活;经营上总是想着伙伴的满意，视员工像家人般重视和对待，构建大家庭的公司文化，员工和家属都以公司为豪，也是大家共同拼命努力才将公司经营发展到现在，而今自己却只想着如何将企业做得更大，家族要赚更多的财富，充斥着功利、欲望和傲慢的思想。</p><p>回到公司后，我辞退了新任总经理，并向全体同事做了发自内心的反省。想着这么多同事跟着公司一起打拼，要让他们感受幸福，于是公司就大幅提高员工工资，增加福利:女员工产假由原来的3个月改成半年全额带薪产假制度;成立了基金，针对员工医疗全额报销和困难家属的帮助。但是，这一系列的福利调整，并没有给公司管理带来改善，反而让公司经营变得困难。员工没有危机感，部分员工变得更加计较，也有部分员工认为公司取得发展，而自己得到的回报不够，从而变得消极对立和不满等，就这样，团队管理的各项问题一直在困扰着我。</p><p><strong>绝地重生</strong></p><p>这几年，虽然我不断地在学习稻盛塾长的管理哲学和中国的传统文化，希望能将公司经营好，但是公司的经营就一直不得力，我对公司发展停滞不前深感苦恼。而且2013年、2014年的服装行业都在面临关店潮、倒闭潮，整个行业情况非常严峻。2015年上半年，我们公司也遇到了前所未有的困难，几个月出现了大幅亏损，仅上半年就亏损了3000多万元。所有店面都在亏本，全国的代理商相继停业，公司一下子减少了将近2亿元的收入，几乎所有的客户收入都没有了。这时，公司内部动荡，人心惶惶，负面情绪严重，团队压力非常大，公司濒临倒闭。那几个月，我非常痛苦，有好几次都觉得干不下去了。我连续几个月失眠无法入睡，有两个星期吃不下、睡不着，只能靠吃营养粉维持，身体一下子就暴瘦了十几斤。我自己的情绪也到了非常糟糕的地步，整个人时时处于绝望和悲观的状态。</p><p>2015年5月，终于等来了盛和塾上海报告会，我提前几个月就报了名，带着一位同事前往上海报告会学习。在两天的报告会上，我听到了大家的分享:如何在萧条中飞跃?如何转败为胜?塾长讲的:企业要有高收益、大义名分、哲学共有、提高心性、量入为出、销售最大化、费用最小化、定价即经营和以心为本的经营等，这些能量一波波就像电流一样冲击我的内心。回到公司后，我就召集核心干部一起交流。这时，我已经非常明白，过去学习哲学起不了作用主要是我自己在学，团队没有学习，没有哲学共有，我们的干部就无法提高心性。我也认识到经营不能没有哲学，我明确地告诉公司团队，如果不学哲学，我的企业无以为继。</p>'
  },
  '2026-09-17': {
    chapter: '第19天：第五章 塾生心得 · 稻盛哲学唤醒逆境中的大智慧（下）、点评与尾声',
    content: '<p>从上海学习回来后的两三个月，我还是不断地失眠，一边学习一边痛苦地面对现实存在的问题，思考着经营不下去的风险。有一天晚上凌晨四五点，心中一幅幅画面在脑海中浮现，想象着公司若经营不下去，我将无法向跟着我的员工交待，无法向多年来支持我的供应商和客人交代，更无法向我的家人和母亲交代。公司必须经营下去，如何经营下去，我的内心在反复自我问答。突然间，我心中一亮，兴奋地抓住了熟睡中的太太的手，我告诉她，我抓到了力量，就是体会到塾长所讲的经营企业的价值:大义名分。我们一切都有了，企业应该要有利他之心，要为所有员工的幸福而努力，他们一路跟着我们工作，我们所有的成绩都是大家的恩德和帮助，不能只为我们自己要赚更多的财富和房子。</p><p>为了实现“哲学共有”的决心，我邀请了广东盛和塾的家辉来协助我们共同学习哲学，制定和推动学习的方法。首先，组织大家一起集中学习塾长的《企业为什么要高收入》《经营十二条》《萧条中飞跃的大智慧》《领导者的资质》《经营为什么需要哲学》，每一期我都同大家一起讨论和学习分享，同时不断带领骨干到塾友企业参加学习。公司的核心干部很快就认同了稻盛哲学，团队达成共识，大家前所未有的团结，消减了费用。公司全员购买了《活法》《干法》《六项精进》《经营十二条》等图书，每天早上各部门自发自主地诵读图书内容、作分享，并把心得写出来发在总部微信群和大家分享。每周一早上，公司全体人员到总部多功能厅集体学习，不同部门的基层员工和管理层分享，我也积极参与其中学习和分享，雷打不动。</p><p><strong>回归以心为本的经营</strong></p><p>在不断带领大家学习哲学的过程中，我以真心与团队沟通，当人心转变了，所有的一切都回归了。</p><p>经过持续的学习，公司与员工目标共有，与员工拉近了距离。</p><p>员工的思想进步很大，在短短的几个月时间里，整个队伍有了翻天覆地的变化。面对2016年100家新店的高目标，在人员有限的情况下，每个人都承担着比往常更大甚至翻倍的工作量，但大家依然充满热情，从未喊过苦和累;各部门间少了指责和推托，而是团结一致。在终端也是如此，浪费明显降低，销售稳定增长，大家干劲十足。我想这与我们这一年来的哲学积累有着重要联系，大家都逐步把工作当成自己的事业。</p><p>我们全面推行“员工人人都是经营者”的观念，每位员工参与相应部门的经营，与企业、与所在部门共生共荣。同时，开展奋斗者“梦享计划”，让店铺店长、分公司参与经营利润分红，总部也计划拿出年度经营利润的25%给予团队分红。在2020年5月，公司兑现了第一批终端店铺利润分红，极大地鼓舞了团队的士气，团队也真切地感受到自己就是经营者的那份自豪感。</p><p><strong>利他定价</strong></p><p>众所周知，中国服装零售业整体都比较困难。主要原因是传统的经营方式，中间环节太多，有代理商、加盟商、商场扣点，层层加价，让中国的服装价格同比国外品牌高出很多。而中国的消费者已经回归理性消费，价格脱离了消费者的承受力，与塾长的“定价即经营”思想完全背离。</p><p>从2019年7月开始，我们调整了战略，让我们的产品彻底回归到高性价比的亲民价格。将与工厂和原来加盟的模式转为合作联营，大大减少中间环节，让利给消费者，从原来出厂产品6倍的加价到现在的2.5倍;从原售价700~800元的产品，现在只卖200~300元，让顾客能轻松地消费。通过亲民价格的调整，我们吸引到不同阶层的消费者，也收获了市场的认可和尊重。这一切的改变都是源于心的转变和定价的转变。产品最终的价值是利于消费者，只有消费者满意了，我们才算得上是在干一件真正有意义的事业!</p><p>在价格调整的同时，我们调整了经销商转变成联营的模式，经销商无须承担任何的库存压力;与此同时，让供应商参与到我们的货品开发工作中，我们用货品的销售额与供应商共享经营成果。</p><p>就这样，在利他思想的影响下，战略模式的调整也让我们的供应商和合作伙伴看到了希望，从原来经营不下去的局面到现在的全面盈利，莱克斯顿的品牌经营变成了一个可以与产业链共享经营成果的事业平台。</p><p><strong>创造高收益企业</strong></p><p>在2015年上海报告会上，稻盛塾长反复多次提到企业经营要达到“10%利润率”的要求。为此我们在企业内部多次展开“如何创造高收益企业”的研讨会，并达成“经营要销售最大化、费用最小化”的思想共识。在过去，我们从未考虑成本意识，对成本也没有合理的规划，导致这些年高额成本累积，严重增加了公司的经营负担。在公司推行稻盛哲学后，全体员工思想上都深刻地意识到“销售最大化、费用最小化”的重要性，公司逐步在各部门、各门店推行“人人都是经营者”的观念，每个人都是自己部门或店铺的主人，要为自己的每项工作负责，严格管控各项成本，做最有效的投入。很快，这一举措取得了明显的成果，2015年下半年，在短短几个月的时间里，我们的成本控制就较以往减少了3000多万元。可想而知，我们之前的成本浪费有多么严重。同时，通过“梦享奋斗者”计划，店铺同事、总部同事都自觉地加入节约费用的行列中，公司整体的日常经营费用也在不断地下降。通过公司上下齐心的努力，2019年上半年的亏损在下半年基本赚回来了，全年基本持平。</p><p>在新模式下，我们的销售业绩在2020年基本每月都实现了50%以上的增长。由于我们的商业模式，企业的毛利空间只有20%，我们只有降低费用成本，提高经营效率，才能真正做到高收益企业。过去，我们一直停滞不敢开店;现在，我们基本每一两天就有新店开张。我们的目标是2020年新开100家店铺，从目前的速度看，新店数量有望超过原计划，全年有望收入翻倍，利润争取在10%左右。</p><p><strong>建设企业哲学</strong></p><p>通过学习塾长的哲学，我们勇敢地做出了一系列的调整。2019年9月至今，公司也组织了团队参加广东盛和塾的哲学手册的研修，经过无数次的讨论和修订，大家共同制定了公司的信念、使命和愿景。我们把“修己、感恩、利人”作为我们的企业信念。</p><p>修己:就是不断地反省自己有没有自私自利，有没有私心，有没有傲慢;是时刻保持谦虚，不断地提高心性;是我们“作为人，何谓正确”的修行。</p><p>感恩:我们生活的一切都来自天地万物和大众的帮助，我们的身体来自父母，所有的工作成果来自同事们的努力和帮助，来自供应商、客户、社会和国家的支持，我们要相互感恩，要以报恩之心努力工作来报答</p><p><strong>他人，活着就要感谢!</strong></p><p>利人:就是利他，是给人带来方便，不给人添麻烦，对别人有好处，对大众有帮助，对社会有帮助。</p><p>企业使命:追求全体员工物质和精神两方面幸福的同时，为合作伙伴创造共同发展平台，为社会进步做出贡献。</p><p>企业愿景:携手全球优质供应商，用时尚链接千万消费者，成为中国百亿级销售平台，拥有6000家门店规模，打造中国全渠道男装行业第一品牌。</p><p>在我们研修哲学手册的过程中，我们团队反复讨论、学习和制定以稻盛哲学为基础的企业哲学，订立出企业大义名分的使命，也制定了我们未来的目标和愿景。通过共同学习的过程，团队更加体会到哲学共有的重要性，更加明确企业的使命、意义和发展的方向，也增强了巨大的力量和挑战未来的勇气;与此同时，我也明白了经营企业真正的使命和意义。</p><p><strong>感恩稻盛哲学的引领</strong></p><p>我从17岁开始到现在25年的创业经营历程中，中国这二三十年每天的变化都很大，每几年就迎来经营上的变化和淘汰。我也见证了很多行业和同行经营不到几年就被淘汰的命运，我们也在不断地面对转变和困难。我先凭着从开始之初为了让母亲不再辛苦和家人能过上幸福生活的单纯之心和简单之心，在员工和大家的支持下每天拼命工作，一次次地在困难中实现了发展。开始之初我只想着别人的满意和利益，企业取得了很好的发展。但随着企业越来越大，团队成员越来越多，这几年出现种种的经营困难，企业的经营和团队的管理就像陷入困难的旋涡，甚至可能经营不下去，这些都是因为自己的心迷失了，企业没有哲学。</p><p>如果没有遇到稻盛哲学和塾长的教育，现在的我自己都不敢想象如何走出困难和迷茫时期，那时一切的方法都不管用，所有的问题都无从下手，很可能由我创办的企业将由我毁掉。所以，我非常感恩塾长的稻盛哲学和盛和塾的教导帮助，让我能从哲学的角度提升自己和学习实践，让我回归到了原点初心，看清了问题的本质，明白经营企业的本质就是经营人心，要获取人心就要展开真正以心为本的经营，要以利他之心和创造员工幸福为企业使命，同时，为社会的进步做出应有的贡献!</p><p>最后，我坚信企业全面学习实践稻盛塾长的哲学一定能实现梦想，心想事成，梦想成真!也祝各位实现梦想，梦想成真!</p><p><strong>谢谢大家的聆听!谢谢!</strong></p><p><strong>曹岫云点评</strong></p><p><strong>危机是机会</strong></p><p>受疫情影响，整个服装行业销售额大降，但对莱克斯顿来说，危机却是机会。一条街上本来有5家服装店，现在开店的只剩自己一家了，这不是机会吗?自家虽有一定规模，但在整个行业中的占比微乎其微，比如只占万分之一吧，整个行业哪怕下降了50%，自己从万分之一增加到万分之二、万分之三有什么难呢?把危机变成机会，温总这么说，也是这么干的。</p><p>成败在于心。温总出生于贫穷的山村，小学毕业，14岁就闯世界，17岁当老板。他拼命努力只有一个目的，摆脱贫困，不让母亲担心，要让家人过上好日子，初心就这么单纯。</p><p>但发了财，穷小子变成小富翁，心就变了，以为自己无所不能，有钱有资源，于是高薪聘请职业经理，自己当甩手掌柜......结果一落千丈。</p><p>遇见稻盛哲学，幡然醒悟:反思30年摸爬滚打的经历，贫穷不是问题，学历不是问题，非典不是问题，环境变化不是问题，甚至能力也不是问题。问题仅仅是自己的那颗心。心傲慢了，心懈怠了，钱再多，市场环境再好，经营资源再丰富，都不管用，经营如自由落体般加速下跌。</p><p>八字护身符。初读稻盛的《活法》如醍醐灌顶。温总说，“动机至善，私心了无”是他的护身符。“利他”这个词，过去听都没听过。做生意不就是为了赚钱过好日子吗?利己还来不及，哪谈得上利他。但细细一想，当初，不让母亲再吃苦，善待员工，宁可自己少赚一点，也要让生产厂家、经销商、消费者获利，这些不就是利他吗?相反，发财后，依靠外部来的职业经理，大搞绩效考核，就是刺激人的私利私欲，于是上下都以利己心驱动，结果问题层出不穷，越搞越复杂。</p><p>员工物心双幸福。参加盛和塾上海报告会，温总彻夜难眠。回去第二天，断然解雇职业经理人，重新珍视在艰难中不离不弃的老员工。</p><p>更重要的是，堂堂正正公开宣布，企业的目的就是:追求全体员工物质和精神两方面的幸福。</p><p>这一条几乎是所有中国企业，包括大企业在内，都没有勇气宣布的。这才是稻盛经营哲学的核心。</p><p>在这样的目的之下，包括在这次新冠疫情之中，没有也不会解雇任何一名员工。</p><p>为了实现这一目的，温总宣布，全员必须学习利他哲学，必须哲学共有，否则公司就不办了，因为没有哲学，只靠利己，企业没有未来。</p><p>温总自己率先垂范，在实践中贯彻“作为人，何谓正确”的判断基准。于是，与产业链上所有合作伙伴双赢多赢，付出不亚于任何人的努力，全力开发新产品，销售最大化、费用最小化、创造高收益、数字经营、推行阿米巴等，一切都顺理成章。以经营者为首，干部员工的力量和智慧涌现，积极应对经济萧条，保障员工幸福，维护企业生存，进一步拓展经营，为社会做贡献，水到渠成，那都是必然的结果。</p><p><strong>盛和塾</strong></p><p><strong>提高心性，拓展经营</strong></p><p>稻盛和夫经营研究中心(简称“盛和塾”)是企业经营者学习、实践稻盛和夫的人生哲学、经营哲学与实学、企业家精神之真髓的平台。塾生们通过相互切蹉、交流，达到事业隆盛与人德和合，成为经济界的中流砥柱、国际社会公认的模范企业家。</p><p>1983年，京都的年轻企业家们向稻盛先生提出了一个愿望一“给我们讲解应该如何开展企业经营”。以此为契机，由25名经营者组成的学习会启动了。截至2019年年底，盛和塾在世界各地的分塾已发展到104个，除日本外，美国、巴西、中国、韩国相继成立了分塾。</p><p>2007年，曹岫云先生在无锡率先发起成立中国第一家盛和塾无锡盛和塾。</p><p>2010年，稻盛先生提议成立稻盛和夫(北京)管理顾问有限公司(以下简称“北京公司”)，将其作为总部负责中国盛和塾的运营。至今，31家地区盛和塾(未统计台湾地区数据)、3家筹备处先后成立。</p><p>北京公司成立之初，稻盛先生即决定在中国召开塾长例会，即稻盛和夫经营哲学报告会，后更名为盛和塾企业经营报告会。2010年至今，盛和塾企业经营报告会共举办了13届，已成为一年一度企业经营者学习、交流稻盛经营学的盛会。</p><p>2019年年底，稻盛先生宣布关闭世界范围内其他地区的盛和塾，仅保留中国的盛和塾继续运营。</p><p>盛和塾成立30多年来，不仅会员人数不断增加，学习质量也不断提高，其中有100多位塾生的企业已先后上市。这么多的企业家，这么长的时间内，追随稻盛和夫这个人，把他作为自己经营和人生的楷模，这一现象，古今中外，十分罕见。</p><p>盛和塾的使命:帮助企业家提高心性、拓展经营，实现员工物质与精神两方面的幸福，助力中华民族伟大复兴，促进人类社会进步发展。</p>'
  }
};

// ===== CONFIG =====
const START_DATE = '2026-08-30';
const END_DATE   = '2026-09-17';
const TOTAL_DAYS = 19;
const STORAGE_KEY = 'liuxiang_checkins_v1';
const USER_KEY = 'rushishuo_username';

// ===== LOGIN =====
function doLogin() {
  const input = document.getElementById('loginInput');
  const name = input.value.trim();
  if (!name) { input.style.borderColor = '#ff4757'; setTimeout(() => input.style.borderColor = '', 1000); return; }
  localStorage.setItem(USER_KEY, name);
  document.getElementById('loginOverlay').classList.remove('active');
  showGreeting(name);
  init();
}
function showGreeting(name) {
  const el = document.getElementById('userGreeting');
  document.getElementById('greetText').textContent = `👋 ${name}，你好！欢迎打卡`;
  el.style.display = 'flex';
}
function changeName() {
  document.getElementById('loginInput').value = localStorage.getItem(USER_KEY) || '';
  document.getElementById('loginOverlay').classList.add('active');
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  const savedName = localStorage.getItem(USER_KEY);
  if (savedName) { showGreeting(savedName); init(); }
  else { document.getElementById('loginOverlay').classList.add('active'); }
  initCloud().then(r => { if (r) console.log('[Cloud] Ready!'); });
});

// ===== FONT SIZE =====
let currentFontSize = parseInt(localStorage.getItem('xin_fontsize') || '14');
function applyFontSize() {
  document.getElementById('todayContent').style.fontSize = currentFontSize + 'px';
  const mb = document.getElementById('modalBody');
  if (mb) mb.style.fontSize = currentFontSize + 'px';
}
function changeFontSize(delta) {
  currentFontSize = Math.min(22, Math.max(12, currentFontSize + delta));
  localStorage.setItem('xin_fontsize', currentFontSize);
  applyFontSize();
}

// ===== CLOUD STORAGE (uniCloud) =====
let app = null;
const DB_COLLECTION = 'reading_records';
async function initCloud() {
  if (app) return app;
  var maxWait = 8000, waited = 0, interval = 200;
  while (typeof cloudbase === 'undefined' && waited < maxWait) {
    await new Promise(r => setTimeout(r, interval));
    waited += interval;
  }
  if (typeof cloudbase === 'undefined') { window._cloudError = '云SDK未加载'; return null; }
  try {
    app = cloudbase.init({ env: 'yongyao-7gq3jvzrae4b4d01', persistence: 'local' });
    try {
      var auth = app.auth();
      var loginState = await auth.getLoginState();

async function hmacSha1(key, msg) {
  var enc = new TextEncoder();
  var keyData = (typeof key === 'string') ? enc.encode(key) : key;
  var msgData = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var cryptoKey = await crypto.subtle.importKey('raw', keyData, {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha1Hash(msg) {
  var enc = new TextEncoder();
  var data = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function cosSignHeaders(method, path) {
  var now = Math.floor(Date.now()/1000);
  var keyTime = (now-60)+';'+(now+3600);
  var signKey = await hmacSha1(COS_CONFIG.SecretKey, keyTime);
  var httpString = method.toLowerCase()+'\n'+path+'\n\n\n';
  var httpStringHash = await sha1Hash(httpString);
  var stringToSign = 'sha1\n'+keyTime+'\n'+httpStringHash+'\n\n\n\n\n';
  var signature = await hmacSha1(signKey, stringToSign);
  var auth = 'q-sign-algorithm=sha1&q-ak='+COS_CONFIG.SecretId+'&q-sign-time='+keyTime+'&q-key-time='+keyTime+'&q-header-list=&q-url-param-list=&q-signature='+signature;
  return { Authorization: auth };
}
async function uploadToCloud(blob, fileName) {
  try {
    var filePath = '/'+COS_CONFIG.Bucket+'/recordings/'+fileName;
    var url = 'https://'+COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com/recordings/'+fileName;
    var headers = await cosSignHeaders('PUT', filePath);
    headers['Host'] = COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com';
    var result = await new Promise(function(resolve,reject){
      var timer = setTimeout(function(){reject(new Error('上传超时'));}, 30000);
      fetch(url, {method:'PUT', headers, body:blob}).then(function(res){
        clearTimeout(timer);
        if (res.ok||res.status===200) { resolve(url); }
        else { res.text().then(t=>{reject(new Error('HTTP '+res.status));}).catch(()=>{reject(new Error('HTTP '+res.status));}); }
      }).catch(function(err){clearTimeout(timer); reject(new Error('网络错误: '+(err.message||err)));});
    });
    return result;
  } catch(e) { throw new Error(e&&e.message?e.message:String(e)); }
}

// ===== RECORDING - FIXED VERSION =====
// States: 'idle' | 'recording' | 'done'
let recState = 'idle';
let mediaRecorder = null;
let recordedChunks = [];
let mediaStream = null;
let recordTimer = null;
let recordSeconds = 0;
let currentBlob = null;

function handleRecordClick() {
  if (recState === 'idle') {
    startRecording();
  } else if (recState === 'recording') {
    stopRecording();
  } else if (recState === 'done') {
    // Click mic icon again = start new recording
    resetRecording();
    startRecording();
  }
}

function handleActionBtnClick() {
  // "重新录制" button
  resetRecording();
}

function resetRecording() {
  recState = 'idle';
  currentBlob = null;
  recordSeconds = 0;
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var uploadStatus = document.getElementById('uploadStatus');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn';
  btn.textContent = '🎤';
  btn.title = '点击开始录音';
  status.className = 'record-status';
  status.textContent = '点击麦克风开始朗读录音';
  duration.textContent = '';
  actionBtn.style.display = 'none';
  uploadStatus.className = 'record-upload-status';
  uploadStatus.textContent = '';
  playback.className = 'record-playback';
}

function startRecording() {
  var status = document.getElementById('recordStatus');
  var btn = document.getElementById('recordBtn');

  // 立即给点击反馈
  btn.style.opacity = '0.6';
  setTimeout(function(){ btn.style.opacity = ''; }, 150);

  var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost && location.protocol !== 'https:') {
    status.textContent = '⚠️ 请使用 HTTPS 访问（或本地 localhost 预览）';
    status.style.color = '#ff6b6b';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ 您的浏览器不支持录音，请用手机浏览器打开';
    status.style.color = '#ff6b6b';
    return;
  }

  status.textContent = '🎤 正在请求麦克风权限...';
  status.style.color = '#ffa502';

  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function(stream) {
      mediaStream = stream;
      recordedChunks = [];
      recordSeconds = 0;

      let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        currentBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        onRecordingDone();
      };

      mediaRecorder.start();
      recState = 'recording';

      var duration = document.getElementById('recordDuration');
      btn.className = 'record-btn recording';
      btn.textContent = '⏹';
      btn.title = '点击停止录音';
      status.className = 'record-status active';
      status.textContent = '🔴 正在录音中... 点击⏹停止';
      status.style.color = '';
      duration.textContent = '已录 0秒';

      recordTimer = setInterval(function() {
        recordSeconds++;
        var m = Math.floor(recordSeconds / 60);
        var s = recordSeconds % 60;
        duration.textContent = '已录 ' + (m > 0 ? m + '分' : '') + s + '秒';
      }, 1000);
    })
    .catch(function(err) {
      var errMsg = err && err.message ? err.message : String(err || '');
      if (errMsg.indexOf('Permission') >= 0 || errMsg.indexOf('Denied') >= 0 || errMsg.indexOf('denied') >= 0) {
        status.textContent = '⚠️ 麦克风权限被拒绝，请在地址栏允许后重试';
      } else if (errMsg.indexOf('NotFound') >= 0) {
        status.textContent = '⚠️ 未检测到麦克风设备';
      } else {
        status.textContent = '⚠️ 录音启动失败：' + (errMsg || '未知错误');
      }
      status.style.color = '#ff6b6b';
    });
}

function stopRecording() {
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  recState = 'done';

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function onRecordingDone() {
  var m = Math.floor(recordSeconds / 60);
  var s = recordSeconds % 60;
  var timeStr = (m > 0 ? m + '分' : '') + s + '秒';

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn done';
  btn.textContent = '✅';
  btn.title = '录音完成，点击重新录制';
  status.className = 'record-status done-status';
  status.textContent = '✅ 录音完成！共朗读 ' + timeStr;
  duration.textContent = '点击播放器回听，或点击麦克风重新录制';

  // Show playback
  var player = document.getElementById('recordPlayer');
  player.src = URL.createObjectURL(currentBlob);
  playback.className = 'record-playback show';

  // Show redo button
  actionBtn.textContent = '重新录制';
  actionBtn.className = 'record-action-btn redo-btn';
  actionBtn.style.display = 'block';

  // Save read time to checkins
  var today = todayStr();
  var checkins = getCheckins();
  if (!checkins[today]) checkins[today] = {};
  if (typeof checkins[today] === 'string') checkins[today] = { time: checkins[today] };
  checkins[today].readTime = timeStr;
  checkins[today].readSeconds = recordSeconds;
  saveCheckins(checkins);

  // Upload in background
  doUploadAudio(today, timeStr);
}

async function doUploadAudio(dateStr, durationStr) {
  var statusEl = document.getElementById('uploadStatus');
  statusEl.className = 'record-upload-status show';
  statusEl.innerHTML = '<span class="loading-spin"></span> 正在上传录音到云端...';

  try {
    if (!currentBlob) { statusEl.textContent = '⚠️ 无录音内容'; return; }
    var userName = localStorage.getItem(USER_KEY) || '匿名';
    var timestamp = Date.now();
    var safeName = dateStr + '_' + userName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '') + '_' + timestamp;
    var fileId = await uploadToCloud(currentBlob, safeName + '.webm');
    var dayIdx = getDayIndex(dateStr);
    var chapterInfo = bookContent[dateStr] || {};
    await saveRecordToDB({
      userName, date: dateStr, dayIndex: dayIdx,
      chapter: chapterInfo.chapter || '',
      duration: durationStr, fileSizeKB: Math.round(currentBlob.size/1024),
      fileId: fileId || '', createdAt: new Date()
    });
    statusEl.style.color = '#2ecc71';
    statusEl.textContent = '☁️ 录音已上传至云端！';
  } catch(err) {
    statusEl.style.color = '#f5c518';
    statusEl.textContent = '📱 录音已保存本地，云端上传失败（可回听）';
    console.warn('[Upload] failed:', err);
  }
}

// ===== UTILITIES =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getCheckins() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveCheckins(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getDayIndex(dateStr) {
  const start = new Date(START_DATE + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - start) / 86400000) + 1;
}

// ===== CHECK IN =====
function doCheckIn() {
  const today = todayStr();
  const checkins = getCheckins();
  if (checkins[today] && typeof checkins[today] === 'object' && checkins[today].time) return;

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const reflection = (document.getElementById('reflectionInput').value || '').trim();
  const readTime = recState === 'done' ? (document.getElementById('recordStatus').textContent.replace('✅ 录音完成！共朗读 ', '') || '') : '';

  if (!checkins[today] || typeof checkins[today] !== 'object') {
    checkins[today] = {};
  }
  checkins[today].time = timeStr;
  checkins[today].reflection = reflection;
  if (readTime && !checkins[today].readTime) checkins[today].readTime = readTime;
  saveCheckins(checkins);

  document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
  document.getElementById('checkinBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box completed';
  const userName = localStorage.getItem(USER_KEY) || '';
  const rt = checkins[today].readTime || '';
  document.getElementById('statusBox').innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${rt ? '朗读时长：' + rt : ''}</b>`;

  if (reflection) {
    document.getElementById('reflectionSaved').style.display = 'block';
  }
  if (recState === 'recording') stopRecording();

  renderCalendar();
  renderHistory();
  updateStats();
}

// ===== STATS =====
function updateStats() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent);
  const checkedDays = keys.filter(k => {
    const v = checkins[k];
    return v && (typeof v === 'string' || v.time);
  }).length;
  document.getElementById('statChecked').textContent = checkedDays;
  document.getElementById('progressCount').textContent = `${checkedDays} / ${TOTAL_DAYS}`;
  document.getElementById('progressFill').style.width = `${(checkedDays / TOTAL_DAYS * 100).toFixed(1)}%`;
  let streak = 0;
  let d = today;
  while (bookContent[d] && checkins[d] && (typeof checkins[d] === 'string' || checkins[d].time)) {
    streak++;
    d = dateAdd(d, -1);
  }
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = Math.max(0, TOTAL_DAYS - checkedDays);
  document.getElementById('progressText').textContent = `打卡进度 ${(checkedDays / TOTAL_DAYS * 100).toFixed(0)}%`;
}

// ===== CALENDAR =====
function renderCalendar() {
  const checkins = getCheckins();
  const today = todayStr();
  const container = document.getElementById('calendarContainer');
  // Show months from June 2026 to Sep 2026
  const months = [
    {year:2026,month:7,label:'2026年7月'},
    {year:2026,month:8,label:'2026年8月'},
    {year:2026,month:9,label:'2026年9月'},
  ];
  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];
  months.forEach(({year,month,label}) => {
    const firstDay = new Date(year,month-1,1).getDay();
    const daysInMonth = new Date(year,month,0).getDate();
    html += `<div style="margin-bottom:20px;">
      <div style="text-align:center;color:#f5c518;font-size:0.9em;margin-bottom:10px;font-weight:bold;">${label}</div>
      <div class="calendar-grid">`;
    weekDays.forEach(w => { html += `<div class="cal-header">${w}</div>`; });
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inRange = bookContent[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const isChecked = checkins[dateStr] && (typeof checkins[dateStr] === 'string' || checkins[dateStr].time);
      let cls = 'cal-day';
      if (!inRange) { cls += isFuture ? ' future' : ' empty'; }
      else if (isChecked) { cls += ' checked'; }
      else if (isToday) { cls += ' today-marker'; }
      else if (isFuture) { cls += ' future'; }
      else { cls += ' available'; }
      const onclick = inRange && !isFuture ? `onclick="showDayModal('${dateStr}')"` : '';
      html += `<div class="${cls}" ${onclick}>${d}</div>`;
    }
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

// ===== HISTORY =====
function renderHistory() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent).sort().reverse();
  const list = document.getElementById('historyList');
  if (!keys.length) { list.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">暂无记录</p>'; return; }
  list.innerHTML = keys.map(dateStr => {
    const data = bookContent[dateStr];
    const record = checkins[dateStr];
    const isChecked = record && (typeof record === 'string' || record.time);
    const isFuture = dateStr > today;
    const dayIdx = getDayIndex(dateStr);
    const dateLabel = dateStr.replace('2026-','').replace('-','月') + '日';
    let checkedLabel = '';
    if (isChecked) {
      const timeStr = typeof record === 'object' ? record.time : record;
      const readTime = typeof record === 'object' ? record.readTime : '';
      const reflection = typeof record === 'object' ? record.reflection : '';
      checkedLabel = `<div class="h-checked">✅ 已打卡 ${timeStr}${readTime ? ' · ' + readTime : ''}</div>`;
      if (reflection) checkedLabel += `<div style="font-size:0.78em;color:#aaa;margin-top:4px;">💬 ${reflection.slice(0,40)}${reflection.length>40?'...':''}</div>`;
    }
    return `<div class="history-item" onclick="showDayModal('${dateStr}')">
      <div class="h-date">${dateLabel} · 第${dayIdx}天${isFuture ? ' <span style="color:#555">（未解锁）</span>' : ''}</div>
      <div class="h-chapter">${data.chapter}</div>
      ${isChecked ? checkedLabel : (isFuture ? '' : '<div style="font-size:0.75em;color:#666;margin-top:4px;">未打卡</div>')}
    </div>`;
  }).join('');
}

          <div class="audio-item-top">
            <span class="audio-item-name">🎤 ${escapeHtml(displayName)}</span>
            <span class="audio-item-date">${dateLabel}</span>
          </div>
          <div class="audio-item-chapter">${escapeHtml(chapterTitle)}</div>
          <div class="audio-player-row">${audioHtml}<span class="audio-duration-badge">${r.duration||''}</span></div>
        </div>`;
      });
      listEl.innerHTML = html;
    }).catch(err => {
      listEl.innerHTML = '<p style="color:#ff4757;text-align:center;padding:40px;">⚠️ 加载失败，请刷新重试</p>';
    });
  } catch(e) { console.warn('[AudioWall]', e); }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TABS =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (el) el.classList.add('active');
  if (tab === 'audiowall') loadAudioWall();
}
</script>
</body>
</html>
