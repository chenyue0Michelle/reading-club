    chapter: '第16天：干法 · 第5章：追求"完美主义"——怎样才能出色工作（2）',
    content: '<p><strong>橡皮绝对擦不掉的错误</strong></p><p>能做成事业的人，都是掌握了“完美主义”，并将它贯彻始终的人。</p><p>这不只是限于制造业，所有的行业、所有的职位都适用这一条规则。</p><p>京瓷还是小企业时曾发生过这样的事。当时，我在会计方面有不理解的地方，就一一向财务部长提出疑问。这让他大伤脑筋，我提的都是“财务报表怎么读”“复式簿记的处理方式”等这样的问题。一个连会计的“会”字都不认识的人却提出了这么多形形色色的问题，那位年长的财务部长每次都露出不悦的神情。不过我虽然年轻，却是他的上司，他也不好太敷衍了事。“常识都不懂，尽提些幼稚的问题，”他内心一边这么想，一边勉强应答。</p><p>有一次，这位部长说明的数字我无法接受，我连连追问，弄得他非常窘迫，无言以对。最初他看我是外行，不把我放在眼里，但在我再三追问之下，证明他的数字有误。他大概也感到不对头，轻轻地连声说了几句“对不起”，赶紧拿来橡皮将错误的数字擦去。对他的这种做法，我实在难以容忍。</p><p>只要一个文字、一个数字错了，就有可能造成工作上的致命后果。这一点他毫无意识。如果这种性质的事发生在新型陶瓷的制造过程中，会造成无法挽回的严重损失。</p><p>所以，当时我大发雷霆，狠狠地批评了他。</p><p>当会计的人，为了便于擦改数字，先用铅笔写，发觉错了就用橡皮擦掉再重写，他们认为没什么大不了。正因为以这种心态做事，所以非常简单的错误却总是改不过来。</p><p>发生了错误用橡皮擦掉、重新再写就行了，抱有这种想法的人不在少数。</p><p>但是，在工作中有很多用橡皮绝对擦不掉的事情，而且，抱着“错了改改就行”这种想法做事，小的失误就会频繁发生，其中就隐含了导致无法挽救的重大错误的危险性。</p><p>无论何时何事，“错了改改就行”的想法绝对不能允许。平时就要用心做到“有意注意”，不允许发生任何差错。贯彻这种“完美主义”才能提高工作质量，同时提升人自身的素质。</p><p>最重要的是“注重细节”</p><p>工作要想做到“完美无缺”，就必须注重细节。</p><p>我学会这一点，是在新型陶瓷研究开发刚开始后不久。新型陶瓷的粉末在进行混合时要使用罐磨机种陶瓷器具，其中放入球形石块，罐磨机转动时石块滚动将原料粉末细化。</p><p>某一天，我的一位前辈技术员坐在清洗场上，用刷子仔细洗刷罐磨机中的石块。这个人一贯工作认真，但沉默寡言，一点不引人注目，正如此时他又在默默地做着清洗石块这样简单枯燥的工作。</p><p>“爽爽快快洗了不就行了吗?这么做不是不得要领嘛!”我一边嘟囔一边就想走开了。但是我想了想，突然停下了脚步。我开始用心观察，只见他正用刮刀将石块中的粉末剔除。石块常会产生缺损，在凹陷处就会粘附上前一次试验用的粉末。这位前辈用刮刀仔细将粉末刮除后，再用刷子用心清洗。</p><p>不仅如此，他还用挂在腰间的毛巾将洗过的石块擦拭得干净光滑。</p><p>看到这种情景，我的头上好像挨了一棒，受到了很大的冲击。</p><p>由于新型陶瓷的性质非常细腻，因此罐磨机中残存的粉末就会成为新试验时的“杂质”，阻碍原料的精确混合。</p><p>因此，每天实验结束后，用过的器具都必须用水洗干净。当时我认为清洗石块不过是一件杂差，与研究开发没有直接关系，所以清洗作业每次都草草了事。因为草率从事，混入杂质，所以总是达不到预期的效果。此时此刻，我终于明白了，我为自己感到羞耻，并进行了深刻的反省。</p><p><strong>做好工作必不可少的认真态度一前辈具备，我却缺乏。这件事意味着什么呢?</strong></p><p>必须注重细节。</p><p>清洗实验用的器具，这好像是杂差，是很单纯的作业，但是正因为是单纯的作业，就更有必要精心做好。德国有句格言:“神寄宿在细节处。”事物的本质决定于细节，美好的事物产生于注重细节的认真态度。</p><p>比道理更重要的是重视经验。</p><p>翻阅无机化学的教科书，关于新型陶瓷，书上写着:将氧化铝、氧化硅、氧化铁等原料混合，成型，高温烧结。</p><p>确实，从理论上讲，书上写得不错，但实际上并不那么简单。不亲临现场，不亲自动手，不反复试验推敲，许多事情都弄不明白，罐磨机的清洗就是一例。只有把理论和实际结合起来，才可能把技术开发做得非常出色。</p><p>不厌其烦，持续、专业地工作。</p><p>无论做什么工作，只有天天持续努力才会进步。即使是清洗，这种简单枯燥的工作，在天天持续努力的过程中也能够积累非常有用的技术和经验。如果讨厌做这样的努力，缺少“持续力”，那么，要做出优良的产品，要完成让自己和别人都满意的工作，是不可能的。</p><p>这些涉及工作本质的基本理念以及劳动的基本态度，就是在这位默默工作的前辈身上学到的。制作“会划破手的”崭新的产品必须是“会划破手的”、崭新的。我一直这么想。</p><p>所谓“会划破手的”、崭新的产品，就是要像刚做出的崭新的纸币那样，手感、质感都很好，美观悦目，无可挑剔。“会划破手的”这个词，是用来形容有价值的产品的、我自己个性化的语言。</p><p>为了用陶瓷制作半导体封装(将用于电子设备的半导体基板封装，以保护基板不受外界环境的影响，同时又能接续电流)，我们京瓷公司由一位工程师牵头，组成了一个研究小组，负责推进这一项目。</p><p>这项研发工作，需要高精的技术，需要多道严格的作业工序，这些都是京瓷从未有过的。仅仅做出样品的过程，就花费了难以想象的时间和辛劳。</p><p>这位工程师把做好的样品拿给我看:“社长，虽然经历辛苦，现在总算把东西做出来了。”我接过来看了一眼。不用说，我心里非常清楚，这个样品是他们汗水的结晶，其中包含了他们苦心钻研的技术的精华。</p><p>但是，我只看了一眼，就觉得这并非我所期待的理想的产品。因为看上去总觉得它“不纯净”。</p><p>陶瓷半导体封装是用新型陶瓷原料，放进氮、氢混合的气体在炉中烧结而成的。如果产品上稍稍附着一点脂肪，燃烧时它就会炭化，产品就会呈现浅灰色。这就是我所看到的“不纯净”。</p><p>对于负责研发的这位工程师来说，或许有点冷酷无情，但我还是下了结论:“性能或许尚可，但它不合格，它的颜色不够鲜亮。”</p><p>他的脸色一下子变了。这可以理解，因为自己倾注全力开发出来的样品，我却不是凭它的“性能”而是凭“外观”就否定了它，他难以接受。</p><p>于是他沉着脸反驳道:“社长也是技术出身的，希望你做出合理评价，颜色不鲜亮同产品的性能无关。”</p><p>“性能方面或许满足了相关要求，但它不是合格的完成品。”我说着，把样品退还给他。</p><p>具备优良性能的产品应该是外观令人赏心悦目的产品。</p><p>因为“外观”就是“最外显的品质内容”。</p><p>外表赏心悦目的产品也会让人觉得是性能优良的产品。</p><p><strong>我又强调说:</strong></p><p>新型陶瓷本来应该是纯白的。人们看到它时，会不禁产生不忍用手去碰的敬畏之心。冒失地用手触摸，会觉得有“手甚至会被划破”这样的虔敬之心。如果外表能做到如此美丽，那它的性能也一定是最好的。</p><p>我把这样的产品称为“会划破手的”崭新的产品。</p><p>太好看了，太完美了，用手摸它、触碰它，手甚至会被划破!制造如此完满无缺的产品，就是我的目</p><p>标!</p><p>回忆起来，这样的形容词，是我幼小的时候常听我父母说的。</p><p>眼前摆着的东西太出色了，令人着迷，人们对它怀着憧憬、敬畏之念，不忍心用手玷污它。在这种情形下，父母就用“会划破手的”这个词来形容它。所以这话我也常常脱口而出。</p><p>要确信自己一定要做到“已经最好，好得不能再好了”。为了把产品做到这样的程度而不惜一切努力一这种“完美主义”，是企望登上“创造”这座高山山顶的人们无论如何必须具备的理念。</p>'
  },
  '2026-07-17': {
    chapter: '第17天：干法 · 第5章：追求"完美主义"——怎样才能出色工作（3）',
    content: '<p><strong>事先“看见完成时的状态”就定能成功</strong></p><p>想要成就某项事业，就应该时时描绘这一事业的理想状态。同时，对于实现这个理想的过程也要反复思考，直到“看得见”这个过程为止。这一点很重要。</p><p>在第二电电(现在的KDDI)开始移动通信事业的时候就是这样。这是我在自己的各个人生关头体验过的事实。</p><p>手机的时代即将到来。”当我做出预言时，周围的人们或者疑惑，或者否定，都认为那是不可能的事。</p><p>但是，我对手机未来的发展已经清楚地“看见了”。</p><p>手机是一种隐藏着无限可能性的产品。它将以何种速度发展，如何普及，以何种价格、什么尺寸在市场流通，这些问题的答案在第二电电的事业正式开始之前，已在我头脑里清晰呈现。</p><p>为什么?因为通过京瓷经营的半导体零部件事业，我已经了解到有关手机技术革新的进展情况和速度，我当时已经具备了充分的信息和知识。</p><p>起初，“移动电话”很大，要用肩扛，被称为“肩扛电话”。后来，由于组成它的各种集成电路得以压缩到小型的半导体内，所以“移动电话”快速地实现了小型化。因此，手机这一新商品必将以惊人的速度普及。对于这一切，当时我已经有了相当精确的预测。</p><p>同时，“契约费是多少”“基本月租费是多少”“话费是什么价格”，这些关于对将来的价格设定的问题，我也事先都想清楚了。当时，一位干部将我讲的数据记在了笔记本上。到移动通信事业正式开始时，他翻阅笔记，结果发现实际的费用体系与我当初预测的数据几乎没有差别。</p><p>这就是所谓事先已经“看见了”。</p><p>在头脑里思考再思考，反复进行模拟演练，就能看见未来。</p><p>“想做成这样”，描绘这种理想，把开始时的想法，提升为强烈的愿望，24小时不断思考，使成功的形象在眼前鲜明浮现。这一点非常重要。</p><p>当你对事情的各个细节都有了明确的印象，最后的结果一定是成功。</p><p>最初只是理想，然后逐步与现实接近，最后理想与现实的界限消失，好像理想已经实现。这种实现的状态，已经完成的形象，就会在头脑中，或者在眼前鲜明地呈现:不是黑白色，而是要以鲜明的彩色出现。只要你反反复复思考，这种现象就会在实际中出现。</p><p>反过来说，缺乏强烈的愿望和深入的思考，事前看不到结果，那么，可以说事业和人生的成功都是靠不住的。</p><p>抓住一切机会磨炼“敏锐度”</p><p>在生产现场，有时会听到机器发出的异音。这时，我就会说:“没听见机器在哭泣吗?”我会对现场负责的人员提出批评。</p><p>机械有故障，往往都是先发出异音。之前声音一直正常悦耳，此时突然产生异音，肯定说明机械出了问题。但是，因为机械的动作可能仍然与平常一样，所以问题往往容易被忽略。我把现场人员的“敏锐度”不佳当作一个问题，向他们严肃指出“要磨炼敏锐度”。</p><p>我几乎养成了一种习惯。我坐车时，只要听到车子稍有异音，就会对驾驶员说:“车子不对头，好像有问题。”但驾驶员基本上都会回答:“同平时一样，没问题。”显得毫不在意。</p><p>这就是“敏锐度”的差异。</p><p>人们都说“没变化，没问题”，而我说“不正常，有问题”。结果把车开到修理厂一查，发现轴承缺了一颗弹子，这样的事例多得是。</p><p>这样一种细腻的“敏锐度”是在工作中“贯彻完美主义”必不可缺的。“敏锐度”太差，反应迟钝，即使产品已经提醒你发生了问题，提示你解决的办法，你仍可能不留神，而错过解决问题的最佳方法和时机。</p><p>同样，就工作现场的整理整顿，我也会不厌其烦，提醒员工们注意。</p><p>可以说这也是一个“敏锐度”的问题。</p><p>可能是了解了我凡事用心的习惯吧，现在即使我突然进到工作现场，那里一般都能保持整洁。</p><p>但有时我看到在办公桌上、检验台上摆放的资料不整齐，有的朝东，有的朝西，我就会感到非常别扭因为桌子和纸张的形状都是长方形的，而资料却斜放或横放就会显得很不整齐。</p><p>“既然桌面是长方形的，资料的放置应当与它一致，才显得协调，否则，感觉就不舒服。资料摆放要与桌边对齐。</p><p>我这样说了以后，凡是资料、笔架等斜放的，他们就都给调整过来，使之与桌边平行。</p><p>即使是物品放置这么细小的事情，也要给人一种整齐协调的感觉。</p><p>这在工作中也一样。</p><p>桌上的东西没放整齐，缺乏平衡感，心就静不下来一只有具备如此细腻的“敏锐度”，才能在问题发生时就很快意识到“不对头”，从而迅速采取对策，把事情做得完美无缺。</p><p>不是“最佳”，而是“完美”</p><p>京瓷创业大约20周年的时候，法国一家大企业休兰伯尔公司的董事长詹恩·里夫先生来访日本。</p><p>休兰伯尔公司在石油开采领域具备极其高超的技术，是一个非常优秀的企业。它能够使用电波测定地层状况，确定钻头接近石油层的适当位置。里夫董事长出身于法国的贵族名门，是当时法国社会党实力政治家们的好友，并一度成为法国政府内阁候选人，是很出色的人物。</p><p>里夫社长来日访问，忙中抽空，特地来京瓷拜访我。“所做的行业完全不同，这位董事长为什么找我?</p><p>我感到奇怪。一问才知道，原来他要来同我谈论经营哲学。</p><p>当时我不太了解休兰伯尔公司和里夫董事长，但见面一谈发现，果然不凡，将公司办成世界屈指可数的大公司，这个人物拥有出色的经营哲学。</p><p>我们虽然是初次见面，却是情投意合。后来，接受他的邀请，我还在美国与他再次会面，欢谈到深夜。</p><p>当时，里夫董事长谈到:“休兰伯尔公司的信条就是尽力把工作做到最佳。”</p><p><strong>对他这句话，我一方面表示赞赏，同时又讲了下面一段话:</strong></p><p>“最佳”这个词，是同别人比较，意思是比较起来是最好的。这是一种相对的价值观，因此，在水平很低的群落里也存在着“最佳”。所以，我们京瓷的目标不是“最佳”，而是“完美”。“完美”同“最佳”不一样，它是绝对性的，不是同别人比较，而是它自身具备可靠的价值，因此，不管别人如何，世上没有什么东西可以超越“完美”。</p><p>这就是我的主张。</p><p>那天夜里，就“最佳”与“完美”，我和里夫董事长的讨论持续到深夜。最后，里夫董事长同意了我的意见。他说:“还是你说得对。今后我们休兰伯尔公司不再把‘最佳’奉为信条，而是要把‘完美’作为信条。”</p><p>我所考虑的“完美主义”不是“更好”，而是“至高无上”。这就是我在工作中不断追求的目标。</p><p>体悟</p><p><strong>让反省为“完美”画上句号</strong></p><p>‘竭尽全力、拼命工作”，再加上“天天反省”，才能为你的完美主义画上最美的句号。抑制“自我”，释放“真我”，让利他之心活跃起来，这样的作业就是“反省”。这样，我们的灵魂就会被净化，就会变得更美丽、更高尚。</p>'
  },
  '2026-07-18': {
    chapter: '第18天：干法 · 第6章："创造性"地工作——每天都要钻研创新',
    content: '<p><strong>第6章“创造性"地工作:每天都要钻研创新</strong></p><p>:若只知步别人的后尘，则绝不能开拓新的事业。</p><p>::每天，哪怕很少一点，也要在“创造性的工作”上下功夫。</p><p>::无论多么渺小的工作，都积极去做，抱着问题意识，对现状动脑筋进行改良。</p><p>不满足于现状，总想做得更好，总想不断提升自己，有没有这种“想法”或许就是产生“成功”与“失败”之间差距的根源。</p><p>每天一点的钻研创新，日积月累，今天比昨天进一步，希望做得更好，这种“上进心”是工作和人生中最重要的，也是进入真正的“创造”之门的秘诀</p><p>敢于走“别人没走过的路”</p><p>“我们接着要做的事，又是人们认为我们肯定做不成的事。”</p><p>这是得过新闻界最高荣誉“普利策奖”的美国著名记者戴维·哈尔伯斯坦先生所引用的我说过的话。戴维在其所著的《下一世纪》一书中，专门用一章的篇幅，讲述了京瓷及其创业者，也就是我的故事。</p><p>他说，京瓷自创业以来，稻盛就以这样的气魄不断开发新产品，不断向新事业发起挑战。</p><p>确实，回顾我自己至今走过的人生，凡是人们都熟知的“走惯的路”，我从未涉足过。昨天走过的路，天再走一趟，或者去重复别人已经走过的路，这与我的天性不合。我总是选择别人没走过的新路，一直走到今天。</p><p>当然，这样的道路绝非平坦，因为谁也没有走过。</p><p><strong>我常做如下比喻:</strong></p><p>我行走在田间泥泞的小道，那不能称为路。脚底一滑就会跌入水田，蛇或青蛙突然出现吓我一跳，但我仍然一步一步向前走。无意间向旁边一瞥，那里铺装平整的大道上车水马龙。如果踏上那条路自然既舒服又方便，但我却凭着自己的意志，反而仍走那无人通行的泥泞小路，而且坚韧不拔地走到今天。</p><p>“铺装平整的大道”是大家都想走的、大家正在走的路。在那样的大路上跟着别人亦步亦趋没有趣味。</p><p>若只知步别人的后尘，则绝不能开拓新的事业。</p><p>同别人干一样的事，很难期待获得出色的成果，因为那么多人走过的路上不会剩下什么有价值的东西。而无人涉足的新路，尽管寸步难行，却可以有许多新的发现和巨大的成果。我一直这么想，也就这样一路走来。</p><p>实际上，那些没人敢走的泥泞之路，行走虽然艰苦，却通向难以想象的光明灿烂的未来。</p><p><strong>“扫地"改变人生</strong></p><p>从京瓷创业到今天，半个世纪中，我充分利用新型陶瓷的特性，从各种产业用陶瓷零部件到各种半导体电子封装零部件，从太阳能发电系统到复印机、手机等，向广泛的事业领域持续地发起挑战。而且，后来又投入跨行业的通信事业，涉足宾馆事业等。</p><p>这并不是因为我具备各行各业的技术，而只是“每天不断进行创造性的工作”，半个世纪以来持续不断，如此而已。</p><p>每天，哪怕很少一点，也要在“创造性的工作”上下功夫。即使一天的进步微不足道，但若经过十年的积累，就一定可以孕育巨大的变化。</p><p>为了说明这一点，我常用“扫地”作为例子。比如，到昨天为止，打扫车间总是用扫帚从右到左扫。那么，今天从四周向中间扫扫试试会怎样呢?</p><p>或者，光用扫帚打扫不干净，用拖把试试怎样?用拖把效果不好，向上司建议，花点钱买台吸尘器如何?买吸尘器要花成本，但从长期看，可以节省时间精力。再进一步，自己改良一下吸尘器，让它扫地又快又干净，如何?</p><p>就这样，扫地这么一件小事，只要开动脑筋，就可以想出许多又快又好的办法。</p><p>这样天天钻研创新，积累一年，你就成了扫地专家，你的经验就会受到车间全体人员的好评。</p><p>这样的话，整幢大楼的清扫工作可能就会委托你负责。再后来，你就可以干脆成立清扫大楼的专业公司，并让它发展壮大。一切亦非不可能。</p><p>如果有另一个人，认为自己“不过是扫地而已”，懒于改进，天天都漫不经心，那么这样的人就绝不会进步，绝没有发展，一年之后还是老样子，仍然磨磨蹭蹭，还是扫地而已。</p><p>这样的事，不只限于扫地。</p><p>对工作和人生也完全一样。</p><p>无论多么渺小的工作，都积极去做，抱着问题意识，对现状动脑筋进行改良。能这么做的人和缺乏这种精神的人，假以时日，两者之间会产生惊人的差距。</p><p>不满足于现状，总想做得更好，总想不断提升自己，有没有这种“想法”或许就是产生“成功”与“失败”之间差距的根源。</p><p>每天一点的钻研创新，日积月累，今天比昨天进一步，希望做得更好，这种“上进心”是工作和人生中最重要的，也是进入真正的“创造”之门的秘诀。</p><p>每天一点的钻研创新，日积月累，今天比昨天进一步，希望做得更好，这种“上进心”是工作和人生中最重要的，也是进入真正的“创造”之门的秘诀。</p><p><strong>外行的长处是可以自由发想</strong></p><p>京瓷以及任天堂、欧姆龙、村田制作所、罗姆等，京都有一大批优秀的企业。这些企业的创业者原先都是各自领域的“外行”，或相当于“外行”的人物。</p><p>拿我来说，我大学的专业是有机化学。在临近毕业前才学了一点与新型陶瓷相关的无机化学，所以我绝非这个领域的内行、专家。</p><p>因家庭电视游戏机而一举成功的任天堂，原先也只是做花纸牌、扑克牌的公司。推进公司快速发展的第三代社长山内溥，过去从没做过游戏机的硬件和软件，可以说在这个领域他也完全是个“外行”。</p><p>控制设备的大型制造企业欧姆龙也一样。战后，创业者立石一真在美国第一次看到“微型开关”，立即产生一种直觉:“今后日本也一定需要这种控制系统的产品。”以前，立石从没做过弱电用的产品，所以他创业开始时也是“外行”。</p><p>电子零部件企业的大家村田制作所的创业者村田昭，原先在京都的东山，即瓷器“清水烧”的故乡做事。战时，军队要求他制造氧化钛电容器。他勇敢地向新事物挑战，这才有了今天的村田。</p><p>罗姆是一家颇具特色的电子零部件企业。创业者佐藤研一郎原先的志向在音乐。学生时代，因掌握了高效制造碳模电阻的技术，便以此为基础开始创业。从这个意义上讲，他也是属于“外行”的一位社长。</p><p>这样的共性并非偶然。</p><p>那就是:外行可以“自由发想”。</p><p>“外行”没有先人观念，不拘于既成的习惯、惯例，总能自由发想。这是向新事物挑战时最大的优点。</p><p>我认识到这一点，是在京瓷创业几年后的事情。当时，有一家陶瓷企业委托我们生产某种产品。这家企业创业比我们早，规模远远大于京瓷，是行业内日本屈指可数的大企业。</p><p>“因为从欧美来的新型陶瓷订单大幅增加，自己来不及做，所以请京瓷帮忙。”说是这么说，但经过进一步了解，他们的目的在于通过这种产品的生产制造，来学习京瓷的技术。</p><p>我断然拒绝。这时候对方的社长才说了老实话。这段话我至今记忆犹新。</p><p>我们公司的研究所里，名牌大学陶瓷专业毕业的优秀人才不少。说这话有点失礼，听说稻盛先生是地方大学有机化学专业出身，而且贵公司几乎没有博士。我们非常想知道，为什么贵公司能做的事，我们公司反而做不到。</p><p>听他这么讲我才意识到:“自由发想”这件事是“外行”干的，不是“专家”干的。</p><p>成就新事业的，是那些不被任何成见束缚、冒险心强烈的“外行”，而不是在该领域经验丰富、具备许多常识、积累了许多经验的专家。从这位社长的话中，我获得了这一感想，并联想到各种事情。</p><p>希望诸位读者，也要“自由发想”，抱着强烈愿望，去挑战新事物。</p><p><strong>既然定了计划，就一定要实现</strong></p>'
  },
  '2026-07-19': {
    chapter: '第19天：干法 · 第6章："创造性"地工作——每天都要钻研创新（2）',
    content: '<p><strong>我在1982年京瓷的经营方针发表会上提出了如下口号:</strong></p><p>实现新的计划关键在于不屈不挠、一心一意。因此，必须聚精会神，抱着高尚的思想和强烈的愿望，坚韧不拔地干到底。</p><p>这一段话，是从提倡积极思考的哲学家中村天风先生的著作中摘录的。</p><p>这段话的意思是:如果你期望实现新的计划，那么，不管遇到什么样的困难也绝不能放弃。必须全神贯注、全力以赴，用高尚的思想和强烈的愿望不断描绘心中的蓝图。这一点非常重要。只要做到这一点，那么无论什么困难的目标都一定能达成。</p><p>通过这句经营口号我想表达的是:在人的“思想、愿望”里面包含着成就事业的力量。特别是，如果这种“思想、愿望”是高贵的、美好的、纯粹的，并且是一以贯之的，那么，它就会发挥最大的力量，实现人们认为无法实现的计划和目标。</p><p>在人的“思想、愿望”里存在着巨大的力量。对于这一点，一般人感到难以理解，所以，他们新的计划建立不久，就开始担忧起来:“市场环境不是在变吗?”“或许会遭遇预料之外的障碍。”</p><p><strong>“如果失败了怎么办?</strong></p><p>然而，一旦心中产生这种杞人忧天似的烦恼，产生哪怕一丝的不安和恐惧，那么这种“思想、愿望”所持有的力量就会大幅衰减，计划和目标就变得无法实现。</p><p>我打出这一口号之后两年，为了亲自证明人的这种纯粹的“思想、愿望”究竟可以成就多么伟大的事业，借以激励更多的人，我毅然投身于第二电电这一宏大的事业。</p><p>1984年，随着通信自由化，京瓷和其他两家企业报名参与通信事业，新电电三家企业开始了竞争。这三家企业中，以京瓷为母体的第二电电，与其他两家相比，处于绝对的劣势，这是事前舆论的评判。</p><p>那是因为作为经营者，我自己就没有通信事业的经验，京瓷也缺乏通信技术的积累。其他两家分别可以利用现有的铁路和公路，在沿线铺设光缆，但京瓷却不得不单独开辟自己的通信网络，必需的基础设施只能从零开始构建。另外从营业角度讲，因为母公司京瓷的规模尚小，在获取客户方面也比较困难，等等。</p><p>但实际上，营业开始后不久，就在“这也缺、那也缺，什么都是劣势”之中，开张后的第二电电，在新电电三家企业中，取得了最为优异的成绩，一路领先。</p><p>这是因为第二电电虽然是“外行”，但是投入这项事业的“思想、愿望”却比哪家公司都要强烈而且纯粹。只要具备这种强烈而美好的愿望，事业所需要的技术和经验，此后就会源源不断地流入。</p><p>我揭示了一个纯粹的、合乎大义名分的目标:“降低通信费用，对信息化社会的国民做出贡献。”我决心创建第二电电。同时这个“思想、愿望”是不是真的高尚而且纯粹，我又用“动机至善、私心了无”这句话来严格地逼问自己。</p><p>“想创建第二电电”，这是为了“让自己成为更大的富翁吗”?是为了“让自己更加出名吗”?这是从私利私欲出发的愿望呢?还是从“为社会、为世人”，即从良知良心、不夹杂私心出发的愿望呢?我对照“动机至善、私心了无”这八个字，连续几个月，不停地自问自答。</p><p>在确认自己“没有任何私心”以后，我才决心踏上第二电电的创业之路。</p><p>当时的京瓷在东京等中心城市是一个知名度很低的企业，销售额只有2500亿日元。这种微不足道的地方中坚企业，居然向销售额几万亿日元的国营企业NTT发动挑战，简直太莽撞、太不自量力了，正如堂吉诃德手持长矛冲向风车一样。世间净是这样的讽刺和评论。</p><p>然而，我对这一事业的成功，从来没有丝毫的怀疑。因为我对人的“思想、愿望”所持有的巨大力量深信不疑。</p><p>活跃在20世纪初期的英国启蒙思想家詹姆斯·埃伦，在他所著的《原因与结果的法则》一书中，非常精彩地表达了这个观点:</p><p>心地肮脏的人因为害怕失败而不敢涉足的领域，心灵纯洁的人随意踏入就轻易获胜，这样的事例并不鲜见。原因是，心灵纯洁的人总是气定神闲，他们总是以更为明确、更强有力的目的和意识来引导自己能量发挥的方向。</p><p>我认为，只要抱着纯粹的、美好的、强烈的愿望，付出不亚于任何人的努力，那么，任何困难的目标都一定能够实现一这就是京瓷和第二电电成长发展的历史已经证明的“真理”。</p><p>“只要具备纯粹而强烈的愿望，就必定能成功!”相信这一点，自始至终怀抱一颗纯净而美好的心，付出不亚于任何人的努力，新的事业就一定能成功。</p><p><strong>乐观构思、悲观计划、乐观实行</strong></p><p>开拓新事业并让它获得成功的人，多数是天性乐观的人，他们能够开朗明快地描绘自己的未来。</p><p>“头脑里闪过这样的念头，按现在的情况实现的可能性不高，但要是拼命努力的话，一定能够成功。那么，干起来吧!”这种性情乐观的人容易接近成功。</p><p>因此，在推进看来非常困难的新事业时，我经常起用这种“盲目乐观的马大哈式的人物”。</p><p>他们虽然头脑简单、有点“马大哈”，但听到我新的设想时，马上就会天真地表示赞同:“这很有意思，一定得干!”甚至当场卷起袖管，跃跃欲试。我常常委派这样的人担任新项目的领头人。</p><p>头脑聪明的人中悲观论者居多。这些人头脑敏锐，自以为有先见之明，似乎在事情实行之前就能判断成败。因此，当和他们提到新的构想时，他们往往下消极否定的判断:“这很难”，“实现的可能性不大”。悲观派虽然有一定的先见之明，但他们的消极态度往往抑制了项目的实行力和推进力。</p><p>而乐观派正好相反。虽然看到前景中有暗淡处，但他们却有前进的动力。所以在项目构思和开始阶段，我会借用乐观派的力量，让他们当牵头人。但是，当这种构想进入具体计划时，再全部委托乐观派就很危险。因为乐观派的动力容易失控、陷入莽撞，或误入歧途。</p><p>这时就要委托性格谨慎、深思熟虑、对事物善于观察的人当副手，事先设想到所有的风险，慎重细致地建立起实际的行动计划。</p><p>不过，一味谨慎也不行。</p><p>这些人在设想的困难和障碍面前，往往鼓不起实施的勇气，所以计划一旦进入实行阶段，又要回到乐观论，必须采取坚决果断的行动。</p><p>“乐观构思、悲观计划、乐观实行。”我认为，这就是向新课题发起挑战最好的方法。</p>'
  },
  '2026-07-20': {
    chapter: '第20天：干法 · 第6章："创造性"地工作——每天都要钻研创新（3）',
    content: '<p><strong>将创造发明导向成功的“正确的地图"</strong></p><p>新型陶瓷技术革新的先驱一给予我这一光荣的称号，我觉得过奖了。如果说，我能获得如此之高的评价，我认为，那是因为我对新型陶瓷寄予的期望特别强烈的缘故。</p><p>在技术开发领域，要取得革命性的成果，光有专业知识，光积累技术还不够，还必须对工作具备强烈的“愿望”。特别是在未知领域开拓事业，“无论如何，一定要把这样的东西做出来”，这种强烈的愿望绝对必要。</p><p>具备了这种强烈的愿望，在未知领域遭遇意想不到的困难时，才能克服它，才能将工作向前推进。其结果，就能超越常识，做出划时代的发明创造。</p><p>如果要打比方，所谓技术创新，所谓发明创造，就像没有指南针的小船航行于漆黑的大海之上。在伸手不见五指的海面上，要保持正确的方向，要顺利到达目的地，所必需的就是对工作的强烈的愿望。</p><p>漆黑一团之中，没有灯塔，连星光也没有，没有任何办法可以确定前进的方向。小船该驶向何方，困顿迷惑，甚至因为恐惧，不敢前进一步。但如果陷于迷惑、束手无策，就必定无法前进。因此，在开拓前人未涉的领域时，在自己的心中，必须具备指引方向的指南针，借以坚定前进的信心。所谓心中的指南针，就是类似于“信念”的强烈愿望。</p><p>在新型陶瓷这个行业内，京瓷是最后出发的。开始时，技术、设备、人才都不足，所拥有的只有“愿望”。但是，京瓷的发展证明，只要有这种“愿望”，只要这种“愿望”足够强烈，就足以克服任何不利条件，达到预定的目的地。</p><p>当然，划时代的发明创造，不是只要一两年就能轻易做到的。有时即使10年、20年也达不到预定的目标。但是，如果因此半途而废，那么，任何新事业都不可能成功。</p><p>而强烈的愿望，就是在达到成功之前绝不放弃，一步一步前进，天天钻研创新，日积月累。所谓强烈的愿望，就是靠这种执着的努力来支撑。</p><p>京瓷以新型陶瓷的结晶技术为基础开发的太阳能电池就是一个突出的例子。取得今天的成功，我们花费了将近30年的时间，但现在它已经成为京瓷的主力事业。</p><p>就是说，“无论如何也想这么干”这种强烈的愿望是事业的起点。“不管怎样也要继续干下去”这种持续不断、不知疲倦的努力、钻研和创新，就是事业成功的推动力。</p><p>一步一步踏实的工作，一段一段扎实的业绩，积累3年、5年乃至10年，就像乌龟爬行一样，就一定会帮助你取得成功。就算别人说你“泥土气”“没效率”，你也绝不能退缩。</p><p>有时，拼命、踏实、持续努力的人自己也会产生怀疑:“这么干下去，到底能成何事呢?</p><p><strong>这时候我就想对他们说:</strong></p><p>天天不懈努力，钻研创新，这就是到达技术革新终点的“正确的地图”，就是通向成功的确凿的道路。</p><p>事实上我自己就是这样。</p><p>我没有可以夸耀的高学历，上苍也没有赋予我杰出的才能。我努力去喜欢自己的工作，强迫自己投入到新型陶瓷的研究中去。在这个过程中，我对新型陶瓷真的产生了兴趣，不知从何时起，就一头钻了进去。</p><p>后来，按照客户的要求，我一心一意、踏实努力，不断钻研创新。因此，不仅经营的企业在新型陶瓷领域内首屈一指，而且我本人也成了这一领域的专家，从产、官、学各方面都获得了很高的评价。</p><p>我意外获得了“新型陶瓷先驱者”的荣誉，但回顾自己的人生，首先浮现在我头脑里的就是“天天钻研创新就能孕育真正的创造和成功”这句话。这实在是太过平凡的经验。</p><p>即使每一天的努力和钻研创新只有很小一点点成绩，但是，如果积累1年、5年、10年，那么进步之大就极为可观，最终就能获得惊人的创造性的丰硕成果。</p><p>体悟</p><p><strong>改善与改良最重要</strong></p><p>即使是平凡简单的工作，只要不断地钻研创新，也会带来飞跃性的进步。在每天的工作中时刻思考“这样做是否可行”，带着“为什么”的疑问，今天胜过昨天，明天胜过今天，持续不断地对工作进行改善与改</p><p>良，最终一定能取得出色的成就。</p>'
  },
  '2026-07-21': {
    chapter: '第21天：干法 · 结语：人生·工作的结果 = 思维方式×热情×能力',
    content: '<p><strong>结语人生·工作的结果=思维方式x热情X能力</strong></p><p>::只要拼命努力就可以弥补能力的不足，从而取得巨大的成功。</p><p>:要度过幸福的人生，要把工作做到最好、事业做到最大，就无论如何必须具备正确的、正面的“思维方式”。</p><p>诸位读者，我也希望你们持有正面的“思维方式”，满怀“热情”，付出不亚于任何人的努力，把自己所持的“能力”最大限度地发挥出来，正面面对自己的工作，把工作做得更出色。</p><p>如果能做到这些，我可以保证，你们的人生一定会硕果累累，一定会幸福美满。</p><p>做人的“正确的思维方式”</p><p><strong>我的工作观乃至人生观可以用一个方程式来表达，它就是:</strong></p><p><strong>人生·工作的结果=思维方式X热情能力</strong></p><p><strong>为什么会想出这个方程式呢?</strong></p><p>因为我初中升学考试、大学升学考试、就职考试，每次都不理想，志愿都落空。所以参加工作以后我就不断思考:“像自己这样平凡的人，如果想要度过一个美好的人生，究竟需要什么条件呢?</p><p>同时，观察周围，既有工作和人生都很成功的人，也有很失败的人。看到这种情形，我就想:“为什么有的人人生和工作都很顺利，有的人却不顺利，这中间有没有什么法则可寻呢?”</p><p>这样，在京瓷创业后不久，我就想出了这个方程式。此后，我就遵循这个方程式努力工作，在人生道路上不断前进。同时，不仅我自己努力实践这个方程式，而且一有机会我也会向员工们解释这个方程式的重要性。</p><p>这个方程式由“能力”“热情”“思维方式”三个要素组成。所谓“能力”，就是指智能、运动神经或者健康等，这是由父母或上天授予的。带着优秀的资质来到这世上，在漫长的人生中，这是最初被授予的一笔重要的财富。</p><p>但是，由于它是先天的，所以不涉及每个人的意志和责任。这种可称为天赋之才的“能力”，如果用分数来表示，就因人而异，从“0分”到“100分”。</p><p>要在这个“能力”之上再乘以“热情”这个要素。“热情”又可称为“努力”。从缺乏干劲、霸气、朝气、懒散潦倒的人，到对人生和工作充满火焰般热情拼命工作的人，这中间也有个人的差别，也从0分到100分。</p><p>不过，这个“热情”可以由自己的意志决定。</p><p>我把这个“热情”发挥到极致，持续做出了无限度的、不亚于任何人的努力。从创建京瓷到今天为止，我从“付出加倍于人的努力，至少能达到一般人的水准吧”这一想法出发，全身心投入，不分昼夜地工作。</p><p>我把这个“能力”和“热情”的乘积用分数来表示。</p><p>比如某人很健康，头脑聪明，“能力”打90分。但他因为有能力而过分自信，不肯认真努力，“热情”只够30分，那么，“90分的能力”乘以“30分的努力”，结果是2700分。</p><p>另一个人认为自己的能力至多只比平均值略高，只能打60分，但因为缺乏能力所以必须格外努力，因此热情燃烧、拼命努力。他的“热情”可打90分，那么“60分的能力”乘以“90分的努力”，结果就是5400分。</p><p>这就是说，同刚才那位有才能的人物相比，分数高出一倍。所以，即使能力很平凡，但只要拼命努力就可以弥补能力的不足，从而取得巨大的成功。</p><p>此外，还需要在这个基础上乘以“思维方式”。我认为，这个“思维方式”最为重要。与“能力”和“热情”不同，“思维方式”的分值从“-100分”到“100分”，变化的幅度很大。</p><p>不厌辛劳，愿他人好，愿为大家的幸福而拼命工作，这样的“思维方式”就是正值;相反，愤世嫉俗、怨天尤人，否定真诚的人生态度，这种“思维方式”就是负值。</p><p>如果是这样，那么因为是乘法，持有正面的“思维方式”，人生·工作的结果就会是一个更大的正值。相反，如果持有负面的“思维方式”，哪怕是很小的负数，乘积一下就成了负值，而“能力”越强，“热情”越高，反而会给人生和工作带来更大的负面影响，这是无情的事实。</p><p>拿刚才的例子来说，具备“60分能力”和“90分热情”的那个人，如果他持有作为人的正确的“思维方式”，并达到90分，那么方程式的值是60乘以90再乘以90，乘积为486000分，是一个很了不起的高分。</p><p>相反，如果“能力”和“热情”的分值相同，“思维方式”只是稍稍偏向否定，比如仅是-1分，那么，乘积立即变为-5400分。如果是负面的-90分，即“思维方式”极其恶劣，那么最终得分就是-486000分，他的人生将会是悲惨的下场。</p><p>最近就有一些风险企业的经营者，他们才华出众、热情洋溢，创建的企业一举上市，就获得了巨额财富。然而，他们以 async function hmacSha1(key, msg) {
  var enc = new TextEncoder();
  var keyData = (typeof key === 'string') ? enc.encode(key) : key;
  var msgData = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var cryptoKey = await crypto.subtle.importKey('raw', keyData, {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha1Hash(msg) {
  var enc = new TextEncoder();
  var data = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function cosSignHeaders(method, path) {
  var now = Math.floor(Date.now()/1000);
  var keyTime = (now-60)+';'+(now+3600);
  var signKey = await hmacSha1(COS_CONFIG.SecretKey, keyTime);
  var httpString = method.toLowerCase()+'\n'+path+'\n\n\n';
  var httpStringHash = await sha1Hash(httpString);
  var stringToSign = 'sha1\n'+keyTime+'\n'+httpStringHash+'\n\n\n\n\n';
  var signature = await hmacSha1(signKey, stringToSign);
  var auth = 'q-sign-algorithm=sha1&q-ak='+COS_CONFIG.SecretId+'&q-sign-time='+keyTime+'&q-key-time='+keyTime+'&q-header-list=&q-url-param-list=&q-signature='+signature;
  return { Authorization: auth };
}
async function uploadToCloud(blob, fileName) {

    var url = 'https://'+COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com/recordings/'+fileName;
    var headers = await cosSignHeaders('PUT', filePath);
    headers['Host'] = COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com';
    var result = await new Promise(function(resolve,reject){
      var timer = setTimeout(function(){reject(new Error('上传超时'));}, 30000);
      fetch(url, {method:'PUT', headers, body:blob}).then(function(res){
        clearTimeout(timer);
        if (res.ok||res.status===200) { resolve(url); }
        else { res.text().then(t=>{reject(new Error('HTTP '+res.status));}).catch(()=>{reject(new Error('HTTP '+res.status));}); }
      }).catch(function(err){clearTimeout(timer); reject(new Error('网络错误: '+(err.message||err)));});
    });
    return result;
  } catch(e) { throw new Error(e&&e.message?e.message:String(e)); }
}

// ===== RECORDING - FIXED VERSION =====
// States: 'idle' | 'recording' | 'done'
let recState = 'idle';
let mediaRecorder = null;
let recordedChunks = [];
let mediaStream = null;
let recordTimer = null;
let recordSeconds = 0;
let currentBlob = null;

function handleRecordClick() {
  if (recState === 'idle') {
    startRecording();
  } else if (recState === 'recording') {
    stopRecording();
  } else if (recState === 'done') {
    // Click mic icon again = start new recording
    resetRecording();
    startRecording();
  }
}

function handleActionBtnClick() {
  // "重新录制" button
  resetRecording();
}

function resetRecording() {
  recState = 'idle';
  currentBlob = null;
  recordSeconds = 0;
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var uploadStatus = document.getElementById('uploadStatus');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn';
  btn.textContent = '🎤';
  btn.title = '点击开始录音';
  status.className = 'record-status';
  status.textContent = '点击麦克风开始朗读录音';
  duration.textContent = '';
  actionBtn.style.display = 'none';
  uploadStatus.className = 'record-upload-status';
  uploadStatus.textContent = '';
  playback.className = 'record-playback';
}

function startRecording() {
  var status = document.getElementById('recordStatus');
  var btn = document.getElementById('recordBtn');

  // 立即给点击反馈
  btn.style.opacity = '0.6';
  setTimeout(function(){ btn.style.opacity = ''; }, 150);

  var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost && location.protocol !== 'https:') {
    status.textContent = '⚠️ 请使用 HTTPS 访问（或本地 localhost 预览）';
    status.style.color = '#ff6b6b';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ 您的浏览器不支持录音，请用手机浏览器打开';
    status.style.color = '#ff6b6b';
    return;
  }

  status.textContent = '🎤 正在请求麦克风权限...';
  status.style.color = '#ffa502';

  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function(stream) {
      mediaStream = stream;
      recordedChunks = [];
      recordSeconds = 0;

      let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        currentBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        onRecordingDone();
      };

      mediaRecorder.start();
      recState = 'recording';

      var duration = document.getElementById('recordDuration');
      btn.className = 'record-btn recording';
      btn.textContent = '⏹';
      btn.title = '点击停止录音';
      status.className = 'record-status active';
      status.textContent = '🔴 正在录音中... 点击⏹停止';
      status.style.color = '';
      duration.textContent = '已录 0秒';

      recordTimer = setInterval(function() {
        recordSeconds++;
        var m = Math.floor(recordSeconds / 60);
        var s = recordSeconds % 60;
        duration.textContent = '已录 ' + (m > 0 ? m + '分' : '') + s + '秒';
      }, 1000);
    })
    .catch(function(err) {
      var errMsg = err && err.message ? err.message : String(err || '');
      if (errMsg.indexOf('Permission') >= 0 || errMsg.indexOf('Denied') >= 0 || errMsg.indexOf('denied') >= 0) {
        status.textContent = '⚠️ 麦克风权限被拒绝，请在地址栏允许后重试';
      } else if (errMsg.indexOf('NotFound') >= 0) {
        status.textContent = '⚠️ 未检测到麦克风设备';
      } else {
        status.textContent = '⚠️ 录音启动失败：' + (errMsg || '未知错误');
      }
      status.style.color = '#ff6b6b';
    });
}

function stopRecording() {
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  recState = 'done';

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function onRecordingDone() {
  var m = Math.floor(recordSeconds / 60);
  var s = recordSeconds % 60;
  var timeStr = (m > 0 ? m + '分' : '') + s + '秒';

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn done';
  btn.textContent = '✅';
  btn.title = '录音完成，点击重新录制';
  status.className = 'record-status done-status';
  status.textContent = '✅ 录音完成！共朗读 ' + timeStr;
  duration.textContent = '点击播放器回听，或点击麦克风重新录制';

  // Show playback
  var player = document.getElementById('recordPlayer');
  player.src = URL.createObjectURL(currentBlob);
  playback.className = 'record-playback show';

  // Show redo button
  actionBtn.textContent = '重新录制';
  actionBtn.className = 'record-action-btn redo-btn';
  actionBtn.style.display = 'block';

  // Save read time to checkins
  var today = todayStr();
  var checkins = getCheckins();
  if (!checkins[today]) checkins[today] = {};
  if (typeof checkins[today] === 'string') checkins[today] = { time: checkins[today] };
  checkins[today].readTime = timeStr;
  checkins[today].readSeconds = recordSeconds;
  saveCheckins(checkins);

  // Upload in background
  doUploadAudio(today, timeStr);
}

async function doUploadAudio(dateStr, durationStr) {
  var statusEl = document.getElementById('uploadStatus');
  statusEl.className = 'record-upload-status show';
  statusEl.innerHTML = '<span class="loading-spin"></span> 正在上传录音到云端...';

  try {
    if (!currentBlob) { statusEl.textContent = '⚠️ 无录音内容'; return; }
    var userName = localStorage.getItem(USER_KEY) || '匿名';
    var timestamp = Date.now();
    var safeName = dateStr + '_' + userName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '') + '_' + timestamp;
    var fileId = await uploadToCloud(currentBlob, safeName + '.webm');
    var dayIdx = getDayIndex(dateStr);
    var chapterInfo = bookContent[dateStr] || {};
    await saveRecordToDB({
      userName, date: dateStr, dayIndex: dayIdx,
      chapter: chapterInfo.chapter || '',
      duration: durationStr, fileSizeKB: Math.round(currentBlob.size/1024),
      fileId: fileId || '', createdAt: new Date()
    });
    statusEl.style.color = '#2ecc71';
    statusEl.textContent = '☁️ 录音已上传至云端！';
  } catch(err) {
    statusEl.style.color = '#f5c518';
    statusEl.textContent = '📱 录音已保存本地，云端上传失败（可回听）';
    console.warn('[Upload] failed:', err);
  }
}

// ===== UTILITIES =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getCheckins() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveCheckins(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getDayIndex(dateStr) {
  const start = new Date(START_DATE + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - start) / 86400000) + 1;
}

// ===== INIT =====
function init() {
  renderToday();
  renderCalendar();
  renderHistory();
  updateStats();
  loadAudioWall();
}

// ===== TODAY =====
function renderToday() {
  const today = todayStr();
  const checkins = getCheckins();
  const data = bookContent[today];
  const badge = document.getElementById('todayBadge');
  const chapter = document.getElementById('todayChapter');
  const contentEl = document.getElementById('todayContent');
  const btn = document.getElementById('checkinBtn');
  const statusBox = document.getElementById('statusBox');

  if (!data) {
    const isBeforeStart = new Date(today) < new Date(START_DATE);
    badge.textContent = isBeforeStart ? '待开始' : '已结束';
    chapter.textContent = isBeforeStart ? '读书计划尚未开始' : '《干法》全书共读圆满完成！';
    contentEl.innerHTML = isBeforeStart
      ? '<p>读书打卡活动将于 <strong>2026年7月1日</strong> 正式开始，请耐心等待！</p><blockquote>热爱工作是万病良药——稻盛和夫</blockquote>'
      : '<p>🎉 恭喜您完成了《干法》全书21天的阅读打卡之旅！</p><blockquote>感谢陪伴，继续前行！</blockquote>';
    btn.textContent = isBeforeStart ? '⏳ 尚未开始' : '✅ 已全部完成';
    btn.disabled = true;
    statusBox.className = 'status-box ' + (isBeforeStart ? 'not-started' : 'completed');
    statusBox.textContent = isBeforeStart ? '活动将于 7月1日 开始' : '《干法》全书共读圆满完成！';
    return;
  }

  const dayIdx = getDayIndex(today);
  badge.textContent = `第 ${dayIdx} 天`;
  chapter.textContent = data.chapter;
  contentEl.innerHTML = data.content;
  applyFontSize();

  if (checkins[today]) {
    const record = checkins[today];
    const timeStr = typeof record === 'object' ? record.time : record;
    const readTime = typeof record === 'object' ? record.readTime : '';
    const reflection = typeof record === 'object' ? record.reflection : '';
    btn.textContent = '✅ 今日已打卡';
    btn.disabled = true;
    statusBox.className = 'status-box completed';
    const userName = localStorage.getItem(USER_KEY) || '';
    statusBox.innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${readTime ? '朗读时长：' + readTime : ''}</b>`;
    if (reflection) {
      document.getElementById('reflectionInput').value = reflection;
      document.getElementById('reflectionSaved').style.display = 'block';
    }
    document.getElementById('reflectionInput').disabled = true;
  } else {
    btn.textContent = '📝 提交打卡';
    btn.disabled = false;
    statusBox.className = 'status-box in-progress';
    statusBox.textContent = '📖 今日内容已解锁，请阅读后打卡';
    document.getElementById('reflectionInput').disabled = false;
  }
}

// ===== CHECK IN =====
function doCheckIn() {
  const today = todayStr();
  const checkins = getCheckins();
  if (checkins[today] && typeof checkins[today] === 'object' && checkins[today].time) return;

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const reflection = (document.getElementById('reflectionInput').value || '').trim();
  const readTime = recState === 'done' ? (document.getElementById('recordStatus').textContent.replace('✅ 录音完成！共朗读 ', '') || '') : '';

  if (!checkins[today] || typeof checkins[today] !== 'object') {
    checkins[today] = {};
  }
  checkins[today].time = timeStr;
  checkins[today].reflection = reflection;
  if (readTime && !checkins[today].readTime) checkins[today].readTime = readTime;
  saveCheckins(checkins);

  document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
  document.getElementById('checkinBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box completed';
  const userName = localStorage.getItem(USER_KEY) || '';
  const rt = checkins[today].readTime || '';
  document.getElementById('statusBox').innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${rt ? '朗读时长：' + rt : ''}</b>`;

  if (reflection) {
    document.getElementById('reflectionSaved').style.display = 'block';
  }
  if (recState === 'recording') stopRecording();

  renderCalendar();
  renderHistory();
  updateStats();
}

// ===== STATS =====
function updateStats() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent);
  const checkedDays = keys.filter(k => {
    const v = checkins[k];
    return v && (typeof v === 'string' || v.time);
  }).length;
  document.getElementById('statChecked').textContent = checkedDays;
  document.getElementById('progressCount').textContent = `${checkedDays} / ${TOTAL_DAYS}`;
  document.getElementById('progressFill').style.width = `${(checkedDays / TOTAL_DAYS * 100).toFixed(1)}%`;
  let streak = 0;
  let d = today;
  while (bookContent[d] && checkins[d] && (typeof checkins[d] === 'string' || checkins[d].time)) {
    streak++;
    d = dateAdd(d, -1);
  }
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = Math.max(0, TOTAL_DAYS - checkedDays);
  document.getElementById('progressText').textContent = `打卡进度 ${(checkedDays / TOTAL_DAYS * 100).toFixed(0)}%`;
}

// ===== CALENDAR =====
function renderCalendar() {
  const checkins = getCheckins();
  const today = todayStr();
  const container = document.getElementById('calendarContainer');
  // Show months from June 2026 to Sep 2026
  const months = [
    {year:2026,month:7,label:'2026年7月'},
    {year:2026,month:8,label:'2026年8月'},
    {year:2026,month:9,label:'2026年9月'},
  ];
  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];
  months.forEach(({year,month,label}) => {
    const firstDay = new Date(year,month-1,1).getDay();
    const daysInMonth = new Date(year,month,0).getDate();
    html += `<div style="margin-bottom:20px;">
      <div style="text-align:center;color:#f5c518;font-size:0.9em;margin-bottom:10px;font-weight:bold;">${label}</div>
      <div class="calendar-grid">`;
    weekDays.forEach(w => { html += `<div class="cal-header">${w}</div>`; });
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inRange = bookContent[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const isChecked = checkins[dateStr] && (typeof checkins[dateStr] === 'string' || checkins[dateStr].time);
      let cls = 'cal-day';
      if (!inRange) { cls += isFuture ? ' future' : ' empty'; }
      else if (isChecked) { cls += ' checked'; }
      else if (isToday) { cls += ' today-marker'; }
      else if (isFuture) { cls += ' future'; }
      else { cls += ' available'; }
      const onclick = inRange && !isFuture ? `onclick="showDayModal('${dateStr}')"` : '';
      html += `<div class="${cls}" ${onclick}>${d}</div>`;
    }
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

// ===== HISTORY =====
function renderHistory() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent).sort().reverse();
  const list = document.getElementById('historyList');
  if (!keys.length) { list.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">暂无记录</p>'; return; }
  list.innerHTML = keys.map(dateStr => {
    const data = bookContent[dateStr];
    const record = checkins[dateStr];
    const isChecked = record && (typeof record === 'string' || record.time);
    const isFuture = dateStr > today;
    const dayIdx = getDayIndex(dateStr);
    const dateLabel = dateStr.replace('2026-','').replace('-','月') + '日';
    let checkedLabel = '';
    if (isChecked) {
      const timeStr = typeof record === 'object' ? record.time : record;
      const readTime = typeof record === 'object' ? record.readTime : '';
      const reflection = typeof record === 'object' ? record.reflection : '';
      checkedLabel = `<div class="h-checked">✅ 已打卡 ${timeStr}${readTime ? ' · ' + readTime : ''}</div>`;
      if (reflection) checkedLabel += `<div style="font-size:0.78em;color:#aaa;margin-top:4px;">💬 ${reflection.slice(0,40)}${reflection.length>40?'...':''}</div>`;
    }
    return `<div class="history-item" onclick="showDayModal('${dateStr}')">
      <div class="h-date">${dateLabel} · 第${dayIdx}天${isFuture ? ' <span style="color:#555">（未解锁）</span>' : ''}</div>
      <div class="h-chapter">${data.chapter}</div>
      ${isChecked ? checkedLabel : (isFuture ? '' : '<div style="font-size:0.75em;color:#666;margin-top:4px;">未打卡</div>')}
    </div>`;
  }).join('');
}

// ===== MODAL =====
function showDayModal(dateStr) {
  const data = bookContent[dateStr];
  if (!data) return;
  document.getElementById('modalTitle').textContent = data.chapter;
  document.getElementById('modalBody').innerHTML = data.content;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('active');
  }
}

// ===== AUDIO WALL =====
function loadAudioWall() {
  try {
    var listEl = document.getElementById('audioWallList');
    if (!listEl) return;
    listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;"><span class="loading-spin"></span> 加载录音列表...</p>';
    queryAllRecords(300).then(records => {
      if (!records.length) {
        listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;">🎵 还没有录音哦~ 快来第一个朗读打卡吧！</p>';
        return;
      }
      let html = `<div style="text-align:right;font-size:0.75em;color:#555;margin-bottom:8px;">共 ${records.length} 条录音</div>`;
      records.forEach((r,idx) => {
        const fileUrl = r.fileId || '';
        const dateLabel = (r.date||'').replace('2026-','').replace('-','/') + '日';
        const displayName = r.userName || '匿名';
        const chapterTitle = r.chapter || `第${r.dayIndex||'?'}天`;
        let audioHtml = fileUrl.startsWith('http')
          ? `<audio controls preload="none" src="${fileUrl}" style="width:100%;height:34px;border-radius:8px;"></audio>`
          : '<span style="font-size:0.78em;color:#666;">音频处理中</span>';
        html += `<div class="audio-item">
          <div class="audio-item-top">
            <span class="audio-item-name">🎤 ${escapeHtml(displayName)}</span>
            <span class="audio-item-date">${dateLabel}</span>
          </div>
          <div class="audio-item-chapter">${escapeHtml(chapterTitle)}</div>
          <div class="audio-player-row">${audioHtml}<span class="audio-duration-badge">${r.duration||''}</span></div>
        </div>`;
      });
      listEl.innerHTML = html;
    }).catch(err => {
      listEl.innerHTML = '<p style="color:#ff4757;text-align:center;padding:40px;">⚠️ 加载失败，请刷新重试</p>';
    });
  } catch(e) { console.warn('[AudioWall]', e); }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TABS =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (el) el.classList.add('active');
  if (tab === 'audiowall') loadAudioWall();
}
</script>
</body>
