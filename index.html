    content: '<p>摘自《京瓷哲学:人生与经营的原点》</p><p>设定高目标的同时，企业经营者还需要不断地自问自答，为什么要设定高目标?这个问题必须想清楚，如果企业经营者设定的高目标只是为了实现经营者个人财富的增长，那么员工是不会真正愿意和经营者一起挑战高目标的，因为挑战高目标的道路上充满荆棘与坎坷，需要持续付出。</p><p>挑战高目标只能是为了全员的幸福以及为客户、行业、社会带来更大的价值，创造更多的美好。因此，目标一定是越大越好，越大越有干劲。换句话说，高目标的背后一定是企业的使命，是使命的目标而不是目标的使命</p><p>如果我们在追逐高目标的过程中忘记了使命、员工的幸福、客户的利益，使命就失去了力量。所以，企业经营者要大力倡导和鼓励全体员工敢于为了企业使命挑战高目标。</p><p>日本京瓷公司会把员工分为四种，第一种是“挑战高目标成功的员工”;第二种是“挑战高目标失败的员工”，对这类员工也会予以好评;第三种是“没有挑战但完成目标的员工”;第四种是“无所作为而失败的员工”。虽然稻盛和夫鼓励挑战高目标，却也明确反对一味地好高骛远，只关注目标而忽视积累。稻盛和夫提倡在“一步一个脚印”的同时把高目标融入自己的潜意识，每天努力前进。只要坚持不懈，在不知不觉中，那遥不可及的高目标就已经实现了。</p><p><strong>开展阿米巴经营阿米巴经营与阿米巴式经营</strong></p><p>在企业中成功导入阿米巴经营体系，通过开展阿米巴经营让自己的企业成为高收益企业，这是许多学习过稻盛和夫经营学的企业经营者特别渴望做到的事情。对大中型企业来说，无论企业规模还是企业内部生产管理环节都比较庞大而复杂，这样的企业要想导入阿米巴经营体系，建议通过专业的阿米巴咨询机构辅导落地。这里还有一个重要的前提条件:企业经营者、一把手必须完全认同稻盛和夫的经营理念，并且率先垂范，在企业中倡导和践行稻盛和夫经营学，明确企业使命，坚守正确的经营哲学。大多数中小企业还处于生存期、发展期，无论从规模上还是经营业态上都还处于较小和不完善的阶段，行业种类也千差万别，因此更希望通过自己学习加专家指导的形式让阿米巴经营体系在企业中快速落地。有一些经营者担心自己的企业规模太小或者从事的行业不适合开展阿米巴经营，还有经营者不知道当下一些新的组织模式，如采用平台制、中台制管理的企业或新兴的互联网行业等是否适合导入阿米巴经营模式。对于这样的希望和担心，我想我们应该回归稻盛和夫创立阿米巴经营的初心与根本目的，在此基础上思考可不可以和适不适合。</p><p>随着业绩的不断提升、规模的扩大，京瓷公司人数越来越多(从刚开始的28人迅速增加到两三千人)，这时稻盛和夫最担心的事情是，如果企业经营仍然是一笔糊涂账，最终结果一定是破产。同时，随着企业规模迅速扩大，如何才能培养出更多自己的“分身”，让大家都能参与企业经营，也是让稻盛先生特别困扰的事情。于是，稻盛和夫想到了将组织划分为小集体，用核算表的形式，让小集体的领导以及每一位员工都能够了解并关注经营数据，并据此快速响应，实现“销售最大化，费用最小化”的目标。这就是稻盛和夫创立阿米巴经营的初心。阿米巴经营的根本目的有三个:第一，实现以经营哲学为基础的全员参与的经营;第二，培养具有经营者意识的人才;第三，确立与市场直接连接的分部门核算制度。</p><p>因此，对大多数中小微企业来说，只要在企业里建立了与市场直接挂钩的核算制度，无论其是否符合严格意义上的阿米巴组织划分规则，也不必一定要有内部定价系统和完全一致的单位时间导入模式，只要能够在企业里建立起各类以部门、产品、项目等为单位的，围绕销售最大化、费用最小化和工作效率最大化的核算制度，都可以算作确立了阿米巴式核算制度。关键的衡量标准是要看这样的核算制度能否将企业内原先不关注利润、成本和工作效率的员工吸引进来，从而带动全体员工共同参与企业经营，在挑战高目标中实现员工心性的提升、经营意识的提升以及经营能力的提升。员工的成长才是阿米巴经营最终获得成功的关键，而不是仅仅学会照搬阿米巴经营模式。经营者可以根据自己企业的实际情况，只要符合阿米巴经营的三个根本目的，从广泛意义上讲，就是在开展阿米巴式经营。</p><p><strong>阿米巴经营体系</strong></p><p>稻盛和夫在京瓷公司推行的阿米巴经营不仅建立了一套基于规则的分部门核算制度，而且以京瓷的经营理念“追求全体员工物质与精神两方面幸福的同时，为人类社会的进步发展做贡献”为宗旨建立了一套以爱为根基，以培养员工、成就员工为目的的完整的京瓷经营体系，又称“阿米巴经营体系”，它包括部门核算制度、人事评价制度和教育培训制度。这三项制度发挥各自机能的同时，又实现了相互推动和拉动，其中人事评价制度和教育培训制度对于充分发挥阿米巴的分部门核算制度的威力起到了相乘的效果。阿米巴经营结果提升的背后一定是员工心性、热情和能力的全面提升。建立这样的经营体系与企业的规模和所处的发展阶段无关，无论什么样的企业，只有建立起这样完整的经营体系才会最终实现阿米巴经营的成功。</p><p>部门核算制度</p><p>部门核算制度的建立围绕销售最大化和费用最小化的经营原则，通过划小核算单位，实现快速反应和单位时间附加值的提升。同时，围绕部门核算制度的建立，制订年度计划和月度核算管理必不可少。</p><p>制订年度计划每个阿米巴的领导人首先应该以企业经营者描绘的梦想和愿景为基础，建立自己部门的经营计划。经营计划分成被称为“Master Plan”的年度计划和为了实现年度计划而制定的月度预定。</p><p>摘自《稻盛和夫阿米巴经营实践》</p><p>在年度计划的制订过程中要将自上而下和自下而上充分融合，最后设立“非达成不可的目标”。</p><p>相比别人给的目标，人们有更强烈的意愿去达成自己制定的目标。因此，阿米巴经营中年度计划的制订，是以社长方针为基础，彻底地遵循自下而上的计划制订流程。而且，通过每个阶段的反复讨论，让各阿米巴的领导人都能切实认识到本部门的作用。重要的是，要制定所有当事人都认为“一定能达成”的目标。</p><p>-摘自《稻盛和夫阿米巴经营实践》</p><p>年度计划制订完成后，企业经营者要召开全员参加的年度“经营方针发布会”，在会上，经营者公布公司的整体目标和重点实施措施，各部门公布自己部门的年度计划和行动计划。</p><p>月度核算管理在阿米巴经营中，为达成年度计划每月累积确凿的实绩数字必不可缺。从这一观点出发，以一个月为单位的详细计划的制订和实施是最重要的一环。为此要制定月度预定并加以实行。</p><p>摘自《稻盛和夫阿米巴经营实践》</p><p>在阿米巴经营中，月度核算即我们常说的月度经营分析会，是保证阿米巴经营取得成果的重要一环。与其他类型的经营分析会最大的不同之处在于，阿米巴经营月度分析会有“月度预定”制度。大部分企业实行预算制度和预估后的目标月度拆解制度，而在稻盛和夫看来，如果采用预算制度，那么一旦预算经费确定下来，员工会本能地认为这是自己权力范围内可支配的费用，至于费用所对应的业绩目标和利润目标就会和费用割裂开来，情况往往是费用目标达成了但业绩目标和利润目标没有达成。因此，阿米巴经营中目标只有一个-利润目标。同样，业绩目标采用“月度预定”制度是因为如果采用的都是“预估”“预计”等，那么其背后反映的都是对结果“差不多就行了”或者“这样已经很不错了”的观念。在稻盛和夫看来，即使达成率为99%，也要反省为什么最后1%没有做到。对此，稻盛和夫说过:</p><p>正是这种追求完美的心态，全员才能在情况每天变化，甚至发生突发性问题的现场也不气馁，具备坚决实现目标的不屈不挠的精神。</p><p>摘自《稻盛和夫阿米巴经营实践》</p><p>因此，“月度预定”目标的制定，反映的是阿米巴领导者对计划目标的深思熟虑和必须百分百达成的坚强意志，是所有阿米巴成员的职责所在。有了月度的各项预定目标后，阿米巴经营要求:必须从月初开始就一天一天地扎实积累数字，确保月底达成预定，这就是每天核算。稻盛和夫认为:</p><p>所谓经营，并不是看着月末的核算表进行的。经营是具体详细数字的积累，积累每一天的销售额和费用，才有了月度核算表。天天都核算收支，必须抱着这样的意识去经营。不看每天的数字去经营，就像不看仪表盘操纵飞机一样，飞机向哪儿飞，在哪儿着陆都不知道。同样，目光离开了每天的经营数字，是绝不可能达成目标的。</p><p>摘自《稻盛和夫阿米巴经营实践》</p><p>阿米巴经营的关键之一就是通过不断地关注经营数字，从而发现问题、解决问题，在追逐数字的过程中激发大家的积极性和创造性。稻盛和夫在京瓷实行的是每天核算，不同类型的企业可以根据自身实际情况建立核算机制，首先至少要做到月度核算，然后从月度核算向周核算、每天核算逐步迈进，关键是要建立一套数字牵引的机制，通过每天、每周、每月的实绩数字与月度预定数字的相互追逐，通过全员的同心协力，去感受目标差距带来的压力和达成目标时的喜悦。</p>'
  },
  '2026-08-09': {
    chapter: '第19天：学法 · 学习成长路径详解经营实学（阿米巴经营体系）',
    content: '<p>人事评价制度我们常说，人才是企业的第一资源、第一生产力和第一竞争力，企业间的竞争归根结底是人才的竞争。阿米巴经营的重要目的之一就是培养具备经营者意识的人才，而人才的培养不仅需要提供人才成长的机制和舞台，即阿米巴式的经营模式，同时还需要对人才成长的全过程给予关注、引导和评价，并在此基础上予以肯定和激励。企业需要通过人事评价制度的确立进行人才培养的梯队建设。</p><p>建立人事评价制度有以下三个重要作用。第一，可以帮助员工根据自己的兴趣爱好、能力水平，通过激发个人的梦想，清晰自身的职业定位、职业规划和晋级通道。第二，可以消除过去“要么干多干少没人关注和关心，要么干好干坏仅凭老板个人主观说了算”的弊端，通过评价体系真正实现像京瓷公司所倡导的实力主义，将工作业绩与个人的晋级、评优和激励挂钩，进一步调动员工的积极性、主动性和创造性。第三，可以实现企业与员工之间的沟通和互动，通过评价结果引导员工发现自身的问题和不足，帮助员工实现全方位的成长，让员工能够真正感受到被重视、受尊重和有希望。2</p><p>稻盛和夫在《稻盛和夫阿米巴经营实践》中强调:</p><p>以是否实践了哲学，是否发挥了领导力来评价、提拔员工也是很重要的.....不仅仅是看单位时间核算的数字，还必须有一个人才评价体系，让真正具备实力的人得到提拔，这样才能促进组织的成长发展。</p><p>因此，人事评价制度的根本目的是实现人才的培养和更好地开展阿米巴经营。在京瓷公司，开展阿米巴人事评价的出发点是依据稻盛和夫的人生方程式，即人生·工作的结果=思维方式X热情(努力)X能力，通过对业绩(人生·工作的结果)、行为(思维方式、热情或努力、能力)三个维度的量化考核，实现人才的评价与培养。</p><p>在阿米巴经营的人事评价中，业绩部分不是仅仅以单位小时附加值为评价基准，不是仅仅将焦点放在短期成果和核算实绩中。得到高度评价并被提拔的人，是能够中长期持续提升业绩的人才。</p><p>摘自《稻盛和夫阿米巴经营实践》</p><p>阿米巴经营的人事评价对于业绩的考核不仅重视各项目标的结果，更重视为达成结果所付出的努力以及是否敢于挑战高目标。对于行为的考核着重于个人能否认真实践哲学，能否领导部门成长发展。这部分的考核可以依据企业经营理念对应不同管理层级制定出与工作相应的行为考核标准，也可以依据企业的价值观所对应的行为标准开展定期考核。能力部分，不仅包括个人的业务能力，还包括对不同层级、不同岗位所需要的沟通能力和管理能力的考核，稻盛和夫在《稻盛和夫阿米巴经营实践》中强调:</p><p>在明确评价基准的基础上，对那些虽然没有足够的经验，但拥有高尚人格及出众能力，对工作抱有热情，赢得大家信任和尊敬的人，也就是努力实践哲学的人，要大胆提拔。</p><p>同时，需要特别提出的是，稻盛先生反对经营者寄希望于通过建立一种规则就可以完全依靠规则来评价部下，稻盛先生说:“归根结底，领导人必须参与到组织中去，聚会等都要出席，对于多达数百名的员工，都必须倾注心血，仔细观察，这才是人事评价的关键。”</p><p>教育培训制度企业开展的教育培训包括以下三个部分。第一，全员参加的哲学教育培训。其目的是让一起工作的同事，在每天的工作中，能够以共同的价值观为基础进行判断，采取行动。讲课老师最好是经营者本人，最好能把企业的使命、愿景、价值观以及经营理念形成文字，做成手册发给员工，将手册作为教材，持续、定期地实施哲学教育。这一过程就是在企业中开展哲学共有并将哲学血肉化的过程。</p><p>第二，对不同岗位、不同管理层级开展基础工作的能力、专业技术能力和管理能力提升的培训。在阿米巴经营中，通过建立分部门核算制度，人人关注经营数字，针对经营数字暴露的各项能力的不足进行分析，提出改进措施。例如，通过经营分析会发现，销售最大化做得不好，销售收入总是上不去，就要通过细分的收入数据，找到问题的原因一一是产品质量有问题、产品定位不合理，还是产品技术落后、市场营销不到位、销售能力不足。发现问题就要及时调整，找到问题背后能力欠缺的原因，通过开展对应的教育培训及时提升相关岗位员工的相应能力。如果通过经营分析会发现成本和费用总是居高不下，就要对比细分的成本和费用数据，找到问题的原因一-是技术能力问题、采购能力问题，还是管理能力问题等。同样，发现问题及时调整，找到问题背后能力不足的原因，通过开展对应的教育培训及时提升相关岗位员工的相应能力。</p><p>第三，要依据企业的中长期发展战略，有针对性地开展相应的技术类、创新类和管理类培训。在企业中建立教育培训制度的根本目的是培养人才和成就员工，同时在员工成长的过程中推动企业成长和创造高收益，从而实现人人都是经营者和成为幸福企业的终极目标。</p><p>特别是2020年新冠肺炎疫情暴发以来，企业经营面临诸多前所未有的困难和不确定因素，经营者更应该把教育培训当成难得的机会，加大教育培训的力度。</p><p>稻盛和夫说，正如春天的樱花，冬天越是严寒，春天越是烂漫。抱怨和躺平最终只能导致企业走向消亡，只要把逆境作为动力，把握机会苦练内功，就一定能够开拓光明的未来。</p><p>盛和塾的一位塾员对此深有感触地分享道:“虽然疫情给企业经营带来了很多不利影响，但是两年多过来了，现在自己特别感谢疫情，正是在疫情期间通过学习稻盛和夫《萧条中飞跃的大智慧》讲话，懂得了越是萧条期越是竹子长节的最好时期。”</p><p>2020年开始，他就在企业中推动以部门为单位的各岗位业务能力、技术能力提升培训，人事部门也把工作重点放在对各部门教育培训的计划管理和监督执行上。每月月末，各部门必须向人事部门提交下月本部门的教育培训计划，同时人事部门汇总本月各部门完成当月培训计划的情况并纳入当月考核。就这样，坚持到了现在，两年多的时间，不知不觉中企业整体的业务能力、技术能力得到了迅速提升，员工也在这样持续学习的过程中感受到自身能力的不断提升，尝到了甜头，真心地认同这种自我提升的学习模式。这位塾员说:“我的企业现在真的是长节了，面对疫情，企业也更有信心了!</p><p><strong>制度与哲学</strong></p><p>阿米巴经营是由独特的机制和制度共同构成的。需要注意的是，要想让其正常发挥功效，构建机制和制定制度的背后一定是经营者美好的发心和企业坚守正确的经营哲学。无论划分阿米巴组织还是制定各项制度，每一个经营活动的落实、每一项制度的制定都要反思这个经营活动、这项制度符不符合“作为人，何谓正确”，这个经营活动、这项制度与员工幸福、员工成长有没有关系，与客户幸福、客户价值创造有没有关系。如果答案是否定的，那么这样的阿米巴经营最终一定会走向失败。</p><p>持续创造高收益通过导入以哲学为基础的阿米巴经营，大多企业经营业绩和利润很快就会实现增长。但是，如何才能实现企业业绩持续增长、持续创造高收益，而不仅仅是昙花一现，是在导入阿米巴经营过程中特别需要注意的事情。第一，企业经营者必须始终保持谦虚的态度，持续付出努力。稻盛和夫在《稻盛和夫阿米巴经营实践》中说:</p><p>人心是脆弱的。即使是拥有高涨热情和优秀思维方式的经营者，一旦企业经营有所成就，就会产生懈总和傲慢。“既然培养了这么多阿米巴领导人，交给他们干就行了。”只要有了这种想法，在不知不觉中就会一点一点地远离现场，或者失去了谦虚，懈怠了心性的提升。</p><p>作为经营者，如果认为一旦建立了阿米巴机制，现场员工就会自发地努力工作了，这样的错觉会使阿米巴经营在不知不觉中流于形式。</p><p>要通过PDCA的持续循环，用挑战高目标带动阿米巴经营体系不断完善。在阿米巴经营中，企业要以企业使命和愿景为基础，各部门需制定“非达成不可”的年度高目标，并据此制定每月预定目标(plan)，再按目标制订详细的指导方针和实施计划，通过带领全体成员共同努力，完成计划目标的执行(do)，每月开展月度核算，对照数据结果找出(check)预定目标与实际结果之间的差距，分析原因，找到需要改进的问题点，并明确下一步需要采取的对策(action)和行动方案。企业经营者应以使命、愿景为基础，以高目标为驱动，持续不断地推动PDCA循环，通过持续不懈地努力，促使企业实现持续创造高收益的目标。</p>'
  },
  '2026-08-10': {
    chapter: '第20天：学法 · 稻盛和夫经营学学习原则及方法（学习原则及方法）',
    content: '<p><strong>第六章稻盛和夫经营学学习原则及方法</strong></p><p><strong>学习原则</strong></p><p>想学好稻盛和夫经营学，首先必须了解其全貌，深入理解并掌握成长路径图以及每个节点学习、践行的要点。企业需要系统化、体系化地开展学习，其次，必须把握稻盛和夫经营学的学习原则。所谓学习原则，是指在应用成长路径图开展体系化学习时必须遵循的原理原则，以此保证在学习过程中少走弯路、坚定信心，在最短的时间内将稻盛和夫经营学的力量最大化。学习稻盛和夫经营学必须遵守以下四个重要原则:第一，哲学与实学同步学习原则;第二，反复学习持续实践原则;第三，内求自修深入思考原则;第四，全面提升素质能力原则。</p><p><strong>哲学与实学同步学习原则</strong></p><p>在稻盛和夫经营学中，起到统摄和引领作用的是人生哲学和经营哲学。</p><p>在稻盛和夫经营思想引入中国的很长一段时间里，大多数学习者，包括中国盛和塾的大多数塾员，对稻盛哲学与实学之间的关系普遍持有“只有学好了稻盛哲学才能开始导入稻盛实学，否则实学导入一定不会成功”的观念，即企业只有实现了哲学共有才能开展数字化经营。正是在这一观念的影响下，许多导入稻盛和夫经营学的企业，通过哲学的学习，经营者找到了人生与事业的目的和意义，带领员工在企业中开展哲学共有。经营者的改变影响、点燃了员工的积极性和工作热情，企业的销售业绩开始逐步提升，但同时，由于没有导入实学，企业仍然采取过去那种盖浇饭式经营，经营中的问题得不到改善和解决，经营数字不透明，努力和成绩不能被及时发现与肯定，员工的热情开始消退，单纯靠哲学的拉动往往后继乏力。</p><p>还有部分经营者，自身的哲学学习本就很肤浅，更谈不上在企业中开展哲学共有，再加上没有实学的推动，经营业绩自然没有变化，于是开始怀疑稻盛和夫经营学不适合中国企业，进而动摇学习稻盛和夫经营学的信念甚至停止学习。出现这种现象的重要原因就在于，没有正确把握稻盛哲学与实学之间一体两面的关系，错误地把哲学与实学割裂开来，认为这是彼此独立的两件事，既然是两件事，那么自然就会分出个谁先谁后和孰轻孰重，而这样的认知就是对稻盛和夫经营学最大的误解。这也是稻盛和夫经营学和绝大多数目前主流管理学派所不同的地方。稻盛和夫经营学的核心是与宇宙的意志相协调的经营之道，是“爱、真诚、和谐”，这是不变的那个“一”，将其应用于个人成长、企业经营则展现为形而上的人生哲学、经营哲学与形而下的经营实学这两个方面。稻盛哲学与实学是不可分割的一体两面，不存在人为分割的先后和轻重。当我们错误地把它们割裂开来运用时，自然就会形成两张皮，哲学是哲学，实学是实学。哲学落不到实处就没有根，就没有持续的生命力;实学没有正确方向的引领就会迷失和混乱，因此必然会出现上述各种现象和问题。</p><p>稻盛和夫说:“哲学、哲学，像念经一样喋喋不休讲哲学，并不能把经营搞好，只有把哲学转换成数字，哲学才能血肉化。”在《将哲学血肉化:在盛和塾应该如何学习》讲话中，稻盛和夫表示“如果你真的想要实践经营哲学，就必须把哲学落实到利润表中去，必须将哲学转化为具体的数字”。因此，学习稻盛和夫经营学第一个重要的学习原则就是，哲学是根基，哲学与实学同步学习的原则。需要注意的是，在学习过程中既不能无限放大哲学的重要性，也要警惕片面强调实学的重要性而轻视哲学的引领和统摄作用。以心为本的经营才是企业成功的原动力。</p><p><strong>反复学习持续实践原则</strong></p><p>关于反复学习持续实践的重要性，稻盛和夫在他的许多著作中都进行了论述。企业经营者要想提高心性，拓展经营，除了反复学习和持续实践，别无他法。稻盛和夫经营学中的人生哲学和经营哲学都是用来改变我们的思维方式，是“心”学。反复学习是指从“脑知”到“心知”的过程，就是正确的哲学思想从显意识进入潜意识的过程。稻盛和夫把反复学习哲学比喻为锻炼身体，他说:“一般的人，对如何正确做人的哲学，学过一次就觉得足够了，他们不愿意反复学习。但是，运动员只有天天锻炼身体，才能保持自己的体能。心灵的修炼也一样，一旦懈怠，很快就会回到原点。”只有在反复学习的过程中，正确的哲学思想才能血肉化，逐渐融入内心，成为不可动摇的信念，才能够依此采取正确的行动。稻盛经营实学是用来指导企业经营的行动，是“功夫”。反复学习持续实践的过程就是达至知行合一的过程，“知”是基础、是前提，“行”是重点、是关键。过去，古人说“知难行易，无师之过”，今天，我们有幸得遇人生之师稻盛和夫，那么，我们要珍惜这份缘分，要以知促行，通过反复学习哲学，“脑知”变“心知”，心知则是真知，真知一定真行。我们在学习稻盛和夫经营学的过程中，如果只有心动而没有行动，就一定不是真知。稻盛和夫说:</p><p>有的塾员在盛和塾学了好多年，公司业绩依然低迷。对于这样的塾员，我的话或许不太好听，我不能不说，业绩不好，那是因为你的学习还很不够，就是说，你没有把哲学血肉化。</p><p>摘自《将哲学血肉化:在盛和塾应该如何学习》</p><p>另外，我们还要以行促知，要善于把“知”付诸“行”。“知易行难，贵在依止”，有了好的老师，有了正确的哲学思想就要坚定地相信并践行，反对空谈、崇尚实干，也是中华民族的优良传统，“纸上得来终觉浅，绝知此事要躬行”。企业经营者要想推动稻盛和夫经营学在企业现场持续实践，就要信一分，行一分，这样一定会有一分收获，不要事事钻牛角尖，更不能夸夸其谈，先做了再说。只要企业经营者在实践中坚持以正确的哲学思想和经营理念为引领，不断对照、检视、反省和及时改正，就能在“实践、认知、再实践、再认知”螺旋式上升的过程中不断提高心性、拓展经营。</p><p>内求自修深入思考原则改革开放40多年来，民营企业如雨后春笋般涌现，随之产生了数以千万计的经营者。其中，绝大多数经营者都没有接受过系统的工商管理类知识的学习和培训，他们迫切需要进行相关知识体系的学习和培训，一大批企业经管类培训机构应运而生。</p><p>客观地说，这些机构对中国民营企业的发展做出了一定的贡献，帮助许多民营企业经营者打开了一扇窗，特别是一些成功学的课程和以西方“经济人假设”为底层逻辑的各类企业管理方法课程，让很多经营者似乎找到了经营企业的灵丹妙药。这些课程往往是听起来激动，实际却未必好用，学费又动辄几万元甚至几十万元。</p><p>近几年，随着稻盛和夫经营学的逐渐兴起，越来越多的企业经营者认可并接受了稻盛和夫利他的经营理念，加入盛和塾开始系统学习，但是因过去几十年各类培训机构的熏陶，很多人已经习惯了被动输入式的学习方式，自己不愿意深入思考，总是期待老师能给出一套具体的方法，可以照搬照抄地在企业执行。</p><p>稻盛和夫经营学源自工作现场和亲身实践，稻盛和夫说“工作现场有神灵”，学习稻盛和夫经营学没有捷径，也没有一套放之四海皆准的工具和方法，稻盛和夫传授给我们的是经营之道、经营的原理原则以及落地实践的规则和机制。不同的企业在应用稻盛和夫经营学时，需要结合自己企业的行业特征、经营状况以及发展阶段，在深入调研和充分思考后采取的行动和措施才是最适合的。</p><p>我们不反对专业老师的指导和方法，相反，在盛和塾有许多有发心、有专业能力的指导老师，他们可以辅助我们学习稻盛和夫经营学的内容并针对落地践行给予必要的指导，但能不能用好关键还是在于经营者自身能否做到反复学习、深入思考，并将其应用于工作现场，在工作现场发现问题和解决问题。同时，在落地践行的过程中，无论遇到什么问题，企业经营者首先要从自己身上找问题，从企业内部找问题，而不是一味地抱怨员工、抱怨客户，甚至怀疑稻盛和夫经营思想的正确性和适用性。凡事要向内看、向内求，“行有不得，反求诸己”，企业经营者要从自身的不足和问题入手，视问题为道路，对照稻盛和夫，看看他遇到相似的问题是如何解决的，从稻盛和夫经营学里找答案，找到稻盛和夫解决问题所秉持的原理原则、采用的规则和机制。经营中的一切问题都可以在稻盛和夫经营学里找到原因以及解决的方法或途径。</p><p>全面提升素质能力原则稻盛和夫说:</p><p>在企业经营中，要制定战略战术，要建立营销和物流的体制，还要构筑管理会计和财务的系统，等等。</p><p>这些具体的经营手法、手段都要筹划周到，这些都是理所当然的。</p><p>摘自《将哲学血肉化:在盛和塾应该如何学习》</p><p>但是，我们发现在稻盛和夫看来理所当然的事情，却是许多中小企业经常遇到的困难或障碍。很多经营者白手起家，靠的是自身的勤奋、聪明才智，以及对美好生活的追求，但是其经营的企业基础管理薄弱，缺乏科学管理的手段和方法，员工普遍缺乏基本职业素养和岗位技能，创新意识和管理能力都不足。</p>'
  },
  '2026-08-11': {
    chapter: '第21天：学法 · 稻盛和夫经营学学习原则及方法（反复学习持续实践原则）',
    content: '<p>创业初期，企业规模小，问题还不突出，一旦企业稍具规模，经营者管理能力和员工岗位技能上的欠缺就会成为企业发展的瓶颈。</p><p>企业经营需要具备的能力和需要解决的问题涉及方方面面，学习稻盛和夫经营学可以帮助企业经营者解决根本性问题，并且通过“两把尺子”发现经营中存在的各种问题和不足。因此，在坚持以稻盛和夫经营学为主轴开展系统学习的同时，我们呼吁广大企业经营者兼容并蓄、博采众长，不仅要广泛学习世界先进管理经验、技术和理论，帮助企业全面提升经营必备的各项能力，同时还鼓励企业经营者通过消化吸收优秀的中华传统文化，帮助企业做好文化建设，肥沃土壤、向下扎根。学习稻盛和夫经营学要注意避免一种倾向，那就是认为只要学了稻盛和夫经营学就可以解决企业经营中的所有问题。</p><p>我们说“经营中的一切问题都可以在稻盛和夫经营学里找到原因以及解决的方法或途径”，是想告诉大家，稻盛和夫经营学可以赋予经营者、企业一种优秀的品格，帮助经营者找到人生的使命和企业正确的发展方向，树立清晰而远大的目标，同时又给了经营者化繁为简、看清问题真相的智慧和科学的方法。“有心无法，法由心生;有法无心，法随心灭”，有发心、有智慧、有愿望，那么解决企业问题的办法自然就会找到，这时经营中缺什么就去补什么，经营需要的是全面提升企业的素质和能力，稻盛和夫经营学之外的科学的管理手法和手段也是企业需要及时补充和提升的。</p><p>盛和塾的一位老塾员有这样的感慨，学习稻盛和夫经营学之前是病急乱投医，参加过各种企业管理类的培训，大部分听不懂或者听了一知半解、不知道怎么用，好不容易听懂一些拿回去用，刚刚见到效果又很快被打回原形，企业原来是什么样现在还是什么样。</p><p>后来遇见了稻盛和夫经营学，他似乎一下子找到了救命稻草，拼命地学习。这么多年坚持下来，自己变了、企业变了、员工变了，变得越来越好了。于是，他一度认为除了稻盛和夫经营学，其他培训方法都不究竟，都不需要，只要学好稻盛和夫经营学就行了。随着这几年他在盛和塾不断学习，企业在稳步发展，在向上爬坡的过程中，他逐渐发现，企业无论在员工的专业能力上、管理层的管理能力上，还是战略、创新等方面都存在严重不足。于是，这位老塾员开始在盛和塾之外寻求相关的专业学习和培训，虽然参加的是和遇见稻盛和夫经营学之前类似的学习培训，但是现在的感觉完全不一样了，似乎一听就懂，一学就会，再也不像过去那样听得糊里糊涂，企业员工和管理层也从过去特别抗拒学习到现在主动、如饥似渴地学习专业知识和管理知识。</p><p>到底是什么变了呢?这位老塾员总结说，是因为稻盛和夫经营学让自己明白了经营之“道”，赋予了自己化繁为简、看清复杂现象背后问题的本质的能力，也让自己能够站在更高的维度上看清经营的全貌。因此，补充其他学习和培训时，他马上就知道应该如何正确地应用它们，是稻盛和夫经营学帮助他“开窍了”，增长了智慧。</p><p><strong>教材与教法必读书与选读书</strong></p><p>改革开放之后，稻盛和夫的经营思想逐渐被广泛引入中国，开始被越来越多的企业经营者了解、认知和接受，可以说稻盛热的形成与稻盛和夫的相关著作和演讲内容在中国被大量出版发行密不可分。据不完全统计，在中国出版发行的稻盛和夫著作以及相关论著已经超过100本，总出版发行量超过1500万册，仅《活法》一书的发行量就突破了500万册。大量稻盛和夫相关著作的出版、发行对稻盛和夫经营学在中国的传播起到了积极的推动作用。但同时，对于渴望尽快系统学习和实践稻盛和夫经营学的经营者来说，面对如此众多的稻盛和夫著作，往往不知从何入手，因此，以稻盛和夫经营学教学体系为主轴，系统地梳理稻盛和夫相关著作和演讲内容就显得尤为重要。老子在《道德经》中告诉我们“少则得，多则惑”，虽然稻盛和夫著作等身，但是其经营思想的精髓和核心主要体现在一些重要著作和演讲中，其他著作大多是在不同时期、不同场合，面对不同听众的应机教授和演讲，多是在从不同的维度诠释其核心经营思想。因此，结合稻盛和夫经营学教学体系，我们推荐以下10本著作和10篇演讲作为学习稻盛和夫经营学的必读内容，同时也推荐了部分选读内容(见表6-1)。必读内容是学好稻盛和夫经营学的关键，因此，我们希望能够对每本书、每篇演讲都做到熟读、精读，反复阅读、持续实践，不仅要读，还要结合自己学习、践行的感悟写出总结分享。在盛和塾学习，必读内容就是塾员入塾学习的教材，塾员之间通过每天的读书、分享和相互点评，教学相长，共同成长。选读内容是对必读内容的补充，我们建议学习稻盛和夫经营学的经营者在必读内容之外，要把选读内容列入自己的年度阅读计划，通过对选读内容的学习加深对稻盛和夫经营学的理解。</p><p>稻盛和夫的著作和演讲内容极其丰富，而且还有新书在不断出版，因此，除了必读内容和选读内容，我们也希望大家将其作为参考图书，尽量多阅读、多学习。</p><p>稻盛和夫线上课堂稻盛和夫线上课堂是通过微信小程序学习稻盛和夫经营学的重要工具，包含了稻盛和夫、稻盛哲学、稻盛会计学、阿米巴经营、曹岫云大讲堂、名师课堂、学员分享、经典案例等板块。稻盛和夫线上课堂收录了稻盛和夫先生历次来中国发表演讲的视频以及稻盛和夫详解京瓷哲学78条等视频内容，通过视频，我们可以观看、聆听稻盛和夫传授其人生与经营的大智慧。相较于读书学习，这样的学习方式能让企业经营者身临其境，全方位地感受稻盛和夫所传递的能量，不仅可以自己学，还可以在企业里带着员工一起学，可以边看边讨论。稻盛和夫线上课堂不仅有稻盛和夫的演讲视频，有被稻盛和夫称赞为全世界最理解其哲学的曹岫云老师设立的曹岫云大讲堂，还有稻盛和夫经营学相关专家线上授课，以及全国践行稻盛和夫经营学的优秀企业家线上分享等丰富多彩的视频内容。</p><p>六度学习法稻盛和夫经营学源自企业实践，是从反复实践中总结出来，并且结合现代科学管理的理论、方法与古圣先贤正确的为人之道而归纳、提炼出来的。稻盛和夫经营学具有理论与实践相结合、系统且体系化的特点。因此，学习稻盛和夫经营学不仅要读稻盛和夫的图书，了解稻盛和夫经营学的学习路径和学习原则，掌握套体系化、科学的学习方法同样非常重要。</p><p>在中国，盛和塾经过15年的发展逐渐形成了一套完整的、体系化的、科学的学习法，我们将其称为六度学习法”。它通过六个不同维度的学习，帮助经营者快速提高心性，拓展经营。</p><p>六度学习法包含小组学习会、专家讲座、案例分析会、塾企游学参访、经营成果发表会和体验式研讨会共六种形式。六度学习法具备以下四个特点。</p><p>第一，团队式学习。《中庸》中提倡“慎独”精神，但大多数经营者每天要处理经营中的繁杂事情，还要拿出时间学习，一个人就容易懈怠和放松，而团队式学习，通过组织线上、线下集体参与的小组学习会，塾员之间相互讨论、相互督促、相互鼓励可以让学习变得快乐、高效且可持续。</p><p>第二，输出式学习。依据学习金字塔理论"，实际演练、教别人学习是最高效的学习方法。诺贝尔物理学奖获得者理查德·费曼(Richard Feynman)提出了“费曼学习法”，其核心就是输出式学习方式，用输出倒逼输入。盛和塾的小组学习模式、经营发表会模式都是通过塾员之间相互输出，特别是老塾员分享自己的学习体会和心得，通过小组学习会分享、经营成果发表会的模式，倒逼自己总结提炼学习心得和体会，然后对照稻盛和夫经营学整理经验，反省不足，通过分享和发表的形式，在利他的同时实现自身的快速提升和成长。小组集体学习的形式让参与其中的每位塾员的理解能力、总结能力、表达能力都得到了极大的提升。有的塾员说，加入盛和塾前已经几十年没有认真地读过一本书了，有的塾员说，过去自己在公众场合一说话就紧张，不知道说什么好，现在不仅不紧张了，而且常常口若悬河，有点刹不住闸的感觉，这一切都得益于在盛和塾的学习。</p><p>第三，体验式学习。南宋著名诗人陆游曾给自己的子女写过这样的诗句:“纸上得来终觉浅，绝知此事要躬行。”意思是书本上的知识和理论最终要通过亲身参与、亲眼观察、亲耳聆听，才能体会和感悟其中蕴含的道理，实践才能出真知。在盛和塾参加优秀塾企游学参访和体验式研讨会就是这种体验式学习模式。</p><p>第四，专业化学习。盛和塾有一批多年来一直专业从事稻盛和夫经营学研究的专家、教授，还有许许多多优秀的、学习践行有成果的塾员企业，因此，盛和塾的专家讲座和基于优秀塾企案例开发出的案例分析会，既具有很强的专业性，又具备落地的实操性，是学习稻盛和夫经营学必不可少的学习形式。</p>'
  },
  '2026-08-12': {
    chapter: '第22天：学法 · 稻盛和夫经营学学习原则及方法（落地与实践）',
    content: '<p><strong>落地与实践</strong></p><p>在前文，我们基本了解了稻盛和夫经营学的全貌、体系构成、学习成长路径、学习原则以及教材和教法，接下来，综合以上内容，我将分别就稻盛和夫经营学的三个部分如何落实到塾内的学习活动中，以及经营者回到企业后如何实践应用给出相应的参考方法。</p><p><strong>时刻不忘心灵的修持</strong></p><p>稻盛和夫经营学的人生哲学部分主要用于帮助企业经营者提高心性。除了经营者自身需要长期、持续地坚持修学，提高心性更需要有共同学习的氛围，盛和塾就是企业经营者共同营造的学习磁场。在盛和塾，大家常常把小组学习会比喻成心灵的加油站和人生的省修场，当经营者身心疲意、情绪低落时，回到小组学习会就好似回到了心灵家园。</p><p>在盛和塾学习，关于稻盛和夫经营学人生哲学部分，企业经营者通过学习以下必读内容、必学视频和推荐课程，再以小组学习会为主轴，综合应用六个维度学习模式，每天进步一点点，很快就会取得良好的成效</p><p>企业经营者如何才能做到稻盛先生所告诫的“时刻不忘心灵的修持”呢?</p><p>稻盛和夫用自己在创业之初提高心性的亲身经历为我们做出示范，就是通过一切时一切处地“日读书”，不断加深对“明确人生的目的和意义”的理解和感悟，从而确立起正确的知见，立下人生的正志;通过“日反省”每天检视自己在生活和工作中有没有做到“六项精进”，有没有做到“每天进步一点点”;通过“日静心”每天至少一次的明心、静心，让烦躁的心镇定下来，实现“持续净化心灵”。</p><p>因此在生活和工作中，企业经营者要坚持每天践行修心三要，通过坚信、笃行和实证，持续获得正反馈，最终实现心性的螺旋式上升。心灵的持续净化和心性的不断提升是推动企业成长和发展的原动力。</p><p><strong>把幸福落到员工的身上与心上</strong></p><p>稻盛和夫经营学中经营哲学部分学习重心在“明确事业的目的和意义”，即找到经营企业的大义名分企业使命。只有真正地把经营企业的目的从只为自己转变为实现全体员工物心双幸福的同时，为社会的进步发展做出贡献，稻盛和夫经营学在企业的落地与实践才真正有了支点。</p><p>加入盛和塾后，关于稻盛和夫经营学中经营哲学部分，企业经营者可以通过学习以下必读内容、必学视频和推荐课程，再以小组学习会为主轴，综合应用六个维度学习模式，每天进步一点点，很快就会取得明显的成效(见图6-3)。</p><p>企业经营者如何将在盛和塾学习到的经营哲学应用于企业实践呢?首先，企业经营者要反复向员工讲述企业的使命以及工作的目的和意义，要在一切可能的场合对员工和客户反复宣讲。据说，曾经有日本塾员当面向稻盛和夫请教，说自己虽然找到了经营企业的大义名分，但员工还是不理解自己，他应该怎么办?稻盛和夫回答说:“员工不理解你，那是因为你宣讲得还不够，1遍不行就10遍、20遍，直到100遍。”稻盛和夫认为，员工不理解，如果没有宣讲到100遍都是企业经营者的责任，超过100遍才是员工的问题。</p><p>我觉得稻盛先生之所以这么说，有其深刻含义。</p><p>大部分企业经营者虽然通过学习稻盛和夫经营学，找到了经营企业的大义名分，生起了利他心，但往往一开始这颗利他心还不够纯、不够真，还夹杂着许多功利心和虚荣心。只有企业经营者当着员工、客户的面不断地宣讲企业使命，内心良善的大门才能越开越大，才能逐渐真正感受到员工的辛苦和不易、感受到客户的痛点和真需求。即使企业使命在开始时是假的，也会在持续的宣讲中成为真的，其力量也会真正地在经营者内心生起。</p><p>第二，当众宣讲企业使命也是倒逼企业经营者不断做出当众承诺，刚开始是为了面子、荣誉，慢慢地使命进入企业经营者的内心，就会激发其强烈的愿望和燃烧的斗魂。</p><p>第三，在经营者持续宣讲企业使命的过程中，员工、客户也会从最初的不相信到半信半疑，直到被经营者的诚心感动，全然地相信并支持。</p><p>因此，稻盛经营哲学的落地，首先从宣讲企业使命100遍开始。</p><p>有了企业使命后，要想让员工真正地相信并自愿追随企业经营者共同实践经营哲学，一方面，企业经营者要组织全体员工开展各种形式的学习活动;另一方面，企业经营者也要把实现全体员工的物质幸福和精神幸福落实到员工的身心。物质幸福的实现不在于给大家涨多少工资、发多少福利，每家企业的经营状况不同，要量力而行，关键在于经营者的利他心够不够真、够不够纯。</p><p>有的经营者常说，自己也想给大家涨工资、多发奖金、增加福利，但经营状况不好，只能等企业发展好了再兑现承诺。这样说的经营者大多很难让企业摆脱困境。为什么?因为顺序反了!</p><p>凝聚员工的心不在于老板能给多少，靠的是经营者亲切真诚的关爱之心。当员工发自内心地认同经营者以及企业的经营理念，自然会把这颗心和这样的理念传递给客户，获得客户的尊重和支持。这样的企业怎么会发展不好呢?</p><p>企业导入稻盛经营哲学不仅需要在经营者的带领下开展各种形式的学习、分享活动，还必须把经营理念和经营哲学结合到企业经营的各项实际工作中，要和岗位职责、岗位目标以及个人成长目标相结合，形成可量化、可考核的严格制度，要建立定期考核的机制，通过考核、评价和优秀案例分享促进哲学血肉化。</p><p>创造高收益从每月核算开始稻盛和夫经营学实学部分的学习和践行从每月核算开始。稻盛和夫不断强调，经营的本质是“销售最大化，费用最小化”，而确保其实现的手段，就是努力做到从每月核算到每周核算，再到每日核算。只有通过核算才能看清销售的变化和费用的变化，进而通过对变化的结果分析，找出解决问题的办法。企业经营者只有通过数字的变化才能看清企业哲学有没有发挥出应有的作用和力量。</p><p>那些学了很长时间稻盛和夫经营学，但企业经营状况，特别是利润状况还是没有较大变化的经营者，需要认真反思自己有没有真正理解经营哲学和经营实学的内在关系，哲学与实学不仅要同步学习，还要同步实践。</p><p>加入盛和塾后，关于稻盛和夫经营学中经营实学部分，企业经营者通过学习以下必读内容、必学视频和推荐课程，再以小组学习会为主轴，综合应用六个维度学习模式，每天进步一点点，很快就会取得显著成效(见图6-5)。</p><p>企业经营者如何才能将在盛和塾学到的实学运用于自己的企业实践呢?首先，要从读懂并熟练运用利润表开始，稻盛和夫在《将哲学血肉化:在盛和塾应该如何学习》中指出:</p><p>销售最大化，费用最小化，经过一个月的努力，结果究竟怎样，月底必须结算，做出利润表，否则就不能对下个月如何经营做出对策。如果看到的是两三个月以前的数字，那么，不管销售是增加了还是减少了，利润是增加了还是减少了，企业是盈利还是亏损，这时候知道了也没有任何意义。财务部门统计汇总，如果月末结算，最迟必须在一周之内做出利润表，否则，这些会计资料就无法在经营中有效发挥作用。</p><p>实践稻盛经营实学的关键是从每月核算开始，不同规模、不同发展阶段的企业可以根据自己的实际状况，开展分部门核算，或者先进行公司整体核算再逐步开展分部门核算。核算应围绕收入、成本和工作效率三个维度展开，采用的是稻盛和夫提出的，让每一位员工都能够看懂、能够产生和自身工作相关联感的简单家庭记账簿方式。</p><p>核算表是稻盛经营实学落地的基础，经营者如何带领团队用好核算表是关键，其抓手就是月度经营分析会。企业经营者围绕月度核算表中的销售收入、费用和时间，带领团队共同研究、研讨如何才能实现销售最大化、费用最小化以及时间最短化。通过经营分析会带动每一位员工以经营者的角度来思考和行动才是经营分析会最重要的作用之一。</p><p>对开展阿米巴经营的企业来说，月度核算只是数字化经营的起点。</p><p>月度核算是每天发生的各种细小数据的积累，因此对每天的日常核算不能有丝毫懈怠。所以，单位时间核算不是在月末统计当月的订单、生产、销售、经费、时间等重要的经营信息，而是每天进行统计，并迅速地将其结果反馈给现场。</p><p>摘自《阿米巴经营》</p><p>企业要通过不断地努力，逐步实现从周核算到日核算的跨越。</p><p>企业在实践阿米巴经营时，要以建立部门核算制度为基础，逐步在企业中开展人事评价制度和教育培训制度的落地实践，发挥与分部门核算制度的相乘效应，从而实现企业的高收益。与此同时，企业还要建立起PDCA的循环机制，推动企业持续实现高收益。</p><p>落地与实践成果检视企业经营者系统地学习了稻盛和夫经营学，只要能够沿着正确的学习路径前进并认真地在企业中开展落地与实践工作，企业就一定会摆脱困境，取得丰硕的成果。</p><p>为了帮助企业经营者更好地落地与实践稻盛和夫经营学，盛和塾组织开发了优秀标杆企业测评系统，帮助经营者检验学习的成效，及时发现自己和优秀标杆企业的差距，向后者学习。</p>'
  },
  '2026-08-13': {
    chapter: '第23天：学法 · 稻盛和夫经营学学习原则及方法（把幸福落到员工的身上与心上）',
    content: '<p>测评系统围绕提高心性、拓展经营和奉献社会三个维度展开，其中提高心性主要是从企业成长有没有在因上努力开展测评，包含经营者心性的提高和全员哲学共有;拓展经营部分主要围绕企业经营的成果开展测评，包含员工幸福和创造高收益两个模块;奉献社会主要围绕企业家的社会责任与担当开展测评。</p><p>测评系统由两套测评表构成:一套是优秀标杆企业自评表，企业经营者可以对照测评表填写;另一套是员工幸福测评表，需要由本企业员工填写，因为员工幸福与否不是经营者认为的，而是员工心声的真实反映。</p><p>员工幸福测评表建议填写人数覆盖企业总人数的70%以上，这样测评的结果才会准确反映真实状况。每套表格的各部分测评分数通过百分制换算成对应的分值，将两套表的分值加总就是最后的测评结果。</p><p>测评结果不在于当下的分值高低，重要的是通过对应的分值了解自己企业经营及员工幸福的真实状态，更重要的是要通过全员的努力，让每一次测评的结果都要好于上一次，自己和自己比。</p><p>这套测评系统能够帮助企业经营者看清自己企业当下的发展状况和员工的幸福状况，同时，对照测评表的测评内容，找到测评分值较低的项目，这就是需要努力改进的内容和方向。所以这既是一套测评系统，又是一套指导企业践行稻盛和夫经营学的指南;既有经营者应有的学习和工作状态，也有如何在企业中开展哲学共有的方法;既有会计七原则落地和开展数字化经营的要求，也有挑战高目标的数字成果检验以及为社会做贡献的公益推动。</p><p>关于员工幸福，许多经营者自以为对员工很好，但是测评结果往往与预想的大相径庭，为什么会出现这种情况?就是因为，企业经营者不了解员工幸福的关键点在哪里，不知道怎样做员工才会真正收获物质与精神的双重幸福。因此，只要企业经营者对照员工幸福测评表逐项去推动、去落实，员工就会越来越幸福。</p><p>希望大家都能够用好这套测评系统，相信它一定会让我们在践行稻盛和夫经营学的路上走得更快、更稳。</p><p><strong>第七章 稻盛和夫经营学与经营之力经营哲学带来的三种力量</strong></p><p>经营企业既像在黑暗中驾驶着一艘大船航行在茫茫大海上，又像带领着一支团队，在不断攀登一座又一座无人的山峰，经营企业需要有直面各种艰难困苦的勇气，以及战胜困难的信心和力量。稻盛和夫经营学可以给予我们这种力量。</p><p>自力在各地盛和塾，我们经常听到这样的故事。曾经意志消沉、疲惫不堪的塾员，或者是已经打算退居幕后、享受生活的塾员，在学习稻盛和夫经营学后，烦恼越来越少，充满了干劲，甚至有的打消了早早退休的念头，准备向稻盛先生学习，健康工作到80岁。</p><p>过去这些塾员之所以会出现意志消沉、萌生退意的现象，大体有三类原因，第一类是经营方法不正确，遭遇困惑而痛苦不堪;第二类是虽然事业小有成就，可发展遭遇瓶颈，企业内部管理混乱;第三类是事业顺风顺水，但在工作中找不到快乐，只想逃避。所有这些现象最后都会引发一个共同的结果一一企业经营者内心失去了力量。当企业的一把手自己都身心疲意、萌生退意，企业就不可能顺利发展。因此，稻盛和夫说，经营者本人所持有的力量是企业经营中最重要的力量，即自力。</p><p>从表面上看，上述三类原因导致经营者内心失去力量，但从本质上讲，是因为他们不知道事业成功的规律，不了解推动事业发展真正的因是什么。当经营者每天思考的都是“我要挣钱、我要发展、我要幸福”，就会逐渐迷失自我和企业发展的方向。稻盛和夫以他八十多载的人生经历和经营实践告诉我们，自利只有通过利他才能实现。当我们找到人生的目的和意义，确立了利他的人生观;找到事业的目的和意义，不再只为自己的私利私欲经营事业，而是把实现全体员工的幸福作为大义名分，内心自然会有源源不绝的力量。</p><p>内心有了力量，企业经营者还要将力量正确地落实到企业经营中，使其发挥最大力量。稻盛经营哲学就是帮助企业经营者将发心落实到经营中的放大器。他在《经营十二条》一书中写道:</p><p>领导者，即经营者本人要有力量，那么拥有能够完整地践行经营十二条的能力，便是经营者实现自力的重要条件.....当被问道:“你有作为经营者应有的力量吗?能发挥出来吗?”这时，如果你能回答“我能够忠实地遵循并践行经营十二条”，那么姑且可以说你已经具备了作为经营者应有的力量。</p><p>摘自《经营十二条》</p><p><strong>他力</strong></p><p>有人说经营者都是孤独的，是的，面对黑暗中茫茫的大海，面对经营中可能遇到的各种惊涛骇浪，每个经营者都希望有温暖的臂膀可以依靠，有志同道合的伙伴可以一起携手奋勇拼搏，这就是他力。当企业经营者每天思考的不再是仅仅满足私利私欲，而是如何让全体员工的幸福每天增加一点点，不仅自己的内心会充满力量，也会赢得全体员工的爱戴和追随。</p><p>作为领导者，稻盛和夫说:“为了获取全体员工的信赖和协助，要打造一种能够让员工自发奋进的公司氛围。为此，要赤裸裸地、透明地向员工传达公司的经营状况，并且通过空巴，毫无保留地告知员工自己打算这样经营企业，成功后，自己想为员工做这些事情等。也就是说，要让所有员工觉得“如果是这个社长，我愿意跟着他干，愿意不遗余力地协助他’，这一点是很重要的。”</p><p>当企业经营者率先垂范，践行稻盛经营哲学并带领管理层和员工持续地学习稻盛经营哲学，其下属管理者的意识就会变，紧接着员工的意识就会变，进而行动就会变，体现在日常的工作和服务中，就是产品质量和服务品质的不断提升。</p><p>稻盛和夫拯救日航，当日航的员工心变了的时候，工作态度和行动也都发生了变化。比如，值机柜台的员工为乘客办理搭乘手续，不再是生硬地按流程执行，而是始终站在乘客的立场，思考“乘客现在真正需要的是什么”“当乘客遇到困难时，我们能做什么”，并做出应对。陪伴乘客一起飞行的空乘人员也是如此，时常思考“如果这样做，乘客会更高兴吧”，急人所需，随机应变，提供让乘客满意的服务。原先只是照本宣科进行机内广播的机长，也不再重复千篇一律的内容，而是专为当日搭乘的乘客，用心设计要说的内容，进行广播。</p><p>员工原先“只要自己好就行”的利己思维方式，逐步变成了“为客户”“为伙伴”的利他思维方式，所以会在各自的岗位上全力以赴地工作，这是凝聚了全体员工所产生的他力。不仅如此，企业经营者和全体员工在每天的工作中思考的都是“如何为客户创造更大的价值以及如何为社会、国家多做一点贡献”，由此获得客户的认可及社会的广泛支持，引发客户支持的“他力”。</p><p>在盛和塾，我们经常可以听到塾员说出类似的话:“因为被我们的真诚和用心感动了，现在不仅他们成为企业的忠实客户，而且我们成为彼此信任的朋友。”稻盛和夫之所以能成功拯救日航，一个重要的原因就是全体日航员工在意识发生改变后所做的行动感动了乘客，赢得了乘客的心，促使搭乘日航的人数持续上升。因此，稻盛经营哲学所倡导的正确的经营理念和价值观就是企业开展营销活动时最高明的营销方式，它不仅见效快、作用力持久，而且没有副作用。</p><p>宇宙力稻盛和夫在《企业统治的要诀》演讲中对经营者说:</p><p>如果能够摆脱私心，为对方、为周围的人着想，那么，就像“真善美”这个词所表示的，在人的灵魂深处的美丽心灵就会显现，力量就会自然涌出。而且这种美丽的心性，同宇宙间流淌着的促使一切生物成长发展的潮流合拍，所以，结果也必将圆满。</p><p>稻盛先生用短短的两年八个月让宣布破产的日航重新上市，社会各界一片赞誉，大家都认为是他的经营哲学和阿米巴经营发挥了威力，创造了奇迹。稻盛和夫却在一次和日本盛和塾塾员的内部交流时说道:“临近80岁的我，秉持着这样的心灵，不要薪水，不求一切回报，抱着拼了老命的决心，毅然参与了困难重重的日航重建工作。我想，看到我奋不顾身的样子，上天向我伸出了援助之手。换句话说，日航重建不是我做的，而是这个世界的‘绝对存在’让我做的，我开始这么想了。如果不是这样，我认为日航如此起死回生是不可能的。这不是人的力量，而只能说是‘伟大之物’在发挥力量。是这种‘伟大的存在’援助、推动，并让我参与了日航的重建，我觉得可以这么想。”</p><p>所谓“宇宙力”是稻盛先生切身体会到的。当一个人心怀善念，以纯粹的利他之心，为社会、为世人不断努力地付出时，就会和宇宙中流消着的“爱、真诚、和谐”的宇宙意志同频共振，就会吸引和感召各种善缘与助力，从而推动事业与人生的发展和进步。所以稻盛和夫说:“只要秉持与宇宙意志相同的思维方式和生活方式，工作就一定会顺畅，人生就一定能幸福。”</p><p>稻盛和夫在《思维方式》的后记中写道:</p>'
  },
  '2026-08-14': {
    chapter: '第24天：学法 · 稻盛和夫经营学与经营之力（他力）',
    content: '<p>在这个世上，仅仅凭借自力，所能做的事情总是有限的。借到了周边人帮助的他力，所能达到的成就也是有限的。想要真正成就伟大的事业，就必须借到另一种“他力”，即超越人智的、天的力量。但是，要借到这种他力，依靠充满私利私欲的利己之心是不行的，必须依靠“与人为善”的美好的利他之心。</p><p>“我啊，我啊”的利己之心，就像有很多破洞的风帆一样，即便有他力之风吹来，布满破洞的风帆也无法借助风力带动船只前进。而与此相反，基于善的“思维方式”的风帆，就能充分地借助强大的他力之风。</p><p>我认为，持有善的“思维方式”，就是扬起接受他力之风的风帆，就是将自己的心灵磨炼得更加美好的行为。这里的风帆，表示当事人的“思维方式”带来的心态，只要摒弃利己的欲望，用与人为善的美好心灵扬起人生的风帆，就自然能借助这个世界上吹拂的、伟大而神秘的力量。</p><p>读者诸君，请一定持有善的“思维方式”，从而赢得另一种他力之风，让自己一帆风顺，度过自己幸福美好的人生。</p><p><strong>经营实学带来的三种力量</strong></p><p>压力企业经营者之所以感到孤独，往往是因为他要独自承受来自方方面面的压力，市场拓展、产品创新、企业管理、主管部门监管......有些企业经营已经举步维艰，有的甚至长期亏损。但因为企业经营数据不公开、不透明，员工不了解企业真实的经营状况，反而误解企业经营者只管自己挣钱而故意不给大家涨工资、发奖金，经营者有苦难言，所有压力只能自己扛。</p><p>稻盛经营实学的核心思想是用数字经营企业，用科学的标尺来检测和判断经营中出现的各种问题，从而改变不透明、盖浇饭式的管理模式，改变企业里只有老板或业务人员关心经营结果、利润，其他部门、员工不了解也不关心经营数字的做法。正是因为企业里大部分员工不关心利润和成本状况，才会出现每个部门都只追求自己部门的支出和花费最优化和最大化，不断抬高企业运营成本的现象。这样的企业，员工感受不到市场的变化和经营的压力，企业的经营成果不好也就变得理所当然了。</p><p>只要企业经营者下定决心在企业中开展玻璃般透明的数字化经营，彻底贯彻“销售最大化，费用最小化的经营原则，那么，通过经营者率先垂范，带领全体员工围绕收入、成本(费用)和工作效率开展月核算、周核算和日核算，渐渐员工就会了解企业真实的经营状况。而市场的变化、利润的增减、成本(费用)的高低也会和每一位员工的日常行为发生链接。当每一位员工都能够感受到市场的变化和企业经营的压力，过去企业经营者一个人扛的压力就会分散到大家身上，大家一起面对危机和压力，才会产生“上下同欲者胜，同舟共济者赢”的结果。</p><p><strong>动力</strong></p><p>企业经营者常常会指责员工不努力、没有责任心，明明许多工作可以不出错，可以干得更好，偏偏就是问题层出不穷，让人焦头烂额。其实在这样的企业里，员工也抱怨连天，他们往往会说:“我为什么要努力?努力了、用心干了，可是工作结果是糊涂账，上司看不清，老板更不知道，努不努力一个样，干好干坏一个样，还不如得过且过。”有的员工更是做一些损公肥私、触犯法律的事，反正是糊涂账，谁也不清楚。</p><p>有的企业岗责不清，同时又没有清晰、可量化的考核指标和考核办法，从而导致谁也不愿意担责任，工作能推就推，能不干就不干，因为干好了没有肯定，干多了还要多担责任，反正是吃“大锅饭”，多一事不如少一事，大多数员工是只要没人监督就混日子，状态松懈，没有干劲、没有动力。</p><p>当企业导入稻盛经营实学，开展阿米巴模式的数字化经营，并根据企业的发展战略及目标重新明确组织划分，围绕“销售最大化，费用最小化”开展分部门、分产品、分项目等各种组织形式的独立核算后，员工的状态立刻就会发生天翻地覆的变化。员工通过自己的努力和用心为本部门创造的每一分价值、节约的每分成本都可以立刻通过核算表反映出来，他们自己也会得到同事和领导的嘉许、感谢，付出的努力也会体现在员工的进步与成长中，员工不仅会在工作中收获成长，更会因此而感受到工作的意义和人生的价值。</p><p>当企业建立起这样的经营机制，自然就会极大地调动全体员工的积极性和创造性，就会鼓舞员工的干劲和动力。</p><p><strong>欢喜力</strong></p><p>企业开展阿米巴经营后，年度计划、月度计划以及月度经营分析会是重要的抓手，通过将企业全年总目标在空间上分解到每个阿米巴单元年度目标上，在时间上分解到每个阿米巴单元的月度计划小目标上，这样，实现每月预定目标的达成就成了全体阿米巴成员共同努力的动力源泉。</p><p>从某种角度上讲，好的企业经营模式就像打游戏一样，游戏为什么能够吸引不同年龄段的人沉迷其中而乐此不疲呢?就是因为它的设计抓住了人性中对于认可的渴望和成功的期待，不断地打怪升级，胜利通关的过程就是一个持续获得正反馈，从而让自己长久保持激情和热情的过程。阿米巴经营模式最了不起的地方就是把人性中本有的力量通过设定一个个小目标，不知不觉中调动起大家的热情和激情，在不断达成小目标的过程中，人们的内心充满了开心与喜悦，我们把它称为“欢喜力”。</p><p>有人说，人生就是要不断地给自己设定目标并达成目标，有了目标就有了努力的方向，目标带来的不只是实现那一刻的喜悦，更重要的是，为目标达成而努力的过程中多了一份专注和投入，这一过程本身就是在实现自我心性的提高和生命境界的升华。</p><p><strong>相“反”相成的力量</strong></p><p>“道”是中国古代圣人们通过对宇宙、大自然的观察和思考，发现的宇宙万物生成、发展的内在规律。</p><p>“一阴一阳之谓道”的“道”，我认为它包含了三层意思，“道”的第一层意思是指道路的“道”，一切现象只有同时把握正反两个方面才是一条行得通的道路。“道”的第二层意思是指规律，暗合道妙，“孤阳不生，孤阴不长”，一切现象都是在阴阳相对、正反两种力量的对立统一中，相互砥力，形成张力，从而推动宇宙万有现象的生成与发展。把握好这两种力量，就把握住了宇宙发展的规律。“道”的第三层意思就是指稻盛先生所感悟的宇宙的意志，即“爱、真诚、和谐”。与“道”相合时，就会与宇宙之力同频共振，就可以获得源源不断的动力。</p><p>美国作家斯科特·菲茨杰拉德(ScottFitzgerald)有这样一句名言:“一流智识之人同时拥有两种互相对立的思维方式，却能使其各自正常发挥作用。”纵观人类历史，我们可以发现那些可以被称为伟大的人物，其性格、思想大多是同时兼备两极而又能够完美地统一于一身，他们总是能够从不同的维度准确地把握现象背后相互对立的两个方面，同时又能够完美地把它们统一在“道”中，在他们的世界中，二和一同时存在，这就是所谓的“不二”。</p><p>大多数人的思维方式往往只有一个维度，只能看到现象背后的单一方面，或者虽然看到了相对的两面，却又总是割裂地看待它们，看不清它们之间内在的普遍联系性和对立统一性，非左即右。例如，在企业经营中，如何看待销售业绩与产品质量之间的关系，如何看待销售业绩与企业管理之间的关系，如何看待销售业绩与企业文化之间的关系?许多经营者坚信销售为王，认为只要销售业绩良好，一切问题就可以迎刃而解;也有经营者认为，在企业经营过程中，虽然销售业绩、产品质量、企业管理、企业文化等都很重要，但还是要排出个先后顺序。这样的思维方式就是典型的“二”，所以我们才会看到中国的中小企业平均寿命只有2.5年，也看到许多明星企业就像稻盛先生所描述的那样，成了建筑在沙滩上的楼阁，“眼见他起高楼，眼见他宴宾客，眼见他楼塌了”。为什么?因为企业既找不到令其基业长青的那个根本的“道”，即那个“一”，也没能看清并把握住事业成功的那个“道”，即一体两面的那个“二”，一个没有“道”，不合“道”的企业怎么能持续成功呢?</p>'
  },
  '2026-08-15': {
    chapter: '第25天：学法 · 稻盛和夫经营学与经营之力（企业经营的"不二"法门）',
    content: '<p><strong>企业经营的“不二”法门</strong></p><p>稻盛和夫就是兼备两极性格并能够均衡运用的典范，他既有追求全体员工物心两方面幸福，为世人、社会做贡献的慈悲心肠，又有大善似无情的霹雳手段。慈悲心肠不是当“好好先生”，对不符合正确理念、消极怠工或敷衍塞责的员工，稻盛和夫敢于大声呵斥，甚至要求对方辞职。</p><p>稻盛和夫既有严谨科学的理性思维，又是一个感性的浪漫主义者。他对陶瓷产品的研究开发一丝不苟，一旦有了小小的成功，就欢呼雀跃，带领大家举杯相庆。稻盛和夫说:</p><p>“商战”中，经营者要当个彻头彻尾的理性主义者，在其他时候，则要奉行浪漫主义，了解形而上学的领域，只有两者兼具，不偏不倚，才能成为一流的企业家。</p><p>一摘自《京瓷哲学:人生与经营的原点》</p><p>同时，稻盛和夫又是一个兼备大胆和细心的经营者，他说:“大胆与细心看起来互相矛盾，但这两个极端必须同时具备，才能把工作做得完美。”</p><p>当日本政府决定开放电信业，允许民营企业进入该领域时，虽然自己是电信行业的门外汉，但为了降低日本全体国民的通信费用，稻盛和夫毅然决定参与其中。当时很多人嘲笑他“堂吉诃德挑战风车”，但他认为，人生只有一次，遇到珍贵的机遇绝不可错失，要敢于接受挑战。但同时，为了做好这项事业，在那之后的6个月，每天晚上即便喝了酒，在入睡之前，他也一定会扪心自问:“你想创立第二电电、参与电信业，动机真的纯粹吗?真的没有掺杂私心吗?”他每天都进行这样的“灵魂拷问”，直到自己百分百地确定自己“丝毫没有夹杂为名为利的私欲”，才真正下定决心开创这项新事业。</p><p>不仅稻盛和夫本人同时具有兼备两极的均衡人格，稻盛和夫经营学中也处处充满了这样对立统一的哲学思想:既要具备“崇高的使命感”又要“设立具体的目标”;既要“描绘梦想”又要“脚踏实地，坚持不懈”;既要“追求大家族主义”经营思想又要“彻底贯彻实力主义”;销售最大化与费用最小化;重视经验与贯彻现场主义;小善似大恶与大善似无情;乐观构思、悲观计划与乐观执行;把自己逼入绝境与在相扑台的中央发力;用跑百米的速度跑马拉松;认为不行的时候正是工作的开始;把萧条看作再发展的飞跃台;等等</p><p>稻盛和夫经营学源自经营实践，稻盛哲学与稻盛实学，提高心性与拓展经营，是在对立统一中形成的完整体系，这是它与其他各类管理学的不同之处。稻盛和夫经营学是世界观和方法论的完美统一，是利己与利他在经营中的统一实现。稻盛和夫经营学的核心思想最终统一在“以爱、真诚、和谐之心为社会、为世人做贡献”这一宏大的愿心之中，这才是企业经营的“不二”法门。</p><p>当下流行的管理学理论中有一个比较热门的概念--灰度理论，甚至一些研究者把稻盛和夫的经营思想与灰度理论相提并论。我认为二者之间存在根本性不同。所谓“灰度理论”讲的是妥协，不要求非黑即白而是追求黑白之间的平衡，在妥协的平衡中求发展;而稻盛和夫经营学的原点是“作为人，何谓正确”，现象上可以有灰度，但判断上只有一个基准，没有妥协，非黑即白，小善似大恶、大善似无情，即使当下虽不能至，但也要心向往之。稻盛和夫经营学是以爱为根基，兼备两极，抓住现象背后相互对立的两个方面，在将两极发挥到极致的过程中，两种力量相“反”相成，高位平衡，在对立统一中实现事业的快速、持续发展。</p><p><strong>人生事业成功的实相</strong></p><p>1959年，稻盛和夫白手起家创立京瓷，将其从一家街道小工厂变成著名企业，并在1971年成功上市，在1975年超过索尼成为日本证券市场市值第一的企业。60年来，京瓷从未亏损。</p><p>53岁时，作为电信业的门外汉，为降低日本国民的通信费用，稻盛和夫毅然投入电信业，创立了KDDI，如今KDDI已发展成为日本第二大通信公司，跻身世界500强企业。</p><p>78岁时，稻盛和夫在日本政府的再三邀请下，冒着晚节不保的风险，再次出山，出任日航董事长，只用了不到三年的时间就让日航实现了神奇的V字形逆转，再次成功上市。</p><p>不仅如此，稻盛和夫在经营企业的60多年里，还多次挽救濒临破产的中小企业，只要他一接手，企业就会在很短的时间内转危为安，取得高收益。</p><p>为什么稻盛和夫所领导的企业总是能够取得如此快速且持续的成功呢?</p><p>答案就是，他找到了事业成功的规律。</p><p>认识规律，按规律办事，人生就会幸福，事业就会成功。这就是人生、事业成功的实相。</p><p>稻盛和夫经营学以人生哲学为基轴，以良知和利他为原点，经营哲学的导入改变了经营者以及全体员工的思维方式，不仅帮助企业找到了正确的方向，而且凝聚了全体员工的心，将自力、他力、宇宙力汇成一股由内而外的巨大推动力。</p><p>经营实学的实践，通过重新划分组织单元和导入阿米巴模式，不仅让全体员工有了经营者的意识，而且在持续开展的日核算、周核算和月核算中，企业的盈利能力、管理能力、创新能力等都实现了大幅提升，数字化经营把全体员工的压力、动力和欢喜力汇聚成一股由外而内的巨大的拉动力。推动力与拉动力相“反”相成，就会推动人生、事业快速地改变和成长，无论是经营者还是全体员工就会越干越欢喜，欢喜就会点燃热情，持续的热情就会让大家越干越有力量。</p><p>稻盛和夫经营学的核心理论是稻盛和夫所感悟、总结出的人生方程式:人生·工作的结果=思维方式X热情(努力)X能力，这就是经营人生、事业成功的规律。构成稻盛和夫经营学的人生哲学、经营哲学和经营实学是在通过人生与事业的不同维度，帮助经营者和企业全体员工改变思维方式、点燃热情和提升能力，最终实现人生幸福与事业成功。学习和实践稻盛和夫经营学的过程就是认识规律、按规律办事的过程，学习和实践稻盛和夫经营学既不神秘也不复杂，只要我们心怀善念，拼命努力，哲学与实学齐头并进，其结果一定会收获成功。</p><p>盛和塾稻盛和夫经营研究中心(简称“盛和塾”)是企业经营者学习、亲身实践稻盛和夫的人生哲学、经营哲学与经营实学、企业家精神之真髓的平台，并通过塾员间的相互切磋、交流，达到事业隆盛与人德和合，成为经济界的中流砥柱、国际社会公认的模范企业家。</p><p>1983年，京都的年轻企业家们向稻盛先生提出了一个愿望--“给我们讲解应该如何开展企业经营”。以此为契机，由25名经营者组成的学习会启动了。截至2019年年底，盛和塾在世界各地的分塾已发展到104个，除日本外，美国、巴西、中国、韩国相继成立了分塾。</p><p>2007年，曹岫云先生率先发起成立中国第一家盛和塾-无锡盛和塾，并任首任会长。</p><p>2010年，稻盛先生亲自提议成立稻盛和夫(北京)管理顾问有限公司(以下简称“北京公司”)，作为总部负责中国盛和塾的运营。</p><p>北京公司成立之初，稻盛先生即决定在中国召开塾长例会，即稻盛和夫经营哲学报告会，后更名为盛和塾企业经营报告会。2010年至今，13届盛和塾企业经营报告会先后举办。盛和塾企业经营报告会已成为一年度企业经营者学习、交流稻盛和夫经营学的盛会。</p><p>2019年年底，稻盛先生宣布关闭世界范围内其他地区的盛和塾，仅保留中国的盛和塾继续运营。2020年11月14一15日，盛和塾第13届企业经营报告会在郑州举办，稻盛和夫经营学研究者、实践者做现场发表，3000余名企业经营者现场参加了会议。</p><p>盛和塾成立30多年来，不仅会员人数不断增加，学习质量也不断提高，其中有100多位塾员的企业已先后上市。这么多的企业家，这么长的时间内，追随稻盛和夫这个人，把他作为自己经营和人生的楷模，这一现象，古今中外，十分罕见。</p>'
  },
};

async function hmacSha1(key, msg) {
  var enc = new TextEncoder();
  var keyData = (typeof key === 'string') ? enc.encode(key) : key;
  var msgData = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var cryptoKey = await crypto.subtle.importKey('raw', keyData, {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha1Hash(msg) {
  var enc = new TextEncoder();
  var data = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function cosSignHeaders(method, path) {
  var now = Math.floor(Date.now()/1000);
  var keyTime = (now-60)+';'+(now+3600);
  var signKey = await hmacSha1(COS_CONFIG.SecretKey, keyTime);
  var httpString = method.toLowerCase()+'\n'+path+'\n\n\n';
  var httpStringHash = await sha1Hash(httpString);
  var stringToSign = 'sha1\n'+keyTime+'\n'+httpStringHash+'\n\n\n\n\n';
  var signature = await hmacSha1(signKey, stringToSign);
  var auth = 'q-sign-algorithm=sha1&q-ak='+COS_CONFIG.SecretId+'&q-sign-time='+keyTime+'&q-key-time='+keyTime+'&q-header-list=&q-url-param-list=&q-signature='+signature;
  return { Authorization: auth };
}
async function uploadToCloud(blob, fileName) {
  try {
    var filePath = '/'+COS_CONFIG.Bucket+'/recordings/'+fileName;
    var url = 'https://'+COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com/recordings/'+fileName;
    var headers = await cosSignHeaders('PUT', filePath);
    headers['Host'] = COS_CONFIG.Bucket+'.cos.'+COS_CONFIG.Region+'.myqcloud.com';
    var result = await new Promise(function(resolve,reject){
      var timer = setTimeout(function(){reject(new Error('上传超时'));}, 30000);
      fetch(url, {method:'PUT', headers, body:blob}).then(function(res){
        clearTimeout(timer);
        if (res.ok||res.status===200) { resolve(url); }
        else { res.text().then(t=>{reject(new Error('HTTP '+res.status));}).catch(()=>{reject(new Error('HTTP '+res.status));}); }
      }).catch(function(err){clearTimeout(timer); reject(new Error('网络错误: '+(err.message||err)));});
    });
    return result;
  } catch(e) { throw new Error(e&&e.message?e.message:String(e)); }
}

}

// ===== RECORDING - FIXED VERSION =====
// States: 'idle' | 'recording' | 'done'
let recState = 'idle';
let mediaRecorder = null;
let recordedChunks = [];
let mediaStream = null;
let recordTimer = null;
let recordSeconds = 0;
let currentBlob = null;

function handleRecordClick() {
  if (recState === 'idle') {
    startRecording();
  } else if (recState === 'recording') {
    stopRecording();
  } else if (recState === 'done') {
    // Click mic icon again = start new recording
    resetRecording();
    startRecording();
  }
}

function handleActionBtnClick() {
  // "重新录制" button
  resetRecording();
}

function resetRecording() {
  recState = 'idle';
  currentBlob = null;
  recordSeconds = 0;
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var uploadStatus = document.getElementById('uploadStatus');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn';
  btn.textContent = '🎤';
  btn.title = '点击开始录音';
  status.className = 'record-status';
  status.textContent = '点击麦克风开始朗读录音';
  duration.textContent = '';
  actionBtn.style.display = 'none';
  uploadStatus.className = 'record-upload-status';
  uploadStatus.textContent = '';
  playback.className = 'record-playback';
}

function startRecording() {
  var status = document.getElementById('recordStatus');
  var btn = document.getElementById('recordBtn');

  // 立即给点击反馈
  btn.style.opacity = '0.6';
  setTimeout(function(){ btn.style.opacity = ''; }, 150);

  var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost && location.protocol !== 'https:') {
    status.textContent = '⚠️ 请使用 HTTPS 访问（或本地 localhost 预览）';
    status.style.color = '#ff6b6b';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ 您的浏览器不支持录音，请用手机浏览器打开';
    status.style.color = '#ff6b6b';
    return;
  }

  status.textContent = '🎤 正在请求麦克风权限...';
  status.style.color = '#ffa502';

  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function(stream) {
      mediaStream = stream;
      recordedChunks = [];
      recordSeconds = 0;

      let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        currentBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        onRecordingDone();
      };

      mediaRecorder.start();
      recState = 'recording';

      var duration = document.getElementById('recordDuration');
      btn.className = 'record-btn recording';
      btn.textContent = '⏹';
      btn.title = '点击停止录音';
      status.className = 'record-status active';
      status.textContent = '🔴 正在录音中... 点击⏹停止';
      status.style.color = '';
      duration.textContent = '已录 0秒';

      recordTimer = setInterval(function() {
        recordSeconds++;
        var m = Math.floor(recordSeconds / 60);
        var s = recordSeconds % 60;
        duration.textContent = '已录 ' + (m > 0 ? m + '分' : '') + s + '秒';
      }, 1000);
    })
    .catch(function(err) {
      var errMsg = err && err.message ? err.message : String(err || '');
      if (errMsg.indexOf('Permission') >= 0 || errMsg.indexOf('Denied') >= 0 || errMsg.indexOf('denied') >= 0) {
        status.textContent = '⚠️ 麦克风权限被拒绝，请在地址栏允许后重试';
      } else if (errMsg.indexOf('NotFound') >= 0) {
        status.textContent = '⚠️ 未检测到麦克风设备';
      } else {
        status.textContent = '⚠️ 录音启动失败：' + (errMsg || '未知错误');
      }
      status.style.color = '#ff6b6b';
    });
}

function stopRecording() {
  if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  recState = 'done';

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function onRecordingDone() {
  var m = Math.floor(recordSeconds / 60);
  var s = recordSeconds % 60;
  var timeStr = (m > 0 ? m + '分' : '') + s + '秒';

  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');
  var actionBtn = document.getElementById('recordActionBtn');
  var playback = document.getElementById('recordPlayback');

  btn.className = 'record-btn done';
  btn.textContent = '✅';
  btn.title = '录音完成，点击重新录制';
  status.className = 'record-status done-status';
  status.textContent = '✅ 录音完成！共朗读 ' + timeStr;
  duration.textContent = '点击播放器回听，或点击麦克风重新录制';

  // Show playback
  var player = document.getElementById('recordPlayer');
  player.src = URL.createObjectURL(currentBlob);
  playback.className = 'record-playback show';

  // Show redo button
  actionBtn.textContent = '重新录制';
  actionBtn.className = 'record-action-btn redo-btn';
  actionBtn.style.display = 'block';

  // Save read time to checkins
  var today = todayStr();
  var checkins = getCheckins();
  if (!checkins[today]) checkins[today] = {};
  if (typeof checkins[today] === 'string') checkins[today] = { time: checkins[today] };
  checkins[today].readTime = timeStr;
  checkins[today].readSeconds = recordSeconds;
  saveCheckins(checkins);

  // Upload in background
  doUploadAudio(today, timeStr);
}

async function doUploadAudio(dateStr, durationStr) {
  var statusEl = document.getElementById('uploadStatus');
  statusEl.className = 'record-upload-status show';
  statusEl.innerHTML = '<span class="loading-spin"></span> 正在上传录音到云端...';

  try {
    if (!currentBlob) { statusEl.textContent = '⚠️ 无录音内容'; return; }
    var userName = localStorage.getItem(USER_KEY) || '匿名';
    var timestamp = Date.now();
    var safeName = dateStr + '_' + userName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '') + '_' + timestamp;
    var fileId = await uploadToCloud(currentBlob, safeName + '.webm');
    var dayIdx = getDayIndex(dateStr);
    var chapterInfo = bookContent[dateStr] || {};
    await saveRecordToDB({
      userName, date: dateStr, dayIndex: dayIdx,
      chapter: chapterInfo.chapter || '',
      duration: durationStr, fileSizeKB: Math.round(currentBlob.size/1024),
      fileId: fileId || '', createdAt: new Date()
    });
    statusEl.style.color = '#2ecc71';
    statusEl.textContent = '☁️ 录音已上传至云端！';
  } catch(err) {
    statusEl.style.color = '#f5c518';
    statusEl.textContent = '📱 录音已保存本地，云端上传失败（可回听）';
    console.warn('[Upload] failed:', err);
  }
}

// ===== UTILITIES =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getCheckins() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveCheckins(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getDayIndex(dateStr) {
  const start = new Date(START_DATE + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - start) / 86400000) + 1;
}

// ===== INIT =====
function init() {
  renderToday();
  renderCalendar();
  renderHistory();
  updateStats();
  loadAudioWall();
}

// ===== TODAY =====
function renderToday() {
  const today = todayStr();
  const checkins = getCheckins();
  const data = bookContent[today];
  const badge = document.getElementById('todayBadge');
  const chapter = document.getElementById('todayChapter');
  const contentEl = document.getElementById('todayContent');
  const btn = document.getElementById('checkinBtn');
  const statusBox = document.getElementById('statusBox');

  if (!data) {
    const isBeforeStart = new Date(today) < new Date(START_DATE);
    badge.textContent = isBeforeStart ? '待开始' : '已结束';
    chapter.textContent = isBeforeStart ? '读书计划尚未开始' : '《学法》全书共读圆满完成！';
    contentEl.innerHTML = isBeforeStart
      ? '<p>读书打卡活动将于 <strong>2026年7月22日</strong> 正式开始，请耐心等待！</p><blockquote>提高心性，拓展经营——稻盛和夫</blockquote>'
      : '<p>🎉 恭喜您完成了《学法》全书25天的阅读打卡之旅！</p><blockquote>感谢陪伴，继续前行！</blockquote>';
    btn.textContent = isBeforeStart ? '⏳ 尚未开始' : '✅ 已全部完成';
    btn.disabled = true;
    statusBox.className = 'status-box ' + (isBeforeStart ? 'not-started' : 'completed');
    statusBox.textContent = isBeforeStart ? '活动将于 7月22日 开始' : '《学法》全书共读圆满完成！';
    return;
  }

  const dayIdx = getDayIndex(today);
  badge.textContent = `第 ${dayIdx} 天`;
  chapter.textContent = data.chapter;
  contentEl.innerHTML = data.content;
  applyFontSize();

  if (checkins[today]) {
    const record = checkins[today];
    const timeStr = typeof record === 'object' ? record.time : record;
    const readTime = typeof record === 'object' ? record.readTime : '';
    const reflection = typeof record === 'object' ? record.reflection : '';
    btn.textContent = '✅ 今日已打卡';
    btn.disabled = true;
    statusBox.className = 'status-box completed';
    const userName = localStorage.getItem(USER_KEY) || '';
    statusBox.innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${readTime ? '朗读时长：' + readTime : ''}</b>`;
    if (reflection) {
      document.getElementById('reflectionInput').value = reflection;
      document.getElementById('reflectionSaved').style.display = 'block';
    }
    document.getElementById('reflectionInput').disabled = true;
  } else {
    btn.textContent = '📝 提交打卡';
    btn.disabled = false;
    statusBox.className = 'status-box in-progress';
    statusBox.textContent = '📖 今日内容已解锁，请阅读后打卡';
    document.getElementById('reflectionInput').disabled = false;
  }
}

// ===== CHECK IN =====
function doCheckIn() {
  const today = todayStr();
  const checkins = getCheckins();
  if (checkins[today] && typeof checkins[today] === 'object' && checkins[today].time) return;

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const reflection = (document.getElementById('reflectionInput').value || '').trim();
  const readTime = recState === 'done' ? (document.getElementById('recordStatus').textContent.replace('✅ 录音完成！共朗读 ', '') || '') : '';

  if (!checkins[today] || typeof checkins[today] !== 'object') {
    checkins[today] = {};
  }
  checkins[today].time = timeStr;
  checkins[today].reflection = reflection;
  if (readTime && !checkins[today].readTime) checkins[today].readTime = readTime;
  saveCheckins(checkins);

  document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
  document.getElementById('checkinBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box completed';
  const userName = localStorage.getItem(USER_KEY) || '';
  const rt = checkins[today].readTime || '';
  document.getElementById('statusBox').innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡！${rt ? '朗读时长：' + rt : ''}</b>`;

  if (reflection) {
    document.getElementById('reflectionSaved').style.display = 'block';
  }
  if (recState === 'recording') stopRecording();

  renderCalendar();
  renderHistory();
  updateStats();
}

// ===== STATS =====
function updateStats() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent);
  const checkedDays = keys.filter(k => {
    const v = checkins[k];
    return v && (typeof v === 'string' || v.time);
  }).length;
  document.getElementById('statChecked').textContent = checkedDays;
  document.getElementById('progressCount').textContent = `${checkedDays} / ${TOTAL_DAYS}`;
  document.getElementById('progressFill').style.width = `${(checkedDays / TOTAL_DAYS * 100).toFixed(1)}%`;
  let streak = 0;
  let d = today;
  while (bookContent[d] && checkins[d] && (typeof checkins[d] === 'string' || checkins[d].time)) {
    streak++;
    d = dateAdd(d, -1);
  }
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = Math.max(0, TOTAL_DAYS - checkedDays);
  document.getElementById('progressText').textContent = `打卡进度 ${(checkedDays / TOTAL_DAYS * 100).toFixed(0)}%`;
}

// ===== CALENDAR =====
function renderCalendar() {
  const checkins = getCheckins();
  const today = todayStr();
  const container = document.getElementById('calendarContainer');
  // Show months from June 2026 to Sep 2026
  const months = [
    {year:2026,month:7,label:'2026年7月'},
    {year:2026,month:8,label:'2026年8月'},
    {year:2026,month:9,label:'2026年9月'},
  ];
  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];
  months.forEach(({year,month,label}) => {
    const firstDay = new Date(year,month-1,1).getDay();
    const daysInMonth = new Date(year,month,0).getDate();
    html += `<div style="margin-bottom:20px;">
      <div style="text-align:center;color:#f5c518;font-size:0.9em;margin-bottom:10px;font-weight:bold;">${label}</div>
      <div class="calendar-grid">`;
    weekDays.forEach(w => { html += `<div class="cal-header">${w}</div>`; });
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inRange = bookContent[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const isChecked = checkins[dateStr] && (typeof checkins[dateStr] === 'string' || checkins[dateStr].time);
      let cls = 'cal-day';
      if (!inRange) { cls += isFuture ? ' future' : ' empty'; }
      else if (isChecked) { cls += ' checked'; }
      else if (isToday) { cls += ' today-marker'; }
      else if (isFuture) { cls += ' future'; }
      else { cls += ' available'; }
      const onclick = inRange && !isFuture ? `onclick="showDayModal('${dateStr}')"` : '';
      html += `<div class="${cls}" ${onclick}>${d}</div>`;
    }
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

// ===== HISTORY =====
function renderHistory() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent).sort().reverse();
  const list = document.getElementById('historyList');
  if (!keys.length) { list.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">暂无记录</p>'; return; }
  list.innerHTML = keys.map(dateStr => {
    const data = bookContent[dateStr];
    const record = checkins[dateStr];
    const isChecked = record && (typeof record === 'string' || record.time);
    const isFuture = dateStr > today;
    const dayIdx = getDayIndex(dateStr);
    const dateLabel = dateStr.replace('2026-','').replace('-','月') + '日';
    let checkedLabel = '';
    if (isChecked) {
      const timeStr = typeof record === 'object' ? record.time : record;
      const readTime = typeof record === 'object' ? record.readTime : '';
      const reflection = typeof record === 'object' ? record.reflection : '';
      checkedLabel = `<div class="h-checked">✅ 已打卡 ${timeStr}${readTime ? ' · ' + readTime : ''}</div>`;
      if (reflection) checkedLabel += `<div style="font-size:0.78em;color:#aaa;margin-top:4px;">💬 ${reflection.slice(0,40)}${reflection.length>40?'...':''}</div>`;
    }
    return `<div class="history-item" onclick="showDayModal('${dateStr}')">
      <div class="h-date">${dateLabel} · 第${dayIdx}天${isFuture ? ' <span style="color:#555">（未解锁）</span>' : ''}</div>
      <div class="h-chapter">${data.chapter}</div>
      ${isChecked ? checkedLabel : (isFuture ? '' : '<div style="font-size:0.75em;color:#666;margin-top:4px;">未打卡</div>')}
    </div>`;
  }).join('');
}

// ===== MODAL =====
function showDayModal(dateStr) {
  const data = bookContent[dateStr];
  if (!data) return;
  document.getElementById('modalTitle').textContent = data.chapter;
  document.getElementById('modalBody').innerHTML = data.content;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('active');
  }
}

// ===== AUDIO WALL =====
function loadAudioWall() {
  try {
    var listEl = document.getElementById('audioWallList');
    if (!listEl) return;
    listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;"><span class="loading-spin"></span> 加载录音列表...</p>';
    queryAllRecords(300).then(records => {
      if (!records.length) {
        listEl.innerHTML = '<p style="color:#666;text-align:center;padding:40px;">🎵 还没有录音哦~ 快来第一个朗读打卡吧！</p>';
        return;
      }
      let html = `<div style="text-align:right;font-size:0.75em;color:#555;margin-bottom:8px;">共 ${records.length} 条录音</div>`;
      records.forEach((r,idx) => {
        const fileUrl = r.fileId || '';
        const dateLabel = (r.date||'').replace('2026-','').replace('-','/') + '日';
        const displayName = r.userName || '匿名';
        const chapterTitle = r.chapter || `第${r.dayIndex||'?'}天`;
        let audioHtml = fileUrl.startsWith('http')
          ? `<audio controls preload="none" src="${fileUrl}" style="width:100%;height:34px;border-radius:8px;"></audio>`
          : '<span style="font-size:0.78em;color:#666;">音频处理中</span>';
        html += `<div class="audio-item">
          <div class="audio-item-top">
            <span class="audio-item-name">🎤 ${escapeHtml(displayName)}</span>
            <span class="audio-item-date">${dateLabel}</span>
          </div>
          <div class="audio-item-chapter">${escapeHtml(chapterTitle)}</div>
          <div class="audio-player-row">${audioHtml}<span class="audio-duration-badge">${r.duration||''}</span></div>
        </div>`;
      });
      listEl.innerHTML = html;
    }).catch(err => {
      listEl.innerHTML = '<p style="color:#ff4757;text-align:center;padding:40px;">⚠️ 加载失败，请刷新重试</p>';
    });
  } catch(e) { console.warn('[AudioWall]', e); }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TABS =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (el) el.classList.add('active');
  if (tab === 'audiowall') loadAudioWall();
}
</script>
