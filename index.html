<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>读书打卡 · 阿米巴经营</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      font-size: 14px;
    }
    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.5em; color: #f5c518; margin-bottom: 6px; letter-spacing: 2px; }
    .formula { font-size: 0.82em; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .dates { font-size: 0.78em; color: #666; }
    .progress-section { padding: 0 20px 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 6px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f5c518, #ff6b6b); border-radius: 3px; transition: width 0.5s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; font-size: 0.82em; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.4); color: #f5c518; }
    .today-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 14px; position: relative;
    }
    .day-badge {
      display: inline-block; background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 0.75em; font-weight: bold; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .today-card h2 { font-size: 0.95em; color: #f5c518; margin-bottom: 14px; line-height: 1.6; }
    .content-body { font-size: 14px; line-height: 1.95; color: #ccc; }
    .content-body p { margin-bottom: 10px; }
    .content-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .content-body strong { color: #fff; }
    .content-body ul, .content-body ol { padding-left: 20px; margin: 8px 0; }
    .content-body li { margin-bottom: 6px; }
    .checkin-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    .status-box {
      text-align: center; padding: 12px; border-radius: 10px;
      font-size: 0.88em; margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-header { text-align: center; font-size: 0.72em; color: #666; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 0.78em; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future { background: rgba(255,255,255,0.04); color: #555; cursor: default; }
    .cal-day.available { background: rgba(255,255,255,0.08); color: #aaa; }
    .cal-day.available:hover { background: rgba(245,197,24,0.15); border-color: #f5c518; color: #f5c518; }
    .cal-day.today-marker { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; font-weight: bold; }
    .cal-day.checked { background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1)); border-color: #2ecc71; color: #2ecc71; }
    .cal-day.checked::after { content: '✓'; position: absolute; bottom: 1px; right: 3px; font-size: 0.65em; color: #2ecc71; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(245,197,24,0.3); }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 24px; max-width: 680px; width: 100%; margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body { font-size: 0.88em; line-height: 1.9; color: #ccc; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px; width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #aaa; border-radius: 8px; cursor: pointer; font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: #fff; font-size: 1em; padding: 12px 16px; text-align: center;
      margin-bottom: 16px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }
    .user-greeting {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name { color: #666; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    .user-greeting .change-name:hover { color: #aaa; }
    .font-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: flex-end; }
    .font-btn {
      padding: 4px 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING - FIXED ===== */
    .record-area {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #ccc; font-size: 1.4em;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; user-select: none;
    }
    .record-btn.recording {
      border-color: #ff4757; background: rgba(255,71,87,0.2); color: #ff4757;
      animation: pulse 1s infinite;
    }
    .record-btn.done {
      border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; min-width: 0; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-status.done-status { color: #2ecc71; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }
    .record-action-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8em; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .record-action-btn:hover { background: rgba(255,255,255,0.15); }
    .record-action-btn.stop-btn { border-color: #ff4757; background: rgba(255,71,87,0.1); color: #ff4757; }
    .record-action-btn.stop-btn:hover { background: rgba(255,71,87,0.2); }
    .record-action-btn.redo-btn { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; font-size: 0.75em; }

    .record-upload-status { font-size: 0.78em; color: #f5c518; margin-top: 4px; display: none; }
    .record-upload-status.show { display: block; }
    .record-playback { margin-top: 8px; display: none; }
    .record-playback.show { display: block; }
    .record-playback audio { width: 100%; height: 36px; border-radius: 8px; }
    .record-playback-label { font-size: 0.76em; color: #888; margin-bottom: 4px; }
    .loading-spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3); border-top-color: #f5c518;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reflection-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .reflection-label { font-size: 0.82em; color: #888; margin-bottom: 8px; }
    .reflection-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: #ddd; font-size: 0.88em; line-height: 1.7;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus { outline: none; border-color: rgba(245,197,24,0.4); background: rgba(255,255,255,0.08); }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved { font-size: 0.78em; color: #2ecc71; margin-top: 6px; display: none; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    .audio-wall-header { text-align: center; margin-bottom: 16px; }
    .audio-wall-header h3 { color: #f5c518; font-size: 1em; margin-bottom: 4px; }
    .audio-wall-header p { font-size: 0.78em; color: #888; }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s;
    }
    .audio-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,197,24,0.3); }
    .audio-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row { display: flex; align-items: center; gap: 12px; }
    .audio-player-row audio { flex: 1; height: 36px; border-radius: 8px; }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15); color: #f5c518;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75em; white-space: nowrap;
    }
  </style>
  <script>
    window.addEventListener('load', function(){
      var s = document.createElement('script');
      s.src = 'cloudbase.js';
      s.onerror = function(){ console.warn('[SDK] uniCloud SDK 加载失败，录音墙不可用'); };
      document.head.appendChild(s);
    });
  </script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《阿米巴经营》全书共读计划<br>稻盛和夫 · 每天10分钟</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">
  <h1>📖 阿米巴经营</h1>
  <div class="formula">销售最大化，经费最小化 —— 人人都是经营者</div>
  <div class="dates" id="headerDates">稻盛和夫 · 全书共读计划（21天）</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 21</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">21</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall',this)">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 - 修复版 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="handleRecordClick()" title="点击开始/停止录音">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始朗读录音</div>
        <div class="record-duration" id="recordDuration"></div>
        <div class="record-upload-status" id="uploadStatus"></div>
      </div>
      <button class="record-action-btn" id="recordActionBtn" style="display:none" onclick="handleActionBtnClick()">重新录制</button>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- AUDIO WALL TAB -->
  <div class="tab-content" id="tab-audiowall">
    <div class="audio-wall-header">
      <h3>🎙️ 读书录音墙</h3>
      <p>聆听大家的读书声，共同成长进步</p>
    </div>
    <div class="audio-wall-list" id="audioWallList">
      <p style="color:#666;text-align:center;padding:30px;">⏳ 加载中...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== BOOK CONTENT =====
// 《六项精进》全书共读
// 共19天，每天约4000-5500字（10-15分钟阅读）
// 日期范围：2026-08-30 至 2026-09-17
const bookContent = {
      '2026-11-02': {
        chapter: '第1天：内容简介 · 前言 让企业生生不息的经营管理智慧 · 第一章 每个员工都是主角？阿米巴经营哲学宗旨正是如此',
        content: '<p><strong>阿米巴经营</strong></p><p><strong>内容简介</strong></p><p>阿米巴经营是通过一个个小集体的独立核算来实现全员参与经营，凝聚全体员工力量和智慧的经营管理系统。</p><p>阿米巴经营模式的诞生历程颇有戏剧性。阿米巴经营模式经过数十年发展，早已走出日本，走向全世界。国内外众多企业都借鉴阿米巴经营哲学来推动组织变革，以便更好地适应互联网时代的市场环境。</p><p>本书系统地讲述阿米巴经营模式的经营哲学、组织划分、配套措施、内部交易制度、会计核算制度、阿米巴长选拔制度、团队目标管理、多元化激励制度、经营误区等相关知识，旨在让更多有志于从事企业经营管理工作的朋友了解阿米巴经营的各方面知识。</p><p><strong>前言 让企业生生不息的经营管理智慧</strong></p><p>根据稻盛和夫给出的权威定义，阿米巴经营是通过一个个小集体的独立核算来实现全员参与经营、凝聚全体员工力量和智慧的经营管理系统。阿米巴经营模式的诞生历程颇有戏剧性。</p><p>1959年，年轻的陶瓷技术研究员稻盛和夫等7位志同道合的伙伴从松风工业辞职，合伙创办了京瓷公司。7人之间的深厚情谊让稻盛和夫相信经营企业最主要的是得人心。然而公司成立的第三年，他遭遇了一场严重的信任危机。</p><p>10名在京瓷工作了一年的员工集体要求稻盛和夫改善工作待遇，否则就辞职。当时的京瓷刚刚走上正轨，财力并不雄厚，稻盛和夫自己的工资也很有限，还要养家糊口。这场充满了火药味的谈判持续了三天三夜，最终稻盛和夫说服这些员工暂时留在公司。这段经历让他大为触动，于是他立志要让员工们真正把自己当成事业的伙伴。</p><p>由于京瓷不断推出各种市场上没有的新产品，公司规模迅速壮大。不到五年京瓷的员工就超过了100人，随后又增加到300人。但事业的快速扩张让身兼数职的稻盛和夫不堪重负，公司发展的瓶颈不期而遇。一旦不能妥善解决经营管理问题，好不容易发展起来的京瓷很可能会因管理不善而破产。</p><p>忧心忡忡的稻盛和夫突然想到：既然我一个人都能够管理100名员工，那为何不把公司分成若干个小集体呢？现在或许还没有中层人员能够管理100名员工，但是有些中层人员已经有能力管理20~30名员工的小集体，那何不让这些人担任小集体的领导，放权让他们管理呢？</p><p>顺着这个思路，稻盛和夫把公司划分成若干个能独立开展业务的最小组织，安排合适的人选做小组织的领导，让其采取独立核算管理。为此，他经过反复研究后推出了单位时间核算制度、内部交易制度等新式管理体制，并在此基础上发展出一套阿米巴经营哲学。</p><p>如今，阿米巴经营模式经过数十年发展，早已走出日本，走向全世界。国内外众多企业都借鉴阿米巴经营哲学来推动组织变革，以更好地适应互联网时代的市场环境。本书系统地讲述了阿米巴经营模式的经营哲学、组织划分、配套措施、内部交易制度、会计核算制度、阿米巴长选拔制度、团队目标管理、多元化激励制度、经营误区等相关知识，旨在让更多有志于从事企业经营管理工作的朋友了解阿米巴经营的各方面知识。</p><p>当然，由于水平有限、时间仓促等原因，书中难免会有疏漏之处，欢迎广大读者朋友批评指正。</p><p><strong>第一章 每个员工都是主角？阿米巴经营哲学宗旨正是如此</strong></p><p>中小公司一旦成长为大公司，就会遇到发展瓶颈。粗放的运营模式，混乱的财务管理，让规模日益增大的组织变得松松垮垮、极不稳定。因扩张过快而垮掉的公司不可胜数。阿米巴经营模式的诞生，正是为了解决这个管理难题。可是，如果不能接受“人人参与经营”的阿米巴经营哲学，公司是无法把阿米巴经营落到实处的。即使管理者完全照搬京瓷集团、日本航空公司等阿米巴先行者的体制，也不能真正令其发挥作用。在这一章，我们先来了解一下阿米巴经营的基础知识，改变传统的经营观念。</p><p><strong>克服大企业病，人人参与经营</strong></p><p>内容摘要</p><p>1.明确什么是大企业病。</p><p>2.弄清阿米巴经营为什么能解决大企业病。</p><p>3.了解“人人参与经营”的阿米巴经营哲学。</p><p>把公司做大做强是每一位管理者的理想。但公司发展就像蛇蜕皮一样，不突破原有的瓶颈就无法成长。阿米巴运营创始人稻盛和夫说：“社会上流传一句话，‘中小企业就像脓包，一大就破’。就是说，中小企业做的是‘盖浇饭’式的笼统账。组织在这个过程中规模膨胀，管理跟不上，就会垮台。”中小企业一大就破的现象屡见不鲜。即使有幸成长为一家人才济济、产品优良、资金雄厚、品牌知名度高的大公司，也难逃盛极而</p><p>1.困扰无数公司的大企业病</p><p>当公司发展到一定规模后，管理水平会变得大不如前，信息传递不畅通、组织机构臃肿、权责混杂不清、业务流程复杂、决策效率低下、人浮于事、故步自封、团队凝聚力差、内部矛盾重重等问题层出不穷。这些弊病无疑会降低公司的生产效率与销售利润，像慢性病一样折磨人。故而管理学家将其称为“大企业病”。</p><p>公司一旦患上大企业病，对市场的应变能力就会越来越差，对市场潮流也会视而不见，优秀的人才难以施展抱负，要么混吃等死，要么跳槽他处。公司既留不住人才，又无法引入新鲜血液，只剩下放任自流和求变图存两个选择。前一条当然是死路，后一条也不一定是活路。但自从阿米巴经营出现后，公司克服大企业病的希望大大增加。因为这是一种对症下药的经营管理模式。</p><p>2.实现全员参与经营的三个要点</p><p>大企业病最主要的痼疾是机构臃肿和人浮于事。机构臃肿既增加了管理成本，又降低了工作效率，且积重难返。人浮于事让原本有能力和抱负的员工也渐渐熄灭了热情，不愿再付出汗水和智慧。阿米巴经营模式对此的解决之道是全员参与经营。</p><p>全员参与经营，把每个人的积极性调动起来，确实能解决机构臃肿和人浮于事两大痼疾。但是，想要真正实现全员参与经营的构想，还得注意以下三个问题。</p><p>(1)通过授权让员工参与经营</p><p>阿米巴经营革新了企业的组织结构，通过单位时间核算把企业分解成一个个阿米巴单位。每个阿米巴的领导人就像经营一家小公司、小商店一样自负盈亏。阿米巴的全体成员都像经营者一样思考问题，按照“销售额最大化，费用最小化”的原则努力工作，完成目标计划。</p><p>由此可知，阿米巴经营不仅把臃肿的机构进行了最大限度的简化，还把经营权下放到了基层组织。员工中不乏有想法的，但基本上没有足够的权限和资源来实现自己的构想。在阿米巴组织中，他们将得到充分的授权，担负起经营者的全部责任，有条件去按自己的想法经营公司。</p><p>(2)用企业家精神培养员工</p><p>实施阿米巴经营模式的公司会有意识地用企业家精神来培养员工。企业家精神一方面重视公司经营的高收益率，另一方面也力求让员工具备高成长性。员工的高成长性主要取决于其学习能力。公司的职责是为他们提供良好的成长环境和发展机遇，为全体员工提供施展抱负的舞台。</p><p>传统的公司管理模式很难让两个指标同时增长。公司要追求高收益率，就会要求员工精确地执行上级安排的工作，牺牲他们的自主思考。这无疑会对员工的成长造成一定的制约。阿米巴经营通过授权让员工自主安排工作，既锻炼了他们的经营能力，又可以实现高成长性和高收益性的全面提升。</p><p>(3)集中现场员工的智慧</p><p>稻盛和夫认为：“阿米巴经营是一个让每位员工与经营者想法一致，朝着共同目标前进的经营体系。单纯地由管理层来经营企业是远远不够的。为了企业的持续发展，必须让全体员工参与经营，形成强大的合力。这是阿米巴经营的真谛。”</p><p>处于工作现场的一线员工，是公司业务的主要承担者。他们处于最基层，没有什么权力。但现场员工对经营过程中的各种问题有着管理者所没有的敏感。若能把他们的智慧集中起来，管理者就可以及时发现公司存在的隐患，打开改进工作的新思路。而现场员工也可以借此锻炼自己的经营意识，逐渐成长为具有经营能力的阿米巴管理人才。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>全体员工积极参与经营，在各自的岗位上发挥各自的作用，那么，员工已经不再是单纯的劳动者，而是具备了经营者意识，与经营者共同工作的伙伴。这样的话，因为履行了自己的责任，他们就会品尝到工作的喜悦和成就感。彼此都怀着为公司做贡献的目标而工作，就能实际感受到人生的价值。</p></blockquote><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p><p><strong>阿米巴经营的三个目的</strong></p><p>内容摘要</p><p>1.实现全体员工共同参与企业经营。</p><p>2.培养具有经营意识的人才。</p><p>3.确立与市场挂钩的分部门核算制度。</p><p>把阿米巴经营等同于京瓷集团的管理制度和经营技巧，是一种片面的认识。模仿京瓷集团的组织形态，只是在照猫画虎。若能了解阿米巴经营的本质，就可以根据具体情况来灵活地创建符合自己公司需求的阿米巴组织。为此，企业领导人必须知道阿米巴经营的三个目标。通过弄清这三个目标，我们就可以准确地掌握阿米巴经营的本质。</p><p>1.实现全员参与的经营</p><p>通常而言，大部分员工都没有经营意识，既不关心销售额，也不关心自己所在部门的费用支出详情。销售部门的员工则因为销售额跟收入直接挂钩，具备较多的经营意识，但他们对其他部门的运营情况同样漠不关心。由于缺乏经营意识，员工不会产生减少浪费、节约费用的想法。只要自己部门能拿到更多的预算经费就行，其他的事情都只是按部就班地处理，懒得主动思考。</p><p>阿米巴经营追求全员参与公司经营，人人都要具备经营意识，贯彻“销售最大化，费用最小化”的原则。无论公司规模多大，都要划分成名为“阿米巴”的独立核算的小组织。每个阿米巴团队的员工都要像经营者一样思考和行动，在每个月制订详细的销售额与费用使用计划，并努力达成这个计划。各个阿米巴都要定期公布经营实绩。如果销售额没达标，所有成员就重点提升销售额。如果支出的费用超标，就集思广益设法降低费用。</p><p>这样一来，每个员工都成了经营活动的实际组织者。无论哪个部门、哪个层级的员工，都能为公司增加销售额或削减费用的目标做出明确的贡献。</p><p>2.培养具有经营意识的人才</p><p>当组织被细分成若干阿米巴时，公司会给每个阿米巴安排一个负责人——阿米巴长。他们负责处理一切跟阿米巴经营相关的工作。制订经营计划、采购材料、团队管理、绩效管理等都是阿米巴负责人的本职工作。要做好这些工作，就不能不具备经营意识和基本的会计知识。</p><p>让所有的阿米巴负责人都像财务人员那样精通经营会计技能是不切实际的。但阿米巴经营采用了一种叫作“单位时间核算”的制度，员工只要按照“单位时间核算表”的每一项填入统计数字，就能看到收入(销售额)和费用的情况，进而计算出每个小时产生的附加价值。</p><p>这是评估各个阿米巴的实际业绩的公平尺。阿米巴负责人的所有工作都是围绕提高本部门的单位时间核算数字展开的。通过这种经营管理方式，各个阿米巴组织能够锻炼出无数具有经营意识的人才。</p><p>3.确立与市场直接挂钩的分部门核算制度</p><p>各个独立核算的阿米巴必须具备对市场变化的快速反应能力，在不断调整业务的过程中实现“销售最大化，费用最小化”，努力提高单位时间核算数字。如果不具备快速反应能力的话，阿米巴组织就跟机构臃肿的大企业一样动作迟钝，会错过很多商机。再加上组织已经由大变小，抗风险能力也随之下降。</p><p>因此，阿米巴经营采取了与市场直接挂钩的分部门核算制度，以求提高各个小型组织团队的灵活性。这个机制是促成公司成长发展的关键。它形态灵活，在必要时能快速对组织进行分割、整合，或者设立新的阿米巴部门。分部门核算制度把每个阿米巴变成了一个独立核算的利润中心，在提高企业组织灵活性的同时，</p><p>总之，我们应该把阿米巴经营的三个目标铭刻于心，在建设阿米巴组织和培养阿米巴运营人才的时候贯彻这些目标。唯有如此，全体员工才能充分理解和实践阿米巴经营哲学，不至于误入歧途。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>每个阿米巴都有一个领导者，他一边集结所有成员的智慧，一边像经营者一样成为阿米巴的掌舵手，运用“销售最大化，费用最小化”这句箴言来率领成员共同完成阿米巴的经营目标。这就是阿米巴经营所要实现的全员参与经营的理想状态。</p></blockquote><p style="text-align:right;"><em>——京瓷沟通系统有限公司管理咨询(KCMC)会长森田直行</em></p>'
    },
      '2026-11-03': {
        chapter: '第2天：实力主义VS绩效主义 · 经营哲学：六项精进与经营十二条 · 延伸阅读：日本航空公司再生重建计划',
        content: '<p><strong>实力主义VS绩效主义</strong></p><p>内容摘要</p><p>1.阿米巴经营倡导的实力主义价值观。</p><p>2.绩效主义管理思想存在哪些不足之处？</p><p>3.阿米巴经营如何在人事制度上贯彻实力主义价值观？</p><p>阿米巴经营是尊重每一个人劳动的“尊重人性的经营”。但每个员工的能力有高低之分，对公司的贡献有大小之别。组织的运行离不开优秀的管理干部。用人方针若是不合理，再完美的制度也会变得千疮百孔。一般情况下，公司高层要么任人唯亲，要么论资排辈，要么根据绩效考核结果来提拔干部。显然，绩效主义用人方针比前两种更公平合理。但在阿米巴经营的源头一-日本京瓷集团，绩效主义却是一个反思的对象，实力主义被认为是最有效的用人之道。</p><p>1.稻盛和夫的实力主义方针</p><p>无论那个人的年龄和经历如何，只要有真才实学，就要大胆将他们提拔到负责人的岗位上，让他们领导组织走向繁荣。这就是稻盛和夫在京瓷集团推行的实力主义方针。在他看来，德才兼备且充满干劲的人是推动阿米巴经营的重要力量。即使他们年纪轻轻，缺乏做管理人员的经验，也可以被任命为阿米巴领导人。这样才能人尽其用，给英才施展抱负的空间，为其他员工树立一个榜样。</p><p>京瓷的实力主义在当时讲究资历的日本商界是个异端。稻盛和夫在经营的过程中发现，随着公司业务范围的扩大，有很多新领域亟待开拓。公司原有的管理团队结构已经显现出短板，必须从外部引进具备各种经验、技术和知识的人才，同时还要从现场员工中培养未来的阿米巴领导人。</p><p>有一次，稻盛和夫打算引进一个人才，又担心创业伙伴们会反对，于是跟大家进行了坦诚的沟通。他宣布自己打算把这个公司急需的人才置于跟创业元老们同等的地位。所幸，稻盛和夫的伙伴们也是信奉实力主义的有远见卓识的人，痛快地允诺：“我们不介意让他来当我们的上司。”事实证明，这个用人决策对公司的确有利。</p><p>长期以来，京瓷不拘一格地吸收了各种各样的人才，给予他们足够的自主经营权和优厚的待遇。实力主义方针已经铭刻在京瓷员工的内心。每个阿米巴员工都在实力主义的鼓舞下艰苦奋斗，争做德才兼备的栋梁。</p><p>2.绩效主义的弊端</p><p>也许有人会认为，绩效主义跟实力主义没什么区别。因为绩效考核可以清楚地衡量出员工业绩的大小，这本身就反映了每个人的真实能力。表面上看确实如此，但绩效主义和实力主义存在一个关键的差异——人情味。</p><p>绩效主义是一种缺乏人情味的用人方针。工作成果多的人能加薪升职，但只要工作成果有所下降，公司就会降低报酬，甚至解聘该员工。稻盛和夫尖锐地指出：“欧美国家大多实行绩效考核，按照绩效分配工资和奖金，这种做法确实有一定的刺激性，业绩越好收入越高。但有的人工作很努力，业绩却不好，工资低，导致不满。‘过去业绩好，所以报酬高，现在业绩不好，报酬减少也没关系’，能这么理性思考的人几乎不存在。”</p><p>绩效考核固然比较客观，短期内是有效的，但它很难让员工真正跟公司一条心。因为人的业绩不光取决于个人的努力，还得看历史进程、市场大环境。当公司处于瓶颈或低谷时，每个人的业绩都不会好到哪里去。此时需要大家同舟共济，共渡难关。没有足够的激励，员工的士气必然低落，团队凝聚力也会不断下降。可若是按照绩效主义的方针，没有业绩就不能给出相应的激励。毫无疑问，顺境中同心同德的员工在这种情况下很容易萌生去意。</p><p>阿米巴经营诞生于京瓷集团最艰难的时刻。稻盛和夫当时根本拿不出什么东西来满足员工的加薪要求。假如只采取单纯的绩效主义，队伍早就散了。阿米巴经营哲学提倡人人参与经营，每个员工都是共同创业的伙伴。实力主义既有重视客观劳动成果的一面，又有尊重劳动者、将心比心的一面。这使得京瓷的员工在最困难的时候依然选择相信同伴，共同迎接挑战。到了公司一帆风顺之时，团队的凝聚力就更加牢不可破了。</p><p>可米巴专家有话说</p><p>采用实力主义，有时也会碰到问题。把一个有才干、有威信的年轻人提拔为董事，有时会招致周围前辈们的妒忌和抵制：“那家伙比我还晚三年进公司，怎么先提他为董事？简直是乱弹琴!”希望我们京瓷的干部有这样的度量，不是按年功序列，自以为是地认为“这回该轮到我了!”而是要让有真才实学的人来引领公司的发展。</p><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p><p><strong>经营哲学：六项精进与经营十二条</strong></p><p>内容摘要</p><p>1.稻盛和夫的六项精进。</p><p>2.稻盛经营的十二条法则。</p><p>稻盛和夫的六项精进</p><p>1.付出不亚于任何人的努力</p><p>痴迷于工作，热衷于工作，并付出超乎常人的努力，这会给我们带来丰硕的成果。</p><p>2.要谦虚，不要骄傲</p><p>成功的人，是那些内心具备燃烧般的激情和斗志，并能做到谦虚内敛的人。即使成功了，也不能忘掉谦</p><p>3.要每天反省</p><p>“是否傲慢？”“有没有让别人感到不愉快？”“是否有卑怯的行为？”“是否有利己的言行？”回顾自己一天的言行，确认是否符合正确的做人原则。每天的反省可以抑制自己的邪恶之心，让良心更多地占据我们的心灵。</p><p>4.活着，就要感谢</p><p>人无法独自生存。我们能够生存下去，是因为有了身边所有环境因素的支撑。坦诚地对目前拥有的东西表示感谢，并将这种感谢之心用“谢谢”之类的话语或者笑容向周围的人们传递。这样做可以使自己和周围的人更加平和，更加幸福。</p><p>5.积善行、思利他</p><p>善，就是指待人亲切、正直、诚实、谦虚等，这也是做人应有的最基本的价值观。每天都思善行善，你的命运就会朝着好的方向转变。</p><p>6.不要有感性的烦恼</p><p>每个人都会失败。我们都是在不断失败的过程中成长起来的，只要深刻地反省了，之后就不能再为此烦恼，必须义无反顾地走向新的起点，开始新的生活，这是十分重要的。</p><p>稻盛经营十二条</p><p>第一条 明确事业的目的与意义</p><blockquote><p>确立正大光明、符合大义名分的崇高目的。</p></blockquote><p>第二条 设定具体目标</p><blockquote><p>所设目标始终与员工共有。</p></blockquote><p>第三条 胸中怀有强烈愿望</p><blockquote><p>要怀有能够渗透到潜意识之中的强烈而持久的愿望。</p></blockquote><p>第四条 付出不亚于任何人的努力</p><blockquote><p>一步一步、扎扎实实、坚持不懈地做好具体的工作。</p></blockquote><p>第五条 追求销售最大化和经费最小化</p><blockquote><p>利润无须强求，量入为出，利润必定随之而来。</p></blockquote><p>第六条 定价即经营</p><blockquote><p>定价是领导的职责。价格应定在顾客乐于接受，公司也能盈利的交汇点上。</p></blockquote><p>第七条 经营取决于坚强的意志</p><blockquote><p>经营需要洞穿岩石般的坚强意志。</p></blockquote><p>第八条 燃烧的斗志</p><blockquote><p>经营需要强烈的斗志，其程度不亚于任何格斗竞技。</p></blockquote><p>第九条 拿出勇气做事</p><blockquote><p>不能有卑怯的举止。</p></blockquote><p>第十条 不断从事创造性的工作</p><p>明天胜过今天，后天胜过明天，刻苦钻研，不断改进，精益求精。</p><blockquote><p>第十一条 以关怀坦诚之心待人</p></blockquote><blockquote><p>买卖是相互的，生意各方都要得利，皆大欢喜。</p></blockquote><p>第十二条 始终保持乐观向上的心态</p><blockquote><p>抱着梦想和希望，以坦诚之心处世。</p></blockquote><p><strong>阿米巴专家有话说</strong></p><blockquote><p>我认为，摆在制度和规则前面的问题，就是企业领导人必须具备应有的伦理道德，具备哲学。这种哲学用一句话来讲就是：“作为人，何谓正确？”因为如果缺乏正确的哲学，缺乏伦理道德这种内在的约束，那么不管外部的制度规则多么严密，这类制度规则仍然不能正常地发挥它们的功能。</p></blockquote><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p><p><strong>延伸阅读：日本航空公司再生重建计划</strong></p><p>日本航空公司曾因债台高筑而破产。稻盛和夫在2010年2月担任日航的董事长，与同样出身京瓷集团的阿米巴经营专家森田直行、大田嘉任等人一起对日航进行了大幅度的改革。经过反复调研，他们发现日航的管理者和员工虽然工作努力，但毫无成本核算意识。日航在多个环节上存在严重的浪费。其实，在他们来日航之前，日本的企业再生支援机构已经制订了日航再生重建计划。该计划的主要内容如下：</p><p>(1)减少飞机机种的数量</p><p>让包括747-400、A300-600、MD-81、MD-90等型号在内的103架飞机退役。把日航拥有的飞机机种的数量从7种减少到4种。</p><p>(2)合理引进机型</p><p>更多地引进效率比较高的小机型737-800飞机，并在国际航线上引进战略机型787。</p><p>(3)优化航线网</p><p>日本国内航线保持一定的规模。国际航线以欧美和亚洲航线为中心。在休闲航线中强化檀香山航线和关岛航线。</p><p>(4)把经营资源集中到航空运输事业</p><p>把日航的经营资源集中到航空运输事业，卖掉经营周边事业领域的子公司。在货物运输事业领域，停飞货物专用机，综合利用客运机的货仓。</p><p>(5)打造较为灵活的组织和经营管理体制</p><p>裁撤日航内部的重复组织和重复机能，设置对航线收支的新部门(即航线统括本部)，实现航线、部门的损益责任明确化。</p><p>(6)机场成本结构改革(大幅度缩减机场体制)</p><p>缩小办公场所的使用面积，减少经费的浪费。积极与其他航空公司合作，共同负担业务经费，削减仓库数量，降低租赁成本费用。</p><p>(7)设施改革</p><p>降低公司房地产租赁租金，重新核算使用面积。</p><p>(8)精减人员</p><p>通过提前退休、出售子公司等措施来精简日航集团员工总人数。日航集团在平成21年(即2009年)年末共有员工48714人，到2010年年末已减少至32600人。</p><p>9)调整人事工资福利制度</p><p>以法定或市场一般工资水准为基础，把日航集团的工资水平和福利水平调整至行业必要水平，并对制度实行根本的改革。</p><p>(10)削减燃油税、机场税等费用</p><p>迄今为止，由于日航支付的国内外飞机燃油税、机场着陆费等费用已经超过了平均水平的10%，因此对相关企业和机构提出降低标准的要求。</p><p>(11)压缩各种成本</p><p>把各个部门的采购部门统一到日航总公司里，设置“采购本部”，实现采购一元化，改变项目经费票据管理混乱等现象。凡是超过30万日元的采购活动，必须由采购本部来审核及执行。</p><p>不难发现，日航再生重建计划的工作重心是削减经费。稻盛和夫等人认为这个计划对挽救日航是有用的，于是把落实这个计划作为第一年的主要目标。日航集团在设置采购本部的第一年居然减少了800亿日元的经费开支。再生重建计划实施的第二年，阿米巴经营正式导入日航，“年度计划”也被改为“Master Plan”，稻盛和夫等人对整个集团的组织结构进行了大刀阔斧的改革。日航很快摆脱了亏损的局面，重新开始盈利。</p>'
    },
      '2026-11-04': {
        chapter: '第3天：第二章 组织划分越小越好？打造阿米巴体系没那么简单粗暴 · 推行阿米巴运营的路线规划图',
        content: '<p><strong>第二章 组织划分越小越好？打造阿米巴体系没那么简单粗暴</strong></p><p>阿米巴经营的原理是把大型企业组织划分为能独立经营的小集团——阿米巴。然而，有些企业在细分阿米巴之后并没有提高运营效率，反而陷入了管理混乱。造成这种局面的根本原因，就是胡乱划分阿米巴组织，没有正确理解阿米巴运营的精神。按照什么样的标准来细分组织？怎样确保各个阿米巴具备独立生存的能力？这些都是企业管理者必须认真考虑的问题。我们应该明白一件事，阿米巴组织并非划分得越细越好。更重要的是，通过重新划分组织来优化公司的整体组织结构，赋予每个阿米巴组织足够的活力。本章讲述的正是构建阿米巴组织的一般步骤。</p><p><strong>推行阿米巴运营的路线规划图</strong></p><p>内容摘要</p><p>1.推行阿米巴运营的十个基本步骤。</p><p>2.必须耐心地对各部门管理者进行稻盛和夫经营哲学培训。</p><p>3.保持阿米巴运营的良性循环。</p><p>在企业内部推广阿米巴不可能一蹴而就。世界上有无数公司想借鉴阿米巴经营模式，但有的成功提高了运营管理效率，有的却变得不伦不类。每个企业的具体情况不同，只是简单照搬京瓷、日航等公司的阿米巴组织形态，无异于邯郸学步。实践表明，落实阿米巴运营需要讲究方式方法，要按照以下十个基本步骤层层推进，绝不可胡乱作为。</p><p>步骤1：企业内部调研及诊断</p><p>我们必须牢记一点，阿米巴经营是量体裁衣，而不是削足适履。先把公司的基本情况统统盘点一遍，特别是诊断当前运营过程中存在的问题。分清自己的优势和劣势，找出应该保留的部门和资源，以及那些不改革就没有出路的部门。</p><p>公司领导人在调研开始前应该召集中高层管理人员开会，对本次企业内部调研的目标和意义进行说明。这是推行阿米巴经营的必要沟通。因为阿米巴经营的核心理念是人人参与经营。如果员工对领导人的想法和公司的规划毫不知情，就无法以主人翁的心态来经营公司。开会沟通之后，公司有必要选派精干人员组成企业内部调研及诊断小组，全权负责落实这个步骤的工作。</p><p>步骤2：引入阿米巴经营哲学</p><p>阿米巴经营的创始人稻盛和夫先生无论在哪里推行阿米巴，都是先从经营哲学讲起。他受邀整顿日本航空公司时，第一步是调查诊断公司存在的问题，第二步是给集团的董事和中高层管理者做关于经营哲学的讲座。</p><p>起初日航的管理者们大多对此不以为然，甚至有人公开表达不满。稻盛和夫不为所动，依然严格执行，力求把管理者脑中的官僚主义习气和门户之见剔除干净。事实证明，只有真心接受阿米巴经营哲学的人，才能把阿米巴管理好。</p><p>公司可以先成立一个阿米巴经营推行小组，最高领导人任组长，各部门主管以及外聘的阿米巴咨询顾问任小组成员。各级领导要配合顾问老师在公司各部门组织培训课程。培训方式不局限于常规的课堂讲座，也可以随时随地在办公现场进行探讨。务必要让公司上下每一个人都了解什么是阿米巴经营哲学，转变原先的思想，树立全员参与经营的意识。</p><p>步骤3：找准公司的发展战略定位</p><p>现代市场变幻莫测，新技术层出不穷，各国的政策也多有大幅度调整。公司原有的发展方针是否还符合未来的市场形势，是每一位有责任心的经营者都必须认真考虑的问题。在这个背景下，企业战略定位的重要性日益增加。阿米巴经营的诞生原本就是为了更好地适应复杂的市场环境，提高公司的生存能力。为此，公司不得不先找准自己的发展战略方向。</p><p>需要注意的是，我们不能只看公司眼下的利益，而应该着眼于公司未来的发展，把握市场潮流中的新趋势。制订明确的企业发展战略规划，才能让全体员工认清自己的使命和努力方向。如果公司高层都不知道今后该怎么做，细分后的各个阿米巴组织必定会陷入同样的迷茫。</p><p>步骤4：调整组织结构</p><p>全体员工对阿米巴经营哲学已经有了比较完整的认识，也明确了公司未来的发展战略规划。此时的首要工作就是重新调整公司的组织结构。公司当前的组织结构，可能按照区域市场划分，也可能按照基本职能划分，还可能按照经营内容划分。总之，没法直接跟阿米巴经营对接。</p><p>不改革组织结构就强行推广阿米巴经营，只会导致水土不服。而且现有的组织结构已经天然形成了不同的利益群体。有的群体在现有体制中占据的资源多，拥有的权限大，未必支持改革。这就需要阿米巴经营推行小组通过调整组织结构来打破旧的利益格局，让更多人在改革过程中受益。从这个意义上说，调整组织结构的落脚点在于排除推广阿米巴经营的阻力。</p><p>步骤5：划分阿米巴</p><p>在阿米巴经营中，每个阿米巴都是独立的利润中心，要单独进行核算。每个阿米巴的规模要精干，保持足够的灵活性和独立的运营管理能力。划分阿米巴组织需要满足三个条件，不能胡乱划分。需要注意的是，划分阿米巴不能只在单个部门推行，而应该在所有的部门推行阿米巴经营。</p><p>划分阿米巴的一个关键任务是培养阿米巴长，即每个阿米巴的领导人。划分好的阿米巴并不会自动产生效益，还得靠阿米巴长来领导组员一起经营。每个组员都是经营者，不再只是被动执行命令，必须主动参与阿米巴的经营管理。</p><p>步骤6：完成内部定价</p><p>稻盛和夫曾经说：“定价才是阿米巴经营的根本。”他认为，阿米巴领导人在为产品或服务定价时，要设法制定出令客户能爽快接受的最高价格。当公司划分成多个阿米巴后，内部定价就成为一个至关重要的问题。</p><p>假设公司根据业务类型划分出十个大阿米巴组织，大阿米巴组织内部又细分为若干小阿米巴组织，每个需要独立核算的阿米巴组织都会估算出一个对自己有利的价位。价格定得越高，阿米巴组织销售额越高，单位时间附加价值也越高，但与之合作的其他阿米巴组织的利益势必会受到影响。因此，我们在进行内部定价时，必须注意保持各阿米巴组织之间的利益平衡，否则有些阿米巴组织就会难以维持运营。</p><p>步骤7：构建内部交易制度</p><p>阿米巴经营把市场交易机制引入到企业内部，每一道工序都构成一个阿米巴，各阿米巴之间也形成了供应商和客户的关系。这个制度是为了确保每个阿米巴都能做大做强。在传统的企业经营体系中，有直接产生利润的部门，有不直接产生利润的部门，后者对公司的贡献被大大低估，难以分享公司发展带来的收益。这显然是一种不公平的利益分配机制，会造成公司各部门之间的利益冲突，破坏组织凝聚力。</p><p>稻盛和夫当年意识到这个问题后，设计出内部交易制度来消除部门之间的利害对立，让那些不直接产生利润的部门也能分享公司发展的红利。</p><p>步骤8：完成单位时间核算任务</p><p>各个阿米巴完成了内部交易后，要对自己的单位时间附加价值进行核算。而负责对所有阿米巴提供支援的经营管理部门必须在下个月之前整理好各阿米巴上交的《单位时间核算表》。</p><p>完成单位时间核算任务是阿米巴经营的核心环节。这是一种以现金为基础的经营核算方法，能有效揭示公司当前的运营状态，为各级阿米巴领导人提供决策依据。常规的财务会计可能在报表上显示公司是盈利的，但公司可能缺乏大量现金，所得利润都变成了库存和应收账款。</p><p>对于阿米巴经营来说，这样的财会数据容易误导管理者做出错误的判断，所以要采取单位时间核算的办法实实在在地算出每个单位时间里赚了多少钱、支出了多少费用，贯彻“营业额最大化，费用最小化”原则。</p><p>步骤9：反馈结果和激励</p><p>经过前8个步骤，各个阿米巴都已经完成了目标任务。公司要召开月度结果反馈及评估，考察阿米巴团队及其领导人的表现状况，共同找出公司运营过程中存在的问题，对表现优异者及时奖励，对表现不佳者进行鞭策。此外，还要制下个月的工作计划，确保阿米巴经营的良好运转。</p><p>阿米巴的激励方针是精神激励和物质激励并重，科学衡量员工创造的价值，让员工心怀成就感和主人翁意识。阿米巴经营倡导“人人都是主角”的精神，管理者在采取激励措施时，应该以此为指导思想。</p><p>步骤10:PDCA循环</p><p>PDCA循环指的是计划(Plan)、执行(Do)、检查(Check)和调整(Action)。这是一套科学的管理程序。按照PDCA的流程来管理运营公司，可以有效地降低决策的盲目性，减少工作中的失误。通过不断地检查和调整来确保战略目标和发展规划被认真落实。这个步骤标志着阿米巴经营进入了新一轮循环，回归最初的步骤1。</p><p>在这个阶段中，我们要仔细检查阿米巴经营的推广情况，评估效果，反思流程，认真记录各个阿米巴遇到的困难，然后以集体智慧逐个解决存在的问题。唯有如此，阿米巴经营才能克服各种阻碍，在公司中真正扎根。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>在实施阿米巴经营时，“建立什么样的组织”是成败的关键。在你的公司里，引进了阿米巴经营中的核算管理模式，组织主要分国内和海外两块，各个店铺独立核算，店长对店内的核算负全部责任，店长就是事业部长。总部只需要决定大原则，维护好这些原则，其他就交给店长去做。然后，每个月都要依据计划追究实绩。重视追究这个环节，才是有效的阿米巴经营。</p></blockquote><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p>'
    },
      '2026-11-05': {
        chapter: '第4天：明确企业的四项职能和责任 · 不遵循组织细分三原则，阿米巴无法生存',
        content: '<p><strong>明确企业的四项职能和责任</strong></p><p>内容摘要</p><p>1.企业运营离不开销售、制造(服务)、研发(策划)、管理四项必备职能。</p><p>2.检查各部门是否存在职责划分不明确的情况。</p><p>3.检查企业在经营活动中是否缺失了某项必备职能。</p><p>构建组织是企业经营的基础。企业组织形态有千万种，但是基本的职能和责任是殊途同归的。阿米巴经营要求管理者对原有的组织体制进行大幅度的改造，但无论怎么改革，都不能破坏企业的四项职能和责任。否则的话，被分解后的企业组织就完全丧失了运营能力。我们在设计阿米巴组织划分方案时，不可不明确这点。</p><p>1.企业的四项职能和责任</p><p>企业运营离不开销售、制造(服务)、研发(策划)、管理四项必备职能。在划分组织之前，我们先来具体看看这些职能对应的部门。</p><p>由上表可知，销售、制造、研发三类职能部门更容易细分为小阿米巴单位。承担管理职能的部门则不适合细分，反而应该集中更多总揽大局的权限。若是不分青红皂白地把所有的职能部门都细分掉，结果很可能是各个阿米巴因为公司缺失了某种必备职能而无力存活。为此，我们应当牢记一条经验：先确定职能，然后再根据职能来构建组织。万万不可出现销售部门承担制造部门职能，或者缺失职能之类的错误。</p><p>2.区分核算部门与非核算部门</p><p>在上述四个企业必备职能的基础上，我们要仔细判断各个部门究竟属于“核算部门”还是“非核算部了”。这是阿米巴经营特有的概念。核算部门指的是在公司经营中能赚取收入，对利润负责的部门。非核算部门是指支援核算部门顺利开展业务的部门。区分两类部门对构建科学合理的阿米巴组织结构至关重要。</p><p>(1)制造部门和销售部门是核算部门</p><p>按照制造业的标准成本计算习惯，制造部门不对利润负责，通常被定义为管理成本费用的中心。至于销售部门，虽然无法控制成本费用，但对销售额和毛利负责。但在阿米巴经营中，制造部门被视为利润中心。具体思路是把制造部门作为管理收入和费用的独立核算部门，而销售部门同样被视为管理收入和相应费用的独立核算部门。这两个部门有着最多的员工，将其作为独立核算部门(阿米巴)有利于提高员工的核算意识。</p><p>(2)管理部门属于非核算部门</p><p>管理部门的职责主要是支援其他部门和员工来完成公司的工作，促进员工的发展，同时还要维护公司规章制度的政策运行。可以说，管理部门在阿米巴经营中扮演的角色变化最小。管理部门若是归入核算部门，就只能通过管理服务有偿化的形式来核算利润。问题是，其他部门肯定不愿为此增加开支。因此，管理部门应当属于非核算部门。</p><p>需要注意的是，即使是非核算部门，也要追求费用最小化。这意味着管理部门也要细分费用科目，每个月确认有无多余的费用支出，以较低的成本为其他核算部门提供高质量的服务。</p><p>(3)研发部门在特定情况下可以视为核算部门</p><p>研发部门负责产品设计开发和基础技术研究，一般是不算作核算部门的。但是，如果公司让研发部门有权从自己开发的产品的销售额或生产量中获取一定比例的收入，就可以把研发部门定位为核算部门。这要求研发部门具有很强的市场意识。</p><p>此外，研发部门的一个重要特征是工作成果难以跟短期效益直接挂钩。研发部门需要长期投入，不像销售部门那样能迅速产生效益。这点也是管理者在设计阿米巴组织框架时需要注意的。当然，即便把研发部门定位为非核算部门，研发人员也要具备核算意识，争取用更少的经费办更多的事。</p><p><strong>阿米巴运营冷知识</strong></p><blockquote><p>京瓷顾问伊藤谦介曾在担任社长时向公司提议设立“物流事业部”。传统的产品运送工作都是由各工厂的经营管理部委托运输公司来做的。伊藤谦介认为，既然外部市场中存在运输行业，何不把公司内部的送货业务集中起来，由一个独立的事业部来运营？物流事业部的成立，不仅提升了自身收益，还大幅度节省了公司的运输费用，把各个工厂在运输管理环节的损失和浪费降到了最低。</p></blockquote><p><strong>不遵循组织细分三原则，阿米巴无法生存</strong></p><p>内容摘要</p><p>1.阿米巴组织必须是一个能够独立核算的单位。</p><p>2.阿米巴组织必须是一个能够独立完成某一种业务的单位。</p><p>3.细分后的组织不能阻碍公司经营方针和发展目标的贯彻执行。</p><p>把组织细分为5~10人的小阿米巴是阿米巴经营的一项基础工作。如果不细分组织，部门团队就会编制臃肿、信息传递慢、沟通效率低、决策应变能力差。这样的阿米巴不会产生活力。此外，在大型组织中，难以准确衡量每个人的贡献率，容易出现滥竽充数的情况。细分阿米巴组织就是为了让浪费和节约一目了然，减少公司里人浮于事的现象。</p><p>但是，我们绝不能机械地按照5~10人的规模强行拆分组织。否则很可能会让相关部门无法继续履行自己的职能，整个公司随之运转失灵。为此，领导者必须按照一定的原则来划分组织，让阿米巴经营真正发挥作用。</p><p>1.阿米巴组织细分三原则</p><p>阿米巴组织细分三原则是稻盛和夫提出来的。他的目的是确保细分后的小阿米巴能够生存下去并完成使命。细分三原则的内容具体如下：</p><p>(1)能够成为独立的核算单位</p><p>拆分阿米巴是为了准确评估员工的贡献率。经过细分后的阿米巴应该具备独立核算能力，能够清楚地算出收入，并了解获得该收入所需的费用支出。如果不能充分掌握自己的收入和费用支出，阿米巴领导人就无法运营好任何规模的组织。</p><p>所以，我们在细分组织的时候，重点是看收入和费用支出能否按照一定的规则来区分。假如一项收入必须由几个团队配合才能完成，就不能按照团队来细分阿米巴，而要将其划分在同一个阿米巴里。如果费用支出是几个班组共同产生的，就不能按照班组来细分阿米巴。阿米巴必须是最小的独立核算单位，当收入和费用支出无法进一步细分时，就算该组织的人数超过了10个，也应该算作一个阿米巴。</p><p>(2)能够独立完成一项业务</p><p>阿米巴是作为一个独立的业务单位存在的。它的规模无论有多小，都不能影响其独立完成一项任务的能力。组织划分过细，各个小团队的功能不全，反而会降低工作效率，产生不必要的浪费。此外，如果组织划分过细，阿米巴之间的合作和交流在操作流程上就会变得过于烦琐复杂。</p><p>因此，阿米巴的划分要以有利于阿米巴领导人及其成员通过创新来改进工作。全体阿米巴成员充分参与到经营当中，以精干灵巧的团队来完成独立业务。公司需要借助一个个高效的独立业务来开拓多个领域的市场。那种按部就班的团队，在阿米巴经营中毫无价值。</p><p>(3)有利于贯彻公司整体的目标方针</p><p>推广阿米巴经营是为了改变大企业中各部门的官僚主义风气，发动所有的员工来参与公司运营，更好地贯彻公司整体的目标方针。假如细分后的组织变成了新的“山头”，只顾自家利益而不考虑公司的整体发展，就违背了推广阿米巴经营的初衷。</p><p>所以，不要把那些可能会阻碍公司方针执行的组织划分为阿米巴。那样必定会破坏公司组织内部的协调，让其他阿米巴的正常运作受到影响，无法完成公司分配给他们的业务。遇到这种情况时，我们应该以别的依据来重新划分阿米巴，确保细分后的精干组织能推动公司的整体发展，而不是变成和官僚主义臃肿部门一样的绊脚石。</p><p>2.划分阿米巴组织的四个依据</p><p>在明确了阿米巴组织细分的三原则后，我们可以根据以下四个依据来划分组织：</p><p>(1)根据当前的组织结构进行重组</p><p>这是最常见的组织划分方法。根据当前的组织结构来重新划分阿米巴的优点是权、责、利比较明确，组织调整幅度相对较小，能把改革带来的阵痛降至最低。员工大致上还是在原先的部门团队中做事，但自主权比以前大了很多，形成了一个独立核算的利润中心。此外，由各个事业部门转化而成的阿米巴，能得到新成立的经营管理部门和其他事业部门的支援，更好地开拓现有事业。</p><p>(2)根据公司发展战略进行重组</p><p>公司明确了自己的市场定位和战略目标后，可以围绕战略规划来打造阿米巴组织。撤销不适合市场的部门，将其人力资源合并到适合市场需要的部门当中。按照发展战略划分的阿米巴，要密切围绕市场定位开发产品和业务，将注意力聚焦在战略目标上，在产品研发、宣传推广、社群营销、增值客服、品牌文化建设等环节坚持专业化、体系化发展。</p><p>(3)根据公司价值链来划分</p><p>这种划分思路等于是重塑公司的各项运营流程。通过分析内部价值链找出对公司影响最大的主要价值活动，并确定影响价值活动的各种成本要素。分析外部价值链，看清公司在产业价值链中所处的地位。通过划分阿米巴来向产业链的上下游渗透，优化内部价值链，打通外部价值链。</p><p>(4)根据现有的人才资源来划分</p><p>阿米巴经营要求每个员工都具备经营意识。公司现有的人才资源中有多少人具备担任阿米巴领导人的综合素质，是管理者在划分组织之前必须认真调查的内容。假如让无法胜任的人做了阿米巴领导人，就会破坏运营效果，让其他员工对阿米巴经营丧失信心。如果内部人才不够用的话，公司应该以科学合理的标准来招聘外部人才。同时还可以加强员工培训，找出普通员工中的潜力股。</p><p><strong>阿米巴运营冷知识</strong></p><blockquote><p>稻盛和夫提出阿米巴经营的设想后，最把在对京瓷收支影响最大的制造部门作为试点。先弄清生产电子工业专用的精密陶瓷零件的全部工序，梳理各道工序的收支核算情况，再按照工序A、B、C把制造部门细分为三个阿米巴。随着公司的发展，京瓷又先后按照产品品种、工厂来划分制造部门的阿米巴组织。销售部门则根据地区、品种、客户来细分组织。研发部门与管理部门也根据各自情况进行细分。如今京瓷的阿米巴数量已经超过了3000个。</p></blockquote>'
    },
      '2026-11-06': {
        chapter: '第5天：阿米巴组织的五个维度与四种形态',
        content: '<p><strong>阿米巴组织的五个维度与四种形态</strong></p><p>内容摘要</p><p>1.什么是阿米巴组织的五个维度？</p><p>2.什么是阿米巴组织的四种形态？</p><p>阿米巴经营不像传统的企业管理那样依赖等级森严的行政层级，而是具有极大的灵活性。每个阿米巴都像企业一样自主经营，如果它发展壮大到了一个新的层次，就应该从中分裂出新的阿米巴。而那些发展欠佳的阿米巴，则可以合并到其他功能相似的阿米巴当中，减少资源浪费。为了更好地拆分或合并阿米巴，企业管理者应当了解阿米巴组织的五个维度和四种形态。</p><p>1.阿米巴组织的五个维度</p><p>阿米巴组织的维度指的是其核心功能定位，主要包括产品、客户、区域市场、品牌、行政职能五个维度。如果不能准确把握阿米巴组织的维度，企业在划分阿米巴时就容易出现错误的排列组合。接下来，我们逐个讲解一下每个维度的阿米巴组织各有什么特点。</p><p>(1)以产品为维度的阿米巴组织</p><p>从公司生产的产品出发，把与该产品有关的一切活动全部置于同一个阿米巴组织内，然后再在阿米巴组织内部细分职能部门。这就是以产品为维度的阿米巴组织。换言之，公司的每一条产品线都可以被改造成个独立的阿米巴组织，形成一个独立的利润中心，专门负责该产品的研发、生产、营销等工作。</p><p>以产品为维度的阿米巴组织可以集中专业技术的力量，对每一种产品进行深入开发，职能活动比较容易协调，避免生产与销售的脱节，提高生产效率和经营效率。公司也可以通过设置多条阿米巴产品线来推动业务多元化发展。</p><p>不过，这种类型的阿米巴组织需要具有全面管理能力的人才担任领导者，否则很难串联起各种职能。如果公司的产品类型多达百种，每一种都改造成阿米巴，就会增加公司的管理难度。各阿米巴组织之间可能会因为市场重叠而激化矛盾，导致管理成本增加。</p><p>(2)以客户为维度的阿米巴组织</p><p>以客户为维度的阿米巴组织是从销售工作的角度来设置的。公司筛选出最有价值的重要客户后，专门设置一个阿米巴组织与该客户对接，提供其需要的产品和服务。阿米巴领导人成为公司的全权代表，调动各种资源为客户服务，巩固公司与客户的合作关系。阿米巴组织的工作流程往往也呈现出以客户为中心的特征。</p><p>这种阿米巴组织的出现是因为不同类型的客户群体有不一样的需求。单一的产品和服务不能满足市场需求，不利于开展客户关系管理工作。为此，公司有必要细分业务类型，分出个人客户、公司客户、机构客户等群体，再让各个阿米巴组织与各类客户群体建立一一对应的关系，最终实现个性化的精准营销，最大限度地提高客户满意度。</p><p>(3)以区域市场为维度的阿米巴组织</p><p>对于跨国公司而言，根据区域市场来设置阿米巴组织是一种务实的做法。地理上的分散会降低公司总部的经营效率，如果改用自主性极强的阿米巴经营模式，就能有效集中该区域的所有业务工作。</p><p>不同于传统的分公司模式，以区域市场为维度的阿米巴组织主要负责研发、生产、物流和销售工作，采购、财务、人力资源管理等工作则是由公司总部的经营管理部门负责。由经营管理部门为各区域的阿米巴提供专业的支援。</p><p>这种阿米巴组织的优点是把每个区域改造成一个利润中心，阿米巴领导人有足够的权限来灵活处理区域市场的特殊需求，各区域内部的公司资源能得到有效整合，阿米巴组织对环境的应变能力较好，成本费用也能得到较好的控制。</p><p>不过，随着区域阿米巴组织的增加，公司越来越需要能独当一面的大将之才。由于地理和时间的限制，公司总部很难有效监管区域阿米巴组织每天的运营状况。</p><p>(4)以品牌为维度的阿米巴组织</p><p>有些知名企业旗下拥有多个子品牌，每个子品牌对应了一个具体的细分市场。为了更好地开发这些细分市场，公司可以按照品牌来设置阿米巴组织，确保每个子品牌都有一个独立的利润中心来精耕细作。</p><p>如果完全由公司总部来运营所有的品牌，可能会出现厚此薄彼、顾此失彼的现象。影响力大的品牌总是能得到更多资源，而新开发的品牌影响力小，很难得到足够的资源来发展。以品牌为维度的阿米巴组织可以减少这种不平衡现象，有助于公司旗下各品牌百花齐放。</p><p>(5)以行政职能为维度的阿米巴组织</p><p>公司设立行政管理部的最初目的是想把跟研发、生产、销售等主营业务相关的事务性工作分离出来，让管理者能集中精力经营主营业务。但是传统的行政管理部门在经营者眼中更像是一个干杂活的部门，没有真正成为专业的业务支援机构。</p><p>以行政职能为维度的阿米巴组织把市场营销、人力资源管理、客户服务、售后服务等专业机构的行政职能进一步分离出来，并按照专业分工来重新划分职能。对于产品种类差异较小、产品开发周期和生命周期较长的企业来说，这种阿米巴组织有利于避免重复设置相同的职能，可以促进专业职能的有序发展，削减由于机构重叠而造成的多余经费开支。</p><p>这种阿米巴组织已经超越了传统的行政管理部门，职能不局限于高效处理公司日常事务，对公司的经营战略、企业文化建设等重要问题也将做出重要贡献，成为公司总部的臂膀和智囊。</p><p>阿米巴组织的四种形态</p><p>有些人以为划分后的阿米巴组织只有一种形态，区别只在于功能有差异。这个看法是片面的。阿米巴组织实际上包括资本型阿米巴、利润型阿米巴、成本型阿米巴、预算型阿米巴四种形态，而这些不同的形态也对应了不同的管理层次。那些规模较大、产品种类繁多、市场多元化的企业，往往是多种阿米巴形态并存的。接下来，我们逐个讲解一下每种形态的阿米巴组织有什么特点。</p><p>(1)资本型阿米巴</p><p>资本型阿米巴是最高层次的阿米巴，在组织中拥有最大的决策权，但同时需要承担最重的责任。因为资本型阿米巴不仅对成本、收入、利润负责，还具有运营资本和实物资产的权力，故而对投资效果也负有责任。通常而言，资本型阿米巴会跟资本结构(股权)关联起来。</p><p>每一个阿米巴都是利润中心。作为资本中心的资本型阿米巴必然是利润中心。但利润中心并不都是资本中心。因为利润中心没有投资决策权，而资本型阿米巴有。资本型阿米巴在考核绩效时要评估其所占用的资产，但利润中心不需要。</p><p>(2)利润型阿米巴</p><p>利润型阿米巴指的是对成本、收入和利润负责的阿米巴组织，拥有相对独立的收入途径和生产经营决策权。利润型阿米巴下面可以设置数量不等的成本中心或者小的利润中心。随着公司规模的不断扩大，利润型阿米巴也会不断分裂出新的利润中心。</p><p>设置这种阿米巴组织可以激发出经营者的主观能动性，促进公司提高目标管理和预算管理的效率，更好地实现公司的战略发展规划。利润型阿米巴的考核指标是利润和成本，按照“销售额最大化，费用最小化”原则来运营。</p><p>(3)成本型阿米巴</p><p>成本型阿米巴是负责合理控制费用并承担成本考核职能的阿米巴组织，其主要职责是协助利润型阿米巴的营销活动。在阿米巴组织中，每个部门都会跟若干成本中心对接。我们可以把交易过程中产生的不同费用纳入不同的成本中心，以便核算出一个区域市场、一条产品线、一个项目团队的成本。这种阿米巴组织的应用范围最广。凡是有成本费用产生的地方，公司都可以设置成本型阿米巴，在公司内部形成一个完整的成本中心体系。</p><p>(4)预算型阿米巴</p><p>预算型阿米巴是以控制经营费用为主要职能的阿米巴组织，主要工作是细分费用和验收工作质量，并对此进行量化评估。预算型阿米巴对预算目标进行层层分解，每一个阿米巴成员都必须树立成本意识和效益意识。这种阿米巴组织能科学合理地配置公司资源，让各个阿米巴的工作计划得到相应的预算支持。</p><p>预算型阿米巴通过预算管理实现了费用最小化的目标，有助于公司正确评估各个阿米巴的实际业绩。上至高层管理，下至普通员工，都能明确自己的任务和目标利润，并有意识地控制能源消耗，提高经营效益。这种阿米巴组织多设置在支援部门当中。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>一个大的阿米巴由几个小阿米巴组成，这个大阿米巴和其他大阿米巴再组合起来就成为一个更大的阿米巴，而在这个合并的过程中就会制造出很多机会。让机会变成现实，这就是阿米巴经营的成功秘诀，也是京瓷的员工为什么富有企业家精神的关键因素。</p></blockquote><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p><p>延伸阅读：怎样检验阿米巴组织的设计方案阿米巴经营模式要求组织具有极强的环境适应能力，能根据市场变化灵活地调整自己的形态。恰恰是这一点让阿米巴经营充满了变数。当组织结构调整不到位时，原先富有活力的阿米巴组织可能会产生新的弊病，跟公司的发展战略不再相匹配。</p><p>为此，企业管理者需要一套方法来检验阿米巴组织的设计方案，以确保变革后的组织依然能高效运营。</p><p>我们可以从以下几个方面来检验阿米巴组织设计方案的合理性。</p><p>1.是否与公司发展战略匹配</p><p>先检查阿米巴组织设计方案是否符合公司的发展战略。无论采用什么样的组织结构，最终都是为实现企业战略目标而服务的。有些公司对部门的分工混乱，机构设置重叠臃肿，白白增加了管理成本。应该根据公司的发展战略对组织机构进行精简。</p><p>除了符合公司发展战略之外，我们设置的阿米巴还应该跟细分市场一一对应。假如某个细分市场没有阿米巴负责，或者同一个细分市场设置了多个阿米巴，都不是优化的组织结构。此外，各个阿米巴之间能否协调配合，对完成公司发展战略意义重大。各环节若是不能流畅协作，说明组织结构存在缺陷，必须加以改进。</p><p>2.能否让经营管理部门有效发挥作用</p><p>在阿米巴经营中，所有的阿米巴都需要一些专门的管理部门提供专业支援。比如，后面即将提到的经营管理部门，就是公司总部的一个为所有阿米巴提供制度保障、信息支援的特殊部门。</p><p>我们在设计阿米巴组织方案时，应该先把相关的管理职能列出来，再将其合理安排到经营管理部门中。</p><p>3.能否优化公司的人力资源配置</p><p>下放经营权是阿米巴经营的主要特征。把员工培养成具有经营意识的人才是阿米巴经营的三大目的之。这是一种让全体成员最大限度地释放活力和创造力的管理模式，必定要对公司的人力资源进行优化配置。</p><p>我们可以询问一下公司各部门的骨干员工，了解一下现有的组织结构是否有利于他们发挥才能，是否给予他们足够的自主经营权。那种表面上说要下放经营权，实际上员工依然只能被动执行上面交代的方案的组织结构，离真正的阿米巴经营还有十万八千里。</p><p>4.组织设计方案是否具备可行性</p><p>公司应该全面调查一切可能阻碍阿米巴组织设计方案贯彻落实的因素。比如，市场环境、国家政策、公司资源是否满足设置阿米巴组织的条件，大股东是否认可阿米巴组织设计方案。</p><p>5.能否有效解决各部门之间的协作问题</p><p>无论把阿米巴组织结构设计成什么形态，都要解决部门之间的协作问题。有些企业管理者试图凭借部门之间原有的人际关系网来自行协调合作问题，这根本不是阿米巴经营。阿米巴经营不是单靠领导人的奉献精神就能实现的，更重要的是一套平衡各部门之间利益的协作机制。</p><p>6.管理层级是否足够精干</p><p>阿米巴经营是为了解决大企业病而诞生的。所以，把阿米巴组织设计成结构庞杂、管理层级臃肿的心态，肯定是不合理的方案。评估阿米巴组织设计方案合理性的一个重要原则是，一线部门是否真正实现了独立核算，是否具有自主经营的决策权。</p><p>如果没有成为独立的核算单位，不能自主决定经营策略，就不是真正意义上的阿米巴组织，而是传统的官僚组织。一旦出现这种情况，我们就要考虑，这个阿米巴是否还有存在的必要，是否有足够的资源来独立完成一项业务。如果达不到这些条件，就不足以单独设置一个阿米巴。</p><p>7.各阿米巴之间的职权范围是否明确</p><p>阿米巴经营要求我们把组织划分为能够独立完成一项业务的最小型组织。当原有的阿米巴发展壮大到产生多项业务时，就必须进一步从中分裂出新的阿米巴。这样做的主要原因是明确各个阿米巴的业务方向和职权范围，避免设置功能重复的阿米巴，导致各个阿米巴对业绩问题互相推诿。</p><p>8.组织结构是否保留了足够的弹性</p><p>阿米巴经营的原理是企业像阿米巴一样能随时根据环境变化调整自身形态，以提高市场环境适应力。这样的组织结构必须有足够的弹性，否则难以灵活变换形态，缺乏环境适应能力。我们设计的阿米巴组织结构应该能轻松自如地把各个阿米巴重新拆分或合并，而且要保证每一次重组的阿米巴单位依然能正常运转。如果做不到这一点，说明阿米巴经营模式还停留在口头阶段，没有真正落到实处。</p>'
    },
      '2026-11-07': {
        chapter: '第6天：第三章 临时工也能参与经营？全靠阿米巴的配套措施支援 · 经营管理部门：所有阿米巴团队的坚实后盾 · 单位时间核算表：让现场员工掌握公司情况',
        content: '<p><strong>第三章 临时工也能参与经营？全靠阿米巴的配套措施支援</strong></p><p>阿米巴经营提倡公司全体成员都参与经营，临时工和钟点工也不例外。众所周知，员工的能力素质往往参差不齐，组织又存在界限分明的行政等级。很多公司连确保每个员工按时按质按量完成手头的工作都做不到，怎么可能实现全员经营呢？但阿米巴经营绝非空谈华而不实的大道理，而是有一整套培养员工经营意识、促使员工积极参与公司各项经营活动的支援制度。在这些配套措施的帮助下，每个留在阿米巴组织内的员工都将获得成长，像主人一样经营公司的事业。本章重点讲的是那些让阿米巴充满活力的配套管理制度。</p><p><strong>经营管理部门：所有阿米巴团队的坚实后盾</strong></p><p>内容摘要</p><p>1.阿米巴经营不是细分组织各自为战，而是建立一个制定和维持规则的职能部门。</p><p>2.经营管理部门在公司组织体系中具有三大职能。</p><p>3.经营管理部门跟财务部门都要统计数据和处理票据，但两者的职能有根本区别。</p><p>阿米巴经营不只是把大型组织细分为小阿米巴就完事了，还要把无数小阿米巴统合起来。因为，经过细分后的阿米巴单位都有很大的自主经营权，单凭一个阿米巴的力量，什么都做不了。若想让各个阿米巴真正发挥功效，就不得不建立配套的支援制度。其中最关键的环节，就是建立一个制定和维持公司内部规则的职能部门。这个颇具阿米巴经营特色的部门，通常被叫作经营管理部门。</p><p>1.经营管理部门的三大职能</p><p>经营管理部门存在的最大意义，就是为公司所有的阿米巴提供全面而及时的服务。该部门在公司组织体系中主要担负三大职能。</p><p>(1)构建让阿米巴经营正常发挥作用的制度基础</p><p>包括设置计算部门收入的管理机制，制定票据处理规则，制定和执行其他公司的内部规则，以保障各个阿米巴能正常运营。</p><p>(2)及时准确地向公司上下提供经营信息</p><p>制作单位时间核算表，及时准确地向公司高层、各级阿米巴领导人及全体员工提供最新的公司经营信息，让所有人都了解公司的发展现状。</p><p>(3)管理公司资产，保障资产的健全化</p><p>负责管理应收货款、产品库存和固定资产等公司财产，督促相关部门按照内部规则处理本部门的资产。</p><p>经营管理部门除了要管理资产负债表上计入的一切资产外，还要独立管理“接单余额”等各种余额。</p><p>需要注意的是，经营管理部门虽然涉及很多会计核算管理工作，但跟财务部门是两回事。它承担的是管理会计职能，而不是财务会计职能。假如公司没有一个强有力的经营管理部门给各个阿米巴单位做后盾，阿米巴经营就会变成一盘散沙。</p><p>2.制定公司内部规则的五个标准</p><p>经营管理部门包含两种业务体系，一个是“订单生产体系”，另一个是“库存销售体系”。让这两个业务体系正常运转，是经营管理部门的本职工作。为此，经营管理部门要制定指导各阿米巴工作的公司内部规则，并以此为依据对整个公司进行维护管理。企业领导人在制定公司内部规则时，要注意结合以下五个标准。</p><p>(1)公司内部规则必须符合公司的基本理念和价值观</p><p>无论在哪个公司，企业的基本理念和价值观都是最核心的东西，它决定了这家公司与其他公司的根本区别。想要打造具有广泛影响力的百年老店，就要明确公司的基本理念和价值观，所有的规章制度和经营哲学都由此产生，公司内部规则自然也不例外。</p><p>我们在制定公司内部规则时，不可与公司的基本理念和价值观相抵触，必须反映整个公司上下共同遵守的经营哲学与经营战略，这样才能让事业纲举目张，让全体员工产生强大的向心力和凝聚力。假如违背了这一点，上至高层领导，下至基层员工，都不会把内部规则当回事。</p><p>(2)公司内部规则的制定必须从经营的角度出发</p><p>管理者首先应该明确公司当前的经营形态和组织结构，根据经营的实际需要来制定内部规则的条款。比如，怎样确定阿米巴的销售额、生产率、经费、时间等要素，需要一个明确的、详细的、可操作的规则。</p><p>否则的话，阿米巴经营就会因为缺乏规则指导而陷入混乱局面。各个阿米巴握有自主经营权，但完全不知道该怎样发展，只是凭着感觉摸索，只考虑本部门的利益，而不顾其他阿米巴的死活。企业组织分得越细，阿米巴单位设置得越多，越容易因管理无序而导致严重内耗。</p><p>(3)公司内部规则应当如实反映经营的实际情况</p><p>让员工随时掌握公司经营的实际情况，本来是阿米巴经营模式的一大优点。可如果没有公司内部规则约束的话，就会很容易出现弄虚作假的不良现象。即使没有弄虚作假，很多员工也不知道怎样解读核算表里的数据。这就需要公司通过制定内部规则来加强对核算数字的管理，让每一位经营参与者都能看到可靠的经营数据。</p><p>(4)公司内部规则应当具有一贯性</p><p>公司制定的内部规则应当具有一贯性。不能只考虑某个特例，而应该以普遍情况为主要参考依据。当我们增加新的具体规则时，必须核实它是否与原有规则相互矛盾。假如新规则和旧规则说法不一，经营者就会感到困惑不已，不知道怎么执行。久而久之，无所适从的人们干脆把公司内部规则丢到一边，只凭自己的经验来做决断。</p><p>(5)公司内部规则必须公平公正地适用于整个组织</p><p>我们必须明确一点，公司内部规则不是针对个别事业部门制定的特殊规则，而是公平公正地适用于整个组织的普遍规则。它是根据公司整体的利益来制定的，是公司基本理念和价值观的具体反映。为了确保内部规则公平合理，我们应该让所有部门在平等的条件下参与讨论，这样制定出来的公司内部规则才能代表所有阿米巴乃至整个公司的共同利益。</p><p>稻盛和夫与森田直行在改组日本航空公司时，希望在组织编制上设置一个对利润负责的部门。但是旅客运输服务应该以什么作为阿米巴的核算单位，管理层议论纷纷。有些人认为应该把机场视为阿米巴的核算单位，但经过反复讨论后，稻盛和夫决定以每条航线、每个航班为单位进行核算。于是日航在原有的航运、客舱、机场、整备四个本部基础上成立了“航线统括本部”。</p><p><strong>单位时间核算表：让现场员工掌握公司情况</strong></p><p>内容摘要</p><p>1.单位时间核算制度的基础是“销售最大化，费用最小化”原则。</p><p>2.单位时间核算表可以让各个阿米巴的运营情况一目了然。</p><p>3.单位时间核算表中最重要的指标是“单位时间附加价值”。</p><p>“销售最大化，费用最小化”是阿米巴运营的出发点。经过细分后的阿米巴已经成为一个个独立的利润中心，需要自负盈亏。管理收支核算是阿米巴经营的基础，但各种复杂的财务报表，对于阿米巴经营者来说未免过于复杂。他们很难完全读懂财报，从中了解公司的运营实况。</p><p>大多数公司的财务部门只反馈给公司高层的董事，而在现场工作的一线员工对此一无所知，这与阿米巴经营的初衷不符。稻盛和夫坚信，只有让每个一线员工都能掌握公司的情况，才能把阿米巴经营真正做活。为此，他在京瓷创立了一套单位时间核算制度，该制度的核心是单位时间核算表。</p><p>1.单位时间核算表和单位时间附加价值</p><p>稻盛和夫是产品研发人员出身，刚开始不太懂财务知识。他判断现场一线员工很难读懂财务报表，于是想借鉴家庭记账本的形式来简单记录各部门的收支情况。</p><p>最初，阿米巴经营者只是把实绩、月初预定数字信息填入表中。单位时间核算表在实践中不断完善，逐渐发展成以月度为单位，以具体预定数字来表示阿米巴的活动计划，以对照贯彻销售和经费的实绩为依据的管理核算工具。</p><p>在单位时间核算制度中，衡量阿米巴活动成果的标准是“附加价值”。所谓附加价值，就是销售额减去生产产品所消耗的材料费、机器设备的折旧费等除了劳务费之外的所有经费的结果。阿米巴运营者用总附加价值除以总劳动时间，就能计算出每个小时的附加值，即“单位时间附加价值”。</p><p>阿米巴经营活动的“单位时间”主要有年度和月度。我们可以通过设定年度目标和月度目标来准确掌握阿米巴活动成果的附加价值，找出经营过程中存在的问题。把各个阿米巴的单位时间核算表汇总起来，就能清楚地掌握整个公司的业绩情况。增加单位时间附加价值，是每个阿米巴的奋斗目标。</p><p>2.稻盛和夫设计的单位时间核算表格式</p><p>单位时间核算制度要求整个公司拥有统一的单位时间核算标准。但是不同部门的收入计算方法不同，所以在设计单位时间核算表的细目时要注意结合本部门的实际情况。以下是稻盛和夫设计的销售部门、管理部门和生产部门的单位时间核算表。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>单位时间核算表中没有财务专用的项目术语，而是通过通俗易懂的管理会计的方法展示出来。我相信那些具备一定会计知识的人已经察觉到阿米巴经营就是一种管理会计。通过结算表中的数据来了解自己阿米巴的现状，并在此基础上进行改善，进一步增加单位时间附加价值，就是阿米巴领导者的职责。</p></blockquote><p style="text-align:right;"><em>——京瓷沟通系统有限公司管理咨询(KCMC)会长森田直行</em></p>'
    },
      '2026-11-08': {
        chapter: '第7天：用阿米巴式会议盘活各个运营单位 · 保持运营管理的透明度',
        content: '<p><strong>用阿米巴式会议盘活各个运营单位</strong></p><p>内容摘要</p><p>1.阿米巴经营需要通过开会的形式来向员工讲解经营理念和管理方法。</p><p>2.“核算”与“反思”是阿米巴式会议的两大主题。</p><p>3.会议不能止步于制订和检查年度计划，全体参与者要充分沟通自己的想法。</p><p>“会而不议，议而不决”的怪圈在阿米巴经营中是看不到的。因为阿米巴式会议兼具多种功能。它既是公司内部各个阿米巴交流沟通的最佳渠道，也是每一位员工深入学习阿米巴经营理念的最佳场合。会议并不是越多越好，但每一次会议都应该被认真对待，不能只是走走过场。普通员工通过接触阿米巴式会议，将学会怎样成长为优秀员工，甚至出色的阿米巴领导人。为了把阿米巴式会议的作用发挥得淋漓尽致，我们应该注意以下几个方面。</p><p>1.会议的基本宗旨</p><p>阿米巴的会议分为多个层级，参与者和会议内容均有所不同。会议通常在月初召开，有时候也可能在月中或月末召开生产进度会议。不过，所有会议都有共同的基本宗旨，那就是对公司各部门的经营情况进行总结和反思，核算当月实绩并编制下个月的预算，同时对一些难以决断的事情进行探讨协商，找出解决办法。</p><p>2.传递各层级经营者的想法</p><p>阿米巴会议是一个传递各层级经营者想法的最佳场所。公司决策层必须把自己的想法准确无误地传达给所有与会人员。自下而上的信息反馈也要简明扼要地汇总上报，不能让各种冗杂的无效信息分散大家的精力。通过开诚布公地交换意见，阿米巴经营的意图能够被很好地传达出去，全员参与经营的理念也能落到实处。需要注意的是，与会人员不能只关注汇总意见，而不去对公司未来的发展方向做出思考。</p><p>3.考察阿米巴领导人</p><p>培养新一代阿米巴领导人是阿米巴经营的三大主要目的之一。阿米巴会议是个考察各个阿米巴领导人的好机会。在会议过程中，领导人对阿米巴经营哲学的认识是否全面深彻，发言是否条理分明、逻辑清晰，观点是否一针见血，谈吐是否有风度或有学问，对待他人的态度是否有礼貌，遇到争论时是否具有良好的情绪管理能力，都能被大家看到。公司决策层可以根据各个阿米巴领导人在会议中的表现情况来判断其今后的成长方向，对其提供有针对性的指导，帮助他们更好地成长为公司的栋梁之材。</p><p>4.阿米巴领导人提出部门目标</p><p>如何改进各部门的利润水平，是阿米巴会议的一个重要议题。阿米巴领导人除了在会议上汇报本部门的实绩外，必须对能够实现的部门目标做出郑重的承诺，根据会议精神制定合理、具体、可操作的方案。假如他们提出的目标违背了公司的整体利益或不符合公司的发展战略，其他会议参与者必须在第一时间进行纠正。这种在所有与会人员面前公开承诺的部门目标，是一个严肃的约定。阿米巴领导人万万不可信口开河，轻诺寡信，否则难免遭到相应的处罚。</p><p>5.根据汇总的情况进行反思总结</p><p>在阿米巴会议上，各个阿米巴都要提交当月的单位时间核算表。单位时间核算表上的数据反映了各个阿米巴的全部经营细节。假如数据不尽如人意，会议组织者应该引导其他成员坦然接受现实并积极反思不足，切忌逃避责任和排斥他人。毕竟，这个结果是过去一个月中全体成员付出的心血。反思不是为了相互指责，而是为了总结经验教训，着眼未来的进步。也许反思总结会占去阿米巴会议大量时间，但对于每个阿米巴领导人来说，这是非常必要的步骤。</p><p>6.彻底讨论直到解决问题</p><p>除了汇报上月实绩之外，我们还要在阿米巴会议上制订出当月计划。但这还远远不是会议的全部内容。阿米巴经营要求企业管理者不惜花费大量时间组织会议，目的在于彻底讨论问题，直到所有与会人员都完全信服为止。那些因害怕浪费时间而草草结束会议的阿米巴领导人，没有利用这个机会跟其他参与者充分沟通，其所在的部门往往业绩并不尽如人意，反倒是那些宁可开一整天会把问题彻底搞清楚的阿米巴部门能取得出色的成绩。这就是非彻底沟通和彻底讨论的差距。</p><p>7.制订年度计划</p><p>阿米巴经营周期一般以月度为单位，但月度计划又是年度计划的延伸。年度计划代表着阿米巴领导人对一年内如何经营阿米巴的构想。每个阿米巴领导人在会议上都要阐述自己的发展方针，让大家知道他们所在的部门接下来将如何发展。这是制订年度计划的基础。</p><p>制订年度计划是阿米巴会议的一项重要任务。我们可以在12月份召开所有阿米巴部门领导人都参与的会议，每个部门领导人都要在会议前宣布本部门的发展方针，并提交下一期的计划和预算。公司最高领导人在会议上要耐心听取各个阿米巴的计划，但先不要急于做出任何批示。因为，公司最高领导人还要根据自己掌握的信息来制定下一年度的公司经营总方针，通常在1月份公布。</p><p>接下来，各个阿米巴领导人根据公司经营总方针来修改自己部门的年度计划，并将其提交给决策部门。决策部门再跟各个阿米巴事业部门进行详细探讨，沟通达成一致意见后再由决策部门正式批准年度计划。年度计划的制订工作至此才算完成。需要注意的是，制订年度计划是以必须按时完成目标为前提的。当年度计划执行受阻时，各个阿米巴需要通过及时变更月度计划来调整工作进度，确保目标能最终达成。</p><p>8.提交设备投资方案</p><p>除了这些日常管理工作外，阿米巴领导人还可以在会议上提交设备投资方案。设备投资方案通常会写入年度计划，必须由阿米巴领导人根据实际需要来主动申请。为此，阿米巴领导人一定要随时关注市场最新动态，看准合适的投资时机，时常检查设备是否符合生产需求。</p><p>不过，投资设备的金额在阿米巴经营中一般要变成折旧费或者设备利息，影响部门的收入。所以，阿米巴领导人不会轻易选择不划算的设备。只要现有设备还能继续使用，他们就更倾向于通过改造现有设备来挖掘潜力，而不是优先采购更先进的设备。</p><p>9.申请投资</p><p>尽管各个阿米巴有较大的自主经营权，但不能自主决定投资事宜。因为阿米巴不是真正独立的企业，领导人没有利用部门利润投资的权限，也没有任何可供自主投资的预算。假如阿米巴领导人找到了很好的投资时机和投资项目，必须提前向公司提交议案申请书，并在申请书中核算投资带来的收益。</p><p><strong>阿米巴运营冷知识</strong></p><blockquote><p>京瓷的阿米巴会议一般在月初召开，由阿米巴领导人在会议上分析上个月的实际业绩，并结合实际情况来制订当月的工作计划。稻盛和夫在开会时总是把所有的决策人员安排在一起，围成一个圈坐下。他认为这样参与会议的人都能看到彼此的脸。而他自己会坐在圈的正中央，以便跟每一位决策人员进行一对一的对话。在开会的过程中，大家不仅仅是汇报自己的工作，同时也在观察稻盛和夫的面部表情，学习正确的问题解决方式。</p></blockquote><p>不过，投资设备的金额在阿米巴经营中一般要变成折旧费或者设备利息，影响部门的收入。所以，阿米巴领导人不会轻易选择不划算的设备。只要现有设备还能继续使用，他们就更倾向于通过改造现有设备来挖掘潜力，而不是优先采购更先进的设备。</p><p>9.申请投资</p><p>尽管各个阿米巴有较大的自主经营权，但不能自主决定投资事宜。因为阿米巴不是真正独立的企业，领导人没有利用部门利润投资的权限，也没有任何可供自主投资的预算。假如阿米巴领导人找到了很好的投资时机和投资项目，必须提前向公司提交议案申请书，并在申请书中核算投资带来的收益。</p><p><strong>阿米巴运营冷知识</strong></p><blockquote><p>京瓷的阿米巴会议一般在月初召开，由阿米巴领导人在会议上分析上个月的实际业绩，并结合实际情况来制订当月的工作计划。稻盛和夫在开会时总是把所有的决策人员安排在一起，围成一个圈坐下。他认为这样参与会议的人都能看到彼此的脸。而他自己会坐在圈的正中央，以便跟每一位决策人员进行一对一的对话。在开会的过程中，大家不仅仅是汇报自己的工作，同时也在观察稻盛和夫的面部表情，学习正确的问题解决方式。</p></blockquote><p><strong>保持运营管理的透明度</strong></p><p>内容摘要</p><p>1.没有透明的管理制度，阿米巴运营无法实现全员参与经营的目标。</p><p>2.要让阿米巴领导人和其他成员都能清楚地了解经营状况。</p><p>稻盛和夫当初在设计阿米巴经营模式时发现，大多数公司都不喜欢让员工了解经营现状，而员工不了解任何信息，自然也就无法参与经营管理。想要让员工真正依赖公司，最好的办法就是让运营管理变得透明，让员工真正了解公司现状，并能参与到经营活动中。为了保持运营管理的透明度，管理者需要注意以下几个问题。</p><p>1.设置规模适度的扁平化组织</p><p>为了改变原先臃肿的组织机构，很多公司纷纷把传统的金字塔形组织改造为扁平化组织。因为企业规模越大，金字塔形组织的决策层离基层就越远，信息在上传下达过程中经过太多层级，大大影响了决策效率。扁平化组织结构缩短了现场和决策层的距离，能让决策者和基层员工更好地沟通。但是扁平化组织的规模过大，同样会超出管理者的能力，部门之间的横向沟通也容易出现问题。所以，规模适度的扁平化组织才能实现最佳效果。</p><p>2.通过细分组织来提高管理透明度</p><p>公司运营管理不透明的一个重要原因是组织职能划分粗略，很多信息混杂在一起。阿米巴经营并不刻意追求组织结构扁平化，而是通过把组织划分为一个个独立运营的小阿米巴来解决效率问题。细分组织专精于某一项业务，既便于核算收支，又利于精准营销。</p><p>3.让公司决策层清楚地掌握经营情况</p><p>阿米巴经营不光是对普通员工透明，对决策层同样透明。每个阿米巴代表着一段整合性业务，都独立地核算销售额、时间和费用，并按照一定的比例分摊公司的整体“公共费用”和“总公司费用”。公司决策层核实每一个阿米巴的核算结果，最后把所有阿米巴的核算结果加起来就是公司整体的核算结果。</p><p>公司决策层在这种核算制度中得到的是销售额、利润、订单总额、劳动时间和单位时间核算等第一手数据。这些数据让全公司的最新经营情况一目了然，每一个阿米巴的经营状况也保持透明。决策层能准确掌握每个环节的情况，做出更加准确的决断。</p><p>4.让阿米巴领导人了解经营情况</p><p>实施高度透明的运营管理，不只是为了便于决策层了解公司现状，同时也是各级阿米巴领导人掌握阿米巴经营情况的主要途径。每个阿米巴领导人最初掌管的都是一个小阿米巴。比如，制造部门的阿米巴领导人最初可能只管一台设备，而销售部门的阿米巴领导人开始可能只有一定数量的商品。保持小型化组织是实现透明化管理的关键因素，阿米巴的规模越小越容易管理，也能减少经营过程中不必要的浪费。当一个小阿米巴发展到比较庞大的规模时，新一轮的组织细分必将提上日程。通过不断分裂成新的阿米巴，公司在扩张规模的同时也能最大限度地保持组织的活力。</p><p>5.让阿米巴成员熟悉经营情况</p><p>只有管理层了解公司经营盈亏是远远不够的。推行阿米巴经营模式的一个重要意义，就是让每一位员工都知道公司的盈亏，认清自己的价值和贡献。阿米巴经营使用单位时间核算制度来表示产品附加值和达成目标所消耗的时间和费用，让员工珍惜自己的劳动成果，加倍努力工作。如果人人都知道自己的工作对阿米巴有什么影响，就会按照经营者的思维去考虑问题，然后逐步成长为新一代经营者。</p><p>6.及时掌握阿米巴经营信息</p><p>高度透明的经营管理模式必定以及时掌握信息为基础。大部分公司都是每个月统计一次经营情况，过后再把信息反馈给最基层。这就会导致一线员工得到的信息非常滞后，无法根据最新情报来参与经营。阿米巴经营模式强调现场管理的及时性，要求各个阿米巴每天都要把当天的实绩统计清楚，第二天将最新信息反馈给现场，这样才能让员工及时确认自己的工作成果，产生更多责任感。同时也利于公司决策层以最快的速度掌握各个阿米巴的经营现状，提高对市场潮流的反应速度。</p><p><strong>阿米巴专家有话说</strong></p><blockquote><p>也许在外界看来，京瓷的飞速成长和高收益实质是源于技术开发能力。当然也有这方面的原因，但回顾过去，我认为，京瓷最大的优势在于，在创业的时候，就依靠心灵相通的同伴之间结成的牢固纽带，尔后又一直把公司员工间的伙伴关系作为企业经营的根基。因此，京瓷能够在企业内部构建起强有力的人际关系。通过发挥集团的合力，京瓷取得了仅凭单个成员的潜力无法获得的成果。</p></blockquote><p style="text-align:right;"><em>——阿米巴运营创始人、日本经营之圣稻盛和夫</em></p><p>延伸阅读：阿米巴经营年度、月度计划表和日报表</p>'
