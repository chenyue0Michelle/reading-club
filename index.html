<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>读书打卡 · 干法</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      font-size: 14px;
    }
    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.5em; color: #f5c518; margin-bottom: 6px; letter-spacing: 2px; }
    .formula { font-size: 0.82em; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .dates { font-size: 0.78em; color: #666; }
    .progress-section { padding: 0 20px 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 6px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f5c518, #ff6b6b); border-radius: 3px; transition: width 0.5s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; font-size: 0.82em; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.4); color: #f5c518; }
    .today-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 14px; position: relative;
    }
    .day-badge {
      display: inline-block; background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 0.75em; font-weight: bold; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .today-card h2 { font-size: 0.95em; color: #f5c518; margin-bottom: 14px; line-height: 1.6; }
    .content-body { font-size: 14px; line-height: 1.95; color: #ccc; }
    .content-body p { margin-bottom: 10px; }
    .content-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .content-body strong { color: #fff; }
    .content-body ul, .content-body ol { padding-left: 20px; margin: 8px 0; }
    .content-body li { margin-bottom: 6px; }
    .checkin-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    .status-box {
      text-align: center; padding: 12px; border-radius: 10px;
      font-size: 0.88em; margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-header { text-align: center; font-size: 0.72em; color: #666; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 0.78em; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future { background: rgba(255,255,255,0.04); color: #555; cursor: default; }
    .cal-day.available { background: rgba(255,255,255,0.08); color: #aaa; }
    .cal-day.available:hover { background: rgba(245,197,24,0.15); border-color: #f5c518; color: #f5c518; }
    .cal-day.today-marker { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; font-weight: bold; }
    .cal-day.checked { background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1)); border-color: #2ecc71; color: #2ecc71; }
    .cal-day.checked::after { content: '✓'; position: absolute; bottom: 1px; right: 3px; font-size: 0.65em; color: #2ecc71; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(245,197,24,0.3); }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 24px; max-width: 680px; width: 100%; margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body { font-size: 0.88em; line-height: 1.9; color: #ccc; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px; width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #aaa; border-radius: 8px; cursor: pointer; font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: #fff; font-size: 1em; padding: 12px 16px; text-align: center;
      margin-bottom: 16px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }
    .user-greeting {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name { color: #666; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    .user-greeting .change-name:hover { color: #aaa; }
    .font-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: flex-end; }
    .font-btn {
      padding: 4px 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING - FIXED ===== */
    .record-area {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #ccc; font-size: 1.4em;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; user-select: none;
    }
    .record-btn.recording {
      border-color: #ff4757; background: rgba(255,71,87,0.2); color: #ff4757;
      animation: pulse 1s infinite;
    }
    .record-btn.done {
      border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; min-width: 0; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-status.done-status { color: #2ecc71; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }
    .record-action-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8em; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .record-action-btn:hover { background: rgba(255,255,255,0.15); }
    .record-action-btn.stop-btn { border-color: #ff4757; background: rgba(255,71,87,0.1); color: #ff4757; }
    .record-action-btn.stop-btn:hover { background: rgba(255,71,87,0.2); }
    .record-action-btn.redo-btn { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; font-size: 0.75em; }

    .record-upload-status { font-size: 0.78em; color: #f5c518; margin-top: 4px; display: none; }
    .record-upload-status.show { display: block; }
    .record-playback { margin-top: 8px; display: none; }
    .record-playback.show { display: block; }
    .record-playback audio { width: 100%; height: 36px; border-radius: 8px; }
    .record-playback-label { font-size: 0.76em; color: #888; margin-bottom: 4px; }
    .loading-spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3); border-top-color: #f5c518;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reflection-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .reflection-label { font-size: 0.82em; color: #888; margin-bottom: 8px; }
    .reflection-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: #ddd; font-size: 0.88em; line-height: 1.7;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus { outline: none; border-color: rgba(245,197,24,0.4); background: rgba(255,255,255,0.08); }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved { font-size: 0.78em; color: #2ecc71; margin-top: 6px; display: none; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    .audio-wall-header { text-align: center; margin-bottom: 16px; }
    .audio-wall-header h3 { color: #f5c518; font-size: 1em; margin-bottom: 4px; }
    .audio-wall-header p { font-size: 0.78em; color: #888; }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s;
    }
    .audio-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,197,24,0.3); }
    .audio-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row { display: flex; align-items: center; gap: 12px; }
    .audio-player-row audio { flex: 1; height: 36px; border-radius: 8px; }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15); color: #f5c518;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75em; white-space: nowrap;
    }
  </style>
  <script>
    window.addEventListener('load', function(){
      var s = document.createElement('script');
      s.src = 'cloudbase.js';
      s.onerror = function(){ console.warn('[SDK] uniCloud SDK 加载失败，录音墙不可用'); };
      document.head.appendChild(s);
    });
  </script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《干法》全书共读计划<br>稻盛和夫 著 · 每天10-12分钟</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">
  <h1>📖 干法</h1>
  <div class="formula">热爱工作 · 磨炼心志 · 追求完美</div>
  <div class="dates" id="headerDates">稻盛和夫 著 · 全书共读计划</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 21</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">21</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall',this)">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 - 修复版 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="handleRecordClick()" title="点击开始/停止录音">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始朗读录音</div>
        <div class="record-duration" id="recordDuration"></div>
        <div class="record-upload-status" id="uploadStatus"></div>
      </div>
      <button class="record-action-btn" id="recordActionBtn" style="display:none" onclick="handleActionBtnClick()">重新录制</button>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- AUDIO WALL TAB -->
  <div class="tab-content" id="tab-audiowall">
    <div class="audio-wall-header">
      <h3>🎙️ 读书录音墙</h3>
      <p>聆听大家的读书声，共同成长进步</p>
    </div>
    <div class="audio-wall-list" id="audioWallList">
      <p style="color:#666;text-align:center;padding:30px;">⏳ 加载中...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== BOOK CONTENT =====
// 《干法》全书共读 - 稻盛和夫 著
// 共21天，每天约2600字（10-12分钟阅读）
// 日期范围：2026-07-01 至 2026-07-21
const bookContent = {
  '2026-07-01': {
    chapter: '第1天：干法 · 译者序：热爱导致成功',
    content: '<p><strong>热爱导致成功</strong></p><p>你想获得事业的成功和人生的幸福吗?如果你想这样，稻盛先生告诉你，这很简单，但前提是你必须热爱自己的工作。“热爱”这个词，稻盛先生又常常用“喜欢”“迷恋”这类词汇来表达。</p><p>如果你不喜欢、不热爱你当前的工作，那么在多数情况下，你得马上改变你的心态，哪怕是强迫自己改变</p><p>如果你热爱自己的工作，你就会全身心投入。如果你全身心投入，就会产生良好的工作结果，你这种工作态度和工作结果不但能获得周围人的肯定，而且会让你从内心感到满足并产生自信。而这又会成为动力，激励你更努力地投入工作.....这样的良性循环，不仅是成功的必要条件，从某种意义上讲，它甚至就是成功的充分条件。因为这种良性循环可以改变你的命运。</p><p>这就是稻盛先生最重要的人生经验之一。转变自己的心态，从不喜欢自己的工作到喜欢、热爱乃至迷恋自己的工作，稻盛的命运就从这里开始发生了戏剧性的变化。</p><p><strong>热爱燃起激情</strong></p><p>我很幸运，2001年10月28日这一天，我在天津第一次见到了稻盛和夫先生，从此与稻盛和稻盛哲学结下了不解之缘。</p><p>当时我自己已经有了多年经营企业的经验，但在经营和人生中有许多困惑。在接触稻盛和稻盛哲学的一瞬间，我有一种豁然开朗的感觉，所谓“众里寻她千百度，蓦然回首，那人却在，灯火阑珊处”。我觉得稻盛先生将人生和经营的基本问题都讲清楚了，讲透彻了，而且他做出来了，做得近于完美。在现实世界中，我还从未见过像稻盛这样纯粹而且思想深刻的人。凭直觉，我感到稻盛先生可以成为自己的精神导师，稻盛哲</p><p>学就是我一直寻找的人生真理。</p><p>同年12月我专程拜访了位于京都的京瓷公司，购买了稻盛先生的全部著作，订购了自创刊以来所有的《盛和塾》杂志。</p><p>我在天津会议上发表的论文《百术不如一诚》，在天津会议后写给稻盛先生的信《解读稻盛成功方程式》，以及2004年寄给稻盛先生的《关于实事求是:读稻盛先生《企业人所见中国之现状)及《中共中央党校讲演要录〉有感》等文章，受到稻盛先生的称赞,并在日本《盛和塾》杂志上陆续刊载</p><p>我多次赴日本参加日本“盛和塾”全国大会(后称世界大会)和塾长例会，并有机会经常向稻盛先生当面请教。2006年我所著《稻盛和夫成功方程式》一书在中国出版后，又被译成日文，经稻盛先生亲自推荐，在日本出版并畅销。在2007年3月30日中文版《京瓷报》上，稻盛先生评价此书道:“正是透彻理解京瓷哲学的非京瓷人所著，所以很值得参考。”</p><p>2007年我与无锡许多志同道合的企业家一起筹建了中国首家“盛和塾”一“无锡市盛和企业经营哲学研究会”。同年7月2日，稻盛先生率领日本盛和塾120位企业家来无锡举办开讲式。</p><p>2008年2月，为了配合胡锦涛主席访问日本，中央电视台《对话》栏目，准备制作专题节目“中国制造和日本制造”，他们希望邀请稻盛先生作为日方主嘉宾参加节目的录制。受该栏目导演的委托，我出面邀请稻盛先生获得成功。2009年4月受有关方面的委托，我又赴日本，当面邀请并说服稻盛先生6月9日到清华大学、6月10日到北京大学、11月2日到“中外管理第18届官产学恳谈会”上发表讲演，均获成功。</p><p>近年来，我翻译了稻盛先生的著作《你的梦想一定能实现》《干法》《活法》《敬天爱人》《坚守底线》《心法:稻盛和夫的哲学》《燃烧的斗魂》《稻盛和夫的实学》《阿米巴经营》《成功激情》《调动员工积极性的七个关键》以及稻盛先生与梅原先生合著的《拯救人类的哲学》共12本书，编译了《在萧条中飞跃的大智慧》《六项精进》《经营十二条》《经营为什么需要哲学》《心灵管理》《领导者的资质》《稻盛和夫语录100条》7本书，审译了《活法参:人生的王道》，并为各书写了推荐序言。同时，这7年来，我还翻译了稻盛来华以及每年在盛和塾世界大会上的全部讲演文稿。应出版社要求，我夜以继日，只花了3个星期就写出了《稻盛和夫记》稻盛和夫60个哲理故事，初版2万册当即被当当网一家买断。</p><p>2010年，由稻盛先生亲自提议的稻盛和夫(北京)管理顾问有限公司正式成立，我担任董事长。由于公司干部员工齐心协力，由于全国“稻盛迷”的全力配合，我们成功召开了稻盛和夫经营哲学北京报告会，青岛、广州、大连、重庆、成都以及杭州报告会，2015年5月还要召开3000人规模的稻盛和夫经营哲学上海报告会。每次报告会场面火爆，好评如潮。这几年中，中央电视台采访稻盛先生达7次之多，节目播出之后，影响深远。</p><p>我今年已经69岁，每天工作12~15个小时，星期天、节假日也不例外。除公司内部工作，翻译工作外，有时一个月乘飞机十余次，应邀去各大企业和各地盛和塾，宣讲稻盛哲学和阿米巴经营，解答企业家们的问题，有时连续讲解五六个小时。如此大的工作量，家里人、企业同事、周围的朋友、日本友人都为我的健康担忧。但因为稻盛哲学和实学是正确经营企业的强大思想武器，受到广大企业家发自内心的热忱欢迎。所以工作虽然忙碌，我却总是乐在其中，并不感到过度疲劳。因为带着紧迫感和紧张感，所以往往精神充沛，信心十足，真是“不知老之将至”。我想，这么重要的工作居然落到我的头上，我居然似乎尚能胜任，这让我感到格外荣幸，抱着一颗感恩之心，我内心的充实和满足难以言表。</p><p>我想，无非是因为我对这项工作的热爱燃起了我的激情，而且使这种激情持续不断。我在亲身实践中领会了稻盛先生在《干法》中阐述的这个道理。</p><p><strong>热爱激发灵感</strong></p><p>位著名的德国汉学家说:“没有翻译就没有新中国，因为没有翻译，马克思主义就无法传进中国。”这是强调翻译重要性的一句很中肯的话。</p><p>翻译要达到信、达、雅的境界，译者至少要具备四种能力，即外语能力、母语能力、理解能力和表达能力。除此之外，有时甚至还涉及译者的人格、治学作风以及心灵的状态。</p><p>译者只能按自己的理解来翻译原著，往往文字上似乎译出来了，但作者的思想却译不出来，有时甚至把作者的原意弄颠倒了。</p><p>有时即使理解了，但要把理解的意思用文字准确、流畅、恰如其分地表达，仍然颇费思量。表达不到位、不充分，不足以带给读者感动乃至震撼，但用词过了头，又在瞬间减弱甚至失去了作者观点原本具备的说服力。</p><p>我的经验是，不理解或原意吃不准时，可以查阅资料，可以请教别人，甚至请教作者或作者周围的人。但如何将原著的精神如实表达，译出神韵，让读者易于理解，并有阅读快感，却常常让我绞尽脑汁，费尽心思。</p><p>经常出现这样的情况:读了作者一段精彩的话，备受感动，但因为文化的差异，用中文如何表达，却手足无措，很是焦急。但是，既然热爱这项工作，我就不敢怠慢，不敢敷衍，无论如何必须把作者的思想忠实地传递给读者。这样一种强烈的愿望似乎会进入潜意识，让我在散步时，洗澡时，睡觉醒来时，甚至如厕时，头脑里灵光一闪，出现神来之笔，我因此会心一笑。当这一节翻译完成后，对照翻译前的窘态，我自己也会吃惊，我竟能译得如此酣畅淋漓。</p><p>我很喜欢辛弃疾的词:“我看青山多妩媚，料青山看我应如是。”当稻盛的著作融入我的心中时，当我的心融入稻盛的著作之中时，当自己和自己的工作对象融为一体时，灵感就会油然而生。</p><p>常常出现的这种小小的灵感，虽然同稻盛先生开发划时代的新产品时上苍赋予他的灵感不可同日而语，但在翻译和平时的工作实践中，我也深切体会到了稻盛先生有关热情可以激发灵感这个重要的思想。</p><p><strong>热爱陶冶人格</strong></p><p>稻盛哲学的精髓可以用“提高心性，拓展经营”这句话来表达。所谓“提高心性”，稻盛先生又常用磨炼灵魂、净化心灵、提升理念、陶冶人格、扩展器量等说法来替代。</p><p>这里又出现一个因果循环:只有提高心性，才能拓展经营;反过来，只有在拓展经营的实践过程中才能提高心性。</p><p>换言之就是:比完成活儿更重要的是完善干活人的人格。但是干活人的人格必须在干活中才能提升和完善。“工作造就人格”。要全身心投入当前自己该做的事情中去，聚精会神，精益求精，这样做就是在耕耘自</p><p>己的心田，就可以造就自己深沉厚重的人格。</p><p>用真挚的态度，正面面对生活、工作、经营中的现实问题，绝不逃避，拿出勇气，用良知去应对解决，这个过程本身就是提高心性。</p><p>稻盛先生说:“回顾自己人生的每一天，其实就是通过经营实践，不间断地提升自己心性的每一日。”</p><p>我在平时的工作中，特别在传播稻盛哲学和阿米巴经营的过程中，对这一点有特别深刻的感受。</p><p>热爱工作，投身事业，在这个过程中，抑制私心，陶冶人格，鼓足勇气，贯彻正义，这样才能获得周围人们由衷的信任和尊敬。</p><p>在急功近利的世风中传播稻盛的利他哲学，好比“向沙漠中酒水，在急流中打桩”，需要有明确的信念、强烈的愿望、坚定的意志和甘愿付出自我牺牲的勇气。</p><p>我把传播稻盛哲学看作自己的天职。稻盛先生说:“天职需由自己创造。”而这项事业的最高报酬不是别的，就是磨炼自己的灵魂，使它在人生谢幕之时比开幕之初高尚一点点。</p><p><strong>热爱获得天助</strong></p><p>天道酬勤。只要热爱工作，只要抱着纯粹的动机、强烈的愿望，付出不亚于任何人的努力，就能感动上帝，获得天助。因为这种态度符合天道，与天地宇宙的意志相一致。</p><p>稻盛先生在谈到日航重建成功时说:“看到我奋不顾身的样子，神灵、上天，或者说是自然，因感动而向我伸出了援助之手。如果不是这样，日航如此奇迹般的回升是根本不可能的。这不是人的力量，只能说是SomethingGreat，即某种‘伟大之物’在发挥作用。这种‘伟大的存在’让我参与了日航重建，并援助推动重建工作取得了卓越的成功。”</p><p>稻盛哲学在中国的传播也开始出现类似的现象。中国已经出现了一批实践稻盛敬天爱人哲学的优秀企业。“一灯照隅是国宝”，一个行业中只要出现一家这样的企业，就能影响整个行业的风气。“一灯照隅，万灯照国”，如果每个行业都出现这样的企业，就可能改变整个商业文明的走向:从利己的文明走向利他的文明。</p><p>这不但是可能的，而且是必然的。因为这就是天意。违背天意，人类将没有未来。</p>'
  },
  '2026-07-02': {
    chapter: '第2天：干法 · 中文版序：我的劳动观 / 前言：幸福工作法',
    content: '<p><strong>中文版序 我的劳动观</strong></p><p>本书的原著于2009年4月在日本出版以后，立即成为畅销书，并连续占据排行榜前列。出版后不到一年，接连再版，获得年轻读者们广泛的支持。</p><p>我写这本书是出于对日本社会变质的深刻忧虑。第二次世界大战以后，日本从废墟中奋起，经济快速增长，成为世界第二经济大国。但是，人们在赞叹物质富裕的同时，却丧失了最重要的价值观，而正是这种价值观才从根本上支撑了日本经济的发展。</p><p>这里所说的价值观指的是劳动观，就是对工作的基本观念。工作在人的一生中占的时间最多，人们在工作中学到的东西也最多。但是，现在许多人却找不出在工作这一尊贵的行为中所包含的目的和意义。</p><p>因此，多年来，在日本的年轻人中逃避工作的倾向逐渐严重。比如，在年轻人中，不想认真干活，靠打零工糊口，无固定工作的自由职业者急速增加，这已经成为一个很大的社会问题。</p><p>另一方面，由于泡沫经济的消极影响，在理应承担起当今社会责任的这一代年轻人中，将“流汗工作"视为美德的社会风气逐渐淡薄，而不劳而获，想靠投机赚大钱的恶劣风潮却在逐年增强。</p><p>这种劳动观、价值观的变化，伴随日本劳动人口的减少，再加上人们劳动热情的降低，不仅招致日本国际竞争力的下降，而且对日本这个国家的成长和发展也投下了阴影。</p><p>这样下去，日本将会国将不国。所以，就在今天，必须对劳动，对工作，从根本上重新审视。</p><p>将劳动、工作的目的和意义及其方法告诉年轻的一代。抱着这样的使命感我执笔直书。</p><p>我认为，上述观点对于取得惊人的经济发展的中国而言，也具有同样的参考意义。据说，中国在伴随经济增长而来的急剧的社会变动中，产生了一些不好的社会现象。今后中国要持续高速的经济增长，要成为全球第一经济大国，那么，如何在整个社会确立正确的劳动观、价值观，将是一个不可等闲视之的巨大的课题。</p><p>本书的内容不过是从我粗浅的人生经验和思索中所产生的质朴的“劳动观”。但同时，它又是从我70余年的切身经历中所获得的不可动摇的“信念”，也可以说它是被实践证明了的正确的“哲学”。</p><p>表述我“劳动观”的这本书，如果能成为肩负中国未来的年轻人前进的路标，我将感到莫大的荣幸。自古以来中国人一贯真挚地追求正确的为人之道，这是值得中国人高度自豪的。如果本书中的观点能为中国人广泛接受，也将是我的望外之喜。</p><p>前言幸福“工作法”</p><p><strong>为了度过有价值的人生</strong></p><p>日本这个国家迎来了一个“没有方向的时代”。一方面，人们找不到前进的明确指针;另一方面，人们又面临许多过去未曾碰到过的问题:社会趋向于少子高龄化，人口减少，地球环境恶化等。同时我们看到，人们的价值观本身也陷入了混乱之中。</p><p>对于人生中费时最多的“劳动”的观念扭曲，以及对于“工作”的认识改变，正是价值观混乱的表现。</p><p>“人为什么要工作?”“劳动究竟为了什么?”现在多数人已经丧失了对工作目标和意义的正确认识。</p><p>讲述如何提高日常工作效率的技术，以及操作指南之类的书籍汗牛充栋，但是，工作的根本意义究竟在哪里?这么重要的问题却无人探讨。</p><p>在今天的年轻人中，有一种明显的倾向在滋长，那就是不喜欢工作，厌恶劳动，并且还会尽可能地逃避工作的责任。</p><p>有的人把“努力工作”“拼命劳动”看得毫无意义，他们甚至对积极工作的人报以冷笑和鄙视。</p><p>还有许多人热衷于股票买卖，憧憬于“轻轻松松发大财”。很多人创办风险企业，其目的也只是想通过上市一攫千金，然后年纪轻轻就脱离工作、享受生活。把这些当作人生目标的人正在日益增多。</p><p>与此同时，社会上还出现了恐惧劳动的倾向。</p><p>刚踏进社会的年轻人，把工作视作剥夺人性的苦役。甚至很多人干脆不求职、不工作，而选择在父母的庇护之下混日子。要不然就不务正业，靠打零工糊口。无固定工作的自由职业者的增加，是劳动观念、工作意识改变所带来的必然结果。</p><p>把工作看成不得不干的“必要之恶”，这种观念在私下里似乎已经成了人们的常识。</p><p>心里还是不愿工作，但为了要吃饭又不得不干，抱着这种心态，很多人都希望工作轻松而又能多赚钱。不想受企业的约束，只重视私人活动的时间，只想埋头于个人兴趣，这样的生活方式，在富裕的时代背景之下，深深渗透到了年轻人群体当中。</p><p>因此，今天许多人已经丧失了对“工作”的根本意义的正确认识，不愿好好地面对它。</p><p><strong>对这样的人，我想问一句:难得来这世上走一回，你的人生真的有价值吗?</strong></p><p>对，我不仅要问，而且无论如何，我要把自己对于“工作”的正确认识告诉给这些年轻人。</p><p>理解工作的意义，全身心投入工作，你就能拥有幸福的人生。</p><p>在这本书里，通过讲述我对“工作”的思考和体验，我将告诉大家，劳动可以给你的人生带来多么巨大的收获。</p><p>工作是“万病良药"我认为工作是对万病都奏效的灵丹妙药，通过工作你可以克服各种困难和考验，让自己的人生时来运转。</p><p>我们的人生是由种种苦难构成的。</p><p>苦难既不是我们希望的，也不是我们招惹来的，但意想不到的苦难却接踵而来。苦难和不幸袭击我们、折磨我们，让我们为自己的命运而怨恨，甚至灰心丧气，稍一气馁便被苦难击垮。</p><p>然而“工作”却隐藏着一种伟大的力量，它能够帮助你战胜命运中的苦难，给人生带来光明和希望。回顾我自己的人生，这个真理昭然若揭。我年轻时经历过种种挫折:先是初中升学考试失败，接着患上肺结核，徘徊于死亡边缘。后来拖着孱弱的身体第二次考初中又落榜，同时因为战乱家屋又被烧成废墟。</p><p>在我15岁以前幼小的心灵中，接连的厄运让我几度丧失对生活的希望，然而考验还在继续。</p><p>考大学及后来找工作的经历仍是不断地让我失望伤心。第一志愿的大学医学部没能考上，只进了一所地方大学的工学部。于是，我只有从懊恼中振奋精神，拼命用功读书。学校给了我很高的评价，这给了我极大的鼓励，然而毕业后去大企业求职应试却又屡遭挫折。</p><p>最后由老师介绍，总算进了京都一家制造电瓷瓶(装在铁塔或电线杆上支撑电线的绝缘陶瓷器具)的小公司。这是一家濒临破产的亏本企业，上班后第一个月的工资就没有如期发放，公司给我们的答复是“请再等等”</p><p>这一年我23岁，我哀叹自己的命运，心中苦恼:“为什么不幸和苦难一次又一次降临到我的身上，我今后的人生将会是怎样的呢?”然而，仅仅因为一件事情，被残酷命运捉弄的我的人生，居然发生了彻底的、戏剧性的变化，从此我开始走出人生新的一步。</p><p>这件事情就是我改变了自己的想法，开始拼命投入工作。</p><p>不可思议的事情发生了，我人生的齿轮一过去一直在苦难和挫折的方向上运转，现在开始朝着幸运的方向转动了。此后，我的人生进入崭新的状态，充满希望，不断成功。</p><p>读者当中也许有很多人每天都在工作，却不理解工作的真正意义，因而天天烦恼、痛苦、叹息。我希望他们务必懂得:“劳动”是“医治百病的良药”;工作能够克服人生的磨难，让你的命运获得转机!</p>'
  },
  '2026-07-03': {
    chapter: '第3天：干法 · 第1章：磨炼灵魂，提升心志——为什么要工作',
    content: '<p><strong>第1章磨炼灵魂，提升心志:为什么要工作</strong></p><p>::理解工作的意义，全身心投入工作，你就能拥有幸福的人生。</p><p>::日复一日勤奋地工作，可以起到锻炼我们的心志、提升人性的了不起的作用。</p><p>::对今天做过的事，老老实实地进行反省，发誓从明天起认真改进。</p><p>一心一意投身于工作，聚精会神，孜孜不倦，精益求精，这本身就是磨炼人格的修行，这样做就能磨炼我们的心志，促进我们成长。而通过这种心志的提升，我们每个人的人生价值也能随之提升。</p><p>我的人生中曾遭遇过无数的困难和挫折，但恰如奥赛罗棋盘上的黑棋一下子返归白棋一样，困难和挫折后来都变为成功的基础。现在回顾起来，我感觉到，当初认为痛苦的事情后来全都给我带来了好结果。</p><p><strong>我们为什么而工作</strong></p><p>为什么而工作?工作是为了获得生活的食粮。很多人是这么想的。他们认为，为了吃饭获取报酬，就是劳动的价值，就是工作首要的意义。</p><p>诚然，为了获得生活的食粮，是工作的重要理由之一，这没有错。然而，我们拼命工作，难道仅仅为了吃饭这一个目的吗?</p><p>人工作的目的是为了提升自己的心志一这是我的观点。</p><p>人工作的目的是为了提升自己的心志一这是我的观点。</p><p>提升心志是一件非常困难的事情，有的僧人经历长期严格的修行，也未必能够做到。但是，在工作中却隐藏着可以达到这个目的的巨大力量。</p><p>工作的意义正在于此。</p><p>日复一日勤奋地工作，可以起到锻炼我们的心志、提升人性的了不起的作用。</p><p>我曾在一个电视访谈节目中听过一位修建神社的木匠师傅的话，很受感动。他说:</p><p>树木里宿着生命。工作时必须倾听这生命发出的呼声一在使用千年树龄的木料时，我们工作的精湛必须经得起千年日月的考验。</p><p>这种动人心魄的语言，只有终身努力、埋头工作的人才说得出来。</p><p>木匠工作的意义在哪里?它的意义不仅在于使用工具修筑漂亮的房屋，不仅在于提高木工技能，更在于磨炼人的心志，塑造人的灵魂一我在这位师傅的肺腑之言中听出了这样的意蕴。</p><p>他已70多岁，只有小学毕业，职业生涯一直就是修建神社。几十年间只从事这一项工作，又苦又累，不胜厌烦，有时也想辞职不干，但他还是承受和克服了这种种劳苦，勤奋工作，潜心钻研。在这样的过程中孕育了他厚重的人格，所以才能说出如此语重心长的人生体验。</p><p>像这位木工师傅一样，将自己的一生奉献给一门职业，埋头苦干，孜孜不倦，这样的人最有魅力，也最能打动我的心弦。</p><p>只有通过长时间不懈的工作，磨砺了心志，才会具备厚重的人格，在生活中沉稳而不摇摆。每次与这样的人接触，就能引起我的重新思索，思索工作这一行为的神圣性。</p><p>只有通过长时间不懈的工作，磨砺了心志，才会具备厚重的人格，在生活中沉稳而不摇摆。</p><p>同时我衷心希望，生活在现代的年轻人，你们承担着对未来的责任，在工作中切不可好逸恶劳，不要逃避困难。希望你们秉持一颗纯朴的心，全身心地投入到工作中去。</p><p>有时你们或许会感到疑惑:“工作到底是为了什么?”每当此时，希望你们记住下面这句话:</p><p>工作能够锻炼人性、磨砺心志，工作是人生最尊贵、最重要、最有价值的行为。</p><p><strong>工作造就人格</strong></p><p>想好好活，就得好好干，这一点很重要。</p><p>工作就是提升心志、磨炼人格的“修行”。这样说并不过分。</p><p><strong>大约在十年前，我和一位德国领事对谈时，听到这样的话:</strong></p><p>劳动的意义不仅在于追求业绩，更在于完善人的内心。</p><p>工作最重要的目的在于通过工作来磨炼自己的心志、提升自己的人格。就是说，全身心投入当前自己该做的事情中去，聚精会神，精益求精。这样做就是在耕耘自己的心田，可以造就自己深沉厚重的人格。</p><p>工作就是提升心志、磨炼人格的“修行”。这样说并不过分。</p><p>“工作造就人格”，就是要通过每一天认真踏实的工作，逐步铸成自己独立的、优秀的人格。这样的事例，从古至今，从东方到西方，不胜枚举。只要翻开伟人们的传记，随处可见。</p><p>凡是功成名遂的人毫无例外地，都是不懈努力，历尽艰辛，埋头于自己的事业，才取得了巨大成功。通过艰苦卓绝的努力，在成就伟大功绩的同时，他们也造就了自己完美的人格。</p><p><strong>有这样一则小故事值得玩味:</strong></p><p>在南太平洋新不列颠岛上，有一个未开化部落的村庄，那里的人们都认同“劳动是美德”这一观点。在他们的生活中渗透着一种纯朴的劳动观:“认真劳动能塑造美丽心灵”，“美好的工作产生于美好的心灵”。</p><p>在这个村落里，主要的劳动内容是烧荒式的农业，作物是甘薯。</p><p>在那里，根本不存在“工作是苦役”这样的观念。村民们通过工作追求的目标是:“工作得到的美的成果”和“人格的陶冶”，就是要把工作做得完美，并由此磨炼自己的人格。</p><p>村民们互相评论各自田地的整修情况、作物的长势以及泥土的气味，气味好闻的被夸为“丰登”，气味难闻的则被贬为“不毛”。</p><p>经过这样一番评价，田地耕作得精细的人就会被称为“人格高尚的人”，会受到全村人的尊敬。</p><p>也就是说，这个村子里的村民是通过劳动的成果一田地是否整齐，作物是否丰收，来判断一个人的人格的。田头工作出色、工作成果显著的人，就被认为是优秀的人，是人格高尚的人。</p><p>对他们来说，劳动是获取生活食粮的手段，但同时又是磨炼心志、修炼人格的手段。“出色的工作唯有出色的人才能完成”，这种简朴却切中肯綮的劳动观在原始社会中普遍存在。</p><p>而在给人类带来近代文明的西方社会里，从基督教思想起源，“劳动乃是苦役”这个观点相当普及。这一点在《圣经》一开头的亚当和夏娃的故事中就表达得十分清楚。</p><p>他们是人类的祖先，因为偷吃了上帝禁食的果实，被赶出伊甸乐园。原来在乐园里他们不需要劳动，但遭放逐后，为了得到食物，他们不得不怀着痛苦的心情开始劳作。</p><p>在这个众所周知的故事里，人们是为了抵赎自己的“原罪”，才不得不接受“劳动”这种惩罚。于是劳动在人们的意识里成了一种负面的、否定的形象。</p><p>也就是说，对于欧美人而言，劳动本是一种充满痛苦、让人厌恶的行为，因而产生了近代的劳动观:工作时间应该尽量缩短，工作报酬应该尽量增加。</p><p>然而在日本原本不存在这样的劳动观。不仅如此，过去的日本人，不管从事何种职业，总是从早到晚辛勤地劳动。他们认为劳动虽然艰辛，但却能带来喜悦感、自豪感，并能让人明白生活的意义，劳动是高贵的行为。</p><p>有许多优秀的工匠，只要专心磨炼技能，制造出赏心悦目的产品，他们就会感到有一种说不出的自豪和充实;因为他们认为劳动是既能磨炼技能，又能磨炼心志的修行，他们把劳动看作自我实现、完善人格的“精进”的道场。可以说，多数日本人都曾经抱有这种有深度的、正确的劳动观和人生观。</p><p>然而，近年来，随着社会逐步西方化，日本人的劳动观发生了巨大的变化。这就是本章开头所提到的，劳动是为了获得生活的食粮，劳动是“必要之恶”。因而许多日本人把劳动看作一项单纯的苦差事，甚至厌恶劳动，厌恶工作。</p>'
  },
  '2026-07-04': {
    chapter: '第4天：干法 · 第1章：磨炼灵魂，提升心志——为什么要工作（2）',
    content: '<p><strong>“极度”认真地工作能扭转人生</strong></p><p>话虽这么说，但我原本也不是一个热爱劳动的人，而且我曾经认为，在劳动中要遭受苦难的考验简直是不能接受的事。</p><p>孩童时代，父母常用鹿儿岛方言教导我:“年轻时的苦难，出钱也该买。”</p><p>我总是反驳说:“苦难?能卖了最好。”那时的我还是一个出言不逊的孩子。</p><p>通过艰苦的劳动可以磨炼自己的人格，可以修身养性，这样的道德说教，同现在大多数年轻人一样，我也曾不屑一顾。</p><p>但是，大学毕业的我，在京都一家濒临破产的企业一松风工业就职以后，年轻人的这种浅薄的想法就被现实彻底地粉碎了。</p><p>松风工业是一家制造绝缘瓷瓶的企业，原是在日本行业内颇具代表性的优秀企业之一。但在我入社时早已面目全非，迟发工资是家常便饭，公司已经走到了濒临倒闭的边缘。</p><p>业主家族内讧不断，劳资争议不绝。我去附近商店购物时，店主用同情的口吻对我说:“你怎么到这儿来了，待在那样的破企业，老婆也找不到啊!"</p><p>因此，我们同期入社的人，一进公司就觉得“这样的公司令人生厌，我们应该有更好的去处”。大家聚到一块儿时就牢骚不断。</p><p>当时正处于经济萧条时期，我也是靠恩师介绍才好不容易进了这家公司，本应心怀感激，情理上就更不该说公司的坏话了。然而，当时的我年少气盛，早把介绍人的恩义抛在一边，尽管自己对公司还没做出任何贡献，但牢骚怪话却比别人还多。</p><p>入公司还不到一年，同期加入公司的大学生就相继辞职了，最后留在这家破公司的除了我之外，只剩一位九州天草出身的京都大学毕业的高才生。我俩商量后，决定报考自卫队干部候补生学校。结果我俩都考上了o</p><p>但入学需要户口簿的复印件，我写信给在鹿儿岛老家的哥哥，请他寄来，等了好久毫无音讯。结果是那位同事一个人进了干部候补生学校。</p><p>后来我才知道，老家不肯寄户口簿复印件给我，是因为我哥哥当时很恼火:“家里节衣缩食把你送进大学，多亏老师介绍才进了京都的公司，结果你不到半年就忍不住要辞职。真是一个忘恩负义的家伙。”他气愤之余拒不寄送复印件。</p><p>最后，只剩我一个人留在了这家破败的公司。</p><p>只剩我一个人了，我非常苦恼。</p><p>我那时候想，辞职转行到新的岗位也未必一定成功。有的人辞职后或许人生变得更顺畅了，但也有的人人生却变得更加悲惨了。有的人留在公司，努力奋斗，取得了成功，人生很美好;也有的人虽然留任了，而且也努力工作，但人生还是很不如意。所以情况因人而异吧。</p><p>究竟离开公司正确，还是留在公司正确呢?烦恼过后我下了一个决断。</p><p>正是这个决断迎来了我“人生的转机”。</p><p>只剩我一个人孤零零地留在这个衰败的企业了，被逼到这一步，我反而清醒了。“要辞职离开公司，总得有一个义正词严的理由吧，只是因为感觉不满就辞职，那么今后的人生也未必就会一帆风顺吧。”当时，我还找不到一个必须辞职的充分理由，所以我决定:先埋头工作。</p><p>不再发牢骚，不再说怪话，我把心思都集中到自己当前的本职工作中来，聚精会神，全力以赴。这时候我才开始发自内心并用格斗的气魄，以积极的态度认真面对自己的工作。</p><p>从此以后，我工作的认真程度，真的可以用“极度”二字来形容。</p><p>在这家公司里，我的任务是研究最尖端的新型陶瓷材料。我把锅碗瓢盆都搬进了实验室，睡在那里，昼夜不分，连一日三餐也顾不上吃，全身心地投入了研究工作。</p><p>这种“极度认真”的工作状态，从旁人看来，真有一种悲壮的色彩。</p><p>当然，因为是最尖端的研究，像拉马车的马匹一样，光用死劲是不够的。我订购了刊载有关新型陶瓷最新论文的美国专业杂志，一边翻辞典一边阅读，还到图书馆借阅专业书籍。我往往都是在下班后的夜间或休息日抓紧时间，如饥似渴地学习、钻研。</p><p><strong>在这样拼命努力的过程中，不可思议的事情发生了!</strong></p><p>大学时我的专业是有机化学，我只在毕业前为了求职，突击学了一点无机化学。可是当时，在我还是一个不到25岁的毛头小伙子的时候，我居然一次又一次取得了出色的科研成果，成为无机化学领域崭露头角的新星。这全都得益于我专心投入工作这个重要的决定。</p><p>与此同时，进公司后要辞职的念头以及“自己的人生将会怎样”之类的迷惑和烦恼，都奇迹般地消失了。不仅如此，我甚至产生了“工作太有意思了，太有趣了，简直不知如何形容才好”这样的感觉。这时候，辛苦不再被当作辛苦，我更加努力地工作，周围人们对我的评价也越来越高。</p><p>在这之前，我的人生可以说是连续的苦难和挫折。而从此以后，不知不觉中，我的人生步入了良性循</p><p>环。</p><p>不久，我人生的第一次“大成功”就降临了。</p><p><strong>那些智慧进发的瞬间</strong></p><p>加入该公司后过了大约一年，我接受了一项新任务，是研究开发一种叫作“镁橄榄石”的新材料。“镁橄榄石”是一种新型陶瓷，绝缘性能好，特别适合于高频电流，据说用作电视机显像管的绝缘材料最为理想。与当时另一种主要材料滑石瓷相比，“镁橄榄石”的优势非常明显，应用已呈爆发式的增长。</p><p>但这种材料在合成成型方面却没有成功的先例。无论对我个人而言，还是对公司而言，“镁橄榄石”的研究开发是迫在眉睫又极具挑战性的。企业里没有什么像样的试验设备，我日以继夜，反复试验，结果总是不理想。我昼夜不分、苦思冥想、不停地试验，几乎把自己逼入了“痴狂”的状态，最后总算合成成功了。</p><p>后来我才得知，成功合成“镁橄榄石”的除我之外，只有美国的通用电气(GE)一家。所以，我开发的“镁橄榄石”引起了广泛的关注。</p><p>用高频绝缘性能特别优良的“镁橄榄石”作为材料，最早开发成产品的是“U字形绝缘体”。这是来自“松下电子工业”的订单，它是松下电器产业集团中负责显像管生产制造的一个部门。当时正逢日本家庭显像管式电视机开始普及，“U字形绝缘体”作为电子枪中的绝缘零件，使用我开发的“镁橄榄石”最理想不过Jo</p><p>“U字形绝缘体”开发中最棘手的问题是原材料“镁橄榄石”粉末如何成型。这种粉末非常松脆，无法成型。像做面条一样，需要有黏性的材料。过去都是添加黏土，但黏土总是含有杂质。怎样才能解决这个“黏性”的问题，我每天思考、试验，绞尽脑汁，百思不得其解。有一天，令人难以置信的事情发生了。</p><p>那天，我一边想着这个难解的“黏性”问题，一边走进实验室。突然，我被某个容器绊了一下，差点跌倒，下意识一看脚下，鞋上沾上了实验用的松香树脂。</p><p>“谁把松香搁在这个地方!”正当我叫喊道，而就在那一瞬间:“就是它!”一个念头在我脑海里闪过。</p><p>我立即架起一个简单的锅，将陶瓷原料和松香放入锅中，一边加热一边混合，然后放进模子里成型。成型成功了，将它放进高温炉里烧结时，作为黏结剂的松香都被烧尽挥发，做出的成品“U字形绝缘体”中就不留任何杂质了。</p><p>那么令人头痛的难题居然一下子就解决了。</p><p>今天回头来看，那一瞬间只能称为“神的启示”。</p><p>当然，实际上想出这个解决方法的是我自己，然而，看到我那样拼命地工作，那样苦苦思索，神都看不过去了，神可怜我，赋予了我智慧。我想事情只能这样来解释。</p><p>因为类似的经验积累了许多次，所以后来遇到难题时，我就会对员工们说:“要让神愿意伸手援助，你就必须刻苦钻研，全身心投入工作。这样的话，不管面临多么困难的局面，神一定会帮你，事情一定能成功。”</p><p>此后，我开发的“U字形绝缘体”成为制造电视机显像管必不可少的部件，我们公司接到了松下电子工业的大量订单。就是这个产品让摇摇欲坠的公司有了起死回生的希望，全公司的期望集中到我一个人身上。</p><p>可以说，这时的技术和业绩也奠定了日后京瓷公司发展的基础。而且这个“最初的成功体验”让我悟到</p>'
  },
  '2026-07-05': {
    chapter: '第5天：干法 · 第1章：磨炼灵魂，提升心志——为什么要工作',
    content: '<p><strong>一个重要的道理:</strong></p><p>即使在苦难当中，只要拼命工作，就能带来不可思议的好运。</p><p>“那家伙真可怜。”那时周围的人都这么说。我想人有一个时期处在这种不幸的境遇里也未必是坏事。</p><p>冬天越寒冷，樱花就开得越烂漫。人也是一样，不体验痛苦和烦恼，就很难有大的发展，就不会抓住真正的幸福。</p><p>我的人生中曾遭遇过无数的困难和挫折，但恰如奥赛罗棋盘上的黑棋一下子返归白棋一样，困难和挫折后来都变为成功的基础。现在回顾起来，我感觉到，当初认为痛苦的事情后来全都给我带来了好结果。</p><p>这么想来，人生中的困难和挫折，正是我人生的起点，或许也正是我最大的“幸运”。</p><p>比如，我不幸进入了连年亏损的松风工业公司，同期来的大学生中只剩下我孤零零一个人的时候，“稻盛君真可怜，大学里很用功，成绩这么好，却只能待在那样的破公司里，运气太差，他的人生今后不知会怎样呢。”朋友们这么评价我，不知是同情还是嘲笑。</p><p>看到同事们一个个凭各自的本领开拓进取，自己却无处可去，只能一个人龟缩在这倒霉的公司里一一种绝望感让我几乎精神崩溃。</p><p>但是，现在想来，正是这种不幸或考验教我懂得，只有拼命工作才能给人生带来好运。从这个意义上说，苦难和挫折是神赐予我的最好礼物。在逆境中坚持认真工作，拼命努力，我现在所有的成功都是建筑在这个基础之上的。</p><p>如果不经历苦难和挫折，考进了名校，就职于大企业，我的人生就完全不同了。</p><p>不管是顺境也好、逆境也好，不管自己处在何种境遇，都要抱着积极的心态朝前看，任何时候都要拼命工作，持续努力，这才是最重要的。</p><p><strong>乍看的不幸，实际上是幸</strong></p><p>拼命工作会给人生带来意想不到的、美好的未来，即使这个道理你理解了，懂得了，但因为人本性中就有好逸恶劳的倾向，所以“工作令人生厌”“能不工作最好”这种念头时不时还会冒出来。</p><p>本来人这种动物，如果放任不管，就会流于安逸，只要可能就总想逃避苦难。这种基于人的本性、追求安乐的习性，我想不管是我们这些成长于战争年代的人，还是现代和平富裕时代的年轻人，基本上并没有什么区别。</p><p>过去和现在很大的不同是，在迫不得已的我们那个时代，即使你讨厌工作，现实环境也逼得你不得不努力工作。</p><p>我青年时期的日本，社会环境比今天不知严酷多少倍。无论你喜欢不喜欢，如果你不辛勤劳动，就连饭也吃不上。</p><p>另外，当时也很难像现在这样，选择自己喜欢的工作、寻找适合自己特点的职场。那时我们没有选择职业的机会，只能无条件地继承父母的工作，或者是一有就职的机会，就不管什么工作，先做了再说。这些情形在当时是理所当然的，而且一旦进入了某家公司，想要辞职也不那么容易，因为社会舆论不支持你这么做。也就是说，工作，在一家单位连续地工作，与你本人的意愿无关，而是社会的需要，或者说是你的义务。在这中间几乎没有你个人裁量和挑选的余地。</p><p>这样的事情在今天看来，似乎很不幸，但实际上这或许正是幸事也未可知。因为，在迫不得已的、辛勤的工作过程中，人们在不知不觉中就能获得人生的“万病良药”。</p><p>就是说，即使你讨厌工作，但又不得不努力工作，那么在努力工作的过程中，你脆弱的心灵就能得到锤炼，你的人格就能得到提升，你就能抓住幸福人生的契机。</p><p><strong>努力工作的彼岸是美好人生</strong></p><p>在现在这个和平富裕的年代，强迫劳动已经消失了。因此，在这样的时代，不好好工作、懒懒散散过日子，会给人生带来什么呢?我们应该认真思考。</p><p>假设你中了彩票，得到了一大笔钱，足够你玩乐一辈子。但你必定会感觉到，这样的幸运并不能带给你真正的幸福。</p><p>没有目标，不做工作，每天吃喝玩乐，如果长期持续这种无聊的生活，你不但不会成长，而且会丧失自己人性中那些美好的东西。长此以往，你与家庭、朋友的关系就会恶化，你将找不到人生和工作的意义。</p><p>获得心中快乐的前提是劳动。每天认真工作，努力获得回报，才能让你感受到人生的快乐和时间的可</p><p>贵。</p><p>拼命工作的背后隐藏着快乐和欢喜，正像漫漫长夜结束后，曙光就会到来一样。欢乐和幸福总会从辛苦的彼岸露出它优美的身姿，这就是劳动人生的美好。</p><p>在距今40年前，京瓷公司首次在股票市场上市。之前的辛苦努力获得了社会的认可，同时自己赤手空拳创建的公司进入了一流企业的行列，我沉浸在无限的感慨之中。</p><p>于是就有人劝我从此好好玩乐，过轻松愉快的生活，他们说:“反正资产也有了，从现在开始不妨放松休假，通过兴趣和余暇寻找快乐，你看怎么样?</p><p>的确，最近有些风险企业的经营者们，依靠自己的才能发展了事业，股票很快上市。他们将自己的原始股票在市场上出售，获得了巨额财富，尽管只有三四十岁，就已开始考虑退休了。</p><p>京瓷上市时，我所持有的原始股还一股未抛，而发行新股所获的利润全部归公司所有。当时我还不到40岁，但我思考的是趁上市的机会“从今以后得更加努力地工作”。</p><p>上市后，我不仅要继续为员工及其家属谋福利，还要为普通投资者的幸福做更多事。不仅不能休闲放松，我负的责任还将更大、更重。</p><p>我认为，上市并不是终点，只是新的起点，企业从此以后必须更好地发展。所以在上市时，“回归创业的初衷，哪怕汗流浃背，哪怕沾满尘土，让我们同心协力加油干!”我一边鼓励员工，一边也在自己心中重新下定了决心。当初的这些情景至今仍记忆犹新。</p><p><strong>坚持“愚直地、认真地、诚实地"工作</strong></p><p>人很容易骄傲自大，因为人是一种充满烦恼的动物。人若想要提升心志，重要的是要抑制自己的邪恶之Lo</p><p>人的烦恼据说有108种之多。</p><p>其中“欲望”“恼怒”“愚痴”这三者都是卑怯之心，是让人陷于烦恼的最厉害的东西。它们纠缠于人的内心，要驱赶也驱赶不走。释迦牟尼把这三者称为“三毒”，它们是将人的行动导向错误道路的万恶之源。</p><p>“想获取比别人更多的金钱”“想得到比别人更高的评价”一无论谁的心里都潜伏着这样的欲望。当这种欲望得不到满足时，人们就会“恼怒”。“为什么这么不如意?”人们接着就会发泄“愚痴”和不满。人是不幸的动物，生活中总是被这“三毒”支配。</p><p>然而，人生在世又少不了这“三毒”，它们如果根本不存在，人就无法生存。因为人有血肉之躯，为了生存，这“三毒”又是必要之心，是自然赋予人的本能。比如，为了维持自己的生存，人要满足自己的食欲，对攻击自己的敌人要表达愤怒，要在达不到自己希望的状态时发泄不满，这些都无法戒除。</p><p>但这“三毒”却切不可过度。唯有拼命地“工作”。</p><p>“三毒”不能完全排除，但却必须做出努力让毒素稀释。而要达到这个目的，可以说独一无二的方法，就是拼命地“工作”。</p><p>“愚直地、认真地、专业地、诚实地”投身于自己的工作，长此以往，人就能很自然地抑制自身的欲望。此外，热衷于工作，还能镇住愤怒之心，也会无暇发牢骚，而且日复一日努力工作，还能一点一点提升自己的人格。</p><p>从这个意义上说，“努力工作”就类似于修行。而实际上，释迦牟尼提倡的进入悟境的六项修行一“六波罗蜜”，其中之一的所谓“精进”就是拼命地工作。</p><p>一心一意投身于工作，聚精会神，孜孜不倦，精益求精，这本身就是磨炼人格的修行，这样做就能磨炼我们的心志，促进我们成长。而通过这种心志的提升，我们每个人的人生价值也能随之提升。</p><p><strong>要每天反省</strong></p><p>在人生中，提升心志这件事，说起来容易做起来难，要实践并不简单。</p><p>在人生中，提升心志这件事，说起来容易做起来难，要实践并不简单。</p><p>说来可悲，不管人怎样一心思善、行善，但不知不觉中仍会做出出格的举动。一般人往往做不到把思善、行善贯彻始终，除非真正的圣人君子。</p><p>在这一点上，我虽这么说了，但我同样也做不到。</p><p>为了自我诫勉，为了不让邪恶之心轻易地控制自己，不知何时起，我就采用了一种自诫的仪式。当骄傲自满、自以为是这一类邪恶的念头在心中冒头时，我就立即给自己一个反省的机会。我年轻时就开始做这种努力。</p><p>例如，稍稍表现出傲慢，或者吹了牛，或者自己没有尽到责任时，夜里回到家里以后，或者第二天清晨起床后，就会对着洗脸的镜子，严厉地斥责自己:“混账!</p><p><strong>然后又反省说:“神啊，对不起!"</strong></p><p>就这样自我诫勉，内心宣誓从明天起继续保持谦虚的态度，改正错误，重新开始。我从年轻时起就养成了这样反省的习惯。这种习惯起到了修正轨道的作用，使我至今的人生，没有脱轨，仍能勇往直前。</p><p>重要的是，要努力去思善、行善，而同时一旦动了不好的念头，做了不好的事情，就要虚心反省。通过反省我们就能一步一步向上提升。</p><p>对今天做过的事，老老实实地进行反省，发誓从明天起认真改进。这样度过反省的每一天，我们不但能避免工作上的失败，而且有利于在人生中提升心志。</p><p>体悟</p><p>磨炼灵魂，就会产生利他之心。</p><p>全神贯注于自己的工作，只要做到这一点，就可以磨炼自己的灵魂，铸就美好的心灵。有了美好的心灵，就会很自然地去想好事，做好事，为社会、为他人着想，并落实在行动中，你的命运就一定会向好的方向转变。</p>'
  },
  '2026-07-06': {
    chapter: '第6天：干法 · 第2章：让自己喜欢上所从事的工作——如何投入工作',
    content: '<p><strong>第2章让自己喜欢上所从事的工作:如何投入工作</strong></p><p>:应该迷恋工作、热爱工作、拥抱工作。</p><p>无论如何，必须得喜欢上自己的工作。</p><p>::对自己的工作、对自己的产品，如果不注入如此深沉的关爱之情，事情就很难做得出色。</p><p>想要成就某项事业，就必须成为能够自我燃烧的人。</p><p>要成为“自燃型”的人，在热爱自己工作的同时，必须持有明确的目标。</p><p>为了顺利推进公司或团队的工作，无论做什么事情，都需要有一个精力充沛的、起核心作用的人物。</p><p>改变“心态”</p><p>我原本也像随处可见的小青年一样，兴趣多变，不善于将心思集中在一件事情上。</p><p>那么，像我这样的年轻人，为什么在50年这么漫长的时间里能够一心一意专注于工作呢?</p><p>那是因为我付出了努力，我让自己喜欢上了自己的工作。</p><p>只要改变“心态”，每个人周围的世界就会发生戏剧性的变化。</p><p>前面已经提及，对于新型陶瓷的研究工作，一开始我并没有什么兴趣。在大学时我专攻的是当时最热门的有机化学，但我想去的公司不肯录用我，所以我不得已才就职于松风工业。这是一家生产绝缘瓷瓶、属于无机化学领域的企业，而研究新型陶瓷也是被分配的、不得不做的工作。</p><p>刚进公司时，我所属的研究室一共只有五六个人，除我之外，其他研究人员都是从事绝缘瓷瓶材料的改良工作的，因为在当时，那才是企业的核心产品。只有我一个人被指定去研究陶瓷的新材料(后来我将它命名为新型陶瓷)，理由则是“将来在电子领域一定会需要高频绝缘材料”。</p><p>这个领域当时还是一个未知的世界，缺乏可靠的研究资料。另外，公司很穷，没有什么像样的实验设备，也没有上司或前辈可以指导我的工作。在这样的环境里，要做到“热爱自己的工作”实在不容易。</p><p>但是辞职转行又没成功，我只好留在这里。于是，我决定改变自己的“心态”。</p><p>“埋头到工作中去!”我努力说服自己。</p><p>即使做不到很快就热爱工作，但至少“厌恶工作”这种负面情绪必须从心中排除。我决定倾注全力先把眼前的工作做好再说。</p><p>现在看来，这就是为了“喜欢工作”而做的努力吧，但是当时的我，对这一点也并没有清楚的认识。</p><p>因为几乎不具备与新型陶瓷相关的基础知识，所以一开始我先去大学图书馆寻找有关的文献资料。那时还没有复印机，我翻阅了过往的行业期刊和学术纪要，发现重要的内容就立即抄写在笔记本上。同时，虽然囊中羞涩，但我还是坚持购买研究所需的书籍。我还向美国陶瓷协会索要论文，那时总是辞典不离手，边看边译。总之，一切都是从获取最基础的知识着手的。</p><p>然后，我依据从这类资料中获得的信息开始做实验，根据实验结果，再去寻求新的理论解释，然后再做实验一不断反复这种细致而踏实的过程，就是我当时的工作。</p><p>在这个过程中，不知从何时起，我深深地为新型陶瓷的魅力所吸引，而且渐渐明白，新型陶瓷中或许隐藏着一个不可思议的、美好的前景。</p><p>“这样的研究，恐怕大学里也不会有吧，或许全世界也只有我一个人在钻研。”这么一想，枯燥的研究也显得熠熠生辉起来。</p><p>开始时，有一半是强迫自己，但不久就变得积极主动起来了，而且喜欢上了这项研究。再后来，就大大超越了喜欢不喜欢这样的层次，感觉到了这项工作所包含的重大意义。</p><p>“天职”不是偶然碰上的，而是由自己亲自制造出来的。</p><p><strong>“迷恋”工作</strong></p><p>热恋中的情人，在旁人看来目瞪口呆的事情，他们却处之泰然。这一点有过恋爱经验的人都能理解。我年轻时虽说一心扑在工作上，但也不曾忽略过这样的感情。</p><p>在创建京瓷以前，在繁忙的工作之余，星期日，有时我会邀请关系亲密的女孩去看电影，看完后送她回家。本来电车可以直达，但有几次我故意提议从前一站就下车，边走边聊，慢腾腾地走了很长的路才将她送回家。</p><p>其实每天工作到很晚，身体应该很疲倦了，然而，走这么长的路我却丝毫不累，而且还非常愉快，劲头十足。</p><p>“有情人相会，千里变一里”，这句话真实地表达了我当时的心情。</p><p>工作也一样，应该迷恋工作、热爱工作、拥抱工作。</p><p>工作也一样，应该迷恋工作、热爱工作、拥抱工作。</p><p>在旁人看来，“那么辛劳、那么艰苦的工作，太可怕了!简直无法忍受，根本无法坚持。”但如果你迷恋这个工作、热爱这个工作，那你就能够承受，一切都不在话下。</p><p>正因为迷恋工作、热爱工作，所以我就能长期坚持艰苦的工作，一以贯之，无怨无悔。</p><p>人就是这样，对于自己喜欢的事情，再辛苦也无怨言，也能忍受。而只要忍受艰苦、不懈努力，任何事情就都能成功。喜欢自己的工作一仅仅这一条就能决定人的一生，我想这么说一点也不过分。</p><p>要想拥有一个充实的人生，你只有两种选择:一种是“从事自己喜欢的工作”，另一种则是“让自己喜欢上工作”。一个人能够碰上自己喜欢的工作的概率，恐怕不足千分之一、万分之一。而且，即使进了自己所期望的公司，要能分配到自己所期望的职位、从事自己所期望的工作，这样幸运的机会几乎没有。</p><p>大多数人初出茅庐，只能从“自己不喜欢的工作”开始。</p><p>但问题是，多数人对这种“不喜欢的工作”抱着勉强接受、不得不干的消极态度，因此对分配给自己的工作总是感到不满意，总是怪话连篇、牢骚满腹。这样下去，本来潜力无限、前程似锦的人生只会白白虚度。</p><p>无论如何，必须得喜欢上自己的工作。</p><p>要把“被分配的工作”当成自己的天职，抱有这种心境非常重要。如果你还不肯抛弃“工作是别人要我做的”这种不恰当的意识，就无法从工作的“苦难”中解脱出来。</p><p>与其寻找自己喜欢的工作，不如先喜欢上已有的工作，脚踏实地，从眼前开始。寻找自己喜欢的工作，往往就像寻找一座空中楼阁;与其追求幻想，还不如先爱上眼前的工作。</p><p>只要喜欢了，就能不辞辛劳，不把困难当困难，埋头工作。只要一心一意埋头工作，自然而然就能获得力量。有了力量，就一定能做出成果。有了成果，就能获得大家的好评。获得好评，就会更加喜欢工作。</p><p>这样，良性循环就开始了。</p><p>要想做出成绩，首要的就是运用自己坚强的意志去喜欢工作，除此之外别无他法。只要你这么做了，人生就将硕果累累。</p><p><strong>感动给人注入新的动力</strong></p><p>“热爱工作”“把工作当乐趣”，话虽这么说，但做起来就像僧人艰苦修行一样，并非易事。所以，若只是当苦行僧，一味强调吃苦耐劳而没有快乐，那也很难持之以恒。</p><p>因此，还必须要从工作中寻找快乐。</p><p>我的经验是，当研究工作进展顺利时，就要直率地表达出快乐;当研究成果受到别人的夸奖时，就要诚挚地表示感谢。继而将这种喜悦和感动当作精神食粮，然后继续投入艰苦的工作。</p><p>我想起一件发生在进公司后第二年的事，当时我正在全神贯注地测定实验数据。</p><p>那时，有一位京都名牌高中的毕业生，因家庭原因，不得已当了我的研究助手。他是一位头脑非常聪明的青年。我每天都让他帮助测定实验数据。“这种材料应该具有这样的物理性能吧。”我一边做预测，一边做实验，而由他来测定有关数据。</p><p>我生性就有单纯的一面。也许因为这个原因吧，每当实验测出的数据符合我原先的设想时，我就会高兴得“蹦、蹦”从地上跳起来。</p><p>这时，我的这位助手总是站在一旁用冷冷的目光注视着我。</p><p>有一天，同平时一样，一次实验完后我又开心得跳了起来，并对他说:“喂!你也该高兴啊!”但不料，他说的一席话，犹如一盆冷水从我的头顶浇到脚底。</p>'
  },
  '2026-07-07': {
    chapter: '第7天：干法 · 第2章：让自己喜欢上所从事的工作——如何投入工作（2）',
    content: '<p><strong>他用鄙夷的眼神看着我，说:</strong></p><p>稻盛，说句失礼的话，值得男子汉兴奋得跳起来的事情，一生中也难有几回。但看你的样子，动不动就高兴得手舞足蹈，现在甚至叫我也要同你一起高兴，我是说你轻薄好呢，还是轻率好呢?总之，我的人生观与你不一样。</p><p>当时，我感到后背一阵冰凉。</p><p>确实，可以说他显得非常理性，但我却无论如何接受不了他的观点。只过了一瞬间，我就反驳说:</p><p>你说什么?因为小小的成功就能感到喜悦和感动，这样多好!要想坚持这种枯燥的研究，有了研究成果，就应该真挚地把高兴劲儿表达出来。这种喜悦和感动能给我们的工作注入新的动力，特别是现在研究经费不足、研究环境很差的条件下。要把研究做下去，我们就要为每一步小小的成功而庆祝，这样才能给我们增添新的勇气。所以不管你说我轻薄也好，轻率也好，今后我照样要为我的每一个小小成功而开心，并由此把工作不断向前推进。</p><p>参加工作才两年，就能讲出这么一番道理，我颇为自己感到骄傲。可惜我这些话却不为我的助手所理解。两年后，他悄然辞职，离开了公司。</p><p>如果当初他能理解我说的并把它当作动力，更加努力地工作。那结果将会怎样呢?</p><p>年轻的读者们，希望你们在工作中为自己的小小成功感到欣喜。要抱有一颗善被感动的心，要诚挚地对待生活。请把感动带来的能量当作动力，更加努力地工作!这就是在漫长的人生征途中顽强生活的最好方法，也是我不渝的信念。</p><p><strong>抱着产品</strong></p><p>“紧抱自己的产品”一每当新产品开发的时候，我总是这么想。</p><p>对自己的工作、对自己的产品，如果不注入如此深沉的关爱之情，事情就很难做得出色。</p><p>“工作是工作，自己是自己”，把“工作”与“自己”分开，让两者保持距离，这是最近年轻人中流行的观点。然而，要做好工作，就应该消除“工作”和“自己”之间的距离，要悟到“自己就是工作，工作就是自己”的程度。这两者密不可分。这个经验相当重要。</p><p>也就是说，连同身心一起，要全部投入工作、热衷于工作，达到与工作“共生死”的程度。如果对工作缺乏如此深沉的挚爱之情，就无法抓住工作的要领。</p><p>京瓷公司在创建后不久，曾制作过用于冷却广播机器真空管的“水冷复式水管”。因为过去生产这种水管的企业中技术人员走了，所以订单就发到了京瓷。</p><p>但是，京瓷以前只做小型陶瓷产品，这种水管尺寸太大(直径25厘米、长50厘米)，用的是老式陶瓷原料，属于陶器，而且要在大管中通小冷却管，结构非常复杂。</p><p>京瓷不具备制造这类产品的设备，也没掌握相关的技术。尽管如此，由于客户盛情难却，我无意中就说出了“行，能做”，把任务应承了下来。既然接了任务，就绝不能失信，无论如何必须把产品做出来。</p><p>为了做好这一产品，我们付出了常人难以想象的辛劳。比如，原料虽然使用与一般陶器相同的黏土，但因为尺寸很大，要让产品整体均匀干燥极为困难。开始时，在成型、干燥的过程中，几乎每次都出现干燥不</p><p><strong>均、因而先行干燥的部分发生裂痕的现象</strong></p><p>可能是因为干燥时间过长吧，于是我尝试在缩短时间上下功夫，但结果仍不理想。我用了各种方法反复试验，最后想出一招，就是在尚未完全干燥、还处于柔软状态的产品表面卷上布条，再向布条上吹雾气，让产品慢慢地、一点一点地干燥。</p><p>但是还有新的问题随之产生。如果产品太大，干燥时间过长的话，产品会因为自身的重量发生变形。为防止变形，我又动了各种各样的脑筋。</p><p>最后，我决定抱着水管睡觉。</p><p>我在炉窑附近温度适当的地方躺下，把水管小心翼翼地抱在胸前，整个通宵我都慢慢转动着水管，用这种方法干燥，同时防止水管变形。</p><p>在旁人看来，这简直是不可思议的。</p><p>但当时我想的是“无论如何也要把这个产品培育成人”，我把它当作自己的孩子，倾注全部的爱。正因为如此，我能够通宵达旦紧抱水管。</p><p>这种让旁人看来心酸流泪的“认真”，让我顺利地完成了“水冷复式水管”的制造任务。</p><p>抱着产品睡，这的确有点不卫生，而且效率不高。在今天这个时代，这种带着泥土气的、低效的做法甚至令人生厌。</p><p>但不管时代怎么进步，干活时自己手上沾泥带油这种方式，虽已不再流行，但若缺乏“抱着自己的产品起睡”那样的爱情，在工作中，就无法从心底品尝到那种成功的欣慰，特别是向新的、艰难的课题发起挑战并战胜它们时。</p><p>倾听“产品的哭泣声”</p><p>如果你能喜欢上你的工作，喜欢上自己制造的产品，那么当某个问题发生的时候，就一定能找到解决问题的方法。</p><p>比如，制造业中，许多时候，产品制成率(合格品相对于投入的全部材料的比率)很难提高。这时候，首先要迈开双腿走进现场，然后，要带着爱意，用谦虚的目光，对产品进行仔细的审视和观察。</p><p>如果你真的仔细倾听，你就能听到好似神之声音的“产品的哭泣声”。</p><p>就是说，产品的问题或机器的故障就会自觉地呈现在你面前。你会听到从产品或机器里发出的窃窃私语:“这样做，你看怎样?”它们会帮你找到解决问题的线索。</p><p>这就仿佛医生为了了解患者的病情，要用听诊器倾听患者的心跳一样。高明的医生只要听到心跳声和心搏数有异，立即就能感知患者身体的异常。</p><p>倾听产品的声音，用心观察产品的细部，就能自然而然地明白问题和差错的原因所在。</p><p>与此相同，倾听产品的声音，用心观察产品的细部，就能自然而然地明白问题和差错的原因所在。</p><p>京瓷的产品大多是电子领域使用的小型零部件，要寻找产品的问题很不容易。</p><p>那时候，就像医生总带着听诊器进诊疗室一样，我去生产现场时总是带着放大镜。我的放大镜由多枚透镜组成，用一枚镜片可以放大5倍，用两枚就可以放大10倍。我经常用这种放大镜对烧制成的产品逐个进行细致认真的检查。只要有一个小小的缺陷，就是不合格的产品。手拿放大镜仔细观察产品，等同于用耳朵静听产品的“哭泣声”。</p><p>如果找到了不合格的产品，就是听到了产品的“哭泣声”，我就会想，“这孩子什么地方疼痛才哭泣呢?</p>'
  },

    chapter: '第8天：干法 · 第2章：让自己喜欢上所从事的工作——如何投入工作（3）',
    content: '<p><strong>它哪里受伤了呢?</strong></p><p>当你把一个个产品完全当作自己的孩子，满怀爱意，细心观察时，必然就会获得如何解决问题、如何提高制成率的启示。</p><p>让我来讲这样一个故事。</p><p>制造新型陶瓷产品的过程是，首先要将原料粉末固定成型，然后放进高温炉内烧结。</p><p>-般陶瓷的烧制温度在1200度左右，而新型陶瓷要在1600度的高温中烧结。当温度达到1600度时，火焰的颜色不是红色的，在观察它的一瞬间，它会呈现一种刺眼的白光。</p><p>将成型的产品放进这样的高温炉中烧结时，产品会一点一点地收缩。收缩率高的，尺寸会缩小两成。而这种收缩在各个方向上并不均衡，若误差稍有不等即成为不合格产品。</p><p>另外，板状新型陶瓷制品烧结时，最初不是这边翘起来，就是那边弯下去，烧出来的产品就像干鱿鱼一样。对于新型陶瓷为什么会弯曲的问题，已有的研究文献上都没有记载。我们只有自己做出各种假设，然后反复试验。</p><p>在这个过程中，我们弄清了一点，那就是原料放进模具加压后，因为上面和下面施压的方式不同，原料粉末的密度也不同。反复试验的结果发现，密度低的下部收缩率大，因而发生翘曲。然而，虽然弄清了翘曲产生的机理，但要做到上下密度均匀却仍然很难。</p><p>这时，为了观察产品究竟是怎样翘曲的，我们就在炉子后面开了一个小孔，通过这个小孔观察炉内的状况，观察在什么温度下产品会弯曲、如何弯曲、它还有什么别的变化等。</p><p>果然，随着温度升高，产品就翘曲起来了。我们改变条件，多次试验，但无论怎样改善，产品还是像一个会动的生物一样，蜷曲起来。</p><p>看着看着，我都快沉不住气了，突然产生一种冲动，就想将手通过观察孔伸进去，从上面将产品压住。</p><p>这当然不可能。炉内是1000多度的高温，如果手伸进去，一瞬间就会烧毁，我当然明白这一点，但无论如何也要解决问题的强烈愿望，让我禁不住就想将手伸进高温炉。</p><p>然而，就在想把手伸进炉内将产品压住的瞬间，突然灵感来了:“在高温烧结时，只要从上面将产品压住，它不就翘不起来了吗?"</p><p>于是，我们就用耐火的重物压在产品上烧制。结果，问题终于圆满解决，平直的产品做出来了。</p><p>这个例子说明，向工作倾注的爱情，就是最好的老师。</p><p>当工作遭遇困境、迷失方向时，它能让你倾听到产品发出的“窃窃私语”，帮你找到解决问题的线索，使你的事业开始新的起飞。</p><p><strong>成为“自燃型"的人</strong></p><p>物质有“可燃型”“不燃型”和“自燃型”三种。</p><p>同样，人也可以分为三种:第一种是点火就着的“可燃型”的人，第二种是点火也烧不起来的“不燃型”的人，第三种是自己就能熊熊燃烧的“自燃型”的人。</p><p>想要成就某项事业，就必须成为能够自我燃烧的人。</p><p>要成为“自燃型”的人，在热爱自己工作的同时，必须持有明确的目标。</p><p>像我这样的经营者整天考虑的就是，公司“应该做这个”“应该那么干才更好”这样的问题。刚参加工作的年轻人也会在自己心中描绘自己将来的梦想，思考我想做怎样的人、我想干怎样的事等问题。</p><p>但是年轻人中偶尔也有这样的人，他们相信虚无主义，总是表情冷漠，怎么也热乎不起来。不管周围的人干得如何热火朝天，他们不仅不燃烧，还给别人泼冷水，他们是冷若冰霜的人。</p><p>遇上这样的人可不好办。</p><p>在企业里，在体育团队里，这种“不燃型”的人哪怕只有一位，整个集体的氛围就会变得沉闷压抑。所以我总是这么想:</p><p>这种不燃型的人大可不必留在公司。我希望同事们都是自燃型的人，不用“点火”，他们也会自动燃烧。</p><p>至少，当燃烧的我接近时，他们是能同我一起燃烧的“可燃型”的人。</p><p>所谓“自燃型”的人，就是从来不会“等别人吩咐了才去干”“因为有了命令才工作”的人，而是“在别人吩咐之前自发去干”的主动积极的人，他们应该都是热爱工作的人。</p><p>要想将自己的能量最大限度地发挥出来，让工作顺利进行，就必须成为热爱工作的“自燃型”的人。</p><p><strong>勇于在“旋涡中心”工作</strong></p><p>为了顺利推进公司或团队的工作，无论做什么事情，都需要有一个精力充沛的、起核心作用的人物。</p><p>这样的人将成为全体人的中心，宛如一股上升的气流自平地而涌起，将全体人员卷入，带动整个组织一起行动。像这样自己主动领头、带动周围的人把工作有声有色地开展起来的人，我把他们称作“在旋涡中心工作的人”。</p><p>无论什么工作，一个人单枪匹马总是很难做好。你一定需要上司、部下以及周围人的协助才能顺利展</p><p>开。</p><p>然而，如果你不是旋涡的中心，只在旋涡四周咕噜咕噜地跟着大家转，就很难体会到工作的真正乐趣。让自己进入旋涡中心，积极地把周围的人裹挟进去，你就能品尝到工作成功之后醍醐灌顶、如露入心的欣喜之情。</p><p><strong>那么，怎样才能卷起旋涡呢?</strong></p><p>一个组织里总有这样的人:没有谁来要求他做，他却自己主动提议要干这干那。面对这样的人，周围的人会说:“那就谁提议谁干好了。”</p><p>不是只有老一辈的人才会这样，年轻人中也有这样的人，他们会召集前辈、师兄们前来，然后向他们提出自己的建议。</p><p>比如，面前有一个课题:这个月的销售额要提高。</p><p>这时，如果一个刚参加工作不久的年轻员工提出:“师兄，董事长讲了要提高销售额，今天下班后，大家集中讨论一下怎么来提高，好不好?"</p><p>如果能开口说出这样的话，那么此人就是“在旋涡中心工作的人”，他就有希望成为团队的领导者。</p><p>敢于说这样的话的人，不是为了装样子给别人看，而是真的热爱工作，有强烈的“问题意识”。只有这样的人，才有这种魄力。</p><p>热爱工作，就不会单纯按照上司的指示办，就会有自己“制造旋涡”的、自主努力的冲动。</p><p>这其实就是上一小节讲的“自燃型”的人，这种人工作上可以取得卓越的成果，人生也会更丰富多彩。</p><p>体悟</p><p><strong>无论遇到什么事情都要感谢</strong></p><p>我们必须用理性把这句话灌输进自己的头脑中。即使感谢的情绪冒不出来，也要说服自己。也就是说，随时都准备说一声“谢谢”，持有这种心态非常重要。</p><p>我常在内心告诫自己，只要实践这一条，就能提升自己的心志，走出幸运的第一步。</p>'
  },
  '2026-07-09': {
    chapter: '第9天：干法 · 第3章：以"高目标"为动力——持续付出不亚于任何人的努力',
    content: '<p><strong>第3章以“高目标”为动力:持续付出不亚于任何人的努力</strong></p><p>::人本来就具备使梦想成真的巨大的潜力。</p><p>::这种每天努力的积累，使我们京瓷公司达到了创业时谁也不曾想到的极高境界。高目标就是促使个人和组织进步的最大动力。</p><p>::不去想，不认真思考，就什么都实现不了。</p><p>每天每日，在拼命思索的过程中，愿望就会渗透到“潜意识”中。这样一来，即使不特别留意，在意想不到的场合，“潜意识”也会发动，给你启示。而且这种启示往往触及事物的核心，使问题一下子得到解决。</p><p>要实现高目标，前提就是持续地怀抱能渗透到“潜意识”的强烈的愿望。</p><p>不断树立“高目标”</p><p>京瓷当时租用位于京都市郊、中京区西京原町的一家配电盘厂仓库，开始了创业，员工只有28名。</p><p>当时，只要一有机会，我就会向员工们说:“我们要成为西京原町第一的企业!达到西京原町第一以后，就要瞄准中京区第一;达到中京区第一以后，就要争取京都第一;达到京都第一以后，就要争取日本第一，再然后，当然就是要达到世界第一。”但是实际上，不要说世界第一了，即使是要达到西京原町第一也绝不是什么简单的事。</p><p>西京原町虽然并不是一个很大的街区，但当时已经有了非常出色的企业。</p><p>从西京原町火车站到京瓷所在地的沿路上，有一家京都机械工具公司，生产修理汽车时用的扳手、扳钳等工具。当时汽车产业正在蓬勃发展，因此，这个工厂从早到晚都机器轰鸣，生机勃勃。</p><p>当时我带着刚刚创业的锐气，怀着稍有懈怠就可能垮台的危机感，带领京瓷夜以继日地拼命工作。但每当深夜我工作结束、路过这家公司时，都看见那里依然灯火通明，很多人都还在工作。</p><p>一个比京瓷不知大多少倍的企业还这么努力，我们要成为“西京原町第一”，谈何容易!</p><p>然而，我仍然会不停地和员工们讲“要成为西京原町第一”的目标，而且，“西京原町第一以后，就要成为中京区第一”一我坚持向所有京瓷人描绘更大的梦想。</p><p>中京区当时已经有了京都有代表性的企业一岛津制作所。这家企业近年还出了诺贝尔奖的获得者，非常有名。要成为中京区第一，就必须超越岛津制作所。</p><p>当然，说这些都没有确凿的把握，而就当时京瓷的规模和实力来说，设立这样的目标简直是自不量力。</p><p>然而，纵使是自不量力的梦想，是看似高不可攀的目标，还是要在胸中牢牢立下这个目标，并坚持不懈地在同仁面前展示这个目标。这一点非常重要。</p><p>纵使是自不量力的梦想，是看似高不可攀的目标，还是要在胸中牢牢立下这个目标，并坚持不懈地在同仁面前展示这个目标。</p><p><strong>为什么?</strong></p><p>因为人本来就具备使梦想成真的巨大潜力。</p><p>“要成为日本第一的企业!”在不断坚持这个想法的过程中，不知从何时起，你就会觉得这是理所当然的事。员工们也一样，会在不知不觉中和你一起共有这个似乎“荒谬的”目标，并为此每天都付出无尽的努力。</p><p>这种每天努力的积累，使我们京瓷公司达到了创业时谁也不曾想到的极高境界。高目标就是促使个人和组织进步的最大动力。</p><p>首先“必须得想”</p><p>我年轻时，听过松下幸之助先生的一次演讲，那次讲话让我印象很深。</p><p>那是有关“水库式经营”的一次讲话。</p><p>京瓷创业之初，在经营方面我是外行，很希望学到成功经营者的经营秘诀。正在这时候，我得到了一份关于松下幸之助先生演讲的通知。被人们称为“经营之神”的这位先生，究竟用什么思想来经营企业呢?我很想知道。提出申请后，我满怀期待，来到了演讲会场。</p><p>当天因为工作关系我迟到了，只能站在会场最后一排，站着听讲。</p><p>经济景气的时候，不要以为经济会一直这样好下去，要考虑到经济不景气的时候你该怎么办。在财务上有余裕的时候就要注意储备，就像水库蓄水一样。经营企业，随时要为经济不景气时做好储备。</p><p>这是幸之助先生讲演的主题。</p><p>大量降雨时，如果雨水全部流入河里，河水泛滥引发洪水，就会招致大灾。如果将河水存进水库，根据情况放流，那么就不仅能控制洪水泛滥，干旱时还可以防止河水断流。这样，雨水就得到了有效利用。所谓“水库式经营”就是将治水的方法应用于经营。</p><p>幸之助先生演讲结束后，开始回答听众们的问题。</p><p>后面有人举手提问:先生所讲，就是经营必须有余裕，我理解了。但是这层意思，松下先生即使不讲，我们中小企业经营者也都明白。正因为我们做不到这一点，才感到苦恼。怎样才能让经营有余裕?如果不教我们具体的方法，我们很难办。</p><p>提问中夹着那么一丝抗议的味道。</p><p>这时，幸之助先生露出相当困惑的表情，他沉默片刻，仿佛是自言自语道:“不，你不想可不行啊。”</p><p>言罢再次沉默。大家以为答非所问，听众中一阵失笑。</p><p>但是，在那一瞬间，我却像受到电击一样，一阵震撼。</p><p>不，你不想可不行啊。”幸之助先生这一句话中包含了万种思量，深深地打动了我的心。</p><p>不，你不想可不行啊。”幸之助先生这一句话想传递的意思是:你说你也想让自己的经营有余裕，但是怎样做才能使经营有余裕，方法千差万别。你的企业一定有适合你企业的做法，我无法教你。但是经营绝对要有余裕，你必须自己认真去想，认真去思考，这种思考是一切的开始。</p><p>“能做到经营有余裕当然最好，但你不教我方法我怎么做到这一点”，如果你仅仅停留在这种程度的思考，那么高目标是绝对不可能实现的。</p><p>经营要有余裕，你真的是这样想的吗?如果你真的这么想，有这样强烈的愿望，你就会千方百计去寻找具体的方法，“水库”就一定能建成。这就是幸之助先生想说的话。</p><p>不去想，不认真思考，就什么都实现不了。</p><p>无论对工作，还是对人生而言，这都是铁则。</p><p>把愿望渗透到“潜意识”</p><p>愿望必定能实现。</p><p>就是说，“无论如何一定要这样做!”人只要有了这种坚强的意愿，愿望就会变成行动，人就会很自然地朝着实现愿望的方向前进。</p><p>但是，这必须是强烈的愿望，而不是随便想想。“不管怎样，无论怎样，一定要这样!”“一定非如此不可!”必须是这种由强烈的意念支撑的愿望或理想。</p><p>废寝忘食，朝思暮想，念念不忘，反复思考，如果你真的做到了整日里只想这一件事，这样的愿望就会渐渐渗透到“潜意识”中。</p><p>所谓“潜意识”是不自觉的、潜藏于人内心深处的意识。平时它不出头，但在无意识中或在某一特殊时刻它会闪现，并发挥不可估量的作用。</p><p>另一方面，日常发挥作用的意识叫“显意识”。</p><p>在人的意识中，“潜意识”的领域之广要大大超过“显意识”。经常反复的体验以及强烈的刺激都会进入“潜意识”。据说如果用好“潜意识”，就有可能在瞬间做出正确的判断。</p><p>这种“潜意识”就是在睡觉时也会起作用的意识，它能将我们的行动引向实现目标的方向。</p><p>我举一个驾驶汽车的例子，你或许就会更容易明白“潜意识”所包含的不可思议的力量。刚开始学习驾车时，我们手握方向盘，脚踏油门或刹车，做每个动作前都要思考，这就是用“显意识”在开车。到后来习惯了，熟练了，就不必一一考虑操作顺序，这时在无意识中也能驾驶了。有时还会一边思考工作上的问题，-边驾车。突然一惊，但随后仍能正常驾驶而不发生事故。</p><p>因为驾驶技术渗透到了“潜意识”，所以即便不使用“显意识”，身体手足也能运作自如。</p><p>在工作中也应该有效使用“潜意识”。比如，“这个工作我想这么做”，当这种意念强烈时，突然就会有灵感闪现。这就来自“潜意识”。</p><p>每天，在拼命思索的过程中，愿望就会渗透到“潜意识”中。这样一来，即使不特别留意，在意想不到的场合，“潜意识”也会发动，给你启示。而且这种启示往往触及事物的核心，使问题一下子得到解决。</p><p>在这种情况下，有时只能用“神的启示”才能解释得通。</p><p>我常有这样的经验。</p><p>比如，京瓷想要挑战新事业。说是要挑战，但我们却缺乏在这种新领域的专业技术。虽然有一种自信，认为只要把京瓷的技术运用到这个新领域中去，就能打开新的局面，但事实上，我们现有的人才和技术与别人的差距都很大，我曾为此烦恼不已。</p><p>这时候，我碰上了意料之外的机遇。</p><p>在一个聚会上，我请朋友推荐人才。结果这个朋友恰好认识这一领域的一名优秀专家，于是双方一拍即合，我马上请这位专家加入公司。京瓷的新事业得以顺利展开。</p><p>这样的事看起来似乎是偶然的。但实际上，是因为我不停地思考，这个念头已经进入了我的“潜意识”，所以实现它是必然的。如果我不曾抱如此强烈的愿望，那么，即使理想的人才在我眼前走过，我也会错过这次机会。</p><p>要实现高目标，前提就是持续地怀抱能渗透到“潜意识”的强烈愿望。</p>'
  },
  '2026-07-10': {
    chapter: '第10天：干法 · 第3章：以"高目标"为动力——持续付出不亚于任何人的努力（2）',
    content: '<p><strong>当你竭尽全力时，神灵将会现身</strong></p><p>若想登山，那么只有从平地起，用自己的双脚一步一步向上攀登直至山顶，除此之外，别无他法。就是这一步接一步不停地积累，最终可以征服海拔高达8000多米的喜马拉雅山。</p><p>看一看古今中外伟人们走过的足迹吧，当中记录了他们惊人的努力。他们终其一生，一步一个脚印不断地积累，仁慈的“主”、万能的“神”只会给这样的人带来成功的硕果。</p><p>与此相反，有人却认为:“坚持如此单调乏味的努力，简直就像傻瓜。在短暂的人生中，这么一味苦干的话，一定会落败于人;而寻找轻松巧妙的捷径快速取胜，才是明智的选择。”因此他们讨厌脚踏实地的努力。这样的人是无法取得事业成功的。</p><p>我想起这么一件事。</p><p>京瓷创建不到10年，全球最大的电脑公司IBM给京瓷下了一批精密陶瓷产品的订单。但对产品的性能要求之高超乎常规，也远远超出了京瓷当时的技术水准。我们千方百计，历尽艰难，总算做出了样品，但交到客户那里时，却全被盖上了“不良品”的印章。</p><p>要知道，我们已将当时京瓷拥有的技术和力量通通投入，经过恶战苦斗，才做出了这些产品，然而却全被判定为次品，20万个产品悉数退回，当时的损失甚为惨重。</p><p>“努力已经达到极限了，实在无计可施了。”公司内弥漫着无可奈何的气氛。那天夜里，我到生产现场，见到茫然若失、呆呆地站在炉前的一位年轻技术员。</p><p>我走近他，见他双肩发抖、流泪抽泣。已经想尽了一切办法，却无论如何也做不出理想的产品，这令他痛苦万分，意志消沉。</p><p>"今天你先回家吧!”我对他说。他却站在炉前一动也不动。</p><p>看他那神情，我突然脱口而出:“你向神祈祷了吗?”听我说这话，他吃了一惊。但是，当我把这句话连续嘟囔了几遍后，他终于说:“我明白了。让我从头开始，再次努力试一试吧!”他的情绪一下子变得轻松起来。他向我微微点了点头，又投入了工作。</p><p>此后，包括这位技术员在内的开发小组，一次又一次克服了各种各样的技术难关，最终做出了满足客户苛刻要求的、完美无缺的、高水平的产品，而且是2000万个一如此巨大数目的成品全部按客户规定的时间顺利交货。</p><p>“你向神祈祷了吗?”这不像一个工程师讲的话。</p><p>如果有外人听到这样的话，或许会以为我们是走火入魔的“狂人”。然而，在我看来，在“尽人事”之后，只有向神祈祷、让神灵保佑我们这一条路了。</p><p>问题是:真的已经“尽人事”，已经竭尽全力了吗?你自己身体里的力量真的全部用尽了吗?你真的已经将自己的魂魄注入产品中，并且坚持不懈地付出了不亚于任何人的努力了吗?</p><p>这就是我要表达的意思。</p><p>只有抱着这样强烈的愿望，使出浑身的力量，这个时候“神”才会愿意现身，才会向你伸出援手。</p><p>向困难的工作挑战，或者想要实现很高的目标，那么全身心投入工作是必须的，只有此时，懒得动弹的“神”才会出手相助。</p><p>始终“以百米赛的速度奔跑”“付出不亚于任何人的努力”是我的口头禅。</p><p>努力的重要性人尽皆知。如果我问:“你努力了吗?”几乎所有的人都会回答:“是的，我尽了自己最大的努力。”但是，仅仅付出同普通人一样的努力，是很难取得成功的。不管这样的努力持续多久，这不过是做了理所当然的事情。只有付出非同寻常的“不亚于任何人的努力”，才有可能在激烈的竞争中取得骄人的成绩。这个“不亚于任何人的努力”极为重要。</p><p>希望在工作中成就某种目标，就必须持续地付出这种无限度的努力。不肯付出加倍于人的努力，而想取得很大的成功，并维持之，那是绝对不可能的。</p><p>在京瓷创业的初期，每天晚上何时回家、几点睡觉，我当时根本没有概念。</p><p>我就是这样夜以继日、全身心地埋头工作。</p><p>所谓“不亚于任何人的努力”，不是说“到这种程度就行了”，而是没有终点、永无止境的努力。将目标一次接一次向前推进，就要进行持续的、无限度的努力。</p><p>所谓“不亚于任何人的努力”，不是说“到这种程度就行了”，而是没有终点、永无止境的努力。</p><p>然而，在持续这种努力的过程中，员工们难免会有不安和不满的声音:“如此无限度的、不要命的努力，人的身体能承受得了吗?要不了多久，大家都会倒下的。”再看看员工们的脸色，确实个个倦容满面。</p><p><strong>我考虑再三，但最终还是硬起心肠，说了下面一段话:</strong></p><p>企业经营，就好比连续奔跑42.195公里的马拉松比赛。我们就是至今未经训练的业余团队，而且在这样的长距离赛跑中，我们起跑已经比别人晚了一步。在这种情况下，如果我们还想参加比赛，那么，我想我们只有用百米赛的速度奔跑才行。有人认为这样硬拼，身体肯定吃不消。但是，我们起跑已迟，又没有比赛的经验，若想取胜，非这么做不可。如果做不到这一点，我们一开始就不应该参加这场比赛。</p><p>我就这样说服了我的员工。</p><p>没有资金，没有技术，没有设备，几乎一无所有，又是最后一个加入新型陶瓷行业的企业。考虑到京瓷面临的现实，我们没有从容不迫、慢条斯理进行选择的余地。为了生存，除了拼命努力之外别无他法。虽然这是一种不得已的、严酷的决断，而且我的理由简直不近人情，但幸得员工们全都理解我，跟随我共同奋斗0</p><p>这样的努力终于开花结果了。创业不到10年，京瓷就迎来了股票上市这一关键发展点。</p><p>此时，我对员工们说:用百米赛的速度跑马拉松，大家都担心中途会有人落伍。但是，一旦跑起来以后，全力奔跑就成了我们的习惯。用最快的速度奔跑，我们居然真的坚持到了今天。</p><p>而且在比赛过程中，我们看到，那些先行起跑的团队速度并不太快。现在最领先的团队已进入我们的视野，说明我们已经离第一越来越近了，让我们继续加速，全力疾驰，超越他们!</p><p>这种以短跑的速度进行长跑比赛的无限度的努力，就叫作“不亚于任何人的努力”。</p><p>平平常常的努力，不管是企业还是个人，都不可能获得理想的成果，只有付出“不亚于任何人的努力”才是人生和事业成功的最强动力。</p><p><strong>付出“不亚于任何人的努力”乃是自然的机理</strong></p><p>我们一般都认为付出“不亚于任何人的努力”是一件特别的事，是一个沉重的话题，因为好像竭尽全力地工作是在苛待我们自己。其实绝非如此。</p><p>观察一下自然界吧。无论什么动物、植物都在拼命努力求生存，而只有我们人类才会贪图安乐，抱有这种邪念。</p><p>初春时分，我在家的周围散步。</p><p>城墙的石缝中有嫩草长出。“在这样的地方居然还有植物生长!”我一边想一边仔细观察。</p><p>在石头与石头之间，仅有一点儿泥土，然而就在那儿，草儿拼命吸收阳光雨露，发出嫩芽。此后，短短的春季只持续几周，草儿们接受阳光的恩泽，长叶、开花、结果。如果不如此，当夏天到来时，石墙在灼热的太阳照射下就会迅速升温，草儿就会枯死。所以赶在盛夏到来之前，草儿就要拼命生长，留下子孙，然后枯死。</p><p>在柏油马路的缝隙中长出的无名小草，它们的命运也一样。</p><p>在水分极端缺乏的、炎热如地狱般的环境中，各种草儿拼命挣扎求生。各种各样的草儿为了比其他草类更多地接受阳光，以便长得更大些，就拼命扩展草叶、伸展草茎，为生存互相竞争。</p><p>为了自身的生存必须拼命努力，自然界的机理本来就如此。懒惰、不努力的植物绝不存在，不努力的草类无法生存。</p><p>动物也一样，不拼命求生必将灭绝，此乃自然的铁则。</p><p>然而，只有我们人类，说到“不亚于任何人的努力”，说到“必须拼命工作”，好像就很特别，很难接受。然而，想要成功就必须拼命工作，想要生存就必须付出“不亚于任何人的努力”。</p><p>此乃自然之机理。</p><p>体悟</p><p><strong>做人最基本的、必要的条件</strong></p><p>我经常向许多人问道:“你是否在竭尽全力地工作?”“是的，我在努力工作。”但我对这样的回答并不满意，我会接着问，“你是否付出了不亚于任何人的努力?”“你的工作方法是否不亚于任何人?”我坚信，每天坚持认真地、不遗余力地工作，应该是我们做人最基本的、必要的条件。</p>'
  },
  '2026-07-11': {
    chapter: '第11天：干法 · 第4章：持续就是力量——抓紧今天这一天',
    content: '<p><strong>第4章持续就是力量:抓紧今天这一天</strong></p><p>:所谓人生，归根到底，就是“一瞬间、一瞬间持续的积累”，如此而已。</p><p>::加倍努力，辛苦钻研，一直拼命地工作。</p><p>::将努力变为“持续的力量”，就能让你这个“平凡的人”变为“非凡的人”，你就会具有强大的力量。</p><p>看起来平凡的、不起眼的工作，却能坚韧不拔地去做，坚持不懈地去做，这种“持续的力量”才是事业成功的最重要基石，才体现了人生的价值，才是真正的“能力”。</p><p>世上被誉为“天才”“名人”的人们，他们毫无例外，都发挥了这种“持续的力量”。长年坚持这种努力，那么，杰出的技能和优秀的人格也会变成你的特质。</p><p>持续的力量能将“平凡”变为“非凡”</p><p>所谓人生，归根到底，就是“一瞬间、一瞬间持续的积累”，如此而已。每一秒钟的积累成为今天这-天;每一天的积累成为一周、一月、一年，乃至人的一生。</p><p>同时，“伟大的事业”乃是“朴实、枯燥工作”的积累。如此而已。</p><p>那些让人惊奇的伟业，实际上，几乎都是极为普通的人兢兢业业、一步一步持续积累的结果。</p><p>也就是说，“我想要这样”“我想要这种状态”一描绘你心中梦想的目标，然后乘上喷气式飞机，顷刻之间飞跃千里，马上到达目的地一世上没有这样高超的方法。不管多么伟大的理想，都要靠一步一个脚印，孜孜不倦地、持续地努力才能实现。</p><p>埃及的金字塔是由许许多多无名氏，通过艰苦的地道作业堆砌而成的。他们将切好的巨石一块块砌上去，数百万、数千万块巨石就是靠他们的双手一块接一块运过来、砌上去。</p><p>金字塔是多么令人惊叹的奇迹，但正因为它凝结了无数人汗水的结晶，所以它能够超越悠久的历史，至今依然屹立在我们面前。这其中隐含的道理恰如我们每一个人的人生。</p><p>多年以前，在京瓷滋贺县的工厂里，有一位工人，初中学历。</p><p>“这事要这么做”，当上司教他时，他总是一一记下。他每天双手粘黑，额头流汗，只要是上司布置的工作，他总是日复一日，不厌其烦地认真完成。在工厂里他毫不显眼，一直默默无闻，但从无牢骚，也从无怨言，兢兢业业，孜孜不倦，持续从事着单纯而枯燥的工作。</p><p>20年后，当我与他再次见面时，我大吃一惊，那么默默无闻、只是踏踏实实从事单纯枯燥工作的人，居然当上了事业部长。关键是，令我惊奇的不仅是他的职位，而且言谈中我体会到，他已经是一个颇有人格魅力且很有见识的优秀的领导。“取得今天这样的成就，你很棒!”我由衷地赞赏他。</p><p>他看上去毫不起眼，只是认认真真、孜孜不倦、持续努力地工作。但正是这种坚持，使他从“平凡”变成了“非凡”，这就是“持续的力量”，是踏实认真、不骄不躁、不懈努力的结果。</p><p>正如托马斯·爱迪生所言，成功中“天分”所占的比例不过只有1%，剩下的99%都是勤奋和汗水。</p><p>专心致志于一行一业，不腻烦、不焦躁，埋头苦干，不屈服于任何困难，坚持不懈。只要你坚持这样做，就能造就优秀的人格，而且会让你的人生开出美丽的鲜花，结出丰硕的果实。</p><p>我作为一名企业经营者，使用过各种各样的人才，其中不乏“聪明伶俐”的人。这种人头脑敏捷，对工作要点领会很快，是所谓“才华横溢”的人物。公司也招聘了一些“笨人”，他们反应迟钝，理解事情缓慢，可取之处只是忠厚老实。</p><p>“经营者看重、赏识的人才当然是前者而不是后者。如果企业不得已要辞退职工，首先遭殃的肯定是后者而不会是前者。”</p><p>我也曾认为，前者当中特别能干的人，“将来在公司里可以委以重任”。</p><p><strong>是这样的吗?</strong></p><p>不，现实情况恰恰相反。</p><p>就是说，那些头脑灵活、思维敏捷的人才，正因为他们聪明，成长很快，或许就会认为眼前的工作太平凡，待在公司里大材小用了，于是不久就会辞职离去。所以，最终留在公司里的、有用的，恰是那些最初不被看好、头脑迟钝的人(用词可能不当)。</p><p>我为自己曾经的“短见”感到羞愧。</p><p>这些“头脑迟钝”的人，他们做起事来不知疲倦，孜孜以求，10年、20年、30年，像一只蝗虫一样一寸一寸地前进，刻苦勤奋，一心一意，愚直地、诚实地、认真地、专业地努力工作。</p><p>经过如此漫长岁月的持续努力，这些所谓“头脑迟钝”的人，不知从何时起，就变成了“非凡”的人。当我第一次意识到这个事实时，很是惊奇。当然，他们并不是在某个瞬间发生了突变，非凡的能力也不是突然获得的。</p><p>加倍努力，辛苦钻研，一直拼命地工作，正是在这样的过程中，他们塑造了自己高尚的人格。</p><p>不像豹子那样行动迅猛，而是像牛一样，只是“笨拙”地、“愚直”地、持续地专注于一行一业。这样不断努力的结果，让他们不仅提升了能力，而且磨炼了人格，造就了高尚美好的人生。</p><p>如果有人哀叹自己没有能耐，只会“认真地做事”，那么，我想对他说，你应该为你的这种“愚拙”感到自豪。</p><p>看起来平凡的、不起眼的工作，却能坚韧不拔地去做，坚持不懈地去做，这种“持续的力量”才是事业成功最重要的基石，才体现了人生的价值，才是真正的“能力”。</p><p>世上被誉为“天才”“名人”的人们，他们毫无例外，都发挥了这种“持续的力量”。长年坚持这种努力，那么，杰出的技能和优秀的人格也会变成你的特质。</p><p>将努力变为“持续的力量”，就能让你这个“平凡的人”变为“非凡的人”，你就会具有强大的力量。</p><p>将努力变为“持续的力量”，就能让你这个“平凡的人”变为“非凡的人”，你就会具有强大的力量。</p><p><strong>比昨天更进一步</strong></p><p>人生总在迷惑中。</p><p>越是认真工作，这样的迷惑或许就越深。</p><p>“为什么要这么做?”“究竟为什么要干这项差事?”越是认真、拼命工作的人，就越会思索劳动的意义，思考工作的目的，为这些人生最根本的问题而烦恼，并且常常陷入找不到答案的迷途之中。</p><p>我过去也曾经是这样。</p><p>在我工作的第一家公司，我反复进行着各种实验，有失败也有成功。当时在无机化学的研究者中，同我年龄相仿的，有人拿到了奖学金赴美留学;有人在优秀的大企业里，使用最尖端的设备进行最先进的实验;而我在一个如此破旧、衰败的企业里，连最起码的设备都没有，日复一日地做着混合原料粉末这样简单的工作。</p><p>一直从事如此单调的工作，究竟能搞出什么科研成果来呢?”我问自己。</p><p><strong>再进一步地:“自己的人生又将会怎样呢?</strong></p><p>想到这些，我不禁心灰意冷，每一天都过得很消极。</p><p>解除这样的迷惑，一般人的方法是和自己说:“要预见到将来。”就是说，不要将自己的目光仅仅放在眼皮底下，而要从长远的角度规划自己的人生蓝图;要把眼前的工作看作这长期规划中的一段过程。</p><p>这也许是合乎逻辑的方法。然而，我采用的方法与此相反。</p><p>我采用短期的观点来摆正自己对工作的态度。</p><p>“将来会搞出什么样的研究成果”“自己的人生将会怎样”，我不再痴迷于这些不着边际的远景，而只是留神眼下的事情。就是说，我发誓，今天的目标今天一定要完成。工作的成绩和进度以今天一天为单位区分，然后切实完成。</p><p>在今天这一天中，最低限度是必须向前跨进一步，今天比昨天，哪怕只是一厘米，也要向前推进。我就是这样思考问题的。</p><p>同时，不单单是前进一步，而且要反省今天的工作，以便明天“要做一点改良”“要找一点窍门”。在前进一步时，一定同时是在改善、改进。</p><p>就这样，奔着每一天的目标去，让每一天都有所创新，就会天天前进，天天获得积累。为了达到目标，不管外面刮风也好、下雨也好，不管碰到多大的困难，我都全神贯注，全力以赴。先是坚持一个月，再坚持一年，然后是5年、10年，锲而不舍。这样做下去，你就能踏入当初根本无法想象的境地。</p><p>将今天一天作为“生活的单位”，天天精神抖擞，日复一日，拼命工作，用这种踏实的步伐，就能走上人生的王道。</p>'
  },
  '2026-07-12': {
    chapter: '第12天：干法 · 第4章：持续就是力量——抓紧今天这一天（2）',
    content: '<p><strong>全力过好今天这一天</strong></p><p>每天，持续过好内容充实的“今天”这一天一这个观点在京瓷的经营中无时无刻不体现出来。</p><p>京瓷公司创建至今，从来不建立长期的经营计划。新闻记者们采访我的时候，经常提出想听一听我们的中长期经营计划。而当我回答“我们从不设立长期的经营计划”时，他们便觉得不可思议，露出疑惑的神情。</p><p><strong>那么，为什么不建立长期计划呢?</strong></p><p>因为说自己能够预见到久远的将来，这种话基本上都会以“谎言”的结局而告终。</p><p>“多少年后销售额要达到多少，人员增加到多少，设备投资如何如何”，这一类蓝图，不管你怎样着力地描绘，但事实上，超出预想的环境变化、意料之外事态的发生都不可避免地会出现。这时就不得不改变计划，或将计划数字向下调整。有时甚至要无奈地放弃整个计划。</p><p>这样的计划变更如果频繁发生，不管你建立什么计划，员工们都会认为，“反正计划中途就得变更”，他们就会轻视计划，不把它当回事。结果就会降低员工的士气和工作热情。</p><p>同时，目标越是远大，为达此目的，就越需要持续付出不寻常的努力。但是，人们努力，再努力，如果仍然离终点很远很远，他们就难免泄气。“目标虽然没达成，能这样也就可以了，差不多就算了吧!”人们常常在中途泄气了。</p><p>从心理学的角度看，如果达到目标的过程太长，也就是说，设置的目标过于远大，往往在中途就会遭遇挫折。</p><p>与其中途就要作废，不如一开始就不要建立。这是我的观点。自京瓷创业以来，我只用心于建立一年的年度经营计划。3年、5年之后的事情，谁也无法准确预测，但是这一年的情况，应该大致能看清，不至于太离谱。</p><p>做年度计划，就要细化成每个月甚至每一天的具体目标，然后千方百计努力达成。</p><p>今天一天努力干吧，以今天一天的勤奋就一定能看清明天。这个月努力干吧，以这一个月的勤奋就一定能看清下个月。今年一年努力干吧，以今年一年的勤奋就一定能看清明年。</p><p>就这样，一瞬间、一瞬间都会过得非常充实，就像跨过一座一座小山。小小的成就连绵不断地积累、无限地持续，这样，乍看宏大高远的目标就一定能实现。这个方法就是最确实的取胜之道。</p><p>能力要用“将来进行时”</p><p>在建立目标时，要设定“超过自己能力之上的指标”。这是我的主张。</p><p>要设定现在自己“不能胜任”的有难度的目标，“我要在未来某个时点实现这个目标”，要下这样的决定。</p><p>然后，想方设法提高自己的能力，以便在“未来这个时点”实现既定的目标。如果只用自己现有的能力来判断决定“能做”还是“不能做”，那么，就不可能挑战新事业，或者实现更高的目标。“现在做不到的事，今后无论如何也要达成。”如果缺乏这种强烈的愿望，就无法开拓新领域，无法达成高目标。</p><p>我用“能力要用将来进行时”这句话来表达这一观点。</p><p><strong>这句话意味着“人具备无限的可能性”。也就是说:</strong></p><p>人的能力有无限伸展的可能。坚信这一点，面向未来，描绘自己人生的理想。</p><p>这就是我想表达的意思。但是，很多人在自己的工作和生活中，很轻率地下结论说:“我不行，做不到。”这是因为他们仅以自己现有的能力判断自己“行”还是“不行”。</p><p>这就错了。因为人的能力，在未来，一定会提高，一定会进步。</p><p>事实上，大家今天在做的工作，几年前来看，你也会想:“我不会做，我做不好，无法胜任。”</p><p>可是到了今天，你不是也觉得这个工作挺简单的?因为你已经驾轻就熟了。</p><p>人这种动物，在各个方面都会进步。“神”就是这么造人的一我们应该这么思考。</p><p>“因为我没有学过，没有知识，没有技术，所以我不行。”说这话可不行，应该这样思考:</p><p>因为我没有学过，所以我没有知识，没有技术。但是，我有干劲、有信心，所以明年一定能行。而且就从这一瞬间开始，努力学习，获取知识，掌握技术。将来密藏在我身上的能力一定能开花结果。我的能力一定能增长。</p><p>对人生抱着消极态度，认为自己的人生就将以碌碌无为而告终，这么思考的年轻人并不多。</p><p>但是，一旦面临困难的问题时，几乎所有的人都会脱口而出说自己“不行”。</p><p>绝对不要说“自己不行”这种话。面对难题，首先要做的就是相信自己。</p><p>“现在也许不行，但只要努力一定能行。”首先相信自己，然后必须对“自己解决问题的能力怎样才能提高”进行具体深入的思考。只有这样，通向光明未来的大门才会打开。</p><p>将“不可能”变为“可能”</p><p>从京瓷创业开始，我们就经常主动接受别的公司认为“不能做”的产品订单。</p><p>我这么说，有人或许会认为，京瓷一开始就具有值得夸耀的高技术。实际上并非如此。对于一个弱不禁风的、新生的小企业而言，我这样做是唯一的生存之道。</p><p>我们最早生产的产品，前面已经提到，是提供给松下电子工业的绝缘零件，用在电视机显像管上的。</p><p>京瓷公司成立后，生产虽然很顺利，但如果只有单一的一种产品，经营就很不稳定。因此我考虑，以已开发的技术及业绩为基础，将业务往横向进一步拓展。我们开始针对东芝、日立、NEC等大型电子企业展开促销推广活动。</p><p>首先，我们扩大宣传:“我们公司具备新技术，可以制造这种新型陶瓷绝缘产品。”想用这个办法接触客户。然而，一开始并不成功，因为这些大企业已经将此类产品的订单发给了原先合作的陶瓷厂家。不仅如此，大企业的工程师们还觉得，将订单发给京瓷这种没有名气的小企业很不放心。要把已经发往有老关系的陶瓷企业的订单转发给刚开张的新企业京瓷，这根本就不可能。</p><p><strong>于是，这些工程师们必然提出的一个问题就是:</strong></p><p><strong>既然你们有这种新型陶瓷技术，那么，这个产品你们能做吗?</strong></p><p>他们拿出来的是被别的陶瓷厂家拒绝的、难度很高的产品，问我们能不能开发。</p><p>这时候，如果我回答:“我们做不了。”那么，合作的事就彻底没希望了。</p><p>虽然在事实上我们只具备制造显像管电子枪上绝缘材料的技术，但是，面对客户的这种要求，我只能立即回答:</p><p>行，我们能做。</p><p>如果不这么说，对方就再也不会搭理你了，企业的经营就难以维持。因此我没有选择的余地。</p><p>然而，一旦向客户承诺了“行，能做”，而结果却做不出来，那么客户就再也不会给你新的机会了。所以也就是说，“能做”这种“大话”“谎言”，无论如何必须兑现。</p><p>将不会做的工作一个一个接下来，员工们个个都惊讶不已。</p><p>“连设备也没有，如何做得了?”员工们几乎异口同声地反问我。当然，他们的意见也有道理:因为要完成这样的工作，当时的京瓷既没有经验，也没有相应的技术和设备。</p><p><strong>我则激励大家:</strong></p><p>没有设备可以借，买二手设备也行。说技术上不能做，这不过是现在这个时点的话。</p><p>相信能做，然后加紧努力，不久的将来就一定能做成。瞄准这个将来的目的地，倾注全部的力量和热情，好好干吧!</p><p>将“不能做的工作”当作“能做的工作”，接下任务，然后发奋努力，达到实际上“能做”一从不可能中孕育出可能。这似乎看起来很荒唐，好像“靠踮起脚尖来拔长身高”，但正是这种所谓“荒唐”的做法，有效地提升了京瓷的技术，扩大了京瓷的业绩，让京瓷走上了成功之路。</p><p>人的能力这个东西，绝不是一成不变的。所谓“能力”，归根到底，应该采用“将来进行时”来估量。</p><p>从应该到达的未来的某一点倒算一评估自己现有的能力一再考虑用何种方法提高自己的能力。</p><p>这个未来的某一点，就是要达到的目标。始终要把跨越的栏杆设置在比自己现有能力高两三成的高度，然后瞄准这个未来的目标，注入热情，不惜一切地持续付出“不亚于任何人的努力”。</p><p>“能力要用将来进行时”，以这种姿态面对人生，对于达成宏大高远的目标而言，非常重要。</p>'
  },

    chapter: '第13天：干法 · 第4章：持续就是力量——抓紧今天这一天（3）',
    content: '<p><strong>“已经不行了”的时候才是真正的开始</strong></p><p>“已经着手开发的研究项目，一定要百分之百的成功!”这是我的信念。</p><p>在京瓷创业大约15年后，我应邀就如何进行研究开发的话题，在某个著名的大企业做了一次演讲，听众是200多位研究员。</p><p>他们都是平时从事高新技术开发的优秀人才，其中许多人都有博士头衔。演讲结束答疑时，有人提问:“京瓷研究开发项目的成功率是多少?”</p><p>当项目遇上难以克服的困难，认为“已经不行了”的时候，其实并不是终点，而是重新开始的起点。</p><p>“京瓷凡是着手开发的研究项目都必须有百分之百的成功率!”我这样回答。</p><p>在发出一片惊叹声之后，立即就有人质疑:“你说这话令人难以置信，这是不可能的。”</p><p>我接着这样回答他:“在京瓷公司里，研究开发一定要持续到成功为止。以失败告终的事例没有。”</p><p>这一答辞立刻引起了全场一片笑声。</p><p>然而，我是认真的。</p><p>不管什么项目，一旦开始，就一定要做到成功为止。这种执着的、强烈的信念，以及不达目的绝不歇手的“持续的力量”，是成功的必要条件。我坚信这一点。</p><p>当项目遇上难以克服的困难，认为“已经不行了”的时候，其实并不是终点，而是重新开始的起点。在成功之前，要绝不罢休，不屈不挠，坚韧不拔。不能给自己设置界限，要不厌其烦，持续挑战。这样才有可能变“危机”为“机会”，让“失败”转为“成功”。</p><p>狩猎民族手执梭镖或吹箭，腰间带上数天的食料和水，去追捕猎物，借以维持一家的生存，但捕获猎物并不容易。</p><p>他们要顺着动物的足迹，日夜不停地追踪，追到猎物的窝巢后，还要冒着生命危险，突袭并杀死猎物。</p><p>然后，他们还要扛着战利品，再花上几天几夜，长途跋涉，回到家里，让等候的族人们获得食物。</p><p>在如此严酷的环境下维持生存，最重要的就是，要具备洞穿岩石般坚强的意志。一旦盯上目标，在得手之前，就要持续追击，锲而不舍，绝不放弃。这种执着之心，就是坚强的意志，是成功不可或缺的要素。</p><p>“在认为已经不行了的时候，才是工作的开始”，这一思想在京瓷已经深深扎根。</p><p>即使在工作被逼入“计穷策尽，已无办法可想”，不得不放弃的地步时，也不是终点，而是第二次开始的起点。从这里出发，要以更坚强的意志、更炽烈的热情投入战斗。不管碰到何种阻力，都要穷追不舍，坚持到底一狩猎民族取胜的这种韧性，在我们要达成目标时必不可缺。</p><p><strong>苦难和成功都是考验</strong></p><p>艰难困苦正是机会一我们应该有这样的认识。</p><p>为什么?因为苦难能够教育人，促进人的成长。相反，人在一帆风顺的时候往往容易犯错误。</p><p>比如，有不少获得巨大成功的经营者，他们为成功的美酒所陶醉，陷于傲慢，犯了错，以至于晚节不保，辛苦创建的企业走向衰败，这样的事例屡见不鲜。</p><p>虽说盛衰荣枯乃世间常态，但是令人心酸的悲剧仍屡屡上演，不正常似乎成了正常。</p><p>遭遇失败和苦难的时候，不应牢骚满腹，不要怨天尤人，而是要忍受考验，坚持努力，一点点积累小小的，然而是确凿的成功，最后将逆境转化为顺境。在成功和幸运的时候，要不骄不躁，抱着真诚的感谢之心，仍继续坚持努力，使成功得以长期持续。</p><p>无论苦难或成功都是对我们的考验。</p><p>开头我就提到，我刚进公司开始研究工作的时候，痛苦的情绪时时袭击我:“为什么我总是连遭不幸呢?我的人生将会怎样呢?</p><p>当时，没有指导我工作的上司，企业里也没有像样的研究设备，每天，就我一个人，一边摸索，一边持续研究开发。</p><p>那时候，寂寞、孤单、苦恼一各种消极的情绪不断袭来。夜晚，在宿舍后面小河的河堤边，我常常坐下来仰望天空。</p><p>星空满天的时候、月色清朗的时候、天色阴沉的时候、即将下雨天色暗黑的时候，我总是独自一人，仰望天空，静静地思念故乡，思念父母兄弟，吟唱《故乡》等歌曲或者童谣。</p><p>看到我的这种状态，宿舍的同事们就议论说:“稻盛又在哭泣了。”</p><p>但其实，我是在用我自己的方式治愈我内心的痛苦和创伤，我在激励我自己。</p><p>待唱完歌曲时，我痛苦和孤独的感觉已经消失，我的心境豁然开朗。我满怀着对明天的希望和面对未来的勇气走回宿舍。那样的情景至今仍历历在目。我想也许是那些歌曲和童谣给了我力量和勇气。</p><p>苦难不会没完没了，当然幸运也不会永远持续。得意时不忘形，失意时不消沉，每天每日勤奋工作，这比什么都重要。</p><p>得意时不忘形，失意时不消沉，每天每日勤奋工作，这比什么都重要。</p><p>在胜利和挫折的考验中，每一天都拼命努力，这本身就是在孕育成功的种子。</p><p><strong>不要有感性的烦恼</strong></p><p>人生难免有失败的时候。</p><p>这时候绝不可心情郁闷，不要有感性的烦恼。</p><p>所谓“覆水难收”，一旦泼出去的水就难以收回，没有必要老是后悔，老是懊恼。“为什么会干那样的事?”“当时不那么干就好了!”这样想其实无济于事，你完全没有必要为失败而烦恼不已。</p><p>应该对失败的原因进行分析，诚恳反省，“是什么原因让我干那样的傻事?”必须严肃地质问自己。但是，当你做完了充分的反思，接下来就应该把这事忘掉。人生也好，工作也好，总是会充满痛苦和烦恼，不可能时时顺心。</p><p>经过充分反省之后，就朝着新的目标，满怀希望、心情开朗地采取行动，开始努力工作。这样才对。</p><p>近年来，日本每年自杀的人数都超过3万，但其实大多数都是因为一些感性的烦恼。</p><p>确实，人生总有烦恼缠身，但是即使发生了巨大的不幸，好像真要活不下去了的时候，也绝不要痛苦得撕心裂肺。</p><p>拂拭心中感性的烦恼，抬头挺胸向前看，朝着新的方向，采取新的行动。这种态度对于我们的人生非常重要。</p><p>人都是在反反复复的失败和错误中成长、发展的。</p><p>失败了没关系。只要失败后认真反省，然后把精力转向新的行动，那么即使一时被逼入穷途末路，最后也一定能获得成功。</p><p>前面已经提过，京瓷最初的客户就是松下电子工业公司(今天的松下电器产业集团，以下我们简称为“松下")。</p><p>当时，只有来自松下的订单，所以我们对松下充满了感激之情:“幸亏有松下的支持，京瓷才有了一个良好的开端。”但是不久以后，在产品的价格、质量、交货期等各个方面，松下对我们的要求都越来越苛刻。</p><p>特别是价格，松下的采购部门每年都要求京瓷的产品大幅度降价。虽然能获得订单，但是要消化降价的成本可不容易。</p><p>当然，松下的做法不只是针对京瓷。一次，我出席松下召集的零部件供应商会议。“松下欺负供应商!在会议上，各零部件厂家愤愤不平，一齐向松下开火。松下的要求实在过于苛刻了，我也曾同松下的采购员当面争吵，所以对这些供应商们的心情，我很理解，他们对松下的不满已经接近于憎恨。</p>'
  },
  '2026-07-14': {
    chapter: '第14天：干法 · 第4章：持续就是力量——抓紧今天这一天（4）',
    content: '<p><strong>然而在同时，我对松下又有深切的感谢之心，所以我想:</strong></p><p>这是在锻炼我们，考验我们!苛刻的要求是迫使我们刻苦钻研的绝好机会。我们的公司刚刚起步，我们的腰腿正需要锻炼。</p><p>如果连这种程度的要求都不能适应，那么公司也好，个人也好，就只能停留在二流、三流的水平。所以，绝不能认输，我们要从正面迎接这个难得的挑战机会。</p><p>因此，凡是松下的要求，我们二话不说，照单全收。如何在这种价格条件下仍能挤出利润空间?我们绞尽脑汁，想办法从根本上削减成本。</p><p>创业数年后，我们的产品开始向海外出口，当京瓷从蓬勃发展的美国西海岸半导体市场获得订单之时，我想起了松下。</p><p>同美国的同行相比，我们的产品不仅品质卓越，而且有充分的价格竞争力。</p><p>当我意识到这一点时，我不禁双手合十，从内心向松下表示感谢:“松下松下，是你培养了我们。”</p><p>我们如今拥有全世界通用的、有全球竞争力的技术，可以说完全是客户严格要求的结果，是我们为顺应这种要求拼命努力的结果。松下无意中给予我们的考验，让我们在不知不觉中积蓄了力量，掌握了世界水准的竞争技术。我不由得对松下更加感激了。</p><p>另一方面，当时一味向松下发泄不满而没有做出相应努力的零部件厂家，不少都倒闭了，早已消失在竞争的风浪之中。</p><p>针对自身所处的环境，是采取卑屈、怨恨等消极的态度，还是把困难的任务当作自己发展的机会，以积极的态度去应对?选择不同的态度，走不同的道路，到达的终点也会大相径庭。无论是工作还是人生，都是同样的道理。</p><p>哪怕险峻高山，也要垂直攀登。</p><p>在我就职的第一家公司，因为我坚持依据自己的信念行动，所以有时会受到同事、长辈、上司，甚至工会的责难，而在公司内处于被孤立的状态。</p><p>此时，有一位比我大五六岁的前辈，此人和我不同，为人圆滑，与周围的人际关系和谐，对我提出了如下建言:</p><p>稻盛君，你的做法太过正直，太过直截了当，所以旁人难以理解。在人生中积极意义上的妥协还是必须的，人活在这个世上，需要懂得权宜之计和临机应变。</p><p>听了这话，我毫不以为然。但是过后，对于究竟该不该采用所谓“积极意义上的妥协”，我也曾反复地询问自己。</p><p>然而，我得出的结论仍然是“绝不接受所谓妥协的诱惑”。绝不扭曲自己的信念，按照自己的信念拼命工作，我只能如此。我从内心发誓，坚持自己的初衷。</p><p>那时，我头脑里浮现出在攀登险峻的高山时自己的状态。</p><p>我曾是一个缺乏登山技术和经验的人，但却要作为登山队长率领团队攀登险要的石山。此时因为害怕而脚底发抖的人、要求中途离队的人，都出现了。如果只考虑安全第一，那么我们就不可能敢垂直攀登高耸的石山，而将会选择迂回上山，缓慢地、轻松地爬行。</p><p>这种方法就是那位先辈所讲的“积极意义上的妥协”，这的确不失为一种明智的办法。</p><p>但是我却不选择这条安逸舒适的道路。</p><p>为什么?因为我认为，在选择安全舒适办法的瞬间，就会迷失我的目标一那险峻的高山之巅。采取安全的办法，花费漫长的时间，在缓慢攀登的过程中，就会淡忘了初衷，消磨了攀上险峻山顶的意志。即使没有忘却初衷，也会慢慢接受“理想归理想，现实只能到此为止了，已经做了充分的努力，就到此为止吧”的想法，那就一定会放弃最初的目标。</p><p>只要允许自己稍稍妥协，那么持续的努力就会画上终止符。我预见到自身软弱的一面，所以，明知自己鲁莽无谋，我还是下定决心，今后不管遇到多么险峻的高山，我都要垂直攀登。</p><p>正好当时准备结婚，我对未来的妻子说:“以后，如果没有一个人肯追随我，很抱歉，希望那时你能做我的后援，你愿意吗?”我一边这么讲，一边低头求婚。那一时刻我至今还记得清清楚楚，当时妻子默默地点了点头。</p><p>允许自己妥协，选择安逸之道，那一瞬间固然很惬意，但是，这样却不可能实现自己的理想和崇高的目标，到头来必定后悔。</p><p>秉持坚定的意志，一步一步、一天一天、踏踏实实努力的人，不管路程多么遥远和艰难，到时他一定能够登上人生的山顶。</p><p>体悟</p><p><strong>与宇宙意志相协调</strong></p><p>一方面是“埋头苦干”的决心，另一方面是“定能成功”的确信。以乐观的态度面对困难和逆境，乃是人生取得成功的法则，是经营者的生存智慧。</p><p>只要永不言弃，事态一定会出现转机，我把这种人生态度和工作态度称为“与宇宙意志相协调”。</p>'
  },
  '2026-07-15': {
    chapter: '第15天：干法 · 第5章：追求"完美主义"——怎样才能出色工作',
    content: '<p><strong>第5章追求“完美主义”:怎样才能出色工作</strong></p><p>:要求每天的工作都要追求“完美”，这很苛刻，也很困难。</p><p>::要完成一个产品，99%的努力是不够的。一点差错，一点疏忽，一点马虎都不能允许。任何时候都要求100%的“完美主义”。</p><p>:为了防患于未然，自始至终，我要求每个人的神经都必须高度集中，注意到事情的方方面面。</p><p>工作中要做到“有意注意”相当困难。需要靠平时不断训练、养成习惯才行。</p><p>如果不论做什么事都能贯彻“有意注意”，那么，不仅能大大减少差错和失误，而且当问题出现时，也能够立即抓住问题的本质，迅速予以解决。</p><p>不管多么细小的工作都要用心去做，投入100%的力量。正是因为贯彻了这样的“完美主义”，才使京瓷在不断创造新产品的同时，获得了持续的成长和发展。</p><p>出色的工作产生于“完美主义”</p><p>我有一位叔叔是海军航空队的飞机维修员。这位叔叔从战场归来后跟我讲过的一番话，我至今记忆犹</p><p>新。</p><p>当时，每当轰炸机起飞时，维修员也要随机飞行。但奇怪的是，几乎所有的维修员都不乘坐自己维修过的飞机，而是乘坐别的维修员同事维护保养的飞机。这是为什么呢?</p><p>因为虽然自己在维修保养时竭尽全力，但如果被问道:“你做得万无一失吗?完美无缺吗?”却没人敢充满自信地回答“是”。</p><p>正因为对自己的工作缺乏充分的自信，考虑到万一情况，所以维修员们都选择乘上同事负责的轰炸机。</p><p>我还听过类似的事情。自己的子女、妻子、父母患重病，许多医生都不愿亲自诊断，因为他们也缺乏自信。亲人要动手术时更是如此，往往委托自己信任的医生动手开刀。我们常听到的理由是:“因为亲人的骨肉之情，自己开刀的话，动手之前，手就会发抖。”但我不认同这个理由。</p><p>这种情况，是因为医生们对自己缺乏自信。</p><p>如果我是外科医生，当亲人需要做手术时，我不会委托任何人，必定亲手执刀。</p><p>为什么?因为对于我来说，每一天的工作都是“真刀真枪”地干，我都会从正面面对，这样天天积累，我一定会对自己的手感、技术拥有自信。“完美主义”只有在每天认真的工作和生活中才能产生。</p><p>要求每天的工作都追求“完美”，这很苛刻，也很困难。但是如果你真心想把事情做得令人满意，除了竭力做到“完美”之外别无他法。成败取决于“最后1%的努力”，我从年轻时开始就把贯彻“完美主义”作为信条。</p><p>一方面，这是我与生俱来的、先天的性格。另一方面，这也是从我从事产品制造的经验中学来的，是后天形成的观念。</p><p>在制造产品的过程中，哪怕99%都很顺利，但只要最后的1%因疏忽而出了问题，那么前面所有的努力都会前功尽弃。这样的事情时常发生，特别是新型陶瓷的制作，只要一个小差错，很小的一点粗心，就会造成致命的失败。这种事情绝不少见。</p><p>新型陶瓷的制作，需要按比例将粉末状态的金属氧化物一氧化铝、氧化硅、氧化铁、氧化镁等原料混合后，放在模具内加压成型，然后在高温炉中烧结，出炉的半成品还要进行研磨，对表面进行金属加工处理。完成一个产品需要许多道工序，而且每道工序都需要精细的技术，每位员工工作时都必须全神贯注。</p><p>因此，要完成一个产品，99%的努力是不够的。一点差错、一点疏忽、一点马虎都不能允许。任何时候都要求100%的“完美主义”。</p><p>如果懈怠了最后1%的努力，就会产生不良品，那么材料费、加工费、电费不说，前面各道工序所花费的时间、精力、智慧，所有一切也都全部泡汤。在多道工序中只要有一道工序出现微小的缺陷，之前的全部努力都化为泡影。同时，还会让等候着产品的客户蒙受巨大的损失。</p><p>京瓷生产的电子工业用各类陶瓷零件，几乎全都是按客户订单生产的。客户都是电器厂家，“我们机器中的重要零件，要使用你们京瓷生产的新型陶瓷，请按这种规格制造，要求你们某月某日交货。”我们的销售员就这样从客户处获得订单。</p><p>客户机器装配的日程安排，与京瓷提供的配件交货期是紧密相连的，京瓷必须严格遵守预定的交货期。在生产过程中只要发生一点点差错，承诺的交货期无法兑现，就是违约，那将损害公司的信誉。例如，临近交货期了，因工作不到位而产生了不良品;如果该产品的制造周期是两个星期，而问题又发生在最终出货阶段时，就意味着要再花两个星期去重新制造产品。</p><p>如果真是这样，销售员就得立刻向客户解释，并且一个劲儿地低头道歉，请求再宽限两个星期。这时往往会遭到客户的严厉训斥:“产品委托给了你们这样的公司，就要连累我们整个生产线停产吗?”“再也不会和你们这样的公司做第二次生意了!</p><p>我们的销售员，一个大男人遭到如此责骂，哭着鼻子狼狈而归。这样的事情真的发生过。这些痛苦的经验使得“工作一定要追求完美主义”的理念渗入我的骨髓。</p><p>为了防患于未然，自始至终，我要求每个人的神经都必须高度集中，注意到事情的方方面面。除此之外别无他法，我要求员工无论什么细节都要精心对待。</p><p>这种将意识高度集中的做法叫作“有意注意”。与之相对地，听到声响，突然回头，予以注意，这就叫“无意注意”。</p><p>工作中要做到“有意注意”相当困难。需要靠平时不断训练、养成习惯才行。</p><p>工作中要做到“有意注意”相当困难。需要靠平时不断训练、养成习惯才行。</p><p>如果不论做什么事都能贯彻“有意注意”，那么，不仅能大大减少差错和失误，而且当问题出现时，也能够立即抓住问题的本质，迅速予以解决。</p><p>不管多么细小的工作都要用心去做，投入100%的力量。正是因为贯彻了这样的“完美主义”，才使京瓷在不断创造新产品的同时，获得了持续的成长和发展。</p>'
  },
