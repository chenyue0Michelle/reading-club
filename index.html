<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《稻盛和夫如是说》35天打卡计划</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }

    /* ===== HEADER ===== */
    .header {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.6em;
      color: #f5c518;
      text-shadow: 0 0 20px rgba(245,197,24,0.4);
      margin-bottom: 6px;
    }
    .header .formula {
      font-size: 0.95em;
      color: #a0c4ff;
      letter-spacing: 1px;
    }
    .header .dates {
      font-size: 0.8em;
      color: #888;
      margin-top: 4px;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-section {
      padding: 16px 20px 8px;
      max-width: 700px;
      margin: 0 auto;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82em;
      color: #aaa;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5c518, #ff6b6b);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ===== MAIN LAYOUT ===== */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85em;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(245,197,24,0.2);
      border-color: #f5c518;
      color: #f5c518;
    }

    /* ===== TODAY CARD ===== */
    .today-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .today-card .day-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000;
      font-weight: bold;
      font-size: 0.78em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .today-card h2 {
      font-size: 1.05em;
      color: #f5c518;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .today-card .content-body {
      font-size: 0.9em;
      line-height: 1.9;
      color: #ccc;
    }
    .today-card .content-body p { margin-bottom: 10px; }
    .today-card .content-body blockquote {
      border-left: 3px solid #f5c518;
      padding: 8px 14px;
      margin: 12px 0;
      background: rgba(245,197,24,0.08);
      border-radius: 0 8px 8px 0;
      color: #f5c518;
      font-style: italic;
    }
    .today-card .content-body strong { color: #fff; }
    .today-card .content-body ul, .today-card .content-body ol {
      padding-left: 20px;
      margin: 8px 0;
    }
    .today-card .content-body li { margin-bottom: 6px; }

    /* ===== CHECK-IN BUTTON ===== */
    .checkin-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== STATUS BOX ===== */
    .status-box {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.88em;
      margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }

    /* ===== CALENDAR ===== */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-header {
      text-align: center;
      font-size: 0.72em;
      color: #666;
      padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78em;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future {
      background: rgba(255,255,255,0.04);
      color: #555;
      cursor: default;
    }
    .cal-day.available {
      background: rgba(255,255,255,0.08);
      color: #aaa;
    }
    .cal-day.available:hover {
      background: rgba(245,197,24,0.15);
      border-color: #f5c518;
      color: #f5c518;
    }
    .cal-day.today-marker {
      background: rgba(245,197,24,0.2);
      border-color: #f5c518;
      color: #f5c518;
      font-weight: bold;
    }
    .cal-day.checked {
      background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1));
      border-color: #2ecc71;
      color: #2ecc71;
    }
    .cal-day.checked::after {
      content: '✓';
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 0.65em;
      color: #2ecc71;
    }

    /* ===== HISTORY LIST ===== */
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(245,197,24,0.3);
    }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }

    /* ===== TAB CONTENT ===== */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 24px;
      max-width: 680px;
      width: 100%;
      margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body {
      font-size: 0.88em;
      line-height: 1.9;
      color: #ccc;
    }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518;
      padding: 8px 14px;
      margin: 12px 0;
      background: rgba(245,197,24,0.08);
      border-radius: 0 8px 8px 0;
      color: #f5c518;
      font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }

    /* ===== LOGIN OVERLAY ===== */
    .login-overlay {
      display: none;
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1em;
      padding: 12px 16px;
      text-align: center;
      margin-bottom: 16px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }

    /* ===== USER GREETING ===== */
    .user-greeting {
      display: none;
      background: rgba(245,197,24,0.08);
      border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name {
      color: #666;
      font-size: 0.8em;
      cursor: pointer;
      text-decoration: underline;
    }
    .user-greeting .change-name:hover { color: #aaa; }

    /* ===== FONT SIZE CONTROLS ===== */
    .font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      justify-content: flex-end;
    }
    .font-btn {
      padding: 4px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING ===== */
    .record-area {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .record-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #ccc;
      font-size: 1.3em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .record-btn.recording {
      border-color: #ff4757;
      background: rgba(255,71,87,0.15);
      color: #ff4757;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }

    /* ===== REFLECTION ===== */
    .reflection-area {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .reflection-label {
      font-size: 0.82em;
      color: #888;
      margin-bottom: 8px;
    }
    .reflection-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #ddd;
      font-size: 0.88em;
      line-height: 1.7;
      padding: 10px 12px;
      resize: vertical;
      min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus {
      outline: none;
      border-color: rgba(245,197,24,0.4);
      background: rgba(255,255,255,0.08);
    }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved {
      font-size: 0.78em;
      color: #2ecc71;
      margin-top: 6px;
      display: none;
    }

    /* ===== STATS ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    /* ===== AUDIO WALL (录音墙) ===== */
    .audio-wall-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .audio-wall-header h3 {
      color: #f5c518;
      font-size: 1em;
      margin-bottom: 4px;
    }
    .audio-wall-header p {
      font-size: 0.78em;
      color: #888;
    }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      transition: all 0.2s;
    }
    .audio-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(245,197,24,0.3);
    }
    .audio-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .audio-player-row audio {
      flex: 1;
      height: 36px;
      border-radius: 8px;
    }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15);
      color: #f5c518;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75em;
      white-space: nowrap;
    }
    /* 录音按钮增强 */
    .record-area.uploading {
      opacity: 0.6;
      pointer-events: none;
    }
    .record-upload-status {
      font-size: 0.78em;
      color: #f5c518;
      margin-top: 4px;
      display: none;
    }
    .record-upload-status.show { display: block; }
    /* 录音回放 */
    .record-playback {
      margin-top: 8px;
      display: none;
    }
    .record-playback.show { display: block; }
    .record-playback audio {
      width: 100%;
      height: 36px;
      border-radius: 8px;
    }
    .record-playback-label {
      font-size: 0.76em;
      color: #888;
      margin-bottom: 4px;
    }
    /* loading */
    .loading-spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3);
      border-top-color: #f5c518;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
  <!-- uniCloud SDK (本地文件，不依赖外部CDN) -->
  <script src="cloudbase.js"></script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《稻盛和夫如是说》<br>35天共读计划 · 5月22日—6月25日</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">

  <h1>📖 稻盛和夫如是说</h1>
  <div class="formula">敬天爱人 · 利他经营 · 磨练心性</div>
  <div class="dates">2026年5月22日 — 6月25日 · 35天打卡计划</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 35</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">35</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today')">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar')">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall')">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">

    <!-- 用户问候 -->
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>

    <!-- 字体调节 -->
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>

    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="toggleRecord()">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始录音朗读</div>
        <div class="record-duration" id="recordDuration"></div>
      </div>
      <div class="record-upload-status" id="uploadStatus"></div>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟输入框 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>

const bookContent = {
  '2026-05-22': { chapter: `第1天（05月22日）：推荐序一：认知体系的力量（上）`, content: `<p>稻盛和夫先生是我非常尊重的一位日本企业家，不仅是因为他企业做得好而且做好了不止一家企业（当然，企业经营是实践科学，作为企业家首先必须把企业经营好，否则谈不上其他），更因为他非常善于思考和总结，提炼出了一整套企业经营管理思想，不仅给出了企业经营管理之术，例如阿米巴模式等，而且给出了企业管理之道，例如敬天爱人等，这是非常非常难得的成就。</p>
<p>所谓知其然不难，知其所以然才难，能够知其然且知其所以然，同时形成自己的体系，那绝对是大家了。</p>
<p>我们每个人从一出生开始的什么都不懂，到逐渐懂了一些、懂了更多，懂与非懂之间最重要的分界线是，是否建立起了自己的认知体系。</p>` },
  '2026-05-23': { chapter: `第2天（05月23日）：推荐序一：认知体系的力量（下）`, content: `<p>人有四个最重要的认知体系，即世界观、价值观、人生观以及万事万物观。人和动物之间最大的差别就是有没有认知能力，人和人之间最大的差距是有没有建立自己的这四个认知体系。</p>
<p>如果有这四个认知体系，就是觉察清醒的人，对这个世界、对根本的是非、对如何度过这一生以及对任何事物都能洞悉其本质，知晓其规律，知道如何去面对和处理。</p>
<p>创业者，是要带领一群未知的人去一个未知的地方完成一件未知事业的人，若没有建立起这四大认知体系，是绝无可能成功的。</p>
<p>建立自己的认知体系最重要的是思考，通过读书等方式学习别人系统性的思想是思考的基础和捷径。很多时候我们长时间苦苦思考而不得的答案可能是别人书中阐述的常识，只有善于继承前人的思想，才能更好地发展自己的认知体系。</p>` },
  '2026-05-24': { chapter: `第3天（05月24日）：推荐序一续：伟人的启示`, content: `<p>稻盛和夫先生是日本的管理大师，提出了很多独到的管理见解，也许有的读者会觉得像敬天爱人、阿米巴模式等都很简单，这就对了，我历来相信真正的真理都是非常简单的，凡是把事情描述得复杂又复杂的要么是自己并没有理解通透，要么是存心故弄玄虚以获得利益。</p>
<p>有人说，稻盛和夫先生的思想借鉴了很多中国传统文化，这毫不奇怪，因为世界上的真理原本是一致的，所有领悟了真理的人的认知都是一致的，如果有差别，只是因为角度不同，所以表述的方式、场景、对象不同罢了。</p>
<p>本书是历史上日本的重要媒体对稻盛和夫先生一系列专访的汇编，短小精悍，从中可以看到稻盛和夫先生对于很多重大问题和企业案例是如何思考的，以及他的看法是什么。相信通过阅读本书，大家对稻盛和夫先生的经历、为人以及思想体系会有一个独特视角的了解，如果您是创业者，相信本书对您思考建立自己的认知体系一定会有所助力。</p>
<p>佛教中把那些自己觉悟并且掌握了因势利导、因材施教方便法门的成就者称为菩萨，从这个概念上讲，所有伟大的科学家、艺术家、企业家都是现实生活中的菩萨。</p>
<p>他们就像太阳一样，把自己的温暖无差别地洒向大地，温暖一切有情众生。</p>` },
  '2026-05-25': { chapter: `第4天（05月25日）：推荐序二：致良知于事事物物（上）`, content: `<p>本书是极为宝贵的历史资料。在长达50年的时间里，由"日经"体系内两本杂志的历任总编辑接力采访，准确记录，妥善保存，直至今天整理出版，跨越了半个世纪，可以说极为难得。借助本书，不仅可以一窥稻盛和夫先生这50年的思想轨迹，而且可以通过书中呈现的历史事件，以及稻盛先生对其的感想、评论，看到稻盛先生的思想是如何反映到当时的社会现实和他本人的经营实践中的，正可谓"思想照进现实"。</p>
<p>阅读本书内容会发现，其实早在青年时期，稻盛先生就基本构建了以"利他"为核心要素和主要内容的、相当完整的哲学体系，并虔诚地付诸实践。结果，带来了京瓷、KDDI（第二电信）、日航这些企业组织，以及盛和塾、稻盛财团、京都奖这些社会组织和公益事业，乃至几乎所有事业全面而持久的成功。</p>
<p>同样，正因为始终秉持正确的哲学，所以在看待自身以外的世界时，稻盛先生也能够目光如炬，洞穿本质。本书的时间跨度长达半个世纪，内容从研发到管理、从价值观到方法论、从现象界到心灵界，涉及方方面面，但稻盛先生的评论无不见解独到，切中要害。</p>` },
  '2026-05-26': { chapter: `第5天（05月26日）：推荐序二：致良知于事事物物（中）`, content: `<p>这样的远见卓识贯穿本书的始终："认为缴税很傻的话，企业就很难发展""玩弄权术，事业不会成功""讨好世界，国际化不会成功""善行产生利润""企业无哲学，必然被淘汰""越是精英，越易利己"，等等，都属于一语道破的真知灼见。我认为，稻盛先生之所以能做到这一点，也是因为他始终坚持从利他哲学的角度出发，来看待和理解这个世界。因此，尽管时移世易，风云变幻，稻盛先生始终能抓住事物的本质，看透事物的真相。</p>
<p>更为可贵的是，稻盛先生本人作为构建思想体系的思想家，始终将自己的哲学视为信仰，半个多世纪如一日地坚持实践，即使在取得巨大成功之后，仍然持续修行，而且对自己愈发严格。本书中"防止自己蜕化变质""虽想解释，但'忍'字第一""成功不属于个人"等章节就是与之相关的内容。我认为，这也是稻盛先生能够从成功走向成功，乃至走向圆满的根本原因。</p>
<p>稻盛先生的一生，可以说就是阳明先生所说的"致吾心之良知于事事物物"的一生。从结果来看，稻盛先生事业成功，人生圆满，并让自身所涉及的"事事物物皆得其理"。</p>` },
  '2026-05-27': { chapter: `第6天（05月27日）：推荐序二：阿米巴经营的真谛`, content: `<p>当今社会，人类的生存形态已经高度商业化、组织化、科学化、系统化。企业这一组织形式已经成为所有社会组织中核心性的存在，其存在方式正在深度影响着每一个个体，影响着整个社会，甚至可能在相当程度上影响人类文明未来的走向。我认为，在稻盛先生良知所致的事事物物中，对于我们当前所处的现代商业社会而言，最具现实意义、普遍意义和历史意义的非阿米巴经营这一划时代的经营手法莫属。但遗憾的是，时至今日，社会上对阿米巴经营仍然误解甚多。本书中，稻盛先生对于阿米巴经营也有颇多论述，这些论述极为关键，有助于消除社会大众对阿米巴经营的误解。</p>
<p>当前社会对阿米巴经营的误解中，最具代表性的有两种：一种是将阿米巴经营单纯视作一种提高效率的方法论，而忽视了阿米巴经营源自利他哲学，忽略了运用这种方法论时必须具备的"利他"的世界观。这种企业导入阿米巴经营，结果往往就变成一种变相的绩效考核。</p>
<p>这样的企业经营者往往高度理性化、自以为是，以利己的思维、博弈的心态看待企业经营，而且缺乏对自身错误思维方式的觉察。他们往往只强调奋斗而有意无意地忽略诸如"如何正确地奋斗""奋斗的真正目的""如何帮助员工获得幸福"等根本性问题，或者根本不愿意思考这样的问题。</p>` },
  '2026-05-28': { chapter: `第7天（05月28日）：推荐序二续：利他是根本`, content: `<p>因为这样的经营者导入阿米巴经营，实际上是基于贪图名、利、权的"利己"动机，而其自身又无法认识到这一点，他们的所谓"阿米巴经营"与稻盛先生所说的阿米巴经营完全就是南辕北辙，根本不是一回事，所以不可能获得真正的成功。</p>
<p>稻盛先生在本书中的相关论述，说的就是这种情况，例如："大部分企业恰恰相反，他们对组织进行复杂的切割，反而引起了企业内部的利害对立与冲突，结果是削弱企业的竞争力。这就是现实。"</p>
<p>另一种对阿米巴经营的误解来自传统意义上的中国经营者，他们讲究温良恭俭让，对缺乏人情味的绩效考核持批判态度，将阿米巴经营视作另一种绩效考核，认为它会破坏企业的和谐氛围而加以拒绝。稻盛先生的下列论述可能就代表了他们的心声："京瓷达成了高收益。但有人说：'如果不做点缺德事，怎么可能达成高收益？'有人就是这么想的。在这些人看来，不剥削劳动者，不强制他们劳动，企业的高收益是不可能实现的。善行产生利润，做好事能使社会富裕。这样的思想他们是不认同的。"</p>` },
  '2026-05-29': { chapter: `第8天（05月29日）：推荐序二续：天理即良知`, content: `<p>阿米巴经营可以说就是"致良知"的产物，是"致良知"这一理念在企业经营体系上的具体呈现。稻盛先生对于企业存在的目的、工作的意义、经营的原理原则、会计处理的原理原则等一般经营者忽略的基本概念均重新展开追问，得出了不同于西方管理学中相应概念的定义，可以说改变了企业的定义。其思想内涵呈现出相信人性本善、追求集体主义、高度肯定劳动、内向心灵关照等强烈的东方文化特征，但其具体呈现，兼具显著的西方哲科思维特征，从客观现象出发、逻辑严密、重视数据、讲求实证等。</p>
<p>说得通俗一点，阿米巴经营就是用科学理性的方法来践行利他思想，用极强的逻辑性将"敬天爱人"的精神在企业经营中加以落实，用清晰的数字来"照见"员工的心性。</p>
<p>不管是稻盛先生超过半个世纪的持续成功，还是他对于各种社会现象的真知灼见，乃至集稻盛先生"经营人生之大成"的阿米巴经营，本书涉及的所有内容，从根本而言，都来源于稻盛先生对"心""利他""良知"的正确认知。正所谓"天理即良知"，将内心的良知投射到企业经营的方方面面，企业经营就合乎了天理，就能走上顺畅发展的光明大道。</p>` },
  '2026-05-30': { chapter: `第9天（05月30日）：译者序：关键在于一把手的自律（上）`, content: `<p>《日经BP》是日本最著名的经济杂志，几十年来，采访过日本众多杰出人士。但采访稻盛先生的次数最多，内容最丰富。</p>
<p>而令编者乃至稻盛先生本人惊叹的是，在跨度为半个世纪的采访中，针对各个时期的各种社会热点问题，在稻盛先生的回答和论述中，他的基本理念纹丝不动，一以贯之。</p>
<p>我翻译、编译了稻盛先生25本书，阅读了他从20世纪60年代到21世纪20年代的60年中，多达600多次讲话的文稿。特别是最近10多年来，我利用一切机会向稻盛先生当面请教，在他身边感受他的气息。我深深地感觉到，稻盛先生的利他哲学，像一根红线一样，贯穿了他的人生，贯穿在他的生活、工作和经营的方方面面，当然也包括在他对各个时代的各种问题，包括国际问题的解读之中。</p>` },
  '2026-05-31': { chapter: `第10天（05月31日）：译者序：稻盛先生的传奇人生`, content: `<p>从20世纪70年代开始，稻盛先生就是日本媒体追逐的话题人物。理由是他过于突出，甚至是过于"离经叛道"。</p>
<p>在松风公司打工时，24岁的稻盛，在精密陶瓷领域，就有划时代的发明创造。</p>
<p>27岁（1959年）白手起家创建的京瓷，持续高收益、高增长，规模不是很大时，股价却在1975年荣登日本第一。作为零部件生产厂家，京瓷还跻身过世界五百强。</p>
<p>52岁（1984年）从零起步，闯入完全陌生的通信领城，创立日本第二电信（DDI）。第二电信一路高歌猛进，很快进入世界五百强的行列。</p>
<p>52岁前后，在继续领导京瓷、创建第二电信的同时，还创办盛和塾，创设被称为"亚洲诺贝尔奖"的"京都奖"。数件大事，齐头并进，有条不紊。</p>
<p>58岁（1990年）时，在繁忙之余，应邀参与日本政府的行政改革，历时3年。</p>
<p>65岁（1997年）时出人意外，削发为僧，投身佛门，托钵化缘，街头说法。</p>
<p>78岁（2010年）高龄，从企业退休13年后再度出山，出任破产重建的日航会长，一年后日航不仅起死回生，而且利润行业内世界第一，并遥遥领先。</p>` },
  '2026-06-01': { chapter: `第11天（06月01日）：译者序：防止蜕化变质`, content: `<p>我特别警惕的是，艰苦时这么一路走来，但成功后，在周围人的追捧中，我自己是否逐渐蜕化变质，在自己没有意识到的情况下，堕落下去，丢失了以往的谦虚，变得傲慢起来，奢侈起来。我认为，这一点必须由我自己不断地自戒自勉。"首先是我自己不忘初心，在日常生活中，必须随时提醒自己。""我越是用这一套说服员工，其实也越落实到我自己的身上。换句话说，我自己必须严格自律，这是关键。"</p>
<p>稻盛先生深知，像自己这样创业打天下、光环在身、大权在握，又有威望的人，如果慢慢变质的话，制度就难以约束自己，下属就无法限制自己，除了平时严格自律外，别无他法。</p>
<p>人心有弱点，容易败于环境，输给自身的欲望。权力欲、名誉欲、金钱欲，等等，欲望过度膨胀是万恶之源，组织的领导人需要特别警惕。</p>
<p>人是会傲慢的动物，特别是有本事的人，通过奋斗取得成功，掌握权力以后，在周围人的喝彩声中，在某些人的吹捧声中，在不知不觉中，在自己无意识的状态下，傲慢起来，忘却谦虚，忘记初心。</p>` },
  '2026-06-02': { chapter: `第12天（06月02日）：译者序：一把手自律三法门`, content: `<p>如何自律？在确立并实施"玻璃般透明的经营""双重确认""一一对应"等机制的同时，稻盛先生谈到了自己的3条经验。</p>
<p>1. 彻底地谦虚。在本书中，稻盛大段谈论所谓"存在"的哲学。简单说就是，瑜伽哲人在冥想进入深处时，一切感觉都消失，只有"存在"存在着。这时的意识状态是：感觉到自己，乃至森罗万象、一切事物，都是由"只能称之为'存在'的东西"所构成。因此，"稻盛和夫"也不过是"存在"扮演的角色之一而已。换句话说，自己的才能本来就不属于自己，不过是从"存在"处一时借来之物，所以决不能将它私有化，并据此傲慢不逊，否则就会受到"天罚"。这就从哲学的根底处否定了傲慢自大。</p>
<p>2. 猛烈地反省。反省是稻盛先生一生的宝贵经验。稻盛先生认为自己不过是一介凡夫，普通人有的烦恼自己都有过；有时也会口吐弱音；有时也禁不住傲慢；有时觉得付出大于收获，自己实在太亏了；有时甚至认为自己"骨子里就是一个懒惰的人"。有一次，他对自己年过80还怒发冲冠、当面叱责某位政治人物一事，进行了猛烈的反省。</p>
<p>3. 由衷地感谢。稻盛先生把灾难也看作促使自己成长的机会，因而心存感谢。他说："感谢是万能药，感谢不仅把自己引向愉悦的境界，同时，也会让周围的人快乐起来。"他说，时时由衷地表示感谢，这样来培育一颗能够感受到幸福的心。他甚至说，人生最大的幸福，就是能够由衷地说出感谢这句话。</p>` },
  '2026-06-03': { chapter: `第13天（06月03日）：前言：半个世纪的采访记录（上）`, content: `<p>本书收录了整整半个世纪内，即从20世纪70年代开始至21世纪10年代为止，对稻盛和夫先生的采访，以及他的独白记述。其内容刊载于《日经商业》《日经总裁》这两本杂志上。</p>
<p>《日经商业》是1969年创刊的经济杂志（以前是隔周发行，现在是每周发行）；《日经总裁》于1984年创刊，定位是"日经创新"，是面向中小企业的经营杂志，每月一刊。</p>
<p>《日经商业》和《日经总裁》，作为"日本经济新闻集团"的代表性经济、经营杂志，长期以来，一直受到经营者和经营干部的支持与厚爱。有众多企业家在这两本杂志上登台亮相。然而，从采访的次数和刊载的内容来看，最多的就是稻盛先生。</p>
<p>稻盛先生1959年创建京瓷（当时称京都陶瓷），在自己这一代，就把京瓷培育成了万亿日元级别的企业。不仅如此，1984年创立日本第二电信（现KDDI），2010年就任破产的日本航空公司的会长，在日航重建中大显身手。有如此众多、如此重要话题的企业家稻盛先生，受到媒体的青睐和追逐，理由是很充足的。</p>` },
  '2026-06-04': { chapter: `第14天（06月04日）：前言：半个世纪的采访记录（下）`, content: `<p>再加上，1983年，稻盛先生设立了面向年轻经营者的经营塾"盛和塾"（当时为"盛友塾"），每月一次，举办由稻盛先生亲自主持的塾长例会。包括日本国内外，塾生多达15000人。而在1984年，他又投入自己的个人财产，成立稻盛财团，开始颁发"京都奖"，每年一次，表彰在科学技术、思想及艺术领域内有杰出贡献的人士。后来，在1997年，他又投身佛门，在临济宗妙心寺派的圆福寺剃度出家，托钵化缘。</p>
<p>稻盛先生是声名卓著的经营者，这一点无人质疑。当然，他并非一开始就被公认为著名经营者。</p>
<p>然而，即使是稻盛先生本人，他在读了20世纪70年代对自己的采访内容以后，居然也惊叹当时自己的基本理念，与今天的自己窒无二致，没有任何变化。</p>
<p>有一段时间，对稻盛这个人如何定位，我们媒体人曾经迷惑不定。</p>
<p>今天，我们需要的不是短期有效的处方。作为人，何谓正确？作为人，应该如何度过人生？这才是一切问题的根源。本书按照时间顺序整理了稻盛先生的讲话，只要认真阅读，上述我们所需要的、针对问题的答案，就会在我们面前清晰地呈现出来。</p>` },
  '2026-06-05': { chapter: `第15天（06月05日）：70年代：外行孕育新技术（上）`, content: `<p>京瓷创立于1959年。依靠在精密陶瓷方面高超的技术能力，企业高速发展，1971年公司上市，销售额逼近100亿日元。</p>
<p>稻盛首次接受《日经商业》总编辑的采访，是在1975年，当时公司的名称还是"京都陶瓷"。接受采访时，公司的股价为3810日元，超越索尼，雄登日本第一。引人注目的经营者——稻盛的发言与众不同、别具一格，他讲的不是战略战术，他将重点放在了领导人以及员工应有的心灵的状态上。</p>
<p>【外行才是技术开发的主角】</p>
<p>最近您推出的人工祖母绿宝石成了热门话题。请说一说开发的原委。</p>
<p>稻盛：我们是做精密陶瓷的，是与矿物质打交道的。研究矿物质的结晶，是这一行的基础技术。使用这项结晶技术，我们正在研发工业用的蓝宝石、红宝石等。</p>
<p>有一次，在国外机场的一家珠宝店里，我偶然看到的祖母绿宝石光彩夺目，一下子就把我的心吸引住了。于是，我就调查了一下，这才知道天然的祖母绿原石资源奇缺。所以6年前我们开始研究，看看能不能做出人工的祖母绿宝石。</p>` },
  '2026-06-06': { chapter: `第16天（06月06日）：70年代：外行孕育新技术（下）`, content: `<p>后来做出来了，但人们的反应却很冷淡......在精密陶瓷领域，京瓷开发的陶瓷IC封装，占据了以美国为主的全球80%的市场份额。但是，销售宝石需要直接面向一般大众，对于我们来说，这种做法是第一次，没有任何经验。一个不懂时尚流行，不懂款式设计，不懂流通渠道的男人，只是一心想做宝石，即使做出来了，即使做得很好，也不可能卖得好。"你干这事肯定惨败！"京都经济界人士异口同声，都给我泼冷水。</p>
<p>但是，做矿物原石，是我们技术的延伸，我们有自信。不过要将它加工成宝石，设计款式，然后销售，那是另外一个领域的事情，我们不懂，不擅长。我去传统的珠宝行业请教，他们认为人工合成的宝石是赝品。他们说，我这么做是要搅乱天然宝石的市场。反馈回来的都是这种意见。这让我意识到，我们不仅要创造宝石，连市场也得自己创造。我们就这么一路走来。</p>
<p>【外行孕育新技术】</p>
<p>据传您说过："技术开发必须由外行来做""只要是市场需要的产品，就一定能做出来......"</p>
<p>稻盛：我说要由外行来干，这个外行当然不是一无所知的外行，他们必须具备相关的基础知识。但是，只是一知半解，只是个半吊子专家，那么，事情一开始，他们就会想这想那，冒出各种消极念头。这样的话，即使想干也干不成了。</p>` },
  '2026-06-07': { chapter: `第17天（06月07日）：70年代：纯粹而强烈的愿望`, content: `<p>但是，我不会这样。对于想干的事，我会保持纯粹而强烈的愿望。这样的话，愿望就会进入潜意识。接着，我的行为、我的思考都会围绕潜意识中的愿望而动。相反，只是运用脑细胞，只进行逻辑思考，既想这么干，又想那么干，还怀疑干不成，这样，真的就干不成了。</p>
<p>从这个意义上说，我觉得，不是专家的外行，反而能够持有纯粹的愿望。所以，我才会说开发工作非外行不可。抱着强烈而纯粹的愿望，一切思考和行动都受这种愿望的支配，在这种状态下，我认为，没有开发不出的东西。</p>
<p>公司内进行技术开发时，我是这么做的：比如，我打算做祖母绿时，先确定一个未来的时间点，到时必须完成。因为相信自己的开发能力是不断发展、不断提高的，到时候就能胜任，就能完成。我强调"自己的开发能力，要用未来进行时来把握"。如果不能这么思考问题的话，仅凭现有的技术能力，仅凭现在的这个头脑，就会觉得这也不行，那也不行。必须改变想法，就是说，现在认为不可能的事情，比如用两年时间，在这两年中，想方设法把不可能变为可能。要让员工也这么去思考。</p>` },
  '2026-06-08': { chapter: `第18天（06月08日）：70年代：节约与防蜕化`, content: `<p>【节约从创业时开始】</p>
<p>工资待遇不错，不见得一定会和谐。举例来说，有段时间，报纸杂志经常报道，繁盛企业在某个转折点上，业绩下滑。如果待遇一直不错的员工团结一致，觉得业绩不好，少发奖金也无所谓，那就很好。但现实并非如此，一旦企业遇到困难，以前没有过的工会抬头了，公司内部也出现了内讧，结果加速了企业的没落。这样的例子在电子行业中也屡见不鲜。</p>
<p>现在，企业都在提倡减人，减少支付的利息，要节约一张纸、一支铅笔等，贵公司是一开始就有这个方针吧？</p>
<p>稻盛：现在才来提倡？节约是理所当然。干企业本来就要节约，除此之外没有别的。从创业时起，我们一以贯之。今天再谈这个，我觉得有点可笑。</p>
<p>【防止自己蜕化变质】</p>
<p>我特别警惕的是，艰苦时这么一直走来，但成功后，在周围人的追捧中，我自己是否逐渐蜕化变质，在自己没意识到的情况下，堕落下去，丢失了以往的谦虚，变得傲慢起来，奢侈起来。我认为，这一点必须由我自己不断地自戒自勉。</p>` },
  '2026-06-09': { chapter: `第19天（06月09日）：70年代续：谦虚与格局`, content: `<p>最讨厌的就是傲慢的经营者。特别是地位高升以后，本人也许没有意识到....我非常讨厌。</p>
<p>像我们这种大学毕业的普通技术员，都是从最底层打拼上来的。16年前，我们在街道工厂的一角奋战那个年代和现今比较，本质上没有任何区别。我们决不会自以为了不起，本人有这种自觉。不过是社会把自己推上这个位置，但人一不留神，就会自我膨胀，变得傲慢不逊。</p>
<p>说到职业经理，大企业居多。我觉得他们的格局太小了。比如说吧，很不体面的是，占着社长的椅子不放，或董事之间互扯后腿，等等。这样丢人的事，听得太多了。为什么呢？因为从董事职位上下来的那一天，专车就没有了。</p>
<p>当董事时，配有司机。之所以配车，是因为每天去挤满员的电车，会影响他们的工作。但是，即使是休息日，他们也会叫上公司的车，去打高尔夫，有时还载着老婆去购物。养成了这样的习惯，6年过去了，现在一下子辞去董事职位，仅是失去专车，就会多出一笔不小的开支。</p>
<p>霸占专车、霸着董事的位置不肯放手的人，现实中到处都是，这就是蜕化变节了。</p>` },
  '2026-06-10': { chapter: `第20天（06月10日）：80年代：听从灵魂之声（上）`, content: `<p>20世纪80年代</p>
<p>1979年，《日本第一》一书出版，日本成为享誉世界的经济大国。在人人浮躁的风潮中，主张"自我牺牲"这一概念的经营者，当时除了稻盛，别无他人。虽然世人对京瓷这家公司的评价很高，但"只有团结的人心才是财产"，理解稻盛这句话的人、真正理解稻盛经营思想的人，还非常之少。1984年，稻盛创立第二电信，创立前，他扪心自问是否"动机至善、私心了无"。这句话，稻盛后来还经常谈起。</p>
<p>【听从灵魂之声，价值观大转变】</p>
<p>迄今为止，稻盛先生作为社长全方位引领京瓷，而现在却当了会长，直接的动机是什么？</p>
<p>稻盛：有三个原因。第一，这个公司原本就是请别人出资创建的，所以创建当初就决定，公司接班人不采用世袭制，而是挑选在公司里吃苦耐劳、真心付出的人。</p>
<p>但是，人年纪大了，就会变得固执，说出与自己年轻时矛盾的话。这种情况我见闻多了。所以我想，要更换社长，让继承者接班的话，还是趁早为好。</p>` },
  '2026-06-11': { chapter: `第21天（06月11日）：80年代：听从灵魂之声（下）`, content: `<p>第二，时代的变动以40年为一个周期吧。我是这么看的：现在正好处在日本人需要大幅度转变哲学，或者说价值观的节骨眼上。"二战"结束时，日本的价值观发生了180度的转变，实现了和平，获得了经济的高速发展。而今天的日本，再次来到了一个巨大的拐点。我认为，不能只将目光放在日元升值这种表面现象上。另外，京瓷的海外事业正在扩展，所以我想把日本国内和海外的业务做一个划分。</p>
<p>第三，我一个门外汉，不自量力，挑战通信事业，创建了第二电信。作为"始作俑者"，我必须负责，必须让这家公司成功。所以不得不把时间和精力从京瓷转到第二电信来。</p>
<p>【虽想解释，但"忍"字第一】</p>
<p>原本我埋头钻研陶瓷烧制品，那是不需要许可、认可的。但后来慢慢引人注目，并开始受人追捧了。不过，我的初心是做一个不被外物制约的自由人，能放开手脚，创新创造。但是，我知道，受褒奖者必遭贬损。所以，我本来就不愿意上媒体。</p>
<p>事情发展到那种地步，我当然也有话要讲。连人格都遭人质疑时，我还是挺想解释的。但我周围的人劝我："当下要的是一个'忍'字。"所以公司就可能给人一种"集体冬眠"的感觉吧。</p>` },
  '2026-06-12': { chapter: `第22天（06月12日）：80年代：行走在山脊之上`, content: `<p>【行走在两边都是峭壁的山脊之上】</p>
<p>今天，我回头去看，一路走来，好像一直走在两边都是悬崖峭壁的、狭窄的山脊之上，因为浓雾弥漫，看不清周围的景象，所以只能看着脚下，一步步行走。回头看时，不禁后背发冷，所过之处，随时都可能掉入深渊。</p>
<p>就是说，因为视野狭窄，所以什么也不想，只顾往前走，待视野开阔之时，才看见了那时是多么危险。</p>
<p>因此，当年轻人向我请教时，我就告诉他们："我的情况就是这样。简直不可思议，好事会迎面而来，条件是需要相应的人品。"</p>
<p>在迷雾中前行时，指引您前行的路标是什么呢？</p>
<p>稻盛：我是叩问着自己的灵魂，走到今天的。我出生在乡下，没有什么了不起的经历，人生的齿轮碰巧转到这里罢了。要为社会做贡献，要救助员工，这是我与生俱来的使命，叩问自己的灵魂时，我总会这么想。所以我就背负着这使命，拼命攀登，如此而已。</p>` },
  '2026-06-13': { chapter: `第23天（06月13日）：80年代续：大义与自律`, content: `<p>【获得员工认同，需要大义名分】</p>
<p>要让员工统一方向、形成合力，激励机制是什么呢？是员工持股及股价上涨带给员工的好处吗？</p>
<p>稻盛：不是的。从孩童时起，我就觉得，直接采用金钱刺激的手段有点肮脏。那么，什么能催生大家的认同感呢？为了引发员工的共鸣，行事必须光明磊落，必须具备大义名分。我越是用这一套说服员工，其实也越落实到我自己的身上。换句话说，我自己必须严格自律，这是关键。</p>
<p>在这一点上，我历来坚守不渝。当然会有一部分人反对，也有辞职的人，但大多数员工的评价是："也可不是一个口是心非的家伙！"</p>
<p>【听从灵魂之声，价值观大转变】</p>
<p>稻盛先生的思维方式，就是稻盛主义，将整个企业同化了，大家才能团结一致，凝聚合力，使京瓷变得坚强有力，但您不认为，强项同时也连着弱项吗？</p>
<p>稻盛：这一点我并没有多去考虑。因为我认为，只有凝聚的人心才是财产。的确，不管从哪里切下去，都像金太郎糖一样，大家的理念都相同。如果说，只依靠领导人一个人的哲学凝聚合力是一种脆弱，所以要把它搞得支离破碎的话，那么，好不容易凝聚起来的企业的力量，就趋近于零了。</p>` },
  '2026-06-14': { chapter: `第24天（06月14日）：90年代：资本主义与伦理（上）`, content: `<p>20世纪90年代</p>
<p>泡沫经济破灭，日本企业被迫改革，却找不到方向。针对在日本掀起的、热衷于美国式"实力主义"的风潮，稻盛敲响了警钟："个人主义破坏企业，让员工陷于不幸。"</p>
<p>从20世纪70年代开始，稻盛就一以贯之，强调他的伦理观："作为人，应该是怎样的？"在被商界、政界及官僚们纷纷堕落所动摇的日本，他的这种哲学开始显露头角，受到关注。</p>
<p>【资本主义的根底处有伦理】</p>
<p>这正是所谓"求利有道"。我认为，在资本主义、自由经济之中，是存在我们必须遵守的基础的伦理观的。正因为无视这种伦理观，片面强调"自由竞争、资本主义、金钱的逻辑"等，所以企业才会岌岌可危，社会才会变得畸形。而这是不对的。</p>
<p>京瓷达成了高收益。但有人说："如果不做点缺德事，怎么可能达成高收益？"有人就是这么想的。在这些人看来，不剥削劳动者，不强制他们劳动，企业的高收益是不可能实现的。善行产生利润，做好事能使社会富裕。这样的思想他们是不认同的。</p>` },
  '2026-06-15': { chapter: `第25天（06月15日）：90年代：资本主义与伦理（下）`, content: `<p>不去坏事，遵循天道，或者是遵循人道而行的话，获利乃是理所当然，不出利润反倒是不正常的。</p>
<p>【弱肉强食中的严肃真理】</p>
<p>确实，弱肉强食是存在的，但在社会的根底处，支撑自由经济与资本主义的伦理观是俨然存在的。其实，作为人，构成人类社会所必需的最基本的素质，是人人都有的。</p>
<p>并不是因为想要打倒对方才努力的，大家都不过是为求生而拼命努力。结果，在拼命求生的植物旁边，也会有因为努力不够而枯萎倒下的，不过，这是没有办法的事情。</p>
<p>不存在"要把对方搞垮"的心理，"自己要生存不容易，自然界就是如此严峻，自己必须拼命求生"而结果是，旁边不够努力的倒下了，这是自然界的法则。而正因为对不努力者帮忙过头，所以社会才会扭曲。</p>
<p>抱着善意和关爱之心在严酷的社会中求生存，还是带着恶意在严酷的社会中求生存，二者呈现的社会状况迥然不同。一种是充满杀机的社会，另一种是虽有弱肉强食的淘汰的一面，但依然有一种温暖在流淌。</p>` },
  '2026-06-16': { chapter: `第26天（06月16日）：90年代续：越精英越利己`, content: `<p>到了我这个年纪，无论是企业还是人物，看了二三十年就看明白了。以30年为一个区间来看的话，恶是不可能一帆风顺的。有没有脱离为社会奉献的理念，决定了公司的业绩。</p>
<p>用这一尺度去看的话，真相就会呈现，就能看清楚。"你自身也要反省，稍微改变一下品性如何"，这一点或许真的应该告诫相关的人士。</p>
<p>【越精英，越易利己】</p>
<p>现在，在个人主义抬头的风潮中，以集体主义为根基的稻盛模式，您觉得今后还行得通吗？京瓷主张连员工的墓地也要放在一起。这是把员工当作"社畜"。这种非难之声响彻耳际。</p>
<p>稻盛：不是我希望要集体主义，企业本身就是集体主义。企业如果崇尚个人主义的话，就会分崩离析，陷员工于不幸。所以出现某种程度的整体主义，集体主义的色彩，这是没办法的事情。如果有人讨厌的话，他有辞职的自由，可以去别的公司。</p>
<p>在京瓷，我要以这种思维方式来经营企业，我是公开宣布的。只要赞同的人聚集在一起就行。</p>` },
  '2026-06-17': { chapter: `第27天（06月17日）：21世纪头10年：阿米巴经营（上）`, content: `<p>21世纪头10年</p>
<p>本以为在金融危机后的IT泡沫中能够重新站立、恢复生机的日本企业，因为雷曼危机再次陷入停滞。然而，压而不倒、巍然屹立的著名企业家稻盛，他一以贯之，不断强调领导人的"人格"，在股东资本主义走向极端的风潮下，稻盛的发言独具一格，惊世骇俗。</p>
<p>【一心想要自己的分身】</p>
<p>我自己就是这样的。技术开发、技术改良、制造我都得做，还得去跑销售，给客户解释精密陶瓷的性能和技术等，所有的一切都要自己亲力亲为。</p>
<p>真的，虽然我不是孙悟空，但我甚至想象：拔几根自己的毛，一吹，自己的分身就出现了。这不是说笑话，就是这种迫切的心情，就希望有与我有一样想法、愿意分担经营责任的人。</p>
<p>于是，我就考虑，把公司内部的工作细分，每个部分都安排有责任心的人担任负责人。</p>
<p>划分成小单位后，进账的金额少了，使用的金额也少了，这样就容易核算。只要稍加指导，他们自己就能思考：做出这么多销售额，费用花多少，剩下的就是收益。指导他们认真经营，委托他们。这样一来，他们就会萌生出经营者的思维。</p>` },
  '2026-06-18': { chapter: `第28天（06月18日）：21世纪头10年：阿米巴经营（下）`, content: `<p>【企业无哲学，必然被淘汰】</p>
<p>大部分企业恰恰相反，他们对组织进行复杂的切割，反而引起了企业内部的利害对立与冲突，结果是削弱企业的竞争力。这就是现实。</p>
<p>在阿米巴经营中，公司的所有部门都直接接触到最下游的市场的动向。客户的交货价格如果降低10%，这个消息就会立即传递到制造部门，制造部门就会闻风而动，想方设法将到昨天为止生产的产品的制造成本降低10%。因为如果不这样做，销售部门就接不到客户的订单。从零部件的采购到工艺设计，全盘调整产品的成本结构，动脑思考便宜10%的方法。</p>
<p>规则决定以后，公司的某个部门说"这次我们就退让了"，必须出现这样的效果才好。</p>
<p>【无私者才能当领导】</p>
<p>考虑问题时，能够将自己、将自己的公司置之度外，这样的人，在行业或团队之间，他的意见也会通行无阻。如果只考虑自己的团队，那么各个球队的意见就无法统一。</p>` },
  '2026-06-19': { chapter: `第29天（06月19日）：21世纪头10年：谦虚与斗魂`, content: `<p>不管是政治还是职业棒球，领导人的资质指的不仅是能力出众这一面，比起能力，我认为，领导人的人品、人格，这类素质今后将会占有更大的比重。</p>
<p>成为领导者的人，必须是一流人物，即具备无私之心，随时能够将自己归零的人。认为自己最重要，这样的人不能成为领导者。领导人必须是为了组织甘愿自我牺牲的人。在欧洲的贵族社会中有"贵族义务"（伴随高身份的义务）这个词。我认为，这个义务便是无私之心。</p>
<p>我崇拜西乡隆盛。日本的政治需要西乡这样的人，不要名誉、不要地位、不要金钱。如果不是这样的人，就不能将政事委托给他。这样的人实在是太少了啊，在战后的日本。</p>
<p>【大将一马当先】</p>
<p>稻盛先生您说过，日本人本来是非常勤勉的，但一旦驾轻就熟、一旦成功后，就会有骄傲自满的毛病。</p>
<p>稻盛：傅高义先生的《日本第一》这本书是1979年问世的。当时日本企业强悍有力，连美国的企业也不放在眼里。</p>
<p>傅高义先生采用"日本第一"这样的表达方式，在美国的有识之士看来，这是为美国的经营者敲起了警钟，非常之好。而"日本的经营者读了这本书，很可能心生傲慢，翘起尾巴"。曾有人这么警告过日本人。</p>` },
  '2026-06-20': { chapter: `第30天（06月20日）：21世纪10年代：感谢逆境`, content: `<p>21世纪10年代</p>
<p>2010年2月，作为经营破产的日本航空公司（JAL）的重建负责人，年近80岁的稻盛，鞭策自己的一把"老骨头"，登上了官僚体质严重的日航这艘巨舰。当时，周围的人纷纷劝阻，他们说："这将玷污您的晚节，还是别去为好。"</p>
<p>但是，以稻盛哲学为基轴，日航短时间内华丽转身，转亏为盈，在举世瞩目之中，证明了稻盛经营的正确性。</p>
<p>【感谢逆境】</p>
<p>实际上，我年轻时也经历过艰难，也曾唉声叹气，口吐弱音。</p>
<p>在一人独处时，我经常会想："真的太苦太累了，要不就辞去社长职位吧。"但是，在冒出这个念头的瞬间，我又会对自己说："那怎么行！"我在泄气中鼓足勇气，振奋自己。</p>
<p>创建公司，发展公司，绝非轻而易举。碰上难事，干责任很重的工作，除非是哲学家，谁都难免唉声叹气。</p>
<p>人在直面苦难时，不要设法逃避，而是从正面接受它，必须将苦难转化为成长的食粮。我认为，苦难，因为接受它的方式的不同，既可以产生负面的作用，也可以产生正面的作用。</p>` },
  '2026-06-21': { chapter: `第31天（06月21日）：21世纪10年代：大义驱动`, content: `<p>如果所处的环境严酷，那就应该从正面接受它，把它当作促进自己成长的丰富的营养剂，付出不亚于任何人的、拼死的努力。</p>
<p>我50多岁时创建第二电信，设立了稻盛财团，开始了盛和塾的活动。同时做这三件壮观的大事，还兼任着京瓷的社长。</p>
<p>做这三件事，目的都是为社会、为世人，不是为私欲。50多岁后，是大义驱动了我，从那以后，我激情燃烧。</p>
<p>人心中的所思所想，会成为动机。动机唤起行动。没有想过的事，谁也不会去实行。而成为动机的东西，首先就是欲望。欲望在人的本能中，也是最强大的。</p>
<p>不过，作为欲望的替代，还有一种别的动机，它触动人的心，哪怕冒风险，也要付诸行动。那就是在心中感觉到的大义。</p>
<p>一旦为大义所驱动，就不会再口吐弱音，泄气抱怨了。因此，经营者的思维方式、心灵的状态是很重要的。</p>` },
  '2026-06-22': { chapter: `第32天（06月22日）：21世纪10年代：南无，南无，谢谢`, content: `<p>【南无，南无，谢谢】</p>
<p>"为了磨炼灵魂，该做什么呢？"我下面说的，可能不是直接针对这个问题的答案。但是，我认为，对于自己当下所处的环境表示感谢，这是非常重要的。无论是身处严酷的环境，还是绝佳的环境，都能够说出"谢谢"这句话。就是说，需要具备能说出这句话的人品。</p>
<p>我在上小学前，曾到过"隐蔽念佛"的集会场所。某天夜里，父亲一手拉着我的手，一手提着灯笼，踏上山路，在路的尽头，有隐蔽念佛集会的场所。有几个和我差不多年龄的小孩，正面朝佛坛，双手合十，叩拜佛祖，我也加入了其中。</p>
<p>当时，一位僧人对我父亲说："这个孩子以后不用再带过来了。不过，他要每天念叨'南无阿弥陀佛，谢谢'这句话，用这句话来向佛祖表达感谢之意。"</p>
<p>那时我好像是五六岁，当时的场景和僧人的话，给我留下了深刻的印象。自那以后，用鹿儿岛方言念叨"南无，南无，谢谢"，就成了我每天的功课。</p>
<p>无论是出差去美国还是欧洲，或者去教堂，我都会念叨"南无，南无，谢谢"。这已经成了我的口头禅，到了86岁的今天，我依然保持这个习惯。</p>` },
  '2026-06-23': { chapter: `第33天（06月23日）：21世纪10年代：神啊，对不起`, content: `<p>【神啊，对不起】</p>
<p>早晨，一站在洗脸台的镜子面前，我就会脱口而出，并不是针对特定的对象，而是对森罗万象、一切事物表示感谢，双手合十，说一声"南无，南无，谢谢"。</p>
<p>说真的，对让自己吃过苦头的人，也应该说"谢谢"的，但我的人品，还没有修炼到那个地步。不过我知道，经历苦难，一定会有助于自己人格的成长。</p>
<p>早上站在洗脸台前，我还会说"神啊，对不起！"并不是说具体做了什么，所以表示歉意，而是觉得昨日之前，自己的人生中一定有错失之处，所以才会说对不起。</p>
<p>说自己做得不到位，是因为在自己没有意识到的地方，肯定做过什么错事吧，我就是这么想的。开始说"神啊，对不起"这句话，我记得是在30多岁时，到现在已经持续了50年了。</p>
<p>不要自吹自擂，不要把一切功劳归于自己，不要把一切错误归于他人。对今天发生在自己身上的事情，要表示感谢。对自己做过的事情，要说声抱歉。只要保持这样的心境，拼命投入眼前的工作，充满欲望的那颗心，就会发生变化。</p>` },
  '2026-06-24': { chapter: `第34天（06月24日）：21世纪10年代：何谓经营者（上）`, content: `<p>【后记：何谓经营者】</p>
<p>首先，我们来梳理一下稻盛经营，它的代名词"阿米巴经营"是一种管理手法，就是把整个组织细分为一个个5~10人的小集团（阿米巴），各个阿米巴每天都进行核算管理。因为自己的阿米巴今天赚了多少、亏了多少一目了然，所以即使是进公司只有几年的年轻员工，也会有经营的感觉，可以朝着稻盛经常说的"销售最大化，费用最小化"的方向努力。</p>
<p>要让阿米巴经营在经营现场发挥作用，那么"究竟要办一个什么样的企业？"经营者办企业的理念，必须与员工共有。经营者与员工之间构建牢固的信赖关系，这是绝对条件。如果做不到，那么，"自己是被强制做麻烦的数字管理"，员工有这种感觉，组织就会疲软。为此，作为阿米巴经营的地基，稻盛先生会向员工阐述"philosophy"。</p>
<p>所谓"philosophy"，就是哲学。但稻盛哲学绝不是高深难懂的东西，比如要"做出正确的判断"，要"抑制利己，发扬利他精神"，要"付出不亚于任何人的努力"，等等，都是做人做事最基本的态度。</p>` },
  '2026-06-25': { chapter: `第35天（06月25日）：21世纪10年代：何谓经营者（下）`, content: `<p>教人如何赚钱的咨询顾问不计其数，解说为人处世方法的大师也有很多。但是，让乍看互相矛盾的两个命题相辅相成的人，首先是没有的。自从涩泽荣一提出"论语与算盘"以来，如何让道德心和经济性实现高位平衡，大家都伤透了脑筋。解决这两个大命题的关键，不在于经营手法，而在于经营者个人——稻盛先生揭示了事情的本质。</p>
<p>把经营者个人的stoic（克己的）人格放在企业经营的核心位置上，就能把数据管理与理念共有这两点协调起来。</p>
<p>对于经营者来说，不是构建了商业模式就结束了，不是向部下发出指令就完事了。经营者只有深入到组织中去，员工才会追随。经营者要成为火种，把员工的心点燃起来。企业无论是好是坏，最后都归结于经营者，这就是稻盛先生思考的所谓领导力。</p>
<p>我这样可不行！"这种自我反省，稻盛反复进行，深刻而又猛烈。有人称稻盛为"超人"（charisma），如果说稻盛有神格属性的话，那就是反省。他平易近人的笑容让人亲近，但一旦碰触到他气势逼人的克己之心，又让人不由得却步。从他身上体现出来的、人的无限可能性，让周围的人不能不为之心醉。</p>` }

async function hmacSha1(key, msg) {
  var enc = new TextEncoder();
  var keyData = (typeof key === 'string') ? enc.encode(key) : key;
  var msgData = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var cryptoKey = await crypto.subtle.importKey('raw', keyData, {name: 'HMAC', hash: 'SHA-1'}, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
  return Array.from(new Uint8Array(sig)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function sha1Hash(msg) {
  var enc = new TextEncoder();
  var data = (typeof msg === 'string') ? enc.encode(msg) : msg;
  var hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function cosSignHeaders(method, path) {
  var now = Math.floor(Date.now() / 1000);
  var startTime = now - 60;
  var endTime = now + 3600;
  var keyTime = startTime + ';' + endTime;
  
  var signKey = await hmacSha1(COS_CONFIG.SecretKey, keyTime);
  var httpString = method.toLowerCase() + '\n' + path + '\n\n\n';
  var httpStringHash = await sha1Hash(httpString);
  var stringToSign = 'sha1\n' + keyTime + '\n' + httpStringHash + '\n\n\n\n\n';
  var signature = await hmacSha1(signKey, stringToSign);
  
  var auth = 'q-sign-algorithm=sha1&q-ak=' + COS_CONFIG.SecretId +
    '&q-sign-time=' + keyTime +
    '&q-key-time=' + keyTime +
    '&q-header-list=&q-url-param-list=&q-signature=' + signature;
    
  return { Authorization: auth };
}

async function uploadToCloud(blob, fileName) {
  var timeoutMs = 30000;
  console.log('[Upload] start:', fileName, 'size:', Math.round(blob.size / 1024), 'KB');
  
  try {
    var filePath = '/' + COS_CONFIG.Bucket + '/recordings/' + fileName;
    var url = 'https://' + COS_CONFIG.Bucket + '.cos.' + COS_CONFIG.Region + '.myqcloud.com/recordings/' + fileName;
    var headers = await cosSignHeaders('PUT', filePath);
    headers['Host'] = COS_CONFIG.Bucket + '.cos.' + COS_CONFIG.Region + '.myqcloud.com';

    var result = await new Promise(function(resolve, reject) {
      var timer = setTimeout(function() { reject(new Error('上传超时(>30s)，请检查网络后重试')); }, timeoutMs);

      fetch(url, {
        method: 'PUT',
        headers: headers,
        body: blob
      }).then(function(res) {
        clearTimeout(timer);
        if (res.ok || res.status === 200) {
          console.log('[Upload] OK:', url);
          resolve(url);
        } else {
          res.text().then(function(text) {
            console.error('[Upload] HTTP', res.status, ':', text.substring(0, 200));
            reject(new Error('上传失败(HTTP ' + res.status + ')'));
          }).catch(function() { 
            reject(new Error('上传失败(HTTP ' + res.status + ')'));
          });
        }
      }).catch(function(err) {
        clearTimeout(timer);
        console.error('[Upload] network error:', err);
        reject(new Error('网络错误: ' + (err.message || String(err))));
      });
    });

    return result;
  } catch(e) {
    var detail = e && e.message ? e.message : String(e || '未知错误');
    console.error('[Upload] catch:', detail);
    throw new Error(detail);
  }
}

function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

async function saveRecordToDB(record) {
  const cloudApp = await initCloud();
  if (!cloudApp) return null;
  try {
    const db = cloudApp.database();
    const res = await db.collection(DB_COLLECTION).add(record);
    console.log('[DB] saved:', res.id);
    return res;
  } catch(e) { console.error('[DB] save fail:', e); return null; }
}

async function queryAllRecords(limitCount) {
  const cloudApp = await initCloud();
  if (!cloudApp) return [];
  try {
    const db = cloudApp.database();
    const res = await db.collection(DB_COLLECTION)
      .orderBy('createdAt', 'desc')
      .limit(limitCount || 200)
      .get();
    console.log('[DB] found', res.data.length, 'records');
    return res.data;
  } catch(e) { console.error('[DB] query fail:', e); return []; }
}


// ===== REAL AUDIO RECORDING =====
let mediaRecorder = null;
let recordedChunks = [];
let mediaStream = null;
let recordTimer = null;
let recordSeconds = 0;
let isRecording = false;
let currentBlob = null;

function toggleRecord() {
  console.log('[Record] button clicked!');
  var btn = document.getElementById('recordBtn');
  var status = document.getElementById('recordStatus');
  var duration = document.getElementById('recordDuration');

  if (!isRecording) {
    navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: true, noiseSuppression: true }
    }).then(function(stream) {
      mediaStream = stream;
      recordedChunks = [];
      
      let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
        ? 'audio/webm;codecs=opus' 
        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async function() {
        currentBlob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
        
        // 显示回放
        var player = document.getElementById('recordPlayer');
        player.src = URL.createObjectURL(currentBlob);
        document.getElementById('recordPlayback').classList.add('show');

        var m = Math.floor(recordSeconds / 60);
        var s = recordSeconds % 60;
        var timeStr = (m > 0 ? m + '分' : '') + s + '秒';

        status.className = 'record-status';
        status.textContent = '\u2705 \u5f55\u97f3\u5b8c\u6210\uff1a' + timeStr;
        duration.textContent = '\u6b63\u5728\u4e0a\u4f20\u81f3\u4e91\u7aef...';

        // 保存时长
        var today = todayStr();
        var checkins = getCheckins();
        if (checkins[today] && typeof checkins[today] === 'object') {
          checkins[today].readTime = timeStr;
        }
        saveCheckins(checkins);

        await doUploadAudio(today, timeStr);
      };

      isRecording = true;
      recordSeconds = 0;
      mediaRecorder.start();

      btn.classList.add('recording');
      btn.textContent = '\u23f9';
      status.className = 'record-status active';
      status.textContent = '\ud83d\udd34 \u6b63\u5728\u5f55\u97f3...';

      recordTimer = setInterval(function() {
        recordSeconds++;
        var m2 = Math.floor(recordSeconds / 60);
        var s2 = recordSeconds % 60;
        duration.textContent = '\u5df2\u5f55 ' + (m2 > 0 ? m2 + '\u5206' : '') + s2 + '\u79d2';
      }, 1000);

    }).catch(function(err) {
      console.error('\u65e0\u6cd5\u8bbf\u95ee\u9ea6\u514b\u98ce:', err);
      status.className = 'record-status active';
      status.style.color = '#ff4757';
      status.textContent = '\u274c \u65e0\u6cd5\u8bbf\u95ee\u9ea6\u514b\u98ce';
    });

  } else {
    isRecording = false;
    clearInterval(recordTimer);

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t) { t.stop(); });
      mediaStream = null;
    }

    btn.classList.remove('recording');
    btn.textContent = '\ud83c\udfa4\u91cd\u65b0\u5f55\u5236';
  } catch(e) {
    console.error('[Record] error:', e);
    alert('录音出错: ' + (e && e.message ? e.message : String(e)));
  }
}

async function doUploadAudio(dateStr, durationStr) {
  var statusEl = document.getElementById('uploadStatus');
  var durationEl = document.getElementById('recordDuration');
  var areaEl = document.getElementById('recordArea');

  statusEl.classList.add('show');
  statusEl.innerHTML = '<span class="loading-spin"></span> \u6b63\u5728\u4e0a\u4f20...';
  areaEl.classList.add('uploading');

  try {
    if (!currentBlob) { statusEl.textContent = '\u26a0\ufe0f \u65e0\u5f55\u97f3'; areaEl.classList.remove('uploading'); return; }

    var userName = localStorage.getItem(USER_KEY) || '\u533f\u540d';
    var timestamp = Date.now();
    var safeName = dateStr + '_' + userName.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '') + '_' + timestamp;

    var fileId = await uploadToCloud(currentBlob, safeName + '.webm');
    
    var dayIdx = getDayIndex(dateStr);
    var chapterInfo = bookContent[dateStr] || {};

    await saveRecordToDB({
      userName: userName,
      date: dateStr,
      dayIndex: dayIdx,
      chapter: chapterInfo.chapter || '',
      duration: durationStr,
      fileSizeKB: Math.round(currentBlob.size / 1024),
      fileId: fileId || '',
      createdAt: new Date()
    });

    statusEl.style.color = '#2ecc71';
    statusEl.textContent = '\u2601\ufe0f \u5f55\u97f3\u5df2\u4e0a\u4f20\uff01';
    durationEl.textContent = '\u5f55\u97f3\u5df2\u4fdd\u5b58\uff0c\u53ef\u968f\u65f6\u56de\u542c\u6216\u53bb\u300c\u5f55\u97f3\u5899\u300d\u6536\u542c';

    setTimeout(function() { areaEl.classList.remove('uploading'); }, 500);

  } catch(err) {
    console.error('upload fail:', err);
    statusEl.style.color = '#ff4757';
    var rawMsg = window._cloudError || (err && err.message) || '';
    var errMsg = (typeof rawMsg === 'string') ? rawMsg : JSON.stringify(rawMsg).substring(0, 150);
    // 防止 [object Object] 泄漏
    if (errMsg.indexOf('object Object') >= 0) { errMsg = '上传失败(网络或权限错误)，请稍后重试'; }
    statusEl.textContent = '\u274c ' + errMsg;
    areaEl.classList.remove('uploading');
  }
}


// ===== CONFIG =====
const START_DATE = '2026-05-22';
const END_DATE   = '2026-06-25';
const TOTAL_DAYS = 35;
const STORAGE_KEY = 'rushishuo_checkins_v2';

// ===== UTILITIES =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateAdd(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getCheckins() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveCheckins(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getDayIndex(dateStr) {
  const start = new Date(START_DATE + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - start) / 86400000) + 1;
}

// ===== CHECK IN =====
function doCheckIn() {
  const today = todayStr();
  const checkins = getCheckins();
  if (checkins[today]) return;

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  // 读取感悟
  const reflection = (document.getElementById('reflectionInput').value || '').trim();
  // 读取朗读时长
  const readTimeEl = document.getElementById('recordStatus');
  const readTime = isRecording ? '' : (readTimeEl.textContent.includes('本次朗读') ? readTimeEl.textContent.replace('✅ ', '') : '');

  checkins[today] = { time: timeStr, reflection, readTime };
  saveCheckins(checkins);

  document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
  document.getElementById('checkinBtn').disabled = true;
  document.getElementById('statusBox').className = 'status-box completed';
  // 显示感谢语（方便截图发群）
  const userName = localStorage.getItem('rushishuo_username') || '';
  document.getElementById('statusBox').innerHTML = `🎉 <b>感谢${userName}（${today}）完成打卡，再接再励！</b>`;

  // 显示感悟已保存
  if (reflection) {
    const saved = document.getElementById('reflectionSaved');
    saved.style.display = 'block';
  }

  // 停止录音计时
  if (isRecording) toggleRecord();

  renderCalendar();
  renderHistory();
  updateStats();
}


// ===== STATS =====
function updateStats() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent);

  const checkedDays = keys.filter(k => checkins[k]).length;
  document.getElementById('statChecked').textContent = checkedDays;
  document.getElementById('progressCount').textContent = `${checkedDays} / ${TOTAL_DAYS}`;
  document.getElementById('progressFill').style.width = `${(checkedDays / TOTAL_DAYS * 100).toFixed(1)}%`;

  // streak
  let streak = 0;
  let d = today;
  while (checkins[d] && bookContent[d]) {
    streak++;
    d = dateAdd(d, -1);
  }
  document.getElementById('statStreak').textContent = streak;

  // remain
  const remain = Math.max(0, TOTAL_DAYS - checkedDays);
  document.getElementById('statRemain').textContent = remain;

  document.getElementById('progressText').textContent = `打卡进度 ${(checkedDays / TOTAL_DAYS * 100).toFixed(0)}%`;
}

// ===== CALENDAR =====
function renderCalendar() {
  const checkins = getCheckins();
  const today = todayStr();
  const container = document.getElementById('calendarContainer');

  // Build months April and May 2026
  const months = [
    { year: 2026, month: 5, label: '2026年5月' },
    { year: 2026, month: 6, label: '2026年6月' }
  ];

  let html = '';
  const weekDays = ['日','一','二','三','四','五','六'];

  months.forEach(({ year, month, label }) => {
    const firstDay = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();

    html += `<div style="margin-bottom:20px;">
      <div style="text-align:center;color:#f5c518;font-size:0.9em;margin-bottom:10px;font-weight:bold;">${label}</div>
      <div class="calendar-grid">`;

    weekDays.forEach(w => {
      html += `<div class="cal-header">${w}</div>`;
    });

    for (let i = 0; i < firstDay; i++) {
      html += `<div class="cal-day empty"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const inRange = bookContent[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const isChecked = checkins[dateStr];

      let cls = 'cal-day';
      if (!inRange) {
        cls += isFuture ? ' future' : ' empty';
      } else if (isChecked) {
        cls += ' checked';
      } else if (isToday) {
        cls += ' today-marker';
      } else if (isFuture) {
        cls += ' future';
      } else {
        cls += ' available';
      }

      const onclick = inRange && !isFuture ? `onclick="showDayModal('${dateStr}')"` : '';
      html += `<div class="${cls}" ${onclick}>${d}</div>`;
    }

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

// ===== HISTORY =====
function renderHistory() {
  const checkins = getCheckins();
  const today = todayStr();
  const keys = Object.keys(bookContent).sort().reverse();
  const list = document.getElementById('historyList');

  if (keys.length === 0) {
    list.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">暂无记录</p>';
    return;
  }

  list.innerHTML = keys.map(dateStr => {
    const data = bookContent[dateStr];
    const isChecked = checkins[dateStr];
    const isFuture = dateStr > today;
    const dayIdx = getDayIndex(dateStr);
    const dateLabel = dateStr.replace('2026-', '').replace('-', '月') + '日';

    let checkedLabel = '';
    if (isChecked) {
      const timeStr = typeof isChecked === 'object' ? isChecked.time : isChecked;
      const reflection = typeof isChecked === 'object' ? isChecked.reflection : '';
      const readTime = typeof isChecked === 'object' ? isChecked.readTime : '';
      checkedLabel = `<div class="h-checked">✅ 已打卡 ${timeStr}${readTime ? ' · ' + readTime : ''}</div>`;
      if (reflection) checkedLabel += `<div style="font-size:0.78em;color:#aaa;margin-top:4px;">💬 ${reflection.slice(0,40)}${reflection.length>40?'...':''}</div>`;
    }

    return `<div class="history-item" onclick="showDayModal('${dateStr}')">
      <div class="h-date">${dateLabel} · 第${dayIdx}天 ${isFuture ? '<span style="color:#555">（未解锁）</span>' : ''}</div>
      <div class="h-chapter">${data.chapter}</div>
      ${isChecked ? checkedLabel : (isFuture ? '' : '<div style="font-size:0.75em;color:#666;margin-top:4px;">未打卡</div>')}
    </div>`;
  }).join('');
}

      } else {
        audioHtml = '<span style="font-size:0.78em;color:#666;">音频文件不可用</span>';

        <div class="audio-player-row">

      </div>`;
    });

      style.textContent = '@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}';

    }
    
    listEl.innerHTML = '<div class="audio-wall-list">' + html + '</div>';
  }).catch(err => {
    console.error('[AudioWall] 加载失败:', err);
    listEl.innerHTML = '<p style="color:#ff4757;text-align:center;padding:40px;">⚠️ 加载失败，请刷新重试</p>';
  });
}

// 当切换到录音墙 tab 时刷新
const _origSwitchTab = undefined;

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  event.target.classList.add('active');
}
