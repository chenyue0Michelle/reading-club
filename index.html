<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>读书打卡 · 六项精进</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      font-size: 14px;
    }
    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.5em; color: #f5c518; margin-bottom: 6px; letter-spacing: 2px; }
    .formula { font-size: 0.82em; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .dates { font-size: 0.78em; color: #666; }
    .progress-section { padding: 0 20px 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 6px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f5c518, #ff6b6b); border-radius: 3px; transition: width 0.5s ease; }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; font-size: 0.82em; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.4); color: #f5c518; }
    .today-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 14px; position: relative;
    }
    .day-badge {
      display: inline-block; background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 0.75em; font-weight: bold; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .today-card h2 { font-size: 0.95em; color: #f5c518; margin-bottom: 14px; line-height: 1.6; }
    .content-body { font-size: 14px; line-height: 1.95; color: #ccc; }
    .content-body p { margin-bottom: 10px; }
    .content-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .content-body strong { color: #fff; }
    .content-body ul, .content-body ol { padding-left: 20px; margin: 8px 0; }
    .content-body li { margin-bottom: 6px; }
    .checkin-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s; margin-bottom: 16px;
    }
    .checkin-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .checkin-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    .status-box {
      text-align: center; padding: 12px; border-radius: 10px;
      font-size: 0.88em; margin-bottom: 16px;
    }
    .status-box.not-started { background: rgba(255,255,255,0.05); color: #888; }
    .status-box.in-progress { background: rgba(245,197,24,0.1); color: #f5c518; }
    .status-box.completed { background: rgba(39,174,96,0.15); color: #2ecc71; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-header { text-align: center; font-size: 0.72em; color: #666; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 0.78em; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; position: relative;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.future { background: rgba(255,255,255,0.04); color: #555; cursor: default; }
    .cal-day.available { background: rgba(255,255,255,0.08); color: #aaa; }
    .cal-day.available:hover { background: rgba(245,197,24,0.15); border-color: #f5c518; color: #f5c518; }
    .cal-day.today-marker { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; font-weight: bold; }
    .cal-day.checked { background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(39,174,96,0.1)); border-color: #2ecc71; color: #2ecc71; }
    .cal-day.checked::after { content: '✓'; position: absolute; bottom: 1px; right: 3px; font-size: 0.65em; color: #2ecc71; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(245,197,24,0.3); }
    .history-item .h-date { font-size: 0.78em; color: #888; margin-bottom: 4px; }
    .history-item .h-chapter { font-size: 0.9em; color: #f5c518; }
    .history-item .h-checked { font-size: 0.75em; color: #2ecc71; margin-top: 4px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #1a2035; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 24px; max-width: 680px; width: 100%; margin-top: 20px;
    }
    .modal-box h3 { color: #f5c518; font-size: 1em; margin-bottom: 14px; line-height: 1.5; }
    .modal-body { font-size: 0.88em; line-height: 1.9; color: #ccc; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body blockquote {
      border-left: 3px solid #f5c518; padding: 8px 14px; margin: 12px 0;
      background: rgba(245,197,24,0.08); border-radius: 0 8px 8px 0;
      color: #f5c518; font-style: italic;
    }
    .modal-body strong { color: #fff; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 16px; width: 100%; padding: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #aaa; border-radius: 8px; cursor: pointer; font-size: 0.9em;
    }
    .modal-close:hover { background: rgba(255,255,255,0.13); }
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-box {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-box .login-icon { font-size: 3em; margin-bottom: 12px; }
    .login-box h2 { color: #f5c518; font-size: 1.2em; margin-bottom: 6px; }
    .login-box p { color: #888; font-size: 0.85em; margin-bottom: 24px; line-height: 1.6; }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: #fff; font-size: 1em; padding: 12px 16px; text-align: center;
      margin-bottom: 16px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-input:focus { outline: none; border-color: #f5c518; }
    .login-input::placeholder { color: #555; }
    .login-submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f5c518, #ff6b6b);
      color: #000; font-size: 1em; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .login-submit-btn:hover { opacity: 0.9; }
    .user-greeting {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.88em;
    }
    .user-greeting .greet-text { color: #f5c518; }
    .user-greeting .change-name { color: #666; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    .user-greeting .change-name:hover { color: #aaa; }
    .font-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: flex-end; }
    .font-btn {
      padding: 4px 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #ccc;
      border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; color: #f5c518; }
    .font-size-label { font-size: 0.78em; color: #666; }

    /* ===== RECORDING - FIXED ===== */
    .record-area {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #ccc; font-size: 1.4em;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; user-select: none;
    }
    .record-btn.recording {
      border-color: #ff4757; background: rgba(255,71,87,0.2); color: #ff4757;
      animation: pulse 1s infinite;
    }
    .record-btn.done {
      border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    }
    .record-info { flex: 1; min-width: 0; }
    .record-status { font-size: 0.85em; color: #aaa; }
    .record-status.active { color: #ff4757; }
    .record-status.done-status { color: #2ecc71; }
    .record-duration { font-size: 0.78em; color: #666; margin-top: 2px; }
    .record-action-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8em; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: #ccc; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .record-action-btn:hover { background: rgba(255,255,255,0.15); }
    .record-action-btn.stop-btn { border-color: #ff4757; background: rgba(255,71,87,0.1); color: #ff4757; }
    .record-action-btn.stop-btn:hover { background: rgba(255,71,87,0.2); }
    .record-action-btn.redo-btn { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; font-size: 0.75em; }

    .record-upload-status { font-size: 0.78em; color: #f5c518; margin-top: 4px; display: none; }
    .record-upload-status.show { display: block; }
    .record-playback { margin-top: 8px; display: none; }
    .record-playback.show { display: block; }
    .record-playback audio { width: 100%; height: 36px; border-radius: 8px; }
    .record-playback-label { font-size: 0.76em; color: #888; margin-bottom: 4px; }
    .loading-spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(245,197,24,0.3); border-top-color: #f5c518;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reflection-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .reflection-label { font-size: 0.82em; color: #888; margin-bottom: 8px; }
    .reflection-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: #ddd; font-size: 0.88em; line-height: 1.7;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .reflection-input:focus { outline: none; border-color: rgba(245,197,24,0.4); background: rgba(255,255,255,0.08); }
    .reflection-input::placeholder { color: #555; }
    .reflection-saved { font-size: 0.78em; color: #2ecc71; margin-top: 6px; display: none; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.6em; font-weight: bold; color: #f5c518; }
    .stat-card .label { font-size: 0.75em; color: #888; margin-top: 4px; }
    .audio-wall-header { text-align: center; margin-bottom: 16px; }
    .audio-wall-header h3 { color: #f5c518; font-size: 1em; margin-bottom: 4px; }
    .audio-wall-header p { font-size: 0.78em; color: #888; }
    .audio-wall-list { display: flex; flex-direction: column; gap: 10px; }
    .audio-item {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s;
    }
    .audio-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,197,24,0.3); }
    .audio-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .audio-item-name { font-weight: bold; color: #f5c518; font-size: 0.9em; }
    .audio-item-date { font-size: 0.75em; color: #888; }
    .audio-item-chapter { font-size: 0.82em; color: #aaa; margin-bottom: 10px; }
    .audio-player-row { display: flex; align-items: center; gap: 12px; }
    .audio-player-row audio { flex: 1; height: 36px; border-radius: 8px; }
    .audio-duration-badge {
      background: rgba(245,197,24,0.15); color: #f5c518;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75em; white-space: nowrap;
    }
  </style>
  <script>
    window.addEventListener('load', function(){
      var s = document.createElement('script');
      s.src = 'cloudbase.js';
      s.onerror = function(){ console.warn('[SDK] uniCloud SDK 加载失败，录音墙不可用'); };
      document.head.appendChild(s);
    });
  </script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">📖</div>
    <h2>欢迎加入读书打卡</h2>
    <p>《六项精进》全书共读计划<br>稻盛和夫 · 每天10-15分钟</p>
    <input class="login-input" id="loginInput" type="text" placeholder="请输入您的姓名" maxlength="20" />
    <button class="login-submit-btn" onclick="doLogin()">开始打卡 →</button>
  </div>
</div>

<div class="header">
  <h1>📖 六项精进</h1>
  <div class="formula">付出不亚于任何人的努力 · 谦虚 · 反省 · 感谢 · 利他 · 勿感性烦恼</div>
  <div class="dates" id="headerDates">稻盛和夫 · 全书共读计划（19天）</div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span id="progressText">打卡进度</span>
    <span id="progressCount">0 / 19</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statChecked">0</div>
      <div class="label">已打卡</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">连续天数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statRemain">13</div>
      <div class="label">剩余天数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">📅 今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">🗓 日历</button>
    <button class="tab-btn" onclick="switchTab('history',this)">📋 记录</button>
    <button class="tab-btn" onclick="switchTab('audiowall',this)">🎙️ 录音墙</button>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content active" id="tab-today">
    <div class="user-greeting" id="userGreeting">
      <span class="greet-text" id="greetText">👋 你好！</span>
      <span class="change-name" onclick="changeName()">修改姓名</span>
    </div>
    <div class="font-controls">
      <span class="font-size-label">字体：</span>
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="today-card" id="todayCard">
      <div class="day-badge" id="todayBadge">第?天</div>
      <h2 id="todayChapter">加载中...</h2>
      <div class="content-body" id="todayContent"></div>
    </div>

    <!-- 录音区域 - 修复版 -->
    <div class="record-area" id="recordArea">
      <button class="record-btn" id="recordBtn" onclick="handleRecordClick()" title="点击开始/停止录音">🎤</button>
      <div class="record-info">
        <div class="record-status" id="recordStatus">点击麦克风开始朗读录音</div>
        <div class="record-duration" id="recordDuration"></div>
        <div class="record-upload-status" id="uploadStatus"></div>
      </div>
      <button class="record-action-btn" id="recordActionBtn" style="display:none" onclick="handleActionBtnClick()">重新录制</button>
    </div>
    <div class="record-playback" id="recordPlayback">
      <div class="record-playback-label">▶️ 回听您的录音：</div>
      <audio id="recordPlayer" controls></audio>
    </div>

    <!-- 感悟 -->
    <div class="reflection-area" id="reflectionArea">
      <div class="reflection-label">📝 写下今日读书感悟</div>
      <textarea class="reflection-input" id="reflectionInput" placeholder="读完后写下您的感悟，提交后完成今日打卡..."></textarea>
      <div class="reflection-saved" id="reflectionSaved">✅ 感悟已保存</div>
    </div>

    <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">✅ 今日打卡</button>
    <div class="status-box not-started" id="statusBox">尚未开始打卡</div>
  </div>

  <!-- CALENDAR TAB -->
  <div class="tab-content" id="tab-calendar">
    <div id="calendarContainer"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- AUDIO WALL TAB -->
  <div class="tab-content" id="tab-audiowall">
    <div class="audio-wall-header">
      <h3>🎙️ 读书录音墙</h3>
      <p>聆听大家的读书声，共同成长进步</p>
    </div>
    <div class="audio-wall-list" id="audioWallList">
      <p style="color:#666;text-align:center;padding:30px;">⏳ 加载中...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== BOOK CONTENT =====
// 《六项精进》全书共读
// 共19天，每天约4000-5500字（10-15分钟阅读）
// 日期范围：2026-08-30 至 2026-09-17
const bookContent = {
  '2026-08-30': {
    chapter: '第1天：六项精进 · 六项纲要与两篇序言',
    content: '<blockquote><p><strong>一、付出不亚于任何人的努力</strong></p><p><strong>二、要谦虚，不要骄傲</strong></p><p><strong>三、要每天反省</strong></p><p><strong>四、活着，就要感谢</strong></p><p><strong>五、积善行，思利他</strong></p><p><strong>六、不要有感性的烦恼</strong></p></blockquote><p><strong>总序贯彻做人正确准则的</strong></p><p>从1959年至今长达半个世纪内，我创建并经营了京瓷和KDDI两家企业集团。很幸运，这两家企业都取得了长足的发展。现在这两家企业的业绩简单相加，销售额达4.7万亿日元，利润逼近6000亿日元。</p><p>另外，2010年，我接受日本政府的邀请，就任代表国家形象的、破产重建的日本航空公司的会长。在重建过程中，我着力于经营干部的意识转变，以及企业体质的改善。这样的努力，第一年就取得了可喜的成果，业绩大幅超过了重建计划中预定的数字，现在日本航空的利润率已超过两位数，正在变成一个高收益的企业。</p><p>取得这些成就，原因不过是在企业经营中，我彻底地贯彻了经营的原理原则而已。那么，所谓原理原则是什么呢?那就是“贯彻做人的正确准则”。我在必须做出经营判断的时候，总要扪心自问:“作为人，何谓正确?”答案是坚持把作为人应该做的正确的事情以正确的方式贯彻到底。</p><p>或许有人认为，这样的经营要诀未免太简单、太朴实了。但是，正因为贯彻了这条原理原则，我自己以及继承我工作的京瓷和KDDI的经营干部，才没有发生过经营判断上的失误，才使企业顺利地成长发展到今天。</p><p>我的经营哲学还有另外一个侧面。那就是:立足于宇宙的本源以及人心的本源来展开经营活动。</p><p>我认为，在这个宇宙间，流消着促使万物进化发展的“气”或“意志”。同时我认为，人的本性中充满“爱、真诚与和谐”。所谓“爱”，就是祈愿他人好;所谓“真诚”，就是为社会、为世人尽力;所谓“和谐”，就是不仅让自己，也要让别人生活幸福。</p><p>如果我们每一个人都以充满“爱、真诚与和谐”之心去生活、去工作，那就意味着与引导万物向好的方向发展的宇宙的潮流相一致。这样，我们的经营就会顺畅，人生就会美满。这就是我在将近80年漫长的人生中坚信不疑的“真理”。</p><p>本书就遵循这样的思想，由近年来我在中国的演讲为主编辑而成。面对中国的经营者和企业干部、政府官员和大学学者以至一般市民，我都从原理原则讲起，涉及人的本性和宇宙的本源，阐述经营和人生的要诀，获得了人们广泛的赞同。</p><p>近期，我的演讲将汇编为图书在中国出版发行，作为著者，我衷心希望，从人和宇宙的本源谈起的我的哲学，能够跨越国界、民族和语言的障碍，到达广大中国男女老少的手中，为让他们的人生更美好、经营更出色做出我的一份贡献。同时，如果这对促进一衣带水的中日两国的友好关系也能助上一臂之力，那就是我的无限之喜了。</p><p>在本书出版之际，请允许我对为出版本书做出不同寻常努力的稻盛和夫(北京)管理顾问有限公司的曹岫云董事长，以及很爽快地为本书提供文稿的中国和日本的有关企业家表示深切的谢意。</p><p>谨以此文作为本书的序言。</p><p><strong>稻盛和夫</strong></p><p><strong>日本京瓷名誉会长</strong></p><p><strong>译者序 正确思考力量的</strong></p><p>思考就是哲学。</p><p>“心之官则思”，每个人每天都在思考。但思考有自觉和不自觉之分，有深刻和肤浅之分，有正确和错误之分。</p><p>思考是种子，行动是花朵，成败是果实。从这个意义上讲，思考是一切的起源。</p><p>参天大树原本只是沉睡的种子，翱翔天空的苍鹰早先只在卵中待机，世界上的一切伟业最初不过是伟人心中的一个梦想而已。</p><p>中国历史上没有“哲学”这个词语，据说这个词语从日本引进，而日语中的“哲学”又是从希腊语"philosophia”翻译而来的。被称为“近代哲学之父”的笛卡儿说:“我思，故我在。”据说西方有人对“哲学”的定义是:“对人的本质进行思考这种行为本身就是哲学。”提倡自由深入地思考，其结果之一就是促进了科学技术的迅猛发展。</p><p><strong>经营哲学</strong></p><p>在稻盛和夫先生之前，日本很少甚或没有人将“经营”和“哲学”两个词语联系在一起。而在中国，改革开放后虽然提倡“科学管理”，但是在很长时间内却没有“经营哲学”这样的说法。近年来，“经营哲学”这个词语在日本、中国开始流行，逐渐成为常用语。</p><p>但是早在50多年前，稻盛先生就开始思考经营和哲学的关系。</p><p>1956年，稻盛在一家名叫“松风工业”的陶瓷企业打工，时年24岁。</p><p>当时日本三井物产有一位“大人物”吉田先生，他主要负责松风工业绝缘瓷瓶的出口业务。吉田常来公司调查。他发现该公司其他部门的员工意志消沉，唯有稻盛领导的“特磁科”士气高昂，干劲十足，吉田觉得不可思议。</p><p>凑巧的是，这位吉田先生和稻盛在鹿儿岛大学时的恩师内野教授是东京大学的同窗好友。内野在吉田面前曾经多次夸奖稻盛。吉田在调查结束时提出要约见稻盛和夫。</p><p>稻盛觉得吉田虽然是老前辈又是大人物，但很可亲，值得信任，同他交流是难得的机会，于是就将平时头脑里经常思考的松风工业经营上的事情，直率地、毫无保留地告诉吉田。切身经历加上深思熟虑，稻盛讲得既生动又具说服力，无论话题、措辞、内容还是其中包含的思想，都与稻盛当时的年龄、身份很不相称。吉田先生一声不响，神情专注，静听稻盛述说，最后大声说道:“才二十几岁，年轻人，真不简单，你已经有了自己的philosophy.</p><p>稻盛当时不知道“philosophy”是什么意思，回到宿舍一翻辞典，“philosophy”就是“哲学”。那一瞬间，稻盛心中不由自主地一阵颤动。</p><p>吉田不愧为有见识的大人物，他一句话就点中了稻盛的本质特性，可以说，这句话催生了后来的“京瓷philosophy”，即“稻盛哲学”。</p><p>“经营为什么需要哲学?”这就是几十年来稻盛经典演讲的主题之一。如果说泰勒首倡了“科学管理”，那么稻盛和夫首倡了“经营哲学”。我想这种说法符合事实。</p><p><strong>正确思考</strong></p><p>稻盛先生白手起家，40年间创建了京瓷和KDDI两家世界500强企业。2010年2月1日，78岁高龄的稻盛先生在退休13年后再度出山，应日本政府邀请，出任破产重建的日航的会长。在万众瞩目之下，仅仅10个月，日航就大幅扭亏为盈，创造了日航历史上空前的1580亿日元的利润。然而，这一切不过是稻盛哲学的产物。或者说，这种不可思议的成功仅仅源于稻盛先生的正确思考。</p><p>稻盛先生是理工科出身，作为一名科学技术工作者，在新型精密陶瓷领域，他年轻时就有许多划时代的发明创造。稻盛先生具备科学家合理思考、追究事物真相的科学精神。</p><p>作为企业家，稻盛先生气势如虹又心细如发。他不但善于把握宏观形势，做出类似参与通信事业这样超乎常人的战略决策，而且在企业管理的所有细节上，通过贯彻“钱、物、票一一对应”“双重确认”“玻璃般透明的经营”等方法，彻底把握经营的实态，把握事情的本质。稻盛先生创建了精致、缜密、实用的经营模式。如果你读过《稻盛和夫的实学:经营与会计》和《阿米巴经营》这两本书，你一定会对稻盛先生彻底的实事求是态度肃然起敬，并且能理解稻盛的企业50年持续盈利的秘诀。有如此作为的企业家，我闻所未闻。</p><p>为了进一步净化自己的心灵，在精神世界追求更高的境界，65岁后，稻盛先生曾一度投入佛门，认真修行。稻盛先生并不停留在对佛教单纯的信仰上，结合自己丰富的人生实践，他还对佛教的精髓“六波罗蜜”，即布施、持戒、精进、忍辱、禅定、智慧，做出了积极的、深入浅出的解释，令人倍感亲切。</p><p>科学家、企业家、宗教家之外，我认为稻盛先生最本质的特色在于他是一位“彻底追求正确思考的哲学家”。人类有史以来涌现了不少卓越的思想家、哲学家。而哲学家同时又身兼科学家、企业家、宗教家，一身而数任的人，稻盛先生或许是独一无二、天下无双的。更可贵的是:稻盛先生不仅养成了深思熟虑的习惯，而且他是一位彻底地追求正确思考的哲学家。</p><p>人究竟应该怎样生活?企业家应该如何正确地经营企业?正确的人生观对个人、组织、人类具有何等重大的意义?提出如此重大命题的人意外地少。而不停地提出、思考、回答这些问题的，就是稻盛先生的哲学和实践。</p><p>稻盛哲学的原点是“把‘作为人，何谓正确’当作判断一切事物的基准”。</p><p>稻盛哲学的核心用一个方程式表达就是:</p><p><strong>人生·工作结果=思维方式X热情X能力</strong></p><p><strong>-100~1000~1000~100</strong></p><p>如此鲜明简洁地提出如此重要的哲学观点，并一辈子切实实践的企业家，前无古人。</p><p><strong>正确思考的威力</strong></p><p>稻盛先生的青少年时代充满挫折甚至苦难。大学毕业后好不容易入职的企业却连续十年赤字，连工资也不能如期发放。为此，稻盛先生曾经怨天尤人。但当身为技术员的稻盛先生正确思考一名优秀的技术员应该如何开展研究工作，并全身心投入时，奇迹出现了。</p><p>稻盛被石蜡绊着、差点摔倒的一瞬间，他得到了精密陶瓷中划时代的新材料镁橄榄石合成方法的发明灵感;当他看到高温炉中板状陶瓷零件像鱿鱼般翘曲时，突然产生用手从上面压住的冲动，从而获得灵感，干脆利落地解决了重大的技术难题......</p><p>稻盛27岁创业，因为不知如何正确经营企业而苦恼时，他又获得了灵感，确立了在经营中判断一切事物的基准一-作为人，何谓正确。</p><p>京瓷初创时的28名员工中，20多名是高中学历，稻盛自己也只是一所地方大学的毕业生。为了回答“能力平凡的人怎样才能取得不平凡的成功”，稻盛想出了上述精彩的人生方程式。</p><p>在处理11名高中学历员工集体辞职的事件时，稻盛毅然放弃了“技术问世”的创业目的，“在追求全体员工物质和精神两方面幸福的同时，为人类社会的进步发展做出贡献”这一伟大的公司理念诞生了。</p><p>京瓷发展壮大，稻盛先生忙得不可开交时，他又从孙悟空拔毛吹出分身的故事中获得了灵感，创造了“阿米巴经营”模式，实现了真正的全员经营，奠定了京瓷、KDD稳步快速发展的基础。</p><p>孙正义创建的软银集团也是世界500强企业。孙正义曾是稻盛创办的“盛和塾”的塾生。最近在拜访稻盛先生时，孙正义说:“如果没有稻盛先生‘敬天爱人’的思想和阿米巴经营方式，就没有软银的今天。”</p><p>“盛和塾”现在已有15000名企业家塾生，他们学习并实践稻盛先生正确的经营思想，大部分企业都有了不同程度的进步，其中近百家企业已经成功上市。</p><p><strong>神的智慧</strong></p><p>稻盛先生于2010年2月1日正式出任日航会长，而在此前的1月19日，日航公开宣告破产。这一天，稻盛按预定日程乘坐日航的航班飞往夏威夷参加盛和塾的开塾仪式。在大阪关西机场，稻盛对前来送行的日航关西支店长山口先生说:“我是为了日航的员工才到日航来的。”又说:“日航的干部要一天24小时思考日航的经营问题。”这两句话深深地刻入了山口先生的心中。</p><p>稻盛先生强调:“在高尚的思想里蕴藏着巨大的力量。”为什么呢?</p><p>思考是人的显意识在发挥作用。但如果你怀抱善念，针对某一难题，朝思暮想、左思右想、前思后想、苦思冥想，一天24小时思考，反复地、深入地、强烈地思考，这样，你的愿望会渗入潜意识。在不经意间，潜意识会突然给你灵感，让你心中一亮，立即抓住事物的核心，问题顷刻间迎刃而解。</p><p>稻盛先生把这种灵感称为“神的智慧”。回顾发明镁橄榄石合成方法的过程，稻盛先生说:“当时在我头脑里闪过的这种灵感，并非出于我个人的实力，在我偶然绊上石蜡的一刹那，是‘神’给了我启示，让我产生灵感的闪光。”</p><p>稻盛先生说:“如果不是这样，就无法说明为什么能力平平，缺乏知识、技术、经验、设备的我，竟然能够做出世界一流的发明创造。</p><p><strong>宇宙之心</strong></p><p>根据宇宙物理学最权威的“大爆炸”理论，广袤浩瀚的宇宙原本只是一小撮高温高压的基本粒子的团块。经“大爆炸”产生的质子、中子、介子组成原子核，再与电子结合构成原子，原子结合形成分子，分子组成高分子，从中产生DNA，从而孕育出生命体，生命从低级进化到高级，最终出现人类。宇宙为什么在演化过程中一刻也不肯停顿呢?这绝非偶然。不妨设想存在着“宇宙的意志”或“宇宙之心”，它促使森罗万象一切事物向好的方向发展。稻盛先生强调，如果我们的想法与“宇宙的意志”同调，我们的事业一定会繁荣昌盛，反之，即使一时成功，最终必然衰落乃至灭亡。个人如此，企业如此，国家如此，整个人类亦如此。</p><p>稻盛和夫经营哲学是稻盛先生十几年甚至几十年思考和实践的产物，是正确做人做事的最高智慧，其中妙语如珠，格言箴言接二连三。其中每一篇都足以引发我们深思，如果它溶入我们的血液，我们的事业一定繁盛不衰，我们的人生一定幸福美满。</p>'
  },
  '2026-08-31': {
    chapter: '第2天：第一章 概述 · 第一项 付出不亚于任何人的努力',
    content: '<p><strong>第一章六项精进概述</strong></p><p>全国大会开了两天，大家累了吧，在闭会前，我再给大家作一小时的讲话。[1</p><p>这两天，受表彰的8名塾生发表了各自的经营心得，给了大家很多启示。他们的发言很精彩，足以汇编成册，供大家学习参考，这些发言都很有价值。</p><p>今天给大家讲什么呢?我想了很多。许多话虽然以前讲过，但是，鉴于当前严峻的经济环境，有些话仍然值得回味。从自己经营企业的直接经验中，我思考、感悟的东西，遇到这样的问题，必须这样处理，等等，我多次讲过，今天，我想就这些内容重新谈谈自己的观点。</p><p>接下来，就“六项精进”这个话题，再次给大家谈一谈。</p><p>“六项精进”是在我向大家传授经营十二条之前提出来的。我在年轻的时候就认为，只要做好这“六项精进”，就能搞好企业，不仅是企业经营，为了度过美好的人生，这“六项精进”也必不可少。这是我在经营实践和生活实践中的切身体会。</p><p>在我看来，“六项精进”是搞好企业经营所必需的最基本的条件，同时，它也是我们度过美好人生必须遵守的最基本条件。如果我们每天都能持续实践“六项精进”，我们的人生必将更加美好，美好的程度将超过我们自己的能力和想象。事实上，我的人生就是这样的。</p><p>如果你想拥有幸福、美好、平和的人生，如果你想把你的企业经营得有声有色，如果你想让你公司的员工幸福快乐，那么，你就忠实地实践“六项精进”吧。</p><p>创造自己美好幸福的人生其实并不难，倒不如说这是一件容易的事情，这就是我的观点。</p><p><strong>第一项付出不亚于任何人的努力</strong></p><p><strong>认真、拼命地工作</strong></p><p>“六项精进”中率先登场的就是“付出不亚于任何人的努力”。在经营十二条中，我也向大家强调了“付出不亚于任何人的努力”这一条。在“六项精进”中，我将它列在第一位。</p><p>在企业经营中，最重要的就是这一条。这就是说，每一天都竭尽全力、拼命工作，是企业经营中最重要的事情。同时，如果要让人生幸福美满，那么每一天都认真干活是先决条件。想拥有美好的人生，想成功地经营企业，前提条件就是要“付出不亚于任何人的努力”，换句话说，就是要勤奋工作。做不到这一点，企业经营的成功、人生的成功，都是空中楼阁。不愿勤奋工作，只想轻松舒服，企业当然经营不好，美好的人生也就无法实现。</p><p>说得极端一点，只要拼命工作，企业经营就能顺畅。刚才提到，今年也许不景气，但不管哪个年代，不管怎样的不景气，只要拼命工作，任何困难都能克服。人们常说，经营战略最重要，经营战术不可少。但是，我认为，除了拼命工作，不存在第二条通向成功之路。</p><p>回首往事，我在27岁的时候成立了京瓷公司，开始经营企业。当时，我连经营的“经”字都不识，我心里只有一个念头，不能让公司倒闭，不能让支持我、出钱帮我成立公司的人遭殃。为此，我拼命地工作，常常从清晨干到深夜12点，甚至凌晨一两点，我就这样夜以继日地工作，努力再努力。</p><p>2009年是京瓷创立50周年。回想过去，虽然70岁之后的努力程度不如从前，但在这50年里，我一贯勤奋工作。因为正是凭借这种勤奋才有了京瓷今天的辉煌。从这点来看，也证明我上述观点没有错。除了拼命工作，世界上不存在更高明的经营诀窍。</p><p>企业家、学者、研究员、艺术家，不管哪行哪业，他们能取得出色的成绩，都是竭尽全力、埋头工作的结果。</p><p>我常想起我的舅舅和舅妈。从中国回国时，他们身无一文，战争2结束后，他们在鹿儿岛做起了蔬菜生意。舅舅的文化程度不过小学毕业，他每天拉着大板车做买卖。爱说三道四的亲戚们总是以轻蔑的眼神盯着他:“那个人既没学问又没脑子，所以只好在大热天里拉板车，一身臭汗地做生意。”</p><p>舅舅的个子很矮，不管是盛夏还是严冬，他拉着比自己身体大得多的板车，车上装满了蔬菜。我小时候常常看到舅舅那时做生意的光景。</p><p>我想，舅舅并不知道什么是经营、该怎样做买卖，也不懂财务会计。但是，就是凭借勤奋和辛劳，他的菜铺规模越来越大，直到晚年，他的经营一直很顺利。只是默默地埋头苦干，没有学问，没有能耐，但是，正是这种埋头苦干给他带来了丰硕的成果。舅舅的形象铭刻在我儿时的心中。</p><p><strong>拼命工作是一切生命都在承担的义务</strong></p><p>我为什么强调要“拼命工作”呢，因为自然界存在的前提，就是一切生命都拼命地求生存。稍微有了点钱，公司刚有起色，就想偷懒，就想舒服，这种浅薄的想法也就是我们人类才有。在自然界里，其他生物绝不会有这样的想法。自然界中的动植物，它们都在竭尽全力、拼命地求生存。看到这些现象，我想，每时每刻认真、极其认真地努力工作，应该是我们做人最基本的、必要的条件。</p><p>大家知道，在夏天烈日炎炎之下，杂草会从柏油马路的裂缝中发芽生长。如果一星期干热不下雨，杂草就会干枯，就是在这样既缺水又缺土的地方，杂草却在发芽生长。在自然界中，即使在严酷的环境下，只要有种子飘落，就会在那里发芽，长叶，进行光合作用，然后开花、结果，结束它们短暂的一生。即使在石头墙的缝隙，只要有一点儿土壤，杂草就会发芽、开花。</p><p>我看过一个电视节目。在环境严酷、灼热难耐的沙漠里，一年也会下几场雨。有些植物趁着雨水，很快发芽、长叶、开花、结果，然后枯萎，生命过程只有短短的几周。它们在沙漠里顽强地生存，为了留下子孙，只要有一点雨水，它们就要开花、结果，把种子留在地表，以待来年下雨时再次发芽。尽管生命短暂，只有几周，它们照样拼命地生存并留下子孙。</p><p>无论植物还是动物，它们都在严酷的条件下顽强地生存。马虎懒惰、不负责任的动植物并不存在。遵照自然界的规律，我们人类在地球上生存，也必须认认真真、竭尽全力。</p><p>在创建京瓷公司的时候，我还不懂这些自然的哲理。虽然我不懂这些哲理，但我有一种危机感，如果不竭尽全力地工作，不拼命努力，公司的经营就不可能顺利。这样的危机感、恐惧心促使我拼命工作。现在回头看，这是非常正确的。不管经济如何萧条，不管环境如何严峻，我坚信，付出加倍的努力，是经营者乃至每个个人生存的最低条件。</p><p>我向许多人提问，“你是否在竭尽全力地工作?”“是的，我在努力工作。”我对这样的回答并不满意，于是，我会接着问:“你是否付出了不亚于任何人的努力?”“你的工作方法是否不亚于任何人?”你自称是在努力工作，实际上你的努力还远远不够。如果你不更加认真、不更加努力，那么公司也好，个人的人生也好，都不会有理想的结果。我用“付出不亚于任何人的努力”这句话来表达这一层意思。</p><p>我认为，竭尽全力，付出不亚于任何人的努力，乃是这个世界上所有生物都要承担的、理所当然的义务，没有谁可以逃避这个义务。</p><p><strong>只要喜欢你的工作，再努力也不觉得苦</strong></p><p>拼命工作是一件辛苦的事情，辛苦的事情要一天天持续下去，必须有个条件，那就是让自己喜欢上现在所从事的工作。如果是自己喜欢的事，不管怎样努力都心甘情愿。如果你热爱甚至迷恋你的工作，尽管在外人看来，你是那样辛劳，那么不同寻常，但是，在你自己看来却很自然，因为你喜欢自己的工作。</p><p>从年轻的时候起，我就是这么想的，我努力让自己喜爱自己从事的工作。我的故事已和大家讲过多次，虽然我也是大学毕业生，但毕业后却求职无门，在老师的帮助下，好不容易才进了一家陶瓷公司。我对烧制陶瓷没有兴趣，我不喜欢这份工作。而且，公司每个月都不能按时发放工资，是一家拖欠员工工资的公司。因此，我也不喜欢这家公司。</p><p>但是，抱着满腹牢骚从事研究开发工作，工作根本无法顺利开展。因此，我决心让自己喜欢这项工作。</p><p>因为，对于不喜欢的事，就不可能全身心投入，研究工作就做不好。</p><p>那个时候，我刚好情窦初开，我知道了“有缘千里‘去’相会”这句话。在热恋情人的眼里，千里之遥不过是一箭之地。不管多么辛劳，去和心上人相会，千里等同一里，再远也不在话下，这就是“有缘千里‘去’相会”。</p><p>凡事都如此，如果喜爱以致迷恋，不管怎样的辛苦都不再感到辛苦。因此，我就努力让自己喜爱自己的工作、喜爱自己的研究。</p><p>有机会从事自己喜爱的工作，当然很好，但大多数人没有这份幸运。一般都是为了生计而从事某项工作的。既然如此，就有必要付出努力，让自己喜爱自己所从事的工作。努力了，喜欢上了自己的工作，接下来就好办了。要做到“付出不亚于任何人的努力”，就变得很简单，“那样早出晚归，拼命工作，身体不要紧吧。”别人在为你担心，而你自己却一点不觉得苦，反而因为能胜任而感到充实。</p><p>据说成功有许多办法，但在我看来，抛弃“竭尽全力、拼命工作”这一条，就不可能有什么成功。特别在严峻的经营环境之下，加上可能的大萧条袭来，在不利条件下生存发展，“竭尽全力、拼命工作”这一条实在非常必要。</p><p><strong>全力投入工作就会产生创意</strong></p><p>竭尽全力、认真地专注于工作，还有一个功效:当你每天都聚精会神、全身心地投入工作时，低效的、漫不经心的现象就会消失。不管是谁，只要喜欢上自己的工作，只要进入拼命努力的状态，他就会考虑，如何把工作做得更好，就会寻思更好的、更有效的工作方法。</p><p>如果在拼命工作的同时又能思考如何改进工作，那么你的每一天都会充满创意。今天要比昨天好，明天要比今天好。这样不断地琢磨，反复思索，就会生出好想法，产生有益的启迪。</p><p>我并不认为自己有多大的能耐，但是，在每天努力工作的同时，我会开动脑筋，孜孜以求，推敲更好的工作方法，为了增加销售量，还有没有更好的促销方案呢?为了提高效率，还有没有更好的生产方式呢?这样不断钻研的结果，往往会出现自己都意想不到的进展。京瓷公司能不断地开发出新产品，开拓新市场，就是我们勤于思考、精益求精的结果。</p><p>不竭尽全力，不专心工作，就谈不上创造发明。马马虎虎、一知半解，吊儿郎当，在这些消极的状态下，即使你想寻找好的工作方法，创意也出不来。你不辞辛劳，拼命努力，殚精竭虑，苦思冥想，仍然一筹莫展，这时候，就会感动上天，上天就会可怜你，给予你新的启示。</p><p>真挚、认真、不懈地努力，走投无路也不言放弃。上天看到我这么努力，这么执着，便不嫌我愚笨，慷慨赐予我新的智慧、新的灵感、新的启示。</p><p>我想，上天之所以赐予我原本没有的、了不起的想法和智慧，乃是一种福报，是我拼命努力的结果。</p><p>看看世界上那些伟大的发明家，那些开发出划时代的新产品、新技术的人们，我们就会发现，他们都付出了不亚于任何人的努力，他们在辛勤工作、苦苦思索中获得灵感。因懒惰获得成功，投机取巧带来发明创造，世界上没有这样的人。从这个事实看，我坚信，竭尽全力、付出不亚于任何人的努力，就一定会给我们的事业和人生带来丰厚的回报。</p><p><strong>拼命工作可以磨炼灵魂</strong></p><p>还有一点非常重要。</p><p>从早到晚辛勤劳作，就没有空闲。古话说“小人闲居不为善”，人这种动物，一旦有了闲暇，就会动不正经的念头，干不正经的事。但如果忙忙碌碌、专注于工作，就不会有非分之想，没有时间考虑多余的东西了。</p><p>禅宗的和尚和修验道的修行者们，他们在刻苦修行的过程中磨炼自己的灵魂。将心思集中到一点，抑制杂念狂想，不给它们作祟的空间，通过这样的修行，整理自己的心绪，磨炼自己的心志，造就纯粹而优秀的人格。和这种修行过程一样，全身心地投入工作，就没空胡思乱想。这就是说，竭尽全力、拼命工作就能磨炼人的灵魂。</p><p>我对大家讲过，“磨炼灵魂，就会产生利他之心”，也就是说，会萌生出好心善意，萌生出关怀他人的慈悲之心。另外，我也反复告诉大家，只要抱有这样的好心肠，为社会、为他人着想，并落实在行动中，你的命运就一定会向好的方向转变。</p><p>全神贯注于自己的工作，只要做到这一点，就可以磨炼自己的灵魂，铸就美好的心灵。有了美好的心灵，就会很自然地去想好事，做好事。虽然我们并不知晓自己被赋予了怎样的命运，但是，“想好事，做好事”这种念头与实践，会形成一种力量，促使我们的命运朝着更好的方向转变。</p><p>25年前，在京瓷的规模还不大的时候，应大家的要求，我成立了盛和塾。迄今为止，伴随着京瓷和KDD的持续发展，在竭尽全力、拼命工作的同时，我将自己在工作中的体验告诉大家，与大家分享。这种体验不是空洞的理论，而是经营的实学。我毫不隐瞒地告诉大家，我能传授给你们的最重要的东西不是别的，就是，“竭尽全力、拼命工作”这一条。</p><p>六项精进中的第一项，“付出不亚于任何人的努力”，就是“竭尽全力、拼命工作”，这对经营企业也好，对度过美好的人生也好，都是必不可少的。</p>'
  },

    chapter: '第3天：第一章 概述 · 第二至四项 谦虚·反省·感谢',
    content: '<p><strong>第二项要谦虚，不要骄傲</strong></p><p>六项精进的第二项:“要谦虚，不要骄傲”。</p><p>我认为，谦虚是最重要的人格要素。我们常说，那个人的人格很高尚，意思是说，那个人的人格中具备了谦虚的美德。</p><p>谦虚很重要。这并非只针对成功后骄傲自大的人，要他们谦虚，而是要求经营者在小企业成长为大企业的整个过程中，始终保持谦虚的态度。</p><p>年轻的时候，我知道了中国的一句古话，“惟谦受福”。不谦虚就不能得到幸福，能得到幸福的人都很谦虚。从京瓷公司还是中小企业的时候起，我就崇尚谦虚。公司经营顺利，规模扩大，人往往会翘尾巴，傲慢起来，但我总是告诫自己，绝对不能忘记“谦虚”二字。</p><p>“惟谦受福”是一句非常重要的格言，我下定决心，信守这句格言。在这个世界上，有些人用强硬的手段排挤别人，看上去也很成功，其实不然。真正的成功者，尽管胸怀火一般的热情，有斗志、有斗魂，但他们同时也是谦虚的人、谨慎的人。谦虚的举止、谦虚的态度是人生中非常重要的品质。然而，就像我刚才讲过的那样，人们往往会在取得成功、地位上升之后忘记了谦虚，变得傲慢。这个时候，“要谦虚，不要骄傲”就变得更加重要。</p><p><strong>第三项要每天反省</strong></p><p>六项精进的第三项:“要每天反省”。</p><p>一天结束以后，回顾这一天，进行自我反省是非常重要的。比如，今天有没有让人感到不愉快?待人是否亲切?是否傲慢?有没有卑怯的举止?有没有自私的言行?回顾自己的一天，对照做人的准则，确认言行是否正确，完成这样的功课十分必要。</p><p>自己的言行中，如果有值得反省之处，哪怕只有一点点，也要改正。和第一项一样，天天反省也能磨炼灵魂、提升人格。为了获得美好的人生，通过每天的反省，磨炼自己的灵魂和心志是非常重要的。“竭尽全力、拼命工作”，再加上“天天反省”，我们的灵魂就会被净化，就会变得更美丽，更高尚。</p><p>我年轻的时候，有时也会态度傲慢。因此，作为每天的必修课，我都要进行自我反省。很惭愧，我还做不到每天都反省，但一旦意识到，就马上反省。</p><p><strong>所谓反省就是耕耘、整理心灵的庭院</strong></p><p>上了年纪后，我读了詹姆斯·埃伦(JamesAllen)的《原因与结果法则》一书，不禁拍案叫绝，就是这个道理!所谓反省就是耕耘并整理自己的精神家园。这句话出自这位20世纪初期的英国哲学家之口，他并不出名。我曾多次向大家介绍，今天，在这里我再介绍一下。</p><p>人的心灵像庭院。<br>既可理智地耕耘，也可放任它荒芜，<br>无论是耕耘还是荒芜，庭院不会空白。<br>如果自己的庭院里没有播种美丽的花草，</p><p><strong>那么无数杂草的种子必将飞落</strong></p><p>茂盛的杂草将占满你的庭院。</p><p>如果你不在自己心灵的庭院里播种美丽的花草，那里就将杂草丛生。就是说，如果你不会反省，你的内心将长满杂草。詹姆斯·埃伦就是这样说的。</p><p>接下来，他又写道:<br>出色的园艺师会翻耕庭院，除去杂草，<br>播种美丽的花草，不断培育。<br>同样，如果我们想要一个美好的人生，</p><p>我们就要翻耕自己心灵的庭院，将不纯的思想一扫而光，</p><p>然后栽上清澈的、正确的思想，<br>并将它们培育下去。</p><p>出色的园艺师翻耕庭院，除去杂草。同样，我们要翻耕自己心灵的庭院，就是通过天天反省，扫除心中的邪念。然后播种美丽的花草，这就是让清新、高尚的思想占领心灵的庭院。反省自己的邪恶之心，培育自己的善良之心。詹姆斯·埃伦就是这样表达的，他表达得非常确切。</p><p>接着，詹姆斯·埃伦又说道:<br>我们选择正确的思想，并让它在头脑里扎根，<br>我们就能升华为高尚的人。<br>我们选择错误的思想，并让它在头脑里扎根，<br>我们就会堕落为禽兽。<br>播种在心灵中的一切思想的种子，<br>只会生长出同类的东西，<br>或迟或早，它们必将开出行为之花，结出环境之果。<br>好思想结善果，坏思想结恶果。</p><p>心怀善意就会结出善果，心怀恶意就会结出恶果，他就是这样表述的。</p><p>因此，<br>请拔除自己心灵的杂草，<br>播种自己希望的、美丽的花草，<br>精心地浇灌，施肥，管理。<br>詹姆斯·埃伦如是说。</p><p>这里比喻的就是自我反省。通过反省，我们可以磨炼自己的心志，从而给我们带来无限的幸福。</p><p><strong>抑制邪恶的自我，让善良的真我伸展</strong></p><p>抑制自己的邪恶之心，让良心占领思想阵地，这个作业过程就是“反省”。所谓良心指的是“真我”，也就是利他之心，怜爱他人，同情他人，愿他人过得好。与此相反的是“自我”，指的是利己心，只要自己好，不管别人。无耻的贪婪之心就属于“自我”。</p><p>回顾今天一天，想想冒出了多少“自我”，抑制这种“自我”，让“真我”，也就是利他心活跃，这样的作业就是“反省”。</p><p>我喜爱印度诗人泰戈尔的一首诗。我已经向大家介绍过多次，在此，请允许我再读一遍。在人的心里，‘自我”与“真我”同在，“自我”是邪恶、贪欲、利己。而高尚的利他心、美丽的慈悲心、温柔的同情心，就是“真我”。泰戈尔用精彩的诗句表达了这个观点。在我们每个人的心里，卑怯的自我和高尚的真我同居。泰戈尔写道:</p><p>我只身来到神的面前。<br>可是，那里已经站着另一个我。</p><p><strong>那个暗黑中的我，究竟是谁呢?</strong></p><p>为了避开他，<br>我躲进岔道，<br>但是，我无法摆脱他。<br>他公然在大道上迈步，<br>卷起地面的沙尘，<br>我谦恭地私语，<br>他高声地复述。<br>他是我身上的卑微的小我，<br>就是自我。<br>主啊，他不知耻辱。<br>我却深感羞愧。<br>伴随这卑贱的小我，<br>我来到您的门前。</p><p>我拥有一颗善良、高尚、美丽的心灵，拥有真我、利他心。但是，在真我的旁边，与我形影不离的是卑贱、贪欲、利己的自我，他不知羞耻。本来，我想谦恭、低调地生活，可他却大声喧哗。我轻声地自言自语:“那东西我想稍微要一点。”而他却高声吼叫:“我就要得到它，快把它给我!”不知羞耻、贪欲贪婪、利己的自我一刻不停地纠缠我，我想逃脱他，他却揪住我不放。事情就是这样，这不足为奇，因为在我的心里，同居着这样一个卑贱的自我。</p><p>正因为如此，我们就有必要天天反省，对着邪恶、贪婪、卑贱的自我说:“请稍微安静一些吧!”“你也该知足了。”这样抑制自我，通过这样的反省，我们可以磨炼自己的灵魂，磨炼自己的心志。</p><p>我常说，提高心性就能拓展经营。想搞好经营，经营者必须提高自己的心性，也就是说，不磨炼自己的灵魂，就无法搞好经营。我经常和大家谈到这一点，我想和大家一起遵循这个原则。</p><p><strong>第四项活着，就要感谢</strong></p><p>对一切都要说“谢谢”<br>六项精进的第四项:“活着，就要感谢”。</p><p>“感谢”非常重要。我们要感谢周围的一切，这是理所当然的，因为我们不可能只身一人活在这世上。空气、水、食品，还有家庭成员、单位同事，还有社会，我们每个人都在周围环境的支持下才能生存。不，与其说是“生存”，不如说是“让我生存”。</p><p>这样想来，只要我们能健康地活着，就该自然而然地生出感谢之心，有了感谢之心，我们就能感受到人生的幸福。</p><p>我活着，不，让我有活着的机会，我当然要表示感谢，这样我就会感受到幸福。有了这样一颗能感受幸福的心，我就能活得更加滋润，让自己的人生更加丰富，我相信这一点。</p><p>不要牢骚满腹，对现状要无条件地表示感谢，在此之上，再朝着更高的目标努力奋斗。首先，就“让我活着”这一点，向神灵表示感谢，向自己周围的一切说一声“谢谢”。我们要在“道谢”声中度过自己的每一天。</p><p>要抱着感谢之心!”这句话说来容易做来难。为此，我年轻时曾对自己说:“就是违心说谎，你也要说一声谢谢!”当“谢谢”这句话一说出口，我的心情就变得轻松、变得开朗了。对别人由衷地说声“谢谢”，用语言将自己内心的感激之情表达出来，听的人也会心情舒畅，这样就会营造出一种和谐快乐的气氛。牢骚满腹、将周围的气氛搞得很郁闷、很尴尬，我想这会给自己和别人带来不幸。</p><p>不管多么微不足道的事，我们都要表示感谢，这是最优先、最重要的。“谢谢你”“感谢您”，这样的话威力很大。它能将自己带进一个高尚的境界，也能给周围的人带来好心情。“谢谢”这个词是万能药。</p><p>在我上小学之前，那是战争时期，在家父出生的偏寂的山村深处，住着我的几位亲戚，他们偷着信佛。在日本明治时期，“废佛毁释”的政策使佛教受到了镇压，他们将佛龛和佛像藏在山里一家偏寂的房子的壁橱里。将信仰佛教活动保护且留传下来的，就是这些偷偷信佛的人。</p><p>家父带我去过那位亲戚的家，按照从前的传统，我们提着一盏灯笼，步履艰难地走在漆黑的山路上，最后，我们终于来到了深山里一间破旧的房子前面。进去一看，那里坐着一位僧人打扮的人，在念佛诵经。在他的身后，站着五个双手合十的孩子，他们都是小学生。</p><p>那位僧人对家父说:“这孩子已经得到佛的认可，以后不用再来了。”说完后，他又面对着我，说:“孩子，今生今世，只要你还活着，你就要念诵:‘南曼、南曼，谢谢!’每天向佛表示感谢，绝对不能忘记呀。</p><p>念佛时吟诵的“南无阿弥陀佛”，用鹿儿岛方言说就是“南曼、南曼”。</p><p>然后，那位僧人又对家父说道:“如果这个孩子能照我的嘱咐去做，他的人生会很顺畅。”最后，他用眼神示意我们:“你们可以回去了。”直到现在，对我来说，当时的情景依然历历在目。</p><p>我照着那位僧人的嘱咐去做，一直坚持到今天，从不间断。</p><p>现在，我皈依到禅宗的佛门之下，取得了僧人的资格。不过，禅宗里并不教大乘佛教里的“南无阿弥陀佛，谢谢”这样的内容，也不唱净土真宗的“南曼、南曼，谢谢”。但是，早晚两次，在家吟诵禅宗经书的时候，最后，我一定会说一声“南曼、南曼，谢谢”。现在依然如此。</p><p>这种感谢之心一直保持到今天，我想，正是这种虔诚的感谢之心造就了今天的我，造就了今天的京瓷公</p><p>司。</p><p>日文中的“谢谢”一词的含义是，本来不可能有的事现在有了，奇迹发生了，对这样的幸运当然应该感谢。京瓷、KDDI，这些优秀的企业居然都成功了。这本来不是我这样的人所能办成的事，然而，不可能的事情竟然发生了。对此，我必须用“谢谢，真是太难得了”等词语来表达自己的感谢之意。</p><p><strong>感谢的话语温暖大家的心</strong></p><p>“谢谢”这个词能在你的周围制造出一种和谐的氛围。我想，在座的各位都有过这样的经验，在电车上给老人让座，那位老人会弯腰道谢，“谢谢，太感谢了!”这时，给他让座的我们自己也会感到心情愉悦。看到这样的情景，周围的人们也会感觉很舒坦，而不会感到别扭。善意传达到周围的人，善意还将循环下去。我想，如果这样的好事不断发生、这样的行为不断涌现，社会就会变得越来越美好。</p><p>因此，懂得感谢，对生活、对自己活着表示感谢非常重要。</p><p>请允许我偏离一下主题。</p><p>除了“谢谢”这个词，还有“不敢当、不胜感激”这样的说法。比如说，像我这样的人竟能有这样的好运，让我不敢当，这是一种自谦，对自己能得到如此高的待遇感到不安，不敢当。这种表达和“谢谢”这个词一样，都是表示感谢的一种说法。</p><p>很久以前，还有“不胜惶恐”这样的词语，或许是武士用语，现在已经很少用了，意思是受人恩惠，无以为报，感到诚惶诚恐。</p><p>最近，我听到有些外国人讲“不敢当、不胜感激”这些词，它反映了人们高尚的感性，应该推广。“就我这样很普通的人，居然得到这么大的幸福，太不敢当了”。表达这种情绪的“不敢当、不胜感激”确实是一个非常好的词语。</p><p>“谢谢”“不敢当、不胜感激”“不胜惶恐”这些词语，不仅让自己愉快，还给包括对方在内的周围的人们带来好的影响，真是佳词妙语。</p>'
  },

    chapter: '第4天：第一章 概述 · 第五、六项 积善利他·勿感性烦恼',
    content: '<p><strong>第五项积善行，思利他</strong></p><p><strong>积善之家有余庆</strong></p><p>六项精进的第五项:“积善行，思利他”。这一点我也曾多次向大家强调。</p><p>在我还年轻的时候，在讲解经营十二条之前，我就向大家提出，要多行善，多做对他人有益的事。中国有句古语，叫作“积善之家有余庆”，意思是，多行善，多做好事就会有好报。不仅当事人，就连家人、亲戚也有好报。一人行善，惠及全家以至亲朋好友，中国的先贤们想说的就是这个道理。</p><p>从很久以前开始，我就一直强调，世间存在因果报应的法则。我曾向大家介绍安冈正笃先生著的《命运和立命》，这本书对年轻的我产生了深刻的影响。书中说，在这个世界上，存在因果报应的法则，如果你多做好事、善事，那么家人、家族有好报不必说，这种好报还会贯穿你的一生。利他的行为，就是以亲切、同情、和善、慈悲之心去待人接物，这非常重要。因为，这种行为一定会给你带来莫大的幸运。</p><p>我相信这个法则，在经营企业的过程中，我努力实践这个法则。多做好事，就能使命运朝着好的方向转变，使自己的工作朝着好的方向转变，这是我的信念。</p><p>一味地积善，就是说，为他人、为社会竭尽全力，这是使人生，也是使经营朝着更好的方向转变的唯一方法。</p><p><strong>同情并非只为他人</strong></p><p>日本过去就有“情不为人”就是同情并非只为他人这种说法。意思是讲，对别人有情，为他人行善，日后必有好报。</p><p>另外，我也听过这样的事:真心帮助别人，结果反而自己倒霉。比如，为了帮朋友摆脱困境，去充当他的贷款连带责任保证人，本以为做了善事，想不到出了麻烦，以致连自己的财产也丧失殆尽。还有一种情况，朋友有困难开口借钱，你借给他了，他却迟迟不还，让你陷入困境。</p><p>“不是说善有善报吗?怎么我做了善事却得到了恶报?”有人这么说，我认为这种说法不对。</p><p>在那样的场合，感情用事，只凭同情，就慷慨解囊，或当他的连带责任保证人，这本身就是一个问题。我对大家讲过，作为经营判断的基准之一，有“大善”和“小善”之分。朋友手头紧，找上门求你帮忙，仅仅因为他来求你，你就同情他，不假思索就出钱相助，表面上看你是帮了他，实际上是害了他，使这位不负责任的朋友变得更不负责任。他之所以债台高筑，原因在于此人做事马虎，花钱大手大脚，缺乏计划性。如果你可怜他而借钱给他，反而会助长他那马虎和挥霍的坏习性。迁就朋友的不合理要求，这是“小善”，你关爱和同情他的方式不对，是帮他的倒忙，让他越陷越深。</p><p>俗话说:“再爱孩子，也要让他经风雨、见世面。”乍看起来，这种对孩子的“大善”近乎无情。</p><p>朋友找上门来借钱，央求你做他的连带责任保证人，这时，首先你要问清楚事情的来龙去脉，要认真调查，如果是由于他做事不检点，乃至挥霍浪费才导致了今天的结果，那么你应该断然地拒绝他，明确告诉他，这个钱不能借，而且，你还要劝导他正视眼前的困难，接受教训，重新振作起来。</p><p>如果你唯唯诺诺、有求必应，借钱给他，或同意做他的连带责任保证人，这似乎也算一种“善行”，但它是“小善”，这种“小善”会把你牵连进去，弄得你狼狈不堪。在需要做出判断的时候，不能感情用事，判断的基准是“大善”还是“小善”，这才是问题的关键。</p><p>“与人为善，善有善报”，同情他人，为他人多做好事，结果必然利人也利己，这绝对错不了。我坚信这</p><p>点。</p><p>刚才讲到金钱借贷的问题，我在这里讲一件我亲身经历的事情。战争时期，有个人曾经给家父帮过大忙。有一天，这人的儿子来找我。那时，京瓷公司从一家中小企业开始有了起色。他来到京都，对我说，他现在很困难，想从我这儿借钱。因为我听说过他父亲对我父亲有恩，于是就把钱借给他了。</p><p>但是，我既没有让他写借条，也没有问他的还款计划。我觉得，那人的性格不可靠，表面上，我是借钱给他，实际上，我是送钱给他，我压根儿没有打算让他还钱。后来，我也没有催促他还钱，一次也没有。而他呢，也从此没了回应，“没还钱，对不起”，连这样的电话也从没来过。但是，由于我一开始就不准备他还钱，我并没为此而烦恼。</p><p>到现在为止，别人向我借钱的事有过多次。因为年轻时我考虑过这样的事，所以，名义上是借，实际上是送，这种情况是有的。但是，以必须还钱为前提，我才肯借出，这种情形一次也没有。因此，做了好事没有好报、反而遭人背叛的事，在我身上一次都没有发生过。</p><p>有一次，公司里一位员工的父亲遇到了困难，他们父子俩一起深夜来到我家。那时，我刚四十出头。当时，我仔细地询问了事情的原委，最终断然拒绝了他们的请求。</p><p>“伯父，我把钱借给您是会害您的。我也许不了解您现在困难到哪个地步，但我还是不能答应您。伯父，您要挺身接受您现在面临的苦难，必须承担得住才行。”</p><p>另外，我也觉得自己有些冷酷，但是当时的决断没有错。那位员工现在已是京瓷的干部，从事海外业务方面的工作。他的父亲从那以后也重新振作了起来。他还对别人说，应该感谢我，多亏了那时我对他的帮助和鼓励。</p><p>为了让人生更幸福，为了让经营更出色，希望大家多行善事、多做对他人有益的事。</p><p><strong>第六项不要有感性的烦恼</strong></p><p><strong>忘掉失败，全力投入新的工作</strong></p><p>六项精进的最后一项:“不要有感性的烦恼”。因为我自己年轻时有过各种各样的烦恼，所以才会觉得这条也很重要。</p><p>担心、烦恼、失败等，是人生的常事。但是，覆水难收，总为曾经的失败而悔恨，毫无意义。老是闷闷不乐会引起心病，接下来会引发身体的毛病，最终给自己的人生带来不幸。不要让已经过去的事再困扰自己，心里要想新的事情，新的想法要转移到新的行动上去，这一点很重要。</p><p>要对过去的事进行深刻的反省，但不要因此在感情和感性的层面上伤害自己，从而加重自己的心理负担。要运用理性来思考问题，迅速地将精力集中到新的思考和新的行动中去。我认为，这样做就能开创人生的新局面。</p><p>工作失败，我们会很失望、很懊悔。但是，无论失望也好，懊悔也罢，失败了的事情不可能从头再来。后悔、烦恼没有意义，这个道理即使明白，我们仍然会想那一点当初如果做好了就会如何如何，照样后悔，照样烦恼。这个毛病要改。</p><p>已经发生的事既然无法改变，就干脆把它忘掉，将全副精力投入新的工作，这是最要紧的。</p><p>比如，自己被卷进某个丑闻，遭遇道德和法律的追究，不但本人倒霉，还殃及自己的父母、兄弟姊妹和周围的人。发生这样的事，我们当然要深刻地反省，反省坏事产生的原因，然后从内心发誓，今后不再犯同样的错误，洗心革面，重新做人。这就行了，不要没完没了地折磨自己，长期活在名誉受损和失败的阴影里，意志消沉，这不好，没有必要。</p><p>因丑闻而名誉扫地，受到这种打击之后，有的人身心崩溃，以自杀了断。丑闻发生的原因，是过去自己犯下的罪，也就是有“业”在身。这种“业”现在作为结果，遭到了周围人的责难。这种时候，要充分反省，决不让同样的事再次发生。与此同时，我们反过来要激励自己，让遭遇重创、身心交瘁的自己重新站立</p><p>起来，没有必要一蹶不振，老是和自己过不去。</p><p>不管怎样丢面子，都要拿出勇气正视现实，重整旗鼓。做了对不起家人、亲戚朋友，对不起公司的坏事，让自己脸上无光，在社会上抬不起头来，即使发生了这样的事，在经过认真反省以后，就要鼓足勇气，在跌倒的地方爬起来，不要心灰意冷，总是痛苦个没完。</p><p><strong>担雪老师的话拯救了我</strong></p><p>二十几年前发生的一件事，让我至今印象深刻。</p><p>陶瓷与人的细胞具有亲和性。人的细胞对金属会产生排斥反应。人的细胞可以在陶瓷表面上顺利繁殖，它不排斥陶瓷，却对金属敬而远之。</p><p>根据陶瓷的这种特性，在日本医学专家的支持配合下，我们用陶瓷材料成功地研制出人骨的替代品。最初是牙科移植用品，我们与医学专家们一起研究开发陶瓷牙根，并成功地付诸实践。此后，为腰关节损伤、不能行走的患者，我们又研发出了人工股关节，得到厚生省的认可并开始销售。使用陶瓷材料可以减少摩擦，人工股关节的使用效果获得了众多医学专家的好评，当时他们要求我们，接下来一定要研制出膝关节。</p><p>虽然制作膝关节的呼声很高，但销售必须经过厚生省的批准，为此，我们必须进行临床试验，然后将有关数据提交给厚生省。然而，医生们都认为，陶瓷股关节效果非常好，已经积累了几百个成功案例，同样，用陶瓷制作膝关节不会有任何问题，如有问题，医生可以负责，为了那些因为膝关节不好而痛苦的人们，请你们尽快开发出新产品。我们公司的技术人员认为，既然如此，我们就应该研制人工膝关节，提供给患者使用。</p><p>与人工股关节一样，膝关节的效果也非常好，订制人工膝关节的要求源源不断，正当我们依照客人的要求制作时，有人写新闻稿投诉，报章杂志纷纷登载:“京瓷在没有得到厚生省批准的情况下，销售陶瓷膝关节赚钱。在人命关天的医疗领域，为做生意而销售未经许可的产品，这样的企业太缺德了。”</p><p>这不仅有伤我个人的体面，而且媒体连日把矛头指向京瓷公司，指责我们为赚大钱不惜以病人为诱饵。我们多次去厚生省说明解释，并认错道歉。每当此时，媒体的摄像机就摆开阵势，我低头道歉的样子连日出现在电视新闻之中。在家族、公司员工以及周围的人群中我抬不起头来，我的名誉、信用都受到了巨大的伤害。</p><p>我坐立不安，心里非常痛苦。那时，我想到了临济宗妙心寺派圆福寺的西片担雪老师。我想大家都知道的吧，前不久他刚刚过世。那天我去拜访他，喝着老师泡制的抹茶，我向他倾诉了自己的痛苦和委屈。</p><p>“稻盛君，你之所以会感受到这样的苦恼，那是因为你还活着。如果你死了，就没什么苦恼了。正因为活着才会有苦恼，这不是件好事吗?”</p><p>因为活着才会有苦恼，是这么个理儿，但是，他可是我非常敬仰的老师啊，这时候他这么讲，我觉得有些意外。现在回想起来，大概当时我也把自己的疑虑写在了脸上。</p><p>“稻盛君，虽然我不知道你过去积下了怎样的罪孽，但是，你积下的那些‘业’以灾难的形式表现出来了。你现在倒毒，这是你过去犯下的罪孽所致，这是一种因果报应，当原因招致的结果发生时，原因也随之消失，就是‘业’消失了。”</p><p>“如果这种报应严重到要剥夺你的性命，那么，你的人生就算告一段落，但是，稻盛君，你不是还活得好好的吗?京瓷也还是一派繁荣景象。因为人工膝关节的问题，你受到了严厉的批判，你感到痛苦和烦恼，但是，这种程度的挫折就能把事情了结，就能将你过去的罪孽一笔勾销，稻盛君，该庆祝一番才对啊!来来来，煮点红豆饭把酒斟满，让我们一起干杯!</p><p>当时我想，我如此苦闷，你却讲这些，未免不近人情。可是，回家以后，我觉醒了，老师的话救了我。如果这种程度的灾难就可以消“业”，就能勾销我的罪孽，那么，我甘愿接受世间的非难和指责。接受就是种忏悔，这是为了清除自己身上的污垢所必需的，当我意识到这一点时，我的心境豁然开朗，浑身有了力量。</p><p>“灾难的发生，是自己过去犯下的罪孽的报应，如果没有殃及性命，到此为止，那反而是值得庆贺的事。”这样一想，摆脱烦恼，人就轻松了，可以将这事忘掉，转而在新的人生旅途上坚强地、满怀希望地走下去。</p><p>对挫折和灾难抱持上述正面的态度，才会有一个幸福的人生。我多次向大家讲过这些道理。</p><p>这个观点非常重要。估计今后经济的不景气将越发严重，销售货款无法回收，到手的支票不能兑现，等等，会发生各种纠纷或灾难。超越这些障碍，不让感性的烦恼困扰自己，朝前看，坚强地活下去，这才是最</p><p>重要的。</p><p>“六项精进”这个话题我过去讲过。我年轻时给大家讲这个话题，是讲我当时的切身体验。现在老话重提，一是因为经济萧条正在向我们逼近;二是因为今天在场的，有很多是刚刚入塾的塾生。我觉得，重讲我年轻时讲过的内容，是很有意义的。</p><p>希望大家务必学习并实践这“六项精进”，使经营更出色，让人生更精彩。我的演讲就此结束，谢谢大家!</p>'
  },
  '2026-09-03': {
    chapter: '第5天：第二章 超越经济变动，实现企业持续发展（上）',
    content: '<p>第二章超越经济变动，，实现企业持续发展<br>我是刚才承蒙介绍的稻盛和夫。</p><p>今天，在中国有代表性的企业经营者面前有发言的机会，我感到十分荣幸。请允许我向赐予我这个机会的《中外管理》的杨沛霆总编表示衷心的感谢。</p><p>今天我演讲的题目是“超越经济变动，实现企业持续发展”。首先，请允许我做一下自我介绍。</p><p><strong>创办京瓷</strong></p><p>1932年，我出生于日本西南部的鹿儿岛，大学的专业是应用化学，毕业后就职于日本古都京都的一家瓷瓶制造公司，当一名技术员。后来在几位友人的支持下，于1959年，也就是在我27岁的时候，我在京都创立了一家生产精密陶瓷零件的“京都陶瓷”公司。</p><p>虽然是白手起家，但我开发的精密陶瓷材料深受业界欢迎，京瓷也努力将这种材料应用于各种领域。</p><p>创立以来的50年里，京瓷充分利用精密陶瓷的特性，开发出了各色各样的产品，从各种精密陶瓷元器件到太阳能电池、医用材料，以至手机、打印机、复印机等终端产品，现已成长为日本具有代表性的高科技企业之一</p><p>在中国，京瓷已经在上海、东莞和天津建立了制造基地，生产电子零部件、打印机、复印机和太阳能电池。</p><p>另外，在日本还有一家同样也是由我创办的KDDI公司，京瓷是其第一大股东，KDDI从事长途电话和移动通信业务。KDDI公司在通信行业的新准入企业中位居首位，现在已成为日本国内第二大通信运营商。</p><p>除此之外，京瓷还有宾馆以及从事计算机系统服务等的企业群。从材料到元器件、零部件，从机器设备的制造到通信、服务，像这样业务涉及整条产业链、业务领域又如此广泛的企业，我想在全球也是极为罕见</p><p>的。</p><p>2009年3月，这些由我创建的企业集团的合并销售额达到约4.6万亿日元，利润约5000亿日元。</p><p>在日本中小、中坚企业中，有很多经营者想要学习我的经营思想。因此，自1983年起，我就义务传授我的经营哲学，并以“盛和塾”这种经营塾的形式在全日本展开。</p><p>“盛和塾”以日本国内为主，现在全世界已经发展到60家，塾生超过5400名。另外，在无锡设立了中国首家“盛和塾”，现在中国还有不少地方都希望学习我的经营哲学，应该怎样来回应这种要求，我们正在认真研究。</p><p><strong>经济周期的影响</strong></p><p>世界经济从2008年9月美国金融风暴爆发以后迅速恶化，因为波及实体经济，出现了整个世界同时萧条的局面。直到最近，经济才开始走出谷底，有所恢复。但是，美国的景气状况等各个方面仍有许多不稳定的因素，形势依然不容乐观。</p><p>在这种情势下，中国仍然宣布要达到“8%的经济增长率”，同时发表了高达4万亿元的经济刺激政策，在世界经济恢复的过程中站到了前列。但同扩大内需相比，因为出口还远未恢复，据说企业效益的增长不够理想。</p><p>由此看来，这次由美国金融机构破产引发的金融风暴，真所谓是“百年一遇”，超越了国界，给各国经济乃至企业经营造成了很大的影响。</p><p>然而，回顾过去的世界经济发展历程，变动起伏是反复出现的。大大小小、各式各样的景气与不景气总是交替产生，时而还会发生经济的大萧条、大地震，给企业经营造成很大的冲击。</p><p>比如，俯瞰我亲身经历的第二次世界大战后的日本经济，从战败后的谷底崛起，长达半个世纪，看起来似乎是持续成长发展，实际上，日本经济是在反复的经济变动过程中发展起来的。</p><p>在经济变动的波涛之中，日本企业荣枯盛衰的故事不胜枚举。有的企业被这种波涛冲垮，有的企业乘风破浪，在经济变动中获得飞跃发展。实际上，包括中小企业在内，因经济变动的旋涡所吞噬而倒闭的企业的数量更多。</p><p>翻开日本战后的产业史，呈现出的可谓是“户骨累累”的景象。事实上，只有那些越过了累累尸山的企业，直到今天才能依然繁荣兴旺，发展势头不减。</p><p>释迦在形容人世时，曾用“诸行无常”一语道破。在变幻莫测的经济大潮中翻滚起伏的企业境遇之严酷，正如释迦所言。但是，变幻莫测正是人世的“命运”，今后也一样，无法预测的经济变动的波涛仍将不断地冲击企业。</p><p>这种时而袭来的经济变动，既然如“命运”一样无法回避，那么企业经营者应该如何思考、如何执掌经济之舵呢?我想结合我平时的思考，以及我实际应对经济变动的经验，来展开今天的话题。</p><p>首先，我想简要地回顾一下变化频繁的日本战后经济产业的历史。这对当今取得惊人的经济发展的中国来说，或许可供参考。</p><p>1945年日本战败，全体国民团结一致着手经济的复兴。但是，当时的日本经济非常困难，国内的工厂、运输设备、基础设施大半损毁，同时海外的日本人大量归国，出现了通货膨胀和粮食危机。</p><p>当时的日本，除了拥有每一位国民面对废墟、向往富裕的愿望，几乎一无所有。但正是这种渴望富裕而催生的勤奋，成为日本从焦土中奋起的原动力。全体国民为追求富裕而拼命工作，他们汗水的结晶创造了日本经济的“世界奇迹”，带来了经济复兴的丰硕成果。</p><p>1960年，日本政府发布了“国民收入倍增计划”，致力于大幅提高国民的生活水平。1964年，日本举办了东京奥林匹克运动会，同时贯通日本东西的大动脉高速公路和高速铁路等社会基础设施快速建成。1970年，大阪世博会开幕。</p><p>其间，电视机等家用电器迅速普及。当“家庭电器化时代”到来之际，20世纪60年代，京瓷公司作为生产电视机显像管用陶瓷绝缘品的厂家，迎来了创业期。</p><p>作为日本经济高速增长的标志，由出口产业拉动，以年增长率9%的速度持续发展。但进入20世纪70年代，快速增长的日本经济走到了转折的关头。</p><p>这就是1971年的所谓“尼克松冲击”。美国因为连年的贸易逆差而放弃了美元的固定汇率制度。在这之前的20多年里，汇率被人为控制在1美元兑360日元的水准上。习惯了这种汇率的日本出口产业不得不改变经营的方向。</p><p>努力削减成本以维持价格竞争力，那是理所当然的事，同时提高产品质量、开发独创性的产品，日本的产业结构被迫向高附加值的方向转变。</p><p>在这一过程中，很多企业被淘汰出局，但就整体而言，日本经济仍然持续增长，经常收支的盈利状况并没有改变。但不久后，日本经济又受到了石油危机的冲击。</p><p>因中东原油价格飞涨引发的石油危机，使企业订单急剧减少、原材料成本迅速攀升，日本产业界一时陷入了巨大的混乱之中。但是众多日本企业通过拼命努力，最终克服了这次空前的经济危机。有关我处理石油危机时的经验，后面还要谈到。</p><p>克服了连续两次的石油危机，日本企业进一步提升了竞争能力，日本的贸易顺差继续扩大。由于日本出口大幅增加，使日美之间贸易失衡问题更加突出，从20世纪70年代后半期开始，日美贸易摩擦日益加剧。</p><p>在美国的强硬要求下，为修正贸易失衡，日本以钢铁、汽车为主，自行限制对美出口，同时采取降低关税等措施，促进从美国的进口。日美间的贸易摩擦虽然持续了很长时间，但后来日本企业采用在美国本土生产等方法，使这个问题逐步趋向缓解。</p><p>回头来看，伴随浮动汇率制度的实行而导致的日元升值，虽然对日本企业是一个很大的挑战，但同时也带来了进口成本和海外投资成本降低的好处。更重要的是，日元升值反而成了日本企业提升国际竞争力的契机，因为日本企业为了消化日元升值的压力，在企业合理化方面做出了巨大的努力。</p><p>其后，1985年的“广场协议”使日元进一步升值。1995年日元甚至创纪录地升至1美元兑79日元。“再绞拧已干了的毛巾!”许多日本企业彻底地提高效率，取得了更大的经营成果。</p><p>1995年的超高日元汇率，对出口比例超过40%的京瓷来说也是一次严峻的考验。但全公司团结奋斗，彻底削减成本，虽然销售额一时有所降低，但利润率没有下降，一直保持在20%左右。</p><p>以“广场协议”后的日元升值为契机，资金开始从海外流入日本，同时为了救助因日元升值而陷于困境的出口产业，日本政府实行了宽松的金融政策。由于这些原因，自20世纪80年代后半期起，日本经济活动中，投机迅速升温，特别是对股票和土地的投资，不仅企业，连个人也都踊跃参与。</p><p>股票市场的平均股价仅仅5年就涨到之前的3倍，6大城市的地价也在短短几年中飙升到之前的3倍。升值再升值，一时坊间甚至流传着“东京23个区的地价足以买下整个美国国土”这样的神话。</p><p>日本很多企业遵照金融机构的劝导，热衷于土地和股票的投机。但是我们京瓷公司决不依靠投机获利，我们一如既往，专注于事业经营，靠自己的辛勤劳动来获取利润。</p><p>缺乏实体经济增长的支撑，经济泡沫理所当然不久就破灭了。1990年，日本财政当局抑制经济过热的政策一出台，立即成为导火线，股价、地价开始暴跌，不仅许多企业承受了巨额账外损失和负债，而且战后一直支撑日本经济发展的金融系统也开始摇摇欲坠，发出了崩裂的声响。</p><p>泡沫经济时期，以企业土地作抵押，银行借贷出了大量的资金。由于地价下跌，这些贷出的资金都变成了不良债权。银行因拥有大量不良债权而陷入经营危机。</p><p>截至2002年，日本的大型银行被迫处理了高达88万亿日元的庞大的不良债权。政府注入公共资金，银行处于维持惨淡经营的窘境。银行的困境导致了“惜贷”，银行不愿向企业融资，这又引发了以中小企业为主的连锁性企业倒闭潮，其影响波及整个社会。</p><p>结果是，1997年和1998年日本经济连续两年负增长，尔后又陷入长期低迷。因此20世纪90年代的日本经济被称为“失去的十年”，日本经济进入了长期的严冬。</p><p>进入21世纪以后，大型银行对不良债权的处理基本完成，企业收益有所改善，日本经济迎来了恢复期。</p><p>但2001年伴随美国IT泡沫的破裂，以电子工业为中心的日本产业界又遭受打击，许多企业利润大幅下滑。</p><p>日本经济的创伤眼看即将愈合之际，开头所讲的、这次因美国金融机构破产引发的世界性经济萧条，又袭击了日本企业，现在有很多日本企业依然在痛苦中挣扎。</p><p>综上，我就日本经济在战后60年中所走过的历程、所遭遇的经济变动做了概要的说明。</p>'
  },
  '2026-09-04': {
    chapter: '第6天：第二章 超越经济变动，实现企业持续发展（中）',
    content: '<p><strong>从容应对严峻的经营环境</strong></p><p>企业周围的经济环境就是这样变动频繁。不管拥有多么好的独创性技术，不管拥有多么高的市场占有率，不管具备多么完善的经营管理体制，也无论自以为经营基础多么坚如磐石，在突然袭来的经济变动面前，企业仍然可能不堪一击。</p><p>在如此严峻的经营环境中，京瓷公司今年正好迎来了创业50周年，在这50年里，京瓷公司没出现过一次亏损。许多企业，何止是亏损，甚至濒临倒闭，或以解雇员工勉强维持生存。翻阅波澜万丈的历史，京瓷公司经历半个世纪而能持续成长，这是十分罕见的。</p><p>看到京瓷公司迄今走过的历程，也有人认为“那不过是京瓷的产品和事业碰巧赶上了潮流，那只是幸运”。但是我认为决非如此，幸运要持续半个世纪之久，那是不可能的。</p><p>反复袭来的经济变动把许多企业淘汰出局，而一个企业在长达50年的历程中，不仅能够持续生存，而且能够年年岁岁不断成长发展，其中肯定存在必然性的原因，那就是指引企业持续成长的“经营的真谛”。</p><p>但是，指导企业长盛不衰的“经营的真谛”决不是什么复杂难懂的道理。首先，重要的是经营者的态度。这种态度就是所谓“慎重坚实的经营”，我认为这极为单纯。</p><p>当然在激烈的市场竞争中，为了保护员工，为了企业的生存，经营者决不能示弱，要有坚定好胜的性格和积极果断的行动。但是为了企业的长期繁荣，经营者无论如何都要小心谨慎，要保持“如履薄冰、如临深渊”的心境。</p><p>我想回顾一下京瓷公司创业初期的情景。</p><p>创业第一年销售额约3000万日元，利润约300万日元。既没有经营经验又没有经营知识，刚刚着手经营，当得知第一年结算就实现10%的利润率，做出300万日元的利润时，当时我特别兴奋。那种心情至今记忆犹新。</p><p>为什么会那么高兴，因为可以有钱归还借款了。</p><p>公司创业之初，有一位信任我的资助者，用自家房产作抵押，从银行贷款1000万日元，作为京瓷的创业资金。“与我无亲无故的朋友居然用这种方式来帮助我。决不能让他蒙受损失，必须尽早归还贷款。”这个念头时时催逼着我。</p><p>还有一点是我自己与生俱来的性格。我的父亲十分忌讳向人借钱。第二次世界大战前我还幼小的时候，父亲经营家庭印刷厂，有很大的印刷机器，还雇用了员工，在乡下也属于成功者的行列。</p><p>但是在第二次世界大战的空袭中，家屋和工厂都被炸毁，一时间，父亲茫然不知所措。战后，父亲已经完全没有了重建印刷厂的念头，不管亲朋好友怎样催促，他都毫不动心:“在这种通货膨胀时期，借钱背债务，让7个孩子没饭吃，那可不行!</p><p>或许是继承了父亲稳重小心的性格吧，我对借钱负债抱有极端的恐惧心理。</p><p>基于上述原因，加上技术员出身，我没有经营的知识和经验，当时甚至连税金的概念也没有。所以当我得知第一年就有300万日元的利润时，我就十分开心:“如果有300万日元的利润，那么1000万日元的贷款3年就能还清。”</p><p>但是理所当然，支付了税金以后就只剩下大约一半，也就是150万日元，再支付股东分红和董事报酬之后就只剩100万日元了。这样的话，归还1000万日元的贷款不是要花10年的时间吗?</p><p>用的是经过改进的二手设备，到时总要有新设备投资吧，但仅仅归还创业贷款就要花10年的时间，新设备投资就指望不上。我对此感到非常惶恐。</p><p>我向那位资助者请教:“如果这样，公司不可能发展壮大。花10年时间还清银行贷款时，现有的制造设备已经老化。不!如果考虑到技术的进步，现有设备不可能用上10年。公司将向何处去，我完全不得而知。”</p><p>于是，那位资助者笑着对我说:“你说什么呢?因为你拼命努力，第一年就有了10%的利润，非常了不起。虽然融资1000万日元，但是在支付了银行利息后还能有10%的利润，说明这项事业大有希望。如果估计销售额还将增长，就应该继续接受银行贷款，积极进行设备投资。”</p><p>我答道:“那不是要增加贷款了吗?”他说:“这就叫事业。”但是我仍然回答说:“借了1000万日元，给您添了这么大的麻烦，我已经很不安，再要贷款我非常惶恐，实在做不到。”</p><p>这位资助者说:“你是优秀的工程师，却成不了优秀的经营者。只强调归还贷款，那样公司就不能发展壮大。大凡企业家都会从别处筹措资金，进行设备投资以发展壮大企业。只要能偿还利息，提取折旧，贷款投资设备既不丢人，也不是坏事。”</p><p>但是，当时我既没有经营经验也缺乏常识，只能按照自己内心的希望，发誓不再增加贷款，而将还贷作为要务放在首位。</p><p>这时我突然意识到:“利润率10%的情况下，在支付了税金、奖金、分红以后，手头只剩下100万日元，这样偿还贷款就要10年。那么，将上述各项全部扣除后，再能剩下300万日元纯利的话，不就行了吗?那样只需3年就能还清贷款。就是说，不满足于第一年10%的利润率，而设定更高的利润率目标开展经营就行。”</p><p>这一认识成了京瓷公司高收益经营的起点。公司创立不久，就立志要成为高收益企业，并不是因为我是野心家，也不是因为我有贪欲之心，而是出于我谨慎小心的性格、坚持“慎重坚实经营”的缘故。</p><p>在这种慎重经营的态度下，我平时又用心做到“销售最大化、费用最小化”，此后利润率有时甚至超过了40%，由此京瓷公司成了日本具有代表性的高收益企业。同时将取得的利润作为企业留存收益不断积累，由此京瓷公司成了日本有代表性的、值得自豪的财务体质优良的无贷款企业。</p><p>这里的要点是:以谨慎的态度经营企业，打造高收益体质的企业，形成值得自豪的财务体质优良的企业。这就是京瓷公司克服多次经济变动、顺利发展至今的原动力。</p><p>就是说，高收益可以降低企业的盈亏平衡点。高收益是一种“抵抗力”，使企业在萧条的形势中照样能站稳脚跟，也就是说企业即使因萧条而销售额下降，也不至于陷入亏损。同时，高收益又是一种“持久力”，高收益企业有多年积累的、丰厚的留存收益，即使萧条期很长，企业长期没有盈利，也依然承受得住。另外，因为经济萧条期购买设备比平时便宜许多，此时可以下决心用多余的资金进行设备投资，使企业获得再次飞跃的动力。</p><p>在日常的经营中，采取慎重的经营态度，尽力打造高收益体质，这不仅是预防萧条最重要的策略，而且是应对萧条的最佳处方。</p><p>从这个意义上讲，我在公司内外总是强调“没有10%的销售利润率，就算不上真正的经营”。</p><p>萧条出现，首先是客户的订单减少，对制造业来讲，就是没有活干，可卖的产品减少，由此销售额下降，比如本来卖100个的现在只能卖90个，利润当然会减少。</p><p>这时，因为平时有10%的利润率，即使销售额下降10%，照样可以盈利，不!即使销售额下滑两成，企业仍然可以保证有一定的利润。只有当销售额下降30%或40%时，才可能出现赤字。</p><p>因为利润率高意味着固定费用低，销售额多少降一些，利润只是减少而已。如果企业利润率达到20%或30%，即使销售额下降一半，企业仍可盈利。</p><p>也就是说，一家高收益的企业即使遭遇萧条，销售额大幅下降，仍然可以保持一定的利润。这意味着企业的基础非常稳固。</p><p>事实上，在京瓷公司50年的发展历史中，前面已经讲到，我们虽经历过因萧条而销售额大幅下降的情况，但从来没有出现过一次亏损。</p><p>1973年10月第一次石油危机冲击全世界，受其影响，世界性的萧条波及京瓷公司，1974年1月，京瓷公司的订单每月有27亿日元，但到了同年7月，降至不足3亿日元，可以说是骤减。</p><p>也就是说，仅仅半年之内，订单就降到了1/10，尽管遭遇如此急剧的景气变动，这一年京瓷公司依然没有亏损。</p><p>因为京瓷公司具有独创性技术，能批量制造当时谁也做不了的精密陶瓷产品，而且平时又贯彻“销售最大化、费用最小化”的经营原则，利润率超过了值得自豪的30%。</p><p>形成高收益体质的企业还可以对保证员工的就业做出贡献。</p><p>在石油危机引发大萧条的时候，连日本的一些大企业也纷纷停产，解雇员工，或让员工歇业待岗。此时，京瓷公司在保证所有员工正常就业的同时，仍然确保产生利润。</p><p>同时通过高收益获得的利润作为企业留存收益不断积累。纵使因经济萧条而转为赤字，在相当长的时间内，即使不向银行借款，不解雇员工，企业照样挺得住。</p><p>之所以能够不断积累企业留存收益，是因为我本来就属于谨慎小心又爱操心的那一类人。“一旦遭遇萧条该怎么办呢?”我一直忐忑不安，也正因如此，我经营企业就格外努力，所以，即使处于石油危机的旋涡中心，在公司的安全性方面我仍有足够的自信。</p><p>经济不景气，员工的信心就会动摇。当时的我充满自信，这样说道:</p><p>“请大家不要担心，即使优秀的企业也因不景气接连破产，然而我们京瓷公司仍然可以生存，哪怕两年、三年销售额为零，员工们照样有饭吃，因为我们积累了足够的储备。所以大家不必惊慌，让我们沉着应战，继续努力工作。”</p><p>我用这些话来稳定军心，这些话语既不是谎言也没有夸张，事实上，当时京瓷公司确实有足够的资金。</p><p>京瓷公司从创业一直到今天，持续这种脚踏实地的经营，现在京瓷公司随时可以使用的现金约有4700亿日元、股票等资产约有3700亿日元作为留存收益，合计约有8400亿日元的储备，不管遭遇怎样的萧条都不会很快动摇京瓷公司经营的根基。</p><p>但是近年来，有人对我主张的慎重坚实的经营方针提出了异议，他们看重股东权益报酬率，又称净资产收益率，即所谓ROE。</p><p>以美国为中心的投资家们认为我上述的经营方针是不正常的。</p><p>ROE就是相对于自有资本能产生多少利润，在重视ROE的投资家看来，不管你有多么高的销售利润率，你只是把赚到的钱储存起来，用这么多的自有资金却只能产生这么低的利润，他们因此就判断为投资效率差。</p><p>受他们的影响，不少经营者也开始认为“必须提高ROE”。因此，将辛苦积攒起来的留存收益拿去并购企业，购买设备或购买本公司股票，消耗掉留存收益。将自有资金缩水，去追求短期利润最大化，这样ROE会达到较高的标值。在美国式资本主义世界，这样的经营被评价为优秀。</p><p>京瓷公司的经营高层在美国、欧洲开投资说明会，总会听到这样的意见:“京瓷公司的自有资本比例实在太高，而ROE太低，存这么多钱干什么呢，应该去投资，应该去并购企业，应该勇于挑战，好赚更多的钱，给股东更多的回报，这是我们投资家的要求。</p><p>听到经营干部们的汇报，我就说:“完全不必按那些投资家的意见去办。</p><p>当“ROE高的企业就是好企业”这种观点成为常识的时候，我的意见似乎就是谬论。但是，这种所谓常识，归根到底，不过是短期内衡量企业的尺度。</p><p>现在买进股票，待升值时抛出，这样就能轻松赚钱。对于这样思考问题的人来说，当然ROE越高越好，但我们要考虑的是企业长期的繁荣，对我们来说，稳定比什么都重要，企业应该有足够的储备，才能承受得起任何萧条的冲击。</p><p>就这样，我从很早开始就坚持以慎重的态度执掌经营之舵。结果就把高收益经营作为目标，并不断积累企业留存收益。我坚信，这样做就能预防萧条，克服经济变动带来的困难，引导企业走向长期繁荣。</p><p>贷款应该尽早归还银行，打造高收益体质的企业，这样努力的结果，不仅实现了无贷款经营，而且因不断积累留存收益，又建立了极其健全的财务体质。至于设备投资，没有回收的把握就绝不进行。半个世纪以来，我固执地坚持了这种慎重经营的态度。</p><p>“这样去经营，企业不可能发展壮大。”周围的人总是这么说。但是，正因为坚持了慎重经营的态度，在众多企业被淘汰的风浪中，京瓷公司却能应对多次经济变动，持续了长达半个世纪的稳定发展。</p>'
  },
  '2026-09-05': {
    chapter: '第7天：第二章 超越经济变动，实现企业持续发展（下）',
    content: '<p><strong>经营还需要哲学</strong></p><p>当然，并不是说只要有慎重经营的态度这一点就够了。在经营企业的过程中，我会获得各种各样的启示，我每次都会把这样的心得记在本子上，而且一有机会，就向公司内外的人们解释。</p><p>我将自己思考的有关经营的原理原则称为“哲学”。其中有“重视独创性”“成为开拓者”等许多提倡积极果断地向新事物发起挑战的重要内容。</p><p>同时，作为实现新目标的方法，我又提出“怀有渗透到潜意识的强烈而持久的愿望”“不断付出不亚于任何人的努力”“明天胜过今天、后天胜过明天，反复钻研创新”等原则。</p><p>再进一步，要想在企业间激烈的竞争中取胜，要不断实现经营高目标，我又提出经营者必须具备像格斗士那样“燃烧的斗魂”和洞穿岩石般“坚强的意志”。</p><p>除了经营哲学，我还谈到了经营者必须掌握的具体的经营管理手法，包括要精通实用的企业会计，要在企业内部建立管理会计的体制等。</p><p>但是，作为经营者，我认为这些经营思想和经营管理体制的基础，归根结底还在于经营者必须具备慎重坚实的经营态度，必须构筑绝对安全的经营基盘。</p><p>回顾半个世纪走过的历程，我强烈而深切地感觉到，正是有了上述的经营态度和思想，才有了我们企业的今天。为了确保企业长期持续地发展，近来我强烈地感觉到，还有一条极其重要。</p><p>这就是经营者不能只顾自己个人的私利，不能只顾满足自己的欲望，而必须考虑员工、客户、交易对象、企业所在社区等，必须和与企业相关的一切利益相关者和谐相处，必须以关爱之心、利他之心经营企</p><p>业。</p><p>为什么?因为近年来我们看到，很多企业之所以破产，并不是因为外界的经济变动，即“他律性”的原因，而是经营者自身的素质，即“自律性”的原因，是经营者“自毁长城”。</p><p>我们还记得，2001年美国的安然公司、世界通信公司，以及最近的雷曼兄弟公司等，攫取巨额报酬的经营者的贪婪成了企业破产最根本的原因。我认为这么说并不过分。</p><p>2008年9月美国投资银行雷曼兄弟破产，并由此引发金融风暴，该公司首席执行官理查德·福尔德，在2000年后的任期中获得3.5亿美元的巨额报酬。</p><p>另一家美国大型投资银行美林证券，因次贷危机遭受巨大损失，被美国银行收购，它的首席执行官斯坦尼·奥尼尔引咎辞职时的退职金高达1.6亿美元。</p><p>企业利润不只是经营者和经营干部，而且是企业全体员工共同努力和协作所取得的成果，这种成果却被认为是企业领导者一个人的功劳。一人独享高额报酬，这是极不合理的。经营者的这种贪婪引发企业内部的不和谐，进而成为企业破产的原因。</p><p>举。</p><p>这种因为忘却谦虚、一味利己而导致企业破产的事例，不只发生在美国，古往今来，国内国外不胜枚举，</p><p>比如某位经营者有才能，很努力，把一家销售额不足1亿日元的小企业，逐步发展到销售额100亿日元的中坚企业。如果这位经营者不知满足，一味追求个人利益，追求更加奢侈的生活，傲慢不逊，那么他终将走向灭亡。</p><p>看一看第二次世界大战以后日本的企业经营史，那些才华横溢的企业家们创建了公司，历经千辛万苦，好不容易构筑了出色的企业，最后却因为自身的变质，使企业走向衰亡，也玷污了自己的晚节，这样的事情</p><p>司空见惯。</p><p>这些企业经营者历尽辛酸、艰苦创业时，他们都加倍勤奋，质朴谦逊，但一旦功成名就，就开始无节制地追求金钱、名誉，骄傲自大，不久便走向没落。</p><p>人往往对自身的蜕变不易觉察。那些一攫千金的美国金融机构的高管们，最初也未必是贪得无厌之人，但因为缺乏明确的哲学，随着环境的改变，他们自己也堕落变质了。</p><p>必须竭力排斥自以为是、动不动就“我呀我”的利己的欲望，必须让为员工、为客户、为社会、愿他人好这种关爱之心、利他之心占据自己的心灵。</p><p>在这种美好、善良的心灵之上，加上拼命努力，那么，“要把企业做大”“要更好地拓展事业”这样的愿望不仅能够实现，而且能与员工、客户、交易对象、股东、企业所在社区等，即与企业的一切利益相关者协调和谐，企业就能持续繁荣，经久不衰。</p><p>对于这一点，我自己有切身的体验。我举KDDI的例子，这是一开头就讲到的、继京瓷公司之后我经营的另一家公司。</p><p>20世纪80年代中期之前，在日本电信市场上，国营通信企业电电公社一直处于垄断地位，通信费用与各国水准相比高得离谱。信息社会即将到来，而世界第一昂贵的通信费用是一大障碍，民众感到困扰，正当我为此担心时，政府的方针发生了变化，一方面要将电电公社民营化，另一方面允许有新的企业介入通信事业。</p><p>电电公社民营化后成为NTT，再有新企业介入，只要展开正当的竞争，通信费用一定会降低。我希望有优秀的企业早日报名参与。</p><p>但是，作为官办企业运行的NTT实在太强大了。其他企业全都按兵不动，毕竟与NTT对抗风险巨大，大家都裹足不前，不肯举手。</p><p>如果没有新企业介入，NTT垄断的体制就将继续，通信费用就不会下降。虽然对于通信事业，我几乎一无所知，但经过深思熟虑，我决定以京瓷公司为核心，创建第二电电，介入通信事业。</p><p>当时的京瓷公司，不过是销售额2500亿日元的地方性中坚企业，这样的企业居然表示要到首都东京去参与国家级规模的工程，有人讽刺我“不自量力”。但是我认为这样做是“为社会、为世人”所必需的，我欲罢不能，毅然报名参与。</p><p>其实，在我正式报名前的6个月里，每晚临睡前，我都反复地自问自答。</p><p>你创立第二电电公司、参与通信事业，你的动机是善的吗?其中没有夹杂私心吗?你不是想出风头吧?不是想赚钱吧?</p><p>这些问题再加进“动机至善、私心了无”这句话，我在长达6个月的时间里，不断严厉地逼问自己。回家时不管多么疲倦，即使宴会饮酒后回到家，一晚都不缺，我反复不断地扪心自问。</p><p>半年自问自答的结果，我最终认定:“我的动机纯粹，没有任何私心。日本即将迎来信息社会，要降低国民负担的通信费用，仅此一心而已。”这样，我才正式举手报名。</p><p>随后，紧跟京瓷公司，以当时的国铁为中心的日本TERECOM公司也举手参与。国铁本来就有铁路通信的组织，要建设长途通信干线，只要沿铁路干线一侧铺设光缆，很简单就能完成。</p><p>还有一家，以当时的建设厅和道路公团为中心的企业集团也报名参加。它们也只要顺着高速公路沿线铺设光缆，就可以很容易地完成长途通信的基础设施。他们打出“日本高速通信公司”的旗号。</p><p>与它们相比，第二电电没有任何基础设施。我们之所以举手，依凭的仅仅是纯粹的动机。第二电电不得已只能构筑无线通信网络，在一个接一个的山峰上架设抛物面天线，用无线中转来建设通信干线。</p><p>当其他两家公司分别沿铁路干线和高速公路铺设光缆的时候，我们第二电电的员工们饱含热泪、拼命工作，在没有道路的山顶上设置大型抛物面天线、构建通信网络。</p><p>当时的报章杂志大肆宣传“胜负已定”，他们预测第二电电很快就将败下阵来。但是，当通信服务揭开序幕，以前评价最低的第二电电成绩名列榜首。</p><p>其原因无非是，“为民众降低通信费用”这一设立公司的大义名分，不仅引起了干部、员工内心的共鸣，促使他们忘我工作;而且这种大义名分获得了客户、交易对象、代理店以及当时日本社会一致的认同和支持。</p><p>现在，当初的通信事业新准入企业中，只剩第二电电化身KDDI继续存在，销售额高达3.5万亿日元、利润高达4400亿日元，成为令人自豪的日本第二位的通信运营商。而且前途无量，兴旺发达，正在继续成长。</p><p>有完备的基础设施，有优秀的专业干部，还有充裕的资金，条件优越的大企业，连它们也觉得“太难”、犹豫不决而不敢贸然介入的事业，什么条件都不具备的京瓷公司，把“为社会、为世人”这种纯粹的动机提升到“信念”的高度，果断参与。而且许多人都认为“京瓷公司很快会失败”，在议论纷纷声中，京瓷公司获得了成功。我认为这个事实揭示了一个非常重要的“真理”。</p><p>这个真理就是，在纯粹、高尚的思想里蕴藏着巨大的力量。活跃在20世纪初期的英国哲学家詹姆斯·埃伦这样说:“心地肮脏的人因为害怕失败而不敢涉足的领域，心灵纯洁的人随意踏入就轻易获胜，这样的事例并不鲜见。原因是，心灵纯洁的人总是气定神闲，他们总是以更为明确、更强有力的目的意识，来引导自己能量发挥的方向。”</p><p>阅读詹姆斯·埃伦这段话，回顾第二电电创业至今的路程，我深深地感到，正是基于这种纯粹的思想，京瓷公司才会成功，才能持续地繁荣兴旺。</p><p>人、财、物各种经营资源齐备，被认为必定成功的企业消失了，而只把“为社会、为世人”这种纯粹的动机作为最大经营资源的第二电电幸存下来，在变幻莫测的通信领域，从创业开始经历四分之一个世纪，依然继续成长。我认为，这里就存在指引企业持续繁荣、最重要的“经营的真谛”。</p><p>其实，利他是最强有力的。让对方高兴，与人为善，这样的行为最终一定会带来成功。这是这个世界俨然存在的真理。为什么会产生这样的结果?因为利他的行为会让我们获得超越自己的伟大力量。</p><p>让对方生存、帮助对方、为对方好，如能具备这种美好的关爱之心、利他之心，一种超越自己的伟大力量就会自然地添加进来。自己想“如能这样该多好啊”，但结果却比你想象的更好。并且，它会赋予你了不起的智慧，帮助你克服无法预测的、突如其来的经济变动，好像成功从对面向你走来一样。</p><p>其实，这样的真理，中国的思想家们自古以来就教导过我们。《易经》里有句话叫“积善之家必有余庆”，就是说积德行善之家，世世代代都能获得幸福。另外，《尚书》上说“满招损，谦受益”，就是说骄傲的人会蒙受损失，谦虚的人将获得利益。</p><p>我认为，这样的教诲，决不是陈腐的所谓“故事格言”，而是昭示正确处世态度的“真理”，也是我们日常生活中必须遵循的“规范”，而且，这也正是引导企业走向成功并使成功长期持续的“哲学”。</p><p>希望这个会场在座的各位也要竭力排斥“只要自己好就行”的利己之心，在关爱心、慈悲心、利他心的基础之上努力奋斗，要让员工、客户、交易对象、社区，就是让企业周围所有的人获得幸福、过得富裕，抱着这样的信念去经营企业，勇往直前。</p><p>这样的经营就可以引导企业不断发展壮大。相反，忘记这些道理，企业经营者只顾满足自己的私利私欲，就必将招致员工的叛离，失去客户、交易对象的支持，还会受到社会的责难，结局就是企业遭到淘汰。</p><p>环境不以我们自己的主观愿望为转移，在企业今后的经营过程中，我们还会遭遇各式各样的经济变动。好像在狂风暴雨而又漆黑一团的大海中航行一样，环境极为严酷。不过，就是在这样险恶的环境中，我们经营者肩负着必须把好经营之舵、把企业引向正确道路的重大使命。</p><p>我认为，这时候，成为指南针的，就是站在企业经营第一线的经营者的哲学、思维方式。经营者不断提升自己的心性，用正确的哲学、正确的思维方式从事企业经营，就能够避免判断失误，将企业引上不断发展成长的光明大道。</p><p>从这个意义出发，我最早的著作就曾使用“提升心性，拓展经营”这一书名。这也是前面提到的“盛和塾”的信条。依据这一信条，现在有5000余名盛和塾塾生通过学习我的经营哲学，不断地提升企业的业绩。现在这些塾生企业的销售额合计，据说已达到24万亿日元。</p><p>齐聚于“中外管理官产学恳谈会”的中国有代表性的经营者们，我衷心祈望，你们在注意“慎重坚实经营”的同时，一定要努力“提升心性”，克服各种经济变动，不断“拓展经营”，成为增长中的中国经济的火车头。</p><p>今天，我从粗浅的经验出发，以“超越经济变动，实现企业持续发展”为题，讲了上面这些话。在座的各位担负着“经济大国”中国的未来，希望我的话能对大家有所启迪。我的演讲到此结束。</p><p>谢谢大家静听。</p>'
  },
  '2026-09-06': {
    chapter: '第8天：第三章 忍受萧条，伺机出手',
    content: '<p><strong>第三章忍受萧条，伺机出手</strong></p><p>佐藤吉哉:在空前的、百年一遇的金融风暴中，在世界性的经济萧条中，在这混沌的、前景难测的时代，企业家应该怎么办，应该如何带领员工走出困境?代表日本的哲人企业家、京瓷名誉会长稻盛和夫，与时任中国最大的网络集团企业总裁、阿里巴巴董事长兼CEO马云，就企业家应对危机应有的心态、以人为本的经营等本质性的话题展开了对话。</p><p>稻盛和夫:当下这场金融危机，我认为是自然或是神对人类的惩戒，他们要求人类进行猛烈的反省。“希望更加富裕、更加便利”人类的这种欲望推动了科学技术的发展，构筑了近代的文明社会。然而这种欲望的膨胀会带来什么结果呢?“月盈则亏”，这是天理。欲望过分膨胀，太满就会亏，这是天经地义的事。为了向人类证明这个真理，危机降临了。</p><p>今天的危机教育我们应该懂得“知足”，应该学会谦虚，当今的社会现象提醒我们，企业家在经营企业的过程中必须始终保持谦虚谨慎的态度。</p><p>马云:我与稻盛先生的想法不谋而合。从2007年开始我就有一种感觉:人很容易健忘。人们经历了1997-1998年的亚洲金融风暴、经历了2001一2002年的网络泡沫的破裂，但到了2007年这个时候，这样的教训人们已经遗忘殆尽。我周围许多人的话题尽是“钱赚了多少倍，投资股票获了多少利”等，我对这种反常的状况抱有强烈的危机感，我从去年年底就告诫我的员工“严冬就要来临”“要为过冬做好储备”。</p><p>稻盛和夫:马先生向全体员工发出一份电子邮件，题为“冬天的使命”。我有幸拜读了这篇文章。这篇文章不仅向员工们敲响了警钟，告诉大家“冬天要来了”，而且要求大家做好思想准备，并谈到了应对的方法，我认为非常了不起。</p><p>马云:人在本质上具备善、恶两个侧面，人总会追求灵魂的纯洁与善良，但恶的一面又会时时冒出。正如稻盛先生所言，自私的欲望使人疯狂。</p><p>今天的世界正直面空前巨大的、百年一遇的金融风暴，但是，越是面临危机，企业家越应该冷静，我认为这一点很重要，因为真正优秀的企业就应该将危机变成机会。我2008年44岁，有幸经历了这次百年一遇的危机，我想，与其说这是灾难，不如说作为经营者，我们获得了测试自身实力的一次难得的机会，对待危机应该有这样乐观的思考。经过往后几年的努力，度过了严酷的冬天，我相信阿里巴巴将会有更大的、飞跃性的发展。</p><p>关键在于平时的“储备”</p><p>稻盛和夫:凡是优秀的企业，都会把萧条看作再次成长的机会，把萧条当作一种考验，全体员工团结一致、共同奋斗。京瓷创办50年来，我就用这种思想经营企业。刚才讲到了“谦虚经营”。还有一点很关键，那就是“储备”，比如企业储备了多少现金。企业能够承受多长时间、多么严重的萧条的打击，在萧条中有无实力抓住新的机会，重要的就是看有无足够的“储备”。</p><p>然而，现代资本主义的中心、美国华尔街的先生们却不喜欢我的经营思想，因为我储备了大量的现金和存款。(笑)他们认为企业拥有大量的现金对股东而言并非好事，他们希望以钱生钱，让金钱更多地获利。他们看重ROE，就是相对于自有资金而言产生了多少利润。用这个指标来考核，就要减少现金存款、减少自有资本，以此提高股东的收益率。</p><p>但是，企业过于“瘦身”就无力承受危机，没有储备也无法抓住再发展的机会。要把萧条、把危机变成机会，就必须在平时不断增加储备，经营企业应该脚踏实地。</p><p>马云:同投资家打交道也不是我的强项。阿里巴巴自创业以来一直贯彻“客户第一、员工第二、股东第三”的经营原则。</p><p>作为企业家，我们必须看到客户和股东不注意的事物，看到别人看不见的东西。我平时经常考虑的是，有什么灾难可能降临，什么东西可能会击垮我们。</p><p>同时在经济景气时注重储备，在经济不好时进行投资，而要做到这一点确实需要有丰厚的现金储备。</p><p>中国有句话叫“阳光底下修屋顶”，就是说屋顶必须在晴天认真修好，等到下雨时再修就为时过晚了。</p><p>阿里巴巴的服务对象以中小企业为主，现在已拥有2000多万家法人客户。我们不仅自己要生存，还必须帮助中小企业生存发展，这是我工作的重心，也是作为企业家最大的乐趣。</p><p>佐藤吉哉:稻盛先生和马先生年龄之差犹如父子，成长的时代不同，文化背景不同，事业领域不同，但是他们超越了这种种差异，他们心灵相通，他们有许多共同点一-充满挫折的青年时代;赤手空拳开始创业;相较股东而言更重视客户与员工的利益;具有严格律己的谦虚精神;不是简单地模仿别人，而是将自身的经验和思考加以升华，从而创造出自己独特的经营哲学。他们二人心心相印。</p><p>稻盛和夫:我从制造、销售电子零部件起步，一开始就置身于所谓“实体经济”领域。另外，24年前，为了参与日本通信信息产业的变革，我创建了日本第二电电(即现在的KDD1)，在长途电话和手机两个领域都取得了成功。</p><p>然而对于电子商务领域，我虽然预测到它的发展前景，但因为缺乏知识，就没有这方面的缘分。而马先生利用互联网，在中国创建了从事电子商务的公司，并将它培育成最大的互联网企业，这说明马先生很有先</p><p>见之明，很了不起。</p><p>我经常看到这样的报道，在与IT相关的领域获得成功的许多年轻企业家，他们自以为是，目空一切，炫耀自己的成功。马先生与这些人完全不同，当我得知这一点时感到很欣慰。</p><p>马云:我虽然从事这项事业，但对于网络技术实际上我知道得很少，直到现在仍属于门外汉。我原是英语老师，1995年一个偶然的机会知道了互联网，开始涉足这个领域。</p><p>我完全不认为我已经成功了，我很害怕用“成功”这两个字。阿里巴巴创业才9年，与京瓷相比只能算刚刚起步，问题、课题一大堆，说成功有点不自量力。</p><p>同时互联网本身的历史还很短，如果一味发展技术，那么经营方向就不对，互联网之所以存在，是因为社会的需要。它必须为客户和整个社会创造价值。</p><p><strong>18位志同道合的伙伴</strong></p><p>稻盛和夫:企业如果没有社会价值就不能生存也不能发展，经营企业不能自以为是，而必须满足社会的需求。阿里巴巴获得社会的承认，取得巨大的成功，而马先生却不失谦虚之心，这很难得。</p><p>马云:创建公司时，我既没有技术又缺乏资金，也完全没有经营的经验，犹如盲人骑瞎马。一般的盲人都会从马上摔下来，我很幸运，没有摔下马，如此而已。</p><p>稻盛和夫:这是一种谦虚的说法。马先生把技术人员集结起来，成为创建阿里巴巴的中心人物。公司创建的缘由我很感兴趣，能否介绍一下。</p><p>马云:我虽不懂技术，但对互联网充满好奇心。我想互联网归根到底不过是一种工具，因此，有关应用技术的开发，我就委托网络工程师，而我自己站在客户的立场上试用他们开发的技术。</p><p>工程师一旦开发出新的技术，我立即试用。如果这种技术用起来简单方便，我就予以采用。相反，烦琐的技术立即丢进垃圾箱。如果像我这样的外行使用时尚能得心应手，那么中小企业客户至少八成也会采用。</p><p>稻盛和夫:与技术员一起创建阿里巴巴，最初采用什么形式呢?似乎并非马先生出资建立公司后再招集工程师，为什么这些技术员愿意聚集到马先生麾下来呢?</p><p>马云:最初我借款2000美元开始做生意，失败多于成功。1995年年初设立网络企业，又不成功;接着又去北京，与当时的外经贸部合作做项目也不顺利。</p><p>在这过程中我萌生了一个创意，就是通过网络向中小企业提供服务。此后就一直秉持这个理想，当时赞同我理想的包括我在内一共18个伙伴，大家共同创建了阿里巴巴。</p><p><strong>稻盛和夫:他们都是技术员吗?</strong></p><p>马云:18个人中技术员只有3名，而且水平也不高。</p><p>1999年2月21日这个日子至今难忘，在我并不宽敞的房间里，18个人聚在一起，就今后中国电子商务的发展方向、全世界电子商务的发展趋势，我滔滔不绝地讲了两小时。</p><p>18个人一律不向亲友借钱，就以自己口袋里的钱出资，一共5万美元。同时大家商定，各自准备好10个月的生活费，通过10个月的努力，如果一事无成，大家就散伙，各奔前程。</p><p>每月工资只付500元，不同意的人不要勉强，但如果赞同我的理念，大家就合伙干。当然，他们都能找到收入更高的工作，但大家对一个共同的理想产生了共鸣。</p><p><strong>成功不属于个人</strong></p><p>稻盛和夫:马先生描绘出使用网络开拓事业的理想蓝图，并抱着使命感，然后聚集对理想和使命产生共鸣的伙伴。一般情况下，聚集人才靠金钱，但马先生只付区区500元，而靠理想和使命把大家团结起来，这是</p><p>难能可贵的。</p><p>听马先生这么讲，我不禁想起创立京瓷时的情景。当时，我是一名公司职员，研究精密陶瓷，京瓷就由当时的8名同事一起创办。</p><p>没有资金，没有设备，什么也没有，有的只是我对精密陶瓷开发研究所倾注的热情。我满怀激情地向伙伴们诉说精密陶瓷将会对社会产生的影响，诉说我的理想和使命。当时的条件甚至无法保障大家的生活，但是这8个人对我的理想产生了共鸣，决定追随我。阿里巴巴同京瓷所处的时代不同，但创业的过程非常相似。</p><p>京瓷的成功不是靠我的才能，而是靠伙伴和社会的帮助，我觉得自己很幸运。</p><p>马云:我也觉得自己很幸运。我高中考过2次，大学考过3次，多次找工作却没有一家肯录用我。我的能力、学历、长相都不怎么样，从常识而言，我不该受到那么高的评价。</p><p>稻盛和夫:人的才能有差异，智力有差异，但人的本质都一样。佛教讲“山川草木，悉皆成佛”，森罗万象，一切事物都内藏佛性，而佛的本质都一样，只是外形差异，变成一个个不同的人。</p><p>我靠伙伴和社会的协助，使企业获得了成功，这样的幸事很自然就达成了。思考成功的原因，那不是我的力量。在人生这场戏剧中，我扮演了京瓷创业者的角色，只是作为一个角色演出而已，这是一种偶然，这个成功不属于我个人。</p><p>因为我有这个思想，所以我至今不失谦虚之心。创业半个世纪以来，遭遇种种困难:经济危机、日元升值、泡沫破裂等，尽管如此，我们却照样持续发展，我想原因就在于自己没有失却谦虚，或者说自己一直在追求谦虚。</p><p>一时成功的人而后没落，原因就在于他们“我呀我”的，自以为是，忘却了谦虚。我想马先生一定能够保持今日的谦虚，将企业经营得更加出色。</p><p>佐藤吉哉:如果语言中缺乏灵魂，那么不管多么美好的语言都无法打动人心。企业领导者必须时刻注意公司的健康状况，在面临危机时，全身全灵，与员工沟通并鼓励他们，将萧条变成再发展的动力。稻盛先生和马先生都这么强调。本次危机给了一种机会，促使中、日双方的企业家加强交流，加深相互理解。</p><p>稻盛和夫:语言这东西，是心中所悟，用大脑加以整理，然后通过声音传递。但是，仅仅将心中所感用头脑思索，再用声音传达，并不能说服他人，或给他人增添勇气。</p><p>日本古语中有“言灵”这个词，就是说必须将灵魂注入语言。</p><p>“自己认为非这样做不可”，讲这句话时必须抱着信念，在语言中注进自己的灵魂，这样才能发挥语言的威力。做不到这点，就无法震撼人心，人们就不受感动，也不会行动。我从年轻时起就一直按这条原则思考并行动。</p><p>我讨厌那些说话时轻飘飘的领导者。口才不好没关系，但话语中要灌注灵魂，特别是在当今严峻的经济形势中，领导者对自己所说的话必须充分负责，与人交流时要注入自己的灵魂和生命，这很重要。</p><p>马云:稻盛先生说得对。语言的本质不在于表面华丽的辞藻，“言为心声”，语言应表达心底的声音。</p><p>我认为不需要讲漂亮话，只要触及事情的本质就能打动员工的心。</p><p>因为我是教师出身，所以我把公司的成长看作同人的成长。随着年龄的增长，人的身体状况乃至行为方式都会发生变化。人有生病的时候，公司也一样，患上感冒就需要治疗。如果因病症轻微而忽视，病情就可能恶化，变成重症。经营者必须随时把握公司的健康状况和公司的心态。</p><p>我常对员工们讲“我是水泥”。水泥可以把许多东西凝聚在一起，是人，就让大家团结在一起;是物，凝聚后就可以变大。企业家必须不断加深对员工的理解，加强与员工的交流。</p><p>2007年年底，阿里巴巴经营形势喜人，股价上涨，有些年轻员工不免得意忘形。这时，我觉得有必要用语言来告诫员工，我说:“我预感某种坏事将会发生，让我们认真准备，有备无患。”</p><p>当然只讲一次，许多人听不进去，两次、三次反复地讲，随着员工们对现实情况的理解，他们就会用心倾听我的讲话。</p><p><strong>以人为本的经营</strong></p><p>稻盛和夫:我已退出经营一线，不再直接对员工们讲话。但过去经济不景气时我总是强调以下几点。</p><p>第一，形势确实不容乐观，但是我们绝不悲观。第二，团结一致。萧条降临，公司里会出现不协调的声音，因此萧条期要比平时更加强调团结。第三，大家一起动脑筋想办法，从点滴做起，努力削减费用，这是继续生存的绝对条件。第四，全员营销。人人都当推销员，争取订单，不光是老客户，还要敲开新客户的门。借着萧条在各个方面钻研创新，才能为企业的再次起飞创造条件。</p><p>如果我今天还是社长、会长，我还会对员工们讲同样的话。</p><p>为了帮助日本中小企业的经营者搞好经营，我创办了“盛和塾”这个企业家的学习型组织，现在已有5000多名企业家参加，在中国江苏省的无锡市等地也有企业家在组织学习活动。</p><p>我认为中国今后的发展也要依靠广大的中小企业。迄今为止，为了赚钱，各种各样的中小企业如雨后春笋般蓬勃兴起，但要想长期发展，要想保持繁荣，企业必须具备明确的、正确的经营哲学。在帮助中国的中小企业健康成长方面，我愿意助一臂之力。</p><p>马云:那就拜托您了。稻盛哲学以人为本的经营思想对中国广大的中小企业经营者很有参考意义。我认为企业成长可划分为三个阶段，首先是创业期，企业要生存下来，这是第一阶段。其次是成长期，这时要提高企业经营管理水平，树立明确的事业模式，这是第二阶段。然后是发展期，这时要充实技术和资金，实现飞跃性发展，这是第三阶段。</p><p>根据阿里巴巴的各个发展阶段，我自己也寻找不同的经营者作为榜样。1999年创业后，我向美国雅虎创始人杨致远、美国微软的比尔·盖茨以及美国IT行业的先驱们学习。当经营走上轨道，2002年之后，我又受到美国通用电气公司CEO杰克·韦尔奇经营思想的强烈影响。</p><p>到了今天，企业家最关心的问题是有关人本身的问题。人为什么活着?企业存在的意义何在?我们应该对社会做出怎样的贡献?我从稻盛经营哲学中学到了很多，进一步提高了我对人的本质的探求之心。</p><p>当前的金融风暴是中日两国企业家加强民间交流的机会。我认为中日之间的交流迄今为止还相当不足，而直面共同的困难，正是加强两国企业家之间相互理解、共同开拓未来的一个良机。</p><p>编者按:这是一次不需要主持人的对话。青年时代的挫折，创业的激情，尊重员工的经营，企业社会意义的探究，相同价值观的呼应。双方谈话十分投入，以至忘记了时间。</p><p>对于马先生的经营走到“重视人本身”这一点，稻盛答道“此乃必然”。“通过坐在桌前读书学习经营技术，这不过是一个小小的阶段。”面临世界性的金融风暴，美国式的经营价值受到了质疑，此时两位的对话会给人们许多启示。</p><p>稻盛先生在对话结束前，问马先生今年几岁。“比我女儿还年轻呢!”稻盛先生或许回想起自己30年前的情景。在面临金融风暴的社会氛围中，两人的对话带来一种清朗的感觉。</p>'
  },
  '2026-09-07': {
    chapter: '第9天：第四章 稻盛和夫论谦虚',
    content: '<p><strong>第四章 稻盛和夫论谦虚</strong></p><p><strong>必须经常保持谦虚的姿态</strong></p><p>据说随着社会的不断发展，持有“自我中心”价值观的人，即个人主义思想严重的人，会不断增多。但是，在“自我中心”价值观的人当中，只能产生“自我”与“自我”的冲突，需要团队间互相配合的工作就无法取得进展。</p><p>陶醉于自己的能力或微不足道的成功，骄傲自满，就得不到周围人的帮助，还会妨碍自己的成长。</p><p>为了形成团队合力，在和谐的气氛中有效地开展工作，必须意识到“有了大家才会有自己”，持续保持谦虚的态度，这是非常重要的。</p><p><strong>谦虚使人进步</strong></p><p>我一直强调“必须经常保持谦虚的态度”。谦虚才是学习上进的源泉。</p><p>中国古语中有“惟谦受福”的格言，意思是傲慢得不到好运和幸福，只有谦虚的人才会交上好运、获得幸福。</p><p>说到谦虚，也许有人会感到没有面子，但这种想法不正确。人，往往正因为没有内涵，才需要自吹自擂，借此来满足自己的表现欲。谦虚的人有时会被认为是傻瓜，其实觉得谦虚的人是傻瓜的人才是真正的傻A.</p><p>中小企业的经营者，如果稍微有点盈利就沾沾自喜，不知天高地厚，那么他们的企业就得不到进一步的发展。如果失去谦虚之心，傲慢起来，那么好不容易才提升了收益、获得了发展的公司，转眼间就可能会出现赤字，面临破产。所以，我希望在座的各位把保持谦虚的姿态铭记在心。</p><p>前文有述，企业经营者必须使团队团结一致，统一方向，始终保持心心相印的和谐气氛，才能最有效地开展工作。要养成这样良好的企业风气，领导者首先要保持谦虚的态度，只有领导者以身作则，下属才会跟着一起前进。</p><p>如果企业中的中层管理人员摆架子，高层领导者骄傲自满，那么团队配合就搞不好，形不成团队合力。职位越高的人越应该谦虚谨慎，深入群众，向大家传递企业的理想，努力营造良好的工作氛围。如果公司领导者和一线员工都有“谦虚的姿态”，那么就能营造出和谐的人际关系，在此基础之上，企业一定能发展壮大。</p><p><strong>人一旦傲慢必定灭亡</strong></p><p>顺着佛陀“知足”的思想去考虑，那么，可以意识到，现代文明到了今天这个地步，已经足矣，不再前进也无妨。有人会说:“不!还远远不够，我们希望更加富裕的生活。”我想对这些人说:“让我们更谦虚一些</p><p><strong>吧。’</strong></p><p>历史上凡是失却谦虚的文明，全部灭亡了。在这一点上，个人也一样。自古以来，中国人就有“惟谦受福”的说法。不管是帝王将相还是实业家，不管取得过怎样的丰功伟绩，一旦失却谦虚，傲慢起来，那就必然走向灭亡。</p><p>问题是，现在的人类不约而同一起傲慢起来，所以，回归谦虚，重新树立对自然的敬畏之心，非常重要。在此之上，必须建立人类共同的哲学，构建21世纪拯救人类的新哲学。然后希望全世界的领袖们汇聚一堂，集思广益，出谋划策，共同探讨人类的出路。</p><p>以古埃及文明为代表，古代的人类都对太阳抱着某种信仰，也就是对自然的一种敬畏之情。大家都抱有-种明确的思想，就是人类靠自然的恩惠才能生存。</p><p>然而到了近代，充满好奇心的人类发挥自身的智慧，推进了科学技术的发展。这个近代文明的发展，不以自然而以人类为主体，似乎发挥人类的智慧就可以随心所欲地利用自然。因此不断地改变自然、放肆地破坏自然，在此基础之上，构建了由高度的科学技术支撑的近代文明。</p><p>构建了对人类而言非常优秀、非常舒服的社会，科学技术的发展，让人类觉得自己的一切理想都能实现。宏观上讲，人类飞进了宇宙空间，微观而言，人类踏进了纳米世界，或者已经能够操控生物的DNA。</p><p>然而结果是人类生出了傲慢:</p><p><strong>“我们可以为所欲为!</strong></p><p>“只要让科学技术不断发展，我们将无所不能!</p><p>不错，是人类孕育了卓越的科技，但人类因此滋生了傲慢，现在的人类正在错误的道路上加速奔跑。我们不必提倡复古，但应该像古埃及人一样，感谢太阳的恩泽，对太阳抱有虔诚的信仰之心，回归到这样的思想。就是说，傲慢的人类，应该重新以敬畏之心应对自然，回归尊重自然的哲学。</p><p>现代人，也应该对自然的伟大力量抱持虔敬的态度，这样才能稍稍节制人类的傲慢。</p><p>人类的傲慢破坏了自然环境，带来了以地球变暖为象征的、深刻的环境危机。地球已处于危险状态，这次参加日本北海道洞爷湖八国峰会的首脑们都承认了这个事实，但谁也不肯承诺“自己率先垂范，为改善环境做出牺牲”。对危机的认识不断加深，但具体对策却向后拖延，会议就这样草草收场。</p><p>不论大国还是小国，不论先进国家还是发展中国家，当大家都在争取和维护自己的“利益”时，必然会发生冲突。极小、极小的领土归属问题，往往引发国际性的纷争。由开始时小小的火种导致大动干戈。在核扩散难以遏制的今天，还可能诱发核战争。为了防止此类悲剧的发生，我们都必须恢复谦虚的态度。</p><p>在这个小小的地球上，如果各国一味强调自己国家的利益，人类将无法生存下去。抱着“利他之心”，考虑全体人类的利益，国际社会必须建立起能够持续和平繁荣的邻居式的友好关系。</p><p>在自然界，在这个狭小的地球上，动植物都在友好地共生共存，人类要向自然界学习，回归谦虚，再次感谢自然的恩惠，不是我们在自然中“活着”，而是自然“让我们活着”，意识到这一点，我们就应该重新回归谦虚和虔敬。</p><p>谦虚是日本人失却的美德之一。颔首低头以示恭敬，功劳让与别人，得意时不忘形，互相礼让，秉持一颗审慎谦卑之心。</p><p>人生在世，有时需要强调自我，坚持自己的主张。但是谦虚这个有代表性的美德渐渐被我们遗忘，却不能不说是日本社会莫大的损失。住在这个国家里不再感到愉悦，失却谦虚礼让是原因之一，这决不是我一个人的想法。</p><p>确实，对凡人而言，要始终保持谦虚决不是容易的事。我这么强调谦虚，但骄傲自大之心有时仍然让我有些趾高气扬。</p><p>在精密陶瓷这个未曾开拓的领域，我开发了很多新技术和新产品，京瓷以惊人的速度成长发展。同样，KDDI的发展也令人惊叹。周围的人异口同声称赞我，甚至吹捧我。聚会时奉我为上宾，让我坐上席，要我致辞介绍经验，这些似乎天经地义。</p><p>虽然我不断自我告诫要虚心，但久而久之，有时仍不免自我陶醉，在心底一角冒出自满情绪。我那样拼死努力，业绩如此辉煌夺目，接受这样的礼遇不是理所当然的吗?</p><p>偶尔会这样志得意满，但某种境况下我又会猛然醒悟:“不行不行!自满情绪要不得。”立即检点反省自</p><p>己。</p><p>即便已经皈依佛门，直到今天，我仍会有这种心理上的反复。</p><p>仔细想来，我所具备的能力，我所发挥的作用，并没有非我不可的必然性。别人拥有同样的才能，扮演与我相同的角色，也没有任何不妥当，没有任何不可思议之处。至今我所做的一切，别人也可以取而代之。</p><p>所有这一切，都是上天偶尔赏赐给我的，我不过努力加以磨炼而已。我想，任何人的任何才能都是天授的，不!才能只是从上天借来之物。</p><p>因此，杰出的才能，由这才能创造的成果，属于我却不归我所有。才能和功劳不应由个人独占，而应该用来为世人、为社会谋利。也就是说，自己的才能用来为“公”是第一义，用来为“私”是第二义。我认为，这就是谦虚这一美德的本质所在。</p><p>然而，随着谦虚精神日趋淡薄，把才能私有化的人有增无减，特别是身居要职，理应成为众人楷模的领导者，这一倾向尤为明显。曾经具备优秀传统、出色业绩的大企业，原有的组织规范、伦理道德已经废弛，以致违规违法的丑闻层出不穷。还有那些受国民委托管理公共行政、薪金来自民脂民膏的官僚，利用特权中饱私囊者也不在少数。</p><p>大企业的领导、干部和官僚，他们的能力无不高人一等，为什么他们常常丑闻缠身、贪污渎职呢?因为他们把才能据为己有。他们认为才能纯属私有，而非从上天借来之物，不必用之于公，心安理得地把才能用于满足自己的私利私欲。</p><p>我年轻时日本人民生活还很贫困，当时我认为人生在世最重要的，而且我努力去做的是“诚实”二字。</p><p>对人生、对工作，我尽可能做到诚实。不马虎，不偷懒，拼命地工作，认真地生活。我认为，这对经历过贫苦时代的日本人来说并不稀奇，这是融入当时日本人血肉的一项特征，也是一种美德。</p><p>不久，日本经济起飞，社会变得富足、安定，京瓷的经营也上了轨道，规模扩大。这时“感谢”在我心中占的分量越来越大。诚实的努力带来了丰厚的回报，此时，“感谢”之情在我的心中油然而生。这种体验反复多次以后，“感谢之心”在我身上成形，成为我生活中始终贯彻的道德准则之一。</p><p>回顾自己，“感谢之心”就像地下水一样，滋润着我道德观的根基。而这与我在幼年时的体验深切相关。</p><p>我的老家在鹿儿岛，我四五岁时，父亲带我去参与“隐蔽念佛”。所谓“隐蔽念佛”，可远溯至德川时期，“一向宗”受到萨摩藩的打压时，那些虔诚的佛教徒把宗教仪式偷偷地保存了下来。在我年幼时，他们还保留着这种信仰方式。</p><p>和几对父子一起，在日落后漆黑的山路上，我借着灯笼的亮光，一步一步攀登。大家默默无语，在恐怖和神秘气氛的笼罩下，幼小的我也拼命地、紧紧地跟在父亲身后。</p><p>登山的终点是一户人家，进去一看，佛龛里摆放着气派的佛坛。身穿袈裟的僧人在前面诵经。屋内零星点着几支小蜡烛，光线十分暗淡，我们各自坐下，融入那昏暗之中。</p><p>孩子们端坐在僧人身后，静听着低沉的诵经声。诵经结束，孩子们按指示一个接一个向佛坛献香拜谒，我也照着做了一遍。</p><p>这时僧人会对孩子简单地说几句话，有的孩子被要求再来，而我听到的却是:“你已经行了(不要再来了)，今天拜过就好了。”</p><p>接着，那僧人又说:“从今以后，你每天都要说‘南曼、南曼，谢谢!’向佛表示感谢。活着的时候，只要这么做就可以了。”然后他转向父亲说:“这孩子以后不用再带来了。”这句话好像给我的人生下了一个保证。</p><p>记得当时幼小的我，好像通过了什么考试，又像得到了师父的真传，又自豪又高兴。</p><p>这是我最早的宗教体验，印象深刻。我想，当时我学到了感谢的重要性，这种意识塑造了我心灵的原型。实际上一直到现在，只要有什么事，“南曼、南曼，谢谢!”这句话在无意识中就会脱口而出，在我耳边回荡。</p><p>我拜访欧洲的教堂，为教堂庄严肃穆的气氛所感动，那时的我也会情不自禁地念诵这句话。这句“祈祷”的话语，已经超越宗教、宗派，融入我的血肉，已经成为渗入我内心深处的“心灵的口头禅”。</p>'
  },
  '2026-09-08': {
    chapter: '第10天：第五章 塾生心得 · 改心之道（上）',
    content: '<p><strong>第五章 盛和塾塾生心得</strong></p><p><strong>改心之道</strong></p><p>大家好。我是日本盛和塾塾生代表加藤胜。[1</p><p>首先，恭喜“稻盛和夫(北京)管理顾问有限公司”成立。同时，向为公司成立而尽心尽力的曹董事长以及其他相关人士表示祝贺;另外，今天，能够邀请稻盛塾长参加公司成立演讲会，我感到十分荣幸，并再次表达深深的祝贺。</p><p>明天，稻盛塾长本人将亲自为大家作现场演讲。我相信以“爱意、真诚以及和谐”的精神来贯彻的“稻盛哲学”，不仅可以超越国籍、人种，甚至可以超越时代，并给人类社会带来和平与繁荣。“稻盛哲学”跨越中日两国的国门，在此能和大家一同学习，互相切磋，我感到无比的喜悦。</p><p>我发言的题目是:改心之道一-盛和塾学习心得。</p><p>我成立公司时，最初的经营目的很明确，就是“赚钱”“成为有钱人”。公司是自己赚钱的场所，员工就是为公司赚钱的工具。加入盛和塾后，我清楚地意识到我的这种想法是错误的，从此，我的人生发生了180度的转变，一直自私自利的我开始“走向了改心之道”。在此，我想回顾一下35年来，我作为经营者的经历。</p><p><strong>经历</strong></p><p>首先，我想从我的经历开始说起。</p><p>1950年，出生于日本爱知县，是一个农民家庭的长子</p><p><strong>1976年，开始创业</strong></p><p><strong>1982年，成立房地产公司</strong></p><p><strong>1996年，加入盛和塾</strong></p><p>1998年，成立Heartland公司</p><p>我出生在爱知县的一个农民家庭，是家里的长子。按当时农村的惯例，农民家庭的长子生下来就要子承父业当农民。</p><p>在我们加藤家族中从来没有人经商。我之所以违背传统要经商有两条理由。</p><p>第一条理由是，在我17岁时，父亲过世了，年仅41岁。父亲刚过世就闹出了金钱风波。病中的父亲曾向亲戚们借过生活费，这使我们与亲戚之间产生了纠纷。</p><p>年少的我就认为“世上有钱人就是强者”“成为有钱人才能让大家看得起”。</p><p>第二个理由是，我在14岁和16岁的时候，因患有与父亲同样的病，而长期住院。所以，我模糊地认为自己会与父亲一样在40岁左右就会死去，当时心想，反正生命有限，那就“下定决心赚钱”，而且“必须尽早起步”</p><p>父亲是一个积极向上，并且有许多梦想的人。如果不是在41岁就过世，我想父亲还能做很多自己想做的事。为此，我感到非常遗憾，为了弥补心中的遗憾，父亲未完成的梦想，我想替他继续完成。父亲虽已离开了我们，但他会永远活在我的心中，今后我要与心中的父亲一起完成我的人生。</p><p>昨天我迎来了自己的60岁生日，尽管已进入花甲之年，但我仍然精力充沛。今天，能在如此盛大的场合发言，我想那一定是父亲赐予的生命力量。</p><p><strong>创业</strong></p><p>我25岁开始创业，公司主要从事房屋销售与施工。</p><p>中学毕业后，我在一家酒店打工，并且住在那里，正因如此，我有了经商的念头，我在频繁更换工作的过程中结束了青春叛逆期。我在叛逆期经常说的一句话就是“我只在乎现在”。</p><p>21岁时，我进入房地产开发公司销售部门工作，这份工作几乎不需要学历和经验，只注重实际销售业绩，我认为这份工作非常适合我，简直是上天赐予我的最理想的工作。从那时起，我一直从事与房地产有关的工作。</p><p>在公司工作的3年里，我的业绩一直名列前茅，公司奖金制度是按个人业绩来考核的，这对我来说有很大的吸引力。在销售方面我有绝对的自信。之后，我下定决心:“好!我自己干。”在房地产公司工作期间，经过再三请求，我从顾客那里借来50万日元作为创业资金，白手起家，开始了我人生的第一次创业。</p><p>创业之初，公司员工由工作期间认识的3位男性朋友和我的妻子组成，加上我一共5人。可是，公司没多久就倒闭了。仅仅在三四个月内员工就接连辞职，不到一年的时间，全体员工都辞职了。</p><p>之后，接连几天我都夜不能寐，公司因破产负债，即便当时我卷席而逃也不会有人感到奇怪，在那最困难的时期里，我和妻子二人节衣缩食，坚持了下来。</p><p>6年后，也就是1976年，我成立了富士开发株式会社。首次创业的痛苦经历，使我在员工雇用方面一直抱有恐惧感，尽管如此，公司到1986年时，已发展到员工10名左右，销售额也从最初的7亿日元提升到10亿日元o</p><p>虽说销售额在提升，但是，我与员工之间的关系却不是很和谐。那是因为我只把员工当成赚钱的工具。当然，公司员工也很清楚这一点，员工们的想法也是一样，如果有好的工作环境也会马上辞职离开，公司当时的状况就是如此，但仔细想想，我做员工的时候，如果有工资更高的地方，我也会二话不说马上辞职。</p><p><strong>入塾</strong></p><p>我于1996年正式加入盛和塾。</p><p>之所以加入盛和塾，是因为从塾生前辈那里得到了《经营十二条》的演讲录音带和《提高心性，拓展经营》一书。</p><p>文中阐释了“付出不亚于任何人的努力”“渗透到潜意识的强烈的愿望”等理念，这些理念体现了作为一名经营者应该具有强烈的愿望和正确的思维方式。</p><p>读完后，我感到很惊讶，这世上竟然有如此“了不起的人物”，原来经营也有如此高深的学问。作为一名企业经营者，我应该从中学习经营者的正确思维方式和生活态度。我生平第一次开始学习有关经营与经营者人生的哲学。</p><p>此后，我开始追随塾长，想缩短与塾长之间的距离。</p><p>就在我努力靠近塾长哲学理念的过程中，一直自私自利的我随着对哲学理念的深入学习，我的内心深处也发生了变化。塾长每次热情洋溢的讲话，以及讲话时的每一个举动，我都很怕错过，每次都目不转睛、认真地聆听。另外，在每次塾长例会上，塾生前辈们一丝不苟、竭尽全力的态度也深深地感染了我。</p><p>加入盛和塾后，最初学习的就是“经营十二条”中的第一条，“明确事业的目的与意义”。</p><p>于是，我把公司经营理念定为:在追求全体员工物质和精神两方面幸福的同时，为人类社会的进步和发展做出贡献。并且，根据塾长的讲话，制定了30条“公司哲学”。此外，我还把公司基本方针和社训定为“提高心性，拓展经营”。</p><p>之前一直把赚钱放在人生第一位的我，整整用了半年的时间，才真正有所感悟。</p><p><strong>改心之道四部曲</strong></p><p><strong>改革</strong></p><p>可以说这是向“改心之道”迈出了第一步。公司经营理念明确后，公司状况与稻盛理念的差距马上就呈现出来。时不我待，我必须立刻着手制定方案，以求缩短差距。于是，我在公司内部开始谈论哲学，并对工资制度等多项制度提出若干个改革方案。</p><p>首先，公司要改革的就是工资制度。公司原有工资制度是绩效考核制度，是从之前工作过的房地产公司直接引入的，绩效考核制度是根据个人实际业绩，每月支付相应的奖金。业绩好的员工，最多能给到基本工资的2~3倍，业绩不好的员工只能拿到基本工资，勉强糊口。</p><p>新制度是把绩效考核替换成以固定工资为主，更多考虑年龄、工龄要素的所谓“年功序列”的工资体系。</p><p>另外，把以往偷学前辈技术、个人单打独斗的组织结构形式，替换成业绩好的员工对业绩差的员工进行一对一的指导培训形式，构筑师徒般的组织结构。</p><p>我坚信按照经营理念进行的这项改革，一定能够让全体员工得到幸福，可是，这样做却遭到业绩好的员工们的强烈抵制。业绩好的员工们认为:“我们之所以加入这个公司，是为了赚钱，而不是为了去指导、培训别人。”</p><p>还有人认为，如果经过培训出现业绩好的员工，那就会成为自己的竞争对手，自己反而会少赚钱。富士开发公司当时的情况就是这样。</p><p>结果不到一年，公司就有一半的员工相继辞职，销售额也从10亿日元下降到5亿日元。之所以有这样的结果，完全是因为我的不成熟和自以为是的性格造成的。</p><p>公司经营形势十分严峻，这时我又考虑成立一个按照顾客订单来建造房屋的房地产开发公司。</p><p>在一次塾长例会上，我向塾长提出这样一个问题:“公司经营状况不是很好，我想成立一个新公司，您认为如何?”塾长用强硬的口吻说:“怎么?不想专注于本行了吗?一般都是自己本行经营上了轨道之后才开展新事业，你这样轻率、随便怎么行呢?”塾长的教导让我的心情十分沉重。</p><p>被严厉批评后，在一次塾生旅游活动中，我再一次鼓起勇气向塾长提了问题:“塾长，我想在公司内部试行经营理念和哲学，不知您能否给予指导?”说完后，我把拟定好的公司理念和哲学小册子递给了塾长。</p><p>塾长接过后说:“小册子先放我这里保管一晚。”我以为塾长大概看一下就会马上还给我，没想到他竟然要带回去看，此举让我十分感动。</p><p>第二天，塾长把做了修改的小册子还给我，对我说:“按照这个努力去做吧。”塾长在小册子中补充道:要做对社会有益的工作，要让公司成为员工心情愉快的公司。”塾长的话让我很感动，同时也让我鼓起了勇</p><p><strong>·重生</strong></p><p>后来，我成立了一家新公司。在考虑新公司名字的时候，我想把塾长经常教诲的“利他之心”“慈悲之心”反映在公司名字中，于是，我想起名为“有爱就好”。</p><p>说起来是笑话，当时，与他人谈公司的这个名字时，有人忠告说:“这个名字感觉好像是红灯区夜店用的。”经过深思熟虑后，我最终将新公司定名为“Heartland”。</p><p>这个名字包含“有爱就好”这层意思，另一层意思是立志成为一个为社会为世人做贡献的企业，包含“公司要成为全体员工、客户、交易对象心灵可以托付的场所”。</p><p>Heartland公司于1998年4月成立，注册资金5000万日元。营业内容为按照顾客的要求建造普通住宅和木造住宅。</p><p>1998年5月总店正式开张，现已发展有6个分店。</p><p>Heartland公司从创立第一天开始，我就运用在盛和塾学到的稻盛哲学。</p><p>公司的基本目的就是要成为“稻盛经营哲学实践之地”，为此全面提出并制定了经营理念、公司方针、社训及Heartland哲学，公开标榜我们是一个以正确的理念来运行的公司。</p><p>公司刚刚成立时，员工人数只有2名，现已有41名。</p><p>回顾入塾时学到的“经营十二条”中“要以关爱和坦诚之心待人”。</p><p>这一条就是最重要的“改心”，从这里改变自己的基本想法。</p>'
  },
  '2026-09-09': {
    chapter: '第11天：第五章 塾生心得 · 改心之道（下）与稻盛和夫点评',
    content: '<p>塾长的“以关爱之心对待员工”这一理念，逐步在我的头脑里扎根，由此我的思维方式和行为都有了明显的改变。</p><p>比如，未加入盛和塾之前，如果员工迟到，我会训斥说:“什么?只是身体不舒服，就可以怠慢工作吗?”但加入盛和塾后，我会发自内心关切地问:“身体不要紧吧?是否需要帮助?”</p><p>我认为“是否关爱员工”“是否真心诚意地对待员工”要发自内心，而不是做表面功夫，我已能做到真心诚意地对待员工，与此同时，我所制定的哲学理念也得到了全体员工的认可。并且，我们在公司内部已经构筑起了家庭成员般的人际关系。</p><p>以关爱之心待人，这不仅使员工幸福，也使我自己的心灵受到洗礼，变得美好。美好的心灵之间产生共鸣，产生悦耳的和声，唤起更多的连锁反应。从公司气氛的变化，我看到了这一点。</p><p>加入盛和塾前，我经常与顾客和交易伙伴发生纠纷，甚至经常打官司。但是，自从以“利他之心”为基础经营企业，公司在经营中出现的纠纷都能迎刃而解。“利他之心”所隐藏的巨大力量，不经过亲身体验是无法想象的。同样，“关爱之心”也让我收获了难得的“副产品”。</p><p>入塾前，我与妻子的关系很不好，随时都有离婚的可能。主要原因在我身上。经营失败让我感到非常孤独，所以，我对妻子的态度近乎冷漠无情。而我的妻子毫无怨言，只是一味地忍耐，可我却一直都没有发觉。塾长教导我们要有“慈悲之心”“把别人的烦恼视为自己的烦恼”，我从这些话中得到启示，从此，与妻子的关系也变得越来越融洽。回头看看，“关爱之心”的惊人力量，也是通过亲身体验才能真正体会到的。</p><p>接下来需要“改心”的就是“玻璃般透明的经营”。入塾前，公司内部财务数据是不向员工公开的，是有意隐瞒的，理由是，员工知道公司利润，担心出现员工要求“涨工资”“加奖金”等情况。另外，我想:“反正这些员工在公司经营好的时候乐意跟着我干，一旦经营不好，就一定会毫不留情地离我而去。最后只剩我一个人，因向银行贷款时以房产担保而面临偿还债务、妻离子散的窘境，世上这样的故事不胜枚举。”</p><p>入塾后，我把“员工的幸福”作为经营目的，坚定了信念。为了实现经营理念，经营者和员工必须结成伙伴关系。我意识到，无论好坏，把公司的真实情况和盘托出是建立彼此信赖关系的第一步。</p><p>我把每个月的账目结算委托给会计事务所，从此，实行“玻璃般透明的经营”。如此一来，我精神上得到了放松，公司也没有秘密可言，大家的心情也变得很愉快。我能真切地感受到，职场氛围也发生了巨大变化。</p><p>2004年，通过京瓷公司的指导，我引进了阿米巴经营。</p><p>引入阿米巴经营后，公司的情况变得更好了。通过阿米巴经营会议，阿米巴领导者的水平迅速提高。公司任命二十几岁的员工为阿米巴领导者，他们成为部门经营者后，都非常认真地实行预算与实绩管理，非常热心地参与企业的经营。</p><p>达到目标时，大家都很高兴，未达到目标时，大家都会共同反思原因何在，以及今后应该采取怎样的措施等，所有人都极度认真。员工们极度认真的工作态度非常了不起，我觉得每个员工都非常可靠，值得信</p><p>任。</p><p><strong>新目标</strong></p><p>Heartland公司的经营状况是，在1999年第一期结算时，销售额为1.63亿日元，有1200万日元的赤字;</p><p>第二期结算时，销售额为5.63亿日元，营业利润为6200万日元;</p><p>到第八期结算时，销售额上升为16.01亿日元，营业利润也上升为2.1亿日元;</p><p>本期销售额又有了新的提高，上升为20.94亿日元，纯利润为2.742亿日元。</p><p>2007年，我非常荣幸地获得了“稻盛经营者奖”。之所以获奖，我认为是全体员工共同努力的结果。于是，我把股份无偿转让给了公司员工，并发起员工持股大会。公司注册资金增至9500万日元，公司无贷款，内部储备金也超过了5亿日元。</p><p>这些都是因为我加入了盛和塾，走向“改心之道”而得来的。</p><p>制定公司新目标时，我也受到了塾长的启发，在向塾长报告营业利润率已提升了10%以上的时候，塾长说:“是吗，那不错，付出了很大的努力。”然后又问:“现在销售额是多少?</p><p>我回答说:“16亿。<br>塾长接下来又说:“是吗，那要继续努力，好好干!”</p><p>其实，我也听到过塾长的另一种意见:“你的经营规模不过如此，现在的努力还远远不够。”我立即把这个意见转达给员工听。</p><p>半年后，2007年4月，我与全体员工共同宣誓:“在本年度实现销售额100亿日元，营业利润10亿日元。”同时，制订了年度经营计划，并在2009年4月设立了不动产事业部，开始实施“销售额100亿日元、营业利润10亿日元”的计划。</p><p>公司目前正在努力实现这一目标，为了让每一名员工都能放心地将自己的未来托付于公司，全体员工正在努力奋斗，使公司成为一个优秀的、强大的公司。</p><p><strong>感谢</strong></p><p>通过这样的“改心”体验，我深刻地感悟到“经营十二条”的博大精深，是稻盛经营哲学的精髓。</p><p>我对“经营十二条”逐一研究，希望能与塾长的思想更加接近。</p><p>我坚信，只要与全体员工团结一致，认真、忠实地实践“经营十二条”，就能实现我们公司的经营理念。</p><p>从入塾当初的梦想到引入“阿米巴经营”模式，再到获得“稻盛经营者奖”，如今，我获得了超乎想象的荣誉和幸福。</p><p>没有塾长就没有今天的我，就没有与优秀员工一起工作的机会;如果这个世界上没有稻盛塾长的存在，没有塾长创办的盛和塾，那么....每当想到这些我就会因害怕而全身颤抖。现在我可以断言，经营哲学这一强有力的纽带一定能把全体员工团结在一起。有这样的员工是最值得我自豪的事情。</p><p>此次发言很荣幸地得到塾长的点评。请中国各位嘉宾及日本盛和塾塾生们静听塾长点评。</p><p>能够得到塾长的精彩点评，使我现在很激动，也很感动。</p><p>我的文化水平不高，只是一名普普通通的农民，今天能有机会在这样大的“磁场”里发表塾长所教导的“改心”，我真的很感激。</p><p>最后，请允许我为稻盛和夫(北京)管理顾问有限公司的发展，为稻盛塾长的健康长寿，为人类社会的和平、繁荣祈祷。</p><p><strong>稻盛和夫点评</strong></p><p><strong>玻璃般透明的经营</strong></p><p>我由衷感到，办盛和塾真好。</p><p><strong>集所有责任于一身的中小企业经营者</strong></p><p>加藤先生17岁时，41岁的父亲去世了。因为患过与父亲同样的病，加藤先生怀疑自己也活不长。经济贫困，让加藤先生在孩童时代就萌生了非赚钱不可的念头，后来到一家房地产公司做销售，个人业绩出色，信心大增，之后就进入了房地产行业。</p><p>说起来可能不太合适，一心想赚钱而创建公司的人，其中一大半，他们经营企业的目的仅仅就是赚</p><p>钱。</p><p>但是，加藤先生接触到了我的经营思想后，就“改心”了，决定尝试“玻璃般透明的经营”。入塾前，公司的经营数字不让员工知道，甚至是刻意隐瞒的。这样做的原因，加藤先生是这么说的:</p><p>一旦员工知道利润后，就会要求涨工资，要求多发奖金。一想到这些，我就感到恐惧。这些员工，公司经营顺畅时，都高高兴兴地跟着我;公司经营稍有不畅，他们就一溜烟地全跑了。剩下我一个人，担着债务连带担保的责任，弄不好还会妻离子散。</p><p>这几句话道出了中小企业经营者共同的心声。出于这种切实的危机感，所以隐瞒利润，不让员工知道，这是中小企业经营者一般都有的心理。</p><p>我自己年轻时经营企业，也经常抱有恐惧感，担心公司说不定什么时候就会倒闭。</p><p>一天晚上，很晚回到家，我把还在上小学的3个女儿叫起，告诉他们，如果公司破产，房子和家里所有的东西都会被拿走，剩下的只有饭碗和筷子。我想让她们理解公司经营是多么险峻。</p><p>过了一些年后，女儿们抱怨说:“爸爸好过分。当时我们还小，你对我们说，公司破产的话，就要倾家荡产，还专门挑夜里说，吓得我们都睡不着觉。</p><p>正如加藤先生说的，所有的责任必须自己一肩挑，这就是中小企业经营者的宿命。</p><p>因为有过这种想法，有过失败的教训，原本只想赚钱的加藤先生改变了内心，依据“经营十二条”，制定了企业经营的哲学，并彻底贯彻玻璃般透明的经营原则。</p><p>这样做以后，不仅自己的心情变好了，而且员工们都追随自己，公司里的工作氛围也焕然一新。自己的心变了，连公司的经营氛围都跟着变了。</p><p><strong>要拼命传递经营真谛</strong></p><p>加藤先生说，因为在盛和塾向我学习经营而彻底改变了自己，所以发自肺腑地对我表示感谢。听了这番话，我高兴得流下了眼泪。昨天晚上恳亲会结束后，回到房间，我的心情久久无法平静。</p><p>1980年，京都青年会议所的经营者对我说:“京瓷发展得这么好，请您教教我们，究竟应该怎么做，公司才能顺利发展?”，3年后，盛和塾的前身--盛友塾成立了。</p><p>当时京瓷的销售额大约只有1000亿日元，现在已经增长到了13000亿日元。我一边经营京瓷，一边抽空给塾生们讲解经营企业的方法。</p><p>就是说，我相信，塾生们的公司经营出色，不仅可以让公司的员工幸福，而且对日本社会也很有价值。所以我在经营企业的同时，把自己积累的经营真谛与大家分享。这就是盛和塾走过的25年历史。</p><p>不仅是京瓷的经营，我还出力创办了第二电电，即现在的KDDI，销售额已经超过了30000亿日元。我还成立了稻盛财团，第二十四届京都奖颁奖大会也顺利举办了。</p><p>我把从经营过程中学到的经营真谛，即企业经营应该怎么做，教给大家，希望大家的企业都能变好。</p><p>昨天晚上，我仔细回顾了这些年做的这些事。</p><p>加藤先生说，没有塾长，就没有自己的今天，就没有与优秀员工共事的机会。听了这话，我从心底里坚定了决心，为了让大家的公司变得更好，我就是拼上性命，也要把这项工作坚持下去。</p><p>加藤先生虽然只有初中学历，却能用精彩的语言把哲学和阿米巴经营讲给员工听，并且公司也越做越好。听到这些，我由衷高兴，我深切地感觉到，办盛和塾真好。</p><p>谢谢。</p>'
  },
  '2026-09-10': {
    chapter: '第12天：稻盛哲学根本 · 正确指导人们一切言行的根本思想（上）',
    content: '<p><strong>正确指导人们一切言行的根本思想</strong></p><p>21世纪初，由松下幸之助先生创立的PHP[2]研究所负责人江口克彦先生向稻盛和夫先生发出请求:“当迎来新世纪之际，面对越发混迷的社会，你的思想应该作为哲学问世。”[3]</p><p>据说稻盛先生独自在宾馆静思默想了一星期，才构思了这本重要的著作。</p><p>出版社希望我重新翻译这本书。这本书的日文原著以《心法:稻盛和夫的哲学》命名，顾名思义就是稻盛哲学的代表作。在多次阅读原著并将原著和现有译本反复对照之后，我觉得对本书有重新翻译的必要。</p><p>科技进步、经济发展与人的精神道德的衰退，这是当今世界的一个尖锐而深刻的矛盾。这个矛盾不仅使人和人之间、集团和集团之间、国家与国家之间纷争不断，而且使人类失去了对自然的敬畏，人类在破坏自然的同时也破坏了人性。</p><p>在本书的序言中，稻盛先生自称是哲学的门外汉。</p><p>我曾经认真阅读过几本古今东西的哲学名著，却是似懂非懂，因而不免质疑自己的智商，自惭形秽。但稻盛哲学给我的感觉完全不同，这种哲学不仅通俗易懂，而且可以付诸实践。这种哲学不仅催人奋进，而且它是指引个人、组织、社会乃至人类朝着善的、美好的方向前进的哲学。稻盛先生虽然出身是科学家，出名是企业家，但他本质上是一位哲学家，而且是一位彻底追求正确思考和正确行动的哲学家。</p><p>“人只为己，天诛地灭”。</p><p>我认为，稻盛先生“敬天爱人”的利他哲学才是正确指导人们一切言行的根本思想，才是企业乃至人类避免衰亡的正确的哲学。</p><p>新的论据是稻盛重建日航的卓越成功。</p><p>2010年2月1日，航空业的门外汉、78岁的稻盛和夫应日本政府的再三要求，出任破产重建的日本航空公司的会长，仅仅一年，日航就创造了其60年历史上最高的1884亿日元的利润(按当时的汇率约合140亿元人民币，是日航历史纪录的两倍)，这个利润在当年全世界727家航空公司中独占鳌头、遥遥领先。</p><p>第二年，即2011年3月11日，日本东北地区发生9级大地震，伴随大海啸，造成了可怕的福岛核辐射事件，一时风声鹤唳，外国客人不去日本，日本国内的旅游活动也一时停滞。就在这堪称国难的“三重灾难”的阴影中，日航却逆流勇进，这一年的销售额虽然有所减少，但利润是惊人的2045亿日元，利润率是17%，是当年全世界航空业平均利润率的17倍，这又创造了新的历史纪录。</p><p>不仅如此，2012年9月19日，日航在宣布破产后仅仅2年7个月就重新上市，又创造了一项新纪录。日本从20世纪60年代以来，有138家上市企业破产重建，重建成功的只有9家，平均花费15年，最短的也花了9年。</p><p>另外，日航破产时，日本政府注入资金3500亿日元，但上市后回收了6900亿日元，这又是一个新的纪</p><p>录。<br>还有，日航的准点率连续三年世界第一。</p><p>日航短时期内起死回生、大落大起，这个世界企业经营史上的经典案例，能够给予我们什么启示呢?</p><p>企业由于更换了领导者而重整旗鼓，甚至出现V字形反转的例子时有所闻。新的领导者或者以强有力的手腕扫除积弊;或者开发了划时代的新技术或新产品;或者创造了崭新的市场运作模式;或者在经营战略上屡出高招。不用说，这样的领导者都是行业内的尖子，具备出众的才华、充沛的精力以及燃烧的斗魂，其中有的人甚至堪称天才，比如美国苹果公司的乔布斯。</p><p>然而，稻盛拯救日航却是别开生面。</p><p>78岁高龄，十足的外行，零薪酬出任会长，这三条首先就闻所未闻。</p><p>接着宣布出任日航会长的三条大义:为了保住留任的32000名日航员工的饭碗;为了给低迷的日本经济的重振助上一臂之力;为了保持航空业的竞争态势，让日本国民有选择航空公司的权利。这也是闻所未闻的。</p><p>稻盛先生来到日航就明确揭示新生日航的经营理念或企业目的，那就是“追求全体员工物质和精神两方面的幸福”。在这基础之上，“为旅客提供最好的服务;提高企业自身价值，为社会的进步和发展做出贡献。”这又是闻所未闻的。</p><p>稻盛先生给日航干部上课，首先讲领导者应有的资质，要求大家以“作为人，何谓正确?”作为判断和行动的基准，要求干部成为受到部下信任和尊敬的人。接着讲解“经营十二条”的原理原则。这还是闻所未闻的。</p><p>稻盛先生领导编制《日航哲学》四十条，用哲学来改变员工的意识;用阿米巴来改变日航的官僚型组织。这些都是闻所未闻的。</p><p>而且这个过程几乎“一气呵成”。巨型企业日航不仅因此迅速恢复生机，并且成了可持续发展的高收益体质的企业。</p><p>这样的结果出乎所有人的意料，不仅企业经营者，整个社会都不能不刮目相看。</p><p>稻盛哲学都是理所当然的“大白话”，分部门核算的阿米巴模式也不复杂。换言之，稻盛的成功模式可以复制，它不分行业，不分国界，不分时代，也不需要领导者拥有特殊的天赋。就是说，稻盛哲学具备普遍性，这一点极其重要。</p><p>事实上，包括中国在内，全世界正在认真学习和实践稻盛哲学的“盛和塾”的企业家人数已经超过9000人。这是人类企业经营历史上独一无二的现象。而且在这9000多家企业中，有不少企业已经在某种程度上成功地复制了稻盛的模式。不过成功的条件是:领导者需要有“利他之心”，需要以身作则，全身心地投入事业。</p><p><strong>领导者率先垂范</strong></p><p>2013年3月末，稻盛先生谢绝日航的挽留，急流勇退，正式从日航引退，并笑称这是“好汉的美学”。</p><p>当年5月，我有幸应稻盛先生的邀请，同100多位盛和塾塾生一起，跟随稻盛先生赴巴西，参加“巴西盛和塾”成立二十周年的“塾长例会”。5月9日在巴西，同稻盛先生一起用早餐时，我向稻盛先生提出了一个问题:</p><p>“现在日航重建成功了。但成功的原因众说纷纭，有人认为是稻盛先生个人的魅力;有人认为是稻盛哲学发挥了作用;有人认为分部门核算的阿米巴体制特别重要;当然也有人认为外部原因，即国家的优惠政策最重要。就内部来说，企业盛衰最主要的原因究竟是领导者的威望，还是指导思想，抑或是体制结构?这三者中哪项最重要?</p><p>领导者、哲学、体制三者当然密不可分，但三者中哪个最重要?不限于一个企业，对国家而言，这也是一个争论不休的问题。</p><p>稻盛先生的回答稍稍出乎我的意料。他说:“主要是我让日航的干部员工们感动了。我已经80岁高龄了，身为航空业的外行，不取一分报酬，没有私利，原来与日航也没有任何瓜葛，冒着‘晚节不保’的风险，鞭策这把老骨头，全身全灵地投入日航的重建。看到像他们的父亲、爷爷一样年龄的人，为了他们的幸福拼命工作的样子，日航的员工们感动了，他们觉得‘自己不更加努力可不行啊!’由于日航全体员工团结奋斗，不断改革改进，日航重建才获得了成功。”</p><p>就是说，领导者率先垂范，他创造和倡导的经营哲学和管理模式方才大显身手。</p><p>稻盛哲学成功拯救日航，这一事件中隐含着重大的意义。</p><p>首先，稻盛进入日航后并没有传授什么“科学”的管理方法，日航更没有条件引进任何先进的技术设施、设备。</p><p>当时，日本舆论普遍认为，日航不仅巨额负债23000亿日元，而且日航“比衙门还要衙门”，内部四分五裂，工会有八个之多。日航已经病入膏肓，在这个官僚和工会交织的企业里，没有稻盛的用武之地，没有所谓稻盛哲学发挥作用的前提。派一个78岁的老人，又是外行去重建日航，简直是乱弹琴，是“领导者选错了”“日航二次破产必至”!</p><p>日本的社会精英们连篇累牍，但他们列举大量事实所做的“科学的分析”，被现实击得粉碎。为什么?因为他们只懂所谓的“科学”，而不懂哲学是什么。</p><p>还在十多年前，在《稻盛和夫的哲学》一书“关于科学”一章中，稻盛先生就指出:“现代社会，只重视科学，只习惯于用科学去解释事物。‘为了人类变得更好，为了创建更理想的社会，我们应该具备怎样的思维方式，应该建立什么样的哲学规范’，这么重大的问题却无人问津。把是否符合科学作为第一原则，仅仅局限在这一框架内思考问题，事实上是行不通的。”</p><p>稻盛先生认为，所谓“科学”，实际上，不过是针对物质文明而言的“科学”，而精神科学，即对于意识和心的研究，还远远不够。“科学甚至不能解释麻醉的机理”“所谓发明、发现，只有在被证实以后才成为科学，在这以前，它属于哲学的范畴”“即使已被科学证明的真理，随着科学的发展也可能被否定。因此所谓科学，不过是‘现阶段所认知的范围内的事实’。它既不可能正确地解释一切事物，也不代表唯一的真实。”</p><p>这个世界并不是“科学”二字所能概括的，所谓“科学万能”，所谓“科学至上主义”，并不正确。原子弹也是科学，科学技术是一把锋利的双刃剑，同资本主义的市场经济一样，如果运用不当，如果没有明确的“哲学规范”或者正确的“道德规范”作为前提，它可能让整个人类陷入万劫不复的境地。</p><p>而稻盛和夫的哲学就是这样的“规范”，稻盛先生就是实践这种规范的榜样。从这个意义上讲，稻盛先生代表了人类的良知和睿智。</p><p>领悟哲学:</p><p>如果我们细读《稻盛和夫的哲学》一书，我们不但能够理解在日航发生的奇迹，而且可能会领悟到，稻盛哲学，从小处说是拯救日航的哲学;从大处说，它其实就是“拯救人类的哲学”。</p><p>在这本书中，稻盛先生对存在，对意识和意识体，对宇宙，对造物主，对科学，对欲望，对自由，对善恶，对因果，对宗教，对死亡等等人生、社会和宇宙的重大命题，从哲学、科学、宗教三个角度交叉分析，精彩纷呈，耐人寻味。</p><p>2013年2月26日，稻盛先生在同我们开完盛和塾北京公司的董事会会议后，招待我们用晚餐。席间，我向稻盛先生请教这么一个问题:</p><p>“对人类社会、对推动人类文明发展，影响最大的是科学、哲学和宗教。稻盛先生是科学家出身;又基于科学实验发明的新材料、新产品创办了企业，成了著名的企业家;同时稻盛先生又是哲学家;还对宗教有很深的研究，65岁后皈依了佛门。在你看来，科学、哲学和宗教这三者之间是什么关系?</p><p>稻盛先生的回答一针见血，他说:</p>'
